function Toast({msg,type,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,2800);return()=>clearTimeout(t);});
  return <div className={`toast ${type==='err'?'err':''}`}>{type==='err'?'⚠ ':'✓ '}{msg}</div>;
}

/* Auto-advancing hero slider preview */
function SliderPreview({slides}){
  const [idx,setIdx]=useState(0);
  const timerRef=useRef(null);
  const s=slides||[];
  const cur=s[idx]||{title:'Add your first slide',subtitle:'Upload a banner image and set a headline',badge:'New'};

  useEffect(()=>{
    if(s.length<=1)return;
    timerRef.current=setInterval(()=>setIdx(i=>(i+1)%s.length),4200);
    return()=>clearInterval(timerRef.current);
  },[s.length]);

  const goTo=i=>{setIdx(i);clearInterval(timerRef.current);timerRef.current=setInterval(()=>setIdx(j=>(j+1)%s.length),4200);};
  const prev=()=>goTo((idx-1+s.length)%s.length);
  const next=()=>goTo((idx+1)%s.length);

  return(
    <div className="slider-wrap">
      <div className="slide-inner" style={{transform:`translateX(-${idx*100}%)`}}>
        {(s.length>0?s:[{title:'Hero Slider Preview',subtitle:'Add slides below to see them here'}]).map((sl,i)=>(
          <div key={i} className="slide">
            {sl.imageUrl&&<img src={sl.imageUrl} alt={sl.title} onError={e=>e.target.style.display='none'}/>}
            {!sl.imageUrl&&<div style={{position:'absolute',inset:0,background:'linear-gradient(135deg,#0C1220 0%,#1E3050 100%)'}}/>}
            <div className="slide-overlay">
              {sl.badge&&<div className="slide-badge">{sl.badge}</div>}
              <div className="slide-title">{sl.title||'Slide Title'}</div>
              {sl.subtitle&&<div className="slide-sub">{sl.subtitle}</div>}
              {sl.ctaLabel&&<div style={{marginTop:14,display:'inline-flex',alignItems:'center',gap:6,background:'#0057FF',color:'#fff',padding:'8px 18px',borderRadius:8,fontSize:12,fontWeight:700,width:'fit-content'}}>{sl.ctaLabel} →</div>}
            </div>
          </div>
        ))}
      </div>
      {s.length>1&&(
        <>
          <button className="slide-arrow prev" onClick={prev}>‹</button>
          <button className="slide-arrow next" onClick={next}>›</button>
          <div className="slide-nav">
            {s.map((_,i)=><button key={i} className={`slide-dot ${i===idx?'active':''}`} onClick={()=>goTo(i)}/>)}
          </div>
        </>
      )}
    </div>
  );
}

/* ── MAIN APP ── */
function App(){
  const [user,setUser]=useState(null);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [activeSection,setActiveSection]=useState('hero');
  const [toast,setToast]=useState(null);
  const [unsaved,setUnsaved]=useState(false);
  const [products,setProducts]=useState([]);

  // ── CONFIG STATE ──
  const [heroTitle,setHeroTitle]=useState('What are you looking for?');
  const [heroSubtitle,setHeroSubtitle]=useState('Select a category to browse products and submit a requisition.');

  // Slider slides
  const [slides,setSlides]=useState([
    {title:'Welcome to Our Shop',subtitle:'Browse thousands of products across all categories.',badge:'New',imageUrl:'',ctaLabel:'Shop Now',ctaUrl:''},
  ]);

  // Category images: { "IT EQUIPMENT": "https://...", ... }
  const [categoryImages,setCategoryImages]=useState({});

  // Footer
  const [footerCompany,setFooterCompany]=useState('Operix Procurement');
  const [footerTagline,setFooterTagline]=useState('Your trusted procurement partner. Quality products, efficient ordering.');
  const [footerPhone,setFooterPhone]=useState('');
  const [footerEmail,setFooterEmail]=useState('');
  const [footerSupport,setFooterSupport]=useState('support@operix.com');
  const [footerCopyright,setFooterCopyright]=useState('All rights reserved.');
  const [footerLinks,setFooterLinks]=useState([{label:'About Us',url:'#'},{label:'Privacy Policy',url:'#'},{label:'Terms of Service',url:'#'}]);

  // Promo banners (below hero)
  const [banners,setBanners]=useState([
    {text:'🚚 Free delivery on orders above ₱5,000',color:'#059669'},
    {text:'⚡ Same-day processing for orders before 2PM',color:'#0057FF'},
    {text:'🔒 Secure payment — Bank Transfer, GCash, Cash',color:'#7C3AED'},
  ]);

  // ── DISPLAY SETTINGS ──
  const [showFxRateDetails,setShowFxRateDetails]=useState(true);   // show exchange rate breakdown on cards
  const [showSupplierName,setShowSupplierName]=useState(true);      // show original supplier or company name
  const [displayCompanyName,setDisplayCompanyName]=useState('');    // fallback company name when supplier hidden

  // ── LEAD TIME SETTINGS ──
  const [leadTimeMode,setLeadTimeMode]=useState('Calendar Days');   // 'Calendar Days' | 'Working Days'

  const markUnsaved=()=>setUnsaved(true);

  useEffect(()=>{
    if(!window.firebase){setTimeout(()=>window.location.reload(),600);return;}
    if(!firebase.apps.length) firebase.initializeApp(FB);
    const db=firebase.firestore();
    firebase.auth().onAuthStateChanged(async u=>{
      if(!u){window.location.href='login.html';return;}
      const doc=await db.collection('users').doc(u.uid).get();
      if(!doc.exists||doc.data().role!=='admin'){window.location.href='shop.html';return;}
      const ud=doc.data();
      setUser({uid:u.uid,...ud});

      const companyName=ud.companyName||'';

      // ── Load ALL products from the same company for category list ──────────
      let allProducts=[];
      if(companyName){
        try{
          // Get all admin UIDs in this company
          const admSnap=await db.collection('users')
            .where('role','==','admin')
            .where('companyName','==',companyName)
            .get();
          const adminUids=admSnap.docs.map(d=>d.id);
          if(!adminUids.includes(u.uid)) adminUids.push(u.uid);
          // Fetch products for all company admins (batch by 30)
          for(let i=0;i<adminUids.length;i+=30){
            const chunk=adminUids.slice(i,i+30);
            const pSnap=await db.collection('products').where('createdBy','in',chunk).get();
            pSnap.docs.forEach(d=>allProducts.push({id:d.id,...d.data()}));
          }
        }catch(e){
          console.warn('Company products load failed, falling back to own:',e);
          const pSnap=await db.collection('products').where('createdBy','==',u.uid).get();
          allProducts=pSnap.docs.map(d=>({id:d.id,...d.data()}));
        }
      } else {
        // No companyName — fall back to own products only
        const pSnap=await db.collection('products').where('createdBy','==',u.uid).get();
        allProducts=pSnap.docs.map(d=>({id:d.id,...d.data()}));
      }
      setProducts(allProducts);

      // ── Load shopConfig — shared at company level ─────────────────────────
      // Key: use companyName as the doc ID so all admins in the same company
      // read and write the same config. Fall back to own UID for legacy data.
      const configDocId=companyName||u.uid;
      const sc=await db.collection('shopConfig').doc(configDocId).get();
      if(sc.exists){
        const d=sc.data();
        if(d.heroTitle) setHeroTitle(d.heroTitle);
        if(d.heroSubtitle) setHeroSubtitle(d.heroSubtitle);
        if(d.slides&&d.slides.length) setSlides(d.slides);
        if(d.categoryImages) setCategoryImages(d.categoryImages);
        if(d.banners&&d.banners.length) setBanners(d.banners);
        if(d.footer){
          const f=d.footer;
          if(f.companyName) setFooterCompany(f.companyName);
          if(f.tagline) setFooterTagline(f.tagline);
          if(f.phone!==undefined) setFooterPhone(f.phone);
          if(f.email!==undefined) setFooterEmail(f.email);
          if(f.supportEmail) setFooterSupport(f.supportEmail);
          if(f.copyright) setFooterCopyright(f.copyright);
          if(f.footerLinks) setFooterLinks(f.footerLinks);
        }
        if(d.displaySettings){
          const ds=d.displaySettings;
          if(ds.showFxRateDetails!==undefined) setShowFxRateDetails(ds.showFxRateDetails);
          if(ds.showSupplierName!==undefined) setShowSupplierName(ds.showSupplierName);
          if(ds.displayCompanyName!==undefined) setDisplayCompanyName(ds.displayCompanyName);
        }
        if(d.leadTimeSettings){
          const lt=d.leadTimeSettings;
          if(lt.leadTimeMode) setLeadTimeMode(lt.leadTimeMode);
        }
      } else if(companyName){
        // Try legacy per-uid doc as fallback (migrate existing data)
        const legacySc=await db.collection('shopConfig').doc(u.uid).get();
        if(legacySc.exists){
          const d=legacySc.data();
          if(d.heroTitle) setHeroTitle(d.heroTitle);
          if(d.heroSubtitle) setHeroSubtitle(d.heroSubtitle);
          if(d.slides&&d.slides.length) setSlides(d.slides);
          if(d.categoryImages) setCategoryImages(d.categoryImages);
          if(d.banners&&d.banners.length) setBanners(d.banners);
          if(d.footer){
            const f=d.footer;
            if(f.companyName) setFooterCompany(f.companyName);
            if(f.tagline) setFooterTagline(f.tagline);
            if(f.phone!==undefined) setFooterPhone(f.phone);
            if(f.email!==undefined) setFooterEmail(f.email);
            if(f.supportEmail) setFooterSupport(f.supportEmail);
            if(f.copyright) setFooterCopyright(f.copyright);
            if(f.footerLinks) setFooterLinks(f.footerLinks);
          }
          if(d.displaySettings){
            const ds=d.displaySettings;
            if(ds.showFxRateDetails!==undefined) setShowFxRateDetails(ds.showFxRateDetails);
            if(ds.showSupplierName!==undefined) setShowSupplierName(ds.showSupplierName);
            if(ds.displayCompanyName!==undefined) setDisplayCompanyName(ds.displayCompanyName);
          }
          if(d.leadTimeSettings){
            const lt=d.leadTimeSettings;
            if(lt.leadTimeMode) setLeadTimeMode(lt.leadTimeMode);
          }
        }
      }
      setLoading(false);
    });
  },[]);

  // Derived: unique category names
  const categories=useMemo(()=>{
    const cats=new Set();
    products.forEach(p=>{
      if(p.category){const i=p.category.indexOf('.');cats.add(i===-1?p.category.trim():p.category.slice(0,i).trim());}
    });
    return Array.from(cats).sort();
  },[products]);

  const save=async()=>{
    if(!user)return;
    setSaving(true);
    try{
      const db=firebase.firestore();
      const config={
        heroTitle,heroSubtitle,
        slides:slides.map(s=>({...s})),
        categoryImages:{...categoryImages},
        banners:banners.map(b=>({...b})),
        footer:{companyName:footerCompany,tagline:footerTagline,phone:footerPhone,email:footerEmail,supportEmail:footerSupport,copyright:footerCopyright,footerLinks:[...footerLinks]},
        displaySettings:{showFxRateDetails,showSupplierName,displayCompanyName:displayCompanyName.trim()},
        leadTimeSettings:{leadTimeMode},
        updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
        updatedBy:user.uid,
        updatedByName:user.fullName||user.email||'',
        companyName:user.companyName||'',
      };
      // Save to company-level doc so all admins in the same company share the config
      const configDocId=user.companyName||user.uid;
      await db.collection('shopConfig').doc(configDocId).set(config,{merge:true});
      setToast({msg:'Shop config saved!',type:'ok'});
      setUnsaved(false);
    }catch(e){console.error(e);setToast({msg:'Save failed: '+e.message,type:'err'});}
    setSaving(false);
  };

  /* ── SLIDE HELPERS ── */
  const addSlide=()=>{setSlides(s=>[...s,{title:'',subtitle:'',badge:'',imageUrl:'',ctaLabel:'',ctaUrl:''}]);markUnsaved();};
  const removeSlide=i=>{setSlides(s=>s.filter((_,j)=>j!==i));markUnsaved();};
  const updateSlide=(i,k,v)=>{setSlides(s=>s.map((sl,j)=>j===i?{...sl,[k]:v}:sl));markUnsaved();};
  const moveSlide=(from,to)=>{if(to<0||to>=slides.length)return;const arr=[...slides];const[el]=arr.splice(from,1);arr.splice(to,0,el);setSlides(arr);markUnsaved();};

  /* ── BANNER HELPERS ── */
  const addBanner=()=>{setBanners(b=>[...b,{text:'',color:'#0057FF',imageUrl:''}]);markUnsaved();};
  const removeBanner=i=>{setBanners(b=>b.filter((_,j)=>j!==i));markUnsaved();};
  const updateBanner=(i,k,v)=>{setBanners(b=>b.map((bn,j)=>j===i?{...bn,[k]:v}:bn));markUnsaved();};

  /* ── FOOTER LINK HELPERS ── */
  const addLink=()=>{setFooterLinks(l=>[...l,{label:'',url:''}]);markUnsaved();};
  const removeLink=i=>{setFooterLinks(l=>l.filter((_,j)=>j!==i));markUnsaved();};
  const updateLink=(i,k,v)=>{setFooterLinks(l=>l.map((lk,j)=>j===i?{...lk,[k]:v}:lk));markUnsaved();};

  const BANNER_COLORS=['#059669','#0057FF','#7C3AED','#D97706','#E11D48','#0284C7','#0D9488','#C2410C'];

  if(loading)return(<div className="loader"><Logo/><div className="loader-spin"/><p style={{fontSize:13,color:'#64748B'}}>Loading Shop Editor…</p></div>);

  const sections=[
    {id:'display',  label:'Display Settings',    icon:P.gear},
    {id:'hero',    label:'Hero & Headline',    icon:P.type},
    {id:'slider',  label:'Hero Slider',         icon:P.img},
    {id:'banners', label:'Promo Banners',       icon:P.tag},
    {id:'categories',label:'Category Images',  icon:P.layout},
    {id:'leadtime',  label:'Lead Time Control', icon:P.clock},
    {id:'quotation',label:'Quotation Layout',  icon:P.type},
    {id:'footer',  label:'Footer',              icon:P.footer},
  ];

  return(
    <>
      {/* TOPBAR */}
      <header className="tb">
        <div className="tb-brand">
          <Logo/>
          <div><b>Shop Editor</b><small>⚙ Admin Only</small></div>
        </div>
        <div className="tb-r">
          <a href="shop.html" className="tb-link"><Ic d={P.eye} s={13}/> Preview Shop</a>
          <a href="Dashboard.html" className="tb-link"><Ic d={P.back} s={13}/> Dashboard</a>
          <button className="save-btn" onClick={save} disabled={saving}>
            {saving
              ? <><div style={{width:13,height:13,border:'2px solid rgba(255,255,255,.3)',borderTopColor:'#fff',borderRadius:'50%',animation:'spin .7s linear infinite'}}/>Saving…</>
              : <><Ic d={P.check} s={14}/>Save Changes{unsaved&&<span className="unsaved-dot"/>}</>
            }
          </button>
        </div>
      </header>

      <div className="layout">
        {/* SIDE NAV */}
        <nav className="side-nav">
          <div className="side-nav-section">Shop Sections</div>
          {sections.map(s=>(
            <div key={s.id} className={`nav-item ${activeSection===s.id?'active':''}`} onClick={()=>setActiveSection(s.id)}>
              <span className="nav-item-icon"><Ic d={s.icon} s={15} c={activeSection===s.id?'var(--blue)':'var(--slate)'}/></span>
              {s.label}
            </div>
          ))}
          <div className="side-nav-section" style={{marginTop:24}}>Quick Links</div>
          <div className="nav-item" onClick={()=>window.open('shop.html','_blank')}>
            <span className="nav-item-icon"><Ic d={P.eye} s={15} c="var(--slate)"/></span>
            Open Live Shop
          </div>
          <div className="nav-item" onClick={()=>window.location.href='Dashboard.html'}>
            <span className="nav-item-icon"><Ic d={P.back} s={15} c="var(--slate)"/></span>
            Dashboard
          </div>
        </nav>

        {/* MAIN CONTENT */}
        <div className="main-area">

          {/* Preview banner */}
          <div className="preview-banner">
            <div>
              <strong style={{fontSize:13}}>Live Shop Editor</strong>
              <p>Changes are saved to Firestore and immediately reflected on <strong>shop.html</strong> when users reload. Click <strong>Save Changes</strong> to publish.</p>
            </div>
            <a href="shop.html" target="_blank" style={{display:'flex',alignItems:'center',gap:7,background:'rgba(255,255,255,.08)',color:'#CBD5E1',border:'1px solid rgba(255,255,255,.15)',borderRadius:9,padding:'8px 16px',fontSize:12,fontWeight:700,textDecoration:'none',whiteSpace:'nowrap',transition:'all .18s'}}
              onMouseOver={e=>{e.currentTarget.style.background='rgba(255,255,255,.14)'}}
              onMouseOut={e=>{e.currentTarget.style.background='rgba(255,255,255,.08)'}}>
              <Ic d={P.eye} s={13}/>Preview Shop
            </a>
          </div>

          {/* ══ DISPLAY SETTINGS ══ */}
          {activeSection==='display'&&(
            <>
              <div className="page-hd">
                <h2>Display Settings</h2>
                <p>Control what information is shown to buyers on product cards and throughout the shop.</p>
              </div>

              {/* ── Exchange Rate Display ── */}
              <div className="sec-card" style={{marginBottom:20}}>
                <div className="sec-card-hd">
                  <div className="sec-card-hd-left">
                    <div style={{width:36,height:36,background:'#EFF6FF',border:'1.5px solid #BFDBFE',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                      <svg width="18" height="18" fill="none" stroke="#1D4ED8" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                    </div>
                    <div>
                      <div className="sec-card-title">Exchange Rate Details</div>
                      <div className="sec-card-sub">Controls the rate breakdown shown on foreign-currency product cards</div>
                    </div>
                  </div>
                </div>
                <div className="sec-card-body">
                  <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:24}}>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:700,color:'var(--ink)',marginBottom:6}}>Show exchange rate breakdown on product cards</div>
                      <div style={{fontSize:12,color:'var(--slate)',lineHeight:1.6,marginBottom:16}}>
                        When <strong>ON</strong>, foreign-currency items show the original price and rate details below the converted PHP price — e.g. <span style={{fontFamily:'DM Mono,monospace',fontSize:11,background:'var(--surf)',padding:'1px 6px',borderRadius:4}}>$21.00 USD · rate ₱56.25</span><br/>
                        When <strong>OFF</strong>, only the converted PHP price is shown — e.g. <span style={{fontFamily:'DM Mono,monospace',fontSize:11,background:'var(--surf)',padding:'1px 6px',borderRadius:4}}>₱1,181.25</span> with no rate details.
                      </div>
                      {/* Toggle */}
                      <div style={{display:'flex',alignItems:'center',gap:14}}>
                        <button
                          onClick={()=>{setShowFxRateDetails(v=>!v);markUnsaved();}}
                          style={{
                            position:'relative',width:52,height:28,borderRadius:99,border:'none',cursor:'pointer',
                            background:showFxRateDetails?'var(--blue)':'#CBD5E1',
                            transition:'background .2s',flexShrink:0,padding:0
                          }}>
                          <span style={{
                            position:'absolute',top:3,left:showFxRateDetails?26:3,
                            width:22,height:22,borderRadius:'50%',background:'#fff',
                            transition:'left .2s',boxShadow:'0 1px 4px rgba(0,0,0,.18)',display:'block'
                          }}/>
                        </button>
                        <span style={{fontSize:13,fontWeight:700,color:showFxRateDetails?'var(--blue)':'var(--slate)'}}>
                          {showFxRateDetails?'Show rate details':'Hide rate details'}
                        </span>
                      </div>
                    </div>
                    {/* Live preview */}
                    <div style={{flexShrink:0,width:200,background:'var(--surf)',border:'1.5px solid var(--line)',borderRadius:12,padding:14,display:'flex',flexDirection:'column',gap:6}}>
                      <div style={{fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--slate)',marginBottom:4}}>Preview</div>
                      <div style={{fontSize:16,fontWeight:800,color:'var(--ink)'}}>₱1,181.25</div>
                      {showFxRateDetails&&(
                        <div style={{fontSize:10,color:'var(--slate)',fontWeight:500}}>$21.00 USD · rate ₱56.25</div>
                      )}
                      <div style={{fontSize:11,color:'var(--slate)'}}>per PC</div>
                      {showFxRateDetails&&(
                        <div style={{marginTop:6,padding:'5px 8px',background:'#EFF6FF',border:'1px solid #BFDBFE',borderRadius:6,display:'flex',alignItems:'center',gap:5}}>
                          <svg width="10" height="10" fill="none" stroke="#1D4ED8" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                          <span style={{fontSize:10,color:'#1E40AF',fontWeight:600}}>1 USD = ₱56.25</span>
                        </div>
                      )}
                    </div>
                  </div>
                  {/* Also controls the top banner */}
                  <div style={{marginTop:16,padding:'10px 14px',background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:8,display:'flex',alignItems:'flex-start',gap:8}}>
                    <svg width="14" height="14" fill="none" stroke="#D97706" strokeWidth="2" viewBox="0 0 24 24" style={{flexShrink:0,marginTop:1}}><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span style={{fontSize:11,color:'#92400E',lineHeight:1.55}}>
                      This also controls the <strong>"All prices shown in PHP · 1 USD = ₱56.25"</strong> banner at the top of the shop. Turning it off hides both the banner and the per-card rate details.
                    </span>
                  </div>
                </div>
              </div>

              {/* ── Supplier Display ── */}
              <div className="sec-card">
                <div className="sec-card-hd">
                  <div className="sec-card-hd-left">
                    <div style={{width:36,height:36,background:'#ECFDF5',border:'1.5px solid #A7F3D0',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                      <svg width="18" height="18" fill="none" stroke="#059669" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                    </div>
                    <div>
                      <div className="sec-card-title">Supplier Name Display</div>
                      <div className="sec-card-sub">Controls which supplier name is shown on product detail cards</div>
                    </div>
                  </div>
                </div>
                <div className="sec-card-body">
                  <div style={{display:'flex',alignItems:'flex-start',gap:14,marginBottom:16}}>
                    <button
                      onClick={()=>{setShowSupplierName(v=>!v);markUnsaved();}}
                      style={{
                        position:'relative',width:52,height:28,borderRadius:99,border:'none',cursor:'pointer',
                        background:showSupplierName?'var(--blue)':'#CBD5E1',
                        transition:'background .2s',flexShrink:0,padding:0,marginTop:2
                      }}>
                      <span style={{
                        position:'absolute',top:3,left:showSupplierName?26:3,
                        width:22,height:22,borderRadius:'50%',background:'#fff',
                        transition:'left .2s',boxShadow:'0 1px 4px rgba(0,0,0,.18)',display:'block'
                      }}/>
                    </button>
                    <div>
                      <div style={{fontSize:13,fontWeight:700,color:'var(--ink)',marginBottom:4}}>Show original source supplier</div>
                      <div style={{fontSize:12,color:'var(--slate)',lineHeight:1.6}}>
                        When <strong>ON</strong>, each product card displays the supplier name exactly as entered in your inventory.<br/>
                        When <strong>OFF</strong>, the supplier field is replaced by the <strong>Company Name</strong> you set below — giving your shop a white-label look.
                      </div>
                    </div>
                  </div>

                  {/* Company name fallback */}
                  <div style={{background:showSupplierName?'var(--surf)':'var(--white)',border:`1.5px solid ${showSupplierName?'var(--line)':'var(--blue)'}`,borderRadius:12,padding:16,transition:'all .2s'}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
                      <div style={{width:6,height:6,borderRadius:'50%',background:showSupplierName?'#CBD5E1':'var(--blue)',flexShrink:0}}/>
                      <span style={{fontSize:11,fontWeight:800,textTransform:'uppercase',letterSpacing:'.07em',color:showSupplierName?'var(--slate)':'var(--blue)'}}>
                        {showSupplierName?'Fallback Company Name (inactive)':'Display Company Name (active)'}
                      </span>
                    </div>
                    <div className="field" style={{marginBottom:0}}>
                      <label className="fl">Company Name shown on all product cards</label>
                      <input
                        className="fi"
                        value={displayCompanyName}
                        onChange={e=>{setDisplayCompanyName(e.target.value);markUnsaved();}}
                        placeholder={user?.companyName||'e.g. Operix Supply Co.'}
                        disabled={showSupplierName}
                        style={{opacity:showSupplierName?.5:1,transition:'opacity .2s'}}
                      />
                      <div className="fi-hint">
                        {showSupplierName
                          ? 'This value is ignored while "Show original source supplier" is ON. Turn it OFF to activate.'
                          : 'This name replaces the supplier on every product card visible to buyers.'
                        }
                      </div>
                    </div>
                  </div>

                  {/* Side-by-side comparison */}
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginTop:16}}>
                    <div style={{background:'var(--surf)',border:'1.5px solid var(--line)',borderRadius:10,padding:12}}>
                      <div style={{fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:'.07em',color:'var(--slate)',marginBottom:8}}>When ON — source supplier</div>
                      <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.05em',color:'var(--slate)',marginBottom:2}}>Supplier</div>
                      <div style={{fontSize:12,fontWeight:700,color:'var(--ink)'}}>Acme Industrial Co.</div>
                    </div>
                    <div style={{background:showSupplierName?'var(--surf)':'var(--blue-bg)',border:`1.5px solid ${showSupplierName?'var(--line)':'#BFDBFE'}`,borderRadius:10,padding:12,transition:'all .2s'}}>
                      <div style={{fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:'.07em',color:showSupplierName?'var(--slate)':'var(--blue)',marginBottom:8}}>When OFF — company name</div>
                      <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.05em',color:'var(--slate)',marginBottom:2}}>Supplier</div>
                      <div style={{fontSize:12,fontWeight:700,color:'var(--ink)'}}>{displayCompanyName||user?.companyName||'Your Company Name'}</div>
                    </div>
                  </div>
                </div>
              </div>
            </>
          )}

          {/* ══ HERO & HEADLINE ══ */}
          {activeSection==='hero'&&(
            <>
              <div className="page-hd">
                <h2>Hero & Headline</h2>
                <p>Edit the main welcome text shown at the top of the landing page.</p>
              </div>
              <div className="sec-card">
                <div className="sec-card-hd">
                  <div className="sec-card-hd-left">
                    <Ic d={P.type} s={16} c="var(--blue)"/>
                    <div><div className="sec-card-title">Landing Page Text</div></div>
                  </div>
                </div>
                <div className="sec-card-body">
                  <div className="field">
                    <label className="fl">Main Headline</label>
                    <input className="fi" value={heroTitle} onChange={e=>{setHeroTitle(e.target.value);markUnsaved();}} placeholder="What are you looking for?"/>
                    <div className="fi-hint">The large title shown above the category grid.</div>
                  </div>
                  <div className="field">
                    <label className="fl">Subtitle</label>
                    <input className="fi" value={heroSubtitle} onChange={e=>{setHeroSubtitle(e.target.value);markUnsaved();}} placeholder="Select a category to browse products…"/>
                    <div className="fi-hint">A short description shown below the headline.</div>
                  </div>
                  {/* Live preview of headline */}
                  <div style={{marginTop:18,background:'var(--surf)',border:'1.5px solid var(--line)',borderRadius:12,padding:'20px 24px'}}>
                    <div style={{fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--slate)',marginBottom:12}}>Preview</div>
                    <div style={{fontSize:22,fontWeight:800,color:'var(--ink)',letterSpacing:'-.4px',marginBottom:5}}>{heroTitle||'…'}</div>
                    <div style={{fontSize:13,color:'var(--slate)'}}>{heroSubtitle||'…'}</div>
                  </div>
                </div>
              </div>
            </>
          )}

          {/* ══ HERO SLIDER ══ */}
          {activeSection==='slider'&&(
            <>
              <div className="page-hd">
                <h2>Hero Slider</h2>
                <p>Add rotating banner slides with images, headlines, and call-to-action buttons. Slides auto-advance every 4 seconds.</p>
              </div>

              {/* Live preview */}
              <div className="sec-card">
                <div className="sec-card-hd">
                  <div className="sec-card-hd-left"><Ic d={P.eye} s={16} c="var(--blue)"/><div><div className="sec-card-title">Live Preview</div></div></div>
                </div>
                <div className="sec-card-body">
                  <SliderPreview slides={slides}/>
                  <div className="fi-hint" style={{marginTop:6}}>This is how the slider looks on your shop. It auto-advances every 4 seconds.</div>
                </div>
              </div>

              {/* Slide editor */}
              <div className="sec-card">
                <div className="sec-card-hd">
                  <div className="sec-card-hd-left"><Ic d={P.img} s={16} c="var(--blue)"/><div><div className="sec-card-title">Manage Slides ({slides.length})</div></div></div>
                </div>
                <div className="sec-card-body">
                  <div className="slide-editor-list">
                    {slides.map((sl,i)=>(
                      <div key={i} className="slide-editor-item">
                        <div className="slide-row">
                          <span className="slide-num">{i+1}</span>
                          {sl.imageUrl
                            ? <img src={sl.imageUrl} alt="" className="slide-thumb" onError={e=>e.target.style.display='none'}/>
                            : <div className="slide-thumb-ph"><Ic d={P.img} s={16} c="var(--slate)"/></div>
                          }
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontSize:13,fontWeight:700,color:'var(--ink)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{sl.title||'(untitled slide)'}</div>
                            <div style={{fontSize:11,color:'var(--slate)'}}>{sl.subtitle?sl.subtitle.slice(0,50)+'…':'No subtitle'}</div>
                          </div>
                          <div style={{display:'flex',gap:4,flexShrink:0}}>
                            <button onClick={()=>moveSlide(i,i-1)} disabled={i===0} title="Move up" style={{width:26,height:26,background:'var(--surf)',border:'1.5px solid var(--line)',borderRadius:6,cursor:i===0?'not-allowed':'pointer',opacity:i===0?.3:1,display:'flex',alignItems:'center',justifyContent:'center'}}>↑</button>
                            <button onClick={()=>moveSlide(i,i+1)} disabled={i===slides.length-1} title="Move down" style={{width:26,height:26,background:'var(--surf)',border:'1.5px solid var(--line)',borderRadius:6,cursor:i===slides.length-1?'not-allowed':'pointer',opacity:i===slides.length-1?.3:1,display:'flex',alignItems:'center',justifyContent:'center'}}>↓</button>
                            <button onClick={()=>removeSlide(i)} title="Remove" style={{width:26,height:26,background:'var(--red-bg)',border:'1px solid #FECACA',borderRadius:6,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--red)'}}><Ic d={P.x} s={11}/></button>
                          </div>
                        </div>
                        <div className="fg2">
                          <div className="field">
                            <label className="fl">Slide Title *</label>
                            <input className="fi" value={sl.title} onChange={e=>updateSlide(i,'title',e.target.value)} placeholder="e.g. Office Supplies Sale"/>
                          </div>
                          <div className="field">
                            <label className="fl">Badge Label</label>
                            <input className="fi" value={sl.badge||''} onChange={e=>updateSlide(i,'badge',e.target.value)} placeholder="e.g. New · Sale · Featured"/>
                          </div>
                        </div>
                        <div className="field">
                          <label className="fl">Subtitle / Description</label>
                          <input className="fi" value={sl.subtitle||''} onChange={e=>updateSlide(i,'subtitle',e.target.value)} placeholder="Short description under the title"/>
                        </div>
                        <div className="field">
                          <label className="fl">Background Image URL</label>
                          <input className="fi" value={sl.imageUrl||''} onChange={e=>updateSlide(i,'imageUrl',e.target.value)} placeholder="https://example.com/banner.jpg"/>
                          <div className="fi-hint">Paste a direct link to an image (JPEG/PNG/WebP). Use any image hosting — Imgur, Cloudinary, Firebase Storage, etc.</div>
                        </div>
                        <div className="fg2">
                          <div className="field" style={{marginBottom:0}}>
                            <label className="fl">CTA Button Label</label>
                            <input className="fi" value={sl.ctaLabel||''} onChange={e=>updateSlide(i,'ctaLabel',e.target.value)} placeholder="e.g. Shop Now"/>
                          </div>
                          <div className="field" style={{marginBottom:0}}>
                            <label className="fl">CTA Button URL</label>
                            <input className="fi" value={sl.ctaUrl||''} onChange={e=>updateSlide(i,'ctaUrl',e.target.value)} placeholder="shop.html or category link"/>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                  <button onClick={addSlide} className="add-link-btn" style={{marginTop:12}}>
                    <Ic d={P.plus} s={13}/>Add New Slide
                  </button>
                </div>
              </div>
            </>
          )}

          {/* ══ PROMO BANNERS ══ */}
          {activeSection==='banners'&&(
            <>
              <div className="page-hd">
                <h2>Promo Banners</h2>
                <p>Short announcement strips shown between the slider and the category grid.</p>
              </div>
              <div className="sec-card">
                <div className="sec-card-hd">
                  <div className="sec-card-hd-left"><Ic d={P.tag} s={16} c="var(--blue)"/><div><div className="sec-card-title">Banners ({banners.length})</div></div></div>
                </div>
                <div className="sec-card-body">
                  {/* Preview */}
                  <div style={{marginBottom:18}}>
                    <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.07em',color:'var(--slate)',marginBottom:8}}>Preview</div>
                    {/* Image banners preview */}
                    {banners.some(b=>b.imageUrl)&&(
                      <div style={{display:'flex',gap:10,flexWrap:'wrap',marginBottom:8}}>
                        {banners.filter(b=>b.imageUrl).map((b,i)=>(
                          <div key={i} style={{position:'relative',borderRadius:10,overflow:'hidden',height:80,minWidth:200,flex:'1',maxWidth:340,background:'#0C1220'}}>
                            <img src={b.imageUrl} alt={b.text||''} style={{width:'100%',height:'100%',objectFit:'cover',opacity:.85,display:'block'}} onError={e=>e.target.style.display='none'}/>
                            {b.text&&<div style={{position:'absolute',bottom:0,left:0,right:0,background:'linear-gradient(transparent,rgba(0,0,0,.65))',padding:'10px 12px',fontSize:11,fontWeight:700,color:'#fff'}}>{b.text}</div>}
                          </div>
                        ))}
                      </div>
                    )}
                    {/* Text chip banners preview */}
                    <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                      {banners.filter(b=>b.text&&!b.imageUrl).map((b,i)=>(
                        <div key={i} style={{display:'inline-flex',alignItems:'center',gap:6,background:b.color+'15',border:`1.5px solid ${b.color}40`,borderRadius:8,padding:'6px 14px',fontSize:12,fontWeight:600,color:b.color}}>
                          {b.text}
                        </div>
                      ))}
                    </div>
                  </div>
                  {banners.map((b,i)=>(
                    <div key={i} style={{display:'flex',gap:10,alignItems:'flex-start',marginBottom:12,background:'var(--surf)',border:'1.5px solid var(--line)',borderRadius:10,padding:'12px 14px'}}>
                      <div style={{flex:1}}>
                        {/* Type toggle */}
                        <div style={{display:'flex',gap:6,marginBottom:10}}>
                          <button onClick={()=>updateBanner(i,'imageUrl','')} style={{flex:1,padding:'5px 10px',borderRadius:7,border:`1.5px solid ${!b.imageUrl?'var(--blue)':'var(--line)'}`,background:!b.imageUrl?'var(--blue-bg)':'#fff',color:!b.imageUrl?'var(--blue)':'var(--slate)',fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:'DM Sans,sans-serif'}}>
                            🏷 Text Chip
                          </button>
                          <button onClick={()=>{if(!b.imageUrl)updateBanner(i,'imageUrl',' ');}} style={{flex:1,padding:'5px 10px',borderRadius:7,border:`1.5px solid ${b.imageUrl?'var(--blue)':'var(--line)'}`,background:b.imageUrl?'var(--blue-bg)':'#fff',color:b.imageUrl?'var(--blue)':'var(--slate)',fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:'DM Sans,sans-serif'}}>
                            🖼 Image Banner
                          </button>
                        </div>
                        {/* Image URL field — only if image mode */}
                        {b.imageUrl!==undefined&&b.imageUrl!==''&&(
                          <div className="field" style={{marginBottom:8}}>
                            <label className="fl">Image URL</label>
                            <input className="fi" value={b.imageUrl.trim()} onChange={e=>updateBanner(i,'imageUrl',e.target.value)} placeholder="https://example.com/promo-banner.jpg"/>
                            <div style={{fontSize:10,color:'var(--slate)',marginTop:3}}>Recommended: 900×160px or wider, landscape ratio</div>
                          </div>
                        )}
                        <div className="field" style={{marginBottom:8}}>
                          <label className="fl">{b.imageUrl?'Caption (optional)':'Banner Text'}</label>
                          <input className="fi" value={b.text} onChange={e=>{updateBanner(i,'text',e.target.value);}} placeholder={b.imageUrl?'Short caption shown on image…':'e.g. 🚚 Free delivery on orders above ₱5,000'}/>
                        </div>
                        {!b.imageUrl&&(
                          <div>
                            <label className="fl">Color</label>
                            <div className="color-row">
                              {BANNER_COLORS.map(c=>(
                                <div key={c} className={`color-swatch ${b.color===c?'sel':''}`} style={{background:c}} onClick={()=>{updateBanner(i,'color',c);}}/>
                              ))}
                              <input type="color" value={b.color||'#0057FF'} onChange={e=>updateBanner(i,'color',e.target.value)} style={{width:28,height:28,border:'2px solid var(--line)',borderRadius:7,cursor:'pointer',padding:1}}/>
                            </div>
                          </div>
                        )}
                      </div>
                      <button onClick={()=>removeBanner(i)} style={{width:30,height:30,background:'var(--red-bg)',border:'1px solid #FECACA',borderRadius:7,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--red)',flexShrink:0,marginTop:18}}>
                        <Ic d={P.x} s={12}/>
                      </button>
                    </div>
                  ))}
                  <button onClick={addBanner} className="add-link-btn"><Ic d={P.plus} s={13}/>Add Banner</button>
                </div>
              </div>
            </>
          )}

          {/* ══ CATEGORY IMAGES ══ */}
          {activeSection==='categories'&&(
            <>
              <div className="page-hd">
                <h2>Category Images</h2>
                <p>Assign a cover image to each category. These appear as banner photos on the category cards — just like RS Components.</p>
              </div>
              {categories.length===0&&(
                <div style={{background:'var(--white)',border:'1.5px solid var(--line)',borderRadius:16,padding:'40px 32px',textAlign:'center'}}>
                  <div style={{fontSize:13,color:'var(--slate)'}}>No product categories found. Add products in Dashboard first.</div>
                </div>
              )}
              <div className="cat-img-grid">
                {categories.map(cat=>{
                  const imgUrl=categoryImages[cat]||'';
                  return(
                    <div key={cat} className="cat-img-card">
                      {imgUrl
                        ? <img src={imgUrl} alt={cat} className="cat-img-preview" onError={e=>e.target.style.display='none'}/>
                        : <div className="cat-img-ph">
                            <svg width="28" height="28" fill="none" stroke="#94A3B8" strokeWidth="1.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d={P.img}/></svg>
                            <span style={{fontSize:10,color:'#94A3B8',fontWeight:600}}>No image</span>
                          </div>
                      }
                      <div className="cat-img-footer">
                        <div className="cat-img-name" title={cat}>{cat}</div>
                        <input className="fi" style={{fontSize:11,padding:'6px 10px'}} value={imgUrl} placeholder="Paste image URL…"
                          onChange={e=>{setCategoryImages(m=>({...m,[cat]:e.target.value}));markUnsaved();}}/>
                        {imgUrl&&<div className="fi-hint" style={{marginTop:4}}>✓ Image URL set</div>}
                      </div>
                    </div>
                  );
                })}
              </div>
              <div style={{background:'var(--blue-bg)',border:'1.5px solid #BFDBFE',borderRadius:12,padding:'14px 18px',marginTop:18,fontSize:12,color:'#1E40AF',lineHeight:1.6}}>
                <strong>💡 Tip:</strong> Use images that are at least 600×300px for best results. You can use direct links from Cloudinary, Firebase Storage, Imgur, or any public image hosting.
              </div>
            </>
          )}

          {/* ══ LEAD TIME CONTROL ══ */}
          {activeSection==='leadtime'&&(()=>{
            const isWorking=leadTimeMode==='Working Days';
            // Live preview: compute example delivery for a 7-day lead time item
            const previewDays=7;
            const today=new Date(); today.setHours(0,0,0,0);
            const previewDate=new Date(today);
            if(isWorking){
              let added=0;
              while(added<previewDays){previewDate.setDate(previewDate.getDate()+1);const dow=previewDate.getDay();if(dow!==0&&dow!==6)added++;}
            } else {
              previewDate.setDate(previewDate.getDate()+previewDays);
            }
            const fmtPreview=d=>{const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;};
            const fmtLong=d=>d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
            const todayStr=fmtPreview(today);
            const resultStr=fmtPreview(previewDate);
            const resultLong=fmtLong(previewDate);
            // Count how many calendar days the working-days preview skips over a weekend
            const calDate=new Date(today); calDate.setDate(calDate.getDate()+previewDays);
            const calStr=fmtPreview(calDate);
            const calLong=fmtLong(calDate);
            return(
              <>
                <div className="page-hd">
                  <h2>Lead Time Control</h2>
                  <p>Set how the system computes the estimated delivery date shown to buyers in the cart — based on each product's lead time.</p>
                </div>

                {/* ── Mode selector card ── */}
                <div className="sec-card" style={{marginBottom:20}}>
                  <div className="sec-card-hd">
                    <div className="sec-card-hd-left">
                      <div style={{width:36,height:36,background:'#EFF6FF',border:'1.5px solid #BFDBFE',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                        <Ic d={P.clock} s={18} c="#1D4ED8"/>
                      </div>
                      <div>
                        <div className="sec-card-title">Delivery Date Computation Mode</div>
                        <div className="sec-card-sub">Controls how lead time days are counted when calculating Est. delivery in the cart</div>
                      </div>
                    </div>
                  </div>
                  <div className="sec-card-body">

                    {/* Mode toggle buttons */}
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:24}}>
                      {/* Calendar Days option */}
                      <button
                        onClick={()=>{setLeadTimeMode('Calendar Days');markUnsaved();}}
                        style={{
                          padding:'20px 20px',borderRadius:14,border:`2px solid ${!isWorking?'var(--blue)':'var(--line)'}`,
                          background:!isWorking?'var(--blue-bg)':'#fff',cursor:'pointer',textAlign:'left',
                          fontFamily:'DM Sans,sans-serif',transition:'all .18s',
                          boxShadow:!isWorking?'0 0 0 4px rgba(0,87,255,.08)':'none'
                        }}>
                        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
                          <div style={{width:38,height:38,borderRadius:10,background:!isWorking?'#DBEAFE':'var(--surf)',border:`1.5px solid ${!isWorking?'#BFDBFE':'var(--line)'}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,transition:'all .18s'}}>
                            <svg width="20" height="20" fill="none" stroke={!isWorking?'#1D4ED8':'#64748B'} strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                          </div>
                          <div>
                            <div style={{fontSize:14,fontWeight:800,color:!isWorking?'var(--blue)':'var(--ink)',letterSpacing:'-.2px'}}>Calendar Days</div>
                            <div style={{fontSize:11,color:'var(--slate)',marginTop:1}}>Default · counts all days</div>
                          </div>
                          {!isWorking&&(
                            <div style={{marginLeft:'auto',width:20,height:20,borderRadius:'50%',background:'var(--blue)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                              <Ic d={P.check} s={11} c="#fff"/>
                            </div>
                          )}
                        </div>
                        <div style={{fontSize:12,color:'var(--slate)',lineHeight:1.6}}>
                          Lead time counts <strong style={{color:'var(--ink)'}}>every day</strong> including Saturdays and Sundays. A 7-day lead time means exactly 7 days from today regardless of weekends.
                        </div>
                        {!isWorking&&(
                          <div style={{marginTop:12,padding:'8px 12px',background:'#DBEAFE',borderRadius:8,display:'flex',alignItems:'center',gap:7}}>
                            <svg width="12" height="12" fill="none" stroke="#1D4ED8" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>
                            <span style={{fontSize:11,fontWeight:700,color:'#1E40AF'}}>Currently active</span>
                          </div>
                        )}
                      </button>

                      {/* Working Days option */}
                      <button
                        onClick={()=>{setLeadTimeMode('Working Days');markUnsaved();}}
                        style={{
                          padding:'20px 20px',borderRadius:14,border:`2px solid ${isWorking?'var(--blue)':'var(--line)'}`,
                          background:isWorking?'var(--blue-bg)':'#fff',cursor:'pointer',textAlign:'left',
                          fontFamily:'DM Sans,sans-serif',transition:'all .18s',
                          boxShadow:isWorking?'0 0 0 4px rgba(0,87,255,.08)':'none'
                        }}>
                        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
                          <div style={{width:38,height:38,borderRadius:10,background:isWorking?'#DBEAFE':'var(--surf)',border:`1.5px solid ${isWorking?'#BFDBFE':'var(--line)'}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,transition:'all .18s'}}>
                            <svg width="20" height="20" fill="none" stroke={isWorking?'#1D4ED8':'#64748B'} strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                          </div>
                          <div>
                            <div style={{fontSize:14,fontWeight:800,color:isWorking?'var(--blue)':'var(--ink)',letterSpacing:'-.2px'}}>Working Days</div>
                            <div style={{fontSize:11,color:'var(--slate)',marginTop:1}}>Skips weekends (Sat &amp; Sun)</div>
                          </div>
                          {isWorking&&(
                            <div style={{marginLeft:'auto',width:20,height:20,borderRadius:'50%',background:'var(--blue)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                              <Ic d={P.check} s={11} c="#fff"/>
                            </div>
                          )}
                        </div>
                        <div style={{fontSize:12,color:'var(--slate)',lineHeight:1.6}}>
                          Lead time counts only <strong style={{color:'var(--ink)'}}>Mon–Fri</strong>. Saturdays and Sundays are automatically skipped. A 7-day lead time pushes past any weekends in between.
                        </div>
                        {isWorking&&(
                          <div style={{marginTop:12,padding:'8px 12px',background:'#DBEAFE',borderRadius:8,display:'flex',alignItems:'center',gap:7}}>
                            <svg width="12" height="12" fill="none" stroke="#1D4ED8" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>
                            <span style={{fontSize:11,fontWeight:700,color:'#1E40AF'}}>Currently active</span>
                          </div>
                        )}
                      </button>
                    </div>

                    {/* Live example preview */}
                    <div style={{background:'var(--surf)',border:'1.5px solid var(--line)',borderRadius:12,padding:'18px 20px'}}>
                      <div style={{fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--slate)',marginBottom:14}}>Live Example — 7-Day Lead Time Item</div>
                      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                        {/* Input side */}
                        <div style={{background:'#fff',border:'1.5px solid var(--line)',borderRadius:10,padding:'14px 16px'}}>
                          <div style={{fontSize:10,fontWeight:700,color:'var(--slate)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:10}}>Input</div>
                          <div style={{display:'flex',flexDirection:'column',gap:7}}>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                              <span style={{fontSize:12,color:'var(--slate)'}}>Today</span>
                              <span style={{fontSize:12,fontWeight:700,color:'var(--ink)',fontFamily:'DM Mono,monospace'}}>{todayStr}</span>
                            </div>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                              <span style={{fontSize:12,color:'var(--slate)'}}>Lead Time</span>
                              <span style={{fontSize:12,fontWeight:700,color:'var(--ink)'}}>7 days</span>
                            </div>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                              <span style={{fontSize:12,color:'var(--slate)'}}>Count Mode</span>
                              <span style={{fontSize:12,fontWeight:700,color:'var(--blue)'}}>{leadTimeMode}</span>
                            </div>
                          </div>
                        </div>
                        {/* Result side */}
                        <div style={{background:isWorking?'#EFF6FF':'#F0FDF4',border:`1.5px solid ${isWorking?'#BFDBFE':'#BBF7D0'}`,borderRadius:10,padding:'14px 16px',display:'flex',flexDirection:'column',justifyContent:'space-between'}}>
                          <div style={{fontSize:10,fontWeight:700,color:isWorking?'#1D4ED8':'#065F46',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:8}}>Result — Est. Delivery</div>
                          <div>
                            <div style={{fontSize:20,fontWeight:900,color:isWorking?'#1D4ED8':'#047857',letterSpacing:'-.4px',fontFamily:'DM Mono,monospace'}}>{resultStr}</div>
                            <div style={{fontSize:11,color:isWorking?'#3B82F6':'#059669',marginTop:4,fontWeight:600}}>{resultLong}</div>
                          </div>
                          {isWorking&&calStr!==resultStr&&(
                            <div style={{marginTop:10,padding:'6px 10px',background:'rgba(0,87,255,.06)',border:'1px solid #BFDBFE',borderRadius:7,display:'flex',alignItems:'center',gap:6}}>
                              <svg width="11" height="11" fill="none" stroke="#1D4ED8" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                              <span style={{fontSize:10,color:'#1E40AF',fontWeight:600}}>Calendar would be {calStr} — weekend skipped</span>
                            </div>
                          )}
                          {!isWorking&&(
                            <div style={{marginTop:10,padding:'6px 10px',background:'rgba(5,150,105,.06)',border:'1px solid #A7F3D0',borderRadius:7,display:'flex',alignItems:'center',gap:6}}>
                              <svg width="11" height="11" fill="none" stroke="#059669" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                              <span style={{fontSize:10,color:'#065F46',fontWeight:600}}>Counts all 7 days including any weekends</span>
                            </div>
                          )}
                        </div>
                      </div>
                    </div>

                    {/* Info note */}
                    <div style={{marginTop:16,padding:'12px 16px',background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:10,display:'flex',alignItems:'flex-start',gap:10}}>
                      <svg width="15" height="15" fill="none" stroke="#D97706" strokeWidth="2" viewBox="0 0 24 24" style={{flexShrink:0,marginTop:1}}><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                      <div style={{fontSize:12,color:'#92400E',lineHeight:1.65}}>
                        <strong>How this works:</strong> This setting is saved to your shop config and read by both <code style={{background:'#FEF3C7',padding:'1px 5px',borderRadius:4,fontSize:11}}>shop.html</code> and <code style={{background:'#FEF3C7',padding:'1px 5px',borderRadius:4,fontSize:11}}>cart.html</code> when computing the <strong>Est. delivery</strong> date. It applies globally to all products. Per-supplier adjustments in Lead Time Adjust are applied <em>on top of</em> this base computation.
                      </div>
                    </div>
                  </div>
                </div>
              </>
            );
          })()}

          {/* ══ QUOTATION LAYOUT ══ */}
          {activeSection==='quotation'&&(
            <>
              <div className="page-hd">
                <h2>Quotation Layout Setup</h2>
                <p>Design the layout of your quote documents — position fields, upload a letterhead, and customize the look of quotes sent to customers.</p>
              </div>
              <div style={{background:'var(--white)',border:'1.5px solid var(--line)',borderRadius:16,overflow:'hidden'}}>
                <div style={{background:'linear-gradient(135deg,#7C3AED,#5B21B6)',padding:'28px 32px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <div>
                    <div style={{fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:'.12em',color:'rgba(255,255,255,.6)',marginBottom:8}}>Document Designer</div>
                    <div style={{fontSize:20,fontWeight:900,color:'#fff',letterSpacing:'-.4px',marginBottom:6}}>Quote Layout</div>
                    <div style={{fontSize:13,color:'rgba(255,255,255,.75)',lineHeight:1.6,maxWidth:420}}>
                      Set up the visual layout of quotation documents — including your company letterhead, quoted items table, pricing, validity period, and signature fields.
                    </div>
                  </div>
                  <div style={{flexShrink:0,marginLeft:24}}>
                    <div style={{width:72,height:90,background:'rgba(255,255,255,.12)',border:'1.5px solid rgba(255,255,255,.2)',borderRadius:8,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:5,position:'relative',overflow:'hidden'}}>
                      <div style={{position:'absolute',top:0,left:0,right:0,height:16,background:'rgba(255,255,255,.15)'}}/>
                      {[60,48,48,56].map((w,i)=>(
                        <div key={i} style={{height:5,width:w,background:'rgba(255,255,255,.25)',borderRadius:2,marginTop:i===0?12:0}}/>
                      ))}
                    </div>
                  </div>
                </div>
                <div style={{padding:'24px 28px'}}>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:16,marginBottom:24}}>
                    {[
                      {icon:'🏢',label:'Company Header',desc:'Logo, name, address, TIN'},
                      {icon:'📦',label:'Quoted Items',desc:'Item table with qty & pricing'},
                      {icon:'💰',label:'Totals & VAT',desc:'Subtotal, tax, grand total'},
                      {icon:'📅',label:'Validity Period',desc:'Quote valid-until date'},
                      {icon:'✍️',label:'Signatures',desc:'Prepared by & authorized'},
                      {icon:'📋',label:'Terms & Notes',desc:'Terms, notes, disclaimers'},
                    ].map(f=>(
                      <div key={f.icon} style={{background:'var(--surf)',border:'1px solid var(--line)',borderRadius:10,padding:'14px 16px',display:'flex',gap:10,alignItems:'flex-start'}}>
                        <span style={{fontSize:20,flexShrink:0}}>{f.icon}</span>
                        <div>
                          <div style={{fontSize:12,fontWeight:700,color:'var(--ink)',marginBottom:2}}>{f.label}</div>
                          <div style={{fontSize:11,color:'var(--slate)'}}>{f.desc}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                  <div style={{display:'flex',gap:12,alignItems:'center'}}>
                    <a href="quote-layout-setup.html"
                      style={{display:'inline-flex',alignItems:'center',gap:8,background:'#7C3AED',color:'#fff',padding:'11px 24px',borderRadius:10,fontSize:14,fontWeight:700,textDecoration:'none',transition:'all .18s'}}
                      onMouseOver={e=>{e.currentTarget.style.background='#6D28D9';e.currentTarget.style.transform='translateY(-1px)';e.currentTarget.style.boxShadow='0 4px 16px rgba(124,58,237,.4)'}}
                      onMouseOut={e=>{e.currentTarget.style.background='#7C3AED';e.currentTarget.style.transform='none';e.currentTarget.style.boxShadow='none'}}>
                      <svg width="15" height="15" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
                      Open Quote Layout Designer
                    </a>
                    <div style={{fontSize:12,color:'var(--slate)'}}>Opens the full drag-and-drop layout editor in a new tab</div>
                  </div>
                </div>
              </div>
            </>
          )}

          {/* ══ FOOTER ══ */}
          {activeSection==='footer'&&(
            <>
              <div className="page-hd">
                <h2>Footer</h2>
                <p>Customize the footer that appears at the bottom of every shop page.</p>
              </div>
              <div className="sec-card">
                <div className="sec-card-hd">
                  <div className="sec-card-hd-left"><Ic d={P.gear} s={16} c="var(--blue)"/><div><div className="sec-card-title">Company Info</div></div></div>
                </div>
                <div className="sec-card-body">
                  <div className="fg2">
                    <div className="field">
                      <label className="fl">Company Name</label>
                      <input className="fi" value={footerCompany} onChange={e=>{setFooterCompany(e.target.value);markUnsaved();}} placeholder="Operix Procurement"/>
                    </div>
                    <div className="field">
                      <label className="fl">Copyright Text</label>
                      <input className="fi" value={footerCopyright} onChange={e=>{setFooterCopyright(e.target.value);markUnsaved();}} placeholder="All rights reserved."/>
                    </div>
                  </div>
                  <div className="field">
                    <label className="fl">Tagline</label>
                    <input className="fi" value={footerTagline} onChange={e=>{setFooterTagline(e.target.value);markUnsaved();}} placeholder="Your trusted procurement partner…"/>
                  </div>
                  <div className="fg2">
                    <div className="field">
                      <label className="fl">Phone</label>
                      <input className="fi" value={footerPhone} onChange={e=>{setFooterPhone(e.target.value);markUnsaved();}} placeholder="+63 000 000 0000"/>
                    </div>
                    <div className="field">
                      <label className="fl">Contact Email</label>
                      <input className="fi" value={footerEmail} onChange={e=>{setFooterEmail(e.target.value);markUnsaved();}} placeholder="info@yourcompany.com"/>
                    </div>
                  </div>
                  <div className="field" style={{marginBottom:0}}>
                    <label className="fl">Support Email</label>
                    <input className="fi" value={footerSupport} onChange={e=>{setFooterSupport(e.target.value);markUnsaved();}} placeholder="support@operix.com"/>
                  </div>
                </div>
              </div>
              <div className="sec-card">
                <div className="sec-card-hd">
                  <div className="sec-card-hd-left"><Ic d={P.footer} s={16} c="var(--blue)"/><div><div className="sec-card-title">Footer Links</div><div className="sec-card-sub">Links in the Company column of the footer</div></div></div>
                </div>
                <div className="sec-card-body">
                  {footerLinks.map((lk,i)=>(
                    <div key={i} className="footer-link-row">
                      <input value={lk.label} onChange={e=>{updateLink(i,'label',e.target.value);}} placeholder="Link label (e.g. About Us)" style={{flex:'1',padding:'8px 11px',border:'1.5px solid var(--line)',borderRadius:8,fontSize:12,fontFamily:'DM Sans,sans-serif',outline:'none',color:'var(--ink)'}} onFocus={e=>e.target.style.borderColor='#0057FF'} onBlur={e=>e.target.style.borderColor='var(--line)'}/>
                      <input value={lk.url} onChange={e=>{updateLink(i,'url',e.target.value);}} placeholder="URL (e.g. https://…)" style={{flex:'2',padding:'8px 11px',border:'1.5px solid var(--line)',borderRadius:8,fontSize:12,fontFamily:'DM Sans,sans-serif',outline:'none',color:'var(--ink)'}} onFocus={e=>e.target.style.borderColor='#0057FF'} onBlur={e=>e.target.style.borderColor='var(--line)'}/>
                      <button className="rm-link-btn" onClick={()=>removeLink(i)}><Ic d={P.x} s={12}/></button>
                    </div>
                  ))}
                  <button className="add-link-btn" onClick={addLink}><Ic d={P.plus} s={13}/>Add Link</button>
                </div>
              </div>
              {/* Live footer preview */}
              <div className="sec-card">
                <div className="sec-card-hd">
                  <div className="sec-card-hd-left"><Ic d={P.eye} s={16} c="var(--blue)"/><div><div className="sec-card-title">Footer Preview</div></div></div>
                </div>
                <div style={{background:'#0C1220',borderRadius:'0 0 14px 14px',padding:'28px 24px',color:'#94A3B8'}}>
                  <div style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr',gap:24,marginBottom:24}}>
                    <div>
                      <b style={{color:'#fff',fontSize:14,display:'block',marginBottom:6}}>{footerCompany||'Operix'}</b>
                      <p style={{fontSize:11,lineHeight:1.7,maxWidth:180}}>{footerTagline}</p>
                      {footerPhone&&<p style={{fontSize:11,marginTop:8}}>{footerPhone}</p>}
                      {footerEmail&&<p style={{fontSize:11}}>{footerEmail}</p>}
                    </div>
                    <div><h4 style={{fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:'#fff',marginBottom:10}}>Shop</h4><ul style={{listStyle:'none',display:'flex',flexDirection:'column',gap:6}}>{['Browse Products','My Orders','My Quotes'].map(l=><li key={l} style={{fontSize:11,color:'#475569'}}>{l}</li>)}</ul></div>
                    <div><h4 style={{fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:'#fff',marginBottom:10}}>Support</h4><ul style={{listStyle:'none',display:'flex',flexDirection:'column',gap:6}}><li style={{fontSize:11,color:'#475569'}}>{footerSupport}</li></ul></div>
                    <div><h4 style={{fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:'#fff',marginBottom:10}}>Company</h4><ul style={{listStyle:'none',display:'flex',flexDirection:'column',gap:6}}>{footerLinks.map((l,i)=>l.label&&<li key={i} style={{fontSize:11,color:'#475569'}}>{l.label}</li>)}</ul></div>
                  </div>
                  <div style={{borderTop:'1px solid rgba(255,255,255,.07)',paddingTop:14,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <p style={{fontSize:10}}>© {new Date().getFullYear()} {footerCompany||'Operix'}. {footerCopyright}</p>
                    <div style={{display:'flex',gap:6}}>
                      {['🔒 Secure','✓ Verified','⚡ Fast'].map(b=><span key={b} style={{background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.1)',borderRadius:5,padding:'3px 8px',fontSize:9,fontWeight:600,color:'#64748B'}}>{b}</span>)}
                    </div>
                  </div>
                </div>
              </div>
            </>
          )}

        </div>
      </div>

      {toast&&<Toast msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
    </>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
