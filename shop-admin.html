<html lang="en">
<head>
<meta charset="UTF-8">

<title>Operix — Shop Editor</title>

<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
:root{
  --ink:#0C1220;--ink2:#1E2D45;--slate:#64748B;
  --line:#E4EAF2;--surf:#F4F7FB;--white:#fff;
  --blue:#0057FF;--blue-d:#003FBB;--blue-bg:#EEF4FF;
  --green:#059669;--green-bg:#ECFDF5;
  --amber:#D97706;--amber-bg:#FFFBEB;
  --red:#DC2626;--red-bg:#FFF1F2;--gold:#F59E0B;
  --purple:#7C3AED;--purple-bg:#F5F3FF;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:\'DM Sans\',sans-serif;background:var(--surf);color:var(--ink);min-height:100vh}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#D1D9E6;border-radius:99px}

/* TOPBAR */
.tb{position:sticky;top:0;z-index:200;background:var(--ink);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid rgba(255,255,255,.05)}
.tb-brand{display:flex;align-items:center;gap:10px}
.tb-brand b{font-size:17px;font-weight:800;color:#fff;letter-spacing:-.4px}
.tb-brand small{font-size:9px;color:#F59E0B;font-weight:700;letter-spacing:.14em;text-transform:uppercase;display:block;margin-top:-2px}
.tb-r{display:flex;align-items:center;gap:10px}
.tb-link{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#94A3B8;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:7px;padding:6px 12px;cursor:pointer;text-decoration:none;transition:all .18s;white-space:nowrap}
.tb-link:hover{color:#fff;background:rgba(255,255,255,.1)}
.save-btn{display:flex;align-items:center;gap:7px;background:var(--green);color:#fff;padding:8px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .18s;font-family:\'DM Sans\',sans-serif}
.save-btn:hover{background:#047857;transform:translateY(-1px);box-shadow:0 4px 14px rgba(5,150,105,.4)}
.save-btn:disabled{background:#CBD5E1;cursor:not-allowed;transform:none}

/* LAYOUT */
.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 58px)}
.side-nav{background:var(--white);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto}
.side-nav-section{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--slate);padding:0 10px;margin-bottom:6px;margin-top:18px}
.side-nav-section:first-child{margin-top:0}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--slate);transition:all .15s;margin-bottom:2px}
.nav-item:hover{background:var(--surf);color:var(--ink)}
.nav-item.active{background:var(--blue-bg);color:var(--blue)}
.nav-item-icon{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.main-area{padding:28px 36px;overflow-y:auto}
.page-hd{margin-bottom:28px}
.page-hd h2{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-.4px;margin-bottom:4px}
.page-hd p{font-size:13px;color:var(--slate)}

/* SECTION CARD */
.sec-card{background:var(--white);border:1.5px solid var(--line);border-radius:16px;margin-bottom:20px;overflow:hidden}
.sec-card-hd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.sec-card-hd-left{display:flex;align-items:center;gap:10px}
.sec-card-title{font-size:13px;font-weight:800;color:var(--ink)}
.sec-card-sub{font-size:11px;color:var(--slate);margin-top:1px}
.sec-card-body{padding:20px}

/* FORM CONTROLS */
.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.fl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--slate);margin-bottom:6px}
.fi{width:100%;padding:10px 13px;border:1.5px solid var(--line);border-radius:9px;font-size:13px;font-family:\'DM Sans\',sans-serif;color:var(--ink);background:#fff;outline:none;transition:border .18s}
.fi:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,87,255,.07)}
.fi-hint{font-size:11px;color:var(--slate);margin-top:4px;line-height:1.5}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
textarea.fi{resize:vertical;min-height:80px}

/* SLIDER PREVIEW */
.slider-wrap{position:relative;overflow:hidden;border-radius:12px;background:var(--ink);aspect-ratio:16/5;margin-bottom:8px}
.slide-inner{display:flex;transition:transform .5s cubic-bezier(.4,0,.2,1);height:100%}
.slide{flex-shrink:0;width:100%;height:100%;position:relative;display:flex;align-items:center;overflow:hidden}
.slide img{width:100%;height:100%;object-fit:cover;opacity:.6}
.slide-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(12,18,32,.8) 0%,rgba(12,18,32,.2) 100%);padding:32px 40px;display:flex;flex-direction:column;justify-content:center}
.slide-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(0,87,255,.7);color:#fff;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;padding:4px 12px;border-radius:99px;margin-bottom:10px;width:fit-content}
.slide-title{font-size:28px;font-weight:900;color:#fff;letter-spacing:-.6px;line-height:1.15;margin-bottom:8px;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.slide-sub{font-size:13px;color:rgba(255,255,255,.75);max-width:420px;line-height:1.6}
.slide-nav{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10}
.slide-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);border:none;cursor:pointer;transition:all .2s;padding:0}
.slide-dot.active{background:#fff;width:20px;border-radius:3px}
.slide-arrow{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;transition:all .18s;z-index:10}
.slide-arrow:hover{background:rgba(255,255,255,.25)}
.slide-arrow.prev{left:10px}
.slide-arrow.next{right:10px}

/* SLIDE EDITOR */
.slide-editor-list{display:flex;flex-direction:column;gap:10px}
.slide-editor-item{background:var(--surf);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px}
.slide-editor-item.dragging{opacity:.5;border-style:dashed;border-color:var(--blue)}
.slide-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:var(--blue);color:#fff;border-radius:6px;font-size:10px;font-weight:800;flex-shrink:0}
.slide-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.slide-thumb{width:60px;height:36px;border-radius:6px;object-fit:cover;border:1.5px solid var(--line);flex-shrink:0}
.slide-thumb-ph{width:60px;height:36px;border-radius:6px;background:var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* CATEGORY IMAGE GRID */
.cat-img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.cat-img-card{background:var(--surf);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;transition:border .18s}
.cat-img-card:hover{border-color:#BFCFEF}
.cat-img-preview{width:100%;height:100px;object-fit:cover;display:block}
.cat-img-ph{width:100%;height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--line);opacity:.6}
.cat-img-footer{padding:10px 12px;background:var(--white)}
.cat-img-name{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* FOOTER EDITOR */
.footer-link-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.footer-link-row input{flex:1;padding:8px 11px;border:1.5px solid var(--line);border-radius:8px;font-size:12px;font-family:\'DM Sans\',sans-serif;outline:none;color:var(--ink)}
.footer-link-row input:focus{border-color:var(--blue)}
.rm-link-btn{width:28px;height:28px;background:var(--red-bg);border:1px solid #FECACA;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--red);flex-shrink:0}
.add-link-btn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-bg);border:1.5px dashed #BFDBFE;border-radius:8px;padding:8px 14px;cursor:pointer;width:100%;justify-content:center;margin-top:4px;transition:all .18s;font-family:\'DM Sans\',sans-serif}
.add-link-btn:hover{background:#DBEAFE}

/* TABS */
.tab-bar{display:flex;gap:2px;background:var(--surf);border:1.5px solid var(--line);border-radius:10px;padding:3px;margin-bottom:22px;width:fit-content}
.tab{padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:\'DM Sans\',sans-serif;transition:all .15s;background:none;color:var(--slate)}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--white);color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.07);font-weight:700}

/* LIVE PREVIEW BANNER */
.preview-banner{background:linear-gradient(135deg,#0C1220 0%,#1E3050 100%);border:1.5px solid rgba(255,255,255,.08);border-radius:14px;padding:20px 24px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.preview-banner p{font-size:13px;color:#94A3B8;line-height:1.55;max-width:480px}
.preview-banner strong{color:#fff}

/* COLOR SWATCHES */
.color-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.color-swatch{width:28px;height:28px;border-radius:7px;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0}
.color-swatch.sel{border-color:var(--ink);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.color-swatch:hover{transform:scale(1.1)}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:fu .25s ease;border-left:3px solid var(--green)}
.toast.err{border-left-color:var(--red)}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:14px}
.loader-spin{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
.unsaved-dot{width:7px;height:7px;border-radius:50%;background:#F59E0B;display:inline-block;margin-left:4px}
@media(max-width:860px){.layout{grid-template-columns:1fr}.side-nav{display:none}}
</style>
</head>
