to {

}
@keyframes fadeIn {

to {

.option-item {

}
.delete-btn {
opacity: 0;
transition: all 0.2s ease;
}
.option-item:hover .delete-btn {
opacity: 1;

function InventorySettings() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [activeSection, setActiveSection] = useState('code');
  
  const [inventorySettings, setInventorySettings] = useState({
    codePrefix: 'PRD',
    startingNumber: 1,
    categoryOptions: [],
    unitOptions: [],
    defaultThreshold: 10
  });

  // ── Lead Time Control state ──
  const [suppliers, setSuppliers]               = useState([]);
  const [ltRules, setLtRules]                   = useState([]);   // existing adjust rules from Firestore
  const [ltcSupplier, setLtcSupplier]           = useState('');   // selected supplier for Burst Set
  const [ltcDays, setLtcDays]                   = useState('');   // days for Burst Set
  const [ltcRunning, setLtcRunning]             = useState(false);
  const [ltcResult, setLtcResult]               = useState(null); // { set, skipped } counts
  const [ltaSupplier, setLtaSupplier]           = useState('');   // selected supplier for Adjust
  const [ltaDays, setLtaDays]                   = useState('');   // adjust days
  const [ltaDayType, setLtaDayType]             = useState('Calendar Days');
  const [ltaSaving, setLtaSaving]               = useState(false);
  const [ltaDeleteId, setLtaDeleteId]           = useState(null); // rule id being deleted

  useEffect(() => {
    const initFirebase = () => {
      const firebaseConfig = {
        apiKey: "AIzaSyB56dPmBwgO4uWyXakhY9SJBCAz7bk0Do8",
        authDomain: "operix-c8a8c.firebaseapp.com",
        projectId: "operix-c8a8c",
        storageBucket: "operix-c8a8c.firebasestorage.app",
        messagingSenderId: "794223223499",
        appId: "1:794223223499:web:f059007b909cc15766f14e",
        measurementId: "G-6E4BD657K1"
      };

      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }

      const auth = firebase.auth();
      auth.onAuthStateChanged(async (currentUser) => {
        if (currentUser) {
          const db = firebase.firestore();
          const userDoc = await db.collection('users').doc(currentUser.uid).get();
          
          if (userDoc.exists && userDoc.data().role === 'admin') {
            setUser({
              uid: currentUser.uid,
              email: currentUser.email,
              ...userDoc.data()
            });
            
            await loadInventorySettings(db, currentUser.uid);
            await loadSuppliersAndRules(db, currentUser.uid);
          } else {
            window.location.href = 'login.html';
          }
        } else {
          window.location.href = 'login.html';
        }
        setLoading(false);
      });
    };

    initFirebase();
  }, []);

  const loadInventorySettings = async (db, userId) => {
    try {
      // Use onSnapshot so the Categories and Units sections update in real-time
      // as soon as the CSV auto-sync writes to Firestore
      db.collection('inventorySettings').doc(userId).onSnapshot(settingsDoc => {
        if (settingsDoc.exists) {
          const data = settingsDoc.data();
          setInventorySettings({
            codePrefix: data.codePrefix ?? 'PRD',
            startingNumber: data.startingNumber ?? 1,
            defaultThreshold: data.defaultThreshold ?? 10,
            categoryOptions: Array.isArray(data.categoryOptions) ? data.categoryOptions : [],
            unitOptions: Array.isArray(data.unitOptions) ? data.unitOptions : [],
          });
        }
      }, error => {
        console.error('inventorySettings snapshot error:', error);
      });
    } catch (error) {
      console.error('Error loading inventory settings:', error);
    }
  };

  // ── Load suppliers & existing lead time adjust rules ──
  const loadSuppliersAndRules = async (db, userId) => {
    try {
      const supSnap = await db.collection('suppliers').where('createdBy','==',userId).get();
      setSuppliers(supSnap.docs.map(d => ({ id: d.id, name: d.data().name })).sort((a,b)=>a.name.localeCompare(b.name)));
      const ruleSnap = await db.collection('leadTimeAdjust').where('adminId','==',userId).get();
      setLtRules(ruleSnap.docs.map(d => ({ id: d.id, ...d.data() })));
    } catch(e) { console.error('loadSuppliersAndRules:', e); }
  };

  // ── BURST SET: set leadTime on all items of a supplier that have NO leadtime ──
  const runBurstSet = async () => {
    if (!ltcSupplier) { alert('Please select a supplier.'); return; }
    const days = parseInt(ltcDays);
    if (!days || days < 1) { alert('Please enter a valid number of days.'); return; }
    setLtcRunning(true);
    setLtcResult(null);
    try {
      const db = firebase.firestore();
      const snap = await db.collection('products')
        .where('createdBy','==',user.uid)
        .where('supplier','==',ltcSupplier)
        .get();
      const batch = db.batch();
      let setCount = 0, skippedCount = 0;
      snap.docs.forEach(doc => {
        const existing = (doc.data().leadTime || '').toString().trim();
        if (existing && existing !== '0') {
          skippedCount++;
        } else {
          batch.update(doc.ref, { leadTime: String(days), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
          setCount++;
        }
      });
      if (setCount > 0) await batch.commit();
      setLtcResult({ set: setCount, skipped: skippedCount });
      setLtcDays('');
    } catch(e) { console.error('runBurstSet:', e); alert('Error: ' + e.message); }
    setLtcRunning(false);
  };

  // ── ADJUST: save/update a leadTimeAdjust rule per supplier ──
  const saveAdjustRule = async () => {
    if (!ltaSupplier) { alert('Please select a supplier.'); return; }
    const days = parseInt(ltaDays);
    if (!days || days < 0) { alert('Please enter a valid number of days (0 or more).'); return; }
    setLtaSaving(true);
    try {
      const db = firebase.firestore();
      const existing = ltRules.find(r => r.supplierName === ltaSupplier);
      const ruleData = {
        adminId: user.uid,
        supplierName: ltaSupplier,
        adjustDays: days,
        dayType: ltaDayType,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      if (existing) {
        await db.collection('leadTimeAdjust').doc(existing.id).update(ruleData);
        setLtRules(prev => prev.map(r => r.id === existing.id ? { ...r, ...ruleData } : r));
      } else {
        const ref = await db.collection('leadTimeAdjust').add({ ...ruleData, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        setLtRules(prev => [...prev, { id: ref.id, ...ruleData }]);
      }
      showToast('Lead time adjust rule saved!', 'green');
      setLtaSupplier(''); setLtcSupplier(''); setLtcDays(''); setLtaDays(''); setLtaDayType('Calendar Days');
    } catch(e) { console.error('saveAdjustRule:', e); alert('Error: ' + e.message); }
    setLtaSaving(false);
  };

  // ── DELETE adjust rule ──
  const deleteAdjustRule = async (ruleId) => {
    try {
      const db = firebase.firestore();
      await db.collection('leadTimeAdjust').doc(ruleId).delete();
      setLtRules(prev => prev.filter(r => r.id !== ruleId));
      setLtaDeleteId(null);
      showToast('Rule deleted.', 'red');
    } catch(e) { alert('Error: ' + e.message); }
  };

  // ── Toast helper ──
  const showToast = (msg, color='green') => {
    const t = document.createElement('div');
    t.className = `fixed top-4 right-4 bg-${color}-500 text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 z-50 animate-fadeIn`;
    t.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${color==='green'?'M5 13l4 4L19 7':'M6 18L18 6M6 6l12 12'}"></path></svg><span class="font-semibold">${msg}</span>`;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  };

  const saveInventorySettings = async () => {
    try {
      setSaving(true);
      const db = firebase.firestore();
      await db.collection('inventorySettings').doc(user.uid).set({
        ...inventorySettings,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      
      // Success notification
      const notification = document.createElement('div');
      notification.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 z-50 animate-fadeIn';
      notification.innerHTML = `
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <span class="font-semibold">Settings saved successfully!</span>
      `;
      document.body.appendChild(notification);
      setTimeout(() => notification.remove(), 3000);
      
    } catch (error) {
      console.error('Error saving inventory settings:', error);
      alert('Error saving settings. Please try again.');
    } finally {
      setSaving(false);
    }
  };

const handleFileUpload = async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const fileType = file.name.split('.').pop().toLowerCase();
  if (!['csv','xlsx','xls'].includes(fileType)) {
    alert('Please upload a CSV or Excel file (.csv, .xlsx, .xls)');
    return;
  }

  setUploading(true);

  // ── Parse CSV text into rows ──
  const parseCSVText = (text) => {
    const rows = [];
    let currentRow = [], currentField = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const char = text[i], nextChar = text[i+1];
      if (char === '"') {
        if (inQuotes && nextChar === '"') { currentField += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if (char === ',' && !inQuotes) {
        currentRow.push(currentField.trim()); currentField = '';
      } else if ((char === '\n' || char === '\r') && !inQuotes) {
        if (char === '\r' && nextChar === '\n') i++;
        if (currentField || currentRow.length > 0) {
          currentRow.push(currentField.trim()); rows.push(currentRow);
          currentRow = []; currentField = '';
        }
      } else currentField += char;
    }
    if (currentField || currentRow.length > 0) { currentRow.push(currentField.trim()); rows.push(currentRow); }
    return rows;
  };

  // ── Read file and return rows (supports CSV + Excel) ──
  const getRows = () => new Promise((resolve, reject) => {
    const reader = new FileReader();
    if (fileType === 'csv') {
      reader.onload = ev => { try { resolve(parseCSVText(ev.target.result)); } catch(err) { reject(err); } };
      reader.onerror = reject;
      reader.readAsText(file);
    } else {
      if (typeof XLSX === 'undefined') {
        reject(new Error('SheetJS not loaded — please use a CSV file for now.')); return;
      }
      reader.onload = ev => {
        try {
          const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
          resolve(data.map(r => r.map(c => String(c ?? '').trim())));
        } catch(err) { reject(err); }
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(file);
    }
  });

  try {
    const rawRows = await getRows();

    // ── Shim: make the existing inner processing work with rawRows ──
    const processImport = async () => {
      // Build text-compatible parse output from rawRows
      const rows = rawRows;
      const text = ''; // not used below
      
      
      const headers = rows[0].map(h => h.toLowerCase().replace(/\s+/g, ''));
      const dataRows = rows.slice(1).filter(row => row.some(cell => cell.trim()));
      
      console.log('CSV Headers:', headers);
      console.log('Total data rows:', dataRows.length);
      
      const db = firebase.firestore();
      
      // Pre-load all suppliers for this admin to match supplier names
      const suppliersSnapshot = await db.collection('suppliers')
        .where('createdBy', '==', user.uid)
        .get();

      const supplierMap = {};
      suppliersSnapshot.docs.forEach(doc => {
        const s = doc.data();
        if (s.name) {
          const normalizedKey = s.name.toLowerCase().trim();
          supplierMap[normalizedKey] = {
            currency: s.currency || 'PHP',
            name: s.name,
            id: doc.id
          };
        }
      });

      console.log('📋 Loaded suppliers for matching:', Object.keys(supplierMap));

const batch = db.batch();
let successCount = 0;
let updatedCount = 0;
let skippedCount = 0;
let errorCount = 0;
const errors = [];
const rejectedProducts = [];
const skippedProducts = [];
const updatedProducts = [];

// Pre-load ALL existing products for this admin to check duplicates
const existingProductsSnapshot = await db.collection('products')
  .where('createdBy', '==', user.uid)
  .get();

const existingProductsMap = {};
existingProductsSnapshot.docs.forEach(doc => {
  const p = doc.data();
const key = `${(p.name || '').toLowerCase().replace(/\s+/g, ' ').trim()}|${(p.sku || '').toLowerCase().replace(/\s+/g, ' ').trim()}`;
  existingProductsMap[key] = {
    id: doc.id,
    price: p.price,
    supplier: (p.supplier || '').toLowerCase().trim(),
    category: (p.category || '').toLowerCase().trim()
  };
});

console.log(`📋 Loaded ${Object.keys(existingProductsMap).length} existing products for duplicate check`);

      for (let rowIndex = 0; rowIndex < dataRows.length; rowIndex++) {
        const row = dataRows[rowIndex];
        
        try {
          const productData = {};
          headers.forEach((header, index) => {
            productData[header] = row[index] ? row[index].trim() : '';
          });
          
          // Validate required fields
          if (!productData.name || !productData.sku) {
            errors.push(`Row ${rowIndex + 2}: Missing required fields (Name: "${productData.name}", SKU: "${productData.sku}")`);
            errorCount++;
            rejectedProducts.push({
              row: rowIndex + 2,
              name: productData.name || 'N/A',
              sku: productData.sku || 'N/A',
              supplier: productData.supplier || 'N/A',
              reason: 'Missing Name or SKU'
            });
            continue;
          }

          // STRICT SUPPLIER MATCHING
          const supplierNameRaw = productData.supplier || '';
          const supplierNameKey = supplierNameRaw.toLowerCase().trim();

          if (!supplierNameRaw) {
            errors.push(`Row ${rowIndex + 2}: No supplier specified for product "${productData.name}"`);
            errorCount++;
            rejectedProducts.push({
              row: rowIndex + 2,
              name: productData.name,
              sku: productData.sku,
              supplier: 'N/A',
              reason: 'No supplier specified'
            });
            continue;
          }

          if (!supplierMap[supplierNameKey]) {
            errors.push(`Row ${rowIndex + 2}: Supplier "${supplierNameRaw}" not found in system for product "${productData.name}"`);
            errorCount++;
            rejectedProducts.push({
              row: rowIndex + 2,
              name: productData.name,
              sku: productData.sku,
              supplier: supplierNameRaw,
              reason: 'Supplier not found in system'
            });
            continue;
          }

          // Supplier matched! Get currency
          const matchedSupplier = supplierMap[supplierNameKey];
          const detectedCurrency = matchedSupplier.currency;

          console.log(`✅ Row ${rowIndex + 2}: Matched supplier "${supplierNameRaw}" → Currency: ${detectedCurrency}`);

const incomingPrice = parseFloat(productData.price) || 0;
          const duplicateKey = `${productData.name.toLowerCase().replace(/\s+/g, ' ').trim()}|${productData.sku.toLowerCase().replace(/\s+/g, ' ').trim()}`;
  console.log(`🔍 Row ${rowIndex + 2} key: "${duplicateKey}" | Exists: ${!!existingProductsMap[duplicateKey]}`);        
const existingProduct = existingProductsMap[duplicateKey];

          if (existingProduct) {
            // Product already exists — check if price differs
            const existingPrice = parseFloat(existingProduct.price) || 0;
            const priceIsDifferent = Math.abs(incomingPrice - existingPrice) > 0.001;

            if (priceIsDifferent) {
              // Same Name + SKU + Supplier + Category, but different price → UPDATE price only
              const productRef = db.collection('products').doc(existingProduct.id);
              batch.update(productRef, {
                price: incomingPrice,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
              });
              updatedCount++;
              updatedProducts.push({
                row: rowIndex + 2,
                name: productData.name,
                sku: productData.sku,
                oldPrice: existingPrice,
                newPrice: incomingPrice
              });
              console.log(`🔄 Row ${rowIndex + 2}: Price updated for "${productData.name}" — ${existingPrice} → ${incomingPrice}`);
            } else {
              // Exact match, no change needed → SKIP
              skippedCount++;
              skippedProducts.push({
                row: rowIndex + 2,
                name: productData.name,
                sku: productData.sku
              });
              console.log(`⏭️ Row ${rowIndex + 2}: Skipped (already exists, no change) — "${productData.name}"`);
            }
          } else {
            // New product → INSERT
            const productRef = db.collection('products').doc();
            const completeProductData = {
              name: productData.name,
              sku: productData.sku,
              category: productData.category || '',
              price: incomingPrice,
              stock: parseInt(productData.stock) || 0,
              threshold: parseInt(productData.threshold) || inventorySettings.defaultThreshold,
              unit: productData.unit || 'pieces',
              description: productData.description || '',
              imageUrl: productData.imageurl || '',
              supplier: matchedSupplier.name,
              supplierId: matchedSupplier.id,
              moq: productData.moq || '',
              leadTime: productData.leadtime || '',
              currency: detectedCurrency,
              weight_kg: productData.weight_kg ? parseFloat(productData.weight_kg) || '' : '',
              length_cm: productData.length_cm ? parseFloat(productData.length_cm) || '' : '',
              width_cm: productData.width_cm ? parseFloat(productData.width_cm) || '' : '',
              height_cm: productData.height_cm ? parseFloat(productData.height_cm) || '' : '',
              createdBy: user.uid,
              importedFrom: 'bulk_upload',
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            batch.set(productRef, completeProductData);
            successCount++;
            console.log(`✅ Row ${rowIndex + 2}: New product added — "${productData.name}"`);
          }
          
        } catch (rowError) {
          console.error(`Error processing row ${rowIndex + 2}:`, rowError);
          errors.push(`Row ${rowIndex + 2}: ${rowError.message}`);
          errorCount++;
          rejectedProducts.push({
            row: rowIndex + 2,
            name: productData?.name || 'N/A',
            sku: productData?.sku || 'N/A',
            supplier: productData?.supplier || 'N/A',
            reason: rowError.message
          });
        }
      }
      
      // Commit batch
      if (successCount > 0) {
        await batch.commit();
      }
      
      // ── Auto-sync categories & units from CSV into inventorySettings ──
      // Always write ALL unique category/unit values found in the CSV,
      // merging with whatever is already saved (respecting existing ones too).
      // This runs regardless of successCount so even skipped/updated rows contribute.
      try {
        const csvCategories = [];
        const csvUnits = [];
        dataRows.forEach(row => {
          const obj = {};
          headers.forEach((h, i) => { obj[h] = (row[i] || '').trim(); });
          if (obj.category) csvCategories.push(obj.category);
          if (obj.unit) csvUnits.push(obj.unit);
        });

        const uniqueCsvCategories = [...new Set(csvCategories)].filter(Boolean);
        const uniqueCsvUnits = [...new Set(csvUnits)].filter(Boolean);

        if (uniqueCsvCategories.length > 0 || uniqueCsvUnits.length > 0) {
          const settingsRef = db.collection('inventorySettings').doc(user.uid);
          const settingsSnap = await settingsRef.get();
          const existing = settingsSnap.exists ? settingsSnap.data() : {};

          // Safely get existing arrays — never treat [] as falsy
          const existingCategories = Array.isArray(existing.categoryOptions) ? existing.categoryOptions : [];
          const existingUnits = Array.isArray(existing.unitOptions) ? existing.unitOptions : [];

          // Merge: existing + CSV values, deduplicated and sorted
          const mergedCategories = [...new Set([...existingCategories, ...uniqueCsvCategories])].sort();
          const mergedUnits = [...new Set([...existingUnits, ...uniqueCsvUnits])].sort();

          // Always write — even if no "new" ones, this ensures Firestore is in sync
          await settingsRef.set({
            codePrefix: existing.codePrefix || 'PRD',
            startingNumber: existing.startingNumber || 1,
            defaultThreshold: existing.defaultThreshold || 10,
            ...existing,
            categoryOptions: mergedCategories,
            unitOptions: mergedUnits,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });

          // Update local React state immediately so the UI shows the new values right away
          setInventorySettings(prev => ({
            ...prev,
            categoryOptions: mergedCategories,
            unitOptions: mergedUnits
          }));

          console.log(`✅ Inventory Settings synced — ${mergedCategories.length} categories, ${mergedUnits.length} units.`);
        }
      } catch (syncErr) {
        console.error('Auto-sync categories/units error:', syncErr);
        // Non-critical — products were still imported, just notify
        alert('⚠️ Products imported but failed to auto-sync categories/units into settings: ' + syncErr.message);
      }

      setUploading(false);
      
      // Generate detailed report
let reportMessage = `
═══════════════════════════════════════
📊 PRODUCT IMPORT SUMMARY REPORT
═══════════════════════════════════════

✅ NEWLY UPLOADED: ${successCount} product(s)
🔄 PRICE UPDATED: ${updatedCount} product(s)
⏭️ SKIPPED (no change): ${skippedCount} product(s)
❌ REJECTED: ${errorCount} product(s)

`;

      if (updatedProducts.length > 0) {
        reportMessage += `
═══════════════════════════════════════
🔄 PRICE UPDATED PRODUCTS:
═══════════════════════════════════════

`;
        updatedProducts.forEach((item, idx) => {
          reportMessage += `
${idx + 1}. Row ${item.row}
   📦 Product: ${item.name}
   🔖 SKU: ${item.sku}
   💰 Price: ${item.oldPrice} → ${item.newPrice}
`;
        });
      }

      if (skippedProducts.length > 0) {
        reportMessage += `
═══════════════════════════════════════
⏭️ SKIPPED (already exists, no change):
═══════════════════════════════════════

`;
        skippedProducts.forEach((item, idx) => {
          reportMessage += `
${idx + 1}. Row ${item.row}
   📦 Product: ${item.name}
   🔖 SKU: ${item.sku}
`;
        });
      }

      if (rejectedProducts.length > 0) {
        reportMessage += `
═══════════════════════════════════════
❌ REJECTED PRODUCTS DETAILS:
═══════════════════════════════════════

`;
        rejectedProducts.forEach((item, idx) => {
          reportMessage += `
${idx + 1}. Row ${item.row}
   📦 Product: ${item.name}
   🔖 SKU: ${item.sku}
   🏭 Supplier: ${item.supplier}
   ⚠️ Reason: ${item.reason}
`;
        });
      }

      if (successCount > 0) {
        reportMessage += `
═══════════════════════════════════════
✅ NEW PRODUCTS IMPORTED
═══════════════════════════════════════
${successCount} new product(s) added with supplier currency applied.
`;
      }

      reportMessage += `
═══════════════════════════════════════
💡 TIP: Rejected products were not uploaded.
Make sure supplier names match exactly with
your Supplier Management list.
═══════════════════════════════════════
`;
      
      alert(reportMessage);
      

      e.target.value = '';
    };

    await processImport();

  } catch (error) {
    console.error('Error uploading file:', error);
    alert('Error importing products: ' + error.message);
    setUploading(false);
  }
};

                  >
                    <Plus />
                    Add Unit
                  </button>
                </div>

                <div className="settings-card p-6">
                  <div className="grid grid-cols-3 gap-4">
                    {inventorySettings.unitOptions.map((unit, idx) => (
                      <div key={idx} className="option-item relative group p-4 rounded-lg border border-gray-200">
                        <input
                          type="text"
                          value={unit}
                          onChange={(e) => {
                            const newUnits = [...inventorySettings.unitOptions];
                            newUnits[idx] = e.target.value;
                            setInventorySettings({...inventorySettings, unitOptions: newUnits});
                          }}
                          className="w-full text-center border-0 focus:ring-0 outline-none font-bold text-sm"
                        />
                        <button
                          onClick={() => {
                            const newUnits = inventorySettings.unitOptions.filter((_, i) => i !== idx);
                            setInventorySettings({...inventorySettings, unitOptions: newUnits});
                          }}
                          className="delete-btn absolute top-2 right-2 p-1.5 text-red-600 hover:bg-red-50 rounded-lg transition-all"
                        >
                          <Trash />
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* Lead Time Control */}
            {activeSection === 'leadtime' && (
              <div className="content-section max-w-4xl">
                <div className="mb-6">
                  <h2 className="text-2xl font-bold text-gray-900 mb-2">Lead Time Control</h2>
                  <p className="text-gray-600">Bulk-set lead times per supplier and configure automatic Need-By Date computation for the shop</p>
                </div>

                {/* ── COMBINED SUPPLIER SELECTOR + BURST SET + ADJUST ── */}
                <div className="settings-card p-6 mb-6">

                  {/* Single supplier selector */}
                  <div className="mb-6">
                    <label className="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-2">Supplier</label>
                    <div className="relative max-w-md">
                      <select value={ltaSupplier} onChange={e=>{
                          const v = e.target.value;
                          setLtaSupplier(v);
                          setLtcSupplier(v);
                          setLtcResult(null);
                          // Pre-fill fields if an existing rule is found for this supplier
                          const existing = ltRules.find(r => r.supplierName === v);
                          if (existing) {
                            setLtaDays(String(existing.adjustDays));
                            setLtaDayType(existing.dayType || 'Calendar Days');
                            setLtcDays(''); // Burst days are independent — never pre-fill from adjust rule
                          } else {
                            setLtaDays('');
                            setLtaDayType('Calendar Days');
                            setLtcDays('');
                          }
                        }}
                        className="w-full pl-4 pr-10 py-3 border-2 border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none appearance-none bg-white font-semibold text-gray-800">
                        <option value="">— Select a supplier to configure —</option>
                        {suppliers.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
                      </select>
                      <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400"><ChevronDown/></div>
                    </div>
                    {ltaSupplier && (
                      <div className="mt-2 inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-700 bg-indigo-50 border border-indigo-200 px-3 py-1 rounded-full animate-fadeIn">
                        <svg className="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd"/></svg>
                        Configuring: {ltaSupplier}
                      </div>
                    )}
                  </div>

                  <div className="border-t border-gray-100 pt-6 grid grid-cols-2 gap-6">

                    {/* ── Left: Burst Set ── */}
                    <div className={`rounded-xl border-2 p-5 transition-all ${ltaSupplier ? 'border-indigo-200 bg-indigo-50/30' : 'border-gray-200 bg-gray-50 opacity-50 pointer-events-none'}`}>
                      <div className="flex items-center gap-2 mb-3">
                        <div className="w-7 h-7 rounded-lg bg-indigo-100 flex items-center justify-center flex-shrink-0">
                          <svg className="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                        </div>
                        <div>
                          <p className="text-sm font-bold text-gray-900">Burst Lead Time Set</p>
                          <p className="text-xs text-gray-500">Set lead time on all items with no lead time</p>
                        </div>
                      </div>
                      <div className="mb-3">
                        <label className="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1.5">Lead Time (days)</label>
                        <input type="number" min="1" value={ltcDays} onChange={e=>setLtcDays(e.target.value)}
                          placeholder="e.g. 14"
                          className="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none font-semibold bg-white"/>
                      </div>
                      <button onClick={runBurstSet} disabled={ltcRunning || !ltcSupplier || !ltcDays}
                        className="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white rounded-lg text-sm font-semibold transition-all">
                        {ltcRunning
                          ? <><div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"/>Running…</>
                          : <><RefreshIcon/>Apply Burst Set</>}
                      </button>
                      {ltcResult && (
                        <div className="flex gap-2 mt-3 animate-fadeIn">
                          <span className="flex-1 text-center px-2 py-1.5 bg-green-100 text-green-800 rounded-lg text-xs font-semibold">✓ {ltcResult.set} updated</span>
                          <span className="flex-1 text-center px-2 py-1.5 bg-amber-100 text-amber-800 rounded-lg text-xs font-semibold">⏭ {ltcResult.skipped} skipped</span>
                        </div>
                      )}
                      <p className="mt-3 text-xs text-gray-400">Items with an existing lead time are skipped and not overwritten.</p>
                    </div>

                    {/* ── Right: Adjust ── */}
                    <div className={`rounded-xl border-2 p-5 transition-all ${ltaSupplier ? 'border-purple-200 bg-purple-50/30' : 'border-gray-200 bg-gray-50 opacity-50 pointer-events-none'}`}>
                      <div className="flex items-center gap-2 mb-3">
                        <div className="w-7 h-7 rounded-lg bg-purple-100 flex items-center justify-center flex-shrink-0">
                          <svg className="w-4 h-4 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        </div>
                        <div>
                          <p className="text-sm font-bold text-gray-900">Lead Time Adjust</p>
                          <p className="text-xs text-gray-500">Auto-compute Need-By Date in the shop</p>
                        </div>
                      </div>
                      <div className="mb-3">
                        <label className="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1.5">Adjust Days</label>
                        <input type="number" min="0" value={ltaDays} onChange={e=>setLtaDays(e.target.value)}
                          placeholder="e.g. 3"
                          className="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none font-semibold bg-white"/>
                      </div>
                      <div className="mb-3">
                        <label className="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1.5">Day Type</label>
                        <div className="flex rounded-lg border border-gray-300 overflow-hidden">
                          {['Calendar Days','Working Days'].map(opt => (
                            <button key={opt} onClick={()=>setLtaDayType(opt)}
                              className={`flex-1 py-2 text-xs font-semibold transition-all ${ltaDayType===opt?'bg-purple-600 text-white':'bg-white text-gray-600 hover:bg-gray-50'}`}>
                              {opt==='Working Days'?'🗓 Working':'📅 Calendar'}
                            </button>
                          ))}
                        </div>
                      </div>
                      {ltaSupplier && ltaDays !== '' && (
                        <div className="mb-3 p-2.5 bg-purple-50 border border-purple-200 rounded-lg text-xs text-purple-800 animate-fadeIn">
                          Lead Time + <strong>{ltaDays} {ltaDayType}</strong> → Need-By Date
                        </div>
                      )}
                      <button onClick={saveAdjustRule} disabled={ltaSaving || !ltaSupplier || ltaDays===''}
                        className="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-purple-600 hover:bg-purple-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white rounded-lg text-sm font-semibold transition-all">
                        {ltaSaving
                          ? <><div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"/>Saving…</>
                          : <><Save/>{ltRules.find(r=>r.supplierName===ltaSupplier) ? 'Update Adjust Rule' : 'Save Adjust Rule'}</>}
                      </button>
                    </div>
                  </div>
                </div>

                {/* ── ACTIVE RULES TABLE ── */}
                <div className="settings-card p-6">
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-base font-bold text-gray-900">Active Lead Time Adjust Rules</h3>
                    <span className="text-xs font-semibold bg-gray-100 text-gray-600 px-3 py-1 rounded-full">{ltRules.length} rule{ltRules.length!==1?'s':''}</span>
                  </div>
                  {ltRules.length === 0 ? (
                    <div className="text-center py-10 text-gray-400">
                      <svg className="w-10 h-10 mx-auto mb-3 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                      <p className="text-sm font-medium">No adjust rules configured yet</p>
                      <p className="text-xs mt-1">Add a rule above to auto-compute Need-By Date in the shop</p>
                    </div>
                  ) : (
                    <div className="overflow-x-auto">
                      <table className="w-full text-sm">
                        <thead>
                          <tr className="border-b border-gray-200">
                            <th className="text-left py-2 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Supplier</th>
                            <th className="text-center py-2 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Adjust Days</th>
                            <th className="text-center py-2 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Day Type</th>
                            <th className="text-center py-2 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">How It Works</th>
                            <th className="py-2 px-3"></th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-100">
                          {ltRules.map(rule => (
                            <tr key={rule.id} className="hover:bg-gray-50 transition-colors">
                              <td className="py-3 px-3 font-medium text-gray-900">{rule.supplierName}</td>
                              <td className="py-3 px-3 text-center">
                                <span className="inline-flex items-center justify-center w-10 h-10 rounded-full bg-indigo-100 text-indigo-800 font-bold text-sm">
                                  +{rule.adjustDays}
                                </span>
                              </td>
                              <td className="py-3 px-3 text-center">
                                <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${rule.dayType==='Working Days'?'bg-green-100 text-green-800':'bg-blue-100 text-blue-800'}`}>
                                  {rule.dayType==='Working Days'?'🗓 Working':'📅 Calendar'}
                                </span>
                              </td>
                              <td className="py-3 px-3 text-center text-xs text-gray-500">
                                Lead Time + {rule.adjustDays} {rule.dayType}
                              </td>
                              <td className="py-3 px-3 text-right">
                                {ltaDeleteId === rule.id ? (
                                  <div className="flex items-center justify-end gap-2">
                                    <span className="text-xs text-red-600 font-medium">Delete?</span>
                                    <button onClick={()=>deleteAdjustRule(rule.id)} className="px-2 py-1 bg-red-500 text-white text-xs rounded font-semibold hover:bg-red-600">Yes</button>
                                    <button onClick={()=>setLtaDeleteId(null)} className="px-2 py-1 bg-gray-200 text-gray-700 text-xs rounded font-semibold hover:bg-gray-300">No</button>
                                  </div>
                                ) : (
                                  <button onClick={()=>setLtaDeleteId(rule.id)} className="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all">
                                    <Trash/>
                                  </button>
                                )}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                  <div className="mt-4 p-3 bg-blue-50 border border-blue-200 rounded-lg text-xs text-blue-800">
                    <strong>ℹ️ How it works in the Shop:</strong> When a purchaser adds an item to cart, the Need-By Date is auto-filled as: <em>Today + Item Lead Time + Adjust Days</em> (skipping weekends if Working Days is selected). Purchasers do not need to enter it manually.
                  </div>
                </div>
              </div>
            )}

            {/* Default Threshold */}
            {activeSection === 'threshold' && (
              <div className="content-section max-w-4xl">
                <div className="mb-6">
                  <h2 className="text-2xl font-bold text-gray-900 mb-2">Default Low Stock Threshold</h2>
                  <p className="text-gray-600">Set default threshold for low stock alerts</p>
                </div>

                <div className="settings-card p-6">
                  <div className="max-w-md">
                    <label className="block text-sm font-semibold text-gray-700 mb-2">Default Threshold Value</label>
                    <input
                      type="number"
                      min="1"
                      value={inventorySettings.defaultThreshold}
                      onChange={(e) => setInventorySettings({...inventorySettings, defaultThreshold: parseInt(e.target.value) || 10})}
                      className="input-field w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none text-lg font-semibold"
                    />
                    <div className="mt-4 p-4 bg-orange-50 rounded-lg border border-orange-200">
                      <p className="text-sm text-orange-800 mb-2">
                        <strong>ℹ️ About Threshold:</strong>
                      </p>
                      <p className="text-xs text-orange-700">
                        When product stock falls to or below this value, it will be marked as "Low Stock" and trigger alerts. 
                        This is used as the default value when adding new products or importing without specifying threshold.
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        </main>
      </div>
    </div>
  );
}

ReactDOM.render(<InventorySettings />, document.getElementById('root'));

</script>
</body>
</html>
