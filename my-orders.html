}

function App() {
  const [user, setUser]           = useState(null);
  const [userRole, setUserRole]   = useState(null);
  const [loading, setLoading]     = useState(true);
  const [orders, setOrders]       = useState([]);
  const [quotes, setQuotes]       = useState([]);
  const [ordersLoading, setOrdersLoading] = useState(false);

  // UI state
  const [activeTab, setActiveTab]     = useState('orders');
  const [statusFilter, setStatusFilter] = useState('all');
  const [searchQ, setSearchQ]         = useState('');
  const [sortKey, setSortKey]         = useState('createdAt');
  const [sortDir, setSortDir]         = useState('desc');
  const [page, setPage]               = useState(1);
  const [pageJump, setPageJump]       = useState('');

  // Drawer
  const [selectedOrder, setSelectedOrder] = useState(null);
  const [selectedQuote, setSelectedQuote] = useState(null);

  // Cancel modal
  const [cancelTarget, setCancelTarget] = useState(null);
  const [cancelReasonText, setCancelReasonText] = useState('');
  const [cancelling, setCancelling]     = useState(false);

  // Toast
  const [toast, setToast] = useState(null);

  // Mark as Received
  const [markingReceived, setMarkingReceived]   = useState(false);
  const [receiveTarget,   setReceiveTarget]     = useState(null);
  const [footerData,      setFooterData]        = useState({});
  const [shippingSettings, setShippingSettings] = useState({ receivedAfterDays: 7 });

  const showToast = (msg, type='success') => {
    setToast({msg, type});
  };

  // ── AUTH ──
  useEffect(() => {
    if (!window.firebase) { setTimeout(()=>window.location.reload(),600); return; }
    if (!firebase.apps.length) firebase.initializeApp(FB);
    firebase.auth().onAuthStateChanged(async u => {
      if (!u) {
        // Clean up real-time listener on logout
        if (window._quotationsUnsub) { window._quotationsUnsub(); window._quotationsUnsub = null; }
        window.location.href='login.html'; return;
      }
      const db = firebase.firestore();
      const doc = await db.collection('users').doc(u.uid).get();
      if (!doc.exists) { window.location.href='login.html'; return; }
      const ud = doc.data();
      // Status gate
      if (ud.status === 'pending' || ud.status === 'rejected') {
        window.location.href = 'login.html'; return;
      }
      setUser({ ...u, ...ud });
      setUserRole(ud.role || 'user');
      await loadData(u.uid, ud.role || 'user', ud.assignedAdminId || null, db);
      setLoading(false);
    });
  }, []);

  const loadData = async (uid, role, assignedAdminId, db) => {
    setOrdersLoading(true);
    try {
      // Load shopConfig for footer
      try {
        const admSnap2 = await db.collection('users').where('role','==','admin').limit(1).get();
        if (!admSnap2.empty) {
          const adminId = admSnap2.docs[0].id;
          const adminData = admSnap2.docs[0].data();
          const companyName = adminData.companyName || '';
          const configDocId = companyName || adminId;
          let sc = await db.collection('shopConfig').doc(configDocId).get();
          if (!sc.exists && companyName) sc = await db.collection('shopConfig').doc(adminId).get();
          if (sc.exists && sc.data().footer) setFooterData(sc.data().footer);
        }
      } catch(e) { console.warn('footer load non-fatal:', e); }

      // Load shipping settings so we know receivedAfterDays threshold
      try {
        const adminId = role === 'admin' ? uid : assignedAdminId;
        if (adminId) {
          const settDoc = await db.collection('shippingSettings').doc(adminId).get();
          if (settDoc.exists) setShippingSettings(s => ({...s, ...settDoc.data()}));
        }
      } catch(e) { /* non-critical */ }

      // Load orders — admins see all their company orders, users see own
      let ordersSnap;
      if (role === 'admin') {
        ordersSnap = await db.collection('orders').orderBy('createdAt','desc').get();
        // Filter to orders that contain products created by this admin
        const myProductsSnap = await db.collection('products').where('createdBy','==',uid).get();
        const myProductIds = new Set(myProductsSnap.docs.map(d=>d.id));
        const allOrders = ordersSnap.docs.map(d=>({id:d.id,...d.data()}));
        setOrders(allOrders.filter(o => o.items?.some(i=>myProductIds.has(i.productId)) || o.createdBy===uid || o.userId===uid));
      } else {
        ordersSnap = await db.collection('orders')
          .where('userId','==',uid)
          .orderBy('createdAt','desc').get();
        setOrders(ordersSnap.docs.map(d=>({id:d.id,...d.data()})));
      }
      // Load quotes — real-time listener on 'quotations' so status updates
      // (e.g. admin approving) are reflected immediately without a page reload.
      // Legacy 'quotes' collection is fetched once and merged as a baseline.
      try {
        // One-time fetch of legacy quotes collection
        let legacyQuotes = [];
        try {
          const legacySnap = await db.collection('quotes').where('userId','==',uid).get();
          legacyQuotes = legacySnap.docs.map(d=>({id:d.id,...d.data()}));
        } catch(e) { console.warn('legacy quotes fetch:', e); }

        // Real-time listener on quotations — fires immediately and on every change
        const unsub = db.collection('quotations')
          .where('userId','==',uid)
          .onSnapshot(quotationsSnap => {
            const quotesMap = new Map();
            // Seed with legacy quotes as baseline
            legacyQuotes.forEach(data => quotesMap.set(data.quoteNumber||data.id, data));
            // quotations collection always wins (has approval fields)
            quotationsSnap.docs.forEach(d => {
              const data = {id:d.id,...d.data()};
              quotesMap.set(data.quoteNumber||d.id, data);
            });
            const allQuotes = [...quotesMap.values()].sort((a,b)=>{
              const at=a.createdAt?.toMillis?.()||0, bt=b.createdAt?.toMillis?.()||0;
              return bt-at;
            });
            setQuotes(allQuotes);
            // Also update any open drawer with the latest data for this quote
            setSelectedQuote(prev => {
              if (!prev) return prev;
              const updated = allQuotes.find(q => q.id === prev.id);
              return updated || prev;
            });
          }, e => {
            console.warn('quotations listener error:', e);
          });
        // Store unsubscribe so we can clean up (stored on window to survive re-renders)
        if (window._quotationsUnsub) window._quotationsUnsub();
        window._quotationsUnsub = unsub;
      } catch(e) {
        console.warn('quotes load:', e);
        try {
          const quotesSnap = await db.collection('quotes').where('userId','==',uid).get();
          setQuotes(quotesSnap.docs.map(d=>({id:d.id,...d.data()})));
        } catch {}
      }
    } catch(e) {
      console.error(e);
      // fallback without orderBy if index missing
      try {
        const snap = await db.collection('orders').where('userId','==',uid).get();
        setOrders(snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{
          const at = a.createdAt?.toMillis?.()||0;
          const bt = b.createdAt?.toMillis?.()||0;
          return bt-at;
        }));
      } catch {}
    }
    setOrdersLoading(false);
  };

  // ── STATS ──
  const stats = useMemo(() => ({
    total:      orders.length,
    pending:    orders.filter(o=>o.status==='pending').length,
    processing: orders.filter(o=>o.status==='processing'||o.status==='confirmed'||o.status==='shipped').length,
    completed:  orders.filter(o=>o.status==='completed').length,
    cancelled:  orders.filter(o=>o.status==='cancelled').length,
    spend:      orders.filter(o=>o.status!=='cancelled').reduce((s,o)=>s+(o.totalAmount||0),0),
  }), [orders]);

  // ── FILTER + SORT ──
  const filtered = useMemo(() => {
    let list = [...orders];
    if (statusFilter !== 'all') list = list.filter(o => o.status === statusFilter);
    if (searchQ.trim()) {
      const q = searchQ.toLowerCase();
      list = list.filter(o =>
        (o.orderNumber||'').toLowerCase().includes(q) ||
        (o.customerName||'').toLowerCase().includes(q) ||
        (o.customerEmail||'').toLowerCase().includes(q) ||
        (o.items||[]).some(i=>(i.name||'').toLowerCase().includes(q)||(i.sku||'').toLowerCase().includes(q))
      );
    }
    list.sort((a,b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (sortKey === 'createdAt' || sortKey === 'updatedAt') {
        av = av?.toMillis?.() || 0;
        bv = bv?.toMillis?.() || 0;
      } else if (sortKey === 'totalAmount') {
        av = av||0; bv = bv||0;
      } else {
        av = String(av||'').toLowerCase();
        bv = String(bv||'').toLowerCase();
      }
      return sortDir==='asc' ? (av>bv?1:-1) : (av<bv?1:-1);
    });
    return list;
  }, [orders, statusFilter, searchQ, sortKey, sortDir]);

  const totalPages = Math.max(1, Math.ceil(filtered.length / ITEMS_PER_PAGE));
  const safePage = Math.min(page, totalPages);
  const pageItems = filtered.slice((safePage-1)*ITEMS_PER_PAGE, safePage*ITEMS_PER_PAGE);

  const handleSort = (key) => {
    if (sortKey === key) setSortDir(d => d==='asc'?'desc':'asc');
    else { setSortKey(key); setSortDir('desc'); }
    setPage(1);
  };
  const SortIcon = ({k}) => sortKey===k
    ? <span style={{fontSize:9,marginLeft:3}}>{sortDir==='asc'?'▲':'▼'}</span>
    : <span style={{fontSize:9,marginLeft:3,opacity:.3}}>⇅</span>;

  // ── MARK AS RECEIVED ──
  const handleMarkReceived = (order) => {
    setReceiveTarget(order);
  };

  const confirmMarkReceived = async () => {
    const order = receiveTarget;
    if (!order) return;
    setMarkingReceived(true);
    try {
      const db = firebase.firestore();
      await db.collection('orders').doc(order.id).update({
        status:            'completed',
        completedAt:       firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt:         firebase.firestore.FieldValue.serverTimestamp(),
        receivedBy:        user.uid,
        receivedByName:    user.displayName || user.email,
      });
      // Notify admins
      try {
        const admSnap = await db.collection('users').where('role','==','admin').get();
        for (const a of admSnap.docs) {
          await db.collection('notifications').add({
            type: 'order-status',
            message: `Order ${order.orderNumber} marked as Received by ${user.displayName||user.email}`,
            details: { orderNumber: order.orderNumber, status: 'completed', customerId: user.uid },
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            read: false, userId: a.id, userRole: 'admin'
          });
        }
      } catch(e) { console.warn('notify non-fatal', e); }
      setOrders(prev => prev.map(o => o.id===order.id ? {...o, status:'completed', completedAt:new Date()} : o));
      if (selectedOrder?.id === order.id) setSelectedOrder(o => ({...o, status:'completed'}));
      showToast('Order marked as Received. Thank you!');
      setReceiveTarget(null);
    } catch(e) {
      console.error(e);
      showToast('Failed to update order. Please try again.', 'error');
    }
    setMarkingReceived(false);
  };


  // ── CANCEL ──
  const handleCancel = async () => {
    if (!cancelTarget) return;
    setCancelling(true);
    try {
      const db = firebase.firestore();
      const order = cancelTarget;
      const batch = db.batch();

      // BUG#16 FIX: Only restore stock if it was physically deducted.
      // Stock is deducted ONLY when admin clicks "Confirm Packed — Deduct Stock"
      // which advances the order to ready_for_shipment (or further).
      // Orders still in pending/confirmed/processing have NOT had stock deducted yet,
      // so incrementing stock would be incorrect and inflate inventory.
      const stockWasDeducted = ['packed','ready_for_shipment','shipped','completed']
        .includes(order.status);

      if (stockWasDeducted) {
        (order.items||[]).forEach(item => {
          if (item.productId) {
            // Use packedQuantities if available (partial packs), else full order qty
            const qty = order.packedQuantities?.[item.productId] ?? item.quantity;
            batch.update(db.collection('products').doc(item.productId), {
              stock: firebase.firestore.FieldValue.increment(parseInt(qty)||0)
            });
          }
        });
      }

      batch.update(db.collection('orders').doc(order.id), {
        status: 'cancelled',
        cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
        cancelReason: cancelReasonText.trim() || null,
        stockRestored: stockWasDeducted,
        updatedAt:   firebase.firestore.FieldValue.serverTimestamp()
      });
      await batch.commit();
      // Send cancellation email
      try {
        await fetch(`${RENDER}/webhook/order-status`, {
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':`Bearer ${SECRET}`},
          body: JSON.stringify({ orderNumber:order.orderNumber, customerEmail:order.customerEmail, customerName:order.customerName, status:'cancelled' })
        });
      } catch(e) { console.warn('email non-fatal',e); }
      setOrders(prev => prev.map(o => o.id===order.id ? {...o,status:'cancelled'} : o));
      if (selectedOrder?.id === order.id) setSelectedOrder(o=>({...o,status:'cancelled'}));
      showToast('Order cancelled successfully');
      setCancelTarget(null);
      setSelectedOrder(null);
    } catch(e) {
      console.error(e);
      showToast('Failed to cancel order. Please try again.','error');
    }
    setCancelling(false);
  };

  // ── PAGINATION SMART WINDOW ── 
  const buildPageButtons = () => {
    const pages = [];
    const delta = 2;
    const left  = Math.max(2, safePage - delta);
    const right = Math.min(totalPages - 1, safePage + delta);
    pages.push(1);
    if (left > 2) pages.push('...');
    for (let p = left; p <= right; p++) pages.push(p);
    if (right < totalPages - 1) pages.push('...');
    if (totalPages > 1) pages.push(totalPages);
    return pages;
  };

  if (loading) return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',flexDirection:'column',gap:16}}>
      <div className="spinner"/>
      <p style={{fontSize:13,color:'#64748B'}}>Loading your portal…</p>
    </div>
  );

  const initials = (user?.displayName||user?.email||'U').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  const currency = orders[0]?.items?.[0]?.currency || 'PHP';
  const cs = getCurrencySymbol(currency);

  return (
    <>
      {/* ── TOPBAR ── */}
      <nav className="tb">
        <div className="tb-inner">
        <a className="tb-brand" href="shop.html">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="8" fill="#0057FF"/>
            <path d="M7 14l5 5 9-9" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          <div><b>Operix</b><small>Procurement</small></div>
        </a>
        <nav className="tb-nav">
            <a href="shop.html" className="tb-nav-link">
              <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1.5 7h13M10 21a1 1 0 100-2 1 1 0 000 2zm7 0a1 1 0 100-2 1 1 0 000 2z"/></svg>
              Shop
            </a>
            <a href="my-orders.html" className="tb-nav-link active">
              <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
              My Orders
            </a>
          </nav>
          <div className="tb-spacer"/>
          <AccountDropdown
            user={user}
            userRole={userRole}
            onSignOut={()=>firebase.auth().signOut().then(()=>{window.location.href='login.html';})}
            extraItems={[
              {href:'shop.html',     label:'Shop',      icon:<svg width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1.5 7h13M10 21a1 1 0 100-2 1 1 0 000 2zm7 0a1 1 0 100-2 1 1 0 000 2z"/></svg>},
              {href:'cart.html',     label:'View Cart', icon:<svg width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>},
            ]}
          />
        </div>
      </nav>

      <div className="page">
        {/* ── PAGE HEADER ── */}
        <div className="page-hd">
          <div className="page-hd-row">
            <div>
              <h1>My Orders & Quotes</h1>
              <p>Track your orders, view status updates, and manage your quotes</p>
            </div>
            <a href="shop.html" style={{display:'inline-flex',alignItems:'center',gap:7,background:'var(--blue)',color:'#fff',padding:'9px 18px',borderRadius:8,fontSize:13,fontWeight:600,textDecoration:'none',transition:'all .18s',boxShadow:'0 2px 8px rgba(0,87,255,.28)'}}
              onMouseEnter={e=>e.currentTarget.style.background='#003FBB'}
              onMouseLeave={e=>e.currentTarget.style.background='#0057FF'}>
              {/* Fluent: Add */}
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M12 5v14M5 12h14"/></svg>
              New Order
            </a>
          </div>
        </div>

        {/* ── STATS ── */}
        <div className="stats-row">
          {[
            {
              val: stats.total,
              lbl: 'Total Orders',
              color: 'var(--blue)',
              iconBg: '#EEF4FF',
              iconColor: '#0057FF',
              icon: <svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>,
            },
            {
              val: stats.pending,
              lbl: 'Pending',
              color: '#1D4ED8',
              iconBg: '#DBEAFE',
              iconColor: '#1D4ED8',
              icon: <svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8"><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" d="M12 6v6l4 2"/></svg>,
            },
            {
              val: stats.processing,
              lbl: 'In Progress',
              color: '#92400E',
              iconBg: '#FEF3C7',
              iconColor: '#D97706',
              icon: <svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8"><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>,
            },
            {
              val: stats.completed,
              lbl: 'Completed',
              color: 'var(--green)',
              iconBg: '#ECFDF5',
              iconColor: '#059669',
              icon: <svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
            },
            {
              val: `₱${fmt(stats.spend)}`,
              lbl: 'Total Spend',
              color: 'var(--ink)',
              iconBg: '#F4F7FB',
              iconColor: '#64748B',
              icon: <svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8"><path strokeLinecap="round" strokeLinejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
            },
          ].map((s, i) => (
            <div key={i} className="stat-card">
              <div className="stat-card-icon" style={{background:s.iconBg,color:s.iconColor}}>{s.icon}</div>
              <div className="stat-val" style={{color:s.color}}>{s.val}</div>
              <div className="stat-lbl">{s.lbl}</div>
            </div>
          ))}
        </div>

        {/* ── TAB NAV ── */}
        <div className="tab-nav">
          <button className={`tab-btn ${activeTab==='orders'?'active':''}`} onClick={()=>setActiveTab('orders')}>
            {/* Fluent: Document Bullet List */}
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
            Orders
            <span className="tab-cnt">{orders.length}</span>
          </button>
          <button className={`tab-btn ${activeTab==='quotes'?'active':''}`} onClick={()=>setActiveTab('quotes')}>
            {/* Fluent: Document Text */}
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9"><path strokeLinecap="round" strokeLinejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/><path strokeLinecap="round" strokeLinejoin="round" d="M9 13h6M9 17h4"/></svg>
            Quotes
            <span className="tab-cnt">{quotes.length}</span>
            {quotes.filter(q=>q.approvalStatus==='pending_approval'||q.status==='pending_approval').length > 0 && (
              <span style={{background:'#F5F3FF',color:'#7C3AED',fontSize:9,fontWeight:800,padding:'1px 5px',borderRadius:99,border:'1px solid #DDD6FE'}}>
                {quotes.filter(q=>q.approvalStatus==='pending_approval'||q.status==='pending_approval').length} pending
              </span>
            )}
          </button>
        </div>

        {/* ══ ORDERS TAB ══ */}
        {activeTab === 'orders' && (
          <>
            {/* Filter bar */}
            <div className="filter-bar">
              <div className="search-wrap">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path strokeLinecap="round" d="m21 21-4.35-4.35"/></svg>
                <input className="search-inp" placeholder="Search by order #, product, customer…"
                  value={searchQ} onChange={e=>{setSearchQ(e.target.value);setPage(1);}}/>
              </div>
              <select className="filter-sel" value={sortKey} onChange={e=>{setSortKey(e.target.value);setPage(1);}}>
                <option value="createdAt">Sort: Date</option>
                <option value="totalAmount">Sort: Amount</option>
                <option value="status">Sort: Status</option>
                <option value="orderNumber">Sort: Order #</option>
              </select>
              <div className="status-tabs">
                {[
                  {k:'all',l:'All'},
                  {k:'pending',l:'Pending'},
                  {k:'confirmed',l:'Confirmed'},
                  {k:'processing',l:'Processing'},
                  {k:'on_hold',l:'On Hold'},
                  {k:'shipped',l:'Shipped'},
                  {k:'completed',l:'Completed'},
                  {k:'cancelled',l:'Cancelled'},
                ].map(t=>(
                  <button key={t.k} className={`stab ${statusFilter===t.k?'active':''}`}
                    onClick={()=>{setStatusFilter(t.k);setPage(1);}}>
                    {t.l}
                    {t.k!=='all' && orders.filter(o=>o.status===t.k).length > 0 &&
                      <span style={{marginLeft:4,fontSize:10,fontWeight:800,opacity:.7}}>
                        ({orders.filter(o=>o.status===t.k).length})
                      </span>
                    }
                  </button>
                ))}
              </div>
            </div>

            {/* Table */}
            <div className="orders-wrap">
              {ordersLoading ? (
                <div className="loading-wrap"><div className="spinner"/><p>Loading orders…</p></div>
              ) : filtered.length === 0 ? (
                <div className="empty">
                  <div className="empty-icon">
                    {/* Fluent: DocumentBulletList */}
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" strokeWidth="1.4"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                  </div>
                  <h3>{orders.length === 0 ? 'No orders yet' : 'No orders match your filters'}</h3>
                  <p>{orders.length === 0 ? 'Place your first order from the shop and it will appear here.' : 'Try adjusting your search or filter.'}</p>
                  {orders.length === 0 && <a href="shop.html" className="empty-btn">Browse Shop</a>}
                </div>
              ) : (
                <>
                  <div style={{overflowX:'auto'}}>
                    <table className="orders-table">
                      <thead>
                        <tr>
                          <th className="sortable" onClick={()=>handleSort('orderNumber')}>Order # <SortIcon k="orderNumber"/></th>
                          <th className="sortable" onClick={()=>handleSort('createdAt')}>Date <SortIcon k="createdAt"/></th>
                          <th>Items</th>
                          <th className="sortable" onClick={()=>handleSort('status')}>Status <SortIcon k="status"/></th>
                          <th className="sortable" onClick={()=>handleSort('totalAmount')}>Amount <SortIcon k="totalAmount"/></th>
                          <th>Customer</th>
                        </tr>
                      </thead>
                      <tbody>
                        {pageItems.map(order => {
                          const currency = order.items?.[0]?.currency || 'PHP';
                          // Mark as Received eligibility
                          const isOrderOwner = order.customerId === user?.uid || order.userId === user?.uid;
                          const shippedTs = order.shippedAt?.toDate ? order.shippedAt.toDate() : null;
                          const daysSinceShipped = shippedTs ? Math.floor((Date.now()-shippedTs.getTime())/86400000) : 0;
                          const thresholdDays = shippingSettings.receivedAfterDays ?? 7;
                          const canMark = isOrderOwner && order.status==='shipped' && daysSinceShipped>=thresholdDays;
                          const CANCEL_LOCKED = ['ready_for_shipment','packed','shipped','completed','cancelled'];
                          return (
                            <tr key={order.id} onClick={()=>setSelectedOrder(order)}>
                              <td>
                                <div className="ord-num">{order.orderNumber || '#'+order.id.slice(-8).toUpperCase()}</div>
                              </td>
                              <td>
                                <div className="ord-date">{fmtDate(order.createdAt)}</div>
                                <div style={{fontSize:10,color:'#94A3B8',marginTop:1}}>{order.updatedAt && order.updatedAt !== order.createdAt ? 'Updated '+fmtDate(order.updatedAt) : ''}</div>
                              </td>
                              <td>
                                <div className="ord-items-preview">
                                  {(order.items||[]).slice(0,3).map((item,i)=>(
                                    <span key={i} className="item-chip">
                                      {item.imageUrl && <img src={item.imageUrl} alt=""/>}
                                      {item.name}
                                      <span style={{opacity:.5}}>×{item.quantity}</span>
                                    </span>
                                  ))}
                                  {(order.items||[]).length > 3 &&
                                    <span className="item-more">+{order.items.length-3} more</span>
                                  }
                                </div>
                              </td>
                              <td>
                                <StatusBadge status={order.status}/>
                                {/* Mark as Received button — only for the order owner, only when shipped & threshold passed */}
                                {canMark && (
                                  <button
                                    onClick={e=>{e.stopPropagation();handleMarkReceived(order);}}
                                    disabled={markingReceived}
                                    style={{marginTop:5,display:'inline-flex',alignItems:'center',gap:4,padding:'4px 10px',background:'linear-gradient(135deg,#059669,#047857)',color:'#fff',border:'none',borderRadius:6,fontSize:10,fontWeight:700,cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap'}}>
                                    <svg width="10" height="10" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>
                                    Mark Received
                                  </button>
                                )}
                                {/* In-transit indicator with tracking info — only shown when shipped on Apr 24 2026 */}
                                {order.status==='shipped' && isOrderOwner && !canMark && (()=>{
                                  const _shippedTs = order.shippedAt?.toDate ? order.shippedAt.toDate() : (order.shippedAt ? new Date(order.shippedAt) : null);
                                  const _isApr24 = _shippedTs && _shippedTs.getFullYear()===2026 && _shippedTs.getMonth()===3 && _shippedTs.getDate()===24;
                                  if (!_isApr24) return null;
                                  return (
                                  <div style={{marginTop:5}}>
                                    <div style={{fontSize:9,color:'#0369A1',fontWeight:700,display:'flex',alignItems:'center',gap:3,marginBottom:2}}>
                                      <svg width="9" height="9" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
                                      Courier Shipped on Apr 24, 2026
                                    </div>
                                    {(order.shipmentCourier||(order.shipmentDetails&&order.shipmentDetails.courier)) && (
                                      <div style={{fontSize:9,color:'#64748B',fontWeight:600,marginBottom:1}}>{order.shipmentCourier||(order.shipmentDetails&&order.shipmentDetails.courier)}</div>
                                    )}
                                    {(order.trackingNumber||(order.shipmentDetails&&order.shipmentDetails.trackingNumber)) && (
                                      <div style={{fontFamily:'DM Mono,monospace',fontSize:9,color:'#0C1220',fontWeight:700,letterSpacing:'.04em'}}>{order.trackingNumber||(order.shipmentDetails&&order.shipmentDetails.trackingNumber)}</div>
                                    )}
                                  </div>
                                  );
                                })()}
                                {/* Lock icon — order can no longer be cancelled */}
                                {CANCEL_LOCKED.includes(order.status) && order.status!=='cancelled' && order.status!=='completed' && order.status!=='shipped' && (
                                  <div style={{marginTop:4,fontSize:9,color:'#94A3B8',fontWeight:600,display:'flex',alignItems:'center',gap:3}}>
                                    <svg width="9" height="9" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                                    Non-cancellable
                                  </div>
                                )}
                              </td>
                              <td>
                                <div className="ord-total">₱{fmt(order.totalAmountPhp!=null?order.totalAmountPhp:order.totalAmount)}</div>
                              </td>
                              <td>
                                <div className="ord-buyer">
                                  <div className="ord-buyer-av">
                                    {(order.customerName||order.customerEmail||'?')[0].toUpperCase()}
                                  </div>
                                  <div>
                                    <div style={{fontSize:12,fontWeight:600,color:'var(--ink)'}}>{order.customerName||'—'}</div>
                                    <div style={{fontSize:10,color:'#94A3B8'}}>{order.customerEmail||''}</div>
                                  </div>
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>

                  {/* Pagination */}
                  <div className="pag">
                    <div className="pag-info">
                      Showing {filtered.length===0?0:(safePage-1)*ITEMS_PER_PAGE+1}–{Math.min(safePage*ITEMS_PER_PAGE,filtered.length)} of {filtered.length} orders
                    </div>
                    <div className="pag-btns">
                      <button className="pag-btn" disabled={safePage===1} onClick={()=>setPage(1)} title="First">«</button>
                      <button className="pag-btn" disabled={safePage===1} onClick={()=>setPage(p=>p-1)}>‹</button>
                      {buildPageButtons().map((p,i)=>
                        p==='...'
                          ? <span key={`d${i}`} style={{padding:'0 4px',color:'#94A3B8',fontSize:12}}>…</span>
                          : <button key={p} className={`pag-btn ${safePage===p?'active':''}`} onClick={()=>setPage(p)}>{p}</button>
                      )}
                      <button className="pag-btn" disabled={safePage===totalPages} onClick={()=>setPage(p=>p+1)}>›</button>
                      <button className="pag-btn" disabled={safePage===totalPages} onClick={()=>setPage(totalPages)} title="Last">»</button>
                    </div>
                    {totalPages > 5 && (
                      <div className="pag-jump">
                        <span style={{fontSize:12,color:'#64748B'}}>Go to</span>
                        <input type="number" min={1} max={totalPages} value={pageJump}
                          onChange={e=>setPageJump(e.target.value)}
                          onKeyDown={e=>{if(e.key==='Enter'){const p=parseInt(pageJump);if(p>=1&&p<=totalPages){setPage(p);setPageJump('');}}} }/>
                        <button onClick={()=>{const p=parseInt(pageJump);if(p>=1&&p<=totalPages){setPage(p);setPageJump('');}}}>Go</button>
                      </div>
                    )}
                  </div>
                </>
              )}
            </div>
          </>
        )}

        {/* ══ QUOTES TAB ══ */}
        {activeTab === 'quotes' && (
          quotes.length === 0 ? (
            <div className="orders-wrap">
              <div className="empty">
                <div className="empty-icon">
                  {/* Fluent: DocumentText */}
                  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" strokeWidth="1.4"><path strokeLinecap="round" strokeLinejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/><path strokeLinecap="round" d="M9 13h6M9 17h4"/></svg>
                </div>
                <h3>No quotes yet</h3>
                <p>Use the Quick Quote button in the shop to generate and send quotes.</p>
                <a href="shop.html" className="empty-btn">Go to Shop</a>
              </div>
            </div>
          ) : (
            <div>
              {quotes.map(quote => {
                const isExpired = quote.validUntil && quote.validUntil.toDate?.() < new Date();
                const isPending  = quote.approvalStatus === 'pending_approval' || quote.status === 'pending_approval';
                const isRejected = quote.approvalStatus === 'rejected' || quote.status === 'rejected';
                const cs2 = getCurrencySymbol(getQuoteCurrency(quote));
                return (
                  <div key={quote.id} className="quote-card" onClick={()=>setSelectedQuote(quote)}
                    style={isExpired?{opacity:.82,borderColor:'#E2E8F0',cursor:'pointer'}:{}}>

                    {/* Expired banner — full-width strip at top of card */}
                    {isExpired && (
                      <div style={{background:'#F1F5F9',border:'none',borderRadius:'10px 10px 0 0',margin:'-16px -18px 12px',padding:'7px 18px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                        <span style={{fontSize:11,fontWeight:700,color:'#475569',textTransform:'uppercase',letterSpacing:'.06em'}}>Quotation Expired</span>
                        <span style={{fontSize:11,color:'#94A3B8',fontWeight:500}}>Expired {fmtDate(quote.validUntil)}</span>
                      </div>
                    )}

                    <div className="quote-hd">
                      <div>
                        <div className="quote-num">{quote.quoteNumber}</div>
                        <div className="quote-meta">
                          {quote.recipientEmail ? `To: ${quote.recipientEmail} · ` : ''}{fmtDate(quote.createdAt)}
                          {quote.approvalGroupName && <span style={{marginLeft:6,fontSize:10,color:'var(--purple)',fontWeight:600}}>via {quote.approvalGroupName}</span>}
                        </div>
                      </div>
                      <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
                        {isPending
                          ? <span className="q-badge-pending">Pending Approval</span>
                          : isRejected
                          ? <span className="q-badge-rejected">Rejected</span>
                          : isExpired
                          ? <span className="q-badge-expired">Expired</span>
                          : <span className="q-badge-approved">Active</span>
                        }
                        {isPending && quote.assignedApproverName && (
                          <div style={{fontSize:10,color:'var(--slate)'}}>Assigned to {quote.assignedApproverName}</div>
                        )}
                      </div>
                    </div>
                    <div className="quote-items">
                      {(quote.items||[]).slice(0,4).map((item,i)=>(
                        <span key={i} className="item-chip">{item.name} ×{item.quantity}</span>
                      ))}
                      {(quote.items||[]).length > 4 && <span className="item-more">+{quote.items.length-4} more</span>}
                    </div>
                    <div className="quote-footer">
                      <div style={{display:'flex',flexDirection:'column',gap:2}}>
                        <div className="quote-total">₱{fmt(quote.grandTotal||quote.subtotal)}</div>
                        {quote.validUntil && (
                          <div style={{fontSize:11,color:isExpired?'#94A3B8':'#64748B',fontWeight:500}}>
                            Valid Until: <span style={{fontWeight:700,color:isExpired?'#94A3B8':'var(--ink)'}}>{fmtDate(quote.validUntil)}</span>
                          </div>
                        )}
                      </div>
                      <div className="quote-exp" style={{color:isPending?'var(--purple)':isRejected?'var(--red)':isExpired?'#94A3B8':'var(--green)',textAlign:'right'}}>
                        {isPending
                          ? `Step ${(quote.approvalStepIndex||0)+1} of ${quote.approvalTotalSteps||1}`
                          : isRejected
                          ? 'Rejected'
                          : isExpired
                          ? <span style={{display:'flex',alignItems:'center',gap:4,fontSize:11,color:'#94A3B8',fontWeight:600,padding:'4px 10px',background:'#F1F5F9',border:'1px solid #E2E8F0',borderRadius:6}}>
                              <svg width="11" height="11" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                              Download Disabled
                            </span>
                          : <span style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:11,color:'#166534',fontWeight:600,padding:'4px 10px',background:'#DCFCE7',border:'1px solid #A7F3D0',borderRadius:6}}>
                              <svg width="11" height="11" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                              Download PDF
                            </span>
                        }
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )
        )}
      </div>

      {/* ── FOOTER ── */}
      <ShopFooter footerData={footerData}/>

      {/* ── ORDER DRAWER ── */}
      {selectedOrder && (() => {
        const isOrderOwner = selectedOrder.customerId === user?.uid || selectedOrder.userId === user?.uid;
        const shippedTs = selectedOrder.shippedAt?.toDate ? selectedOrder.shippedAt.toDate() : null;
        const daysSinceShipped = shippedTs ? Math.floor((Date.now() - shippedTs.getTime()) / 86400000) : 0;
        const thresholdDays = shippingSettings.receivedAfterDays ?? 7;
        const canMarkReceived = isOrderOwner && selectedOrder.status === 'shipped' && daysSinceShipped >= thresholdDays;
        return (
          <OrderDrawer
            order={selectedOrder}
            onClose={()=>setSelectedOrder(null)}
            onCancel={()=>setCancelTarget(selectedOrder)}
            isAdmin={userRole==='admin'}
            cancelling={cancelling}
            onMarkReceived={handleMarkReceived}
            canMarkReceived={canMarkReceived}
            markingReceived={markingReceived}
          />
        );
      })()}

      {/* ── QUOTE DRAWER ── */}
      {selectedQuote && (
        <QuoteDrawer quote={selectedQuote} onClose={()=>setSelectedQuote(null)}/>
      )}

      {/* ── CANCEL CONFIRM MODAL ── */}
      {cancelTarget && (
        <div className="modal-ov" onClick={()=>{if(!cancelling){setCancelTarget(null);setCancelReasonText('');}}}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
              <div style={{width:40,height:40,borderRadius:10,background:'#FEE2E2',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <svg width="18" height="18" fill="none" stroke="#DC2626" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
              </div>
              <div>
                <div style={{fontSize:15,fontWeight:700,color:'#111',marginBottom:2}}>Cancel Order</div>
                <div style={{fontSize:12,color:'#6B7280',fontFamily:'monospace'}}>{cancelTarget.orderNumber}</div>
              </div>
            </div>

            {/* Context: will stock be restored? */}
            {['packed','ready_for_shipment','shipped','completed'].includes(cancelTarget.status) ? (
              <div style={{background:'#FFF7ED',border:'1px solid #FED7AA',borderRadius:8,padding:'10px 14px',marginBottom:14,display:'flex',alignItems:'flex-start',gap:9}}>
                <svg width="15" height="15" fill="none" stroke="#D97706" strokeWidth="2" viewBox="0 0 24 24" style={{flexShrink:0,marginTop:1}}><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                <div style={{fontSize:12,color:'#92400E',lineHeight:1.55}}>
                  <strong>Stock will be restored.</strong> This order has already been packed and stock was deducted. Cancelling will return the packed quantities back to inventory.
                </div>
              </div>
            ) : (
              <div style={{background:'#F0FDF4',border:'1px solid #BBF7D0',borderRadius:8,padding:'10px 14px',marginBottom:14,display:'flex',alignItems:'flex-start',gap:9}}>
                <svg width="15" height="15" fill="none" stroke="#059669" strokeWidth="2" viewBox="0 0 24 24" style={{flexShrink:0,marginTop:1}}><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <div style={{fontSize:12,color:'#065F46',lineHeight:1.55}}>
                  <strong>No stock change.</strong> Stock was not yet deducted for this order (it hasn't been packed). Cancelling will simply void the order — inventory is unaffected.
                </div>
              </div>
            )}

            {/* Required reason */}
            <div style={{marginBottom:16}}>
              <label style={{display:'block',fontSize:12,fontWeight:600,color:'#374151',marginBottom:6}}>
                Reason for cancellation <span style={{color:'#DC2626'}}>*</span>
              </label>
              <textarea
                value={cancelReasonText}
                onChange={e=>setCancelReasonText(e.target.value)}
                rows={3}
                placeholder="Please state the reason for cancelling this order…"
                style={{width:'100%',padding:'9px 12px',border:'1.5px solid #E5E7EB',borderRadius:8,
                  fontSize:13,fontFamily:'inherit',resize:'vertical',outline:'none',
                  borderColor:cancelReasonText.trim().length>0?'#6B7280':'#E5E7EB',
                  boxSizing:'border-box'}}
              />
              {cancelReasonText.trim().length === 0 && (
                <div style={{fontSize:11,color:'#9CA3AF',marginTop:4}}>A reason is required before cancelling.</div>
              )}
            </div>

            <div style={{display:'flex',gap:10}}>
              <button className="btn-cancel-modal"
                onClick={()=>{setCancelTarget(null);setCancelReasonText('');}}
                disabled={cancelling}>
                Keep Order
              </button>
              <button className="btn-confirm-red"
                onClick={handleCancel}
                disabled={cancelling || cancelReasonText.trim().length === 0}>
                {cancelling ? 'Cancelling…' : 'Confirm Cancel'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── TOAST ── */}
      {toast && <Toast msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}

      {/* ── MARK AS RECEIVED MODAL ── */}
      {receiveTarget && (
        <div className="modal-ov" onClick={()=>{if(!markingReceived)setReceiveTarget(null);}}>
          <div className="rcv-modal" onClick={e=>e.stopPropagation()}>

            {/* Green gradient header */}
            <div style={{background:'linear-gradient(135deg,#059669,#047857)',padding:'28px 32px 24px'}}>
              <div style={{display:'flex',alignItems:'center',gap:14}}>
                <div style={{width:52,height:52,borderRadius:14,background:'rgba(255,255,255,0.18)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,border:'1.5px solid rgba(255,255,255,0.28)'}}>
                  <svg width="26" height="26" fill="none" stroke="#fff" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                </div>
                <div>
                  <div style={{fontSize:10,fontWeight:700,color:'rgba(255,255,255,0.65)',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:3}}>Confirm Delivery</div>
                  <div style={{fontSize:20,fontWeight:900,color:'#fff',fontFamily:'DM Mono,monospace'}}>{receiveTarget.orderNumber}</div>
                  <div style={{fontSize:12,color:'rgba(255,255,255,0.7)',marginTop:2}}>{receiveTarget.customerName || receiveTarget.customerEmail}</div>
                </div>
                {!markingReceived && (
                  <button onClick={()=>setReceiveTarget(null)} style={{marginLeft:'auto',width:30,height:30,borderRadius:8,background:'rgba(255,255,255,0.15)',border:'none',color:'#fff',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    <svg width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                  </button>
                )}
              </div>
            </div>

            {/* Body */}
            <div style={{padding:'22px 28px 26px'}}>

              {/* Items summary */}
              <div style={{background:'#F0FDF4',border:'1px solid #BBF7D0',borderRadius:12,padding:'14px 16px',marginBottom:18}}>
                <div style={{fontSize:10,fontWeight:700,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:10}}>Order Items</div>
                <div style={{display:'flex',flexDirection:'column',gap:7}}>
                  {(receiveTarget.items||[]).slice(0,4).map((item,i)=>(
                    <div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
                      <div style={{display:'flex',alignItems:'center',gap:8,flex:1,minWidth:0}}>
                        {item.imageUrl
                          ? <img src={item.imageUrl} style={{width:28,height:28,borderRadius:6,objectFit:'cover',border:'1px solid #D1FAE5',flexShrink:0}} alt=""/>
                          : <div style={{width:28,height:28,borderRadius:6,background:'#D1FAE5',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><svg width="13" height="13" fill="none" stroke="#059669" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg></div>
                        }
                        <span style={{fontSize:12,fontWeight:600,color:'#1E293B',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</span>
                      </div>
                      <span style={{fontSize:12,fontWeight:700,color:'#059669',flexShrink:0}}>×{item.quantity}</span>
                    </div>
                  ))}
                  {(receiveTarget.items||[]).length > 4 && (
                    <div style={{fontSize:11,color:'#6B7280',fontWeight:600}}>+{receiveTarget.items.length-4} more item{receiveTarget.items.length-4!==1?'s':''}</div>
                  )}
                </div>
              </div>

              {/* Confirmation notice */}
              <div style={{background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:10,padding:'11px 14px',marginBottom:20,display:'flex',alignItems:'flex-start',gap:9}}>
                <svg width="15" height="15" fill="none" stroke="#D97706" strokeWidth="2" viewBox="0 0 24 24" style={{flexShrink:0,marginTop:1}}><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                <div style={{fontSize:11,color:'#92400E',lineHeight:1.6}}>
                  By confirming receipt, you acknowledge that <strong>all items have been delivered in good condition</strong>. This action will mark the order as <strong>Completed</strong> and cannot be undone.
                </div>
              </div>

              {/* Total */}
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'11px 0',borderTop:'1px solid #F1F5F9',borderBottom:'1px solid #F1F5F9',marginBottom:20}}>
                <span style={{fontSize:12,fontWeight:600,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'.06em'}}>Order Total</span>
                <span style={{fontSize:18,fontWeight:900,color:'#1E293B',fontVariantNumeric:'tabular-nums'}}>₱{(receiveTarget.totalAmount||0).toLocaleString('en-PH',{minimumFractionDigits:2})}</span>
              </div>

              {/* Buttons */}
              <div style={{display:'flex',gap:10}}>
                <button onClick={()=>{if(!markingReceived)setReceiveTarget(null);}} disabled={markingReceived}
                  style={{flex:1,padding:'12px',background:'#fff',color:'#475569',border:'1.5px solid #E2E8F0',borderRadius:12,fontWeight:700,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>
                  Not Yet
                </button>
                <button onClick={confirmMarkReceived} disabled={markingReceived}
                  style={{flex:2,padding:'12px',background:markingReceived?'#94A3B8':'linear-gradient(135deg,#059669,#047857)',color:'#fff',border:'none',borderRadius:12,fontWeight:800,fontSize:13,cursor:markingReceived?'not-allowed':'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',justifyContent:'center',gap:8,boxShadow:markingReceived?'none':'0 4px 14px rgba(5,150,105,0.3)',transition:'all .15s'}}>
                  {markingReceived
                    ? <><span style={{width:14,height:14,border:'2px solid rgba(255,255,255,.3)',borderTopColor:'#fff',borderRadius:'50%',display:'inline-block',animation:'spin .7s linear infinite'}}/> Confirming…</>
                    : <><svg width="15" height="15" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg> Yes, I Received My Order</>
                  }
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
