<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operix — My Orders</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0C1220;--ink2:#1E2D45;--slate:#64748B;
  --line:#E4EAF2;--surf:#F4F7FB;--white:#fff;
  --blue:#0057FF;--blue-d:#003FBB;--blue-bg:#EEF4FF;
  --green:#059669;--green-bg:#ECFDF5;
  --amber:#D97706;--amber-bg:#FFFBEB;
  --red:#DC2626;--red-bg:#FFF1F2;
  --purple:#7C3AED;--purple-bg:#F5F3FF;
  --cyan:#0891B2;--cyan-bg:#ECFEFF;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--surf);color:var(--ink);min-height:100vh}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#D1D9E6;border-radius:99px}

/* ── TOPBAR ── */
.tb{position:sticky;top:0;z-index:200;background:var(--ink);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid rgba(255,255,255,.06)}
.tb-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.tb-brand b{font-size:17px;font-weight:800;color:#fff;letter-spacing:-.4px}
.tb-brand small{font-size:9px;color:#64748B;font-weight:600;letter-spacing:.12em;text-transform:uppercase;display:block;margin-top:-2px}

/* ── PAGE LAYOUT ── */
.page{max-width:1200px;margin:0 auto;padding:32px 24px}

/* ── PAGE HEADER ── */
.page-hd{margin-bottom:28px}
.page-hd h1{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.5px;margin-bottom:4px}
.page-hd p{font-size:13px;color:var(--slate)}
.page-hd-row{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}

/* ── STATS ROW ── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;transition:box-shadow .18s,border-color .18s;position:relative;overflow:hidden}
.stat-card:hover{box-shadow:0 4px 18px rgba(0,0,0,.07);border-color:#D4DCEC}
.stat-card-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;flex-shrink:0}
.stat-val{font-size:26px;font-weight:800;letter-spacing:-.7px;line-height:1}
.stat-lbl{font-size:11px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.06em}
.stat-dot{width:8px;height:8px;border-radius:50%;margin-bottom:6px}

/* ── FILTER BAR ── */
.filter-bar{background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.4}
.search-inp{width:100%;padding:8px 12px 8px 34px;border:1.5px solid var(--line);border-radius:9px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:border .18s;background:var(--surf);color:var(--ink)}
.search-inp:focus{border-color:var(--blue);background:#fff}
.filter-sel{padding:8px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:12px;font-family:'DM Sans',sans-serif;outline:none;background:var(--surf);color:var(--ink);cursor:pointer;transition:border .18s}
.filter-sel:focus{border-color:var(--blue)}
.status-tabs{display:flex;gap:4px;flex-wrap:wrap}
.stab{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;border:1.5px solid transparent;cursor:pointer;transition:all .15s;background:none;font-family:'DM Sans',sans-serif;white-space:nowrap}
.stab:hover{background:var(--surf)}
.stab.active{background:var(--blue-bg);color:var(--blue);border-color:#BFDBFE}

/* ── ORDER TABLE ── */
.orders-wrap{background:var(--white);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.orders-table{width:100%;border-collapse:collapse}
.orders-table thead tr{background:linear-gradient(135deg,#0C1220 0%,#1E2D45 100%)}
.orders-table thead th{padding:12px 16px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#94A3B8;white-space:nowrap;user-select:none}
.orders-table thead th.sortable{cursor:pointer;transition:color .15s}
.orders-table thead th.sortable:hover{color:#fff}
.orders-table tbody tr{border-bottom:1px solid var(--line);cursor:pointer;transition:background .14s}
.orders-table tbody tr:last-child{border-bottom:none}
.orders-table tbody tr:hover{background:#F8FAFF}
.orders-table td{padding:13px 16px;font-size:13px;vertical-align:middle}
.ord-num{font-weight:700;color:var(--blue);font-family:'DM Mono',monospace;font-size:12px}
.ord-date{font-size:12px;color:var(--slate)}
.ord-items-preview{display:flex;gap:4px;flex-wrap:wrap;max-width:260px}
.item-chip{display:inline-flex;align-items:center;gap:4px;background:var(--surf);border:1px solid var(--line);border-radius:5px;padding:2px 7px;font-size:11px;color:var(--ink);font-weight:500;white-space:nowrap}
.item-chip img{width:16px;height:16px;object-fit:cover;border-radius:3px}
.item-more{font-size:10px;font-weight:700;color:var(--slate);padding:2px 6px}
.ord-total{font-weight:800;font-size:14px;color:var(--ink);white-space:nowrap}
.ord-buyer{font-size:12px;color:var(--slate);display:flex;align-items:center;gap:5px}
.ord-buyer-av{width:22px;height:22px;background:var(--blue-bg);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--blue);flex-shrink:0}

/* ── STATUS BADGE ── */
.s-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.s-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.s-pending{background:#DBEAFE;color:#1D4ED8}.s-pending .s-dot{background:#3B82F6}
.s-approval{background:#F5F3FF;color:#5B21B6;border:1px solid #DDD6FE}.s-approval .s-dot{background:#7C3AED;animation:pulse 1.4s infinite}
.s-processing{background:#FEF3C7;color:#92400E}.s-processing .s-dot{background:#F59E0B;animation:pulse 1.4s infinite}
.s-completed{background:var(--green-bg);color:#065F46}.s-completed .s-dot{background:var(--green)}
.s-cancelled{background:#F1F5F9;color:#475569}.s-cancelled .s-dot{background:#94A3B8}
.s-confirmed{background:var(--purple-bg);color:#5B21B6}.s-confirmed .s-dot{background:var(--purple)}
.s-shipped{background:var(--cyan-bg);color:#0E7490}.s-shipped .s-dot{background:var(--cyan)}
.s-onhold{background:#FFFBEB;color:#92400E;border:1px solid #FDE68A}.s-onhold .s-dot{background:#D97706;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── EMPTY STATE ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 32px;text-align:center;gap:10px}
.empty-icon{width:64px;height:64px;background:var(--surf);border-radius:18px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.empty h3{font-size:15px;font-weight:700;color:var(--ink)}
.empty p{font-size:13px;color:var(--slate);max-width:280px;line-height:1.6}
.empty-btn{display:inline-flex;align-items:center;gap:7px;background:var(--blue);color:#fff;padding:9px 20px;border-radius:9px;font-size:13px;font-weight:700;text-decoration:none;transition:all .18s;margin-top:4px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif}
.empty-btn:hover{background:var(--blue-d);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,87,255,.35)}

/* ── DETAIL DRAWER ── */
.drawer-ov{position:fixed;inset:0;background:rgba(12,18,32,.55);backdrop-filter:blur(4px);z-index:800;display:flex;justify-content:flex-end;animation:fadeIn .2s ease}
.drawer{width:100%;max-width:600px;height:100%;background:var(--white);overflow-y:auto;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.18);animation:slideIn .25s cubic-bezier(.4,0,.2,1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.drawer-hd{background:var(--ink);padding:22px 24px;display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0}
.drawer-hd-left h2{font-size:16px;font-weight:800;color:#fff;letter-spacing:-.3px}
.drawer-hd-left p{font-size:11px;color:#64748B;margin-top:3px}
.drawer-close{width:32px;height:32px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#94A3B8;transition:all .18s;flex-shrink:0}
.drawer-close:hover{background:rgba(255,255,255,.15);color:#fff}
.drawer-body{padding:22px 24px;flex:1;display:flex;flex-direction:column;gap:20px}

/* ── ORDER TIMELINE ── */
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:14px;position:relative}
.tl-item:not(:last-child) .tl-line{position:absolute;left:11px;top:24px;bottom:-4px;width:2px;background:var(--line)}
.tl-item.done .tl-line{background:var(--green)}
.tl-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1;margin-top:2px}
.tl-icon.done{background:var(--green);border:2px solid var(--green)}
.tl-icon.active{background:var(--blue);border:2px solid var(--blue);box-shadow:0 0 0 4px #BFDBFE}
.tl-icon.pending{background:var(--white);border:2px solid var(--line)}
.tl-content{padding-bottom:18px;flex:1}
.tl-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:1px}
.tl-title.muted{color:var(--slate)}
.tl-date{font-size:11px;color:var(--slate)}

/* ── SECTION CARD ── */
.sec-card{background:var(--surf);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.sec-card-hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sec-card-hd span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--slate)}
.sec-card-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}

/* ── INFO ROW ── */
.info-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.info-lbl{font-size:12px;color:var(--slate);flex-shrink:0}
.info-val{font-size:12px;font-weight:600;color:var(--ink);text-align:right}

/* ── ORDER ITEMS ── */
.order-item-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.order-item-row:last-child{border-bottom:none}
.oi-img{width:44px;height:44px;border-radius:9px;object-fit:cover;border:1.5px solid var(--line);flex-shrink:0}
.oi-img-ph{width:44px;height:44px;border-radius:9px;background:var(--surf);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.oi-name{font-size:13px;font-weight:700;color:var(--ink);line-height:1.3;margin-bottom:2px}
.oi-meta{font-size:11px;color:var(--slate)}
.oi-total{font-size:13px;font-weight:800;color:var(--ink);white-space:nowrap;margin-left:auto}

/* ── CANCEL BTN ── */
.cancel-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:11px;background:var(--red-bg);color:var(--red);border:1.5px solid #FECACA;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .18s}
.cancel-btn:hover{background:#FEE2E2;border-color:#FCA5A5}
.cancel-btn:disabled{opacity:.5;cursor:not-allowed}

/* ── PAGINATION ── */
.pag{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-top:1px solid var(--line);gap:10px;flex-wrap:wrap}
.pag-info{font-size:12px;color:var(--slate)}
.pag-btns{display:flex;gap:4px;align-items:center}
.pag-btn{width:30px;height:30px;border:1.5px solid var(--line);border-radius:7px;background:var(--white);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:'DM Sans',sans-serif;color:var(--ink)}
.pag-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.pag-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.pag-btn:disabled{opacity:.35;cursor:not-allowed}
.pag-jump{display:flex;align-items:center;gap:6px}
.pag-jump input{width:48px;padding:5px 8px;border:1.5px solid var(--line);border-radius:7px;font-size:12px;text-align:center;outline:none;font-family:'DM Sans',sans-serif}
.pag-jump input:focus{border-color:var(--blue)}
.pag-jump button{padding:5px 10px;background:var(--blue);color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}

/* ── LOADING ── */
.spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:320px;gap:14px}
.loading-wrap p{font-size:13px;color:var(--slate)}

/* ── CONFIRM MODAL ── */
.modal-ov{position:fixed;inset:0;background:rgba(12,18,32,.6);backdrop-filter:blur(4px);z-index:900;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s}
.modal{background:var(--white);border-radius:18px;width:100%;max-width:420px;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,.25)}
.modal-hd{background:var(--red-bg);padding:20px 24px;border-bottom:1px solid #FECACA;display:flex;align-items:center;gap:10px}
.modal-hd h3{font-size:15px;font-weight:800;color:var(--red)}
.modal-body{padding:20px 24px}
.modal-body p{font-size:13px;color:var(--slate);line-height:1.65}
.modal-footer{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.btn-cancel-modal{padding:9px 20px;border:1.5px solid var(--line);border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;background:var(--white);font-family:'DM Sans',sans-serif;color:var(--ink);transition:background .15s}
.btn-cancel-modal:hover{background:var(--surf)}
.btn-confirm-red{padding:9px 20px;background:var(--red);color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .15s}
.btn-confirm-red:hover{background:#B91C1C}
.btn-confirm-red:disabled{opacity:.6;cursor:not-allowed}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:slideUp .25s ease;border-left:3px solid var(--green)}
.toast.error{border-left-color:var(--red)}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── QUOTES TAB ── */
.quote-card{background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;transition:box-shadow .18s,border-color .18s;cursor:pointer}
.quote-card:hover{border-color:#BFCFEF;box-shadow:0 6px 20px rgba(0,87,255,.07)}
.quote-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px}
.quote-num{font-size:13px;font-weight:800;color:var(--blue);font-family:'DM Mono',monospace}
.quote-meta{font-size:11px;color:var(--slate);margin-top:2px}
.q-badge-active{background:#DCFCE7;color:#166534;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700}
.q-badge-expired{background:#F1F5F9;color:#64748B;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700}
.q-badge-pending{background:#F5F3FF;color:#5B21B6;border:1px solid #DDD6FE;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.q-badge-pending::before{content:'';width:6px;height:6px;border-radius:50%;background:#7C3AED;animation:pulse 1.4s infinite;flex-shrink:0}
.q-badge-approved{background:#DCFCE7;color:#166534;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700}
.q-badge-rejected{background:#FEE2E2;color:#991B1B;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700}
/* expired — more prominent, uses red-toned neutral */
.q-badge-expired{background:#F1F5F9;color:#475569;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid #CBD5E1}
/* approval chain in quote drawer */
.appr-chain{display:flex;flex-direction:column;gap:0}
.appr-step{display:flex;gap:10px;position:relative;padding-bottom:12px}
.appr-step:not(:last-child)::before{content:'';position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.appr-step.done::before{background:var(--green)}
.appr-step-dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;margin-top:2px}
.appr-step-dot.done{background:var(--green);border:2px solid var(--green)}
.appr-step-dot.active{background:var(--purple);border:2px solid var(--purple);box-shadow:0 0 0 3px #DDD6FE}
.appr-step-dot.pending{background:#fff;border:2px solid var(--line)}
.quote-items{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.quote-footer{display:flex;justify-content:space-between;align-items:center}
.quote-total{font-size:15px;font-weight:800;color:var(--ink)}
.quote-exp{font-size:11px;color:var(--slate)}

/* ── TAB NAV ── */
.tab-nav{display:flex;gap:2px;background:var(--surf);border:1.5px solid var(--line);border-radius:12px;padding:4px;margin-bottom:20px;width:fit-content}
.tab-btn{padding:8px 18px;border-radius:9px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .18s;background:none;color:var(--slate);display:flex;align-items:center;gap:6px}
.tab-btn:hover{color:var(--ink)}
.tab-btn.active{background:var(--white);color:var(--blue);box-shadow:0 1px 6px rgba(0,0,0,.08);font-weight:700}
.tab-cnt{background:var(--blue);color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tab-btn.active .tab-cnt{background:var(--blue)}
.tab-btn:not(.active) .tab-cnt{background:var(--slate)}

@media(max-width:640px){
  .page{padding:16px 12px}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .drawer{max-width:100%}
  .tb{padding:0 16px}
  .orders-table thead th:nth-child(3),.orders-table td:nth-child(3),
  .orders-table thead th:nth-child(5),.orders-table td:nth-child(5){display:none}
}

/* ── QUOTE PRINT OVERLAY ── */
.qp-overlay{position:fixed;inset:0;background:rgba(12,18,32,.72);backdrop-filter:blur(4px);z-index:900;display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:20px}
.qp-toolbar{display:flex;align-items:center;gap:10px;background:#1E2D45;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 16px;margin-bottom:16px;flex-shrink:0;width:100%;max-width:854px}
.qp-toolbar-title{font-size:13px;font-weight:700;color:#fff;flex:1}

const STATUS_CONFIG = {

const TIMELINE_STEPS = [

];

function StatusBadge({ status }) {
  const cfg = STATUS_CONFIG[status] || STATUS_CONFIG.pending;
  return (
    <span className={`s-badge ${cfg.cls}`}>
      <span className="s-dot"/>
      {cfg.label}

  );
}

function Toast({ msg, type='success', onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 3000); return ()=>clearTimeout(t); });
  return <div className={`toast ${type==='error'?'error':''}`}>{type==='success'?'✓':'!'} {msg}</div>;
}

function OrderTimeline({ status, order }) {
  const currentStep = STATUS_CONFIG[status]?.step ?? 0;
  if (status === 'pending_approval') {
    return (
      <div style={{display:'flex',alignItems:'flex-start',gap:12,padding:'14px 16px',background:'#F5F3FF',border:'1.5px solid #DDD6FE',borderRadius:10}}>

          <svg width="14" height="14" fill="none" stroke="#fff" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        </div>
        <div>
          <div style={{fontWeight:700,fontSize:13,color:'#5B21B6'}}>Pending Approval</div>
          <div style={{fontSize:12,color:'#7C3AED',marginTop:3,lineHeight:1.5}}>
            Your order has been submitted and is awaiting approval
            {order?.orderApprovalGroupName ? ` via "${order.orderApprovalGroupName}"` : ''}.
            You'll receive a notification once it's approved or if there's an issue.
          </div>
        </div>
      </div>
    );
  }
  if (status === 'cancelled') {
    return (
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:10,padding:'12px 14px',background:'#FEF2F2',border:'1.5px solid #FECACA',borderRadius:10}}>
          <svg width="16" height="16" fill="none" stroke="#DC2626" strokeWidth="2" viewBox="0 0 24 24" style={{flexShrink:0,marginTop:1}}><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:13,color:'#DC2626'}}>Order Cancelled</div>
            {(order.cancelReason||order.cancellationReason) && (
              <div style={{marginTop:8,padding:'7px 10px',background:'#FEE2E2',borderRadius:6,border:'1px solid #FECACA'}}>
                <div style={{fontSize:10,fontWeight:700,color:'#991B1B',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:3}}>Reason</div>
                <div style={{fontSize:12,color:'#7F1D1D',lineHeight:1.5,fontStyle:'italic'}}>"{order.cancelReason||order.cancellationReason}"</div>
              </div>
            )}
          </div>
        </div>
        {order.status==='on_hold' && (
          <div style={{display:'flex',alignItems:'flex-start',gap:10,padding:'12px 14px',background:'#FFFBEB',border:'1.5px solid #FDE68A',borderRadius:10}}>
            <svg width="16" height="16" fill="none" stroke="#D97706" strokeWidth="2" viewBox="0 0 24 24" style={{flexShrink:0,marginTop:1}}><path strokeLinecap="round" strokeLinejoin="round" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:13,color:'#D97706'}}>Order On Hold</div>
              <div style={{fontSize:11,color:'#B45309',marginTop:2}}>This order is currently on hold.</div>
              {order.holdReason&&(
                <div style={{marginTop:8,padding:'7px 10px',background:'#FEF3C7',borderRadius:6,border:'1px solid #FDE68A'}}>
                  <div style={{fontSize:10,fontWeight:700,color:'#92400E',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:3}}>Reason</div>
                  <div style={{fontSize:12,color:'#78350F',lineHeight:1.5,fontStyle:'italic'}}>"{order.holdReason}"</div>
                </div>
              )}
            </div>
          </div>
        )}
      </div>
    );
  }
  if (status === 'on_hold') {
    return (
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:12,padding:'14px 16px',background:'#FFFBEB',border:'1.5px solid #FDE68A',borderRadius:10}}>
          <div style={{width:32,height:32,borderRadius:'50%',background:'#D97706',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,boxShadow:'0 0 0 4px #FEF3C7'}}>
            <svg width="14" height="14" fill="none" stroke="#fff" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </div>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:13,color:'#92400E'}}>Order On Hold</div>
            <div style={{fontSize:12,color:'#B45309',marginTop:3,lineHeight:1.5}}>
              Your order is currently on hold.

            {order?.holdReason && (

                <div style={{fontSize:10,fontWeight:700,color:'#92400E',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:4}}>Reason</div>

              </div>
            )}
          </div>
        </div>
      </div>
    );
  }
  return (
    <div className="timeline">
      {TIMELINE_STEPS.map((step, i) => {
        const done = currentStep > i;
        const active = currentStep === i;
        const isLast = i === TIMELINE_STEPS.length - 1;
        return (
          <div key={step.key} className={`tl-item ${done?'done':''}`}>
            {!isLast && <div className="tl-line"/>}
            <div className={`tl-icon ${done?'done':active?'active':'pending'}`}>
              {done
                ? <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3.5"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>

                  : <div style={{width:7,height:7,borderRadius:'50%',background:'#CBD5E1'}}/>
              }
            </div>
            <div className="tl-content">
              <div className={`tl-title ${!done&&!active?'muted':''}`}>{step.label}</div>
              <div className="tl-date">{step.desc}</div>
            </div>
          </div>
        );
      })}

  );
}

function OrderDrawer({ order, onClose, onCancel, isAdmin, cancelling, onMarkReceived, canMarkReceived, markingReceived }) {
  const currency = order.items?.[0]?.currency || order.currency || 'PHP';
  const cs = getCurrencySymbol(currency);
  const _sd = order.shipmentDetails || {};
  const sd = (order.shipmentCourier || order.trackingNumber || order.shipmentMode || _sd.courier)
    ? {
        courier:        order.shipmentCourier || _sd.courier        || null,
        trackingNumber: order.trackingNumber  || _sd.trackingNumber || null,
        shipmentNumber: order.shipmentNumber  || _sd.shipmentNumber || null,
        shippedAt:      order.shippedAt       || null,
      }
    : null;

  const CANCEL_LOCKED = ['pending_approval','ready_for_shipment','packed','shipped','completed','cancelled'];

  /* ── Fluent row helper: label on left, value on right ── */
  const FRow = ({label, value}) => value && value !== '—' ? (
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',padding:'9px 0',borderBottom:'1px solid #F1F5F9',gap:16}}>
      <span style={{fontSize:12,color:'#64748B',flexShrink:0,lineHeight:1.5}}>{label}</span>
      <span style={{fontSize:12,fontWeight:600,color:'#0C1220',textAlign:'right',lineHeight:1.5,wordBreak:'break-word',maxWidth:'60%'}}>{value}</span>
    </div>
  ) : null;

  /* ── Section header ── */
  const SectionHead = ({label, icon}) => (
    <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.09em',color:'#94A3B8',marginBottom:4,marginTop:4,display:'flex',alignItems:'center',gap:6}}>
      {icon && <span style={{opacity:.7}}>{icon}</span>}
      {label}
    </div>
  );

  return (
    <div className="drawer-ov" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="drawer" style={{display:'flex',flexDirection:'column'}}>

        {/* ── HEADER ── */}
        <div style={{background:'#0C1220',padding:'20px 24px 16px',flexShrink:0}}>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
            <div>
              <div style={{fontSize:10,fontWeight:600,color:'#475569',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:5}}>Order Details</div>
              <div style={{fontSize:18,fontWeight:800,color:'#fff',letterSpacing:'-.3px',fontFamily:'DM Mono,monospace'}}>
                {order.orderNumber || '#'+order.id?.slice(-8).toUpperCase()}
              </div>
              <div style={{fontSize:12,color:'#64748B',marginTop:4}}>Placed {fmtDateTime(order.createdAt)}</div>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
              <StatusBadge status={order.status}/>
              <button className="drawer-close" onClick={onClose} style={{marginLeft:4}}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>
          </div>
        </div>

        {/* ── BODY ── */}
        <div style={{flex:1,overflowY:'auto',padding:'0'}}>

          {/* ── STATUS TIMELINE ── */}
          <div style={{padding:'20px 24px',borderBottom:'1px solid #F1F5F9'}}>
            <SectionHead label="Order Status" icon={<svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>}/>
            <OrderTimeline status={order.status} order={order}/>
          </div>

          {/* ── ORDER ITEMS ── */}
          <div style={{padding:'20px 24px',borderBottom:'1px solid #F1F5F9'}}>
            <SectionHead label={`Items · ${order.items?.length || 0}`} icon={<svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>}/>
            <div style={{marginTop:8,display:'flex',flexDirection:'column',gap:0}}>
              {(order.items||[]).map((item,i) => (
                <div key={i} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 0',borderBottom:'1px solid #F8FAFF'}}>
                  {item.imageUrl
                    ? <img src={item.imageUrl} alt={item.name} style={{width:40,height:40,borderRadius:6,objectFit:'cover',border:'1px solid #E4EAF2',flexShrink:0}}/>
                    : <div style={{width:40,height:40,borderRadius:6,background:'#F4F7FB',border:'1px solid #E4EAF2',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" strokeWidth="1.5"><path strokeLinecap="round" strokeLinejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                      </div>
                  }
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600,color:'#0C1220',lineHeight:1.3,marginBottom:2}}>{item.name}</div>
                    <div style={{fontSize:11,color:'#64748B'}}>
                      {item.sku && <span style={{fontFamily:'DM Mono',marginRight:6}}>{item.sku}</span>}
                      Qty: {item.quantity}{item.unit && ` · ${item.unit}`}
                      {item.leadTime && <span style={{marginLeft:6,color:'#D97706',fontWeight:600}}> · {item.leadTime}d lead</span>}
                    </div>
                    {item.needByDate && (
                      <div style={{fontSize:10,marginTop:2,color:'#0057FF',fontWeight:600}}>
                        {item.tentativeDelivery ? `Est. Delivery: ${fmtDate({toDate:()=>new Date(item.tentativeDelivery+'T00:00:00')})}` : ''}
                        {item.needByDate ? ` · Need by: ${fmtDate({toDate:()=>new Date(item.needByDate+'T00:00:00')})}` : ''}
                      </div>
                    )}
                  </div>
                  <div style={{fontSize:13,fontWeight:700,color:'#0C1220',flexShrink:0}}>
                    ₱{fmt(item.phpSubtotal!=null?item.phpSubtotal:(item.phpPrice!=null?item.phpPrice*item.quantity:item.price*item.quantity))}
                  </div>
                </div>
              ))}
            </div>
            {/* Total row */}
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:14,marginTop:4}}>
              <span style={{fontSize:13,fontWeight:600,color:'#64748B'}}>Order Total</span>
              <span style={{fontSize:20,fontWeight:800,color:'#0C1220',letterSpacing:'-.5px'}}>
                ₱{fmt(order.totalAmountPhp!=null?order.totalAmountPhp:order.totalAmount)}
              </span>
            </div>
          </div>

          {/* ── ORDER INFO ── */}
          <div style={{padding:'20px 24px',borderBottom:'1px solid #F1F5F9'}}>
            <SectionHead label="Order Information" icon={<svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>}/>
            <div style={{marginTop:8}}>
              <FRow label="Order Number"     value={order.orderNumber}/>
              <FRow label="Customer"         value={order.customerName}/>
              <FRow label="Email"            value={order.customerEmail}/>
              <FRow label="Phone"            value={order.customerPhone}/>
              <FRow label="Delivery Address" value={order.deliveryAddress}/>
              <FRow label="Payment Method"   value={order.paymentMethod}/>
              <FRow label="Notes"            value={order.notes}/>
              <FRow label="Order Date"       value={fmtDateTime(order.createdAt)}/>
              <FRow label="Last Updated"     value={fmtDateTime(order.updatedAt)}/>
            </div>
          </div>

          {/* ── SHIPMENT & TRACKING — only Courier + Tracking # + Shipped On ── */}
          {['shipped','completed'].includes(order.status) && sd && (
            <div style={{padding:'20px 24px',borderBottom:'1px solid #F1F5F9'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
                <SectionHead label="Shipment & Tracking" icon={<svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><rect x="1" y="3" width="15" height="13" rx="1"/><path strokeLinecap="round" strokeLinejoin="round" d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>}/>
                <span style={{fontSize:10,fontWeight:700,padding:'3px 10px',borderRadius:20,
                  background:order.status==='completed'?'#ECFDF5':'#EFF6FF',
                  color:order.status==='completed'?'#059669':'#0057FF',
                  border:order.status==='completed'?'1px solid #A7F3D0':'1px solid #BFDBFE'}}>
                  {order.status==='completed'?'Delivered':'In Transit'}
                </span>
              </div>

              {/* Tracking number — prominent */}
              {sd.trackingNumber && (
                <div style={{background:'#F8FAFF',border:'1px solid #E4EAF2',borderRadius:8,padding:'12px 14px',marginBottom:12,display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
                  <div>
                    <div style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:3}}>Tracking Number</div>
                    <div style={{fontFamily:'DM Mono,monospace',fontSize:14,fontWeight:700,color:'#0C1220',letterSpacing:'.06em'}}>{sd.trackingNumber}</div>
                  </div>
                  <button
                    onClick={e=>{e.stopPropagation();navigator.clipboard?.writeText(sd.trackingNumber).catch(()=>{});}}
                    style={{display:'flex',alignItems:'center',gap:5,padding:'6px 12px',background:'#0057FF',color:'#fff',border:'none',borderRadius:6,fontSize:11,fontWeight:600,cursor:'pointer',fontFamily:'inherit',flexShrink:0}}>
                    <svg width="11" height="11" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                    Copy
                  </button>
                </div>
              )}

              {/* Courier + Shipped On — clean label/value rows */}
              <div>
                <FRow label="Courier"    value={sd.courier}/>
                <FRow label="Shipped On" value={sd.shippedAt ? (sd.shippedAt.toDate ? sd.shippedAt.toDate().toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'}) : new Date(sd.shippedAt).toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'})) : null}/>
                {sd.shipmentNumber && <FRow label="Shipment #" value={sd.shipmentNumber}/>}
              </div>
            </div>
          )}

          {/* ── Mark as Received ── */}
          {order.status === 'shipped' && canMarkReceived && (
            <div style={{padding:'16px 24px',borderBottom:'1px solid #F1F5F9'}}>
              <button
                onClick={() => onMarkReceived(order)}
                disabled={markingReceived}
                style={{width:'100%',padding:'11px',background:markingReceived?'#94A3B8':'#059669',color:'#fff',border:'none',borderRadius:6,fontSize:13,fontWeight:600,cursor:markingReceived?'not-allowed':'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',justifyContent:'center',gap:8,transition:'background .15s'}}>
                {markingReceived
                  ? <><span style={{width:14,height:14,border:'2px solid rgba(255,255,255,.3)',borderTopColor:'#fff',borderRadius:'50%',display:'inline-block',animation:'spin .7s linear infinite'}}/> Confirming…</>
                  : <><svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg> Mark as Received</>
                }
              </button>
            </div>
          )}

          {/* ── In-transit notice ── */}
          {order.status === 'shipped' && !canMarkReceived && (
            <div style={{padding:'16px 24px',borderBottom:'1px solid #F1F5F9'}}>
              <div style={{display:'flex',alignItems:'flex-start',gap:10,padding:'12px 14px',background:'#FFF7ED',border:'1px solid #FED7AA',borderRadius:6}}>
                <svg width="14" height="14" fill="none" stroke="#D97706" strokeWidth="2" viewBox="0 0 24 24" style={{flexShrink:0,marginTop:1}}><path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <div>
                  <div style={{fontSize:12,fontWeight:600,color:'#92400E'}}>Your order is on its way</div>
                  <div style={{fontSize:11,color:'#B45309',marginTop:2,lineHeight:1.5}}>"Mark as Received" will be available once the delivery window has passed.</div>
                </div>
              </div>
            </div>
          )}

          {/* ── Cancellation ── */}
          {(()=>{
            const st = order.status;
            if (st === 'cancelled' || st === 'completed' || st === 'on_hold') return null;
            const wrapStyle = {padding:'16px 24px',borderBottom:'1px solid #F1F5F9'};

            if (st === 'pending_approval') return (
              <div style={wrapStyle}>
                <div style={{display:'flex',alignItems:'flex-start',gap:10,padding:'12px 14px',background:'#F5F3FF',border:'1px solid #DDD6FE',borderRadius:6}}>
                  <svg width="14" height="14" fill="none" stroke="#7C3AED" strokeWidth="2" viewBox="0 0 24 24" style={{flexShrink:0,marginTop:1}}><path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                  <div>
                    <div style={{fontSize:12,fontWeight:600,color:'#5B21B6'}}>Awaiting Approval — Cannot Cancel</div>
                    <div style={{fontSize:11,color:'#7C3AED',marginTop:2,lineHeight:1.5}}>This order is pending approval. Contact your admin to withdraw it.</div>
                  </div>
                </div>
              </div>
            );

            if (['packed','ready_for_shipment','shipped'].includes(st)) {
              const subject = encodeURIComponent(`Cancellation Request — Order ${order.orderNumber}`);
              const body = encodeURIComponent(`Hi Operix Team,\n\nI would like to request a cancellation for the following order:\n\nOrder Number: ${order.orderNumber}\nCustomer: ${order.customerName || ''}\nTotal: ₱${(order.totalAmount||0).toFixed(2)}\nStatus: ${st.replace(/_/g,' ')}\n\nReason for cancellation:\n[Please state your reason here]\n\nThank you.`);
              return (
                <div style={wrapStyle}>
                  <div style={{display:'flex',alignItems:'flex-start',gap:10,padding:'12px 14px',background:'#FFF7ED',border:'1px solid #FED7AA',borderRadius:6}}>
                    <svg width="14" height="14" fill="none" stroke="#D97706" strokeWidth="2" viewBox="0 0 24 24" style={{flexShrink:0,marginTop:1}}><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                    <div style={{flex:1}}>
                      <div style={{fontSize:12,fontWeight:600,color:'#92400E',marginBottom:6}}>
                        {st === 'shipped' ? 'Order Already Shipped' : 'Order Already Packed'}
                      </div>
                      <div style={{fontSize:11,color:'#B45309',lineHeight:1.5,marginBottom:10}}>
                        {st === 'shipped' ? 'Your order is already on its way. To request a return, please contact us.' : 'Your order is packed and ready for dispatch. Contact us as soon as possible.'}
                      </div>
                      <a href={`mailto:operix@gmail.com?subject=${subject}&body=${body}`}
                        style={{display:'inline-flex',alignItems:'center',gap:6,background:'#D97706',color:'#fff',padding:'7px 14px',borderRadius:6,fontSize:12,fontWeight:600,textDecoration:'none',fontFamily:'inherit'}}>
                        <svg width="12" height="12" fill="none" stroke="#fff" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                        Contact Us
                      </a>
                    </div>
                  </div>
                </div>
              );
            }

            return (
              <div style={wrapStyle}>
                <button className="cancel-btn" onClick={onCancel} disabled={cancelling}>
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                  {cancelling ? 'Cancelling…' : 'Request Cancellation'}
                </button>
              </div>
            );
          })()}

        </div>{/* end scrollable body */}
      </div>
    </div>
  );
}

// ── QUOTE FIELD → DATA MAPPER ─────────────────────────────────────────────────
function getQuoteCurrency(quote) {
  // Quotes are always stored with PHP-converted totals. Always display in PHP.
  return 'PHP';
}

function resolveQuoteField(fieldId, quote, adminData) {
  const fmtDate = (ts) => {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  };
  const fmtAmt = (v) => v != null && v !== '' ? '₱' + Number(v).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}) : '';

  switch(fieldId) {
    // ── Quote Header ──────────────────────────────────────────────────────────
    case 'quote_number':    return quote.quoteNumber || '';
    case 'quote_date':      return fmtDate(quote.createdAt);
    case 'valid_until':     return fmtDate(quote.validUntil);
    case 'reference':       return quote.reference || quote.title || '';
    case 'currency':        return getQuoteCurrency(quote);

    // ── Your Company (sender) — always from the admin's user doc ─────────────
    // Firestore field names vary — try all known variations
    case 'company_name':
      return quote.senderOwnCompany
          || adminData?.ownCompanyName
          || adminData?.companyName
          || adminData?.company
          || '';
    case 'company_address':
      return adminData?.companyAddress
          || adminData?.address
          || adminData?.businessAddress
          || '';
    case 'company_tin':
      return adminData?.tinNumber
          || adminData?.tin
          || adminData?.taxId
          || '';
    case 'company_phone':
      return quote.senderPhone
          || adminData?.phoneNumber
          || adminData?.phone
          || adminData?.contactNumber
          || '';
    case 'company_email':
      return quote.senderEmail
          || adminData?.email
          || '';
    case 'prepared_by':
      return quote.senderFullName
          || quote.userName
          || adminData?.fullName
          || adminData?.displayName
          || adminData?.name
          || '';
    case 'prepared_role':
      return quote.senderPosition
          || adminData?.position
          || adminData?.jobTitle
          || adminData?.assignedRoleName
          || adminData?.role
          || '';

    // ── Recipient ─────────────────────────────────────────────────────────────
    case 'recipient_name':    return quote.recipientName    || quote.recipientEmail || '';
    case 'recipient_email':   return quote.recipientEmail   || '';
    case 'recipient_company': return quote.recipientCompany || quote.recipientBusiness || '';

    // ── Pricing ───────────────────────────────────────────────────────────────
    case 'subtotal':
      return fmtAmt(quote.subtotal ?? quote.totalAmount ?? quote.grandTotal);
    case 'discount':
      return quote.discount != null && quote.discount !== 0 ? fmtAmt(quote.discount) : '';
    case 'tax_rate':
      return quote.taxRate != null && quote.taxRate !== 0 ? quote.taxRate + '%' : '';
    case 'vat_amount':
      return quote.vatAmount != null && quote.vatAmount !== 0 ? fmtAmt(quote.vatAmount) : '';
    case 'grand_total':
      return fmtAmt(quote.grandTotal ?? quote.totalAmount ?? quote.subtotal);

    // ── Terms & Notes ─────────────────────────────────────────────────────────
    case 'notes':         return quote.notes        || '';
    case 'terms':         return quote.terms        || '';
    case 'payment_terms': return quote.paymentTerms || '';

    // ── Authorization — label fields render their label text ─────────────────
    case 'auth_prepared_label': return 'Prepared By:';
    case 'auth_approved_label': return 'Approved By:';
    case 'auth_noted_label':    return 'Noted By:';
    case 'auth_signature_line': return '____________________________';
    case 'prepared_sig':        return '____________________________';
    case 'approved_sig':        return '____________________________';
    case 'approved_by':         return adminData?.fullName || adminData?.displayName || '';

    case 'items_table': return null; // rendered as a table component separately

    default:
      // Dynamic signatory fields
      if (fieldId.startsWith('sig_name_'))  return adminData?.signatories?.[fieldId.replace('sig_name_','')]?.fullName || '';
      if (fieldId.startsWith('sig_title_')) return adminData?.signatories?.[fieldId.replace('sig_title_','')]?.role || '';
      if (fieldId.startsWith('sig_img_'))   return null;
      // Any other auth_ static label — return the label key formatted
      if (fieldId.startsWith('auth_'))      return fieldId.replace('auth_','').replace(/_/g,' ');
      return '';
  }
}

// ── QUOTE PRINT OVERLAY ───────────────────────────────────────────────────────
function QuotePrint({ quote, onClose }) {
  const [layout, setLayout]       = useState(null);
  const [adminData, setAdminData] = useState(null);
  const [signatories, setSignatories] = useState({}); // keyed by uid
  const [loadingLayout, setLoadingLayout] = useState(true);
  const [printing, setPrinting]   = useState(false);

  // approval gate: only allow print if approved or no approval required
  const isApprovalPending = quote.approvalStatus === 'pending_approval';
  const isApprovalRejected = quote.approvalStatus === 'rejected' || quote.status === 'rejected';

  const cs = getCurrencySymbol(getQuoteCurrency(quote));

  useEffect(() => {
    (async () => {
      try {
        const db = firebase.firestore();
        const au = firebase.auth().currentUser;
        if (!au) return;

        // Load the current viewer's doc to find their assigned admin
        const viewerDoc = await db.collection('users').doc(au.uid).get();
        const vd = viewerDoc.data() || {};

        // Resolve which admin owns the layout — same priority as quote-layout-setup.html
        let layoutData = null;
        let adminUid = au.uid; // default: viewer is the admin

        // 1. Try viewer's own layout first (viewer might be admin)
        const ownDoc = await db.collection('quotationLayouts').doc(au.uid).get();
        if (ownDoc.exists) {
          layoutData = ownDoc.data();
          adminUid = au.uid;
        }

        // 2. Try the assigned admin's layout (buyer assigned to an admin)
        if (!layoutData && vd.assignedAdminId) {
          const adDoc = await db.collection('quotationLayouts').doc(vd.assignedAdminId).get();
          if (adDoc.exists) { layoutData = adDoc.data(); adminUid = vd.assignedAdminId; }
        }

        // 3. Try company-shared admin layout
        if (!layoutData && vd.companyName) {
          const coAdmins = await db.collection('users')
            .where('role','==','admin')
            .where('companyName','==',vd.companyName)
            .get();
          for (const ad of coAdmins.docs) {
            if (ad.id === au.uid) continue;
            const shared = await db.collection('quotationLayouts').doc(ad.id).get();
            if (shared.exists) { layoutData = shared.data(); adminUid = ad.id; break; }
          }
        }

        setLayout(layoutData);

        // Always load the admin's user doc for field resolution — NOT the viewer's doc
        // (company_name, company_address, phone, email etc. live on the admin's doc)
        const adminUserDoc = await db.collection('users').doc(adminUid).get();
        const ad = adminUserDoc.exists ? adminUserDoc.data() : {};
        setAdminData({
          ...ad,
          email: adminUid === au.uid ? au.email : (ad.email || ''),
          // also carry viewer email as fallback for quote-level sender fields
          _viewerEmail: au.email,
        });

        // ── Load signatories that appear in this layout ──────────────────────
        if (layoutData?.fields) {
          const sigIds = [...new Set(
            layoutData.fields
              .filter(f => f.isSignatory && f.signatoryId)
              .map(f => f.signatoryId)
          )];
          if (sigIds.length > 0) {
            const sigMap = {};
            await Promise.all(sigIds.map(async sid => {
              try {
                const sd = await db.collection('users').doc(sid).get();
                if (sd.exists) sigMap[sid] = { id: sid, ...sd.data() };
              } catch {}
            }));
            setSignatories(sigMap);
          }
        }
      } catch(e) { console.error('Layout load:', e); }
      setLoadingLayout(false);

  const doDownloadPdf = async () => {
    if (isApprovalPending) { alert('This quotation is still pending approval and cannot be downloaded yet.'); return; }
    if (isApprovalRejected) { alert('This quotation was rejected and cannot be downloaded.'); return; }
    setPrinting(true);

    const canvasEl = document.getElementById('qp-canvas-inner');
    if (!canvasEl || !layout) { setPrinting(false); return; }

    try {
      const imgCanvas = await html2canvas(canvasEl, {
        scale: 2,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#ffffff',
        width: 794,
        height: 1123,
        logging: false,
      });

      const imgData = imgCanvas.toDataURL('image/jpeg', 0.97);
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      pdf.addImage(imgData, 'JPEG', 0, 0, pageW, pageH);
      pdf.save(`Quotation-${quote.quoteNumber || 'Q'}.pdf`);
    } catch(e) {
      console.error('PDF generation error:', e);
      alert('Could not generate PDF. Please try again.');
    }
    setPrinting(false);

        }

          <svg width="16" height="16" fill="none" stroke="#A855F7" strokeWidth="2" viewBox="0 0 24 24" style={{flexShrink:0,marginTop:1}}><path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          <div>
            <div style={{fontSize:12,fontWeight:700,color:'#C4B5FD',marginBottom:2}}>Quotation Pending Approval</div>
            <div style={{fontSize:11,color:'#94A3B8',lineHeight:1.6}}>
              This quotation is awaiting approval
              {quote.approvalGroupName&&<> via <strong style={{color:'#C4B5FD'}}>{quote.approvalGroupName}</strong></>}
              {quote.assignedApproverName&&<>. Assigned to <strong style={{color:'#C4B5FD'}}>{quote.assignedApproverName}</strong></>}.
              {' '}Printing is locked until all approval steps are completed and signatures are applied.
            </div>
          </div>
        </div>
      )}

      {/* Preview area */}
      {loadingLayout ? (
        <div className="qp-loading">
          <div className="qp-loading-spin"/>
          <div style={{fontSize:14,fontWeight:600}}>Loading quotation layout…</div>
        </div>
      ) : renderPreview()}

    </div>
  );
}

function QuoteDrawer({ quote, onClose }) {
  const [showPrint, setShowPrint] = useState(false);
  const isExpired = quote.validUntil && quote.validUntil.toDate?.() < new Date();
  const isPending  = quote.approvalStatus === 'pending_approval' || quote.status === 'pending_approval';
  const isApproved = !isPending && (quote.approvalStatus === 'approved' || quote.status === 'approved' || quote.status === 'active' || (!quote.approvalStatus && quote.status !== 'rejected'));
  const isRejected = quote.approvalStatus === 'rejected' || quote.status === 'rejected';
  const cs = getCurrencySymbol(getQuoteCurrency(quote));
  const steps = quote.approvalTotalSteps > 0 ? Array.from({length: quote.approvalTotalSteps}, (_,i) => i) : [];
  const currentStep = quote.approvalStepIndex ?? 0;
  const history = quote.approvalHistory || [];

  const approvalStatusLabel = isPending ? 'Pending Approval' : isRejected ? 'Rejected' : isApproved ? (quote.approvalGroupName ? 'Approved' : 'Active') : 'Active';
  const approvalStatusStyle = isPending
    ? {bg:'#F5F3FF',color:'#5B21B6',border:'#DDD6FE'}
    : isRejected
    ? {bg:'#FEE2E2',color:'#991B1B',border:'#FECACA'}
    : {bg:'#DCFCE7',color:'#166534',border:'#A7F3D0'};

  return (
    <>
    <div className="drawer-ov" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="drawer">
        {/* Header */}
        <div className="drawer-hd">
          <div className="drawer-hd-left">
            <h2>Quote {quote.quoteNumber}</h2>
            <p>Created {fmtDate(quote.createdAt)}</p>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            {isExpired ? (
              <div style={{display:'flex',alignItems:'center',gap:6,background:'rgba(100,116,139,.12)',border:'1px solid rgba(100,116,139,.25)',borderRadius:7,padding:'8px 14px',fontSize:12,color:'#94A3B8',fontWeight:600,cursor:'not-allowed',userSelect:'none'}}>
                <svg width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                Download Unavailable — Expired
              </div>
            ) : (
              <button onClick={()=>setShowPrint(true)}
                style={{display:'flex',alignItems:'center',gap:7,padding:'8px 16px',background:isPending||isRejected?'rgba(255,255,255,.08)':'#7C3AED',color:isPending||isRejected?'#64748B':'#fff',border:isPending||isRejected?'1px solid rgba(255,255,255,.12)':'none',borderRadius:9,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'DM Sans,sans-serif',transition:'all .18s',whiteSpace:'nowrap',opacity:isRejected?.5:1}}
                title={isPending?'Locked — awaiting approval':isRejected?'Rejected — cannot download':''}>
                <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                {isPending ? 'Preview (Locked)' : 'Download Quotation'}
              </button>
            )}
            <button className="drawer-close" onClick={onClose}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
        </div>

        <div className="drawer-body">

          {/* ── Expired Banner ── */}
          {isExpired && !isPending && !isRejected && (
            <div style={{background:'#F8FAFC',border:'1.5px solid #E2E8F0',borderRadius:10,padding:'12px 14px',display:'flex',alignItems:'flex-start',gap:10}}>
              <svg width="16" height="16" fill="none" stroke="#94A3B8" strokeWidth="2" viewBox="0 0 24 24" style={{flexShrink:0,marginTop:1}}><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" d="M12 8v4l2 2"/></svg>
              <div>
                <div style={{fontSize:12,fontWeight:800,color:'#475569',marginBottom:2}}>Quotation Expired</div>
                <div style={{fontSize:11,color:'#94A3B8',lineHeight:1.6}}>
                  This quotation expired on <strong>{fmtDate(quote.validUntil)}</strong>. The PDF download has been disabled. Please request a new quotation if needed.
                </div>
              </div>
            </div>
          )}

          {/* ── Approval Status Banner ── */}
          {(isPending || isRejected) && (
            <div style={{background:approvalStatusStyle.bg,border:`1.5px solid ${approvalStatusStyle.border}`,borderRadius:10,padding:'12px 14px',display:'flex',alignItems:'flex-start',gap:10}}>
              {isPending
                ? <svg width="16" height="16" fill="none" stroke="#7C3AED" strokeWidth="2" viewBox="0 0 24 24" style={{flexShrink:0,marginTop:1}}><path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                : <svg width="16" height="16" fill="none" stroke="#DC2626" strokeWidth="2" viewBox="0 0 24 24" style={{flexShrink:0,marginTop:1}}><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
              }
              <div>
                <div style={{fontSize:12,fontWeight:800,color:approvalStatusStyle.color,marginBottom:2}}>{isPending ? 'Awaiting Approval — Print Locked' : 'Quotation Rejected'}</div>
                <div style={{fontSize:11,color:approvalStatusStyle.color,lineHeight:1.6,opacity:.85}}>
                  {isPending
                    ? <>This quotation is routed through <strong>{quote.approvalGroupName||'an approval workflow'}</strong>. Printing and sending are locked until all approval steps are completed and signatories are applied.</>
                    : <>This quotation was rejected and cannot be printed or sent.</>
                  }
                  {isPending && quote.assignedApproverName && <> Currently assigned to <strong>{quote.assignedApproverName}</strong>.</>}
                </div>
              </div>
            </div>
          )}

          {/* ── Approval Chain ── */}
          {steps.length > 0 && (
            <div className="sec-card">
              <div className="sec-card-hd">
                {/* Fluent: Shield Checkmark */}
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#64748B" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                <span>Approval Chain — {quote.approvalGroupName}</span>
                <span style={{marginLeft:'auto',fontSize:10,fontWeight:700,color:isPending?'#7C3AED':isRejected?'#DC2626':'#059669',background:isPending?'#F5F3FF':isRejected?'#FEE2E2':'#DCFCE7',padding:'2px 8px',borderRadius:99}}>{approvalStatusLabel}</span>
              </div>
              <div className="sec-card-body">
                <div className="appr-chain">
                  {steps.map(i => {
                    const histEntry = history.find(h => h.step === i);
                    const isStepDone = histEntry && histEntry.action === 'approved';
                    const isStepActive = !isRejected && i === currentStep && isPending;
                    const isStepRejected = histEntry && histEntry.action === 'rejected';
                    return (
                      <div key={i} className={`appr-step ${isStepDone?'done':''}`}>
                        <div className={`appr-step-dot ${isStepDone?'done':isStepActive?'active':'pending'}`}>
                          {isStepDone && <svg width="10" height="10" fill="none" stroke="#fff" strokeWidth="3" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>}
                          {isStepRejected && <svg width="10" height="10" fill="none" stroke="#DC2626" strokeWidth="3" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>}
                          {isStepActive && <div style={{width:8,height:8,borderRadius:'50%',background:'#fff',animation:'pulse 1.4s infinite'}}/>}
                        </div>
                        <div style={{flex:1,paddingBottom:12}}>
                          <div style={{fontSize:12,fontWeight:700,color:isStepDone?'var(--green)':isStepRejected?'var(--red)':isStepActive?'var(--purple)':'var(--slate)'}}>
                            Step {i+1}{histEntry?.approverName&&` — ${histEntry.approverName}`}
                            {i === currentStep && isPending && quote.assignedApproverName && ` — ${quote.assignedApproverName}`}
                          </div>
                          <div style={{fontSize:11,color:'var(--slate)',marginTop:1}}>
                            {isStepDone ? `Approved ${histEntry.at ? new Date(histEntry.at).toLocaleDateString() : ''}` : isStepRejected ? `Rejected ${histEntry.at ? new Date(histEntry.at).toLocaleDateString() : ''}` : isStepActive ? 'Awaiting approval' : 'Pending'}
                          </div>
                          {histEntry?.note && <div style={{fontSize:11,color:'var(--slate)',marginTop:2,fontStyle:'italic'}}>"{histEntry.note}"</div>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* ── Quote Info ── */}
          <div className="sec-card">
            <div className="sec-card-hd">
              {/* Fluent: Document Details */}
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#64748B" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/><path strokeLinecap="round" d="M9 13h6M9 17h4"/></svg>
              <span>Quote Info</span>
            </div>
            <div className="sec-card-body">
              {[
                ['Quote Number', quote.quoteNumber],
                ['Reference',    quote.reference],
                ['Sent To',      quote.recipientEmail],
                ['Recipient',    quote.recipientName],
                ['Valid Until',  fmtDate(quote.validUntil)],
                ['Status',       isExpired ? 'Expired' : approvalStatusLabel],
                ['Notes',        quote.notes],
              ].map(([l,v]) => v ? (
                <div key={l} className="info-row">
                  <span className="info-lbl">{l}</span>
                  <span className="info-val" style={l==='Status'?{color:isExpired?'#64748B':approvalStatusStyle.color,fontWeight:700}:{}}>{v}</span>
                </div>
              ):null)}
            </div>
          </div>

          {/* ── Items ── */}
          <div className="sec-card">
            <div className="sec-card-hd">
              {/* Fluent: Box / Package */}
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#64748B" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
              <span>Items ({(quote.items||[]).length})</span>
            </div>
            <div className="sec-card-body" style={{padding:'0 16px'}}>
              {(quote.items||[]).map((item,i)=>(
                <div key={i} className="order-item-row">
                  <div className="oi-img-ph">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" strokeWidth="1.5"><path strokeLinecap="round" strokeLinejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                  </div>
                  <div style={{flex:1}}>
                    <div className="oi-name">{item.name}</div>
                    <div className="oi-meta">Qty: {item.quantity} {item.unit&&`· ${item.unit}`} · ₱{fmt((item.phpPrice != null ? item.phpPrice : (item.unitPrice || 0)))} each{(item.fxRate && item.currency && item.currency!=='PHP') ? ` (${item.currency} ${fmt(item.unitPrice)} @ ${Number(item.fxRate).toFixed(4)})` : ''}</div>
                  </div>
                  <div className="oi-total">₱{fmt(item.phpSubtotal != null ? item.phpSubtotal : (item.lineTotal || ((item.phpPrice != null ? item.phpPrice : (item.unitPrice || 0)) * (item.quantity || 0))))}</div>
                </div>
              ))}
            </div>
          </div>

          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'14px 0',borderTop:'1.5px solid var(--line)'}}>
            <span style={{fontSize:14,fontWeight:700}}>Total</span>
            <span style={{fontSize:20,fontWeight:800,letterSpacing:'-.5px'}}>₱{fmt(quote.grandTotal||quote.subtotal)}</span>
          </div>
        </div>
      </div>
    </div>
    {showPrint&&<QuotePrint quote={quote} onClose={()=>setShowPrint(false)}/>}
    </>
  );
}

function AccountDropdown({user, userRole, onSignOut, extraItems}) {

    const n = user?.displayName || user?.fullName || user?.email || 'U';
    return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  }, [user]);
  const firstName = (user?.displayName || user?.fullName || '').split(' ')[0] || 'there';

            </div>

              Sign out

            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
