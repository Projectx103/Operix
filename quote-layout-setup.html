<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Layout Setup — Operix</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
  .field-chip { cursor: grab; user-select: none; }
  .field-chip:active { cursor: grabbing; }
  .canvas-field { position: absolute; cursor: move; user-select: none; }
  .canvas-field:hover .field-controls { display: flex; }
  .field-controls { display: none; }
  .a4-canvas { width: 794px; height: 1123px; position: relative; overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const FIELD_GROUPS = [
  {
    group: '📄 Quote Header',
    fields: [
      { id: 'quote_number',   label: 'Quote Number',           defaultWidth: 200 },
      { id: 'quote_date',     label: 'Quote Date',             defaultWidth: 160 },
      { id: 'valid_until',    label: 'Valid Until Date',        defaultWidth: 180 },
      { id: 'reference',      label: 'Reference / Title',      defaultWidth: 260 },
      { id: 'currency',       label: 'Currency',               defaultWidth: 100 },
    ]
  },
  {
    group: '🏢 Sender — Your Company',
    fields: [
      { id: 'company_name',    label: 'Company Name',          defaultWidth: 280 },
      { id: 'company_address', label: 'Company Address',       defaultWidth: 300 },
      { id: 'company_tin',     label: 'TIN Number',            defaultWidth: 200 },
      { id: 'company_phone',   label: 'Sender Phone',          defaultWidth: 180 },
      { id: 'company_email',   label: 'Sender Email',          defaultWidth: 220 },
      { id: 'prepared_by',     label: 'Prepared By (Full Name)',defaultWidth: 200 },
      { id: 'prepared_role',   label: 'Preparer Position/Role',defaultWidth: 200 },
    ]
  },
  {
    group: '👤 Recipient',
    fields: [
      { id: 'recipient_name',    label: 'Recipient Full Name',   defaultWidth: 260 },
      { id: 'recipient_email',   label: 'Recipient Email',       defaultWidth: 260 },
      { id: 'recipient_company', label: 'Recipient Company',     defaultWidth: 260 },
    ]
  },
  {
    group: '📦 Quoted Items',
    fields: [
      { id: 'items_table', label: '📦 Items Table (Name · SKU · Qty · Unit Price · Total)', defaultWidth: 700 },
    ]
  },
  {
    group: '💰 Pricing',
    fields: [
      { id: 'subtotal',    label: 'Subtotal',       defaultWidth: 160 },
      { id: 'discount',    label: 'Discount',       defaultWidth: 130 },
      { id: 'tax_rate',    label: 'Tax Rate (%)',   defaultWidth: 130 },
      { id: 'vat_amount',  label: 'VAT / Tax Amt',  defaultWidth: 160 },
      { id: 'grand_total', label: 'Grand Total',    defaultWidth: 180 },
    ]
  },
  {
    group: '📋 Terms & Notes',
    fields: [
      { id: 'notes',         label: 'Notes to Recipient', defaultWidth: 500 },
      { id: 'terms',         label: 'Terms & Conditions', defaultWidth: 600 },
      { id: 'payment_terms', label: 'Payment Terms',      defaultWidth: 200 },
    ]
  },
  {
    group: '✅ Authorization',
    fields: [
      { id: 'prepared_by',  label: 'Prepared By — Name',      defaultWidth: 200 },
      { id: 'prepared_sig', label: 'Prepared By — Signature', defaultWidth: 200 },
      { id: 'approved_by',  label: 'Approved By — Name',      defaultWidth: 200 },
      { id: 'approved_sig', label: 'Approved By — Signature', defaultWidth: 200 },
    ]
  },
];

const FIELD_DEFINITIONS = FIELD_GROUPS.flatMap(g => g.fields);
const FONT_OPTIONS = ['Inter','Arial','Times New Roman','Georgia','Courier New','Helvetica','Trebuchet MS','Verdana'];

function QuoteLayoutSetup() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [backgroundUrl, setBackgroundUrl] = useState('');
  const [uploadingBg, setUploadingBg] = useState(false);
  const [placedFields, setPlacedFields] = useState([]);
  const [selectedField, setSelectedField] = useState(null);
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  const [layoutName, setLayoutName] = useState('Quote Layout');
  const [dragOffset, setDragOffset] = useState({ x:0, y:0 });
  const [draggingId, setDraggingId] = useState(null);
  const canvasRef = useRef(null);
  const nextTextId = useRef(1);
  const [customTexts, setCustomTexts] = useState([]);
  const [selectedText, setSelectedText] = useState(null);

  const FB = {
    apiKey:"AIzaSyB56dPmBwgO4uWyXakhY9SJBCAz7bk0Do8",
    authDomain:"operix-c8a8c.firebaseapp.com",
    projectId:"operix-c8a8c",
    storageBucket:"operix-c8a8c.firebasestorage.app",
    messagingSenderId:"794223223499",
    appId:"1:794223223499:web:f059007b909cc15766f14e"
  };

  useEffect(() => {
    const interval = setInterval(() => {
      if (window.firebase) {
        clearInterval(interval);
        if (!firebase.apps.length) firebase.initializeApp(FB);
        firebase.auth().onAuthStateChanged(async (u) => {
          if (!u) { window.location.href = 'login.html'; return; }
          const db = firebase.firestore();
          const userDoc = await db.collection('users').doc(u.uid).get();
          if (!userDoc.exists || userDoc.data().role !== 'admin') {
            window.location.href = 'shop-admin.html'; return;
          }
          const userData = userDoc.data();
          setUser({ uid: u.uid, ...userData });

          // Load layout — own first, then company-shared fallback
          let layoutData = null;
          const ownDoc = await db.collection('quotationLayouts').doc(u.uid).get();
          if (ownDoc.exists) {
            layoutData = ownDoc.data();
          } else {
            const myCompany = userData.companyName || '';
            if (myCompany) {
              try {
                const coAdmins = await db.collection('users')
                  .where('role','==','admin').where('companyName','==',myCompany).get();
                for (const ad of coAdmins.docs) {
                  if (ad.id === u.uid) continue;
                  const shared = await db.collection('quotationLayouts').doc(ad.id).get();
                  if (shared.exists) { layoutData = shared.data(); break; }
                }
              } catch(e) { console.warn('shared layout:', e); }
            }
          }
          if (layoutData) {
            setBackgroundUrl(layoutData.backgroundUrl || '');
            setPlacedFields(layoutData.fields || []);
            setLayoutName(layoutData.layoutName || 'Quote Layout');
            setCustomTexts(layoutData.customTexts || []);
          }
          setLoading(false);
        });
      }
    }, 100);
  }, []);

  const uploadBackground = (file) => {
    if (!file || !file.type.startsWith('image/')) { alert('Please upload an image file (PNG, JPG)'); return; }
    setUploadingBg(true);
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', 'operix_products');
    formData.append('folder', 'operix-quote-layouts');
    const xhr = new XMLHttpRequest();
    xhr.addEventListener('load', () => {
      if (xhr.status === 200) {
        const res = JSON.parse(xhr.responseText);
        setBackgroundUrl(res.secure_url);
      } else { alert('Upload failed. Please try again.'); }
      setUploadingBg(false);
    });
    xhr.addEventListener('error', () => { alert('Upload error.'); setUploadingBg(false); });
    xhr.open('POST', 'https://api.cloudinary.com/v1_1/dmrtrl4er/image/upload');
    xhr.send(formData);
  };

  const addFieldToCanvas = (fieldDef) => {
    if (placedFields.find(f => f.id === fieldDef.id)) { alert('This field is already on the canvas.'); return; }
    setPlacedFields(prev => [...prev, {
      id: fieldDef.id, label: fieldDef.label,
      x: 50, y: Math.max(20, 50 + prev.length * 30),
      width: fieldDef.defaultWidth,
      fontSize: 11, color: '#111827', bold: false,
      showLabel: false, labelPosition: 'above',
      maxChars: 0, fontFamily: 'Inter'
    }]);
  };

  const removeFieldFromCanvas = (fieldId) => {
    setPlacedFields(prev => prev.filter(f => f.id !== fieldId));
    if (selectedField === fieldId) setSelectedField(null);
  };

  const updateField = (fieldId, updates) => {
    setPlacedFields(prev => prev.map(f => f.id === fieldId ? { ...f, ...updates } : f));
  };

  const handleCanvasMouseDown = (e, fieldId) => {
    e.preventDefault();
    const canvas = canvasRef.current.getBoundingClientRect();
    const field = placedFields.find(f => f.id === fieldId);
    setDraggingId(fieldId);
    setSelectedField(fieldId);
    setDragOffset({ x: e.clientX - canvas.left - field.x, y: e.clientY - canvas.top - field.y });
  };

  const handleCanvasMouseMove = (e) => {
    if (!draggingId) return;
    const canvas = canvasRef.current.getBoundingClientRect();
    const newX = Math.max(0, Math.min(e.clientX - canvas.left - dragOffset.x, 794 - 50));
    const newY = Math.max(0, Math.min(e.clientY - canvas.top - dragOffset.y, 1123 - 20));
    if (draggingId.startsWith('txt_')) {
      updateCustomText(draggingId.replace('txt_',''), { x: newX, y: newY });
    } else {
      updateField(draggingId, { x: newX, y: newY });
    }
  };

  const handleCanvasMouseUp = () => setDraggingId(null);

  const saveLayout = async () => {
    if (!backgroundUrl) { alert('Please upload a background image first.'); return; }
    setSaving(true);
    try {
      const db = firebase.firestore();
      await db.collection('quotationLayouts').doc(user.uid).set({
        backgroundUrl, fields: placedFields, layoutName, customTexts,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedBy: user.uid
      });
      setSaved(true);
      setTimeout(() => setSaved(false), 3000);
    } catch (e) { alert('Save failed: ' + e.message); }
    setSaving(false);
  };

  const clearLayout = async () => {
    if (!confirm('Clear this layout? All field placements and background will be removed.')) return;
    try {
      const db = firebase.firestore();
      await db.collection('quotationLayouts').doc(user.uid).delete();
      setBackgroundUrl(''); setPlacedFields([]); setSelectedField(null); setCustomTexts([]);
    } catch (e) { alert('Error clearing layout.'); }
  };

  const addCustomText = () => {
    const id = 'custom_' + nextTextId.current++;
    setCustomTexts(prev => [...prev, {
      id, text: 'Custom Text', x: 60, y: 60 + prev.length * 30,
      fontSize: 11, color: '#111827', bold: false, fontFamily: 'Inter', width: 200
    }]);
    setSelectedText(id);
    setSelectedField(null);
  };

  const updateCustomText = (id, updates) => {
    setCustomTexts(prev => prev.map(t => t.id === id ? { ...t, ...updates } : t));
  };

  const removeCustomText = (id) => {
    setCustomTexts(prev => prev.filter(t => t.id !== id));
    if (selectedText === id) setSelectedText(null);
  };

  const handleTextMouseDown = (e, id) => {
    e.preventDefault();
    const canvas = canvasRef.current.getBoundingClientRect();
    const txt = customTexts.find(t => t.id === id);
    setDraggingId('txt_' + id);
    setSelectedText(id);
    setSelectedField(null);
    setDragOffset({ x: e.clientX - canvas.left - txt.x, y: e.clientY - canvas.top - txt.y });
  };

  const selectedFieldData = placedFields.find(f => f.id === selectedField);

  if (loading) return (
    <div className="min-h-screen flex items-center justify-center bg-slate-50">
      <div className="text-center">
        <div className="w-12 h-12 border-4 border-purple-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
        <p className="text-gray-600">Loading Quote Layout Setup...</p>
      </div>
    </div>
  );

  return (
    <div className="min-h-screen bg-slate-100">
      {/* Header */}
      <div className="bg-gradient-to-r from-purple-700 to-violet-600 text-white px-8 py-5 shadow-xl">
        <div className="flex items-center justify-between max-w-screen-2xl mx-auto">
          <div className="flex items-center gap-4">
            <button onClick={() => window.location.href = 'shop-admin.html'}
              className="p-2 bg-white bg-opacity-20 hover:bg-opacity-30 rounded-lg transition-all">
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7"/>
              </svg>
            </button>
            <div>
              <h1 className="text-2xl font-bold">Quote Layout Setup</h1>
              <p className="text-purple-200 text-sm">Upload your letterhead and drag fields to position quote data</p>
            </div>
          </div>
          <div className="flex items-center gap-3">
            <input type="text" value={layoutName} onChange={e => setLayoutName(e.target.value)}
              placeholder="Layout Name"
              className="px-3 py-2 bg-white bg-opacity-20 border border-white border-opacity-30 rounded-lg text-white placeholder-purple-300 text-sm outline-none focus:bg-opacity-30"/>
            {saved && <span className="px-3 py-2 bg-green-500 rounded-lg text-sm font-semibold animate-pulse">✓ Saved!</span>}
            <button onClick={clearLayout}
              className="px-4 py-2 bg-red-500 hover:bg-red-600 rounded-lg text-sm font-semibold transition-all">
              Clear Layout
            </button>
            <button onClick={saveLayout} disabled={saving || !backgroundUrl}
              className="px-6 py-2 bg-white text-purple-700 hover:bg-purple-50 rounded-lg font-bold text-sm transition-all disabled:opacity-50 flex items-center gap-2">
              {saving
                ? <><div className="w-4 h-4 border-2 border-purple-500 border-t-transparent rounded-full animate-spin"></div>Saving...</>
                : '💾 Save Layout'}
            </button>
          </div>
        </div>
      </div>

      <div className="flex gap-0 max-w-screen-2xl mx-auto p-6">

        {/* Left Panel */}
        <div className="w-72 flex-shrink-0 mr-6 space-y-4">

          {/* Upload Background */}
          <div className="bg-white rounded-2xl shadow-lg p-5 border border-gray-100">
            <h3 className="font-bold text-gray-800 mb-3 flex items-center gap-2">
              <span className="w-6 h-6 bg-purple-100 text-purple-700 rounded-full flex items-center justify-center text-xs font-bold">1</span>
              Upload Letterhead / Background
            </h3>
            <p className="text-xs text-gray-500 mb-3">Upload your company letterhead as PNG or JPG (A4: 794×1123px recommended)</p>
            <input type="file" id="bgUpload" accept="image/*" className="hidden"
              onChange={e => { if (e.target.files[0]) uploadBackground(e.target.files[0]); }}/>
            <button onClick={() => document.getElementById('bgUpload').click()} disabled={uploadingBg}
              className="w-full py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-sm font-semibold transition-all disabled:opacity-50 flex items-center justify-center gap-2">
              {uploadingBg
                ? <><div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>Uploading...</>
                : '📁 Upload Background Image'}
            </button>
            {backgroundUrl && <p className="text-xs text-green-600 mt-2 flex items-center gap-1"><span>✓</span> Background uploaded</p>}
            {!backgroundUrl && <p className="text-xs text-amber-600 mt-2">⚠ Background required before saving</p>}
          </div>

          {/* Field Library */}
          <div className="bg-white rounded-2xl shadow-lg p-5 border border-gray-100">
            <h3 className="font-bold text-gray-800 mb-3 flex items-center gap-2">
              <span className="w-6 h-6 bg-purple-100 text-purple-700 rounded-full flex items-center justify-center text-xs font-bold">2</span>
              Quote Fields
            </h3>
            <p className="text-xs text-gray-500 mb-4">Click any field to add it to the canvas, then drag to position.</p>
            <div className="space-y-4 max-h-96 overflow-y-auto pr-1">
              {FIELD_GROUPS.map(group => (
                <div key={group.group}>
                  <p className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">{group.group}</p>
                  <div className="flex flex-wrap gap-1.5">
                    {group.fields.map(f => {
                      const placed = placedFields.find(p => p.id === f.id);
                      return (
                        <button key={f.id}
                          onClick={() => !placed && addFieldToCanvas(f)}
                          className={`field-chip text-xs px-2.5 py-1 rounded-full border font-medium transition-all ${
                            placed
                              ? 'bg-purple-100 border-purple-300 text-purple-700 cursor-default'
                              : 'bg-gray-50 border-gray-200 text-gray-700 hover:bg-purple-50 hover:border-purple-300 hover:text-purple-700'
                          }`}>
                          {placed ? '✓ ' : ''}{f.label}
                        </button>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Custom Text */}
          <div className="bg-white rounded-2xl shadow-lg p-5 border border-gray-100">
            <h3 className="font-bold text-gray-800 mb-2">Custom Text</h3>
            <p className="text-xs text-gray-500 mb-3">Add static text labels, titles, or dividers.</p>
            <button onClick={addCustomText}
              className="w-full py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-semibold transition-all">
              + Add Text Element
            </button>
          </div>

          {/* Field Inspector */}
          {(selectedFieldData || selectedText) && (
            <div className="bg-white rounded-2xl shadow-lg p-5 border border-gray-100">
              <h3 className="font-bold text-gray-800 mb-3">
                {selectedFieldData ? '⚙ Field Properties' : '⚙ Text Properties'}
              </h3>
              {selectedFieldData && (
                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-semibold text-gray-600 block mb-1">Width (px)</label>
                    <input type="number" value={selectedFieldData.width}
                      onChange={e => updateField(selectedField, { width: parseInt(e.target.value)||100 })}
                      className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm"/>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-gray-600 block mb-1">Font Size</label>
                    <input type="number" min="6" max="72" value={selectedFieldData.fontSize}
                      onChange={e => updateField(selectedField, { fontSize: parseInt(e.target.value)||11 })}
                      className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm"/>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-gray-600 block mb-1">Font Family</label>
                    <select value={selectedFieldData.fontFamily||'Inter'}
                      onChange={e => updateField(selectedField, { fontFamily: e.target.value })}
                      className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm">
                      {FONT_OPTIONS.map(f=><option key={f}>{f}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-gray-600 block mb-1">Color</label>
                    <div className="flex gap-2">
                      <input type="color" value={selectedFieldData.color}
                        onChange={e => updateField(selectedField, { color: e.target.value })}
                        className="w-10 h-9 border border-gray-200 rounded cursor-pointer"/>
                      <input type="text" value={selectedFieldData.color}
                        onChange={e => updateField(selectedField, { color: e.target.value })}
                        className="flex-1 border border-gray-200 rounded-lg px-3 py-1.5 text-sm font-mono"/>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <input type="checkbox" checked={selectedFieldData.bold}
                      onChange={e => updateField(selectedField, { bold: e.target.checked })}
                      className="w-4 h-4 accent-purple-600"/>
                    <label className="text-sm text-gray-700">Bold</label>
                  </div>
                  <div className="flex items-center gap-2">
                    <input type="checkbox" checked={selectedFieldData.showLabel}
                      onChange={e => updateField(selectedField, { showLabel: e.target.checked })}
                      className="w-4 h-4 accent-purple-600"/>
                    <label className="text-sm text-gray-700">Show Label</label>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-gray-600 block mb-1">X Position</label>
                    <input type="number" value={Math.round(selectedFieldData.x)}
                      onChange={e => updateField(selectedField, { x: parseInt(e.target.value)||0 })}
                      className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm"/>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-gray-600 block mb-1">Y Position</label>
                    <input type="number" value={Math.round(selectedFieldData.y)}
                      onChange={e => updateField(selectedField, { y: parseInt(e.target.value)||0 })}
                      className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm"/>
                  </div>
                  <button onClick={() => removeFieldFromCanvas(selectedField)}
                    className="w-full py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-sm font-semibold transition-all">
                    Remove Field
                  </button>
                </div>
              )}
              {selectedText && !selectedFieldData && (()=>{
                const txt = customTexts.find(t=>t.id===selectedText);
                if (!txt) return null;
                return (
                  <div className="space-y-3">
                    <div>
                      <label className="text-xs font-semibold text-gray-600 block mb-1">Text Content</label>
                      <input type="text" value={txt.text}
                        onChange={e => updateCustomText(selectedText, { text: e.target.value })}
                        className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm"/>
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-gray-600 block mb-1">Font Size</label>
                      <input type="number" min="6" max="72" value={txt.fontSize}
                        onChange={e => updateCustomText(selectedText, { fontSize: parseInt(e.target.value)||11 })}
                        className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm"/>
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-gray-600 block mb-1">Color</label>
                      <div className="flex gap-2">
                        <input type="color" value={txt.color}
                          onChange={e => updateCustomText(selectedText, { color: e.target.value })}
                          className="w-10 h-9 border border-gray-200 rounded cursor-pointer"/>
                        <input type="text" value={txt.color}
                          onChange={e => updateCustomText(selectedText, { color: e.target.value })}
                          className="flex-1 border border-gray-200 rounded-lg px-3 py-1.5 text-sm font-mono"/>
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      <input type="checkbox" checked={txt.bold}
                        onChange={e => updateCustomText(selectedText, { bold: e.target.checked })}
                        className="w-4 h-4 accent-purple-600"/>
                      <label className="text-sm text-gray-700">Bold</label>
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-gray-600 block mb-1">Width (px)</label>
                      <input type="number" value={txt.width||200}
                        onChange={e => updateCustomText(selectedText, { width: parseInt(e.target.value)||100 })}
                        className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm"/>
                    </div>
                    <button onClick={() => removeCustomText(selectedText)}
                      className="w-full py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-sm font-semibold transition-all">
                      Remove Text
                    </button>
                  </div>
                );
              })()}
            </div>
          )}
        </div>

        {/* Canvas Area */}
        <div className="flex-1 min-w-0">
          <div className="bg-white rounded-2xl shadow-lg p-6 border border-gray-100 mb-4">
            <div className="flex items-center justify-between mb-4">
              <div>
                <h3 className="font-bold text-gray-800">Quote Canvas — A4 Preview</h3>
                <p className="text-xs text-gray-500 mt-0.5">Drag fields to position them on your quote template</p>
              </div>
              <div className="flex items-center gap-2 text-xs text-gray-500">
                <span className="w-3 h-3 rounded-full bg-purple-400 inline-block"></span> Placed fields
                <span className="w-3 h-3 rounded-full bg-amber-400 inline-block ml-2"></span> Selected
              </div>
            </div>

            {!backgroundUrl ? (
              <div className="a4-canvas bg-gray-50 border-2 border-dashed border-gray-200 rounded-lg flex flex-col items-center justify-center gap-4">
                <div className="text-center">
                  <div className="text-4xl mb-3">📄</div>
                  <p className="text-gray-500 font-medium">No background uploaded yet</p>
                  <p className="text-gray-400 text-sm mt-1">Upload your company letterhead to start designing</p>
                  <button onClick={() => document.getElementById('bgUpload').click()} disabled={uploadingBg}
                    className="mt-4 px-5 py-2.5 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-sm font-semibold transition-all">
                    Upload Letterhead
                  </button>
                </div>
              </div>
            ) : (
              <div className="overflow-auto">
                <div ref={canvasRef}
                  className="a4-canvas relative"
                  style={{ backgroundImage: `url(${backgroundUrl})`, backgroundSize: 'cover', backgroundPosition: 'top center', cursor: draggingId ? 'grabbing' : 'default' }}
                  onMouseMove={handleCanvasMouseMove}
                  onMouseUp={handleCanvasMouseUp}
                  onClick={e => { if (e.target === canvasRef.current) { setSelectedField(null); setSelectedText(null); } }}>

                  {/* Placed fields */}
                  {placedFields.map(field => (
                    <div key={field.id}
                      className="canvas-field"
                      style={{ left: field.x, top: field.y, width: field.width, zIndex: selectedField===field.id ? 20 : 10 }}
                      onMouseDown={e => handleCanvasMouseDown(e, field.id)}>
                      <div style={{
                        border: `1.5px solid ${selectedField===field.id ? '#7C3AED' : 'rgba(124,58,237,0.35)'}`,
                        background: selectedField===field.id ? 'rgba(124,58,237,0.08)' : 'rgba(124,58,237,0.04)',
                        borderRadius: 3, padding: '1px 4px', minHeight: 18,
                        fontSize: field.fontSize, color: field.color,
                        fontWeight: field.bold ? 'bold' : 'normal',
                        fontFamily: field.fontFamily || 'Inter',
                        userSelect: 'none', boxSizing: 'border-box'
                      }}>
                        <span style={{ fontSize: 9, color: '#7C3AED', fontWeight: 700, display: 'block', lineHeight: 1.2, fontFamily: 'Inter' }}>
                          {field.label}
                        </span>
                        <span style={{ color: field.color, opacity: 0.6 }}>
                          [{field.id}]
                        </span>
                      </div>
                      <div className="field-controls absolute -top-6 right-0 flex gap-1">
                        <button onClick={e => { e.stopPropagation(); removeFieldFromCanvas(field.id); }}
                          className="w-5 h-5 bg-red-500 text-white rounded text-xs flex items-center justify-center font-bold hover:bg-red-600">✕</button>
                      </div>
                    </div>
                  ))}

                  {/* Custom texts */}
                  {customTexts.map(txt => (
                    <div key={txt.id}
                      className="canvas-field"
                      style={{ left: txt.x, top: txt.y, width: txt.width || 200, zIndex: selectedText===txt.id ? 20 : 10 }}
                      onMouseDown={e => handleTextMouseDown(e, txt.id)}>
                      <div style={{
                        border: `1.5px solid ${selectedText===txt.id ? '#F59E0B' : 'rgba(245,158,11,0.4)'}`,
                        background: selectedText===txt.id ? 'rgba(245,158,11,0.08)' : 'rgba(245,158,11,0.03)',
                        borderRadius: 3, padding: '1px 4px', minHeight: 18,
                        fontSize: txt.fontSize, color: txt.color,
                        fontWeight: txt.bold ? 'bold' : 'normal',
                        fontFamily: txt.fontFamily || 'Inter',
                        userSelect: 'none', whiteSpace: 'pre-wrap', wordBreak: 'break-word'
                      }}>
                        {txt.text}
                      </div>
                      <div className="field-controls absolute -top-6 right-0 flex gap-1">
                        <button onClick={e => { e.stopPropagation(); removeCustomText(txt.id); }}
                          className="w-5 h-5 bg-red-500 text-white rounded text-xs flex items-center justify-center font-bold hover:bg-red-600">✕</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Placed fields summary */}
          {placedFields.length > 0 && (
            <div className="bg-white rounded-2xl shadow-lg p-5 border border-gray-100">
              <h3 className="font-bold text-gray-800 mb-3">Placed Fields ({placedFields.length})</h3>
              <div className="flex flex-wrap gap-2">
                {placedFields.map(f => (
                  <span key={f.id} className="inline-flex items-center gap-1.5 px-3 py-1 bg-purple-50 border border-purple-200 text-purple-700 rounded-full text-xs font-semibold">
                    {f.label}
                    <button onClick={() => removeFieldFromCanvas(f.id)} className="text-purple-400 hover:text-red-500 ml-0.5 font-bold">✕</button>
                  </span>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<QuoteLayoutSetup/>);
</script>
</body>
</html>
