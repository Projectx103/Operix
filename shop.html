    if(!quoteForm.email.trim()){alert('Email address is required.');return;}
    if(!quoteForm.reference.trim()){alert('Your reference / name is required.');return;}
    if(!cart.length){alert('Add items to your cart first.');return;}
    setQuoteSending(true);
    try{
      const db=firebase.firestore();
      const expiry=new Date();expiry.setDate(expiry.getDate()+30);
      // ── Generate quote number ──────────────────────────────────────────────
      let quoteCount=1;
      try{
        const cr=db.collection('counters').doc('quoteCounter');
        const cd=await cr.get();
        if(cd.exists){quoteCount=cd.data().count+1;await cr.update({count:firebase.firestore.FieldValue.increment(1)});}
        else await cr.set({count:1});
      }catch{quoteCount=Date.now();}
      const quoteNumber='QT-'+String(quoteCount).padStart(6,'0');

      // ── Look up active Quotation Approval Group for this company ──────────
      let approvalGroup=null;
      let approvalStatus='active'; // default: no approval needed
      let assignedApproverId=null;
      let assignedApproverName=null;
      let approvalGroupId=null;
      let approvalGroupName=null;
      let approvalStepIndex=0;
      let approvalTotalSteps=0;

      try{
        const myCompany=user?.companyName||'';
        const agSnap=await db.collection('approvalGroups')
          .where('docType','==','Quotation')
          .where('active','==',true)
          .get();
        // Find best match: company-specific first, then global
        const groups=agSnap.docs.map(d=>({id:d.id,...d.data()}));
        approvalGroup=groups.find(g=>g.companyName===myCompany)||groups.find(g=>!g.companyName)||null;
      }catch(e){console.warn('approvalGroups lookup:',e);}

      if(approvalGroup&&approvalGroup.steps?.length>0&&!approvalGroup.bypassAllowed){
        approvalStatus='pending_approval';
        approvalGroupId=approvalGroup.id;
        approvalGroupName=approvalGroup.name;
        approvalTotalSteps=approvalGroup.steps.length;
        const firstStep=approvalGroup.steps[0];
        if(firstStep.approverAdminId){
          assignedApproverId=firstStep.approverAdminId;
          assignedApproverName=firstStep.approverName||firstStep.approverAdminId;
        } else if(firstStep.approverRole){
          // Find any admin with that role in the same company
          try{
            const adminSnap=await db.collection('users')
              .where('role','==','admin')
              .where('isAdmin','==',true)
              .get();
            const myCompany=user?.companyName||'';
            const match=adminSnap.docs
              .map(d=>({id:d.id,...d.data()}))
              .find(a=>(a.companyName===myCompany||!myCompany)&&(a.assignedRoleName===firstStep.approverRole||a.assignedRole===firstStep.approverRole.toLowerCase().replace(/ /g,'_')));
            if(match){assignedApproverId=match.id;assignedApproverName=match.fullName;}
          }catch(e){console.warn('approver lookup:',e);}
        }
      }

      // ── Save to BOTH collections for backwards compatibility ──────────────
      // Primary: 'quotations' (approval-aware, used by Dashboard worklist)
      // Legacy:  'quotes' (used by my-orders page)
      const quoteData={
        quoteNumber,
        userId:           user.uid,
        createdBy:        user.uid,
        createdByName:    user.displayName||user.fullName||user.email,
        userName:         user.displayName||user.fullName||user.email,
        senderFullName:   user.fullName||user.displayName||user.email,
        senderOwnCompany: user.ownCompanyName||user.companyName||'',
        senderPosition:   user.position||'',
        senderDepartment: user.department||'',
        senderPhone:      user.phoneNumber||'',
        senderEmail:      user.email||'',
        recipientEmail:   quoteForm.email.trim(),
        recipientName:    quoteForm.recipientName?.trim()||'',
        recipientCompany: quoteForm.recipientCompany?.trim()||'',
        reference:        quoteForm.reference.trim(),
        notes:            quoteForm.notes.trim(),
        items: cart.map(i=>{
          const fx=convertToPhp(i.price,i.currency||'PHP');
          return {
            productId:i.id,name:i.name,sku:i.sku||'',
            quantity:i.quantity,
            unitPrice:i.price,          // original price in source currency
            lineTotal:i.price*i.quantity, // original line total in source currency
            currency:i.currency||'PHP',
            // PHP-converted fields (same as order flow — used by dashboard preview)
            phpPrice:   fx.phpPrice,
            phpSubtotal:fx.phpPrice*i.quantity,
            fxRate:     fx.rate||null,
            fxDate:     fxRateDate||null,
            unit:i.unit||'unit',
          };
        }),
        subtotal:    cartTotal,   // always PHP-converted total
        grandTotal:  cartTotal,   // always PHP-converted total
        currency:    cartCurrency, // always 'PHP'
        // Approval fields
        status:           approvalStatus,
        approvalStatus:   approvalStatus,
        approvalGroupId,
        approvalGroupName,
        approvalStepIndex,
        approvalTotalSteps,
        assignedApproverId,
        assignedApproverName,
        approvalHistory:  [],
        validUntil:  firebase.firestore.Timestamp.fromDate(expiry),
        createdAt:   firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt:   firebase.firestore.FieldValue.serverTimestamp(),
      };

      // Write to quotations collection (primary)
      const quotRef=db.collection('quotations').doc();
      await quotRef.set(quoteData);
      // Also mirror to quotes collection for legacy my-orders support
      await db.collection('quotes').add({...quoteData});

      // ── Notifications ───────────────────────────────────────────────────────
      const batch=db.batch();
      if(approvalStatus==='pending_approval'&&assignedApproverId){
        // Notify the assigned approver
        batch.set(db.collection('notifications').doc(),{
          type:'quotation_approval',
          title:'Quotation Pending Your Approval',
          message:`Quotation ${quoteNumber} — "${quoteForm.reference.trim()}" requires your approval`,
          quoteNumber,
          quoteId:quotRef.id,
          approvalGroupName,
          createdByName:user.displayName||user.fullName||user.email,
          userId:assignedApproverId,
          read:false,
          createdAt:firebase.firestore.FieldValue.serverTimestamp(),
          timestamp:firebase.firestore.FieldValue.serverTimestamp(),
        });
        // Notify the requester that quote is pending approval
        batch.set(db.collection('notifications').doc(),{
          type:'quotation_approval',
          title:'Quote Submitted for Approval',
          message:`Your quotation ${quoteNumber} has been submitted and is awaiting approval from ${assignedApproverName||'an approver'}`,
          quoteNumber,
          quoteId:quotRef.id,
          userId:user.uid,
          userRole:'user',
          read:false,
          createdAt:firebase.firestore.FieldValue.serverTimestamp(),
          timestamp:firebase.firestore.FieldValue.serverTimestamp(),
        });
      } else {
        // No approval needed — notify requester quote is active
        batch.set(db.collection('notifications').doc(),{
          type:'quotation_approval',
          title:'Quotation Ready',
          message:`Your quotation ${quoteNumber} has been created and is ready to send`,
          quoteNumber,
          quoteId:quotRef.id,
          userId:user.uid,
          userRole:'user',
          read:false,
          createdAt:firebase.firestore.FieldValue.serverTimestamp(),
          timestamp:firebase.firestore.FieldValue.serverTimestamp(),
        });
      }
      await batch.commit();

      // ── Email webhook (only if approved/active) ────────────────────────────
      if(approvalStatus==='active'){
        try{await fetch(`${RENDER}/webhook/send-quote`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${SECRET}`},body:JSON.stringify({quoteNumber,recipientEmail:quoteForm.email.trim(),reference:quoteForm.reference.trim(),notes:quoteForm.notes.trim(),validUntil:expiry.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}),items:cart.map(i=>({name:i.name,sku:i.sku||'',quantity:i.quantity,unitPrice:i.price.toFixed(2),lineTotal:(i.price*i.quantity).toFixed(2),unit:i.unit||'unit',currency:i.currency||'PHP',currencySymbol:getCurrencySymbol(i.currency||'PHP')})),subtotal:cartTotal.toFixed(2),currency:cartCurrency,currencySymbol:getCurrencySymbol(cartCurrency)})})}catch(e){console.warn(e);}
      }

      setQuoteSuccess({quoteNumber,approvalStatus,approvalGroupName,assignedApproverName});
    }catch(e){console.error(e);alert('Error: '+e.message);}
    setQuoteSending(false);
  };

  if(loading)return(<div className="loader"><Logo/><div className="loader-spin"/><p style={{fontSize:13,color:'var(--slate)'}}>Loading Procurement Shop…</p></div>);

  const heroTitle=shopConfig.heroTitle||'What are you looking for?';
  const heroSub=shopConfig.heroSubtitle||'Select a category to browse products and submit a requisition.';
  const ds=shopConfig.displaySettings||{};
  const showFxRateDetails = ds.showFxRateDetails!==false; // default true
  const showSupplierName  = ds.showSupplierName!==false;  // default true
  const displayCompanyName= ds.displayCompanyName||'';

  return(
    <>
      {/* TOPBAR */}
      <header className="tb">
        <div className="tb-inner">
          {/* Brand */}
          <a href="shop.html" className="tb-brand">
            <Logo/>
            <div><b>Operix</b><small>Procurement</small></div>
          </a>
          {/* Nav links */}
          <nav className="tb-nav">
            <a href="shop.html" className="tb-nav-link active">
              <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1.5 7h13M10 21a1 1 0 100-2 1 1 0 000 2zm7 0a1 1 0 100-2 1 1 0 000 2z"/></svg>
              Shop
            </a>
            <a href="my-orders.html" className="tb-nav-link">
              <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
              My Orders
            </a>
            {userRole==='admin' && (user?.assignedRole==='admin_approver' || user?.permissions?.includes('*')) && (
              <a href="shop-admin.html" className="tb-nav-link" style={{color:'#FBBF24'}}>
                <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
                Edit Shop
              </a>
            )}
          </nav>
          <div className="tb-spacer"/>
          {/* Quick Quote */}
          <button className="tb-quote-btn"
            onClick={()=>{setQuoteForm({email:'',recipientName:'',reference:user?.displayName||user?.fullName||'',notes:''});setQuoteSuccess(false);setShowQuote(true);}}>
            <svg width="13" height="13" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            Quick Quote
          </button>
          {/* Cart */}
          <a href="cart.html" className="tb-cart-btn">
            <svg width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            Cart
            <span className="tb-cart-cnt">{cartCount}</span>
          </a>
          {/* Account dropdown */}
          <AccountDropdown
            user={user}
            userRole={userRole}
            onSignOut={()=>firebase.auth().signOut().then(()=>{window.location.href='login.html';})}
            extraItems={[
              {href:'my-orders.html', label:'My Orders', icon:<svg width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>},
              {href:'cart.html',      label:'View Cart',  icon:<svg width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>},
            ]}
          />
        </div>
      </header>

      {/* BREADCRUMB */}
      <div className="bc">
        <div className="bc-inner">
        <span className="bc-item" style={{color:view==='landing'?'var(--ink)':'var(--blue)'}} onClick={goLanding}>Shop</span>
        {selMain&&(<><span className="bc-sep">›</span><span className="bc-item" style={{color:selSub?'var(--blue)':'var(--ink)'}} onClick={()=>{setSelSub(null);setSearchQ('')}}>{selMain}</span></>)}
        {selSub&&(<><span className="bc-sep">›</span><span className="bc-item bc-active">{selSub}</span></>)}
        <span style={{marginLeft:'auto',fontSize:11,color:'var(--slate)'}}>{products.length} products · {products.filter(p=>p.stock>0).length} available</span>
        </div>
      </div>

      {/* HERO SLIDER — full width, landing view only */}
      {view==='landing'&&<HeroSlider slides={shopConfig.slides}/>}

      {/* PROMO BANNERS — full width, landing view only */}
      {view==='landing'&&<PromoBanners banners={shopConfig.banners}/>}

      {/* BODY */}
      <div className="layout-wrap">
      <div className="layout">
        <main className="main">

          {/* FX RATES BANNER */}
          {showFxRateDetails&&fxRateDate&&Object.keys(fxRates).length>0&&(
            <div style={{display:'flex',alignItems:'center',gap:8,padding:'7px 14px',background:'#EFF6FF',border:'1px solid #BFDBFE',borderRadius:8,marginBottom:14,flexWrap:'wrap'}}>
              <svg width="13" height="13" fill="none" stroke="#1D4ED8" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
              <span style={{fontSize:11,fontWeight:700,color:'#1E40AF'}}>All prices shown in PHP</span>
              <span style={{fontSize:11,color:'#3B82F6'}}>·</span>
              {Object.entries(fxRates).map(([cur,rate])=>(
                <span key={cur} style={{fontSize:11,color:'#1D4ED8',fontWeight:600,background:'#DBEAFE',padding:'2px 8px',borderRadius:4}}>
                  1 {cur} = ₱{fmt(rate,4)}
                </span>
              ))}
              <span style={{fontSize:10,color:'#60A5FA',marginLeft:'auto'}}>GL rate · {fxRateDate}</span>
            </div>
          )}
          {!fxLoading&&fxRateDate===null&&products.some(p=>p.currency&&p.currency!=='PHP')&&(
            <div style={{display:'flex',alignItems:'center',gap:8,padding:'7px 14px',background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:8,marginBottom:14}}>
              <svg width="13" height="13" fill="none" stroke="#D97706" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              <span style={{fontSize:11,fontWeight:600,color:'#92400E'}}>Exchange rates are not configured for today. Foreign-currency items are shown in their original currency. Please contact your administrator.</span>
            </div>
          )}

          {/* LANDING */}
          {view==='landing'&&(
            <div>
              <div className="hero">
                <h1>{heroTitle}</h1>
                <p>{heroSub}</p>
              </div>
              <div className="cat-grid">
                {mainCats.map((main,idx)=>{
                  const{cc,cbg}=pal(idx);
                  const subs=Object.keys(catTree[main]||{});
                  const total=Object.values(catTree[main]||{}).flat().length;
                  const avail=Object.values(catTree[main]||{}).flat().filter(p=>p.stock>0).length;
                  const catImg=shopConfig.categoryImages?.[main];
                  return(
                    <div key={main} className="cat-card" onClick={()=>goCat(main)}>
                      <div className="cat-card-bg" style={{background:cbg}}/>
                      <div className="cat-arrow"><Ic d={P.arrow} s={16} c={cc}/></div>
                      {catImg
                        ? <img src={catImg} alt={main} className="cat-card-img" onError={e=>e.target.style.display='none'}/>
                        : <div className="cat-card-img-ph" style={{background:cbg}}><Ic d={P.tag} s={36} c={cc}/></div>
                      }
                      <div className="cat-card-body">
                        <div className="cat-name">{main}</div>
                        <div className="cat-meta">
                          <span>{total} item{total!==1?'s':''}</span>
                          <span style={{width:3,height:3,borderRadius:'50%',background:'var(--line)',display:'inline-block'}}/>
                          <span style={{color:cc,fontWeight:700}}>{avail} available</span>
                        </div>
                        <div className="sub-pills">
                          {subs.slice(0,4).map(s=><span key={s} className="sub-pill">{s}</span>)}
                          {subs.length>4&&<span className="sub-pill">+{subs.length-4} more</span>}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* CATEGORY VIEW */}
          {view==='category'&&selMain&&(
            <>
              {/* Top bar: back + title + search */}
              <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:18,flexWrap:'wrap'}}>
                <button onClick={goLanding} style={{display:'flex',alignItems:'center',gap:5,background:'var(--surf)',border:'1.5px solid var(--line)',borderRadius:8,padding:'6px 13px',font:'600 12px DM Sans,sans-serif',cursor:'pointer',color:'var(--slate)',flexShrink:0}}>
                  <Ic d={P.back} s={12}/> All Categories
                </button>
                <div style={{flex:1,minWidth:0}}>
                  <h2 style={{fontSize:20,fontWeight:900,color:'var(--ink)',letterSpacing:'-.4px',lineHeight:1.2}}>{selMain}</h2>
                  <p style={{fontSize:12,color:'var(--slate)',marginTop:1}}>{subCats.length} subcategor{subCats.length===1?'y':'ies'} · {Object.values(catTree[selMain]||{}).flat().length} items</p>
                </div>
                {/* Search inline with header */}
                <div className="sbar" style={{maxWidth:340,margin:0,flex:'0 0 auto',minWidth:200}}>
                  <Ic d={P.search} s={14} c="var(--slate)"/>
                  <input type="text" placeholder={`Search in ${selSub||selMain}…`} value={searchQ} onChange={e=>setSearchQ(e.target.value)}/>
                  {searchQ&&<button onClick={()=>setSearchQ('')} style={{border:'none',background:'none',cursor:'pointer',color:'var(--slate)',display:'flex',padding:2}}><Ic d={P.x} s={12}/></button>}
                </div>
              </div>

              {/* Fluent two-column: sidebar nav + product grid */}
              <div className="cat-layout">

                {/* ── LEFT SIDEBAR ── */}
                {subCats.length>1&&(
                  <nav className="cat-sidebar">
                    <div className="cat-sidebar-hd">Subcategories</div>

                    {/* All */}
                    <div className={`cat-nav-item all-item ${!selSub?'sel':''}`} onClick={()=>{setSelSub(null);setSearchQ('');setCurrentPage(1);}}>
                      <span className="cnav-name">All Items</span>
                      <span className="cnav-badge">{Object.values(catTree[selMain]||{}).flat().length}</span>
                    </div>

                    {subCats.map(sub=>{
                      const cnt=(catTree[selMain]||{})[sub]?.length||0;
                      return(
                        <div key={sub} className={`cat-nav-item ${selSub===sub?'sel':''}`} onClick={()=>{setSelSub(selSub===sub?null:sub);setSearchQ('');setCurrentPage(1);}}>
                          <span className="cnav-name" title={sub}>{sub}</span>
                          <span className="cnav-badge">{cnt}</span>
                        </div>
                      );
                    })}
                  </nav>
                )}

                {/* ── MAIN PRODUCT AREA ── */}
                <div className="cat-main-area">

                                    {/* ── SORT / VIEW / PRICE TOOLBAR ── */}
                  <div className="shop-toolbar">

                    {/* Row 1: Category label + Sort + View toggle */}
                    <div className="toolbar-row1">
                      {/* Category label + clear */}
                      <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
                        <span style={{fontSize:13,fontWeight:800,color:'var(--ink)',whiteSpace:'nowrap'}}>
                          {selSub||`All in ${selMain}`}
                        </span>
                        {selSub&&(
                          <button onClick={()=>{setSelSub(null);setSearchQ('');setCurrentPage(1);}}
                            style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:11,fontWeight:600,color:'var(--blue)',background:'var(--blue-bg)',border:'none',borderRadius:99,padding:'2px 9px',cursor:'pointer',fontFamily:'DM Sans,sans-serif'}}>
                            <Ic d={P.x} s={9} c="var(--blue)"/> Clear
                          </button>
                        )}
                      </div>

                      <div className="toolbar-sep"/>

                      {/* Sort By */}
                      <div className="sort-select-wrap">
                        <span className="sort-lbl">Sort:</span>
                        <select className="sort-select" value={sortBy} onChange={e=>{setSortBy(e.target.value);setCurrentPage(1);}}>
                          <option value="best">Best Match</option>
                          <option value="price_asc">Price: Low to High</option>
                          <option value="price_desc">Price: High to Low</option>
                          <option value="name_asc">Name A–Z</option>
                        </select>
                      </div>

                      {/* Spacer */}
                      <div style={{flex:1}}/>

                      {/* Result count */}
                      <span className="result-count">{allFilteredProds.length} item{allFilteredProds.length!==1?'s':''}</span>

                      <div className="toolbar-sep"/>

                      {/* View Toggle */}
                      <div style={{display:'flex',alignItems:'center',gap:7,flexShrink:0}}>
                        <span className="sort-lbl">View:</span>
                        <div className="view-toggle">
                          <button className={`vt-btn ${viewMode==='grid'?'active':''}`} title="Grid view" onClick={()=>setViewMode('grid')}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                          </button>
                          <button className={`vt-btn ${viewMode==='list'?'active':''}`} title="List view" onClick={()=>setViewMode('list')}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                          </button>
                        </div>
                      </div>
                    </div>

                    {/* Row 2: Price Range filter */}
                    <div className="toolbar-row2">
                      <span className="price-range-lbl">₱ Price:</span>
                      <input type="number" className="price-input" placeholder="Min" value={priceMin}
                        onChange={e=>{setPriceMin(e.target.value);setCurrentPage(1);}} min="0"/>
                      <span className="price-dash">—</span>
                      <input type="number" className="price-input" placeholder="Max" value={priceMax}
                        onChange={e=>{setPriceMax(e.target.value);setCurrentPage(1);}} min="0"/>
                      {(priceMin||priceMax)&&(
                        <button onClick={()=>{setPriceMin('');setPriceMax('');setCurrentPage(1);}}
                          style={{display:'flex',alignItems:'center',gap:5,padding:'4px 10px',border:'none',background:'var(--red-bg)',borderRadius:6,cursor:'pointer',color:'var(--red)',fontFamily:'DM Sans,sans-serif',fontSize:11,fontWeight:700,flexShrink:0}}>
                          <Ic d={P.x} s={9} c="var(--red)"/> Clear price
                        </button>
                      )}
                      {!priceMin&&!priceMax&&(
                        <span style={{fontSize:11,color:'var(--slate)',fontStyle:'italic'}}>Enter a min and/or max to filter by price</span>
                      )}
                    </div>

                  </div>

                  {/* Empty state */}
                  {visibleProds.length===0&&allFilteredProds.length===0&&(
                    <div style={{textAlign:'center',padding:'60px 20px',color:'var(--slate)'}}>
                      <div style={{width:60,height:60,background:'var(--surf)',borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 14px'}}><Ic d={P.box} s={26} c="var(--slate)"/></div>
                      <p style={{fontSize:15,fontWeight:700,color:'var(--ink)',marginBottom:5}}>No products found</p>
                      <p style={{fontSize:13}}>Try adjusting your search, price range, or selecting a different subcategory</p>
                    </div>
                  )}

                  {/* ── GRID VIEW ── */}
                  {viewMode==='grid'&&(
                  <div className="prod-grid">
                    {visibleProds.map(product=>{
                      const{sub}=parseCat(product.category);
                      const inCart=cart.find(i=>i.id===product.id);
                      const isOut=product.stock===0;
                      const isLow=!isOut&&product.stock<=(product.threshold||10);
                      return(
                        <div key={product.id} className="prod-card" onClick={()=>openProduct(product)}>
                          <div className="prod-img">
                            {product.imageUrl
                              ? <img src={product.imageUrl} alt={product.name} onError={e=>e.target.style.display='none'}/>
                              : <div style={{opacity:.3}}><Ic d={P.box} s={34} c="var(--slate)"/></div>
                            }
                            {isOut&&<div className="badge-out">OUT OF STOCK</div>}
                            {!isOut&&isLow&&<div className="badge-low">LOW STOCK</div>}
                          </div>
                          <div className="prod-body">
                            {!selSub&&subCats.length>1&&<div className="prod-sub">{sub}</div>}
                            <div className="prod-name">{product.name}</div>
                            <div className="prod-sku">{product.sku}</div>
                            {product.description&&<div className="prod-desc">{product.description}</div>}
                            {(()=>{
                              const fx=convertToPhp(product.price,product.currency||'PHP');
                              return(<>
                                <div className="prod-price">₱{fmt(fx.phpPrice)}</div>
                                {showFxRateDetails&&fx.converted&&<div style={{fontSize:10,color:'var(--slate)',marginTop:1,fontWeight:500}}>{getCurrencySymbol(product.currency)}{fmt(product.price)} {product.currency} · rate {fmt(fx.rate,4)}</div>}
                                {showFxRateDetails&&!fx.converted&&product.currency&&product.currency!=='PHP'&&<div style={{fontSize:10,color:'#F59E0B',marginTop:1,fontWeight:600}}>No rate for {product.currency} today</div>}
                              </>);
                            })()}
                            <div className="prod-uom">per {product.unit||'unit'}</div>
                            {(product.moq||product.leadTime)&&(
                              <div className="prod-specs">
                                {product.moq&&<span className="spec-tag">MOQ <b>{product.moq} {product.unit||'unit'}</b></span>}
                                {product.leadTime&&<span className="spec-tag">Lead Time <b>{product.leadTime} day{product.leadTime!=1?'s':''}</b></span>}
                              </div>
                            )}
                            <div className="prod-footer" onClick={e=>e.stopPropagation()}>
                              {isOut
                                ? <span className="stk-out"><span className="dot"/>Out of stock</span>
                                : isLow
                                ? <span className="stk-low"><span className="dot"/>{product.stock} {product.unit||'unit'}</span>
                                : <span className="stk-ok"><span className="dot"/>{product.stock} {product.unit||'unit'}</span>
                              }
                              {inCart
                                ? <div style={{display:'flex',alignItems:'center',gap:4}} onClick={e=>e.stopPropagation()}>
                                    <div className="qc">
                                      <button className="qb" onClick={e=>{e.stopPropagation();updateQty(product.id,inCart.quantity-1);}}>−</button>
                                      <span className="qi" style={{display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:800,color:'var(--ink)'}}>{inCart.quantity}</span>
                                      <button className="qb" onClick={e=>{e.stopPropagation();updateQty(product.id,inCart.quantity+1);}}>+</button>
                                    </div>
                                  </div>
                                : <button className="add-btn" disabled={isOut} onClick={e=>{e.stopPropagation();addToCart(product,ltAdjustMap);}}>
                                    <Ic d={P.plus} s={12}/>Add
                                  </button>
                              }
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                  )}

                  {/* ── LIST VIEW ── */}
                  {viewMode==='list'&&(
                  <div className="prod-list">
                    {visibleProds.map(product=>{
                      const{sub}=parseCat(product.category);
                      const inCart=cart.find(i=>i.id===product.id);
                      const isOut=product.stock===0;
                      const isLow=!isOut&&product.stock<=(product.threshold||10);
                      const fx=convertToPhp(product.price,product.currency||'PHP');
                      return(
                        <div key={product.id} className="prod-list-item" onClick={()=>openProduct(product)}>
                          <div className="pli-img" style={{background:'var(--surf)'}}>
                            {product.imageUrl
                              ? <img src={product.imageUrl} alt={product.name} style={{maxWidth:'100%',maxHeight:'100%',objectFit:'contain',padding:8}} onError={e=>e.target.style.display='none'}/>
                              : <div style={{opacity:.3}}><Ic d={P.box} s={28} c="var(--slate)"/></div>
                            }
                            {isOut&&<div className="badge-out" style={{top:8,right:8,fontSize:8}}>OUT</div>}
                            {!isOut&&isLow&&<div className="badge-low" style={{top:8,right:8,fontSize:8}}>LOW</div>}
                          </div>
                          <div className="pli-body">
                            <div className="pli-info">
                              {!selSub&&subCats.length>1&&<div className="pli-sub">{sub}</div>}
                              <div className="pli-name">{product.name}</div>
                              <div className="pli-sku">{product.sku}</div>
                              {product.description&&<div className="pli-desc">{product.description}</div>}
                              <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:6}}>
                                {isOut?<span className="stk-out"><span className="dot"/>Out of stock</span>:isLow?<span className="stk-low"><span className="dot"/>{product.stock} {product.unit||'unit'}</span>:<span className="stk-ok"><span className="dot"/>{product.stock} {product.unit||'unit'}</span>}
                                {product.moq&&<span className="spec-tag">MOQ <b>{product.moq}</b></span>}
                                {product.leadTime&&<span className="spec-tag">Lead <b>{product.leadTime}d</b></span>}
                              </div>
                            </div>
                            <div className="pli-price-block">
                              <div className="pli-price">₱{fmt(fx.phpPrice)}</div>
                              <div className="pli-uom">per {product.unit||'unit'}</div>
                              {showFxRateDetails&&fx.converted&&<div style={{fontSize:10,color:'var(--slate)',marginTop:2,fontWeight:500}}>{getCurrencySymbol(product.currency)}{fmt(product.price)} {product.currency}</div>}
                            </div>
                            <div className="pli-actions" onClick={e=>e.stopPropagation()}>
                              {inCart
                                ? <div className="qc">
                                    <button className="qb" onClick={e=>{e.stopPropagation();updateQty(product.id,inCart.quantity-1);}}>−</button>
                                    <span className="qi" style={{display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:800,color:'var(--ink)'}}>{inCart.quantity}</span>
                                    <button className="qb" onClick={e=>{e.stopPropagation();updateQty(product.id,inCart.quantity+1);}}>+</button>
                                  </div>
                                : <button className="add-btn" disabled={isOut} onClick={e=>{e.stopPropagation();addToCart(product,ltAdjustMap);}}>
                                    <Ic d={P.plus} s={12}/>Add
                                  </button>
                              }
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                  )}

                  {/* ── PAGINATION ── */}
                  {totalPages>1&&(
                    <div className="pagination">
                      <button className="pg-btn" disabled={safePage<=1} onClick={()=>{setCurrentPage(p=>Math.max(1,p-1));window.scrollTo({top:100,behavior:'smooth'});}}>
                        <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 18l-6-6 6-6"/></svg>
                      </button>
                      {(()=>{
                        const pages=[];
                        const range=2;
                        for(let n=1;n<=totalPages;n++){
                          if(n===1||n===totalPages||Math.abs(n-safePage)<=range){
                            pages.push(n);
                          } else if(pages[pages.length-1]!=='...'){
                            pages.push('...');
                          }
                        }
                        return pages.map((n,i)=>n==='...'
                          ? <span key={'e'+i} className="pg-ellipsis">…</span>
                          : <button key={n} className={`pg-btn ${n===safePage?'active':''}`}
                              onClick={()=>{setCurrentPage(n);window.scrollTo({top:100,behavior:'smooth'});}}>
                              {n}
                            </button>
                        );
                      })()}
                      <button className="pg-btn" disabled={safePage>=totalPages} onClick={()=>{setCurrentPage(p=>Math.min(totalPages,p+1));window.scrollTo({top:100,behavior:'smooth'});}}>
                        <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 18l6-6-6-6"/></svg>
                      </button>
                      <span className="pg-info">Page {safePage} of {totalPages} · {allFilteredProds.length} products</span>
                    </div>
                  )}
                </div>{/* end cat-main-area */}
              </div>{/* end cat-layout */}
            </>
          )}
        </main>

        {/* FLOATING CART PILL — links to cart.html */}
        {cart.length>0&&(
          <a href="cart.html" style={{
            position:'fixed',bottom:28,right:28,zIndex:500,
            display:'flex',alignItems:'center',gap:10,
            background:'var(--ink)',color:'#fff',
            padding:'13px 20px',borderRadius:14,
            textDecoration:'none',
            boxShadow:'0 8px 28px rgba(0,0,0,.28)',
            transition:'all .2s',fontFamily:'DM Sans,sans-serif',
            border:'1px solid rgba(255,255,255,.1)'
          }}
          onMouseOver={e=>{e.currentTarget.style.background='#1E2D45';e.currentTarget.style.transform='translateY(-2px)';}}
          onMouseOut={e=>{e.currentTarget.style.background='var(--ink)';e.currentTarget.style.transform='translateY(0)';}}>
            <div style={{position:'relative'}}>
              <Ic d={P.cart} s={18} c="#fff"/>
              <span style={{position:'absolute',top:-8,right:-10,background:'var(--blue)',color:'#fff',fontSize:9,fontWeight:900,minWidth:17,height:17,borderRadius:99,display:'flex',alignItems:'center',justifyContent:'center',padding:'0 4px',border:'2px solid var(--ink)'}}>{cartCount}</span>
            </div>
            <div>
              <div style={{fontSize:13,fontWeight:800,letterSpacing:'-.2px'}}>View Cart</div>
              <div style={{fontSize:11,color:'#94A3B8',marginTop:1}}>{cart.length} item{cart.length!==1?'s':''} · {cartTotalDisplay}</div>
            </div>
            <svg width="14" height="14" fill="none" stroke="#64748B" strokeWidth="2" viewBox="0 0 24 24" strokeLinecap="round" strokeLinejoin="round"><path d="M9 5l7 7-7 7"/></svg>
          </a>
        )}
      </div>
      </div>{/* end layout-wrap */}

      {/* RECENTLY VIEWED */}
      <RecentlyViewed items={recentlyViewed.filter(p=>p.id!==detailProduct?.id)} onOpen={openProduct} fxRates={fxRates}/>

      {/* FOOTER */}
      <ShopFooter footerData={shopConfig.footer}/>

      {/* PRODUCT DETAIL MODAL */}
      {detailProduct&&(
        <ProductDetail
          product={detailProduct}
          allProducts={products}
          cart={cart}
          onAdd={addToCart}
          onUpdateQty={updateQty}
          onClose={()=>setDetailProduct(null)}
          onOpenProduct={p=>{setDetailProduct(null);setTimeout(()=>setDetailProduct(p),80);}}
          ltAdjustMap={ltAdjustMap}
          fxRates={fxRates}
          showFxRateDetails={showFxRateDetails}
          showSupplierName={showSupplierName}
          displayCompanyName={displayCompanyName}
        />
      )}

      {/* CHECKOUT MODAL */}
      {showCO&&(
        <div className="ov" onClick={e=>e.target===e.currentTarget&&setShowCO(false)}>
          <div className="modal">
            <div className="m-hd">
              <div><div className="m-title">Checkout</div><div className="m-sub">{cartCount} item{cartCount!==1?'s':''} · {cartTotalDisplay}</div></div>
              <button className="m-close" onClick={()=>setShowCO(false)}><Ic d={P.x} s={16}/></button>
            </div>
            <div className="m-body">
              <div className="f-sec">
                <div className="f-lbl"><Ic d={P.orders} s={13}/>Order Summary</div>
                {cart.map(item=>(
                  <div key={item.id} className="ord-item">
                    <div>
                      <div className="ord-name">{item.name}</div>
                      <div className="ord-meta">{item.quantity} × {(()=>{const fx=convertToPhp(item.price,item.currency||'PHP');return fx.converted?'₱'+fmt(fx.phpPrice)+' ('+getCurrencySymbol(item.currency)+fmt(item.price)+' '+item.currency+')':getCurrencySymbol(item.currency)+fmt(item.price);})()}{item.unit&&` · ${item.unit}`}{item.moq&&` · MOQ: ${item.moq}`}{item.leadTime&&` · Lead: ${item.leadTime}d`}{item.tentativeDelivery&&<span style={{color:'var(--blue)',fontWeight:600}}>{` · 🚚 ${new Date(item.tentativeDelivery+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`}</span>}{item.needByDate&&<span style={{color:item.tentativeDelivery&&item.needByDate<item.tentativeDelivery?'#FB923C':'inherit'}}>{` · Need by: ${new Date(item.needByDate+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}${item.tentativeDelivery&&item.needByDate<item.tentativeDelivery?' ⚠':''}`}</span>}</div>
                    </div>
                    <span className="ord-total">{(()=>{const fx=convertToPhp(item.price,item.currency||'PHP');return '₱'+fmt(fx.phpPrice*item.quantity);})()}</span>
                  </div>
                ))}
                <div className="grand-box"><span>Grand Total</span><span>{cartTotalDisplay}</span></div>
              </div>
              <div className="divider"/>
              <div className="f-sec">
                <div className="f-lbl"><Ic d={P.info} s={13}/>Contact Information</div>
                <div className="fg fg2">
                  <div><label className="fl">Full Name *</label><input className="fi" type="text" placeholder="Your full name" value={form.customerName} onChange={e=>setForm({...form,customerName:e.target.value})}/></div>
                  <div><label className="fl">Email *</label><input className="fi" type="email" placeholder="email@example.com" value={form.customerEmail} onChange={e=>setForm({...form,customerEmail:e.target.value})}/></div>
                  <div><label className="fl">Phone</label><input className="fi" type="tel" placeholder="+63 000 000 0000" value={form.customerPhone} onChange={e=>setForm({...form,customerPhone:e.target.value})}/></div>
                  <div><label className="fl">Payment Method</label><select className="fi fsel" value={form.paymentMethod} onChange={e=>setForm({...form,paymentMethod:e.target.value})}>{['Cash','Credit Card','Debit Card','Bank Transfer','Check','GCash'].map(m=><option key={m}>{m}</option>)}</select></div>
                </div>
              </div>
              <div className="f-sec">
                <div className="f-lbl"><Ic d={P.box} s={13}/>Delivery Information</div>
                <div className="fg">
                  {savedAddresses.length > 0 ? (
                    <div>
                      <label className="fl">Delivery Address *</label>
                      <div style={{display:'grid',gap:8,marginBottom:8}}>
                        {savedAddresses.map(addr=>{
                          const full=[addr.street,addr.city,addr.province,addr.zipCode,addr.country].filter(Boolean).join(', ');
                          const isSelected=form.deliveryAddress===full;
                          return(
                            <div key={addr.id}
                              onClick={()=>setForm(f=>({...f,deliveryAddress:full}))}
                              style={{padding:'10px 14px',border:`1.5px solid ${isSelected?'var(--blue)':'var(--line)'}`,borderRadius:10,cursor:'pointer',background:isSelected?'var(--blue-bg)':'#fff',transition:'all .18s',display:'flex',alignItems:'flex-start',gap:10}}>
                              <div style={{width:16,height:16,borderRadius:'50%',border:`2px solid ${isSelected?'var(--blue)':'#CBD5E1'}`,background:isSelected?'var(--blue)':'#fff',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:2,transition:'all .18s'}}>
                                {isSelected&&<div style={{width:6,height:6,borderRadius:'50%',background:'#fff'}}/>}
                              </div>
                              <div style={{flex:1,minWidth:0}}>
                                <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:2}}>
                                  <span style={{fontSize:11,fontWeight:800,color:isSelected?'var(--blue)':'var(--slate)',textTransform:'uppercase',letterSpacing:'.06em'}}>{addr.label}</span>
                                  {addr.isDefault&&<span style={{fontSize:9,fontWeight:800,background:isSelected?'var(--blue)':'var(--green)',color:'#fff',padding:'1px 6px',borderRadius:99,letterSpacing:'.05em'}}>DEFAULT</span>}
                                </div>
                                <div style={{fontSize:12,color:'var(--ink)',lineHeight:1.45,fontWeight:500}}>{full}</div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                      <div style={{marginBottom:4}}>
                        <label className="fl" style={{marginBottom:4}}>Or enter a different address</label>
                        <input className="fi" type="text" placeholder="Type a custom address…" value={savedAddresses.some(a=>[a.street,a.city,a.province,a.zipCode,a.country].filter(Boolean).join(', ')===form.deliveryAddress)?'':form.deliveryAddress}
                          onChange={e=>setForm(f=>({...f,deliveryAddress:e.target.value}))}/>
                      </div>
                      <a href="my-profile.html" style={{fontSize:11,color:'var(--blue)',fontWeight:600,textDecoration:'none',display:'inline-flex',alignItems:'center',gap:4,marginTop:2}}>
                        <svg width="11" height="11" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>
                        Manage addresses in My Profile
                      </a>
                    </div>
                  ) : (
                    <div>
                      <label className="fl">Delivery Address *</label>
                      <input className="fi" type="text" placeholder="Complete delivery address" value={form.deliveryAddress} onChange={e=>setForm(f=>({...f,deliveryAddress:e.target.value}))}/>
                      <div style={{marginTop:8,padding:'10px 12px',background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:8,display:'flex',alignItems:'center',gap:8}}>
                        <svg width="13" height="13" fill="none" stroke="#D97706" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path strokeLinecap="round" strokeLinejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        <span style={{fontSize:11,color:'#92400E',fontWeight:600}}>No saved addresses. </span>
                        <a href="my-profile.html" style={{fontSize:11,color:'var(--blue)',fontWeight:700,textDecoration:'none'}}>+ Add address in My Profile →</a>
                      </div>
                    </div>
                  )}
                  <div><label className="fl">Special Instructions</label><textarea className="fi" rows={3} placeholder="Notes or special instructions…" value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} style={{resize:'vertical'}}/></div>
                </div>
              </div>
              <button className="co-btn" onClick={submitOrder} disabled={submitting}>
                {submitting?<><div className="spin-anim"/>Placing Order…</>:<><Ic d={P.check} s={16}/>Confirm Order · {cartTotalDisplay}</>}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* QUICK QUOTE SLIDE PANEL */}
      {showQuote&&(
        <>
          <div className="qq-backdrop" onClick={()=>{if(!quoteSending){setShowQuote(false);setQuoteSuccess(false);}}}/>
          <div className="qq-panel">

            {/* Fluent UI Panel Header */}
            <div className="qq-hd">
              <div style={{display:'flex',alignItems:'flex-start',flex:1,minWidth:0}}>
                <div className="qq-hd-icon">
                  <svg width="18" height="18" fill="none" stroke="#0078d4" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                </div>
                <div style={{minWidth:0}}>
                  <div className="qq-hd-title">Quick Quote</div>
                  <div className="qq-hd-sub">{cart.length} item{cart.length!==1?'s':''} · {cartTotalDisplay} estimated total</div>
                </div>
              </div>
              <button className="qq-close" onClick={()=>{setShowQuote(false);setQuoteSuccess(false);}} disabled={quoteSending} title="Close">
                <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>

            {quoteSuccess?(
              /* ── SUCCESS STATE — approval-aware ── */
              <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'40px 24px',textAlign:'center',fontFamily:"'Segoe UI',system-ui,sans-serif"}}>
                {quoteSuccess.approvalStatus==='pending_approval'?(
                  <>
                    <div style={{width:64,height:64,background:'#f3f2f1',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:16}}>
                      <svg width="30" height="30" fill="none" stroke="#7C3AED" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                    </div>
                    <div style={{fontSize:18,fontWeight:600,color:'#323130',marginBottom:8,fontFamily:"'Segoe UI',system-ui,sans-serif"}}>Submitted for Approval</div>
                    <div style={{background:'#eff6fc',borderLeft:'3px solid #0078d4',borderRadius:'0 2px 2px 0',padding:'10px 14px',marginBottom:12,width:'100%',textAlign:'left'}}>
                      <div style={{fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em',color:'#004578',marginBottom:4}}>Quote Number</div>
                      <div style={{fontFamily:'monospace',fontSize:15,fontWeight:700,color:'#323130'}}>{quoteSuccess.quoteNumber}</div>
                    </div>
                    <div style={{background:'#f3f2f1',border:'1px solid #edebe9',borderRadius:2,padding:'12px 14px',marginBottom:18,width:'100%',textAlign:'left'}}>
                      <div style={{fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em',color:'#7C3AED',marginBottom:4,fontFamily:"'Segoe UI',system-ui,sans-serif"}}>Approval Required</div>
                      <div style={{fontSize:12,color:'#4C1D95',lineHeight:1.65,fontFamily:"'Segoe UI',system-ui,sans-serif"}}>
                        {quoteSuccess.approvalGroupName&&<>Routed through <strong>{quoteSuccess.approvalGroupName}</strong>. </>}
                        {quoteSuccess.assignedApproverName&&<>Assigned to <strong>{quoteSuccess.assignedApproverName}</strong>.</>}
                        {' '}The recipient will receive the quote email only after all approval steps are completed.
                      </div>
                    </div>
                    <div style={{fontSize:12,color:'#605e5c',lineHeight:1.65,marginBottom:20,fontFamily:"'Segoe UI',system-ui,sans-serif"}}>You'll be notified once the quotation is approved. Track its status in My Quotes.</div>
                  </>
                ):(
                  <>
                    <div style={{width:64,height:64,background:'#dff6dd',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:16}}>
                      <svg width="28" height="28" fill="none" stroke="#107c10" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>
                    </div>
                    <div style={{fontSize:18,fontWeight:600,color:'#323130',marginBottom:8,fontFamily:"'Segoe UI',system-ui,sans-serif"}}>Quote Sent!</div>
                    <div style={{background:'#eff6fc',borderLeft:'3px solid #0078d4',borderRadius:'0 2px 2px 0',padding:'10px 14px',marginBottom:12,width:'100%',textAlign:'left'}}>
                      <div style={{fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em',color:'#004578',marginBottom:4,fontFamily:"'Segoe UI',system-ui,sans-serif"}}>Quote Number</div>
                      <div style={{fontFamily:'monospace',fontSize:15,fontWeight:700,color:'#323130'}}>{quoteSuccess.quoteNumber}</div>
                    </div>
                    <div style={{fontSize:13,color:'#605e5c',lineHeight:1.6,marginBottom:8,fontFamily:"'Segoe UI',system-ui,sans-serif"}}>Sent to <strong style={{color:'#323130'}}>{quoteForm.email}</strong></div>
                    <div style={{display:'flex',alignItems:'center',gap:8,background:'#fff4ce',borderLeft:'3px solid #ffb900',borderRadius:'0 2px 2px 0',padding:'8px 12px',marginBottom:20,fontSize:12,color:'#605e5c',fontFamily:"'Segoe UI',system-ui,sans-serif"}}>
                      <svg width="14" height="14" fill="none" stroke="#797673" strokeWidth="2" viewBox="0 0 24 24" style={{flexShrink:0}}><path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                      Prices fixed and valid for 30 days
                    </div>
                  </>
                )}
                <button onClick={()=>{setShowQuote(false);setQuoteSuccess(false);}}
                  style={{width:'100%',maxWidth:280,height:32,background:'#0078d4',color:'#fff',border:'none',borderRadius:2,fontSize:14,fontWeight:600,cursor:'pointer',fontFamily:"'Segoe UI',system-ui,sans-serif"}}>Done</button>
                <a href="my-orders.html" style={{marginTop:12,fontSize:12,color:'#0078d4',fontWeight:600,textDecoration:'none',fontFamily:"'Segoe UI',system-ui,sans-serif"}}>View My Quotes →</a>
              </div>
            ):(
              <>
                {/* ── BODY ── */}
                <div className="qq-body">

                  {/* Fluent Validity Notice */}
                  <div style={{padding:'12px 24px',background:'#f3f2f1',borderBottom:'1px solid #edebe9'}}>
                    <div className="qq-validity">
                      <svg width="14" height="14" fill="none" stroke="#0078d4" strokeWidth="2" viewBox="0 0 24 24" style={{flexShrink:0,marginTop:1}}><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                      <span>Prices will be <strong>fixed for 30 days</strong>. The recipient can redeem this quote directly from the email.</span>
                    </div>
                  </div>

                  {/* Items in Quote — Fluent List */}
                  <div className="qq-section">
                    <div className="qq-section-title">Items in this Quote ({cart.length})</div>
                    {cart.map(item=>(
                      <div key={item.id} className="qq-item-row">
                        <div style={{flex:1,minWidth:0}}>
                          <div className="qq-item-name">{item.name}</div>
                          <div className="qq-item-meta">{item.quantity} {item.unit||'unit'} × {'₱'+fmt(convertToPhp(item.price,item.currency||'PHP').phpPrice)}{item.sku&&` · ${item.sku}`}</div>
                        </div>
                        <div className="qq-item-price">{'₱'+fmt(convertToPhp(item.price,item.currency||'PHP').phpPrice*item.quantity)}</div>
                      </div>
                    ))}
                    <div className="qq-total-row">
                      <span style={{fontSize:13,fontWeight:600,color:'#ffffff',fontFamily:"'Segoe UI',system-ui,sans-serif"}}>Estimated Total</span>
                      <span style={{fontSize:16,fontWeight:700,color:'#ffffff',fontFamily:"'Segoe UI',system-ui,sans-serif"}}>{cartTotalDisplay}</span>
                    </div>
                  </div>

                  {/* Recipient Details — Fluent Form */}
                  <div className="qq-form-section">
                    <div className="qq-field">
                      <label className="qq-fl">Recipient Name <span style={{color:'#a4262c'}}>*</span></label>
                      <input type="text" className="qq-fi" value={quoteForm.recipientName} placeholder="e.g. Maria Santos"
                        onChange={e=>setQuoteForm(f=>({...f,recipientName:e.target.value}))}/>
                      <div className="qq-field-hint">Full name of the person receiving this quote</div>
                    </div>

                    <div className="qq-field">
                      <label className="qq-fl">Email Address <span style={{color:'#a4262c'}}>*</span></label>
                      <input type="email" className="qq-fi" value={quoteForm.email} placeholder="recipient@company.com"
                        onChange={e=>setQuoteForm(f=>({...f,email:e.target.value}))}/>
                    </div>

                    <div className="qq-field">
                      <label className="qq-fl">Your Reference / Name <span style={{color:'#a4262c'}}>*</span></label>
                      <input type="text" className="qq-fi" value={quoteForm.reference} placeholder="e.g. Q1 Supplies — Maria Santos"
                        onChange={e=>setQuoteForm(f=>({...f,reference:e.target.value}))}/>
                      <div className="qq-field-hint">This appears as the quote reference on the email</div>
                    </div>

                    <div className="qq-field">
                      <label className="qq-fl">Notes to Recipient</label>
                      <textarea className="qq-fi" rows={3} value={quoteForm.notes} placeholder="Additional instructions, terms, or remarks…"
                        onChange={e=>setQuoteForm(f=>({...f,notes:e.target.value}))} style={{resize:'vertical',height:'auto'}}/>
                    </div>
                  </div>

                </div>

                {/* ── FOOTER — Fluent Primary + Default buttons ── */}
                <div className="qq-ft">
                  <button className="qq-send" onClick={sendQuote} disabled={quoteSending||!cart.length}>
                    {quoteSending
                      ? <><div className="spin-anim"/>Sending Quote…</>
                      : <><svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>Send Quote</>
                    }
                  </button>
                  <button onClick={()=>{setShowQuote(false);setQuoteSuccess(false);}} disabled={quoteSending}
                    style={{width:'100%',height:32,background:'transparent',border:'1px solid #8a8886',borderRadius:2,color:'#323130',fontSize:14,fontWeight:400,cursor:'pointer',fontFamily:"'Segoe UI',system-ui,sans-serif",transition:'background .1s'}}
                    onMouseOver={e=>e.currentTarget.style.background='#f3f2f1'}
                    onMouseOut={e=>e.currentTarget.style.background='transparent'}>
                    Cancel
                  </button>
                </div>
              </>
            )}
          </div>
        </>
      )}

      {/* SUCCESS MODAL */}
      {success&&(
        <div className="ov">
          <div className="modal">
            <div className="succ">
              <>
                <div className="succ-icon"><Ic d={P.check} s={32} c="var(--green)"/></div>
                <div className="succ-title">Order Placed!</div>
                <div className="succ-sub">Your order has been submitted and is awaiting admin review. You'll be notified once it's confirmed and moved to processing.</div>
              </>
              <div className="ord-badge">{success.orderNumber}</div>
              <div style={{width:'100%',background:'#F0FDF4',border:'1.5px solid #A7F3D0',borderRadius:10,padding:'10px 14px',marginBottom:12,display:'flex',alignItems:'flex-start',gap:10,textAlign:'left'}}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#059669" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0,marginTop:1}}><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
                <div style={{fontSize:12,color:'#065F46',lineHeight:1.5}}>
                  <strong>What happens next?</strong> An admin will review and confirm your order in the system. You'll receive a notification once it's confirmed and your order enters processing.
                </div>
              </div>
              <div style={{width:'100%',background:'var(--surf)',borderRadius:12,padding:'14px 16px',marginBottom:20}}>
                <div style={{fontSize:11,fontWeight:800,textTransform:'uppercase',letterSpacing:'.07em',color:'var(--slate)',marginBottom:10}}>Items Ordered</div>
                {success.items.map(item=>{const fx=convertToPhp(item.price,item.currency||'PHP');return(<div key={item.id} style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:6,color:'var(--ink2)'}}><span>{item.name} × {item.quantity}</span><span style={{fontWeight:700}}>₱{fmt(fx.phpPrice*item.quantity)}</span></div>);})}
                <div style={{display:'flex',justifyContent:'space-between',fontSize:14,fontWeight:800,color:'var(--ink)',paddingTop:10,borderTop:'1.5px solid var(--line)',marginTop:8}}><span>Total</span><span>₱{fmt(success.total)}</span></div>
              </div>
              <div style={{display:'flex',gap:10,width:'100%'}}>
                <button onClick={()=>{setSuccess(null);goLanding();}} style={{flex:1,padding:11,borderRadius:9,border:'1.5px solid var(--line)',background:'#fff',fontWeight:600,fontSize:13,cursor:'pointer',fontFamily:'DM Sans,sans-serif',color:'var(--ink)'}}>Continue Shopping</button>
                <a href="my-orders.html" style={{flex:1,padding:11,borderRadius:9,background:'var(--ink)',color:'#fff',fontWeight:700,fontSize:13,cursor:'pointer',textDecoration:'none',display:'flex',alignItems:'center',justifyContent:'center',gap:6}}><Ic d={P.orders} s={13}/>My Orders</a>
              </div>
            </div>
          </div>
        </div>
      )}

      {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
    </>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
