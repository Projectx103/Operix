<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operix — User Portal</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0C1220;--ink2:#1E2D45;--slate:#64748B;
  --line:#E4EAF2;--surf:#F4F7FB;--white:#fff;
  --blue:#0057FF;--blue-d:#003FBB;--blue-bg:#EEF4FF;
  --green:#059669;--green-bg:#ECFDF5;
  --amber:#D97706;--amber-bg:#FFFBEB;
  --red:#DC2626;--red-bg:#FFF1F2;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--surf);color:var(--ink);min-height:100vh}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#D1D9E6;border-radius:99px}

/* ══ TOPBAR ══════════════════════════════════════════════════════════════ */
.tb{position:sticky;top:0;z-index:300;background:#1f1f1f;height:52px;
    border-bottom:1px solid rgba(255,255,255,.08);
    box-shadow:0 1px 8px rgba(0,0,0,.35)}
.tb-inner{max-width:1280px;margin:0 auto;height:100%;
          display:flex;align-items:center;justify-content:space-between;
          padding:0 20px;gap:8px}
.tb-brand{display:flex;align-items:center;gap:9px;text-decoration:none;flex-shrink:0}
.tb-brand b{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.3px;line-height:1}
.tb-brand small{font-size:9px;color:#888;font-weight:500;letter-spacing:.1em;
                text-transform:uppercase;display:block;margin-top:1px}
.tb-nav{display:flex;align-items:center;gap:2px;margin-left:10px}
.tb-nav-link{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;
             color:#a0a0a0;padding:6px 12px;border-radius:5px;cursor:pointer;
             text-decoration:none;transition:color .15s,background .15s;
             white-space:nowrap;border:none;background:none;font-family:inherit}
.tb-nav-link:hover{color:#fff;background:rgba(255,255,255,.07)}
.tb-nav-link.active{color:#fff;background:rgba(255,255,255,.1);font-weight:600}
.tb-nav-link svg{opacity:.75;flex-shrink:0}
.tb-nav-link.active svg{opacity:1}
.tb-spacer{flex:1}
.tb-cart-btn{display:flex;align-items:center;gap:7px;background:#0f62fe;color:#fff;
             padding:6px 14px;border-radius:5px;font-size:13px;font-weight:600;
             cursor:pointer;border:none;transition:all .15s;
             font-family:inherit;text-decoration:none;flex-shrink:0}
.tb-cart-btn:hover{background:#0353e9;box-shadow:0 2px 12px rgba(15,98,254,.45)}
.tb-cart-cnt{background:rgba(255,255,255,.25);color:#fff;font-size:10px;font-weight:800;
             min-width:17px;height:17px;border-radius:99px;
             display:flex;align-items:center;justify-content:center;padding:0 3px}
/* Account dropdown */
.tb-acct-wrap{position:relative;flex-shrink:0}
.tb-acct-btn{display:flex;align-items:center;background:none;border:none;cursor:pointer;
             padding:3px;border-radius:50%;transition:background .15s;outline:none}
.tb-acct-btn:hover{background:rgba(255,255,255,.08)}
.tb-acct-avatar{width:32px;height:32px;border-radius:50%;
                background:linear-gradient(135deg,#0f62fe 0%,#4589ff 100%);
                display:flex;align-items:center;justify-content:center;
                font-size:13px;font-weight:700;color:#fff;
                box-shadow:0 0 0 2px #1f1f1f,0 0 0 3.5px rgba(255,255,255,.18);
                user-select:none}
.tb-acct-drop{position:absolute;top:calc(100% + 10px);right:0;
              background:#2c2c2c;border:1px solid rgba(255,255,255,.1);
              border-radius:8px;width:304px;
              box-shadow:0 8px 32px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.3);
              z-index:9999;overflow:hidden;
              animation:tbDropIn .15s cubic-bezier(.4,0,.2,1)}
@keyframes tbDropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.tb-drop-hd{padding:12px 16px 10px;border-bottom:1px solid rgba(255,255,255,.07)}
.tb-drop-managed{font-size:10.5px;color:#888;margin-bottom:4px;
                 display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tb-drop-managed a{color:#4589ff;text-decoration:none;font-weight:600}
.tb-drop-managed a:hover{text-decoration:underline}
.tb-drop-email{font-size:12.5px;color:#d4d4d4;font-weight:500;word-break:break-all}
.tb-drop-greet{padding:12px 16px 10px;display:flex;align-items:center;gap:13px;
               border-bottom:1px solid rgba(255,255,255,.07)}
.tb-drop-av2{width:54px;height:54px;border-radius:50%;flex-shrink:0;
             background:linear-gradient(135deg,#0f62fe 0%,#4589ff 100%);
             display:flex;align-items:center;justify-content:center;
             font-size:21px;font-weight:700;color:#fff}
.tb-drop-hi{font-size:14px;font-weight:600;color:#fff;margin-bottom:2px}
.tb-drop-role{font-size:11px;color:#888}
.tb-drop-manage-btn{display:block;margin:8px 16px 2px;padding:6px 14px;
                    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
                    border-radius:5px;font-size:12px;font-weight:600;color:#c8c8c8;
                    text-align:center;text-decoration:none;cursor:pointer;
                    transition:all .15s;font-family:inherit;width:calc(100% - 32px)}
.tb-drop-manage-btn:hover{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2)}
.tb-drop-items{padding:6px 0}
.tb-drop-item{display:flex;align-items:center;gap:10px;padding:8px 16px;
              font-size:13px;color:#c0c0c0;cursor:pointer;
              transition:background .12s,color .12s;text-decoration:none;
              background:none;border:none;width:100%;font-family:inherit;text-align:left}
.tb-drop-item:hover{background:rgba(255,255,255,.06);color:#fff}
.tb-drop-item svg{color:#888;flex-shrink:0}
.tb-drop-item:hover svg{color:#b0b0b0}
.tb-drop-sep{height:1px;background:rgba(255,255,255,.07);margin:4px 0}
.tb-drop-item.signout:hover{background:rgba(220,38,38,.12);color:#f87171}
.tb-drop-item.signout:hover svg{color:#f87171}
.tb-drop-ft{padding:8px 16px 10px;display:flex;gap:10px;
            border-top:1px solid rgba(255,255,255,.06)}
.tb-drop-ft a{font-size:10px;color:#555;text-decoration:none;transition:color .12s}
.tb-drop-ft a:hover{color:#999}

/* ══ LOADER ════════════════════════════════════════════════════════════ */
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;
        height:100vh;gap:16px;background:var(--surf)}
.loader-spin{width:32px;height:32px;border:3px solid var(--line);
             border-top-color:var(--blue);border-radius:50%;
             animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══ HERO ═══════════════════════════════════════════════════════════════ */
.portal-hero{
  background:linear-gradient(135deg,#0C1220 0%,#1A2E50 60%,#0057FF18 100%);
  padding:72px 32px 80px;
  position:relative;overflow:hidden;
}
.portal-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 80% at 70% 50%,rgba(0,87,255,.12) 0%,transparent 70%);
  pointer-events:none;
}
.portal-hero-inner{max-width:1280px;margin:0 auto;position:relative;z-index:1}
.portal-hero-eyebrow{display:inline-flex;align-items:center;gap:7px;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  color:#4589ff;background:rgba(69,137,255,.12);border:1px solid rgba(69,137,255,.25);
  padding:4px 12px;border-radius:99px;margin-bottom:22px}
.portal-hero h1{font-size:clamp(28px,4vw,52px);font-weight:800;color:#fff;
  letter-spacing:-.8px;line-height:1.1;margin-bottom:16px;max-width:620px}
.portal-hero h1 span{color:#4589ff}
.portal-hero p{font-size:15px;color:#94A3B8;line-height:1.7;max-width:480px;margin-bottom:36px}
.portal-hero-btns{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hero-btn-primary{display:inline-flex;align-items:center;gap:8px;
  background:#0057FF;color:#fff;padding:13px 26px;border-radius:8px;
  font-size:14px;font-weight:700;text-decoration:none;
  transition:all .18s;border:none;cursor:pointer;font-family:inherit}
.hero-btn-primary:hover{background:#003FBB;transform:translateY(-1px);
  box-shadow:0 6px 20px rgba(0,87,255,.4)}
.hero-btn-secondary{display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.08);color:#fff;padding:13px 26px;border-radius:8px;
  font-size:14px;font-weight:600;text-decoration:none;
  transition:all .18s;border:1px solid rgba(255,255,255,.15)}
.hero-btn-secondary:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3)}
.portal-hero-stats{display:flex;align-items:center;gap:32px;margin-top:48px;flex-wrap:wrap}
.hero-stat{display:flex;flex-direction:column;gap:2px}
.hero-stat-val{font-size:24px;font-weight:800;color:#fff;letter-spacing:-.5px}
.hero-stat-lbl{font-size:11px;color:#64748B;font-weight:500}
.hero-stat-divider{width:1px;height:36px;background:rgba(255,255,255,.1)}

/* ══ QUICK ACCESS CARDS ══════════════════════════════════════════════════ */
.portal-section{max-width:1280px;margin:0 auto;padding:52px 32px}
.section-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;
  color:var(--slate);margin-bottom:20px;display:flex;align-items:center;gap:10px}
.section-label::after{content:'';flex:1;height:1px;background:var(--line)}
.section-title{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.4px;margin-bottom:6px}
.section-sub{font-size:13px;color:var(--slate);margin-bottom:28px}

.portal-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.portal-card{background:var(--white);border:1.5px solid var(--line);border-radius:16px;
  padding:24px;cursor:pointer;transition:all .22s cubic-bezier(.4,0,.2,1);
  text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:14px;
  position:relative;overflow:hidden}
.portal-card::before{content:'';position:absolute;inset:0;opacity:0;
  background:radial-gradient(ellipse at top left,var(--card-accent,#0057FF)08 0%,transparent 60%);
  transition:opacity .22s}
.portal-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.08);
  border-color:var(--card-accent,var(--blue))}
.portal-card:hover::before{opacity:1}
.portal-card-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.portal-card-title{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.2px}
.portal-card-desc{font-size:12px;color:var(--slate);line-height:1.55}
.portal-card-arrow{margin-top:auto;display:flex;align-items:center;gap:5px;
  font-size:12px;font-weight:700;color:var(--card-accent,var(--blue));opacity:0;
  transform:translateX(-4px);transition:all .18s}
.portal-card:hover .portal-card-arrow{opacity:1;transform:translateX(0)}

/* ══ ANNOUNCEMENT BANNER ═════════════════════════════════════════════════ */
.announce-bar{background:linear-gradient(90deg,#0C1220,#1A2E50);
  border-bottom:1px solid rgba(255,255,255,.06);padding:9px 20px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:12px;color:#94A3B8}
.announce-bar b{color:#fff}
.announce-dot{width:6px;height:6px;border-radius:50%;background:#0057FF;flex-shrink:0;
  animation:pulse-dot 2s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}

/* ══ RECENT ORDERS STRIP ════════════════════════════════════════════════ */
.orders-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.order-row{background:var(--white);border:1.5px solid var(--line);border-radius:12px;
  padding:14px 16px;display:flex;align-items:center;gap:14px;transition:all .18s}
.order-row:hover{border-color:#BFCFEF;box-shadow:0 4px 16px rgba(0,87,255,.07)}
.order-icon{width:38px;height:38px;border-radius:9px;background:var(--blue-bg);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.order-info{flex:1;min-width:0}
.order-ref{font-size:12px;font-weight:700;color:var(--ink);font-family:'DM Mono',monospace}
.order-meta{font-size:11px;color:var(--slate);margin-top:2px}
.order-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;flex-shrink:0}
.badge-approved{background:var(--green-bg);color:var(--green)}
.badge-submitted{background:var(--blue-bg);color:var(--blue)}
.badge-rejected{background:var(--red-bg);color:var(--red)}
.no-orders{text-align:center;padding:40px 20px;color:var(--slate);
  background:var(--white);border:1.5px dashed var(--line);border-radius:12px}
.no-orders svg{display:block;margin:0 auto 12px;opacity:.35}

/* ══ WELCOME BANNER ═════════════════════════════════════════════════════ */
.welcome-banner{background:linear-gradient(135deg,#EEF4FF,#F0FDF4);
  border:1.5px solid #BFDBFE;border-radius:14px;padding:20px 24px;
  display:flex;align-items:center;gap:18px;margin-bottom:32px}
.welcome-avatar{width:52px;height:52px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#0057FF,#4589ff);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;color:#fff}
.welcome-text h2{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.3px}
.welcome-text p{font-size:13px;color:var(--slate);margin-top:2px}

/* ══ FOOTER (identical to shop.html) ═══════════════════════════════════ */
.shop-footer{background:var(--ink);color:#94A3B8;margin-top:0}
.footer-inner{max-width:1280px;margin:0 auto;padding:48px 32px 28px}
.footer-top{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px;margin-bottom:40px}
.footer-brand b{font-size:18px;font-weight:800;color:#fff;letter-spacing:-.4px;display:block;margin-bottom:6px}
.footer-brand p{font-size:12px;line-height:1.7;max-width:220px}
.footer-col h4{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#fff;margin-bottom:14px}
.footer-col ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.footer-col li a{font-size:12px;color:#64748B;text-decoration:none;transition:color .15s;cursor:pointer}
.footer-col li a:hover{color:#fff}
.footer-bottom{border-top:1px solid rgba(255,255,255,.07);padding-top:20px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.footer-bottom p{font-size:11px}
.footer-badges{display:flex;gap:8px}
.footer-badge{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:6px;padding:4px 10px;font-size:10px;font-weight:600;
  color:#94A3B8;letter-spacing:.04em}
@media(max-width:900px){
  .footer-top{grid-template-columns:1fr 1fr}
  .portal-cards{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
  .footer-top{grid-template-columns:1fr}
  .portal-hero{padding:48px 20px 56px}
  .portal-section{padding:36px 20px}
  .portal-cards{grid-template-columns:1fr}
  .tb-nav{display:none}
  .portal-hero-stats{gap:20px}
  .welcome-banner{flex-direction:column;text-align:center}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const FB = {
  apiKey:"AIzaSyB56dPmBwgO4uWyXakhY9SJBCAz7bk0Do8",
  authDomain:"operix-c8a8c.firebaseapp.com",
  projectId:"operix-c8a8c",
  storageBucket:"operix-c8a8c.firebasestorage.app",
  messagingSenderId:"794223223499",
  appId:"1:794223223499:web:f059007b909cc15766f14e"
};

/* ── Logo ── */
const Logo = () => (
  <svg width="30" height="30" viewBox="0 0 40 40">
    <rect width="40" height="40" rx="9" fill="#0057FF"/>
    <path d="M20 8C27.18 8 33 13.82 33 21S27.18 34 20 34 7 28.18 7 21 12.82 8 20 8zm0 4a9 9 0 100 18A9 9 0 0020 12zm0 4a5 5 0 110 10A5 5 0 0120 16z" fill="white" opacity=".9"/>
    <circle cx="20" cy="21" r="2.5" fill="white"/>
  </svg>
);

/* ── Account Dropdown (matches shop.html exactly) ── */
function AccountDropdown({ user, userRole, onSignOut, extraItems }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const initials = React.useMemo(() => {
    const n = user?.displayName || user?.fullName || user?.email || 'U';
    return n.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
  }, [user]);
  const firstName = (user?.displayName || user?.fullName || '').split(' ')[0] || 'there';
  const email = user?.email || '';
  const domain = email.includes('@') ? email.split('@')[1] : '';
  const roleLabel = userRole === 'admin' ? 'Administrator' : userRole === 'master' ? 'Master Admin' : 'User';

  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  return (
    <div className="tb-acct-wrap" ref={ref}>
      <button className="tb-acct-btn" onClick={() => setOpen(o => !o)}>
        <div className="tb-acct-avatar">{initials}</div>
      </button>
      {open && (
        <div className="tb-acct-drop">
          <div className="tb-drop-hd">
            <div className="tb-drop-managed">
              {domain
                ? <><span>{email}</span><span style={{margin:'0 2px'}}>·</span><span>Managed by</span><a href={'https://'+domain} target="_blank" rel="noopener noreferrer">{domain}</a></>
                : <div className="tb-drop-email">{email}</div>
              }
            </div>
          </div>
          <div className="tb-drop-greet">
            <div className="tb-drop-av2">{initials}</div>
            <div>
              <div className="tb-drop-hi">Hi, {firstName}!</div>
              <div className="tb-drop-role">{roleLabel}{user?.companyName ? ' · ' + user.companyName : ''}</div>
            </div>
          </div>
          <a href="my-profile.html" className="tb-drop-manage-btn" onClick={() => setOpen(false)}>
            Manage your account
          </a>
          <div className="tb-drop-items">
            {(extraItems || []).map((item, i) => (
              <a key={i} href={item.href} className="tb-drop-item" onClick={() => setOpen(false)}>
                {item.icon}{item.label}
              </a>
            ))}
            {(extraItems || []).length > 0 && <div className="tb-drop-sep"/>}
            <button className="tb-drop-item signout" onClick={() => { setOpen(false); onSignOut && onSignOut(); }}>
              <svg width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
              Sign out
            </button>
          </div>
          <div className="tb-drop-ft">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── Shop Footer (reads from shopConfig.footer — same as shop.html) ── */
function ShopFooter({ footerData }) {
  const fd = footerData || {};
  return (
    <footer className="shop-footer">
      <div className="footer-inner">
        <div className="footer-top">
          <div className="footer-brand">
            <Logo/>
            <b style={{display:'block',marginTop:10,marginBottom:6}}>{fd.companyName || 'Operix Procurement'}</b>
            <p>{fd.tagline || 'Your trusted procurement partner. Quality products, efficient ordering, seamless delivery.'}</p>
            {fd.phone && <p style={{marginTop:10,fontSize:12}}>{fd.phone}</p>}
            {fd.email && <p style={{fontSize:12}}>{fd.email}</p>}
          </div>
          <div className="footer-col">
            <h4>Portal</h4>
            <ul>
              <li><a href="user-portal.html">Home</a></li>
              <li><a href="shop.html">Browse Products</a></li>
              <li><a href="my-orders.html">My Orders</a></li>
              <li><a href="cart.html">My Cart</a></li>
            </ul>
          </div>
          <div className="footer-col">
            <h4>Support</h4>
            <ul>
              <li><a href={fd.supportEmail ? 'mailto:' + fd.supportEmail : '#'}>{fd.supportEmail || 'support@operix.com'}</a></li>
              {fd.phone && <li><a href={'tel:' + fd.phone}>{fd.phone}</a></li>}
              <li><a href="my-profile.html">My Profile</a></li>
            </ul>
          </div>
          <div className="footer-col">
            <h4>Company</h4>
            <ul>
              {(fd.footerLinks || [
                {label:'About Us',url:'#'},
                {label:'Privacy Policy',url:'#'},
                {label:'Terms of Service',url:'#'}
              ]).map((l, i) => (
                <li key={i}><a href={l.url || '#'}>{l.label}</a></li>
              ))}
            </ul>
          </div>
        </div>
        <div className="footer-bottom">
          <p>© {new Date().getFullYear()} {fd.companyName || 'Operix'}. {fd.copyright || 'All rights reserved.'}</p>
          <div className="footer-badges">
            <span className="footer-badge">🔒 Secure</span>
            <span className="footer-badge">✓ Verified</span>
            <span className="footer-badge">⚡ Fast</span>
          </div>
        </div>
      </div>
    </footer>
  );
}

/* ── Order status badge helper ── */
function statusBadge(status) {
  const s = (status || '').toLowerCase();
  if (s === 'approved') return 'badge-approved';
  if (s === 'submitted') return 'badge-submitted';
  if (s === 'rejected' || s === 'cancelled') return 'badge-rejected';
  return 'badge-submitted';
}

function fmtDate(ts) {
  if (!ts) return '—';
  try {
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });
  } catch { return '—'; }
}

/* ── Main App ── */
function App() {
  const [user, setUser]             = useState(null);
  const [userRole, setUserRole]     = useState(null);
  const [loading, setLoading]       = useState(true);
  const [shopConfig, setShopConfig] = useState({});
  const [recentOrders, setRecentOrders] = useState([]);
  const [stats, setStats]           = useState({ products: 0, orders: 0 });
  const [cartCount, setCartCount]   = useState(0);

  useEffect(() => {
    if (!window.firebase) { setTimeout(() => window.location.reload(), 600); return; }
    if (!firebase.apps.length) firebase.initializeApp(FB);
    const db = firebase.firestore();

    firebase.auth().onAuthStateChanged(async (u) => {
      if (!u) { window.location.href = 'login.html'; return; }

      try {
        const doc = await db.collection('users').doc(u.uid).get();
        if (!doc.exists) { window.location.href = 'login.html'; return; }
        const data = doc.data();
        const role = data.role || 'user';
        const userData = { uid: u.uid, email: u.email,
          displayName: data.fullName || data.displayName || u.email,
          fullName: data.fullName || data.displayName || '',
          companyName: data.companyName || '',
          assignedAdminId: data.assignedAdminId || null,
          ...data
        };
        setUser(userData);
        setUserRole(role);

        // ── Load shopConfig — company-level doc (same pattern as shop.html) ──
        try {
          const adminId = data.assignedAdminId || u.uid;
          const companyName = data.companyName || '';
          const configDocId = companyName || adminId;
          let sc = await db.collection('shopConfig').doc(configDocId).get();
          if (!sc.exists && configDocId !== adminId) {
            sc = await db.collection('shopConfig').doc(adminId).get();
          }
          if (sc.exists) setShopConfig(sc.data());
        } catch(e) { console.warn('shopConfig:', e); }

        // ── Load cart count ──
        try {
          const cartSnap = await db.collection('carts').doc(u.uid).get();
          if (cartSnap.exists) {
            const items = cartSnap.data().items || [];
            setCartCount(items.reduce((s, i) => s + (i.quantity || 1), 0));
          }
        } catch(e) {}

        // ── Load recent orders (last 5) ──
        try {
          const ordSnap = await db.collection('orders')
            .where('userId', '==', u.uid)
            .orderBy('createdAt', 'desc')
            .limit(5)
            .get().catch(() => ({ docs: [] }));
          setRecentOrders(ordSnap.docs.map(d => ({ id: d.id, ...d.data() })));
        } catch(e) {
          // try without orderBy (no composite index)
          try {
            const ordSnap2 = await db.collection('orders')
              .where('userId', '==', u.uid).limit(10)
              .get().catch(() => ({ docs: [] }));
            const sorted = ordSnap2.docs
              .map(d => ({ id: d.id, ...d.data() }))
              .sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0))
              .slice(0, 5);
            setRecentOrders(sorted);
          } catch(e2) {}
        }

        // ── Load stats ──
        try {
          const adminId2 = data.assignedAdminId || u.uid;
          const prodSnap = await db.collection('products')
            .where('createdBy', '==', adminId2).get().catch(() => ({ docs: [] }));
          const allOrdSnap = await db.collection('orders')
            .where('userId', '==', u.uid).get().catch(() => ({ docs: [] }));
          const allOrds = allOrdSnap.docs.map(d => d.data());
          setStats({
            products: prodSnap.docs.length,
            orders: allOrds.length,
  
          });
        } catch(e) {}

      } catch(e) { console.error(e); }
      setLoading(false);
    });
  }, []);

  if (loading) return (
    <div className="loader">
      <Logo/>
      <div className="loader-spin"/>
      <p style={{fontSize:13,color:'#64748B'}}>Loading your portal…</p>
    </div>
  );

  const fd = shopConfig.footer || {};
  const firstName = (user?.fullName || user?.displayName || '').split(' ')[0] || 'there';
  const initials = (user?.fullName || user?.displayName || user?.email || 'U')
    .split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);

  const quickLinks = [
    {
      href: 'shop.html',
      icon: (
        <svg width="22" height="22" fill="none" stroke="#0057FF" strokeWidth="1.7" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
        </svg>
      ),
      iconBg: '#EEF4FF', accent: '#0057FF',
      title: 'Browse Products',
      desc: 'Explore the full product catalog and add items to your requisition cart.'
    },
    {
      href: 'my-orders.html',
      icon: (
        <svg width="22" height="22" fill="none" stroke="#059669" strokeWidth="1.7" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
        </svg>
      ),
      iconBg: '#ECFDF5', accent: '#059669',
      title: 'My Orders',
      desc: 'Track your purchase requisitions and view approval status and history.'
    },
    {
      href: 'cart.html',
      icon: (
        <svg width="22" height="22" fill="none" stroke="#D97706" strokeWidth="1.7" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
      ),
      iconBg: '#FFFBEB', accent: '#D97706',
      title: 'My Cart',
      desc: 'Review items in your cart and proceed to submit a purchase requisition.',
      badge: cartCount > 0 ? cartCount : null
    },
    {
      href: 'my-profile.html',
      icon: (
        <svg width="22" height="22" fill="none" stroke="#7C3AED" strokeWidth="1.7" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
      ),
      iconBg: '#F5F3FF', accent: '#7C3AED',
      title: 'My Profile',
      desc: 'Manage your account details, delivery address, and preferences.'
    },
  ];

  return (
    <div style={{display:'flex',flexDirection:'column',minHeight:'100vh'}}>

      {/* ── TOPBAR ── */}
      <header className="tb">
        <div className="tb-inner">
          <a href="user-portal.html" className="tb-brand">
            <Logo/>
            <div><b>{fd.companyName || 'Operix'}</b><small>User Portal</small></div>
          </a>
          <nav className="tb-nav">
            <a href="user-portal.html" className="tb-nav-link active">
              <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1V10"/></svg>
              Home
            </a>
            <a href="shop.html" className="tb-nav-link">
              <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1.5 7h13M10 21a1 1 0 100-2 1 1 0 000 2zm7 0a1 1 0 100-2 1 1 0 000 2z"/></svg>
              Shop
            </a>
            <a href="my-orders.html" className="tb-nav-link">
              <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
              My Orders
            </a>
          </nav>
          <div className="tb-spacer"/>
          <a href="cart.html" className="tb-cart-btn">
            <svg width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            Cart
            <span className="tb-cart-cnt">{cartCount}</span>
          </a>
          <AccountDropdown
            user={user}
            userRole={userRole}
            onSignOut={() => firebase.auth().signOut().then(() => { window.location.href = 'login.html'; })}
            extraItems={[
              { href: 'shop.html',      label: 'Browse Products', icon: <svg width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1.5 7h13M10 21a1 1 0 100-2 1 1 0 000 2zm7 0a1 1 0 100-2 1 1 0 000 2z"/></svg> },
              { href: 'my-orders.html', label: 'My Orders',       icon: <svg width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg> },
              { href: 'cart.html',      label: 'View Cart',       icon: <svg width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg> },
            ]}
          />
        </div>
      </header>

      {/* ── HERO ── */}
      <div className="portal-hero">
        <div className="portal-hero-inner">
          <div className="portal-hero-eyebrow">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="#4589ff"><circle cx="5" cy="5" r="5"/></svg>
            Procurement Portal
          </div>
          <h1>Welcome back,<br/><span>{firstName}</span>.</h1>
          <p>{shopConfig.heroSubtitle || 'Browse products, submit requisitions, and track your orders — all in one place.'}</p>
          <div className="portal-hero-btns">
            <a href="shop.html" className="hero-btn-primary">
              <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1.5 7h13"/></svg>
              Browse Products
            </a>
            <a href="my-orders.html" className="hero-btn-secondary">
              View My Orders
              <svg width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7"/></svg>
            </a>
          </div>
          <div className="portal-hero-stats">
            <div className="hero-stat">
              <span className="hero-stat-val">{stats.products.toLocaleString()}</span>
              <span className="hero-stat-lbl">Products Available</span>
            </div>
            <div className="hero-stat-divider"/>
            <div className="hero-stat">
              <span className="hero-stat-val">{stats.orders}</span>
              <span className="hero-stat-lbl">My Total Orders</span>
            </div>

          </div>
        </div>
      </div>

      {/* ── MAIN CONTENT ── */}
      <div style={{flex:1}}>
        <div className="portal-section">

          {/* Welcome banner */}
          <div className="welcome-banner">
            <div className="welcome-avatar">{initials}</div>
            <div className="welcome-text">
              <h2>Good to see you, {user?.fullName || user?.displayName || 'there'}!</h2>
              <p>
                {user?.companyName ? `You're logged in as part of ${user.companyName}.` : 'You\'re signed into the procurement portal.'}
                {' '}Use the quick links below or the top navigation to get started.
              </p>
            </div>
          </div>

          {/* Quick access */}
          <div className="section-label">Quick Access</div>
          <div className="portal-cards">
            {quickLinks.map((lk, i) => (
              <a key={i} href={lk.href} className="portal-card"
                style={{'--card-accent': lk.accent}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <div className="portal-card-icon" style={{background: lk.iconBg}}>
                    {lk.icon}
                  </div>
                  {lk.badge && (
                    <span style={{background:'#0057FF',color:'#fff',fontSize:11,fontWeight:800,
                      padding:'2px 9px',borderRadius:99}}>
                      {lk.badge}
                    </span>
                  )}
                </div>
                <div>
                  <div className="portal-card-title">{lk.title}</div>
                  <div className="portal-card-desc" style={{marginTop:4}}>{lk.desc}</div>
                </div>
                <div className="portal-card-arrow">
                  Go to {lk.title}
                  <svg width="12" height="12" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7"/>
                  </svg>
                </div>
              </a>
            ))}
          </div>

          {/* Recent Orders */}
          <div style={{marginTop:48}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
              <div>
                <div className="section-title">Recent Orders</div>
                <div className="section-sub">Your latest purchase requisitions</div>
              </div>
              <a href="my-orders.html" style={{fontSize:13,fontWeight:700,color:'var(--blue)',
                textDecoration:'none',display:'flex',alignItems:'center',gap:5}}>
                View all
                <svg width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7"/>
                </svg>
              </a>
            </div>

            {recentOrders.length === 0 ? (
              <div className="no-orders">
                <svg width="40" height="40" fill="none" stroke="currentColor" strokeWidth="1.5" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
                <div style={{fontWeight:700,color:'var(--ink)',marginBottom:4}}>No orders yet</div>
                <div style={{fontSize:12}}>
                  Start by <a href="shop.html" style={{color:'var(--blue)',fontWeight:600}}>browsing products</a> and adding them to your cart.
                </div>
              </div>
            ) : (
              <div className="orders-strip">
                {recentOrders.map((ord, i) => (
                  <a key={i} href="my-orders.html"
                    style={{textDecoration:'none',color:'inherit'}}>
                    <div className="order-row">
                      <div className="order-icon">
                        <svg width="18" height="18" fill="none" stroke="#0057FF" strokeWidth="1.8" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                        </svg>
                      </div>
                      <div className="order-info">
                        <div className="order-ref">
                          {ord.orderRef || ord.poNumber || ord.id?.slice(0,8).toUpperCase() || 'ORD-????'}
                        </div>
                        <div className="order-meta">
                          {fmtDate(ord.createdAt)}
                          {ord.items?.length ? ` · ${ord.items.length} item${ord.items.length!==1?'s':''}` : ''}
                        </div>
                      </div>
                      <span className={`order-badge ${statusBadge(ord.status)}`}>
                        {ord.status || 'Submitted'}
                      </span>
                    </div>
                  </a>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>

      {/* ── FOOTER (loaded from shopConfig.footer) ── */}
      <ShopFooter footerData={shopConfig.footer}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
