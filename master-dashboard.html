                        </div>
                      </div>
                      {g.steps?.length>0&&(
                        <div style={{padding:'0 16px 14px',borderTop:'1px solid var(--border)',paddingTop:12}}>
                          <div style={{fontSize:10,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--text3)',marginBottom:8}}>Approval Chain</div>
                          <div className="workflow-chain">
                            {g.steps.map((step,i)=>(
                              <React.Fragment key={i}>
                                {i>0&&<div className="workflow-arrow"><Ico d={I.arrow} size={12}/></div>}
                                <div className="workflow-step">
                                  <div className="workflow-step-num">Step {i+1}</div>
                                  <div className="workflow-step-name">
                                    {step.approverName || step.approverRole || 'Any Approver'}
                                  </div>
                                  <div className="workflow-step-detail">
                                    {step.approverName
                                      ? <span style={{color:'var(--text3)',fontSize:10}}>{step.approverRole||'Designated Approver'}{step.limit?` · Up to ${fmtCurrency(step.limit)}`:''}</span>
                                      : <span>Up to {fmtCurrency(step.limit||0)}</span>
                                    }
                                  </div>
                                  {step.escalateTo&&<div style={{fontSize:9,color:'var(--amber)',marginTop:2}}>↑ {step.escalateTo}</div>}
                                </div>
                              </React.Fragment>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* ══════════════ USERS ══════════════ */}
          {activeNav==='users'&&(
            <div className="page">
              <div className="page-header" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between'}}>
                <div><div className="page-title"><div className="page-title-icon" style={{background:'var(--green-bg)',color:'var(--green)'}}><Ico d={I.users} size={15}/></div>Users</div><div className="page-subtitle">Manage end-user accounts across all companies</div></div>
                <div style={{display:'flex',gap:8}}>
                  <div style={{position:'relative'}}>
                    <input className="form-input" placeholder="Search users..." value={searchQ} onChange={e=>setSearchQ(e.target.value)} style={{paddingLeft:30,width:200,height:32,fontSize:12}}/>
                    <span style={{position:'absolute',left:9,top:'50%',transform:'translateY(-50%)',color:'var(--text3)'}}><Ico d={I.search} size={12}/></span>
                  </div>
                  <button className="btn btn-success" onClick={()=>setModal('create-user')}><Ico d={I.plus} size={13}/>Add User</button>
                </div>
              </div>
              <div className="table-card">
                <table className="data-table">
                  <thead><tr><th>User</th><th>Email</th><th>Company</th><th>Phone</th><th>Assigned Admin(s)</th><th>Created</th><th>Status</th><th>Actions</th></tr></thead>
                  <tbody>
                    {users.filter(u=>!searchQ||u.fullName?.toLowerCase().includes(searchQ.toLowerCase())||u.email?.toLowerCase().includes(searchQ.toLowerCase())).map(u=>{
                      const userAssignments = assignments.filter(a=>a.userId===u.id);
                      return (
                        <tr key={u.id}>
                          <td><div style={{display:'flex',alignItems:'center',gap:8}}><div className="user-avatar" style={{background:'linear-gradient(135deg,var(--green),var(--cyan))'}}>{u.fullName?.[0]||'U'}</div><span style={{fontWeight:600,color:'var(--text)'}}>{u.fullName}</span></div></td>
                          <td style={{fontFamily:'IBM Plex Mono,monospace',fontSize:11}}>{u.email}</td>
                          <td>{u.companyName||<span style={{color:'var(--text3)'}}>—</span>}</td>
                          <td style={{fontSize:11}}>{u.phoneNumber||'—'}</td>
                          <td>
                            {userAssignments.length===0
                              ?<span className="badge badge-amber">Unassigned</span>
                              :<div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                                {userAssignments.map(a=><span key={a.id} className="badge badge-green">{a.adminName}</span>)}
                              </div>
                            }
                          </td>
                          <td>{u.createdAt?.toDate?new Date(u.createdAt.toDate()).toLocaleDateString():'—'}</td>
                          <td><span className="badge badge-blue">Active</span></td>
                          <td>
                            <div style={{display:'flex',gap:4}}>
                              <button className="btn btn-icon btn-secondary" onClick={()=>{setUserForm({email:u.email,fullName:u.fullName,companyName:u.companyName||'',phoneNumber:u.phoneNumber||'',tinNumber:u.tinNumber||'',address:u.address||'',password:''});setEditingId(u.id);setModal('create-user');}}><Ico d={I.edit} size={12}/></button>
                              <button className="btn btn-icon btn-danger" onClick={()=>deleteUser(u.id)}><Ico d={I.trash} size={12}/></button>
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                {users.length===0&&<div className="empty"><div className="empty-title">No users found</div><button className="btn btn-success" style={{marginTop:8}} onClick={()=>setModal('create-user')}><Ico d={I.plus} size={13}/>Add First User</button></div>}
              </div>
            </div>
          )}

          {/* ══════════════ ASSIGNMENTS ══════════════ */}
          {activeNav==='assignments'&&(
            <div className="page">
              <div className="page-header" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between'}}>
                <div>
                  <div className="page-title"><div className="page-title-icon" style={{background:'var(--cyan-bg)',color:'var(--cyan)'}}><Ico d={I.link} size={15}/></div>Assignments</div>
                  <div className="page-subtitle">Manage which users belong to each administrator — across all companies and departments</div>
                </div>
              </div>

              {/* UNASSIGNED ALERT */}
              {getUnassignedUsers().length>0&&(
                <div style={{background:'var(--amber-bg)',border:'1px solid rgba(245,158,11,.2)',borderRadius:8,padding:'10px 16px',marginBottom:16,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <div style={{display:'flex',gap:8,alignItems:'center'}}>
                    <span style={{color:'var(--amber)'}}><Ico d={I.info} size={14}/></span>
                    <span style={{fontSize:12,color:'var(--amber)'}}><strong>{getUnassignedUsers().length}</strong> user(s) have no admin assignment yet</span>
                  </div>
                  <span style={{fontSize:11,color:'var(--text3)'}}>{getUnassignedUsers().map(u=>u.fullName).slice(0,3).join(', ')}{getUnassignedUsers().length>3?` +${getUnassignedUsers().length-3} more`:''}</span>
                </div>
              )}

              {admins.length===0&&(
                <div className="table-card"><div className="empty"><div className="empty-icon"><Ico d={I.shield} size={40}/></div><div className="empty-title">No administrators yet</div><div className="empty-sub">Create an admin first, then assign users to them</div><button className="btn btn-primary" onClick={()=>setModal('create-admin')}><Ico d={I.plus} size={13}/>Create Admin</button></div></div>
              )}

              {/* ── PER-ADMIN PANELS ── */}
              {admins.map(admin=>{
                const adminUsers = getUsersForAdmin(admin.id);
                const collapsed  = expandedAdmins[admin.id]===false;
                return (
                  <div key={admin.id} className="admin-group-panel">

                    {/* HEADER */}
                    <div className={`admin-group-header ${collapsed?'collapsed':''}`} onClick={()=>toggleAdmin(admin.id)}>
                      <div style={{display:'flex',alignItems:'center',gap:12}}>
                        <div className="user-avatar" style={{background:'linear-gradient(135deg,var(--blue),var(--purple))',width:36,height:36,fontSize:13}}>{admin.fullName?.[0]}</div>
                        <div>
                          <div style={{display:'flex',alignItems:'center',gap:8}}>
                            <span style={{fontSize:13,fontWeight:700,color:'var(--text)'}}>{admin.fullName}</span>
                            {admin.assignedRole?<span className={`badge badge-${getRoleBadge(admin.assignedRole)}`}>{admin.assignedRoleName}</span>:<span className="badge badge-gray">No Role</span>}
                          </div>
                          <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>{admin.email}{admin.companyName?` · ${admin.companyName}`:''}</div>
                        </div>
                      </div>
                      <div style={{display:'flex',alignItems:'center',gap:10}}>
                        {admin.assignedRole&&<span style={{fontSize:11,color:'var(--text3)'}}>Limit: <span style={{fontFamily:'IBM Plex Mono,monospace',color:'var(--text2)'}}>{fmtCurrency(admin.approvalLimit)}</span></span>}
                        <span className="badge badge-gray">{adminUsers.length} user{adminUsers.length!==1?'s':''}</span>
                        <button className="btn btn-sm btn-primary" style={{zIndex:2}} onClick={e=>{e.stopPropagation();openAssignModal(admin.id);}}>
                          <Ico d={I.plus} size={11}/>Add Users
                        </button>
                        <span className={`chevron-icon ${collapsed?'':'open'}`} style={{color:'var(--text3)'}}><Ico d={I.chevron} size={14}/></span>
                      </div>
                    </div>

                    {/* BODY */}
                    {!collapsed&&(
                      <div className="admin-group-body">
                        {adminUsers.length===0?(
                          <div style={{textAlign:'center',padding:20,color:'var(--text3)',fontSize:12}}>
                            No users assigned to this administrator yet.{' '}
                            <span style={{color:'var(--blue-lt)',cursor:'pointer'}} onClick={()=>openAssignModal(admin.id)}>Add users →</span>
                          </div>
                        ):(
                          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:8}}>
                            {adminUsers.map(u=>{
                              const allAdminAssignments = assignments.filter(a=>a.userId===u.id);
                              return (
                                <div key={u.id} className="user-row-item">
                                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                                    <div className="user-avatar" style={{background:'linear-gradient(135deg,var(--green),var(--cyan))',width:28,height:28,fontSize:11}}>{u.fullName?.[0]||'?'}</div>
                                    <div>
                                      <div style={{fontSize:12,fontWeight:600,color:'var(--text)'}}>{u.fullName}</div>
                                      <div style={{fontSize:10,color:'var(--text3)'}}>{u.email}</div>
                                      {u.companyName&&<div style={{fontSize:10,color:'var(--text3)',display:'flex',alignItems:'center',gap:3,marginTop:1}}><Ico d={I.building} size={9}/>{u.companyName}</div>}
                                    </div>
                                  </div>
                                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                                    {allAdminAssignments.length>1&&(
                                      <span className="badge badge-purple" title={`Also in: ${allAdminAssignments.filter(a=>a.adminId!==admin.id).map(a=>a.adminName).join(', ')}`}>
                                        +{allAdminAssignments.length-1} more
                                      </span>
                                    )}
                                    <button className="btn btn-icon btn-danger" style={{width:26,height:26}} title="Remove from this group" onClick={()=>removeFromAdmin(admin.id,u.id)}>
                                      <Ico d={I.x} size={11}/>
                                    </button>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}

              {/* UNASSIGNED USERS PANEL */}
              {getUnassignedUsers().length>0&&(
                <div className="admin-group-panel" style={{borderColor:'rgba(245,158,11,.25)'}}>
                  <div className={`admin-group-header ${expandedAdmins['__unassigned']===false?'collapsed':''}`} onClick={()=>toggleAdmin('__unassigned')}>
                    <div style={{display:'flex',alignItems:'center',gap:12}}>
                      <div style={{width:36,height:36,borderRadius:6,background:'var(--amber-bg)',border:'1px solid rgba(245,158,11,.2)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--amber)'}}><Ico d={I.user} size={16}/></div>
                      <div>
                        <span style={{fontSize:13,fontWeight:700,color:'var(--amber)'}}>Unassigned Users</span>
                        <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>Not yet linked to any administrator</div>
                      </div>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                      <span className="badge badge-amber">{getUnassignedUsers().length} user{getUnassignedUsers().length!==1?'s':''}</span>
                      <span className={`chevron-icon ${expandedAdmins['__unassigned']!==false?'open':''}`} style={{color:'var(--text3)'}}><Ico d={I.chevron} size={14}/></span>
                    </div>
                  </div>
                  {expandedAdmins['__unassigned']!==false&&(
                    <div className="admin-group-body">
                      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:8}}>
                        {getUnassignedUsers().map(u=>(
                          <div key={u.id} className="user-row-item" style={{borderColor:'rgba(245,158,11,.15)'}}>
                            <div style={{display:'flex',alignItems:'center',gap:10}}>
                              <div className="user-avatar" style={{background:'linear-gradient(135deg,#78350F,var(--amber))',width:28,height:28,fontSize:11}}>{u.fullName?.[0]||'?'}</div>
                              <div>
                                <div style={{fontSize:12,fontWeight:600,color:'var(--text)'}}>{u.fullName}</div>
                                <div style={{fontSize:10,color:'var(--text3)'}}>{u.email}</div>
                                {u.companyName&&<div style={{fontSize:10,color:'var(--text3)'}}>{u.companyName}</div>}
                              </div>
                            </div>
                            <button className="btn btn-sm btn-secondary" onClick={()=>{setAssignAdminId('');setAssignUserIds([u.id]);setAssignSearch('');setAssignModal(true);}}>
                              <Ico d={I.link} size={11}/>Assign
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

        </div>{/* end main */}
      </div>{/* end layout */}

      {/* ═══════════════════════════════
          MODALS
      ═══════════════════════════════ */}

      {/* ── Create / Edit Admin ── */}
      {modal==='create-admin'&&(
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&closeModal()}>
          <div className="modal" style={{maxWidth:480}}>
            <div className="modal-header">
              <div className="modal-title"><span style={{color:'var(--blue-lt)'}}><Ico d={I.shield} size={16}/></span>{editingId?'Edit Administrator':'Create Administrator'}</div>
              <button className="btn btn-icon btn-secondary" onClick={closeModal}><Ico d={I.x} size={13}/></button>
            </div>
            <div className="modal-body">
              <div className="form-group"><label className="form-label">Full Name *</label><input className="form-input" value={adminForm.fullName} onChange={e=>setAdminForm(p=>({...p,fullName:e.target.value}))} placeholder="e.g. Maria Santos"/></div>
              <div className="form-group"><label className="form-label">Email Address *</label><input className="form-input" type="email" value={adminForm.email} onChange={e=>setAdminForm(p=>({...p,email:e.target.value}))} placeholder="admin@company.com" disabled={!!editingId}/></div>
              <div className="form-group"><label className="form-label">{editingId?'New Password (blank = keep)':'Temporary Password *'}</label><input className="form-input" type="text" value={adminForm.password} onChange={e=>setAdminForm(p=>({...p,password:e.target.value}))} placeholder={editingId?'Leave blank to keep current':'Min 8 characters'}/></div>
              <div className="form-group"><label className="form-label">Company / Department</label><input className="form-input" value={adminForm.companyName} onChange={e=>setAdminForm(p=>({...p,companyName:e.target.value}))} placeholder="Optional"/></div>
              <div className="form-grid2">
                <div className="form-group"><label className="form-label">TIN Number</label><input className="form-input" value={adminForm.tinNumber} onChange={e=>setAdminForm(p=>({...p,tinNumber:e.target.value}))} placeholder="e.g. 123-456-789-000"/></div>
                <div className="form-group"><label className="form-label">Phone Number</label><input className="form-input" value={adminForm.phoneNumber||''} onChange={e=>setAdminForm(p=>({...p,phoneNumber:e.target.value}))} placeholder="Optional"/></div>
              </div>
              <div className="form-group"><label className="form-label">Company Address</label><textarea className="form-input" rows={2} value={adminForm.address} onChange={e=>setAdminForm(p=>({...p,address:e.target.value}))} placeholder="Registered company address" style={{resize:'vertical',minHeight:60}}/></div>
              {!editingId&&<div style={{background:'var(--blue-bg)',border:'1px solid rgba(59,127,232,.2)',borderRadius:6,padding:'8px 12px',fontSize:11,color:'var(--text3)'}}>After creation, assign a role from Role Designations to enable approval capabilities.</div>}
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={closeModal}>Cancel</button>
              <button className="btn btn-primary" onClick={saveAdmin}>{editingId?'Update':'Create Administrator'}</button>
            </div>
          </div>
        </div>
      )}

      {/* ── Create / Edit User ── */}
      {modal==='create-user'&&(
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&closeModal()}>
          <div className="modal" style={{maxWidth:480}}>
            <div className="modal-header">
              <div className="modal-title"><span style={{color:'var(--green)'}}><Ico d={I.user} size={16}/></span>{editingId?'Edit User':'Add User Account'}</div>
              <button className="btn btn-icon btn-secondary" onClick={closeModal}><Ico d={I.x} size={13}/></button>
            </div>
            <div className="modal-body">
              <div className="form-grid2">
                <div className="form-group"><label className="form-label">Full Name *</label><input className="form-input" value={userForm.fullName} onChange={e=>setUserForm(p=>({...p,fullName:e.target.value}))} placeholder="Full name"/></div>
                <div className="form-group"><label className="form-label">Email *</label><input className="form-input" type="email" value={userForm.email} onChange={e=>setUserForm(p=>({...p,email:e.target.value}))} placeholder="user@company.com" disabled={!!editingId}/></div>
              </div>
              <div className="form-group"><label className="form-label">{editingId?'New Password (blank = keep)':'Temporary Password *'}</label><input className="form-input" type="text" value={userForm.password} onChange={e=>setUserForm(p=>({...p,password:e.target.value}))} placeholder={editingId?'Leave blank to keep':'Temporary password'}/></div>
              <div className="form-grid2">
                <div className="form-group"><label className="form-label">Company</label><input className="form-input" value={userForm.companyName} onChange={e=>setUserForm(p=>({...p,companyName:e.target.value}))} placeholder="Optional"/></div>
                <div className="form-group"><label className="form-label">Phone Number</label><input className="form-input" value={userForm.phoneNumber} onChange={e=>setUserForm(p=>({...p,phoneNumber:e.target.value}))} placeholder="Optional"/></div>
              </div>
              <div className="form-group"><label className="form-label">TIN Number</label><input className="form-input" value={userForm.tinNumber} onChange={e=>setUserForm(p=>({...p,tinNumber:e.target.value}))} placeholder="e.g. 123-456-789-000"/></div>
              <div className="form-group"><label className="form-label">Company Address</label><textarea className="form-input" rows={2} value={userForm.address} onChange={e=>setUserForm(p=>({...p,address:e.target.value}))} placeholder="Registered company address" style={{resize:'vertical',minHeight:60}}/></div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={closeModal}>Cancel</button>
              <button className="btn btn-success" onClick={saveUser}>{editingId?'Update User':'Create User'}</button>
            </div>
          </div>
        </div>
      )}

      {/* ── Assign Role ── */}
      {modal==='roles'&&(
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&closeModal()}>
          <div className="modal" style={{maxWidth:600}}>
            <div className="modal-header">
              <div className="modal-title"><span style={{color:'var(--purple)'}}><Ico d={I.tag} size={16}/></span>Assign Role Designation</div>
              <button className="btn btn-icon btn-secondary" onClick={closeModal}><Ico d={I.x} size={13}/></button>
            </div>
            <div className="modal-body">
              <div className="form-group">
                <label className="form-label">Select Administrator *</label>
                <select className="form-input form-select" value={roleForm.adminId} onChange={e=>setRoleForm(p=>({...p,adminId:e.target.value}))}>
                  <option value="">-- Select Administrator --</option>
                  {admins.map(a=><option key={a.id} value={a.id}>{a.fullName} ({a.email})</option>)}
                </select>
              </div>
              <div className="form-group">
                <label className="form-label">Role Designation *</label>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginTop:4}}>
                  {SYSTEM_ROLES.map(r=>(
                    <div key={r.id} className={`role-card ${roleForm.roleId===r.id?'selected':''}`} onClick={()=>setRoleForm(p=>({...p,roleId:r.id,approvalLimit:r.approvalLimit===-1?'':r.approvalLimit}))}>
                      <div className="role-card-check">{roleForm.roleId===r.id&&<Ico d={I.check} size={10} stroke={3}/>}</div>
                      <div style={{marginBottom:4}}><span className={`badge badge-${getRoleBadge(r.id)}`}>{r.name}</span></div>
                      <div className="role-card-desc">{r.desc}</div>
                      <div style={{fontSize:10,fontFamily:'IBM Plex Mono,monospace',color:'var(--text2)',marginTop:6}}>Default limit: {fmtCurrency(r.approvalLimit)}</div>
                    </div>
                  ))}
                </div>
              </div>
              {roleForm.roleId&&(<>
                <div className="form-group">
                  <label className="form-label">Custom Approval Limit (₱) <span style={{color:'var(--text3)',textTransform:'none',fontWeight:400}}>— override default</span></label>
                  <input className="form-input" type="number" value={roleForm.approvalLimit} onChange={e=>setRoleForm(p=>({...p,approvalLimit:e.target.value}))} placeholder={`Default: ${fmtCurrency(SYSTEM_ROLES.find(r=>r.id===roleForm.roleId)?.approvalLimit)}`}/>
                  <div className="form-hint">Leave blank for default. 0 = no authority. -1 = unlimited.</div>
                </div>
                <div className="form-group">
                  <label className="form-label">Permissions Granted</label>
                  <div style={{display:'flex',flexWrap:'wrap',gap:6,padding:'10px 12px',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:6}}>
                    {(SYSTEM_ROLES.find(r=>r.id===roleForm.roleId)?.permissions||[]).map(p=><span key={p} className="badge badge-blue">{PERM_LABELS[p]||p}</span>)}
                  </div>
                </div>
                <div className="form-group">
                  <label className="form-label">Internal Notes</label>
                  <input className="form-input" value={roleForm.notes} onChange={e=>setRoleForm(p=>({...p,notes:e.target.value}))} placeholder="Optional — reason for this assignment"/>
                </div>
              </>)}
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={closeModal}>Cancel</button>
              <button className="btn btn-primary" onClick={saveRole}><Ico d={I.check} size={13}/>Save Role Assignment</button>
            </div>
          </div>
        </div>
      )}

      {modal==='approval-group'&&(
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&closeModal()}>
          <div className="modal" style={{maxWidth:660}}>
            <div className="modal-header">
              <div className="modal-title">
                <span style={{color:agForm.docType==='Order'?'var(--amber)':'var(--green)'}}>
                  <Ico d={agForm.docType==='Order'?I.cart:I.approval} size={16}/>
                </span>
                {editingId?'Edit Approval Group':'New Approval Group'}
                {agForm.docType==='Order'&&<span className="badge badge-amber" style={{marginLeft:6}}>Customer Order</span>}
              </div>
              <button className="btn btn-icon btn-secondary" onClick={closeModal}><Ico d={I.x} size={13}/></button>
            </div>
            <div className="modal-body">
              <div className="form-grid2">
                <div className="form-group"><label className="form-label">Group Name *</label><input className="form-input" value={agForm.name} onChange={e=>setAgForm(p=>({...p,name:e.target.value}))} placeholder={agForm.docType==='Order'?'e.g. Standard Order Approval':'e.g. Standard PO Approval'}/></div>
                <div className="form-group"><label className="form-label">Document Type *</label>
                  <select className="form-input form-select" value={agForm.docType} onChange={e=>setAgForm(p=>({...p,docType:e.target.value,requiresAmount:e.target.value!=='Order'}))}>
                    <option value="PO">Purchase Order (PO)</option>
                    <option value="Invoice">Invoice</option>
                    <option value="Both">Both PO &amp; Invoice</option>
                    <option value="Order">Customer Order (Shop)</option>
                  </select>
                </div>
              </div>
              <div className="form-group"><label className="form-label">Description</label><input className="form-input" value={agForm.description} onChange={e=>setAgForm(p=>({...p,description:e.target.value}))} placeholder="Optional — shown in approval notifications"/></div>
              <div className="form-grid2">
                <div className="form-group">
                  <label className="form-label">Company / Department</label>
                  <select className="form-input form-select" value={agForm.companyName} onChange={e=>setAgForm(p=>({...p,companyName:e.target.value}))}>
                    <option value="">All Companies</option>
                    {[...new Set([...admins.map(a=>a.companyName),...users.map(u=>u.companyName)].filter(Boolean))].map(c=><option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">Applies To</label>
                  <select className="form-input form-select" value={agForm.appliesTo} onChange={e=>setAgForm(p=>({...p,appliesTo:e.target.value}))}>
                    <option value="both">Both Admins &amp; Users</option>
                    <option value="admin">Admins Only</option>
                    <option value="user">Regular Users (Requisitioners) Only</option>
                  </select>
                </div>
              </div>

              {/* Order-specific: amount range is optional */}
              {agForm.docType==='Order'&&(
                <div className="form-group">
                  <label style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer',marginBottom:8}}>
                    <input type="checkbox" checked={!!agForm.requiresAmount} onChange={e=>setAgForm(p=>({...p,requiresAmount:e.target.checked}))} style={{width:16,height:16,accentColor:'var(--amber)'}}/>
                    <span style={{fontSize:12,color:'var(--text2)'}}>Filter by order amount range <span style={{color:'var(--text3)'}}>(optional — leave unchecked to apply to all amounts)</span></span>
                  </label>
                </div>
              )}

              {/* Amount range — always shown for PO/Invoice, conditional for Order */}
              {(agForm.docType!=='Order' || agForm.requiresAmount)&&(
                <div className="form-grid2">
                  <div className="form-group"><label className="form-label">Min Amount (₱)</label><input className="form-input" type="number" value={agForm.minAmount} onChange={e=>setAgForm(p=>({...p,minAmount:e.target.value}))} placeholder="0"/></div>
                  <div className="form-group"><label className="form-label">Max Amount (₱) <span style={{color:'var(--text3)',textTransform:'none',fontWeight:400}}>blank = no limit</span></label><input className="form-input" type="number" value={agForm.maxAmount} onChange={e=>setAgForm(p=>({...p,maxAmount:e.target.value}))} placeholder="No limit"/></div>
                </div>
              )}

              <div className="form-group">
                <label style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer'}}>
                  <input type="checkbox" checked={agForm.bypassAllowed} onChange={e=>setAgForm(p=>({...p,bypassAllowed:e.target.checked}))} style={{width:16,height:16,accentColor:'var(--amber)'}}/>
                  <span style={{fontSize:12,color:'var(--text2)'}}>
                    <strong style={{color:'var(--amber)'}}>Master Override:</strong> Allow this company to submit {agForm.docType==='Order'?'orders':'documents'} even without a configured Approval Group
                  </span>
                </label>
                <div className="form-hint" style={{marginLeft:26}}>Use this only for companies that are exempt from the approval workflow requirement.</div>
              </div>

              <div className="divider"/>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                <div>
                  <div style={{fontSize:12,fontWeight:700,color:'var(--text)'}}>Approval Chain Steps *</div>
                  <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>
                    {agForm.docType==='Order'
                      ? 'Orders route through each step in order. Assign by role or a specific approver.'
                      : 'Documents route through each step in order.'}
                  </div>
                </div>
                <button className="btn btn-sm btn-secondary" onClick={()=>setAgForm(p=>({...p,steps:[...p.steps,{approverRole:'',approverAdminId:'',approverName:'',limit:0,escalateTo:''}]}))}>
                  <Ico d={I.plus} size={11}/>Add Step
                </button>
              </div>
              {agForm.steps.length===0&&<div style={{padding:20,background:'var(--bg3)',border:'1px dashed var(--border2)',borderRadius:6,textAlign:'center',color:'var(--text3)',fontSize:12}}>No steps yet — click "Add Step" to build the chain.</div>}
              {agForm.steps.map((step,i)=>(
                <div key={i} className="rule-row" style={{flexWrap:'wrap',gap:8,alignItems:'flex-start',padding:12}}>
                  <div style={{display:'flex',alignItems:'center',gap:6,width:'100%',marginBottom:4}}>
                    <span className="rule-operator">Step {i+1}</span>
                    {i>0&&<span className="rule-connector">After Step {i}</span>}
                    <button className="btn btn-icon btn-danger btn-sm" style={{marginLeft:'auto',width:24,height:24}} onClick={()=>setAgForm(p=>({...p,steps:p.steps.filter((_,x)=>x!==i)}))}>
                      <Ico d={I.x} size={10}/>
                    </button>
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,width:'100%'}}>
                    {/* Approver Role — hidden for PO steps when a specific person is chosen */}
                    {(agForm.docType==='Order' || !step.approverAdminId) && (
                      <div>
                        <div style={{fontSize:10,fontWeight:600,letterSpacing:'.04em',textTransform:'uppercase',color:'var(--text3)',marginBottom:4}}>Approver Role <span style={{color:'var(--text3)',textTransform:'none',fontWeight:400}}>— optional</span></div>
                        <select className="form-input form-select" value={step.approverRole} onChange={e=>setAgForm(p=>{const s=[...p.steps];s[i]={...s[i],approverRole:e.target.value};return{...p,steps:s};})}>
                          <option value="">Any eligible approver</option>
                          {SYSTEM_ROLES.filter(r=>r.canApprove).map(r=><option key={r.id} value={r.name}>{r.name}</option>)}
                        </select>
                      </div>
                    )}
                    <div style={step.approverAdminId&&agForm.docType!=='Order'?{gridColumn:'1/3'}:{}}>
                      <div style={{fontSize:10,fontWeight:600,letterSpacing:'.04em',textTransform:'uppercase',color:'var(--text3)',marginBottom:4}}>
                        Specific Approver <span style={{color:'var(--text3)',textTransform:'none',fontWeight:400}}>— pick exact person</span>
                      </div>
                      <select className="form-input form-select" value={step.approverAdminId||''} onChange={e=>{
                        const admin = admins.find(a=>a.id===e.target.value);
                        setAgForm(p=>{const s=[...p.steps];s[i]={...s[i],approverAdminId:e.target.value,approverName:admin?.fullName||'',approverRole:admin?.assignedRoleName||s[i].approverRole||''};return{...p,steps:s};});
                      }}>
                        <option value="">— Match by role above —</option>
                        {(() => {
                          // Filter admins by role if a role is selected
                          const roleFilter = step.approverRole;
                          const list = roleFilter
                            ? admins.filter(a => a.assignedRoleName === roleFilter || a.assignedRole === roleFilter.toLowerCase().replace(' ','_'))
                            : admins;
                          return list.map(a=>(
                            <option key={a.id} value={a.id}>
                              {a.fullName} {a.assignedRoleName?`(${a.assignedRoleName})`:''} {a.companyName?`· ${a.companyName}`:''}
                            </option>
                          ));
                        })()}
                      </select>
                      {step.approverRole && admins.filter(a=>a.assignedRoleName===step.approverRole||a.assignedRole===step.approverRole.toLowerCase().replace(' ','_')).length===0 && (
                        <div style={{fontSize:10,color:'var(--amber)',marginTop:3}}>⚠ No admins have the "{step.approverRole}" role yet</div>
                      )}
                    </div>
                    {agForm.docType==='Order' ? (
                      <div>
                        <div style={{fontSize:10,fontWeight:600,letterSpacing:'.04em',textTransform:'uppercase',color:'var(--text3)',marginBottom:4}}>Escalate To <span style={{color:'var(--text3)',textTransform:'none'}}>— optional</span></div>
                        <input className="form-input" value={step.escalateTo||''} onChange={e=>setAgForm(p=>{const s=[...p.steps];s[i]={...s[i],escalateTo:e.target.value};return{...p,steps:s};})} placeholder="e.g. Finance Manager"/>
                      </div>
                    ) : (
                      <div>
                        <div style={{fontSize:10,fontWeight:600,letterSpacing:'.04em',textTransform:'uppercase',color:'var(--text3)',marginBottom:4}}>Approval Limit (₱)</div>
                        <input className="form-input" type="number" value={step.limit||''} onChange={e=>setAgForm(p=>{const s=[...p.steps];s[i]={...s[i],limit:parseFloat(e.target.value)||0};return{...p,steps:s};})} placeholder="Max this approver can approve"/>
                      </div>
                    )}
                  </div>
                  {agForm.docType!=='Order'&&(
                    <div style={{width:'100%'}}>
                      <div style={{fontSize:10,fontWeight:600,letterSpacing:'.04em',textTransform:'uppercase',color:'var(--text3)',marginBottom:4}}>Escalate To (role name)</div>
                      <input className="form-input" value={step.escalateTo||''} onChange={e=>setAgForm(p=>{const s=[...p.steps];s[i]={...s[i],escalateTo:e.target.value};return{...p,steps:s};})} placeholder="e.g. Finance Manager — if limit exceeded"/>
                    </div>
                  )}
                </div>
              ))}
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={closeModal}>Cancel</button>
              <button className="btn btn-primary" onClick={saveApprovalGroup}><Ico d={I.check} size={13}/>Save Approval Group</button>
            </div>
          </div>
        </div>
      )}

      {/* ── ASSIGN USERS TO ADMIN MODAL ──
          Core logic:
          • Pre-fills which admin you're assigning to (from the group header button)
          • Shows users already in that group (read-only summary)
          • Lets you pick any users NOT yet in that group (including users already in other groups)
          • Multi-select with search + select-all
          • Saves new userAdminAssignments docs
      */}
      {assignModal&&(
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&(setAssignModal(false),setAssignAdminId(''),setAssignUserIds([]))}>
          <div className="modal" style={{maxWidth:560}}>
            <div className="modal-header">
              <div className="modal-title"><span style={{color:'var(--cyan)'}}><Ico d={I.link} size={16}/></span>Assign Users to Administrator</div>
              <button className="btn btn-icon btn-secondary" onClick={()=>{setAssignModal(false);setAssignAdminId('');setAssignUserIds([]);}}><Ico d={I.x} size={13}/></button>
            </div>
            <div className="modal-body">

              {/* Admin selector */}
              <div className="form-group">
                <label className="form-label">Administrator *</label>
                <select className="form-input form-select" value={assignAdminId} onChange={e=>{setAssignAdminId(e.target.value);setAssignUserIds([]);}}>
                  <option value="">-- Select Administrator --</option>
                  {admins.map(a=>(
                    <option key={a.id} value={a.id}>
                      {a.fullName}{a.assignedRoleName?` · ${a.assignedRoleName}`:''}{a.companyName?` (${a.companyName})`:''}
                    </option>
                  ))}
                </select>
              </div>

              {assignAdminId&&(()=>{
                const alreadyHere = getUsersForAdmin(assignAdminId);
                const available   = getUsersNotInAdmin(assignAdminId).filter(u=>
                  !assignSearch||u.fullName?.toLowerCase().includes(assignSearch.toLowerCase())||
                  u.email?.toLowerCase().includes(assignSearch.toLowerCase())||
                  u.companyName?.toLowerCase().includes(assignSearch.toLowerCase())
                );
                const allAvailIds = getUsersNotInAdmin(assignAdminId).map(u=>u.id);
                const allSelected = allAvailIds.length>0 && allAvailIds.every(id=>assignUserIds.includes(id));
                const toggleAll   = () => setAssignUserIds(allSelected?assignUserIds.filter(id=>!allAvailIds.includes(id)):[...new Set([...assignUserIds,...allAvailIds])]);

                return (
                  <>
                    {/* Already in group */}
                    {alreadyHere.length>0&&(
                      <div style={{marginBottom:12,padding:'8px 12px',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:6}}>
                        <div style={{fontSize:10,fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--text3)',marginBottom:6}}>Already in this group ({alreadyHere.length})</div>
                        <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                          {alreadyHere.map(u=><span key={u.id} className="badge badge-green">{u.fullName}</span>)}
                        </div>
                      </div>
                    )}

                    <div className="form-group">
                      <label className="form-label">Add Users <span style={{color:'var(--text3)',textTransform:'none',fontWeight:400}}>— {assignUserIds.length} selected</span></label>
                      {/* Search */}
                      <div style={{position:'relative',marginBottom:8}}>
                        <input className="form-input" placeholder="Search by name, email or company..." value={assignSearch} onChange={e=>setAssignSearch(e.target.value)} style={{paddingLeft:30,fontSize:12}}/>
                        <span style={{position:'absolute',left:9,top:'50%',transform:'translateY(-50%)',color:'var(--text3)'}}><Ico d={I.search} size={12}/></span>
                      </div>

                      {allAvailIds.length===0?(
                        <div style={{padding:16,background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:6,fontSize:12,color:'var(--text3)',textAlign:'center'}}>All users are already in this group.</div>
                      ):available.length===0?(
                                             <div style={{padding:16,background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:6,fontSize:12,color:'var(--text3)',textAlign:'center'}}>No users match your search.</div>
                      ):(
                        <>
                          {/* Select All row */}
                          <div
                            style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'7px 12px',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'6px 6px 0 0',borderBottom:'none',cursor:'pointer',userSelect:'none'}}
                            onClick={toggleAll}
                          >
                            <span style={{fontSize:11,fontWeight:600,color:'var(--text2)'}}>
                              {allSelected?'Deselect All':'Select All'} ({allAvailIds.length} available)
                            </span>
                            <div style={{width:16,height:16,borderRadius:4,border:`1.5px solid ${allSelected?'var(--blue)':'var(--border2)'}`,background:allSelected?'var(--blue)':'transparent',display:'flex',alignItems:'center',justifyContent:'center',transition:'all .12s'}}>
                              {allSelected&&<Ico d={I.check} size={10} stroke={3}/>}
                            </div>
                          </div>

                          {/* Scrollable user list */}
                          <div style={{maxHeight:240,overflowY:'auto',border:'1px solid var(--border)',borderRadius:'0 0 6px 6px',background:'var(--bg3)'}}>
                            {available.map(u=>{
                              const sel = assignUserIds.includes(u.id);
                              const isInOtherGroups = assignments.filter(a=>a.userId===u.id).length>0;
                              return (
                                <div
                                  key={u.id}
                                  onClick={()=>setAssignUserIds(p=>sel?p.filter(id=>id!==u.id):[...p,u.id])}
                                  style={{
                                    display:'flex',alignItems:'center',gap:10,padding:'9px 12px',
                                    borderBottom:'1px solid var(--border)',cursor:'pointer',
                                    background:sel?'rgba(59,127,232,.08)':'transparent',
                                    transition:'background .12s',userSelect:'none'
                                  }}
                                >
                                  {/* Checkbox */}
                                  <div style={{width:16,height:16,borderRadius:4,border:`1.5px solid ${sel?'var(--blue)':'var(--border2)'}`,background:sel?'var(--blue)':'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,transition:'all .12s'}}>
                                    {sel&&<Ico d={I.check} size={10} stroke={3}/>}
                                  </div>
                                  {/* Avatar */}
                                  <div style={{width:28,height:28,borderRadius:6,background:'linear-gradient(135deg,var(--green),var(--cyan))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color:'#fff',flexShrink:0}}>
                                    {u.fullName?.[0]||'?'}
                                  </div>
                                  {/* Info */}
                                  <div style={{flex:1,minWidth:0}}>
                                    <div style={{fontSize:12,fontWeight:600,color:sel?'var(--text)':'var(--text2)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{u.fullName}</div>
                                    <div style={{fontSize:10,color:'var(--text3)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{u.email}{u.companyName?` · ${u.companyName}`:''}</div>
                                  </div>
                                  {/* "In other groups" indicator */}
                                  {isInOtherGroups&&(
                                    <span style={{fontSize:9,fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--purple)',background:'var(--purple-bg)',border:'1px solid rgba(168,85,247,.2)',padding:'1px 6px',borderRadius:3,flexShrink:0}}>
                                      Multi
                                    </span>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        </>
                      )}
                    </div>
                  </>
                );
              })()}
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={()=>{setAssignModal(false);setAssignAdminId('');setAssignUserIds([]);}}>Cancel</button>
              <button
                className="btn btn-primary"
                onClick={saveAssignment}
                disabled={!assignAdminId||assignUserIds.length===0}
                style={{opacity:(!assignAdminId||assignUserIds.length===0)?'.5':'1'}}
              >
                <Ico d={I.check} size={13}/>
                {assignUserIds.length>0?`Assign ${assignUserIds.length} User${assignUserIds.length!==1?'s':''}`:'Assign Users'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── AUDIT LOGS MODAL ── */}
      {modal==='logs'&&(
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
          <div className="modal" style={{maxWidth:700}}>
            <div className="modal-header">
              <div className="modal-title"><span style={{color:'var(--blue-lt)'}}><Ico d={I.clock} size={16}/></span>Audit Log — System Events</div>
              <button className="btn btn-icon btn-secondary" onClick={()=>setModal(null)}><Ico d={I.x} size={13}/></button>
            </div>
            <div className="modal-body" style={{padding:0}}>
              {logs.length===0?(
                <div className="empty">
                  <div className="empty-icon"><Ico d={I.clock} size={40}/></div>
                  <div className="empty-title">No audit events yet</div>
                  <div className="empty-sub">Actions taken in this panel will appear here</div>
                </div>
              ):(
                logs.map(l=>(
                  <div key={l.id} className="log-item">
                    <span
                      className={`badge ${
                        l.action?.includes('Deleted') ? 'badge-red'    :
                        l.action?.includes('Created') ? 'badge-green'  :
                        l.action?.includes('Assigned')? 'badge-blue'   :
                        l.action?.includes('Updated') ? 'badge-cyan'   :
                        'badge-purple'
                      }`}
                      style={{flexShrink:0,minWidth:130,justifyContent:'center'}}
                    >
                      {l.action}
                    </span>
                    <div style={{flex:1}}>
                      <div style={{fontSize:12,color:'var(--text2)',marginBottom:2}}>{l.details}</div>
                      {l.masterName&&<div style={{fontSize:10,color:'var(--text3)'}}>by {l.masterName}</div>}
                    </div>
                    <span className="log-time">
                      {l.timestamp?.toDate
                        ? new Date(l.timestamp.toDate()).toLocaleString()
                        : '—'
                      }
                    </span>
                  </div>
                ))
              )}
            </div>
            <div className="modal-footer">
              <span style={{fontSize:11,color:'var(--text3)',marginRight:'auto'}}>{logs.length} total event{logs.length!==1?'s':''}</span>
              <button className="btn btn-secondary" onClick={()=>setModal(null)}>Close</button>
            </div>
          </div>
        </div>
      )}

      {/* ── TOAST STACK ── */}
      <Toasts toasts={toasts}/>

    </div>
  );
}

ReactDOM.render(<MasterApp/>, document.getElementById('root'));
</script>
</body>
</html>
