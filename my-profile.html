                <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',background:'var(--surf)',borderRadius:10,border:'1px solid var(--line)'}}>
                  <input type="checkbox" id="addrDefault" checked={addrForm.isDefault}
                    onChange={e=>setAddrForm(f=>({...f,isDefault:e.target.checked}))}
                    style={{width:16,height:16,accentColor:'var(--blue)',cursor:'pointer'}}/>
                  <label htmlFor="addrDefault" style={{fontSize:13,fontWeight:600,color:'var(--ink)',cursor:'pointer'}}>
                    Set as default delivery address
                  </label>
                </div>
              </div>
            </div>
            <div className="m-foot">
              <button className="outline-btn" onClick={()=>setShowAddrModal(false)} disabled={addrSaving}>Cancel</button>
              <button className="save-btn" onClick={saveAddrModal} disabled={addrSaving}>
                {addrSaving
                  ? <><span style={{width:14,height:14,border:'2px solid rgba(255,255,255,.3)',borderTopColor:'#fff',borderRadius:'50%',display:'inline-block',animation:'spin .7s linear infinite'}}/> Saving…</>
                  : <><svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>{editingAddr ? 'Update Address' : 'Save Address'}</>
                }
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── CHANGE PASSWORD MODAL ── */}
      {showPwModal && (
        <div className="ov" onClick={e=>{if(e.target===e.currentTarget)setShowPwModal(false)}}>
          <div className="modal">
            <div className="m-hd">
              <div>
                <div className="m-title">Change Password</div>
                <div style={{fontSize:11,color:'#64748B',marginTop:2}}>Enter your current password to set a new one</div>
              </div>
              <button className="m-close" onClick={()=>setShowPwModal(false)}>
                <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>
            <div className="m-body">
              <div className="fg" style={{gap:14}}>
                {[
                  ['current', 'Current Password', 'Your existing password'],
                  ['newPw',   'New Password',      'At least 6 characters'],
                  ['confirm', 'Confirm New Password', 'Re-enter new password'],
                ].map(([key, label, ph]) => (
                  <div key={key}>
                    <label className="fl">{label}</label>
                    <input type="password" className="fi" value={pwForm[key]}
                      onChange={e=>setPwForm(p=>({...p,[key]:e.target.value}))}
                      placeholder={ph}/>
                  </div>
                ))}
              </div>
            </div>
            <div className="m-foot">
              <button className="outline-btn" onClick={()=>setShowPwModal(false)}>Cancel</button>
              <button className="save-btn" onClick={changePassword} disabled={pwSaving}>
                {pwSaving ? 'Changing…' : 'Change Password'}
              </button>
            </div>
          </div>
        </div>
      )}


        {/* ── ACCOUNT & BILLING TAB ── */}
        {tab === 'billing' && (()=>{
          const fmt = n => '₱' + Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
          const fmtDate = v => {
            if (!v) return '—';
            try { const d = v?.toDate ? v.toDate() : new Date(v); if (isNaN(d)) return '—'; return d.toLocaleDateString('en-PH',{month:'short',day:'2-digit',year:'numeric'}); } catch(e) { return '—'; }
          };
          const getSchedule = (terms, balance) => {
            if (!terms || !balance) return [];
            const today = new Date();
            const add = (d,days) => { const r=new Date(d); r.setDate(r.getDate()+days); return r; };
            const fmt2 = d => d.toLocaleDateString('en-PH',{month:'short',day:'2-digit',year:'numeric'});
            if (['COD','Prepaid','Upon Delivery'].includes(terms)) return [{ label:'Due on delivery', date:'Upon delivery', amount:balance, status:'due' }];
            const m = terms.match(/Net\s*(\d+)/i);
            if (m) {
              const days = parseInt(m[1]);
              return invoices.filter(inv=>!(inv.paymentPaid||inv.arCollected)).slice(0,5).map(inv=>{
                const created = inv.createdAt?.toDate ? inv.createdAt.toDate() : new Date(inv.createdAt||Date.now());
                const due = add(created,days); const overdue = due < today;
                return { label:`Invoice ${inv.orderNumber||inv.id}`, date:fmt2(due), amount:inv.totalAmount||0, status:overdue?'overdue':'due' };
              });
            }
            if (terms==='Monthly') return [1,2,3].map(mo=>({ label:`Month ${mo}`, date:fmt2(add(today,mo*30)), amount:balance/3, status:'scheduled' }));
            return [{ label:'Payment due', date:fmt2(add(today,30)), amount:balance, status:'due' }];
          };
          const schedule      = getSchedule(financeData.paymentTerms, financeData.outstandingBalance);
          const creditUsedPct = financeData.creditLimit>0 ? Math.min(100,Math.round((financeData.outstandingBalance/financeData.creditLimit)*100)) : 0;
          const statusColors  = { active:'#059669', on_hold:'#D97706', suspended:'#DC2626', closed:'#64748B' };
          const statusColor   = statusColors[financeData.accountStatus] || '#059669';
          const schStyle = s => s==='overdue'
            ? {border:'1.5px solid #FECACA',bg:'#FEF2F2',dot:'#DC2626',amt:'#DC2626',tag:'#DC2626'}
            : s==='due'
            ? {border:'1.5px solid #FDE68A',bg:'#FFFBEB',dot:'#D97706',amt:'#D97706',tag:'#D97706'}
            : {border:'1.5px solid #E2E8F0',bg:'#F8FAFC',dot:'#0057FF',amt:'var(--ink)',tag:'#64748B'};

          return (
            <div>

              {/* Account status alert — only shown when not active */}
              {financeData.accountStatus !== 'active' && (
                <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderRadius:8,marginBottom:12,
                  background:financeData.accountStatus==='on_hold'?'#FFFBEB':'#FEF2F2',
                  border:`1px solid ${financeData.accountStatus==='on_hold'?'#FDE68A':'#FECACA'}`}}>
                  <div style={{width:28,height:28,borderRadius:7,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',
                    background:financeData.accountStatus==='on_hold'?'#FEF3C7':'#FEE2E2'}}>
                    {financeData.accountStatus==='on_hold'
                      ? <svg width="14" height="14" fill="none" stroke="#D97706" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                      : <svg width="14" height="14" fill="none" stroke="#DC2626" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <span style={{fontWeight:700,fontSize:12,color:statusColor,textTransform:'capitalize'}}>{financeData.accountStatus.replace('_',' ')} — </span>
                    <span style={{fontSize:12,color:'#64748B'}}>{financeData.accountStatus==='on_hold'?'Account on hold. Contact your account manager.':'Account access restricted. Contact support.'}</span>
                  </div>
                </div>
              )}

              {/* ── KPI row: 3-cell single card ── */}
              <div className="card" style={{marginBottom:12,overflow:'hidden'}}>
                <div className="billing-kpi-grid">

                  <div className="billing-kpi-cell">
                    <div className="billing-kpi-label" style={{color:'#92400E'}}>
                      Outstanding Balance
                      <div style={{width:24,height:24,borderRadius:6,background:'#FEF3C7',display:'flex',alignItems:'center',justifyContent:'center'}}>
                        <svg width="12" height="12" fill="none" stroke="#D97706" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
                      </div>
                    </div>
                    <div className="billing-kpi-value" style={{color:'#D97706'}}>{fmt(financeData.outstandingBalance)}</div>
                    <div className="billing-kpi-sub" style={{color:'#A16207'}}>
                      <svg width="9" height="9" fill="none" stroke="#D97706" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                      {financeData.paymentTerms ? `Terms: ${financeData.paymentTerms}` : 'No terms set'}
                    </div>
                  </div>

                  <div className="billing-kpi-cell">
                    <div className="billing-kpi-label" style={{color:'#1E40AF'}}>
                      Credit Limit
                      <div style={{width:24,height:24,borderRadius:6,background:'#DBEAFE',display:'flex',alignItems:'center',justifyContent:'center'}}>
                        <svg width="12" height="12" fill="none" stroke="#0057FF" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                      </div>
                    </div>
                    <div className="billing-kpi-value" style={{color:'#0057FF'}}>{financeData.creditLimit>0 ? fmt(financeData.creditLimit) : 'No limit'}</div>
                    <div className="billing-kpi-sub" style={{color:'#1D4ED8'}}>
                      <svg width="9" height="9" fill="none" stroke="#0057FF" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
                      {financeData.creditLimit>0 ? `${creditUsedPct}% utilized` : 'Unlimited credit'}
                    </div>
                  </div>

                  <div className="billing-kpi-cell">
                    <div className="billing-kpi-label" style={{color:'#166534'}}>
                      Account Status
                      <div style={{width:24,height:24,borderRadius:6,background:'#DCFCE7',display:'flex',alignItems:'center',justifyContent:'center'}}>
                        <svg width="12" height="12" fill="none" stroke={statusColor} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                      </div>
                    </div>
                    <div className="billing-kpi-value" style={{color:statusColor,textTransform:'capitalize'}}>{(financeData.accountStatus||'Active').replace('_',' ').replace(/\w/g,ch=>ch.toUpperCase())}</div>
                    <div className="billing-kpi-sub" style={{color:'#15803D'}}>
                      <svg width="9" height="9" fill="none" stroke="#059669" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                      {financeData.customerId ? `ID: ${financeData.customerId}` : 'No Customer ID'}
                    </div>
                  </div>

                </div>
              </div>

              {/* Credit utilization — inline inside KPI card area, only if credit limit set */}
              {financeData.creditLimit>0&&(
                <div className="card" style={{marginBottom:12}}>
                  <div style={{padding:'10px 16px',display:'flex',alignItems:'center',gap:12,borderBottom:'1px solid var(--line)'}}>
                    <svg width="13" height="13" fill="none" stroke="#0057FF" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                    <span style={{fontSize:12,fontWeight:700,color:'var(--ink)',flex:1}}>Credit Utilization</span>
                    <span style={{fontSize:12,fontWeight:800,fontFamily:"'DM Mono',monospace",color:creditUsedPct>=90?'#DC2626':creditUsedPct>=70?'#D97706':'#059669'}}>{creditUsedPct}%</span>
                  </div>
                  <div style={{padding:'10px 16px'}}>
                    <div style={{height:6,background:'#E4EAF2',borderRadius:99,overflow:'hidden',marginBottom:10}}>
                      <div style={{height:'100%',borderRadius:99,width:`${creditUsedPct}%`,transition:'width .5s cubic-bezier(.4,0,.2,1)',
                        background:`linear-gradient(90deg,${creditUsedPct>=90?'#DC2626':creditUsedPct>=70?'#D97706':'#0057FF'},${creditUsedPct>=90?'#991B1B':creditUsedPct>=70?'#92400E':'#003FBB'})`}}/>
                    </div>
                    <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'#64748B'}}>
                      <span>Used: <strong style={{color:'var(--ink)',fontFamily:"'DM Mono',monospace"}}>{fmt(financeData.outstandingBalance)}</strong></span>
                      <span>Available: <strong style={{color:'#059669',fontFamily:"'DM Mono',monospace"}}>{fmt(Math.max(0,financeData.creditLimit-financeData.outstandingBalance))}</strong></span>
                      <span>Limit: <strong style={{color:'#0057FF',fontFamily:"'DM Mono',monospace"}}>{fmt(financeData.creditLimit)}</strong></span>
                    </div>
                  </div>
                </div>
              )}

              {/* Payment schedule */}
              {(financeData.paymentTerms||schedule.length>0)&&(
                <div className="card" style={{marginBottom:12}}>
                  <div style={{padding:'10px 16px',display:'flex',alignItems:'center',gap:10,borderBottom:'1px solid var(--line)'}}>
                    <svg width="13" height="13" fill="none" stroke="#059669" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <span style={{fontSize:12,fontWeight:700,color:'var(--ink)',flex:1}}>Payment Schedule</span>
                    <span style={{fontSize:11,color:'#64748B'}}>Terms: <strong style={{color:'var(--ink)'}}>{financeData.paymentTerms||'—'}</strong></span>
                  </div>
                  {schedule.length===0?(
                    <div style={{padding:'16px 16px',display:'flex',alignItems:'center',gap:10}}>
                      <svg width="16" height="16" fill="none" stroke="#059669" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24" style={{opacity:.6,flexShrink:0}}><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                      <span style={{fontSize:12,color:'#64748B'}}>All settled up — no outstanding invoices.</span>
                    </div>
                  ):(
                    <div style={{padding:'8px 12px',display:'flex',flexDirection:'column',gap:6}}>
                      {schedule.map((item,i)=>{ const ss=schStyle(item.status); return(
                        <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',borderRadius:7,border:ss.border,background:ss.bg}}>
                          <div style={{width:6,height:6,borderRadius:'50%',background:ss.dot,flexShrink:0}}/>
                          <span style={{fontSize:12,fontWeight:600,color:'var(--ink)',flex:1}}>{item.label}</span>
                          <span style={{fontSize:11,color:'#64748B',marginRight:10}}>Due: {item.date}</span>
                          <span style={{fontSize:12,fontWeight:800,fontFamily:"'DM Mono',monospace",color:ss.amt}}>{fmt(item.amount)}</span>
                          <span style={{fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',color:ss.tag,minWidth:50,textAlign:'right'}}>{item.status}</span>
                        </div>
                      );})}
                    </div>
                  )}
                </div>
              )}

              {/* Invoices */}
              <div className="card" style={{marginBottom:12}}>
                <div style={{padding:'10px 16px',display:'flex',alignItems:'center',gap:10,borderBottom:'1px solid var(--line)'}}>
                  <svg width="13" height="13" fill="none" stroke="#0057FF" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                  <span style={{fontSize:12,fontWeight:700,color:'var(--ink)',flex:1}}>Invoices</span>
                  <span style={{fontSize:11,color:'#64748B'}}>{invoices.length} on record</span>
                </div>
                {invoices.length===0?(
                  <div style={{padding:'16px 16px',display:'flex',alignItems:'center',gap:10}}>
                    <svg width="16" height="16" fill="none" stroke="#94A3B8" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24" style={{flexShrink:0,opacity:.6}}><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    <span style={{fontSize:12,color:'#94A3B8'}}>No invoices yet — will appear here once orders are processed.</span>
                  </div>
                ):(
                  <div style={{overflowX:'auto'}}>
                    <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                      <thead>
                        <tr style={{background:'#F8FAFC',borderBottom:'1px solid var(--line)'}}>
                          {['Order #','Date','Status','Total','Method'].map(h=>(
                            <th key={h} style={{padding:'8px 14px',textAlign:'left',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'.07em',color:'#64748B',whiteSpace:'nowrap'}}>{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {invoices.slice(0,10).map(inv=>(
                          <tr key={inv.id} style={{borderBottom:'1px solid var(--line)'}}
                            onMouseEnter={e=>e.currentTarget.style.background='#F8FAFC'}
                            onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                            <td style={{padding:'8px 14px',fontFamily:"'DM Mono',monospace",fontWeight:700,color:'#0057FF',fontSize:11}}>{inv.orderNumber||inv.id.slice(-6)}</td>
                            <td style={{padding:'8px 14px',color:'#64748B',fontSize:11}}>{fmtDate(inv.createdAt)}</td>
                            <td style={{padding:'8px 14px'}}>
                              <span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 7px',borderRadius:99,fontSize:10,fontWeight:700,
                                background:inv.status==='paid'||inv.status==='Paid'?'#ECFDF5':inv.status==='overdue'?'#FEF2F2':'#EEF4FF',
                                color:inv.status==='paid'||inv.status==='Paid'?'#059669':inv.status==='overdue'?'#DC2626':'#0057FF'}}>
                                <span style={{width:4,height:4,borderRadius:'50%',background:'currentColor',flexShrink:0}}/>
                                {inv.status||'Pending'}
                              </span>
                            </td>
                            <td style={{padding:'8px 14px',fontFamily:"'DM Mono',monospace",fontWeight:700,color:'var(--ink)',fontSize:11}}>{fmt(inv.totalAmount)}</td>
                            <td style={{padding:'8px 14px',color:'#64748B',fontSize:11}}>{inv.paymentMethod||'—'}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>

              {/* Payment History */}
              <div className="card" style={{marginBottom:financeApprovalGroup?12:0}}>
                <div style={{padding:'10px 16px',display:'flex',alignItems:'center',gap:10,borderBottom:'1px solid var(--line)'}}>
                  <svg width="13" height="13" fill="none" stroke="#059669" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="12 8 12 12 14 14"/><path d="M3.05 11a9 9 0 109.9-9.9M3 3v5h5"/></svg>
                  <span style={{fontSize:12,fontWeight:700,color:'var(--ink)',flex:1}}>Payment History</span>
                  <span style={{fontSize:11,color:'#64748B'}}>{paymentHistory.length} recorded</span>
                </div>
                {paymentHistory.length===0?(
                  <div style={{padding:'16px 16px',display:'flex',alignItems:'center',gap:10}}>
                    <svg width="16" height="16" fill="none" stroke="#94A3B8" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24" style={{flexShrink:0,opacity:.6}}><polyline points="12 8 12 12 14 14"/><path d="M3.05 11a9 9 0 109.9-9.9M3 3v5h5"/></svg>
                    <span style={{fontSize:12,color:'#94A3B8'}}>No payment history — completed payments will appear here.</span>
                  </div>
                ):(
                  <div style={{overflowX:'auto'}}>
                    <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                      <thead>
                        <tr style={{background:'#F8FAFC',borderBottom:'1px solid var(--line)'}}>
                          {['Reference','Order #','Date','Amount','Method'].map(h=>(
                            <th key={h} style={{padding:'8px 14px',textAlign:'left',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'.07em',color:'#64748B',whiteSpace:'nowrap'}}>{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {paymentHistory.slice(0,10).map(p=>(
                          <tr key={p.id} style={{borderBottom:'1px solid var(--line)'}}
                            onMouseEnter={e=>e.currentTarget.style.background='#F8FAFC'}
                            onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                            <td style={{padding:'8px 14px',fontFamily:"'DM Mono',monospace",fontSize:10,color:'#94A3B8'}}>{p.ref}</td>
                            <td style={{padding:'8px 14px',fontFamily:"'DM Mono',monospace",fontWeight:700,color:'#0057FF',fontSize:11}}>{p.orderNumber}</td>
                            <td style={{padding:'8px 14px',color:'#64748B',fontSize:11}}>{fmtDate(p.date)}</td>
                            <td style={{padding:'8px 14px',fontFamily:"'DM Mono',monospace",fontWeight:700,color:'#059669',fontSize:11}}>{fmt(p.amount)}</td>
                            <td style={{padding:'8px 14px',color:'#64748B',fontSize:11}}>{p.method}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>

              {/* Finance Approval Notice */}
              {financeApprovalGroup&&(
                <div style={{display:'flex',alignItems:'flex-start',gap:10,padding:'10px 14px',background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:8}}>
                  <div style={{width:28,height:28,borderRadius:7,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',background:'#FEF3C7'}}>
                    <svg width="13" height="13" fill="none" stroke="#D97706" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                  </div>
                  <div>
                    <div style={{fontSize:12,fontWeight:700,color:'#92400E',marginBottom:2}}>Balance Adjustments Require Approval</div>
                    <div style={{fontSize:11,color:'#78350F',lineHeight:1.5}}>Reviewed by <strong>{financeApprovalGroup.name}</strong> before taking effect.</div>
                  </div>
                </div>
              )}

            </div>
          );
        })()}

      {/* TOAST */}
      {toast && (
        <div className={`toast ${toast.type}`}>
          {toast.type === 'success'
            ? <svg width="16" height="16" fill="none" stroke="var(--green)" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>
            : <svg width="16" height="16" fill="none" stroke="var(--red)" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          }
          {toast.msg}
        </div>
      )}

      {/* FOOTER */}
      <ShopFooter footerData={shopConfig.footer}/>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
