            }

            {/* Accent bar (no background only) */}
            {!layout.backgroundUrl&&<div style={{position:'absolute',top:0,left:0,right:0,height:4,background:'linear-gradient(90deg,#050C9C,#3B4FD8)',borderRadius:'2px 2px 0 0',pointerEvents:'none',zIndex:1}}/>}

            {/* DRAGGABLE FIELD BLOCKS */}
            {layout.placedFields.map(f => {
              const isSelected = selectedFieldId === f.id;
              const srcColor   = f.isCustom ? '#059669' : (SOURCE_COLOR[f.source]||'#64748B');
              // For items_table: derive width from sum of columnWidths so the dashed
              // rectangle always exactly matches the table — live as columns are resized.
              // For all other fields: use f.width as before.
              const DEFAULT_CW = [40,220,120,60,110,110];
              const pixelW = f.id === 'items_table'
                ? (f.columnWidths || DEFAULT_CW).reduce((a,b)=>a+b,0)
                : (f.width || 200);
              return (
                <div key={f.id}
                  style={{
                    position:'absolute',
                    left: f.x, top: f.y,
                    width: pixelW,
                    zIndex: isSelected ? 20 : 5,
                    cursor: 'move',
                    userSelect: 'none',
                    boxSizing: 'border-box',
                  }}
                  onMouseDown={e => handleMouseDown(e, f.id)}
                  onClick={e => { e.stopPropagation(); setSelectedFieldId(f.id); setActivePanel('fieldstyle'); setActiveRibbonTab('layout'); }}
                >
                  {/* Label tag — floats ABOVE the field, does not push content */}
                  <div style={{position:'absolute',top:-14,left:0,right:0,display:'flex',alignItems:'center',gap:4,padding:'1px 5px',background:`${srcColor}dd`,borderRadius:'3px 3px 0 0',lineHeight:1,userSelect:'none',zIndex:10,pointerEvents:'none'}}>
                    <div style={{width:4,height:4,borderRadius:'50%',background:'#fff',flexShrink:0,opacity:.8}}/>
                    <span style={{fontSize:6.5,fontWeight:800,color:'#fff',textTransform:'uppercase',letterSpacing:'.07em',fontFamily:'DM Sans,sans-serif',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.label}</span>
                    <span style={{fontSize:6,fontWeight:900,color:srcColor,background:'#fff',borderRadius:2,padding:'0 3px',letterSpacing:'.04em',textTransform:'uppercase',flexShrink:0}}>{f.isCustom?'TXT':f.source}</span>
                    <span style={{fontSize:6,color:'rgba(255,255,255,.7)',fontFamily:'DM Mono,monospace',flexShrink:0}}>{Math.round(f.x)},{Math.round(f.y)}</span>
                    {isSelected&&(
                      <div onMouseDown={e=>{e.stopPropagation();removeField(f.id);}}
                        style={{width:11,height:11,borderRadius:'50%',background:'#ef4444',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:7.5,cursor:'pointer',fontWeight:900,flexShrink:0,lineHeight:1,pointerEvents:'all'}}>×</div>
                    )}
                  </div>
                  {/* Outline box — transparent background, visible only as border */}
                  <div style={{position:'absolute',inset:0,border:isSelected?`2px solid ${srcColor}`:`1.5px dashed ${srcColor}55`,borderRadius:3,boxShadow:isSelected?`0 0 0 3px ${srcColor}18`:undefined,background:'transparent',pointerEvents:'none'}}/>
                  {/* Content — maxChars applied here as maxWidth so wrapping still works */}
                  <div style={{
                    position:'relative', pointerEvents:'none',
                    maxWidth: (!f.isCustom && f.maxChars > 0) ? `${f.maxChars}ch` : '100%',
                    wordBreak:'break-word', overflowWrap:'break-word',
                  }}>
                    {renderFieldPreview(f)}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Below canvas */}
          <div style={{width:794,display:'flex',justifyContent:'flex-end',marginTop:14}}>
            <button onClick={saveLayout} disabled={saving}
              style={{display:'flex',alignItems:'center',gap:7,padding:'8px 20px',background:saving?'rgba(255,255,255,.1)':'var(--blue)',color:saving?'rgba(255,255,255,.4)':'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:700,cursor:saving?'default':'pointer',fontFamily:'DM Sans,sans-serif'}}>
              {saving?<div className="loader"/>:<SaveIcon/>}
              {saving?'Saving…':'Save Layout'}
            </button>
          </div>
        </div>
      </div>

      {toast&&<Toast message={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
    </div>
  );
}

ReactDOM.render(<POLayoutSetup/>, document.getElementById('root'));
</script>
</body>
</html>
