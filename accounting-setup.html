                </div>
              )}
              {rateWarn && (
                <div className="alert alert-warn" style={{marginBottom:14}}>
                  <Ico d={I.warn} size={14} color="var(--amber)"/>
                  <div>No Corporate rate found — using Spot rate. You may override manually.</div>
                </div>
              )}

              <div className="grid2" style={{marginBottom:14}}>
                <div className="fg">
                  <label className="label req">Exchange Rate ({form.currency}→PHP)</label>
                  <input className="input mono" type="number" step="0.0001" value={form.exchangeRate}
                    onChange={e=>{setForm(p=>({...p,exchangeRate:e.target.value,overrideRate:true}));setRateErr(null);setRateWarn(true);}}
                    placeholder="Auto-populated from GL Date"/>
                  {form.overrideRate&&<p className="inline-warn" style={{marginTop:5}}><Ico d={I.warn} size={10}/>Manual override active</p>}
                </div>
                <div className="fg">
                  <label className="label">Functional Amount (PHP)</label>
                  <div className="fx-box">
                    <div>
                      <div className="fx-rate">₱{fmtNum(functionalAmt)}</div>
                      <div className="fx-note">{fmtNum(parseFloat(form.amount)||0)} {form.currency} × {fmtNum(parseFloat(form.exchangeRate)||0,4)}</div>
                    </div>
                    <Ico d={I.flash} size={18} color="var(--blue2)"/>
                  </div>
                </div>
              </div>

              <div className="divider"/>

              {/* Accounting Distribution */}
              <div style={{marginBottom:10,fontSize:11,fontWeight:700,color:'var(--ink3)',textTransform:'uppercase',letterSpacing:'.06em'}}>Accounting Distribution</div>
              <div className="calc-box" style={{marginBottom:14}}>
                <div style={{display:'grid',gridTemplateColumns:'28px 2fr 1fr 1fr',gap:8,marginBottom:8}}>
                  <div/>{['Account','Debit (₱)','Credit (₱)'].map(h=><div key={h} style={{fontSize:9.5,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.05em'}}>{h}</div>)}
                </div>
                {[
                  {type:'DR',acct:'expenseAccount',list:EXPENSE_ACCOUNTS,  dr:functionalAmt, cr:0},
                  {type:'CR',acct:'liabilityAccount',list:LIABILITY_ACCOUNTS,dr:0, cr:functionalAmt},
                ].map(row=>(
                  <div key={row.type} style={{display:'grid',gridTemplateColumns:'28px 2fr 1fr 1fr',gap:8,marginBottom:8,alignItems:'center'}}>
                    <span style={{fontSize:10,fontWeight:800,color:row.type==='DR'?'var(--blue2)':'var(--red)',fontFamily:'IBM Plex Mono'}}>{row.type}</span>
                    <select className="select" style={{fontSize:11}} value={form[row.acct]} onChange={e=>setForm(p=>({...p,[row.acct]:e.target.value}))}>
                      {row.list.map(a=><option key={a} value={a}>{a}</option>)}
                    </select>
                    <span className="mono" style={{fontWeight:700,color:row.type==='DR'?'var(--blue2)':'var(--ink3)',textAlign:'right'}}>₱{fmtNum(row.dr)}</span>
                    <span className="mono" style={{fontWeight:700,color:row.type==='CR'?'var(--red)':'var(--ink3)',textAlign:'right'}}>₱{fmtNum(row.cr)}</span>
                  </div>
                ))}
                <div style={{borderTop:'1px solid var(--blue-m)',marginTop:6,paddingTop:8,display:'grid',gridTemplateColumns:'28px 2fr 1fr 1fr',gap:8}}>
                  <div/><div style={{fontSize:10,fontWeight:700,color:'var(--muted)'}}>Totals</div>
                  <span className="mono" style={{fontWeight:800,color:'var(--blue2)',textAlign:'right'}}>₱{fmtNum(functionalAmt)}</span>
                  <span className="mono" style={{fontWeight:800,color:'var(--red)',textAlign:'right'}}>₱{fmtNum(functionalAmt)}</span>
                </div>
              </div>

              <div className="fg">
                <label className="label">Notes</label>
                <textarea className="input" rows={2} value={form.notes} onChange={e=>setForm(p=>({...p,notes:e.target.value}))} placeholder="Optional notes…" style={{resize:'vertical'}}/>
              </div>
            </div>

            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={()=>{setShowForm(false);setForm(emptyForm());setPeriodErr(null);setRateErr(null);}} disabled={saving}>Cancel</button>
              <button className="btn btn-secondary" onClick={validate} disabled={saving} style={{color:'var(--blue2)'}}>
                <Ico d={I.check} size={12}/> Validate
              </button>
              <button className="btn btn-primary" onClick={createAccounting} disabled={saving||!canPost} title={!canPost?'Fix validation errors first':''}>
                {saving?<><span className="spinner"/> Creating…</>:<><Ico d={I.flash} size={12} color="#fff"/> Create Accounting</>}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// TAB: JOURNAL LEDGER
// ══════════════════════════════════════════════════════════════════════════════
function JournalsTab({ journals, dataLoading }) {
  const [expanded, setExpanded] = useState(null);
  const [search,   setSearch]   = useState('');

  const filtered = journals.filter(j =>
    !search || j.description?.toLowerCase().includes(search.toLowerCase()) ||
    j.periodName?.toLowerCase().includes(search.toLowerCase())
  );

  return (
    <div className="content-section">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:20}}>
        <div>
          <h1 style={{fontSize:20,fontWeight:800,color:'var(--ink)',marginBottom:3}}>Journal Ledger</h1>
          <p style={{fontSize:12,color:'var(--muted)'}}>All GL journal entries · Debits & Credits · Period-based posting</p>
        </div>
        <div style={{display:'flex',gap:10,alignItems:'center'}}>
          <span style={{fontSize:11,color:'var(--muted)'}}>{filtered.length} journal{filtered.length!==1?'s':''}</span>
          <div style={{display:'flex',alignItems:'center',gap:8,background:'var(--green-l)',border:'1px solid #A7F3D0',borderRadius:8,padding:'6px 12px'}}>
            <Ico d={I.check} size={12} color="var(--green)"/>
            <span style={{fontSize:11,fontWeight:700,color:'var(--green)'}}>
              All Balanced: DR = CR
            </span>
          </div>
        </div>
      </div>

      {/* Search */}
      <div className="search-wrap" style={{marginBottom:14,maxWidth:320}}>
        <span className="search-ico"><Ico d={I.search} size={13}/></span>
        <input className="input search-in" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search journals…"/>
      </div>

      {dataLoading ? <div style={{textAlign:'center',padding:40,color:'var(--muted)'}}>Loading…</div> :
        filtered.length===0 ? (
          <div style={{textAlign:'center',padding:'60px 20px',color:'var(--muted)'}}>
            <Ico d={I.journal} size={36} color="#CBD5E1"/><br/>
            <p style={{marginTop:14,fontWeight:600}}>No journal entries found.</p>
            <p style={{fontSize:11,marginTop:4}}>Post an invoice to generate GL journal entries.</p>
          </div>
        ) : filtered.map(j => (
          <div key={j.id} className="card" style={{marginBottom:12}}>
            <div style={{padding:'12px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer',borderRadius:expanded===j.id?'10px 10px 0 0':'10px'}} onClick={()=>setExpanded(expanded===j.id?null:j.id)}>
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <div style={{width:32,height:32,borderRadius:8,background:'var(--blue-l)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <Ico d={I.journal} size={14} color="var(--blue2)"/>
                </div>
                <div>
                  <div style={{fontWeight:700,fontSize:12,color:'var(--ink)'}}>{j.description}</div>
                  <div style={{fontSize:10,color:'var(--muted)',marginTop:2}}>
                    GL Date: <span className="mono">{j.glDate}</span> · Period: <strong>{j.periodName}</strong> · Currency: <strong>{j.currency}</strong>
                  </div>
                </div>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <div style={{textAlign:'right'}}>
                  <div className="mono" style={{fontWeight:800,color:'var(--green)',fontSize:13}}>₱{fmtNum(j.totalDebit)}</div>
                  <div style={{fontSize:10,color:'var(--muted)'}}>Total DR/CR</div>
                </div>
                <span className="badge badge-posted">{j.status}</span>
                <Ico d={I.down} size={13} color="var(--muted)" sw={2.5}/>
              </div>
            </div>
            {expanded===j.id && (
              <div style={{borderTop:'1px solid var(--line)',padding:'0'}}>
                <div style={{padding:'4px 16px 4px',background:'var(--gray-l)'}}>
                  <div style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr',gap:8,padding:'8px 0'}}>
                    {['Account','DR (₱)','CR (₱)','Entered'].map(h=>(
                      <span key={h} style={{fontSize:9.5,fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--muted)'}}>{h}</span>
                    ))}
                  </div>
                </div>
                {(j.lines||[]).map((line,i)=>(
                  <div key={i} style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr',gap:8,padding:'10px 16px',borderTop:'1px solid var(--line2)',alignItems:'center'}}>
                    <div>
                      <div style={{fontWeight:700,fontSize:11,color:'var(--ink2)'}}>{line.account}</div>
                      <div style={{fontSize:10,color:'var(--muted)'}}>{line.description}</div>
                    </div>
                    <span className="mono" style={{fontWeight:line.debit>0?700:400,color:line.debit>0?'var(--blue2)':'var(--muted)',fontSize:12}}>{line.debit>0?`₱${fmtNum(line.debit)}`:'—'}</span>
                    <span className="mono" style={{fontWeight:line.credit>0?700:400,color:line.credit>0?'var(--red)':'var(--muted)',fontSize:12}}>{line.credit>0?`₱${fmtNum(line.credit)}`:'—'}</span>
                    <span className="mono" style={{fontSize:11,color:'var(--muted)'}}>
                      {line.enteredDebit>0?`${j.currency} ${fmtNum(line.enteredDebit)}`:line.enteredCredit>0?`${j.currency} ${fmtNum(line.enteredCredit)}`:'—'}
                    </span>
                  </div>
                ))}
                <div style={{padding:'8px 16px',background:'var(--gray-l)',borderTop:'1.5px solid var(--line)',display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr',gap:8}}>
                  <span style={{fontSize:10,fontWeight:800,color:'var(--muted)',textTransform:'uppercase'}}>Total</span>
                  <span className="mono" style={{fontWeight:800,color:'var(--blue2)'}}>₱{fmtNum(j.totalDebit)}</span>
                  <span className="mono" style={{fontWeight:800,color:'var(--red)'}}>₱{fmtNum(j.totalCredit)}</span>
                  <span style={{fontSize:10,color:'var(--muted)'}}>Created by {j.createdBy}</span>
                </div>
              </div>
            )}
          </div>
        ))
      }
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// TAB: AUDIT TRAIL
// ══════════════════════════════════════════════════════════════════════════════
function AuditTab({ auditLog, dataLoading }) {
  const actionColor = a => {
    if (a.includes('DELETED')) return '#DC2626';
    if (a.includes('CREATED')||a.includes('ADDED')||a.includes('POSTED')) return '#059669';
    if (a.includes('UPDATED')||a.includes('OPEN')||a.includes('CLOSE')) return '#D97706';
    return '#6366F1';
  };

  return (
    <div className="content-section">
      <div style={{marginBottom:20}}>
        <h1 style={{fontSize:20,fontWeight:800,color:'var(--ink)',marginBottom:3}}>Audit Trail</h1>
        <p style={{fontSize:12,color:'var(--muted)'}}>Complete history of all GL actions · Who did what and when</p>
      </div>

      <div className="card">
        <div className="card-hd">
          <div className="card-hd-left">
            <Ico d={I.audit} size={14} color="var(--blue2)"/>
            <div><div className="card-hd-title">Activity Log</div><div className="card-hd-sub">Last {auditLog.length} entries</div></div>
          </div>
        </div>
        <div style={{padding:'8px 18px'}}>
          {dataLoading ? <div style={{padding:40,textAlign:'center',color:'var(--muted)'}}>Loading…</div> :
            auditLog.length===0 ? (
              <div style={{padding:'48px',textAlign:'center',color:'var(--muted)'}}>
                <Ico d={I.audit} size={32} color="#CBD5E1"/><br/>
                <p style={{marginTop:12,fontWeight:600}}>No audit entries yet.</p>
              </div>
            ) : auditLog.map((a,i) => (
              <div key={a.id||i} className="audit-row">
                <div className="audit-dot" style={{background:actionColor(a.action||'')}}/>
                <div style={{flex:1}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
                    <div>
                      <span style={{fontFamily:'IBM Plex Mono',fontSize:10,fontWeight:700,color:actionColor(a.action||''),background:actionColor(a.action||'')+'15',padding:'2px 8px',borderRadius:4}}>{a.action}</span>
                      <span style={{marginLeft:10,fontSize:12,color:'var(--ink3)'}}>{a.details}</span>
                    </div>
                    <span style={{fontSize:10,color:'var(--muted)',flexShrink:0}}>
                      {a.ts?.toDate?.()?.toLocaleString('en-PH')||'—'}
                    </span>
                  </div>
                  <div style={{fontSize:10,color:'var(--muted)',marginTop:4}}>By: <strong style={{color:'var(--ink3)'}}>{a.by}</strong></div>
                </div>
              </div>
            ))
          }
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// TAB: SETTINGS / CONFIGURATION
// ══════════════════════════════════════════════════════════════════════════════
function SettingsTab({ periods, db, user, toast, reload, addAudit }) {
  const [autoYear,  setAutoYear]  = useState(new Date().getFullYear().toString());
  const [generating,setGenerating]= useState(false);
  const [defaultRT, setDefaultRT] = useState('Corporate');

  const autoGenerate = async () => {
    const yr = parseInt(autoYear);
    if (isNaN(yr)||yr<2000||yr>2100) { toast('Enter a valid year (2000–2100).','err'); return; }
    if (!window.confirm(`Auto-generate 12 monthly periods for ${yr}?`)) return;
    setGenerating(true);
    try {
      const batch = db.current.batch();
      MONTHS.forEach((m,i) => {
        const mn = String(i+1).padStart(2,'0');
        const start = `${yr}-${mn}-01`;
        const endDay = new Date(yr,i+1,0).getDate();
        const end = `${yr}-${mn}-${String(endDay).padStart(2,'0')}`;
        const exists = periods.find(p => p.startDate===start && p.endDate===end);
        if (!exists) {
          const ref = db.current.collection('glPeriods').doc();
          batch.set(ref, {
            periodName:`${m}-${yr}`, fiscalYear:String(yr),
            startDate:start, endDate:end, status:'Future', entryType:'Any',
            adminId:user.uid, companyName:user.companyName||'',
            createdAt:firebase.firestore.FieldValue.serverTimestamp(),
            createdBy:user.name||user.email,
          });
        }
      });
      await batch.commit();
      await addAudit('AUTO_GENERATE_PERIODS',`12 periods generated for FY ${yr}`);
      toast(`12 periods generated for ${yr}.`);
      await reload();
    } catch(e) { toast('Error: '+e.message,'err'); }
    setGenerating(false);
  };

  const seedSampleRates = async () => {
    if (!window.confirm('Seed sample USD→PHP rates for all of 2026?')) return;
    try {
      const batch = db.current.batch();
      const baseRate = 56.25;
      let d = new Date('2026-01-01');
      let count = 0;
      while (d <= new Date('2026-12-31') && count < 365) {
        const dateStr = d.toISOString().split('T')[0];
        const corpRate = (baseRate + (Math.random()-0.5)*2).toFixed(4);
        const spotRate = (parseFloat(corpRate) + (Math.random()-0.5)*0.5).toFixed(4);
        const ref1 = db.current.collection('glDailyRates').doc();
        batch.set(ref1, { fromCurrency:'USD',toCurrency:'PHP',date:dateStr,rateType:'Corporate',rate:parseFloat(corpRate),adminId:user.uid,companyName:user.companyName||'',createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:'System Seed' });
        const ref2 = db.current.collection('glDailyRates').doc();
        batch.set(ref2, { fromCurrency:'USD',toCurrency:'PHP',date:dateStr,rateType:'Spot',rate:parseFloat(spotRate),adminId:user.uid,companyName:user.companyName||'',createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:'System Seed' });
        d.setDate(d.getDate()+1); count++;
        if (count%499===0) { await batch.commit(); }
      }
      await batch.commit();
      await addAudit('SEED_RATES','Sample USD/PHP rates seeded for 2026');
      toast('Sample USD/PHP rates seeded for 2026.'); await reload();
    } catch(e) { toast('Error: '+e.message,'err'); }
  };

  return (
    <div className="content-section">
      <div style={{marginBottom:20}}>
        <h1 style={{fontSize:20,fontWeight:800,color:'var(--ink)',marginBottom:3}}>Configuration</h1>
        <p style={{fontSize:12,color:'var(--muted)'}}>Auto-generate periods · Seed sample data · Default settings</p>
      </div>

      {/* Auto-generate Periods */}
      <div className="card" style={{marginBottom:16}}>
        <div className="card-hd">
          <div className="card-hd-left">
            <Ico d={I.calendar} size={14} color="var(--blue2)"/>
            <div><div className="card-hd-title">Auto-Generate Monthly Periods</div><div className="card-hd-sub">Creates Jan–Dec for a full fiscal year</div></div>
          </div>
        </div>
        <div className="card-body">
          <div style={{display:'flex',gap:12,alignItems:'flex-end'}}>
            <div style={{flex:'0 0 160px'}}>
              <label className="label">Fiscal Year</label>
              <input className="input" type="number" value={autoYear} onChange={e=>setAutoYear(e.target.value)} min="2020" max="2040"/>
            </div>
            <button className="btn btn-primary" onClick={autoGenerate} disabled={generating}>
              {generating?<><span className="spinner"/> Generating…</>:<><Ico d={I.flash} size={12} color="#fff"/> Generate 12 Periods</>}
            </button>
          </div>
          <p style={{fontSize:11,color:'var(--muted)',marginTop:10}}>Existing periods will be skipped. Only missing months will be created.</p>
        </div>
      </div>

      {/* Seed Sample Rates */}
      <div className="card" style={{marginBottom:16}}>
        <div className="card-hd">
          <div className="card-hd-left">
            <Ico d={I.fx} size={14} color="var(--green)"/>
            <div><div className="card-hd-title">Seed Sample Exchange Rates</div><div className="card-hd-sub">Populate USD→PHP Corporate + Spot rates for 2026</div></div>
          </div>
        </div>
        <div className="card-body">
          <div className="alert alert-info" style={{marginBottom:14}}>
            <Ico d={I.info} size={14} color="var(--blue2)"/>
            <span>This seeds ~365 Corporate and ~365 Spot daily rates for USD/PHP in 2026 (base ≈ ₱56.25, ±1 variance). Use this to test the invoice entry workflow.</span>
          </div>
          <button className="btn btn-green" onClick={seedSampleRates}>
            <Ico d={I.plus} size={12}/> Seed USD/PHP 2026 Rates
          </button>
        </div>
      </div>

      {/* Default Settings */}
      <div className="card">
        <div className="card-hd">
          <div className="card-hd-left">
            <Ico d={I.cog} size={14} color="var(--purple)"/>
            <div><div className="card-hd-title">Default GL Settings</div><div className="card-hd-sub">Configure default rate type and posting rules</div></div>
          </div>
        </div>
        <div className="card-body">
          <div style={{maxWidth:360}}>
            <div className="fg">
              <label className="label">Default Rate Type</label>
              <select className="select" value={defaultRT} onChange={e=>setDefaultRT(e.target.value)}>
                {RATE_TYPES.map(t=><option key={t} value={t}>{t}</option>)}
              </select>
              <p style={{fontSize:11,color:'var(--muted)',marginTop:6}}>When fetching rates for GL Date, Corporate is checked first, then falls back to Spot.</p>
            </div>
            <div className="fg">
              <label className="label">Functional Currency</label>
              <div className="fx-box">
                <span style={{fontWeight:700,fontFamily:'IBM Plex Mono',fontSize:14}}>PHP — Philippine Peso (₱)</span>
                <span style={{fontSize:10,color:'var(--muted)'}}>Locked</span>
              </div>
            </div>
            <div className="fg">
              <label className="label">Allow Manual Rate Override</label>
              <div style={{display:'flex',alignItems:'center',gap:10,marginTop:4}}>
                <div style={{width:40,height:22,borderRadius:11,background:'var(--green)',display:'flex',alignItems:'center',padding:'2px 3px',cursor:'pointer'}}>
                  <div style={{width:16,height:16,borderRadius:'50%',background:'#fff',marginLeft:'auto'}}/>
                </div>
                <span style={{fontSize:11,color:'var(--muted)'}}>Enabled (with warning)</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Render ────────────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AccountingSetupApp/>);
</script>
</body>
