const generateInvoicePDF = async (order) => {
  try {
    const db = firebase.firestore();

    // Load the LATEST layout config from Firestore
    console.log('Loading latest layout config...');
    const layoutDoc = await db.collection('invoiceLayoutConfigs').doc(user.uid).get();
    
    let currentLayout;
    if (layoutDoc.exists) {
      currentLayout = layoutDoc.data();
      console.log('✅ Loaded layout from Firestore:', currentLayout);
    } else {
      // Use default if not found
      currentLayout = {
        sections: {
          header: { visible: true, order: 1 },
          companyInfo: { visible: true, order: 2, columns: 2 },
          itemsTable: { visible: true, order: 3 },
          totals: { visible: true, order: 4, position: 'right' },
          paymentMethod: { visible: true, order: 5 },
          terms: { visible: true, order: 6 },
          signature: { visible: true, order: 7, columns: 2 },
          footer: { visible: true, order: 8 }
        },
        styling: {
          primaryColor: '#050C9C',
          secondaryColor: '#3B82F6',
          fontFamily: 'Arial',
          fontSize: 10,
          headerSize: 24
        },
        logoUrl: '',
        logoPosition: 'top'
      };
      console.log('⚠️ Using default layout');
    }

    // Check if invoice already exists
    if (order.invoiceData && order.invoiceData.terms_and_conditions !== undefined && order.invoiceData.signature_url !== undefined) {
      console.log('Using saved invoice data');
      const invoiceHTML = generateInvoiceHTML(order.invoiceData, currentLayout);
      const printWindow = window.open('', '_blank');
      printWindow.document.write(invoiceHTML);
      printWindow.document.close();
      printWindow.focus();
      setTimeout(() => printWindow.print(), 500);
      return;
    } else if (order.invoiceData) {
      console.log('⚠️ Invoice data exists but missing terms/signature - regenerating...');
    }
    
    // Load latest invoice settings from Firestore
    console.log('Loading invoice settings for user:', user.uid);
    const settingsDoc = await db.collection('invoiceSettings').doc(user.uid).get();

    if (!settingsDoc.exists) {
      console.error('No invoice settings document found');
      alert('Please configure invoice settings first in Reports > Invoice Template Manager');
      return;
    }

    const settings = settingsDoc.data();
    console.log('✅ Full settings object:', settings);

    // Validate required fields
    if (!settings || !settings.companyName || !settings.companyTIN || !settings.companyAddress) {
      console.error('Invoice settings incomplete:', settings);
      alert('Please complete all company information in Invoice Settings.');
      return;
    }

    console.log('✅ All invoice settings validated');
    
    const vatPercent = parseFloat(settings.defaultVAT || '12');
    const vatDecimal = vatPercent / 100;
    
    // Create invoice data
    const invoiceData = {
      invoice_number: order.orderNumber,
      invoice_date: order.createdAt?.toDate().toLocaleDateString() || new Date().toLocaleDateString(),
      seller_name: settings.companyName,
      seller_tin: settings.companyTIN,
      seller_address: settings.companyAddress,
      buyer_name: order.customerName,
      buyer_tin: 'N/A',
      buyer_address: order.deliveryAddress,
      payment_method: order.paymentMethod || 'N/A',
items: order.items.map((item) => ({
        description: item.name,
        qty: item.quantity,
        unit: item.unit,
        price: item.price.toFixed(2),
        total: item.subtotal.toFixed(2),
        needByDate: item.needByDate || null
      })),
      subtotal: order.totalAmount.toFixed(2),
      vat_percentage: vatPercent.toFixed(0),
      tax: (order.totalAmount * vatDecimal).toFixed(2),
      grand_total: (order.totalAmount * (1 + vatDecimal)).toFixed(2),
      terms_and_conditions: settings.termsAndConditions || '',
      special_instructions: order.notes || '',
      signature_url: settings.signatureUrl || '',
      signed_by: settings.signedBy || '',
      generated_at: new Date().toISOString()
    };

    console.log('Invoice data created:', invoiceData);

    // Save invoice data to order
    await db.collection('orders').doc(order.id).update({
      invoiceData: invoiceData,
      invoiceGeneratedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    
    console.log('Invoice data saved to order');

    // Generate and open invoice HTML with CURRENT layout config
    const invoiceHTML = generateInvoiceHTML(invoiceData, currentLayout);
    
    const printWindow = window.open('', '_blank');
    printWindow.document.write(invoiceHTML);
    printWindow.document.close();
    printWindow.focus();
    
    setTimeout(() => {
      printWindow.print();
    }, 500);
    
    await loadDashboardData(user.uid, userRole, db);
    
  } catch (error) {
    console.error('Error generating invoice:', error);
    alert('Error generating invoice: ' + error.message);
  }
};

const generateInvoiceHTML = (data, layoutConfig = null) => {
  // Get layout config or use defaults
const layout = layoutConfig || invoiceLayoutConfig || {
sections: {
  header: { visible: true, order: 1 },
  companyInfo: { visible: true, order: 2, columns: 2 },
  itemsTable: { visible: true, order: 3 },
  totals: { visible: true, order: 4, position: 'right' },
  paymentMethod: { visible: true, order: 5 },
  terms: { visible: true, order: 6 },
signature: { visible: true, order: 7, columns: 2 },
          specialInstructions: { visible: true, order: 8 },
          footer: { visible: true, order: 9 }
},

    styling: {
      primaryColor: '#050C9C',
      secondaryColor: '#3B82F6',
      fontFamily: 'Arial',
      fontSize: 10,
      headerSize: 24
    },
    logoUrl: ''
  };

  const primaryColor = layout.styling.primaryColor;
  const secondaryColor = layout.styling.secondaryColor;
  const fontFamily = layout.styling.fontFamily;
  const fontSize = layout.styling.fontSize;
  const headerSize = layout.styling.headerSize;

// Create sections array with order
const sections = Object.entries(layout.sections)
  .filter(([key, section]) => section.visible)
  .sort((a, b) => a[1].order - b[1].order)
  .map(([key]) => key);

// Build section HTML dynamically
const buildSectionHTML = (sectionKey) => {
  switch(sectionKey) {
case 'header': {
        const logoPosition = layout.logoPosition || 'top';
        const isLogoLeft = logoPosition === 'left' && layout.logoUrl;
        const hSec = layout.sections.header || {};
        const hColor = hSec.color || primaryColor;
        const hSize = hSec.fontSize || headerSize;
        const hWeight = hSec.fontWeight || 'bold';
        
        return `
          <div style="margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid ${hColor}; ${(isLogoLeft && layout.logoUrl) ? 'display: flex; align-items: center; gap: 20px;' : 'text-align: center;'}">
            ${layout.logoUrl && logoPosition === 'top' ? `
              <div style="margin-bottom: 10px; text-align: center;">

              </div>
            ` : ''}
            
            ${layout.logoUrl && logoPosition === 'left' ? `
              <div style="flex-shrink: 0;">
                <img src="${layout.logoUrl}" alt="Logo" style="height: 48px; max-width: 120px; object-fit: contain;" />

            ` : ''}
            
            <div style="${isLogoLeft ? 'flex: 1;' : ''}">

}

case 'companyInfo': {

case 'itemsTable': {

            // ── Order Review full-page overlay ─────────────────────────────
            const handleOrderApprove = async (order) => {
              try {
                const db = firebase.firestore();
                const currentStepIndex = order.orderApprovalStepIndex || 0;

                // Record this step's approval in history
                const historyEntry = {
                  action: 'approved',
                  by: user.uid,
                  byName: user.displayName || user.email,
                  at: new Date().toISOString(),
                  step: currentStepIndex
                };

                // ── Fetch the approval group to check for more steps ──
                let nextStep = null;
                let totalSteps = order.orderApprovalTotalSteps || 1;

                if (order.orderApprovalGroupId) {
                  try {
                    const agDoc = await db.collection('approvalGroups').doc(order.orderApprovalGroupId).get();
                    if (agDoc.exists) {
                      const agData = agDoc.data();
                      const steps = agData.steps || [];
                      totalSteps = steps.length;
                      const nextIndex = currentStepIndex + 1;
                      if (nextIndex < steps.length) {
                        nextStep = { ...steps[nextIndex], index: nextIndex };
                      }
                    }
                  } catch(e) { console.warn('Could not load approval group steps:', e); }
                }

                if (nextStep) {
                  // ── More steps remain — advance to next approver ──
                  const updateData = {
                    orderApprovalStepIndex: nextStep.index,
                    orderApprovalTotalSteps: totalSteps,
                    assignedApproverId:   nextStep.approverAdminId || null,
                    assignedApproverRole: nextStep.approverRole    || null,
                    assignedApproverName: nextStep.approverName    || null,
                    orderApprovalStatus:  'pending_approval',
                    // keep status as pending_approval — still in approval chain
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    orderApprovalHistory: firebase.firestore.FieldValue.arrayUnion(historyEntry)
                  };
                  await db.collection('orders').doc(order.id).update(updateData);

                  // ── Notify the next approver ──
                  try {
                    const nb = db.batch();
                    if (nextStep.approverAdminId) {
                      // Specific approver assigned
                      nb.set(db.collection('notifications').doc(), {
                        type: 'order-approval-request',
                        message: `Order ${order.orderNumber} from ${order.customerName} requires your approval (Step ${nextStep.index + 1} of ${totalSteps})`,
                        details: {
                          orderNumber: order.orderNumber,
                          customerName: order.customerName,
                          totalAmount: order.totalAmount,
                          status: 'pending_approval',
                          step: nextStep.index + 1,
                          totalSteps,
                          orderId: order.id
                        },
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        read: false,
                        userId: nextStep.approverAdminId,
                        userRole: 'admin'
                      });
                    } else {
                      // Role-based — notify all admins with matching role
                      const admSnap = await db.collection('users').where('role', '==', 'admin').get();
                      admSnap.docs.forEach(a => {
                        // Skip the current approver and the original issuer
                        if (a.id === user.uid) return;
                        if (a.id === order.customerId || a.id === order.userId) return;
                        const matchesRole = !nextStep.approverRole ||
                          a.data().assignedRoleName === nextStep.approverRole;
                        if (matchesRole) {
                          nb.set(db.collection('notifications').doc(), {
                            type: 'order-approval-request',
                            message: `Order ${order.orderNumber} from ${order.customerName} requires approval (Step ${nextStep.index + 1} of ${totalSteps})`,
                            details: {
                              orderNumber: order.orderNumber,
                              customerName: order.customerName,
                              totalAmount: order.totalAmount,
                              status: 'pending_approval',
                              step: nextStep.index + 1,
                              totalSteps,
                              orderId: order.id
                            },
                            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                            read: false,
                            userId: a.id,
                            userRole: 'admin'
                          });
                        }
                      });
                    }
                    // Also notify the customer that their order is progressing through approval
                    nb.set(db.collection('notifications').doc(), {
                      type: 'order-approval-progress',
                      message: `Your order ${order.orderNumber} has passed step ${currentStepIndex + 1} of ${totalSteps} approvals`,
                      details: { orderNumber: order.orderNumber, step: currentStepIndex + 1, totalSteps },
                      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                      read: false,
                      userId: order.customerId || order.userId,
                      userRole: 'user'
                    });
                    await nb.commit();
                  } catch(e) { console.warn('Notification error (non-fatal):', e); }

                } else {
                  // ── All steps approved — release order into admin pipeline ──
                  await db.collection('orders').doc(order.id).update({
                    status: 'pending',
                    orderApprovalStatus: 'approved',
                    orderApprovalStepIndex: totalSteps - 1,
                    approvedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    approvedBy: user.uid,
                    approvedByName: user.displayName || user.email,
                    processedBy: user.uid,
                    processedByName: user.displayName || user.email,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    orderApprovalHistory: firebase.firestore.FieldValue.arrayUnion(historyEntry)
                  });
                  // Notify customer — fully approved
                  try {
                    await db.collection('notifications').add({
                      type: 'order-approved',
                      message: `Your order ${order.orderNumber} has been fully approved and is now being processed`,
                      details: { orderNumber: order.orderNumber, status: 'approved' },
                      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                      read: false,
                      userId: order.customerId || order.userId,
                      userRole: 'user'
                    });
                  } catch(e) { console.warn(e); }
                }

                await loadDashboardData(user.uid, userRole, db);
                setActiveOrderReview(null);
              } catch(e) { alert('Error approving order: ' + e.message); }
            };

            const handleOrderReject = async (order, reason) => {
              try {
                const db = firebase.firestore();
                const historyEntry = {
                  action:'rejected', by:user.uid, byName:user.displayName||user.email,
                  at:new Date().toISOString(), step:order.orderApprovalStepIndex||0, reason
                };
                await db.collection('orders').doc(order.id).update({
                  status:'cancelled',
                  orderApprovalStatus:'rejected',
                  rejectedAt:firebase.firestore.FieldValue.serverTimestamp(),
                  rejectedBy:user.uid,
                  rejectedByName:user.displayName||user.email,
                  rejectionReason:reason,
                  cancelledAt:firebase.firestore.FieldValue.serverTimestamp(),
                  updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
                  orderApprovalHistory:firebase.firestore.FieldValue.arrayUnion(historyEntry)
                });
                // Notify customer
                try {
                  await db.collection('notifications').add({
                    type:'order-rejected',
                    message:`Your order ${order.orderNumber} was not approved`,
                    details:{orderNumber:order.orderNumber,status:'rejected',reason},
                    timestamp:firebase.firestore.FieldValue.serverTimestamp(),
                    read:false, userId:order.customerId||order.userId, userRole:'user'
                  });
                } catch(e){ console.warn(e); }
                await loadDashboardData(user.uid, userRole, db);
                setActiveOrderReview(null);
              } catch(e){ alert('Error rejecting order: '+e.message); }
            };

            // If an order is open for review, show full-page review
            if (activeOrderReview) {
              const oQueueIdx = pendingOrderQueue.findIndex(o => o.id === activeOrderReview.id);
              const oHasNext  = oQueueIdx >= 0 && oQueueIdx < pendingOrderQueue.length - 1;
              const oHasPrev  = oQueueIdx > 0;
              const oQueueLen = pendingOrderQueue.length;
              return (
                <div>
                  {/* Queue navigation bar — only shown when coming from the banner */}
                  {oQueueLen > 1 && (
                    <div style={{background:'#1E293B',padding:'10px 24px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
                      <div style={{display:'flex',alignItems:'center',gap:10}}>
                        <span style={{fontSize:12,fontWeight:700,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'.06em'}}>
                          Approval Queue
                        </span>
                        <span style={{background:'#7C3AED',color:'#fff',fontSize:11,fontWeight:800,padding:'2px 10px',borderRadius:20}}>
                          {oQueueIdx + 1} of {oQueueLen}
                        </span>
                        <span style={{fontSize:12,color:'#64748B'}}>·</span>
                        <span style={{fontSize:12,color:'#94A3B8'}}>
                          {oQueueLen - oQueueIdx - 1} remaining after this
                        </span>
                      </div>
                      <div style={{display:'flex',gap:6}}>
                        <button
                          disabled={!oHasPrev}
                          onClick={()=>{ const prev = orders.find(o=>o.id===pendingOrderQueue[oQueueIdx-1].id)||pendingOrderQueue[oQueueIdx-1]; setActiveOrderReview(prev); }}
                          style={{padding:'5px 14px',background:oHasPrev?'#334155':'#1E293B',border:`1px solid ${oHasPrev?'#475569':'#334155'}`,borderRadius:7,fontSize:12,fontWeight:600,color:oHasPrev?'#E2E8F0':'#475569',cursor:oHasPrev?'pointer':'not-allowed',display:'flex',alignItems:'center',gap:5}}
                        >
                          <svg width="12" height="12" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7"/></svg>
                          Prev
                        </button>
                        <button
                          disabled={!oHasNext}
                          onClick={()=>{ const next = orders.find(o=>o.id===pendingOrderQueue[oQueueIdx+1].id)||pendingOrderQueue[oQueueIdx+1]; setActiveOrderReview(next); }}
                          style={{padding:'5px 14px',background:oHasNext?'#334155':'#1E293B',border:`1px solid ${oHasNext?'#475569':'#334155'}`,borderRadius:7,fontSize:12,fontWeight:600,color:oHasNext?'#E2E8F0':'#475569',cursor:oHasNext?'pointer':'not-allowed',display:'flex',alignItems:'center',gap:5}}
                        >
                          Next
                          <svg width="12" height="12" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7"/></svg>
                        </button>
                        <button
                          onClick={()=>{ setActiveOrderReview(null); setPendingOrderQueue([]); }}
                          style={{padding:'5px 14px',background:'#0F172A',border:'1px solid #334155',borderRadius:7,fontSize:12,fontWeight:600,color:'#94A3B8',cursor:'pointer'}}
                        >
                          Exit Queue
                        </button>
                      </div>
                    </div>
                  )}
                  <OrderReviewPage
                    order={activeOrderReview}
                    user={user}
                    onBack={()=>{ setActiveOrderReview(null); setPendingOrderQueue([]); }}
                    onApprove={async (order) => {
                      await handleOrderApprove(order);
                      if (oHasNext) {
                        const next = orders.find(o=>o.id===pendingOrderQueue[oQueueIdx+1].id)||pendingOrderQueue[oQueueIdx+1];
                        setActiveOrderReview(next);
                      } else {
                        setActiveOrderReview(null);
                        setPendingOrderQueue([]);
                      }
                    }}
                    onReject={async (order, reason) => {
                      await handleOrderReject(order, reason);
                      if (oHasNext) {
                        const next = orders.find(o=>o.id===pendingOrderQueue[oQueueIdx+1].id)||pendingOrderQueue[oQueueIdx+1];
                        setActiveOrderReview(next);
                      } else {
                        setActiveOrderReview(null);
                        setPendingOrderQueue([]);
                      }
                    }}
                  />
                </div>
              );
            }

            // ── PO Review full-page (from worklist or approval banner) ──────
            if (activePOReview) {
              const queueIdx = pendingApprovalQueue.findIndex(p => p.id === activePOReview.id);
              const hasNext  = queueIdx >= 0 && queueIdx < pendingApprovalQueue.length - 1;
              const hasPrev  = queueIdx > 0;
              const queueLen = pendingApprovalQueue.length;
              return (
                <div>
                  {/* Queue navigation bar — only shown when coming from the banner */}
                  {queueLen > 1 && (
                    <div style={{background:'#1E293B',padding:'10px 24px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
                      <div style={{display:'flex',alignItems:'center',gap:10}}>
                        <span style={{fontSize:12,fontWeight:700,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'.06em'}}>
                          Approval Queue
                        </span>
                        <span style={{background:'#DC2626',color:'#fff',fontSize:11,fontWeight:800,padding:'2px 10px',borderRadius:20}}>
                          {queueIdx + 1} of {queueLen}
                        </span>
                        <span style={{fontSize:12,color:'#64748B'}}>·</span>
                        <span style={{fontSize:12,color:'#94A3B8'}}>
                          {queueLen - queueIdx - 1} remaining after this
                        </span>
                      </div>
                      <div style={{display:'flex',gap:6}}>
                        <button
                          disabled={!hasPrev}
                          onClick={()=>{ const prev = purchaseOrders.find(p=>p.id===pendingApprovalQueue[queueIdx-1].id)||pendingApprovalQueue[queueIdx-1]; setActivePOReview(prev); }}
                          style={{padding:'5px 14px',background:hasPrev?'#334155':'#1E293B',border:`1px solid ${hasPrev?'#475569':'#334155'}`,borderRadius:7,fontSize:12,fontWeight:600,color:hasPrev?'#E2E8F0':'#475569',cursor:hasPrev?'pointer':'not-allowed',display:'flex',alignItems:'center',gap:5}}
                        >
                          <svg width="12" height="12" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7"/></svg>
                          Prev
                        </button>
                        <button
                          disabled={!hasNext}
                          onClick={()=>{ const next = purchaseOrders.find(p=>p.id===pendingApprovalQueue[queueIdx+1].id)||pendingApprovalQueue[queueIdx+1]; setActivePOReview(next); }}
                          style={{padding:'5px 14px',background:hasNext?'#334155':'#1E293B',border:`1px solid ${hasNext?'#475569':'#334155'}`,borderRadius:7,fontSize:12,fontWeight:600,color:hasNext?'#E2E8F0':'#475569',cursor:hasNext?'pointer':'not-allowed',display:'flex',alignItems:'center',gap:5}}
                        >
                          Next
                          <svg width="12" height="12" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7"/></svg>
                        </button>
                        <button
                          onClick={()=>{ setActivePOReview(null); setPendingApprovalQueue([]); }}
                          style={{padding:'5px 14px',background:'#0F172A',border:'1px solid #334155',borderRadius:7,fontSize:12,fontWeight:600,color:'#94A3B8',cursor:'pointer'}}
                        >
                          Exit Queue
                        </button>
                      </div>
                    </div>
                  )}
                  <POReviewPage
                    po={activePOReview}
                    user={user}
                    purchaseOrders={purchaseOrders}
                    onBack={()=>{ setActivePOReview(null); setPendingApprovalQueue([]); }}
                    approvePO={async (id, silent) => {
                      await approvePO(id, silent);
                      // Auto-advance to next in queue after approve
                      if (hasNext) {
                        const next = purchaseOrders.find(p=>p.id===pendingApprovalQueue[queueIdx+1].id)||pendingApprovalQueue[queueIdx+1];
                        setActivePOReview(next);
                      } else {
                        setActivePOReview(null);
                        setPendingApprovalQueue([]);
                      }
                    }}
                    denyPO={async (id, reason, silent) => {
                      await denyPO(id, reason, silent);
                      if (hasNext) {
                        const next = purchaseOrders.find(p=>p.id===pendingApprovalQueue[queueIdx+1].id)||pendingApprovalQueue[queueIdx+1];
                        setActivePOReview(next);
                      } else {
                        setActivePOReview(null);
                        setPendingApprovalQueue([]);
                      }
                    }}
                    sendRFI={async (id, msg, silent) => {
                      await sendRFI(id, msg, silent);
                      if (hasNext) {
                        const next = purchaseOrders.find(p=>p.id===pendingApprovalQueue[queueIdx+1].id)||pendingApprovalQueue[queueIdx+1];
                        setActivePOReview(next);
                      } else {
                        setActivePOReview(null);
                        setPendingApprovalQueue([]);
                      }
                    }}
                    submitRFIReply={submitRFIReply}
                    updatePOStatus={updatePOStatus}
                    setWithdrawPOTarget={setWithdrawPOTarget}
                    setWithdrawReason={setWithdrawReason}
                    setShowWithdrawModal={setShowWithdrawModal}
                    setPOToRevise={setPOToRevise}
                    setRevisionNotes={setRevisionNotes}
                    setShowRevisionModal={setShowRevisionModal}
                    generatePOPDF={generatePOPDF}
                    getCurrencySymbol={getCurrencySymbol}
                    rfiReplyText={rfiReplyText}
                    setRfiReplyText={setRfiReplyText}
                    submittingRFIReply={submittingRFIReply}

                  />
                </div>
              );
            }

            // ── Dashboard computed values ────────────────────────────────
            // MY OWN orders only (revenue, chart, pending orders)
            const totalRevenue = orders.filter(o => o.status !== 'cancelled').reduce((s, o) => s + (o.totalAmount || 0), 0);
            // COMPANY-WIDE inventory (products already loaded company-wide)
            const inventoryValue = products.reduce((s, p) => s + (p.price || 0) * (p.stock || 0), 0);
            // Company-wide out-of-stock and low-stock counts
            const companyOutOfStock = products.filter(p => p.stock === 0).length;
            const companyLowStock   = products.filter(p => p.stock > 0 && p.stock <= p.threshold).length;
            const pendingCancelReqs = (() => {
              try {
                // We re-use the CancellationRequestsList counts via purchaseOrders PO approval queue
                return 0; // will be shown via approval banner below
              } catch(e) { return 0; }
            })();
            const submittedPOs = purchaseOrders.filter(p => p.status === 'submitted').length;

            // 7-day revenue bar chart data
            const sevenDays = Array.from({ length: 7 }, (_, i) => {
              const d = new Date(); d.setDate(d.getDate() - (6 - i)); d.setHours(0, 0, 0, 0); return d;
            });
            const chartData = sevenDays.map(day => {
              const next = new Date(day); next.setDate(next.getDate() + 1);
              const val = orders.filter(o => {
                const d = o.createdAt?.toDate?.();
                return d && d >= day && d < next && o.status !== 'cancelled';
              }).reduce((s, o) => s + (o.totalAmount || 0), 0);
              return { label: day.toLocaleDateString('en', { weekday: 'short' }), val };
            });
            const maxVal = Math.max(...chartData.map(d => d.val), 1);

            const { total: todayPhp, hasUnknownRate: todayUnknown } = getTodaySalesInPhp();

            // POs I submitted and are waiting on someone else's approval (I am NOT the approver)
            const mySubmittedPendingApproval = purchaseOrders.filter(p =>
              p.createdBy === user?.uid &&
              p.createdBy !== p.assignedApproverId &&   // never self-approve
              p.status === 'submitted' &&
              p.approvalStatus === 'pending_approval'
            );
            // POs assigned TO ME for approval — where I am NOT the creator
            const pendingMyApproval = purchaseOrders.filter(p =>
              p.assignedApproverId === user?.uid &&
              p.createdBy !== user?.uid &&              // never self-approve
              (p.approvalStatus === 'pending_approval' || p._pendingMyApproval === true)
            );
            // POs with no approval group configured (no routing at all) — only my own
            const mySubmittedNoRouting = purchaseOrders.filter(p =>
              p.createdBy === user?.uid &&
              p.status === 'submitted' &&
              (!p.approvalStatus || p.approvalStatus === 'no_approval_required')
            );

            // (approvalItems removed — banner now opens bulk panel directly)

            // Sales Orders assigned TO ME for approval
            const pendingMyOrderApproval = orders.filter(o =>
              o.status === 'pending_approval' &&
              o.customerId !== user?.uid &&
              o.userId !== user?.uid &&
              (o.assignedApproverId === user?.uid || !o.assignedApproverId)
            );

            return (
            <div className="space-y-5">

              {/* ── Approval Banner ── */}
              {(pendingMyApproval.length > 0 || mySubmittedPendingApproval.length > 0 || pendingMyOrderApproval.length > 0) && (
                <div style={{display:'flex',flexDirection:'column',gap:8}}>

                  {/* POs assigned to ME for approval — urgent red banner */}
                  {pendingMyApproval.length > 0 && (
                    <div
                      onClick={() => { setPendingApprovalQueue(pendingMyApproval); setActivePOReview(purchaseOrders.find(p=>p.id===pendingMyApproval[0].id)||pendingMyApproval[0]); }}
                      style={{background:'linear-gradient(135deg,#7F1D1D,#DC2626)',cursor:'pointer',borderRadius:12,padding:'13px 20px',display:'flex',alignItems:'center',gap:14,border:'1px solid rgba(255,255,255,.08)'}}
                      className="hover:opacity-90 transition-opacity"
                    >
                      <div style={{width:36,height:36,background:'rgba(255,255,255,.15)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                        <svg className="w-5 h-5" style={{color:'#FCA5A5'}} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                        </svg>
                      </div>
                      <div style={{flex:1}}>
                        <p style={{color:'#FEE2E2',fontWeight:700,fontSize:13}}>🔴 {pendingMyApproval.length} Purchase Order{pendingMyApproval.length>1?'s':''} require your approval</p>
                        <p style={{color:'#FCA5A5',fontSize:12,marginTop:2}}>These POs were submitted by other admins and are routed to you for review — click to review all</p>
                      </div>
                      <svg className="w-4 h-4" style={{color:'#FCA5A5',flexShrink:0}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 18l6-6-6-6"/></svg>
                    </div>
                  )}

                  {/* Sales Orders assigned to ME for approval — purple banner */}
                  {pendingMyOrderApproval.length > 0 && (
                    <div
                      onClick={() => { setPendingOrderQueue(pendingMyOrderApproval); setActiveOrderReview(orders.find(o=>o.id===pendingMyOrderApproval[0].id)||pendingMyOrderApproval[0]); }}
                      style={{background:'linear-gradient(135deg,#3B0764,#7C3AED)',cursor:'pointer',borderRadius:12,padding:'13px 20px',display:'flex',alignItems:'center',gap:14,border:'1px solid rgba(255,255,255,.08)'}}
                      className="hover:opacity-90 transition-opacity"
                    >
                      <div style={{width:36,height:36,background:'rgba(255,255,255,.15)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                        <svg width="20" height="20" fill="none" stroke="#DDD6FE" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
                          <path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                        </svg>
                      </div>
                      <div style={{flex:1}}>
                        <p style={{color:'#EDE9FE',fontWeight:700,fontSize:13}}>🟣 {pendingMyOrderApproval.length} Sales Order{pendingMyOrderApproval.length>1?'s':''} require your approval</p>
                        <p style={{color:'#C4B5FD',fontSize:12,marginTop:2}}>
                          {pendingMyOrderApproval.length === 1
                            ? `${pendingMyOrderApproval[0].customerName||'A customer'} · ₱${(pendingMyOrderApproval[0].totalAmount||0).toLocaleString('en-PH',{minimumFractionDigits:2})} — click to review`
                            : `${pendingMyOrderApproval.map(o=>o.customerName||'Customer').slice(0,2).join(', ')}${pendingMyOrderApproval.length>2?` +${pendingMyOrderApproval.length-2} more`:''} — click to review first order`
                          }
                        </p>
                      </div>
                      <svg className="w-4 h-4" style={{color:'#C4B5FD',flexShrink:0}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 18l6-6-6-6"/></svg>
                    </div>
                  )}

                  {/* My submitted POs waiting on someone else's approval */}
                  {mySubmittedPendingApproval.length > 0 && (
                    <div
                      onClick={() => { setActiveModule('purchases'); setPOStatusFilter('submitted'); }}
                      style={{background:'linear-gradient(135deg,#1E3A5F,#1D4ED8)',cursor:'pointer',borderRadius:12,padding:'13px 20px',display:'flex',alignItems:'center',gap:14,border:'1px solid rgba(255,255,255,.08)'}}
                      className="hover:opacity-90 transition-opacity"
                    >
                      <div style={{width:36,height:36,background:'rgba(245,158,11,.15)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                        <svg className="w-5 h-5" style={{color:'#FCD34D'}} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                        </svg>
                      </div>
                      <div style={{flex:1}}>
                        <p style={{color:'#FCD34D',fontWeight:700,fontSize:13}}>{mySubmittedPendingApproval.length} PO{mySubmittedPendingApproval.length>1?'s':''} awaiting approver review</p>
                        <p style={{color:'#94A3B8',fontSize:12,marginTop:2}}>Routed to your designated approver — you will be notified once actioned</p>
                      </div>
                      <svg className="w-4 h-4" style={{color:'#FCD34D',flexShrink:0}} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 18l6-6-6-6"/>
                      </svg>
                    </div>
                  )}

                </div>
              )}

              {/* ── KPI Stat Cards Row ── */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                {/* Total Revenue */}
                <div className="group relative bg-white rounded-2xl shadow-sm p-5 border border-gray-100 overflow-hidden hover:shadow-lg hover:-translate-y-1 transition-all duration-300" style={{borderBottom:'3px solid #3B82F6'}}>
                  <p className="text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Total Revenue</p>
                  <p className="text-2xl font-black text-gray-900 stat-number">₱{totalRevenue.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}</p>
                  <p className="text-xs text-gray-400 mt-1">Today ₱{todayPhp.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}</p>
                </div>
                {/* Total Orders */}
                <div className="group relative bg-white rounded-2xl shadow-sm p-5 border border-gray-100 overflow-hidden hover:shadow-lg hover:-translate-y-1 transition-all duration-300" style={{borderBottom:'3px solid #10B981'}}>
                  <p className="text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Total Orders</p>
                  <p className="text-2xl font-black text-gray-900 stat-number">{stats.totalOrders}</p>
                  <p className="text-xs text-gray-400 mt-1">{stats.completedOrders} completed</p>
                </div>
                {/* Pending Orders */}
                <div className="group relative bg-white rounded-2xl shadow-sm p-5 border border-gray-100 overflow-hidden hover:shadow-lg hover:-translate-y-1 transition-all duration-300" style={{borderBottom:'3px solid #F59E0B'}}>
                  <p className="text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Pending Orders</p>
                  <p className="text-2xl font-black text-orange-500 stat-number">{stats.pendingOrders}</p>
                  <p className="text-xs text-gray-400 mt-1">Needs processing</p>
                </div>
                {/* Out of Stock — company-wide */}
                <div className="group relative bg-white rounded-2xl shadow-sm p-5 border border-gray-100 overflow-hidden hover:shadow-lg hover:-translate-y-1 transition-all duration-300" style={{borderBottom:'3px solid #EF4444'}}>
                  <p className="text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Out of Stock</p>
                  <p className="text-2xl font-black text-red-500 stat-number">{companyOutOfStock}</p>
                  <p className="text-xs text-gray-400 mt-1">{companyLowStock} low stock · company-wide</p>
                </div>
                {/* Inventory Value — company-wide */}
                <div className="group relative bg-white rounded-2xl shadow-sm p-5 border border-gray-100 overflow-hidden hover:shadow-lg hover:-translate-y-1 transition-all duration-300" style={{borderBottom:'3px solid #0F172A'}}>

                          width:'100%',
                          height:`${Math.max((d.val / maxVal) * 100, 4)}%`,

                          minHeight:4,
                          transition:'height .5s ease'

                      </div>

                  </div>
                </div>
                {/* Exchange Rate quick link */}

                      <span className="font-bold text-gray-800 text-base block mb-3">Exchange Rates</span>

                      {exchangeRates.JPY && <p style={{fontSize:13,color:'#374151',fontWeight:600,marginBottom:4}}>1 JPY = ₱{parseFloat(exchangeRates.JPY).toFixed(4)}</p>}

                    <button
                      onClick={() => { setExchangeRateForm({ ...exchangeRates }); setShowExchangeRateModal(true); }}
                      style={{background:'linear-gradient(135deg,#4F46E5,#7C3AED)',borderRadius:8,padding:'9px 12px',cursor:'pointer',border:'none',color:'#fff',fontSize:12,fontWeight:600,marginTop:12,width:'100%'}}

                      Update Rates
                    </button>
                  </div>
                )}
              </div>

              {/* ── Worklist Table ── */}
              <WorklistTable
                purchaseOrders={purchaseOrders}
                orders={orders}
                user={user}
                setApprovalPO={setApprovalPO}
                setIsDenyMode={setIsDenyMode}
                setDenyReason={setDenyReason}
                setShowPOApprovalModal={setShowPOApprovalModal}
                setActiveModule={setActiveModule}
                setStatusViewPO={setStatusViewPO}
                setShowPOStatusModal={setShowPOStatusModal}
                setActivePOReview={setActivePOReview}
                setActiveOrderReview={setActiveOrderReview}
                setPendingApprovalQueue={setPendingApprovalQueue}
                setPendingOrderQueue={setPendingOrderQueue}
              />

              {/* ── Recent Orders Table + Stock Alerts ── */}
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">

                {/* Recent Orders - Table style */}
                <div className="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                  <div style={{padding:'14px 18px',borderBottom:'1px solid #F1F5F9',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <span className="font-bold text-gray-800 text-base">Recent Orders</span>
                    <button
                      onClick={() => setActiveModule('orders')}
                      className="text-xs font-semibold text-blue-600 hover:text-blue-800 transition-colors bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg"
                    >
                      View all
                    </button>
                  </div>
                  <table style={{width:'100%',borderCollapse:'collapse'}}>
                    <thead>
                      <tr style={{background:'#F8FAFC'}}>
                        {['Order #','Customer','Amount','Status'].map(h => (
                          <th key={h} style={{padding:'9px 16px',textAlign:'left',fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',color:'#64748B',borderBottom:'1px solid #E2E8F0'}}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {recentOrders.length > 0 ? recentOrders.map(order => (
                        <tr key={order.id} className="hover:bg-gray-50 transition-colors">
                          <td style={{padding:'11px 16px',fontFamily:'monospace',fontWeight:700,fontSize:12,color:'#1E293B',borderBottom:'1px solid #F8FAFC'}}>{order.orderNumber}</td>
                          <td style={{padding:'11px 16px',borderBottom:'1px solid #F8FAFC'}}>
                            <div style={{fontWeight:600,fontSize:13,color:'#1E293B'}}>{order.customerName}</div>
                            <div style={{fontSize:11,color:'#94A3B8'}}>{order.customerEmail}</div>
                          </td>
                          <td style={{padding:'11px 16px',fontWeight:700,fontSize:13,color:'#1E293B',borderBottom:'1px solid #F8FAFC'}}>₱{(order.totalAmount||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
                          <td style={{padding:'11px 16px',borderBottom:'1px solid #F8FAFC'}}>
                            <span style={{
                              display:'inline-flex',alignItems:'center',padding:'3px 10px',borderRadius:20,fontSize:11,fontWeight:600,
                              background: order.status==='completed'?'#DCFCE7': order.status==='pending'?'#FEF9C3': order.status==='processing'?'#DBEAFE':'#F1F5F9',
                              color: order.status==='completed'?'#166534': order.status==='pending'?'#854D0E': order.status==='processing'?'#1E40AF':'#475569'
                            }}>
                              {order.status}
                            </span>
                          </td>
                        </tr>
                      )) : (
                        <tr><td colSpan={4} style={{padding:28,textAlign:'center',color:'#94A3B8',fontSize:13}}>No orders yet</td></tr>
                      )}
                    </tbody>
                  </table>
                </div>

                {/* Stock Alerts */}
                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
                    <span className="font-bold text-gray-800 text-base">Stock Alerts</span>
                  </div>

                  {outOfStockItems.length === 0 && lowStockItems.length === 0 ? (
                    <p style={{color:'#94A3B8',fontSize:13,textAlign:'center',padding:'16px 0'}}>All stock levels healthy ✓</p>
                  ) : (
                    <div className="space-y-2 max-h-72 overflow-y-auto">
                      {outOfStockItems.slice(0, 5).map(item => (
                        <div key={item.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 10px',background:'#FEF2F2',borderRadius:8,borderLeft:'3px solid #EF4444'}}>
                          <div>
                            <p style={{fontSize:13,fontWeight:600,color:'#1E293B'}}>{item.name}</p>
                            <p style={{fontSize:11,color:'#94A3B8'}}>{item.sku}</p>
                          </div>
                          <span style={{fontSize:10,fontWeight:700,background:'#FEE2E2',color:'#991B1B',padding:'2px 8px',borderRadius:20,flexShrink:0}}>Out</span>
                        </div>
                      ))}
                      {lowStockItems.slice(0, 5).map(item => (
                        <div key={item.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 10px',background:'#FFFBEB',borderRadius:8,borderLeft:'3px solid #F59E0B'}}>
                          <div>
                            <p style={{fontSize:13,fontWeight:600,color:'#1E293B'}}>{item.name}</p>
                            <p style={{fontSize:11,color:'#94A3B8'}}>{item.stock}/{item.threshold}</p>
                          </div>
                          <span style={{fontSize:10,fontWeight:700,background:'#FEF9C3',color:'#854D0E',padding:'2px 8px',borderRadius:20,flexShrink:0}}>Low</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

              </div>
            </div>
            );
          })()}


          {/* Inventory Module (Admin Only) */}
{/* Inventory Module (Admin Only) - TABLE VIEW */}
{activeModule === 'inventory' && userRole === 'admin' && (
  <div className="space-y-6">
    {/* Controls */}
    <div className="bg-white rounded-xl shadow-lg p-5">
      {/* Row 1: Search + Filters + Actions */}
      <div className="flex flex-wrap items-center gap-3 mb-4">
        {/* Search */}
        <div className="relative flex-1 min-w-48">
          <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" placeholder="Search by name, SKU, description…"
            value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
            className="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"/>
        </div>
        {/* Category filter */}
        <select value={categoryFilter} onChange={(e) => { setCategoryFilter(e.target.value); setCurrentPage(1); }}
          className="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none min-w-36">
          <option value="all">All Categories</option>
          {categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
        </select>
        {/* Supplier filter */}
        <select value={supplierFilter} onChange={(e) => { setSupplierFilter(e.target.value); setCurrentPage(1); }}
          className="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none min-w-40">
          <option value="all">All Suppliers</option>
          {[...new Set(products.map(p => p.supplier).filter(Boolean))].sort().map(s => (
            <option key={s} value={s}>{s}</option>
          ))}
        </select>
        {/* Items per page */}
        <div className="flex items-center gap-2">
          <span className="text-xs text-gray-500 whitespace-nowrap">Show</span>
          <select value={itemsPerPage} onChange={(e) => { setItemsPerPage(parseInt(e.target.value)); setCurrentPage(1); }}
            className="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none w-20">
            {[10,20,50,100].map(n => <option key={n} value={n}>{n}</option>)}
          </select>
          <span className="text-xs text-gray-500 whitespace-nowrap">/ page</span>
        </div>
        {/* Spacer */}
        <div className="flex-1"/>
        {/* Action buttons */}
        {selectedProducts.length === 1 && (
          <button onClick={() => loadProductInfo(selectedProducts[0])}
            className="flex items-center gap-2 bg-blue-500 text-white px-3 py-2 rounded-lg text-sm hover:bg-blue-600 transition-all">
            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Info
          </button>
        )}
        {selectedProducts.length > 0 && (
          <button onClick={() => setShowBulkDeleteProductModal(true)}
            className="flex items-center gap-2 bg-red-500 text-white px-3 py-2 rounded-lg text-sm hover:bg-red-600 transition-all">
            <Trash />{selectedProducts.length > 1 ? `Delete (${selectedProducts.length})` : 'Delete'}
          </button>
        )}
        <button onClick={() => { const db=firebase.firestore(); loadDashboardData(user.uid,userRole,db); }}
          title="Refresh" className="flex items-center gap-2 border border-gray-300 text-gray-600 px-3 py-2 rounded-lg text-sm hover:bg-gray-50 transition-all">
          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Refresh
        </button>
        <button onClick={() => { setShowAddProduct(true); resetProductForm(); setEditingProduct(null); }}
          className="flex items-center gap-2 bg-gradient-to-r from-purple-500 to-pink-500 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:shadow-lg transition-all">
          <Plus /> Add Product
        </button>
      </div>
      {/* Row 2: Stock status tabs + result count */}
      <div className="flex items-center justify-between gap-4 border-t border-gray-100 pt-3">
        <div className="flex gap-1">
          {[
            { key:'all',       label:`All (${products.length})`,                                 color:'purple' },
            { key:'in-stock',  label:`In Stock (${products.filter(p=>p.stock>p.threshold).length})`,  color:'green'  },
            { key:'low-stock', label:`Low Stock (${stats.lowStock})`,                            color:'yellow' },
            { key:'out-of-stock', label:`Out of Stock (${stats.outOfStock})`,                    color:'red'    },
          ].map(t => (
            <button key={t.key} onClick={() => { setStockFilter(t.key); setCurrentPage(1); }}
              className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                stockFilter===t.key
                  ? t.color==='purple'?'bg-purple-100 text-purple-700':t.color==='green'?'bg-green-100 text-green-700':t.color==='yellow'?'bg-amber-100 text-amber-700':'bg-red-100 text-red-700'
                  : 'text-gray-500 hover:bg-gray-100'
              }`}>
              {t.label}
            </button>
          ))}
        </div>
        <div className="text-xs text-gray-400">
          {filteredProducts.length} result{filteredProducts.length!==1?'s':''} · {totalPages} page{totalPages!==1?'s':''}
          {(supplierFilter!=='all'||categoryFilter!=='all'||stockFilter!=='all'||debouncedSearchQuery) && (
            <button onClick={() => { setSupplierFilter('all'); setCategoryFilter('all'); setStockFilter('all'); setSearchQuery(''); setCurrentPage(1); }}
              className="ml-2 text-purple-500 hover:text-purple-700 font-semibold">Clear filters</button>
          )}
        </div>
      </div>
    </div>

    {/* Products Table */}
    <div className="bg-white rounded-xl shadow-lg overflow-hidden">
      {/* Fixed-height table container — height never shrinks below itemsPerPage rows */}
      <div className="overflow-x-auto">
        <table className="w-full table-fixed divide-y divide-gray-200" style={{minWidth:960}}>
          <colgroup>
            <col style={{width:44}}/>
            <col style={{width:60}}/>
            <col style={{width:'22%'}}/>
            <col style={{width:'10%'}}/>
            <col style={{width:'10%'}}/>
            <col style={{width:90}}/>
            <col style={{width:110}}/>
            <col style={{width:70}}/>
            <col style={{width:80}}/>
            <col style={{width:'14%'}}/>
            <col style={{width:110}}/>
            <col style={{width:90}}/>
          </colgroup>
          <thead>
            <tr className="bg-gradient-to-r from-purple-600 to-pink-500 text-white">

                <input type="checkbox"
                  checked={selectedProducts.length===filteredProducts.length && filteredProducts.length>0}
                  onChange={toggleSelectAllProducts}
                  className="w-4 h-4 rounded border-purple-300 cursor-pointer"/>
              </th>
              <th className="px-2 py-3 text-xs font-semibold uppercase tracking-wider text-purple-100">Img</th>
              {[
                {key:'name',label:'Product'},
                {key:'sku',label:'SKU'},
                {key:'category',label:'Category'},
                {key:'price',label:'Price'},
                {key:'stock',label:'Stock'},
                {key:'moq',label:'MOQ'},

              ].map(col => (
                <th key={col.key} onClick={() => handleProductSort(col.key)}
                  className="px-3 py-3 text-left text-xs font-semibold uppercase tracking-wider text-purple-100 cursor-pointer hover:bg-white hover:bg-opacity-10 select-none transition-colors">
                  <div className="flex items-center gap-1">
                    {col.label}
                    <span className={`text-xs ${productSortConfig.key===col.key?'text-white opacity-100':'opacity-30'}`}>
                      {productSortConfig.key===col.key ? (productSortConfig.direction==='asc'?'▲':'▼') : '⇅'}
                    </span>
                  </div>

              ))}
              <th className="px-3 py-3 text-xs font-semibold uppercase tracking-wider text-purple-100">Actions</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-gray-100">
            {currentProducts.map((product, rowIdx) => {
              const isOutOfStock = product.stock === 0;
              const isLowStock = product.stock > 0 && product.stock <= product.threshold;
              return (
                <tr key={product.id}
                  className={`transition-colors ${rowIdx%2===0?'bg-white':'bg-gray-50'} hover:bg-purple-50`}>
                  {/* Checkbox */}
                  <td className="px-3 py-3">
                    <input type="checkbox"
                      checked={selectedProducts.includes(product.id)}
                      onChange={() => toggleProductSelection(product.id)}
                      className="w-4 h-4 text-purple-600 border-gray-300 rounded focus:ring-purple-500 cursor-pointer"/>
                  </td>
                  {/* Image */}
                  <td className="px-2 py-3">
                    {product.imageUrl
                      ? <img src={product.imageUrl} alt={product.name} className={`w-9 h-9 object-cover rounded-md ${isOutOfStock?'grayscale opacity-60':''}`}/>
                      : <div className={`w-9 h-9 rounded-md flex items-center justify-center ${isOutOfStock?'bg-red-100':isLowStock?'bg-amber-100':'bg-purple-100'}`}>
                          <Package className={`w-4 h-4 ${isOutOfStock?'text-red-400':isLowStock?'text-amber-400':'text-purple-400'}`}/>
                        </div>
                    }
                  </td>
                  {/* Product name */}
                  <td className="px-3 py-3">
                    <div className="text-sm font-semibold text-gray-900 truncate" title={product.name}>{product.name}</div>
                    {product.description && <div className="text-xs text-gray-400 truncate" title={product.description}>{product.description}</div>}
                  </td>
                  {/* SKU */}
                  <td className="px-3 py-3">
                    <span className="text-xs font-mono bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded">{product.sku}</span>
                  </td>
                  {/* Category */}
                  <td className="px-3 py-3">
                    {product.category
                      ? <span className="text-xs px-2 py-0.5 rounded-full bg-purple-100 text-purple-700 font-medium whitespace-nowrap">{product.category}</span>
                      : <span className="text-xs text-gray-300">—</span>}
                  </td>
                  {/* Price */}
                  <td className="px-3 py-3 text-sm font-bold text-gray-800">
                    {getCurrencySymbol(product.currency)}{product.price.toFixed(2)}
                    {product.currency && product.currency!=='PHP' && <span className="ml-1 text-xs text-gray-400 font-normal">{product.currency}</span>}
                  </td>
                  {/* Stock */}
                  <td className="px-3 py-3">
                    <div className="text-sm font-bold text-gray-800">{product.stock} <span className="text-xs font-normal text-gray-400">{product.unit}</span></div>

                  </td>
                  {/* MOQ */}
                  <td className="px-3 py-3 text-sm text-gray-600">{product.moq || <span className="text-gray-300">—</span>}</td>
                  {/* Lead Time */}
                  <td className="px-3 py-3">
                    {product.leadTime
                      ? <span className="text-xs font-semibold text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded">{product.leadTime}d</span>
                      : <span className="text-gray-300 text-xs">—</span>}
                  </td>
                  {/* Supplier */}
                  <td className="px-3 py-3">
                    {product.supplier
                      ? <div className="text-xs font-medium text-gray-700 truncate" title={product.supplier}>{product.supplier}</div>
                      : <span className="text-gray-300 text-xs">—</span>}
                  </td>
                  {/* Status */}
                  <td className="px-3 py-3">
                    {isOutOfStock
                      ? <span className="inline-flex items-center gap-1 px-2 py-0.5 text-xs font-semibold rounded-full bg-red-100 text-red-700"><XCircle className="w-3 h-3"/>Out of Stock</span>
                      : isLowStock
                        ? <span className="inline-flex items-center gap-1 px-2 py-0.5 text-xs font-semibold rounded-full bg-amber-100 text-amber-700"><AlertTriangle className="w-3 h-3"/>Low Stock</span>
                        : <span className="inline-flex items-center gap-1 px-2 py-0.5 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-700">✓ In Stock</span>
                    }
                  </td>
                  {/* Actions */}
                  <td className="px-3 py-3">
                    <div className="flex items-center gap-1">
                      <button onClick={() => loadProductInfo(product.id)} title="View Info"
                        className="p-1.5 rounded-lg text-purple-500 hover:bg-purple-100 transition-colors">
                        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                      </button>
                      <button onClick={() => { setEditingProduct(product); setShowAddProduct(true); setProductForm(product); }} title="Edit"
                        className="p-1.5 rounded-lg text-blue-500 hover:bg-blue-100 transition-colors">

                      </button>
                      <button onClick={(e) => { e.stopPropagation(); setProductToDelete(product); setShowDeleteProductModal(true); }} title="Delete"
                        className="p-1.5 rounded-lg text-red-500 hover:bg-red-100 transition-colors">
                        <Trash className="w-3.5 h-3.5"/>
                      </button>
                    </div>
                  </td>
                </tr>
              );

            {/* Ghost rows to maintain fixed table height when page is not full */}

      {filteredProducts.length > 0 && (
        <div className="px-5 py-3 border-t border-gray-200 flex flex-wrap items-center justify-between gap-3 bg-gray-50">
          {/* Left: showing info */}

            Showing <span className="font-semibold text-gray-700">{filteredProducts.length===0?0:indexOfFirstItem+1}</span>–<span className="font-semibold text-gray-700">{Math.min(indexOfLastItem,filteredProducts.length)}</span> of <span className="font-semibold text-gray-700">{filteredProducts.length}</span> products
          </div>
          {/* Center: page buttons */}

                ‹ Prev
              </button>
              {/* Smart page windows */}
              {(() => {
                const pages = [];
                const delta = 2; // pages around current
                const left  = Math.max(2, currentPage - delta);
                const right = Math.min(totalPages - 1, currentPage + delta);
                // Always show page 1
                pages.push(
                  <button key={1} onClick={() => setCurrentPage(1)}
                    className={`w-8 h-7 rounded text-xs font-semibold border transition-colors ${currentPage===1?'bg-purple-600 text-white border-purple-600':'border-gray-300 hover:bg-purple-50 hover:border-purple-400 text-gray-600'}`}>1</button>
                );
                // Left ellipsis
                if (left > 2) pages.push(<span key="l-dots" className="px-1 text-gray-400 text-xs select-none">…</span>);
                // Window
                for (let p = left; p <= right; p++) {
                  pages.push(
                    <button key={p} onClick={() => setCurrentPage(p)}
                      className={`w-8 h-7 rounded text-xs font-semibold border transition-colors ${currentPage===p?'bg-purple-600 text-white border-purple-600':'border-gray-300 hover:bg-purple-50 hover:border-purple-400 text-gray-600'}`}>{p}</button>
                  );
                }
                // Right ellipsis
                if (right < totalPages - 1) pages.push(<span key="r-dots" className="px-1 text-gray-400 text-xs select-none">…</span>);
                // Always show last page
                if (totalPages > 1) pages.push(
                  <button key={totalPages} onClick={() => setCurrentPage(totalPages)}

                );
                return pages;
              })()}

              <button onClick={() => setCurrentPage(p => Math.min(p+1,totalPages))} disabled={currentPage===totalPages}

              </button>
              {/* Last */}
              <button onClick={() => setCurrentPage(totalPages)} disabled={currentPage===totalPages}

                »
              </button>
            </div>
