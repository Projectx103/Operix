                      <td style={{padding:'7px 12px',background:'#C8D0E4',border:'1px solid #8A9BB5',fontWeight:700,color:'#1A2340',fontSize:11}}>Payment Date To</td>
                      <td style={{padding:'5px 8px',background:'white',border:'1px solid #8A9BB5'}}>
                        <input type="date" value={requestForm.finPayDateTo||''} onChange={e=>setRequestForm(p=>({...p,finPayDateTo:e.target.value}))}
                          style={{width:'100%',border:'none',outline:'none',fontSize:12,fontFamily:'inherit',background:'transparent'}}/>
                      </td>
                    </tr>
                    <tr>
                      <td style={{padding:'7px 12px',background:'#C8D0E4',border:'1px solid #8A9BB5',fontWeight:700,color:'#1A2340',fontSize:11}}>Payment Status</td>
                      <td style={{padding:'5px 8px',background:'white',border:'1px solid #8A9BB5'}}>
                        <select value={requestForm.finPayStatus||''} onChange={e=>setRequestForm(p=>({...p,finPayStatus:e.target.value}))}
                          style={{width:'100%',border:'none',outline:'none',fontSize:12,fontFamily:'inherit',background:'transparent'}}>
                          <option value="">All</option>
                          <option value="paid">Paid</option>
                          <option value="pending">Pending</option>
                          <option value="on_hold">On Hold</option>
                        </select>
                      </td>
                    </tr>
                  </>)}

                  {requestForm.requestType === 'Invoice Aging Report' && (<>
                    <tr>
                      <td style={{padding:'7px 12px',background:'#C8D0E4',border:'1px solid #8A9BB5',width:200,fontWeight:700,color:'#1A2340',fontSize:11}}>Aging Bucket</td>
                      <td style={{padding:'5px 8px',background:'white',border:'1px solid #8A9BB5'}}>
                        <select value={requestForm.finAgingBucket||''} onChange={e=>setRequestForm(p=>({...p,finAgingBucket:e.target.value}))}
                          style={{width:'100%',border:'none',outline:'none',fontSize:12,fontFamily:'inherit',background:'transparent'}}>
                          <option value="">All Buckets</option>
                          <option value="current">Current (0–30 days)</option>
                          <option value="31_60">31–60 days</option>
                          <option value="61_90">61–90 days</option>
                          <option value="over_90">Over 90 days</option>
                        </select>
                      </td>
                    </tr>
                    <tr>
                      <td style={{padding:'7px 12px',background:'#C8D0E4',border:'1px solid #8A9BB5',fontWeight:700,color:'#1A2340',fontSize:11}}>Supplier Filter</td>
                      <td style={{padding:'5px 8px',background:'white',border:'1px solid #8A9BB5'}}>
                        <input value={requestForm.finSupplierFilter||''} onChange={e=>setRequestForm(p=>({...p,finSupplierFilter:e.target.value}))}
                          placeholder="Leave blank for all suppliers"
                          style={{width:'100%',border:'none',outline:'none',fontSize:12,fontFamily:'inherit',background:'transparent'}}/>
                      </td>
                    </tr>
                  </>)}
                </tbody>
              </table>
            </>
          )}

          {/* Output format */}
          <div style={{background:'#3A5A9A',color:'#DCE6F8',fontSize:11,fontWeight:700,padding:'5px 10px',marginBottom:10,letterSpacing:'1px',textTransform:'uppercase'}}>▶ Output Format</div>
          <div style={{display:'flex',gap:10,marginBottom:18,flexWrap:'wrap'}}>
            {['PDF','Excel','HTML'].map(fmt => (
              <label key={fmt} style={{display:'flex',alignItems:'center',gap:7,cursor:'pointer',padding:'8px 20px',border:`2px solid ${requestForm.outputFormat===fmt?'#1E3A78':'#8A9BB5'}`,background:requestForm.outputFormat===fmt?'#C8D8F0':'white',fontSize:12,fontWeight:700,color:'#1A2340'}}>
                <input type="radio" name="outputFormat" value={fmt} checked={requestForm.outputFormat===fmt} onChange={()=>setRequestForm(p=>({...p,outputFormat:fmt}))} style={{accentColor:'#1E3A78'}}/>
                {fmt==='PDF'?'📄':fmt==='Excel'?'📊':'🌐'} {fmt}
              </label>
            ))}
          </div>

          <div style={{display:'flex',justifyContent:'flex-end',gap:8}}>
            <button onClick={()=>setRequestStep(1)} style={{padding:'7px 20px',background:'#8A9BB5',color:'white',border:'none',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Cancel</button>
            <button
              onClick={() => {
                if (!requestForm.requestType) { alert('Please select a Report Type.'); return; }
                setRequestStep(3);
              }}
              style={{padding:'7px 22px',background:'#1E3A78',color:'white',border:'none',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>
              Next ▶
            </button>
          </div>
        </div>
      )}

      {/* ── STEP 3: Review ── */}
      {requestStep === 3 && (
        <div style={{padding:'18px 20px'}}>
          <div style={{background:'#1E3A78',color:'#DCE6F8',fontSize:11,fontWeight:700,padding:'5px 10px',marginBottom:16,letterSpacing:'1px',textTransform:'uppercase'}}>▶ Review — Confirm Before Submission</div>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            {[
              ['Report Type', requestForm.requestType],
              ['Organization', requestForm.organization || '(Default)'],
              ['Output Format', requestForm.outputFormat],
              ...(requestForm.requestType === 'Purchase Order Report' ? [
                ['PO Number From', requestForm.poFrom || '(All POs)'],
                ['PO Number To', requestForm.poTo || '(All POs)'],
              ] : requestForm.requestType === 'Inventory Report' ? [
                ['Category', requestForm.inventoryCategory || '(All)'],
                ['Stock Status', requestForm.inventoryStatus || '(All)'],
              ] : requestForm.requestType === 'Supplier Report' ? [
                ['Supplier Code', requestForm.supplierCode || '(All)'],
                ['Supplier Status', requestForm.supplierStatus || '(All)'],
              ] : requestForm.requestType === 'Receiving Transaction Summary' ? [
                ['Date From', requestForm.receiptDateFrom || '(All)'],
                ['Date To', requestForm.receiptDateTo || '(All)'],
                ['PO Number', requestForm.receiptPONumber || '(All)'],
              ] : requestForm.requestType === 'Purchase Order Summary' ? [
                ['Date From', requestForm.finDateFrom || '(All)'],
                ['Date To', requestForm.finDateTo || '(All)'],
                ['Status Filter', requestForm.finStatusFilter || '(All)'],
              ] : requestForm.requestType === 'Supplier Spend Analysis' ? [
                ['Supplier', requestForm.finSupplierFilter || '(All Suppliers)'],
                ['Period', requestForm.finPeriod || '(All Time)'],
              ] : requestForm.requestType === 'Budget Report' ? [
                ['Department', requestForm.finDepartment || '(All Departments)'],
                ['Fiscal Period', requestForm.finFiscalPeriod || '(Current Period)'],
              ] : requestForm.requestType === 'Payment Register' ? [
                ['Payment Date From', requestForm.finPayDateFrom || '(All)'],
                ['Payment Date To', requestForm.finPayDateTo || '(All)'],
                ['Payment Status', requestForm.finPayStatus || '(All)'],
              ] : requestForm.requestType === 'Invoice Aging Report' ? [
                ['Aging Bucket', requestForm.finAgingBucket || '(All Buckets)'],
                ['Supplier', requestForm.finSupplierFilter || '(All Suppliers)'],
              ] : [])
            ].map(([label, value]) => (
              <tbody key={label}>
                <tr>
                  <td style={{padding:'7px 14px',background:'#C8D0E4',border:'1px solid #8A9BB5',width:220,fontWeight:700,color:'#1A2340',fontSize:11}}>{label}</td>
                  <td style={{padding:'7px 14px',background:'white',border:'1px solid #8A9BB5',color:'#1A2340',fontWeight:600}}>{value}</td>
                </tr>
              </tbody>
            ))}
          </table>
          <div style={{marginTop:10,background:'#FEFAE8',border:'1px solid #D4A017',padding:'8px 12px',fontSize:11,color:'#7A5800'}}>
            ⚠ Please review your request parameters carefully before submitting.
          </div>
          <div style={{marginTop:16,display:'flex',justifyContent:'flex-end',gap:8}}>
            <button onClick={()=>setRequestStep(2)} style={{padding:'7px 20px',background:'#8A9BB5',color:'white',border:'none',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>◀ Back</button>
            <button onClick={submitRequest} disabled={requestSubmitting}
              style={{padding:'7px 24px',background:requestSubmitting?'#6A7A8A':'#2D6A4F',color:'white',border:'none',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>
              {requestSubmitting ? '⟳ Submitting...' : '✔ Submit Request'}
            </button>
          </div>
        </div>
      )}

      {/* ── STEP 4: Confirmation ── */}
      {requestStep === 4 && (
        <div style={{padding:'30px 20px',textAlign:'center'}}>
          <div style={{fontSize:40,marginBottom:14}}>✅</div>
          <div style={{background:'#1E3A78',color:'#DCE6F8',fontSize:13,fontWeight:700,padding:'10px 24px',display:'inline-block',letterSpacing:'1px',marginBottom:16}}>
            Request Submitted Successfully
          </div>
          <div style={{fontSize:12,color:'#1A2340',marginBottom:8}}>Your request has been queued for processing.</div>
          <div style={{background:'#C8D0E4',border:'1px solid #8A9BB5',display:'inline-block',padding:'12px 36px',margin:'12px 0',fontSize:14,fontWeight:700,color:'#1A2340',letterSpacing:'2px'}}>
            Request ID = <span style={{color:'#1E3A78',fontSize:20}}>#{submittedRequestId}</span>
          </div>
          <div style={{fontSize:11,color:'#555',marginBottom:22}}>
            Format: <strong>{requestForm.outputFormat}</strong> &nbsp;|&nbsp; Report: <strong>{requestForm.requestType}</strong>
          </div>
          <div style={{background:'#F5F7FB',border:'1px solid #8A9BB5',padding:'16px',display:'inline-block',fontSize:12,color:'#1A2340'}}>
            <strong>Submit another request?</strong>
            <div style={{display:'flex',justifyContent:'center',gap:12,marginTop:12}}>
              <button onClick={()=>{setRequestStep(2);setRequestForm({requestType:'',organization:'',poFrom:'',poTo:'',outputFormat:'PDF',inventoryCategory:'',inventoryStatus:'',supplierStatus:'',supplierCode:'',finDateFrom:'',finDateTo:'',finStatusFilter:'',finSupplierFilter:'',finPeriod:'',finDepartment:'',finFiscalPeriod:'',finPayDateFrom:'',finPayDateTo:'',finPayStatus:'',finAgingBucket:''});}}
                style={{padding:'7px 28px',background:'#1E3A78',color:'white',border:'none',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Yes</button>
              <button onClick={()=>setRequestStep(1)}
                style={{padding:'7px 28px',background:'#2D6A4F',color:'white',border:'none',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>No — View History</button>
            </div>
          </div>
        </div>
      )}

      {/* ── STEP 5: View Output ── */}
      {requestStep === 5 && selectedRequest && (
        <div style={{padding:'18px 20px'}}>
          <div style={{background:'#1E3A78',color:'#DCE6F8',fontSize:11,fontWeight:700,padding:'5px 10px',marginBottom:16,letterSpacing:'1px',textTransform:'uppercase'}}>
            ▶ View Output — Request #{selectedRequest.requestId}
          </div>

          {/* Request detail summary */}
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:11,marginBottom:16}}>
            <tbody>
              {[
                ['Request ID', `#${selectedRequest.requestId}`],
                ['Report Type', selectedRequest.requestType],
                ['Output Format', selectedRequest.outputFormat],
                ['Status', selectedRequest.status],
                ['Submitted', selectedRequest.createdAt?.toDate ? selectedRequest.createdAt.toDate().toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—'],
                ['Snapshot Captured', selectedRequest.snapshotId ? '✅ Yes — data is frozen at submission time' : '⚠ No snapshot (legacy)'],
                ['Records in Snapshot', selectedRequest.totalRecords !== undefined ? `${selectedRequest.totalRecords} PO(s)` : '—'],
                ...(selectedRequest.requestType === 'Purchase Order Report' ? [
                  ['PO From', selectedRequest.poFrom || '(All)'],
                  ['PO To', selectedRequest.poTo || '(All)'],
                ] : selectedRequest.requestType === 'Inventory Report' ? [
                  ['Category', selectedRequest.inventoryCategory || '(All)'],
                  ['Stock Status', selectedRequest.inventoryStatus || '(All)'],
                ] : [
                  ['Supplier Code', selectedRequest.supplierCode || '(All)'],
                  ['Supplier Status', selectedRequest.supplierStatus || '(All)'],
                ])
              ].map(([label, value]) => (
                <tr key={label}>
                  <td style={{padding:'5px 12px',background:'#C8D0E4',border:'1px solid #8A9BB5',width:160,fontWeight:700,color:'#1A2340',fontSize:11}}>{label}</td>
                  <td style={{padding:'5px 12px',background:'white',border:'1px solid #8A9BB5',color:'#1A2340'}}>
                    {label === 'Status'
                      ? <span style={{background:{Pending:'#B8860B',Running:'#1E3A78',Completed:'#2D6A4F',Error:'#8B1A1A'}[value]||'#555',color:'white',padding:'2px 8px',fontSize:10,fontWeight:700}}>{value}</span>
                      : value}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>

          {/* Output panel */}
          <div style={{background:'#EAF0FA',border:'1px solid #8A9BB5',padding:'14px 16px',marginBottom:14}}>
            <div style={{fontSize:11,fontWeight:700,color:'#1E3A78',marginBottom:12,letterSpacing:'0.5px',textTransform:'uppercase',display:'flex',alignItems:'center',gap:10}}>
              ▶ Output Results
              {/* Snapshot badge */}
              {selectedRequest.snapshotId && (
                <span style={{background:'#2D6A4F',color:'white',fontSize:9,fontWeight:700,padding:'2px 8px',letterSpacing:'0.5px',borderRadius:2}}>
                  📸 SNAPSHOT — captured {selectedRequest.capturedAt?.toDate ? selectedRequest.capturedAt.toDate().toLocaleString() : selectedRequest.createdAt?.toDate ? selectedRequest.createdAt.toDate().toLocaleString() : 'at time of submission'}
                </span>
              )}
              {!selectedRequest.snapshotId && (
                <span style={{background:'#B8860B',color:'white',fontSize:9,fontWeight:700,padding:'2px 8px',letterSpacing:'0.5px',borderRadius:2}}>
                  ⚠ LIVE DATA (legacy request — no snapshot)
                </span>
              )}
            </div>

            {/* Loading spinner while snapshot is fetched */}
            {snapshotLoading && (
              <div style={{textAlign:'center',padding:'24px 0',color:'#1E3A78',fontWeight:700,fontSize:12}}>
                ⟳ Loading snapshot data…
              </div>
            )}

            {/* PO Report */}
            {!snapshotLoading && selectedRequest.requestType === 'Purchase Order Report' && (() => {
              // Wait until snapshot has been attempted for this specific request
              if (snapshotView.requestId !== selectedRequest.requestId) return null;

              // Use frozen snapshot if available; fall back to live filter only for legacy requests without a snapshot
              let matching = snapshotPOs && snapshotPOs.length > 0 ? snapshotPOs : null;
              if (!matching) {
                if (selectedRequest.snapshotId) {
                  // Has a snapshotId but loaded empty — snapshot may be corrupt/missing
                  return <div style={{color:'#B8860B',fontSize:12,fontWeight:700,padding:'10px 0'}}>⚠ Snapshot data could not be loaded for this request. The original data may have been cleared. Please submit a new request to regenerate.</div>;
                }
                // Legacy request with no snapshotId — use live filter as fallback
                matching = purchaseOrders.filter(po => {
                  const n    = (po.poNumber||'').toLowerCase();
                  const from = (selectedRequest.poFrom||'').toLowerCase();
                  const to   = (selectedRequest.poTo||'').toLowerCase();
                  if (!from && !to) return true;
                  if (from === to && from) return po.poNumber === selectedRequest.poFrom;
                  return n >= from && n <= to;
                });
              }
              if (matching.length === 0) return <div style={{color:'#8B1A1A',fontSize:12,fontWeight:700,padding:'10px 0'}}>⚠ No matching Purchase Orders found for the requested parameters.</div>;

              const fmt = selectedRequest.outputFormat;

              // Excel — download CSV with all PO line items
              if (fmt === 'Excel') {
                const downloadExcel = () => {
                  let csv = 'PO Number,Supplier,Status,Currency,Item #,Product,SKU,Unit,Qty,Unit Cost,Line Total,Subtotal,Shipping,Discount,Grand Total\n';
                  matching.forEach(po => {
                    const sym = getCurrencySymbol(po.currency);
                    if (!po.items || po.items.length === 0) {
                      csv += `"${po.poNumber}","${po.supplierName||''}","${po.status||''}","${po.currency||''}","","","","","","","","${(po.subtotal||0).toFixed(2)}","${(po.shippingCost||0).toFixed(2)}","${(po.discount||0).toFixed(2)}","${(po.grandTotal||0).toFixed(2)}"\n`;
                    } else {
                      po.items.forEach((item, idx) => {
                        csv += `"${po.poNumber}","${po.supplierName||''}","${po.status||''}","${po.currency||''}","${idx+1}","${item.productName||''}","${item.sku||''}","${item.unit||'pcs'}","${item.quantity||0}","${parseFloat(item.unitCost||0).toFixed(2)}","${parseFloat(item.lineTotal||item.subtotal||0).toFixed(2)}","${idx===0?(po.subtotal||0).toFixed(2):''}","${idx===0?(po.shippingCost||0).toFixed(2):''}","${idx===0?(po.discount||0).toFixed(2):''}","${idx===0?(po.grandTotal||0).toFixed(2):''}"\n`;
                      });
                    }
                  });
                  const blob = new Blob([csv], {type:'text/csv'});
                  const a = document.createElement('a');
                  a.href = URL.createObjectURL(blob);
                  a.download = `PO_Report_Req${selectedRequest.requestId}_${selectedRequest.poFrom||'all'}.csv`;
                  a.click();
                };
                return (
                  <div style={{width:'100%'}}>
                    <div style={{fontSize:11,color:'#555',marginBottom:14}}>{matching.length} PO(s) found. Click below to download.</div>
                    <button onClick={downloadExcel}
                      style={{background:'#2D6A4F',color:'white',border:'none',padding:'10px 22px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:7}}>
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>
                      📊 Download as Excel (CSV)
                    </button>
                  </div>
                );
              }

              // PDF / HTML — show per-PO open buttons
              return (
                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                  <div style={{fontSize:11,color:'#555',marginBottom:4}}>{matching.length} PO(s) found.</div>
                  {matching.map(po => (
                    <div key={po.id} style={{background:'white',border:'1px solid #B0BAD0',padding:'10px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:16}}>
                      <div>
                        <div style={{fontWeight:700,fontSize:13,color:'#1A2340',fontFamily:'monospace'}}>{po.poNumber}</div>
                        <div style={{fontSize:10,color:'#555',marginTop:2}}>{po.supplierName} &nbsp;·&nbsp; Status: <strong>{po.status}</strong> &nbsp;·&nbsp; Total: <strong>{getCurrencySymbol(po.currency)}{(po.grandTotal||0).toFixed(2)}</strong></div>
                      </div>
                      <div style={{display:'flex',gap:6,flexShrink:0}}>
                        {fmt === 'PDF' && (
                          <button onClick={() => openPOView(po)}
                            style={{background:'#8B1A1A',color:'white',border:'none',padding:'6px 14px',fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:5}}>
                            📄 Open as PDF
                          </button>
                        )}
                        {fmt === 'HTML' && (
                          <button onClick={() => openPOView(po)}
                            style={{background:'#1E3A78',color:'white',border:'none',padding:'6px 14px',fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:5}}>
                            🌐 Open as HTML
                          </button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              );
            })()}

            {/* Inventory Report — open as actual file */}
            {!snapshotLoading && selectedRequest.requestType === 'Inventory Report' && (() => {
              const filtered = (products||[]).filter(p => {
                const catMatch = !selectedRequest.inventoryCategory || (p.category||'').toLowerCase().includes(selectedRequest.inventoryCategory.toLowerCase());
                const s = selectedRequest.inventoryStatus;
                const stockMatch = !s
                  || (s==='low' && p.stock<=(p.reorderPoint||5) && p.stock>0)
                  || (s==='out' && p.stock===0)
                  || (s==='normal' && p.stock>(p.reorderPoint||5));
                return catMatch && stockMatch;
              });

              const openInventoryFile = (format) => {
                if (format === 'HTML' || format === 'PDF') {
                  const rows = filtered.map((p,i) => {
                    const st = p.stock===0?'OUT OF STOCK':p.stock<=(p.reorderPoint||5)?'LOW STOCK':'IN STOCK';
                    const color = p.stock===0?'#8B1A1A':p.stock<=(p.reorderPoint||5)?'#B8860B':'#2D6A4F';
                    return `<tr style="background:${i%2===0?'#fff':'#f5f7fc'}">
                      <td>${p.name||p.productName||''}</td>
                      <td style="font-family:monospace">${p.sku||'—'}</td>
                      <td>${p.category||'—'}</td>
                      <td style="text-align:right;font-weight:700;color:${color}">${p.stock??'—'}</td>
                      <td style="text-align:right">${p.reorderPoint||5}</td>
                      <td><span style="background:${color};color:white;padding:2px 8px;font-size:10px;font-weight:700">${st}</span></td>
                    </tr>`;
                  }).join('');
                  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
                  <title>Inventory Report — Request #${selectedRequest.requestId}</title>
                  <style>
                    @page{size:A4 landscape;margin:15mm}
                    body{font-family:Arial,sans-serif;font-size:11px;color:#1a1a2e}
                    .header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #1E3A78;padding-bottom:12px;margin-bottom:16px}
                    .title{font-size:22px;font-weight:900;color:#1E3A78}
                    .meta{font-size:10px;color:#555;margin-top:4px}
                    table{width:100%;border-collapse:collapse}
                    th{background:#1E3A78;color:white;padding:7px 10px;text-align:left;font-size:10px;letter-spacing:0.5px;text-transform:uppercase}
                    td{padding:6px 10px;border-bottom:1px solid #e5e7eb}
                    .footer{margin-top:20px;border-top:1px solid #e5e7eb;padding-top:8px;font-size:9px;color:#9CA3AF;display:flex;justify-content:space-between}
                    .print-btn{margin:12px 0;padding:8px 20px;background:#1E3A78;color:white;border:none;cursor:pointer;font-size:12px;font-weight:700}
                    @media print{.print-btn{display:none}}
                  </style></head><body>
                  <div class="header">
                    <div><div class="title">INVENTORY REPORT</div>
                    <div class="meta">Request ID: #${selectedRequest.requestId} &nbsp;|&nbsp; Category: ${selectedRequest.inventoryCategory||'All'} &nbsp;|&nbsp; Stock Filter: ${selectedRequest.inventoryStatus||'All'}</div>
                    <div class="meta">Generated: ${new Date().toLocaleString()}</div></div>
                    <div style="text-align:right"><div style="font-size:28px;font-weight:900;color:#1E3A78">OPERIX</div>
                    <div style="font-size:10px;color:#555">${filtered.length} record(s)</div></div>
                  </div>
                  <table><thead><tr><th>Product</th><th>SKU</th><th>Category</th><th style="text-align:right">Stock</th><th style="text-align:right">Reorder Pt</th><th>Status</th></tr></thead>
                  <tbody>${rows}</tbody></table>
                  <div class="footer"><span>Operix Inventory Management System</span><span>Request #${selectedRequest.requestId} | Page 1 of 1</span></div>
                  <button class="print-btn" onclick="window.print()">🖨️ Print / Save as PDF</button>
                  </body></html>`;
                  const w = window.open('','_blank');
                  w.document.write(html);
                  w.document.close();
                  if (format === 'PDF') setTimeout(()=>w.print(), 400);
                } else if (format === 'Excel') {
                  let csv = 'Product,SKU,Category,Stock,Reorder Point,Status\n';
                  filtered.forEach(p => {
                    const st = p.stock===0?'OUT OF STOCK':p.stock<=(p.reorderPoint||5)?'LOW STOCK':'IN STOCK';
                    csv += `"${p.name||p.productName||''}","${p.sku||''}","${p.category||''}","${p.stock??''}","${p.reorderPoint||5}","${st}"\n`;
                  });
                  const blob = new Blob([csv], {type:'text/csv'});
                  const a = document.createElement('a');
                  a.href = URL.createObjectURL(blob);
                  a.download = `Inventory_Report_Req${selectedRequest.requestId}.csv`;
                  a.click();
                }
              };

              return (
                <div style={{width:'100%'}}>
                  <div style={{fontSize:11,color:'#555',marginBottom:14}}>{filtered.length} item(s) found matching your parameters. Click below to open the output file.</div>
                  <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
                    {selectedRequest.outputFormat === 'PDF' && (
                      <button onClick={()=>openInventoryFile('PDF')}
                        style={{background:'#8B1A1A',color:'white',border:'none',padding:'10px 22px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:7}}>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        📄 Open as PDF
                      </button>
                    )}
                    {selectedRequest.outputFormat === 'HTML' && (
                      <button onClick={()=>openInventoryFile('HTML')}
                        style={{background:'#1E3A78',color:'white',border:'none',padding:'10px 22px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:7}}>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                        🌐 Open as HTML
                      </button>
                    )}
                    {selectedRequest.outputFormat === 'Excel' && (
                      <button onClick={()=>openInventoryFile('Excel')}
                        style={{background:'#2D6A4F',color:'white',border:'none',padding:'10px 22px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:7}}>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>
                        📊 Download as Excel (CSV)
                      </button>
                    )}
                  </div>
                </div>
              );
            })()}

            {/* Supplier Report — open as actual file */}
            {!snapshotLoading && selectedRequest.requestType === 'Supplier Report' && (() => {
              const filtered = (suppliers||[]).filter(s => {
                const codeMatch = !selectedRequest.supplierCode || (s.supplierCode||'').toLowerCase().includes(selectedRequest.supplierCode.toLowerCase());
                const statusMatch = !selectedRequest.supplierStatus || (s.status||'').toLowerCase() === selectedRequest.supplierStatus.toLowerCase();
                return codeMatch && statusMatch;
              });

              const openSupplierFile = (format) => {
                if (format === 'HTML' || format === 'PDF') {
                  const rows = filtered.map((s,i) => {
                    const stColor = {active:'#2D6A4F',inactive:'#555',blacklisted:'#8B1A1A'}[(s.status||'').toLowerCase()]||'#555';
                    return `<tr style="background:${i%2===0?'#fff':'#f5f7fc'}">
                      <td style="font-family:monospace;font-weight:700;color:#1E3A78">${s.supplierCode||'—'}</td>
                      <td style="font-weight:600">${s.name||s.supplierName||''}</td>
                      <td>${s.contactPerson||'—'}</td>
                      <td>${s.email||'—'}</td>
                      <td>${s.phone||'—'}</td>
                      <td><span style="background:${stColor};color:white;padding:2px 8px;font-size:10px;font-weight:700">${(s.status||'unknown').toUpperCase()}</span></td>
                    </tr>`;
                  }).join('');
                  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
                  <title>Supplier Report — Request #${selectedRequest.requestId}</title>
                  <style>
                    @page{size:A4 landscape;margin:15mm}
                    body{font-family:Arial,sans-serif;font-size:11px;color:#1a1a2e}
                    .header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #1E3A78;padding-bottom:12px;margin-bottom:16px}
                    .title{font-size:22px;font-weight:900;color:#1E3A78}
                    .meta{font-size:10px;color:#555;margin-top:4px}
                    table{width:100%;border-collapse:collapse}
                    th{background:#1E3A78;color:white;padding:7px 10px;text-align:left;font-size:10px;letter-spacing:0.5px;text-transform:uppercase}
                    td{padding:6px 10px;border-bottom:1px solid #e5e7eb}
                    .footer{margin-top:20px;border-top:1px solid #e5e7eb;padding-top:8px;font-size:9px;color:#9CA3AF;display:flex;justify-content:space-between}
                    .print-btn{margin:12px 0;padding:8px 20px;background:#1E3A78;color:white;border:none;cursor:pointer;font-size:12px;font-weight:700}
                    @media print{.print-btn{display:none}}
                  </style></head><body>
                  <div class="header">
                    <div><div class="title">SUPPLIER REPORT</div>
                    <div class="meta">Request ID: #${selectedRequest.requestId} &nbsp;|&nbsp; Code Filter: ${selectedRequest.supplierCode||'All'} &nbsp;|&nbsp; Status Filter: ${selectedRequest.supplierStatus||'All'}</div>
                    <div class="meta">Generated: ${new Date().toLocaleString()}</div></div>
                    <div style="text-align:right"><div style="font-size:28px;font-weight:900;color:#1E3A78">OPERIX</div>
                    <div style="font-size:10px;color:#555">${filtered.length} record(s)</div></div>
                  </div>
                  <table><thead><tr><th>Code</th><th>Supplier Name</th><th>Contact</th><th>Email</th><th>Phone</th><th>Status</th></tr></thead>
                  <tbody>${rows}</tbody></table>
                  <div class="footer"><span>Operix Inventory Management System</span><span>Request #${selectedRequest.requestId} | Page 1 of 1</span></div>
                  <button class="print-btn" onclick="window.print()">🖨️ Print / Save as PDF</button>
                  </body></html>`;
                  const w = window.open('','_blank');
                  w.document.write(html);
                  w.document.close();
                  if (format === 'PDF') setTimeout(()=>w.print(), 400);
                } else if (format === 'Excel') {
                  let csv = 'Supplier Code,Supplier Name,Contact Person,Email,Phone,Status\n';
                  filtered.forEach(s => {
                    csv += `"${s.supplierCode||''}","${s.name||s.supplierName||''}","${s.contactPerson||''}","${s.email||''}","${s.phone||''}","${s.status||''}"\n`;
                  });
                  const blob = new Blob([csv], {type:'text/csv'});
                  const a = document.createElement('a');
                  a.href = URL.createObjectURL(blob);
                  a.download = `Supplier_Report_Req${selectedRequest.requestId}.csv`;
                  a.click();
                }
              };

              return (
                <div style={{width:'100%'}}>
                  <div style={{fontSize:11,color:'#555',marginBottom:14}}>{filtered.length} supplier(s) found matching your parameters. Click below to open the output file.</div>
                  <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
                    {selectedRequest.outputFormat === 'PDF' && (
                      <button onClick={()=>openSupplierFile('PDF')}
                        style={{background:'#8B1A1A',color:'white',border:'none',padding:'10px 22px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:7}}>
                        📄 Open as PDF
                      </button>
                    )}
                    {selectedRequest.outputFormat === 'HTML' && (
                      <button onClick={()=>openSupplierFile('HTML')}
                        style={{background:'#1E3A78',color:'white',border:'none',padding:'10px 22px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:7}}>
                        🌐 Open as HTML
                      </button>
                    )}
                    {selectedRequest.outputFormat === 'Excel' && (
                      <button onClick={()=>openSupplierFile('Excel')}
                        style={{background:'#2D6A4F',color:'white',border:'none',padding:'10px 22px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:7}}>
                        📊 Download as Excel (CSV)
                      </button>
                    )}
                  </div>
                </div>
              );
            })()}

            {/* ── Receiving Transaction Summary ── */}
            {!snapshotLoading && selectedRequest.requestType === 'Receiving Transaction Summary' && (() => {
              const openReceivingFile = async (format) => {
                const db = firebase.firestore();
                let receipts = [];
                try {
                  const snap = await db.collection('receipts').orderBy('createdAt','desc').get();
                  receipts = snap.docs.map(d => ({id: d.id, ...d.data()}));
                } catch(e) { alert('Error loading receipts: ' + e.message); return; }

                if (selectedRequest.receiptDateFrom) {
                  const from = new Date(selectedRequest.receiptDateFrom);
                  receipts = receipts.filter(r => {
                    const d = r.createdAt?.toDate ? r.createdAt.toDate() : new Date(r.createdAt);
                    return d >= from;
                  });
                }
                if (selectedRequest.receiptDateTo) {
                  const to = new Date(selectedRequest.receiptDateTo);
                  to.setHours(23,59,59,999);
                  receipts = receipts.filter(r => {
                    const d = r.createdAt?.toDate ? r.createdAt.toDate() : new Date(r.createdAt);
                    return d <= to;
                  });
                }
                if (selectedRequest.receiptPONumber) {
                  receipts = receipts.filter(r => (r.poNumber||'').toLowerCase().includes(selectedRequest.receiptPONumber.toLowerCase()));
                }

                const poCache = {};
                for (const r of receipts) {
                  if (r.poId && !poCache[r.poId]) {
                    try {
                      const poDoc = await db.collection('purchaseOrders').doc(r.poId).get();
                      if (poDoc.exists) poCache[r.poId] = poDoc.data();
                    } catch(e) {}
                  }
                }

                const getUnitCost = (receipt, item) => {
                  const po = poCache[receipt.poId];
                  if (!po || !po.items) return 0;
                  const match = po.items.find(pi => pi.productId === item.productId || pi.sku === item.sku);
                  return match ? (parseFloat(match.unitCost) || 0) : 0;
                };
                const getCurrency = (receipt) => (poCache[receipt.poId]?.currency || 'PHP');

                if (format === 'Excel') {
                  let csv = 'Receipt #,PO Number,Supplier,Date Received,Received By,Item,SKU,Qty Ordered,Qty Received,Currency,Unit Cost,Amount Received\n';
                  receipts.forEach(r => {
                    const dt = r.createdAt?.toDate ? r.createdAt.toDate().toLocaleDateString() : '';
                    const cur = getCurrency(r);
                    (r.items||[]).forEach(it => {
                      const uc = getUnitCost(r, it);
                      const amt = uc * (parseFloat(it.receivedQty)||0);
                      csv += `"${r.receiptNumber||''}","${r.poNumber||''}","${r.supplierName||''}","${dt}","${r.createdByName||''}","${it.productName||''}","${it.sku||''}","${it.orderedQty||0}","${it.receivedQty||0}","${cur}","${uc.toFixed(2)}","${amt.toFixed(2)}"\n`;
                    });
                  });
                  const blob = new Blob([csv], {type:'text/csv'});
                  const a = document.createElement('a');
                  a.href = URL.createObjectURL(blob);
                  a.download = `Receiving_Summary_Req${selectedRequest.requestId}.csv`;
                  a.click();
                  return;
                }

                const tableRows = receipts.map((r, ri) => {
                  const dt = r.createdAt?.toDate ? r.createdAt.toDate().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
                  const cur = getCurrency(r);
                  const items = r.items || [];
                  const totalQtyReceived = items.reduce((s,it) => s + (parseFloat(it.receivedQty)||0), 0);
                  const totalAmount = items.reduce((s,it) => s + getUnitCost(r,it) * (parseFloat(it.receivedQty)||0), 0);

                  const itemRows = items.map(it => {
                    const uc = getUnitCost(r, it);
                    const amt = uc * (parseFloat(it.receivedQty)||0);
                    return `<tr style="background:#F8FAFF">
                      <td style="padding:4px 10px 4px 28px;font-size:10px;color:#1A2340" colspan="2">${it.productName||'—'}</td>
                      <td style="padding:4px 10px;font-family:monospace;font-size:10px;color:#555">${it.sku||'—'}</td>
                      <td style="padding:4px 10px;text-align:right;font-size:10px;color:#888">${it.orderedQty||0}</td>
                      <td style="padding:4px 10px;text-align:right;font-size:10px;font-weight:700;color:#2D6A4F">${it.receivedQty||0}</td>
                      <td style="padding:4px 10px;text-align:center;font-size:10px;color:#555">${cur}</td>
                      <td style="padding:4px 10px;text-align:right;font-size:10px;color:#555">${uc.toFixed(2)}</td>
                      <td style="padding:4px 10px;text-align:right;font-size:10px;font-weight:700;color:#1E3A78">${amt.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
                    </tr>`;
                  }).join('');

                  return `
                    <tr style="background:${ri%2===0?'#EAF0FA':'#DDE6F5'};border-top:2px solid #8A9BB5">
                      <td style="padding:7px 10px;font-family:monospace;font-weight:700;color:#1E3A78;white-space:nowrap">${r.receiptNumber||'—'}</td>
                      <td style="padding:7px 10px;font-weight:700;white-space:nowrap">${r.poNumber||'—'}</td>
                      <td style="padding:7px 10px">${r.supplierName||'—'}</td>
                      <td style="padding:7px 10px;text-align:right;font-weight:700;color:#2D6A4F">${totalQtyReceived}</td>
                      <td style="padding:7px 10px"></td>
                      <td style="padding:7px 10px;text-align:center;font-weight:700;color:#1E3A78">${cur}</td>
                      <td style="padding:7px 10px"></td>
                      <td style="padding:7px 10px;text-align:right;font-weight:900;color:#1E3A78">${totalAmount.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
                    </tr>
                    ${itemRows}
                    <tr style="background:#F0F4FF;border-bottom:2px solid #8A9BB5">
                      <td colspan="8" style="padding:3px 10px 5px 28px;font-size:10px;font-style:italic;color:#7A90B8">${items.length} line item(s) &nbsp;·&nbsp; Received by: ${r.createdByName||'—'} &nbsp;·&nbsp; ${dt}</td>
                    </tr>`;
                }).join('');

                const grandTotalQty = receipts.reduce((s,r) => s+(r.items||[]).reduce((ss,it)=>ss+(parseFloat(it.receivedQty)||0),0),0);
                const grandTotalAmt = receipts.reduce((s,r) => s+(r.items||[]).reduce((ss,it)=>ss+getUnitCost(r,it)*(parseFloat(it.receivedQty)||0),0),0);

                const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
                <title>Receiving Transaction Summary — Request #${selectedRequest.requestId}</title>
                <style>
                  @page{size:A4 landscape;margin:12mm}
                  body{font-family:Arial,sans-serif;font-size:11px;color:#1a1a2e}
                  .header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #1E3A78;padding-bottom:12px;margin-bottom:16px}
                  .title{font-size:20px;font-weight:900;color:#1E3A78}
                  .sub{font-size:10px;color:#555;margin-top:3px}
                  table{width:100%;border-collapse:collapse}
                  th{background:#1E3A78;color:white;padding:7px 10px;text-align:left;font-size:10px;letter-spacing:0.5px;text-transform:uppercase;white-space:nowrap}
                  th.right{text-align:right}
                  th.center{text-align:center}
                  td{vertical-align:middle}
                  .totals-row td{background:#1E3A78;color:white;padding:8px 10px;font-weight:700;font-size:11px}
                  .footer{margin-top:20px;border-top:1px solid #e5e7eb;padding-top:8px;font-size:9px;color:#9CA3AF;display:flex;justify-content:space-between}
                  .print-btn{margin:12px 0;padding:8px 20px;background:#1E3A78;color:white;border:none;cursor:pointer;font-size:12px;font-weight:700}
                  @media print{.print-btn{display:none}}
                </style></head><body>
                <div class="header">
                  <div>
                    <div class="title">🚚 RECEIVING TRANSACTION SUMMARY</div>
                    <div class="sub">Request ID: #${selectedRequest.requestId} &nbsp;|&nbsp; Date: ${selectedRequest.receiptDateFrom||'All'} → ${selectedRequest.receiptDateTo||'All'} &nbsp;|&nbsp; PO Filter: ${selectedRequest.receiptPONumber||'All'}</div>
                    <div class="sub">Generated: ${new Date().toLocaleString()}</div>
                  </div>
                  <div style="text-align:right">
                    <div style="font-size:26px;font-weight:900;color:#1E3A78">OPERIX</div>
                    <div style="font-size:10px;color:#555">${receipts.length} receipt(s)</div>
                  </div>
                </div>
                <button class="print-btn" onclick="window.print()">🖨️ Print / Save as PDF</button>
                <table>
                  <thead><tr>
                    <th>Receipt #</th>
                    <th>PO Number</th>
                    <th>Supplier</th>
                    <th class="right">Qty Received</th>
                    <th>Item</th>
                    <th class="center">Currency</th>
                    <th class="right">Unit Cost</th>
                    <th class="right">Amount Received</th>
                  </tr></thead>
                  <tbody>
                    ${tableRows}
                    <tr class="totals-row">
                      <td colspan="3" style="text-align:right;letter-spacing:1px">GRAND TOTAL</td>
                      <td style="text-align:right">${grandTotalQty}</td>
                      <td colspan="3"></td>
                      <td style="text-align:right">${grandTotalAmt.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
                    </tr>
                  </tbody>
                </table>
                <div class="footer">
                  <span>Operix Receiving Module — Transaction Summary</span>
                  <span>Request #${selectedRequest.requestId} | ${receipts.length} receipt(s) | ${new Date().toLocaleDateString()}</span>
                </div>
                </body></html>`;
                const w = window.open('','_blank');
                w.document.write(html);
                w.document.close();
                if (format === 'PDF') setTimeout(()=>w.print(), 500);
              };

              return (
                <div style={{width:'100%'}}>
                  <div style={{fontSize:11,color:'#555',marginBottom:14}}>Generates a full receiving transaction summary with item breakdown and amounts pulled from the linked PO pricing.</div>
                  <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
                    {selectedRequest.outputFormat === 'PDF' && (
                      <button onClick={()=>openReceivingFile('PDF')}
                        style={{background:'#8B1A1A',color:'white',border:'none',padding:'10px 22px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:7}}>
                        📄 Open as PDF
                      </button>
                    )}
                    {selectedRequest.outputFormat === 'HTML' && (
                      <button onClick={()=>openReceivingFile('HTML')}
                        style={{background:'#1E3A78',color:'white',border:'none',padding:'10px 22px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:7}}>
                        🌐 Open as HTML
                      </button>
                    )}
                    {selectedRequest.outputFormat === 'Excel' && (
                      <button onClick={()=>openReceivingFile('Excel')}
                        style={{background:'#2D6A4F',color:'white',border:'none',padding:'10px 22px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:7}}>
                        📊 Download as Excel (CSV)
                      </button>
                    )}
                  </div>
                </div>
              );
            })()}

          </div>

          <div style={{display:'flex',justifyContent:'flex-end'}}>
            <button onClick={()=>setRequestStep(1)} style={{padding:'7px 22px',background:'#1E3A78',color:'white',border:'none',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>◀ Back to History</button>
          </div>
        </div>
      )}

    </div>
  </div>
)}
{/* ── End Oracle EBS ─────────────────────────────────────────────────── */}

{/* ══ EDIT / ADD PRODUCT MODAL ══ */}
{showAddProduct && (
  <div className="fixed inset-0 z-50 flex items-center justify-center" style={{background:'rgba(0,0,0,0.55)',backdropFilter:'blur(4px)'}}>
    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[92vh] flex flex-col overflow-hidden">
      {/* Header */}
      <div className="flex items-center justify-between px-6 py-4 border-b border-gray-100">
        <div>
          <h3 className="text-lg font-black text-gray-900">{editingProduct ? 'Edit Product' : 'Add New Product'}</h3>
          <p className="text-xs text-gray-400 mt-0.5">{editingProduct ? `Editing: ${editingProduct.name}` : 'Fill in the product details below'}</p>
        </div>
        <button onClick={()=>{setShowAddProduct(false);setEditingProduct(null);resetProductForm();}}
          className="w-8 h-8 rounded-lg border border-gray-200 flex items-center justify-center text-gray-400 hover:text-gray-700 hover:border-gray-300 transition-colors">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      {/* Body */}
      <div className="flex-1 overflow-y-auto p-6 space-y-4">
        {/* Name & SKU */}
        <div className="grid grid-cols-2 gap-4">
          <div>
            <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Product Name <span className="text-red-500">*</span></label>
            <input value={productForm.name} onChange={e=>setProductForm(p=>({...p,name:e.target.value}))}
              placeholder="e.g. Hydraulic Pump"
              className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-100"/>
          </div>
          <div>
            <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">SKU <span className="text-red-500">*</span></label>
            <input value={productForm.sku} onChange={e=>setProductForm(p=>({...p,sku:e.target.value}))}
              placeholder="e.g. EC-001"
              className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm font-mono focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-100"/>
          </div>
        </div>
        {/* Category & Unit */}
        <div className="grid grid-cols-2 gap-4">
          <div>
            <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Category</label>
            <input value={productForm.category} onChange={e=>setProductForm(p=>({...p,category:e.target.value}))}
              placeholder="e.g. Electrical"
              className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-100"/>
          </div>
          <div>
            <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Unit</label>
            <select value={productForm.unit} onChange={e=>setProductForm(p=>({...p,unit:e.target.value}))}
              className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-100">
              {['pieces','pcs','sets','boxes','kg','liters','meters','rolls','pairs','units'].map(u=>(
                <option key={u} value={u}>{u}</option>
              ))}
            </select>
          </div>
        </div>
        {/* Price & Stock */}
        <div className="grid grid-cols-2 gap-4">
          <div>
            <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Unit Price <span className="text-red-500">*</span></label>
            <input type="number" min="0" step="0.01" value={productForm.price} onChange={e=>setProductForm(p=>({...p,price:e.target.value}))}
              placeholder="0.00"
              className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-100"/>
          </div>
          <div>
            <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Stock <span className="text-red-500">*</span></label>
            <input type="number" min="0" value={productForm.stock} onChange={e=>setProductForm(p=>({...p,stock:e.target.value}))}
              placeholder="0"
              className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-100"/>
          </div>
        </div>
        {/* Threshold & MOQ */}
        <div className="grid grid-cols-2 gap-4">
          <div>
            <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Reorder Threshold</label>
            <input type="number" min="0" value={productForm.threshold} onChange={e=>setProductForm(p=>({...p,threshold:e.target.value}))}
              placeholder="e.g. 10"
              className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-100"/>
          </div>
          <div>
            <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Min. Order Qty (MOQ)</label>
            <input type="number" min="1" value={productForm.moq} onChange={e=>setProductForm(p=>({...p,moq:e.target.value}))}
              placeholder="e.g. 5"
              className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-100"/>
          </div>
        </div>
        {/* Supplier & Lead Time */}
        <div className="grid grid-cols-2 gap-4">
          <div>
            <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Supplier</label>
            <input value={productForm.supplier} onChange={e=>setProductForm(p=>({...p,supplier:e.target.value}))}
              placeholder="e.g. ABC Supplies"
              className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-100"/>
          </div>
          <div>
            <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Lead Time (days)</label>
            <input type="number" min="0" value={productForm.leadTime} onChange={e=>setProductForm(p=>({...p,leadTime:e.target.value}))}
              placeholder="e.g. 7"
              className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-100"/>
          </div>
        </div>
        {/* Product Image */}
        <div>
          <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Product Image</label>
          <div className="flex items-center gap-3">
            {productForm.imageUrl ? (
              <div className="relative w-16 h-16 rounded-xl overflow-hidden border-2 border-purple-200 flex-shrink-0">
                <img src={productForm.imageUrl} alt="Product" className="w-full h-full object-cover"/>
                <button onClick={()=>setProductForm(p=>({...p,imageUrl:''}))}
                  className="absolute top-0.5 right-0.5 w-5 h-5 rounded-full bg-red-600 text-white flex items-center justify-center text-xs font-bold hover:bg-red-700">✕</button>
              </div>
            ) : (
              <div className="w-16 h-16 rounded-xl border-2 border-dashed border-gray-200 flex items-center justify-center flex-shrink-0 bg-gray-50">
                <svg width="20" height="20" fill="none" stroke="#9CA3AF" viewBox="0 0 24 24" strokeWidth={1.5}><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              </div>
            )}
            <div className="flex-1">
              <button onClick={()=>uploadToCloudinary()} disabled={uploadingImage}
                className="w-full py-2 px-4 rounded-lg border-2 border-dashed border-purple-200 text-sm font-semibold text-purple-600 hover:border-purple-400 hover:bg-purple-50 transition-colors flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                {uploadingImage ? (
                  <><svg className="animate-spin" width="14" height="14" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg> Uploading...</>
                ) : (
                  <><svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg> {productForm.imageUrl ? 'Change Image' : 'Upload Image'}</>
                )}
              </button>
              <p className="text-xs text-gray-400 mt-1 text-center">JPG, PNG, WEBP — uploads to Cloudinary</p>
            </div>
          </div>
        </div>
        {/* Description */}
        <div>
          <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Description</label>
          <textarea value={productForm.description} onChange={e=>setProductForm(p=>({...p,description:e.target.value}))}
            placeholder="Optional product description..."
            rows={3}
            className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-100 resize-none"/>
        </div>
      </div>
      {/* Footer */}
      <div className="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-100 bg-gray-50">
        <button onClick={()=>{setShowAddProduct(false);setEditingProduct(null);resetProductForm();}}
          className="px-5 py-2 rounded-lg border border-gray-200 text-sm font-semibold text-gray-600 hover:bg-gray-100 transition-colors">
          Cancel
        </button>
        <button onClick={saveProduct}
          className="px-6 py-2 rounded-lg bg-purple-600 hover:bg-purple-700 text-white text-sm font-bold transition-colors flex items-center gap-2">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>
          {editingProduct ? 'Save Changes' : 'Add Product'}
        </button>
      </div>
    </div>
  </div>
)}

{/* ══ VIEW PRODUCT INFO MODAL ══ */}
{showProductInfo && selectedProductInfo && (
  <div className="fixed inset-0 z-50 flex items-center justify-center" style={{background:'rgba(0,0,0,0.55)',backdropFilter:'blur(4px)'}}>
    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[92vh] flex flex-col overflow-hidden">
      {/* Header */}
      <div style={{background:'linear-gradient(135deg,#7C3AED,#5B21B6)'}} className="px-6 py-5 flex items-start justify-between">
        <div className="flex items-start gap-4 flex-1 min-w-0">
          {selectedProductInfo.imageUrl && (
            <img src={selectedProductInfo.imageUrl} alt={selectedProductInfo.name}
              className="w-14 h-14 rounded-xl object-cover flex-shrink-0 border-2 border-white border-opacity-30"/>
          )}
          <div className="flex-1 min-w-0">
            <span className="text-xs font-bold text-purple-200 uppercase tracking-widest">Product Record</span>
            <h3 className="text-xl font-black text-white truncate">{selectedProductInfo.name}</h3>
            <p className="text-purple-200 text-xs font-mono mt-1">{selectedProductInfo.sku}</p>
          </div>
        </div>
        <button onClick={()=>{setShowProductInfo(false);setSelectedProductInfo(null);}}
          className="w-8 h-8 rounded-lg bg-white bg-opacity-20 flex items-center justify-center text-white hover:bg-opacity-30 transition-colors flex-shrink-0 ml-4">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      {/* Stock badge */}
      <div className="px-6 py-3 border-b border-gray-100 flex items-center gap-3">
        {selectedProductInfo.stock === 0
          ? <span className="px-3 py-1 rounded-full text-xs font-black bg-red-100 text-red-700">OUT OF STOCK</span>
          : selectedProductInfo.stock <= (selectedProductInfo.threshold || 10)
          ? <span className="px-3 py-1 rounded-full text-xs font-black bg-amber-100 text-amber-700">LOW STOCK — {selectedProductInfo.stock} remaining</span>
          : <span className="px-3 py-1 rounded-full text-xs font-black bg-green-100 text-green-700">IN STOCK — {selectedProductInfo.stock} {selectedProductInfo.unit||'pcs'}</span>
        }
        <span className="text-xs text-gray-400">{selectedProductInfo.category || 'Uncategorized'}</span>
      </div>
      {/* Details */}
      <div className="flex-1 overflow-y-auto p-6">
        <div className="grid grid-cols-2 gap-4 mb-5">
          {[
            ['Unit Price', `₱${parseFloat(selectedProductInfo.price||0).toLocaleString('en-PH',{minimumFractionDigits:2})}`],
            ['Stock', `${selectedProductInfo.stock ?? '—'} ${selectedProductInfo.unit||'pcs'}`],
            ['Reorder Threshold', selectedProductInfo.threshold ?? '—'],
            ['Min. Order Qty', selectedProductInfo.moq ?? '—'],
            ['Supplier', selectedProductInfo.supplier || '—'],
            ['Lead Time', selectedProductInfo.leadTime ? `${selectedProductInfo.leadTime} days` : '—'],
          ].map(([label, value]) => (
            <div key={label} className="bg-gray-50 rounded-xl p-3">
              <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">{label}</div>
              <div className="text-sm font-bold text-gray-800">{value}</div>
            </div>
          ))}
        </div>
        {selectedProductInfo.description && (
          <div className="mb-5">
            <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Description</div>
            <p className="text-sm text-gray-600 leading-relaxed bg-gray-50 rounded-xl p-3">{selectedProductInfo.description}</p>
          </div>
        )}
        <div className="border-t border-gray-100 pt-4 space-y-2">
          <div className="flex justify-between text-xs text-gray-400">
            <span>Created by</span>
            <span className="font-semibold text-gray-600">{selectedProductInfo.creatorName || '—'}</span>
          </div>
          <div className="flex justify-between text-xs text-gray-400">
            <span>Date added</span>
            <span className="font-semibold text-gray-600">
              {selectedProductInfo.createdAt?.toDate ? selectedProductInfo.createdAt.toDate().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) : '—'}
            </span>
          </div>
          <div className="flex justify-between text-xs text-gray-400">
            <span>Last updated</span>
            <span className="font-semibold text-gray-600">
              {selectedProductInfo.updatedAt?.toDate ? selectedProductInfo.updatedAt.toDate().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) : '—'}
            </span>
          </div>
        </div>
      </div>
      {/* Footer */}
      <div className="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-100 bg-gray-50">
        <button onClick={()=>{setShowProductInfo(false);setSelectedProductInfo(null);}}
          className="px-5 py-2 rounded-lg border border-gray-200 text-sm font-semibold text-gray-600 hover:bg-gray-100 transition-colors">
          Close
        </button>
        <button onClick={()=>{
            const p = products.find(x=>x.sku===selectedProductInfo.sku)||selectedProductInfo;
            setEditingProduct(p); setProductForm(p); setShowProductInfo(false); setShowAddProduct(true);
          }}
          className="px-5 py-2 rounded-lg bg-purple-600 hover:bg-purple-700 text-white text-sm font-bold transition-colors flex items-center gap-2">
          <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
          Edit Product
        </button>
      </div>
    </div>
  </div>
)}

{/* ══ DELETE PRODUCT CONFIRMATION MODAL ══ */}
{showDeleteProductModal && productToDelete && (
  <div className="fixed inset-0 z-50 flex items-center justify-center" style={{background:'rgba(0,0,0,0.6)',backdropFilter:'blur(6px)'}}>
    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
      {/* Red danger header */}
      <div style={{background:'linear-gradient(135deg,#DC2626,#991B1B)'}} className="px-6 py-5 text-center">
        <div className="w-14 h-14 rounded-full bg-white bg-opacity-20 flex items-center justify-center mx-auto mb-3">
          <svg width="28" height="28" fill="none" stroke="white" viewBox="0 0 24 24" strokeWidth={2}>
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
          </svg>
        </div>
        <h3 className="text-xl font-black text-white">Delete Product</h3>
        <p className="text-red-200 text-sm mt-1">This action is permanent and cannot be undone</p>
      </div>
      {/* Body */}
      <div className="px-6 py-6">
        <div className="bg-red-50 border border-red-200 rounded-xl p-4 mb-5">
          <div className="text-xs font-bold text-red-400 uppercase tracking-wider mb-1">Product to be deleted</div>
          <div className="font-black text-gray-900 text-base">{productToDelete.name}</div>
          <div className="text-xs font-mono text-gray-400 mt-0.5">{productToDelete.sku}</div>
          {productToDelete.stock > 0 && (
            <div className="mt-2 text-xs font-semibold text-amber-700 bg-amber-100 rounded-lg px-3 py-1.5">
              ⚠ This product still has {productToDelete.stock} {productToDelete.unit||'pcs'} in stock
            </div>
          )}
        </div>
        <p className="text-sm text-gray-600 text-center leading-relaxed">
          This item record will be <strong className="text-red-600">permanently deleted</strong> from the system. All associated data including stock levels and history will be removed.
        </p>
      </div>
      {/* Footer */}
      <div className="flex items-center gap-3 px-6 pb-6">
        <button onClick={()=>{setShowDeleteProductModal(false);setProductToDelete(null);}}
          className="flex-1 py-2.5 rounded-xl border-2 border-gray-200 text-sm font-bold text-gray-600 hover:bg-gray-50 transition-colors">
          No, Keep It
        </button>
        <button onClick={async()=>{
            setShowDeleteProductModal(false);
            await deleteProduct(productToDelete.id);
            setProductToDelete(null);
          }}
          className="flex-1 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white text-sm font-black transition-colors flex items-center justify-center gap-2">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
          Yes, Delete Permanently
        </button>
      </div>
    </div>
  </div>
)}




        </div>
        </main>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Dashboard />);
</script>
</body>
</html>
