                        setActivePOReview(fullPO);
                        setPendingApprovalQueue([]);
                      }
                    }}
                    style={{cursor:'pointer',background: idx%2===0?'#fff':'#FAFBFD',transition:'background .12s'}}
                    onMouseEnter={e => e.currentTarget.style.background = isOrderRow ? '#F5F3FF' : '#EFF6FF'}
                    onMouseLeave={e => e.currentTarget.style.background = idx%2===0?'#fff':'#FAFBFD'}
                  >
                    <td style={{padding:'11px 16px',borderBottom:'1px solid #F1F5F9',whiteSpace:'nowrap'}}>
                      <span style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:11,fontWeight:700,
                        color: isOrderRow ? '#7C3AED' : '#1D4ED8',
                        background: isOrderRow ? '#F5F3FF' : '#EFF6FF',
                        padding:'3px 10px',borderRadius:20}}>
                        {isOrderRow
                          ? <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1.5 7h13M10 21a1 1 0 100-2 1 1 0 000 2zm7 0a1 1 0 100-2 1 1 0 000 2z"/></svg>
                          : <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
                        }
                        {type}
                      </span>
                    </td>
                    <td style={{padding:'11px 16px',borderBottom:'1px solid #F1F5F9'}}>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <div style={{width:30,height:30,borderRadius:'50%',flexShrink:0,
                          background: isOrderRow ? 'linear-gradient(135deg,#7C3AED,#A855F7)' : iAmCreator ? 'linear-gradient(135deg,#059669,#10B981)' : 'linear-gradient(135deg,#1D4ED8,#6366F1)',
                          display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,color:'white',letterSpacing:.5}}>
                          {(from||'?').trim().split(' ').map(w=>w[0]).filter(Boolean).slice(0,2).join('').toUpperCase()}
                        </div>
                        <div>
                          <div style={{fontSize:12,fontWeight:700,color:'#1E293B',whiteSpace:'nowrap'}}>{from}</div>
                          <div style={{fontSize:10,color:'#94A3B8',marginTop:1}}>{isOrderRow ? 'Customer / User' : iAmCreator ? 'Purchaser' : 'Approver'}</div>
                        </div>
                      </div>
                    </td>
                    <td style={{padding:'11px 16px',borderBottom:'1px solid #F1F5F9'}}>
                      <div style={{fontSize:12,fontWeight:700,color:'#1E293B',display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                        {subject}
                        {revLabel && (
                          <span style={{fontSize:10,fontWeight:700,color:'#7C3AED',background:'#F3E8FF',padding:'2px 7px',borderRadius:10}}>
                            {revLabel}
                          </span>
                        )}
                        {isOrderRow && order.orderApprovalTotalSteps > 1 && (
                          <span style={{fontSize:10,fontWeight:700,color:'#7C3AED',background:'#F3E8FF',border:'1px solid #DDD6FE',padding:'2px 8px',borderRadius:10}}>
                            Step {(order.orderApprovalStepIndex||0)+1}/{order.orderApprovalTotalSteps}
                          </span>
                        )}
                      </div>
                      <div style={{fontSize:11,color:'#94A3B8',marginTop:2}}>
                        {isOrderRow ? (
                          <>
                            {order.items?.length||0} item{(order.items?.length||0)!==1?'s':''} ·{' '}
                            <span style={{color:'#0F766E',fontWeight:700}}>
                              ₱{(order.totalAmount||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}
                            </span>
                            {order.orderApprovalGroupName && (
                              <span style={{marginLeft:8,color:'#7C3AED',fontWeight:600}}>via {order.orderApprovalGroupName}</span>
                            )}
                          </>
                        ) : (
                          <>
                            Supplier: <span style={{color:'#475569',fontWeight:600}}>{po.supplierName||'—'}</span>
                            {po.grandTotal != null && (
                              <span style={{marginLeft:8,color:'#0F766E',fontWeight:700}}>
                                ₱{(po.grandTotal||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}
                              </span>
                            )}
                          </>
                        )}
                      </div>
                    </td>
                    <td style={{padding:'11px 16px',borderBottom:'1px solid #F1F5F9',whiteSpace:'nowrap'}}>
                      <span style={{fontSize:12,color:'#475569',fontVariantNumeric:'tabular-nums'}}>{fmtDate(sentAt)}</span>
                    </td>
                    <td style={{padding:'11px 16px',borderBottom:'1px solid #F1F5F9',whiteSpace:'nowrap'}}>
                      <span style={{fontSize:12,color:'#475569',fontVariantNumeric:'tabular-nums'}}>{fmtDate(lastActivityAt)}</span>
                    </td>
                    <td style={{padding:'11px 16px',borderBottom:'1px solid #F1F5F9'}}>
                      <span style={{display:'inline-flex',alignItems:'center',gap:5,padding:'4px 11px',borderRadius:20,fontSize:11,fontWeight:700,background:sty.bg,color:sty.color,whiteSpace:'nowrap'}}>
                        <span style={{width:6,height:6,borderRadius:'50%',background:sty.dot,flexShrink:0}}/>
                        {statusLabel(actionLabel)}
                      </span>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}
// ── End Worklist Table ────────────────────────────────────────────────────────

// ── Shipping Settings Panel (needs own state for local edits) ─────────────────
function ShippingSettingsPanel({ shippingSettings, savingShipSettings, onSave }) {
  const [localSettings, setLocalSettings] = React.useState({...shippingSettings});
  // Sync if parent settings change (e.g. first load from Firestore)
  React.useEffect(() => { setLocalSettings({...shippingSettings}); }, [shippingSettings.receivedAfterDays]);
  return (
    <div className="bg-white rounded-xl shadow-lg p-6 max-w-lg space-y-5">
      <div>
        <div className="font-black text-gray-900 text-base mb-0.5">Shipping Settings</div>
        <div className="text-xs text-gray-500">Configure delivery confirmation and auto-complete rules</div>
      </div>
      <div className="space-y-4">
        <div>
          <label className="block text-sm font-bold text-gray-700 mb-1.5">
            Auto-enable "Mark as Received" after <span className="text-sky-600">{localSettings.receivedAfterDays ?? 7} days</span> of shipment
          </label>
          <div className="text-xs text-gray-500 mb-2">On the customer portal (my-orders), the "Mark as Received" button becomes available this many days after the order is shipped. Set to 0 to allow immediately.</div>
          <div className="flex items-center gap-3">
            <input type="range" min={0} max={30} value={localSettings.receivedAfterDays ?? 7}
              onChange={e => setLocalSettings(s => ({...s, receivedAfterDays: parseInt(e.target.value)}))}
              className="flex-1 accent-sky-500"/>
            <input type="number" min={0} max={30} value={localSettings.receivedAfterDays ?? 7}
              onChange={e => setLocalSettings(s => ({...s, receivedAfterDays: parseInt(e.target.value) || 0}))}
              className="w-16 px-2 py-1.5 border border-gray-300 rounded-lg text-sm text-center font-bold focus:ring-2 focus:ring-sky-400 outline-none"/>
            <span className="text-sm text-gray-500">days</span>
          </div>
        </div>
        <div className="border-t border-gray-100 pt-4">
          <label className="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" checked={!!localSettings.autoCompleteAfterReceived}
              onChange={e => setLocalSettings(s => ({...s, autoCompleteAfterReceived: e.target.checked}))}
              className="w-4 h-4 accent-sky-500 rounded"/>
            <div>
              <div className="text-sm font-bold text-gray-700">Auto-complete order when marked as Received</div>
              <div className="text-xs text-gray-500">Order status moves to Completed automatically once the customer confirms receipt</div>
            </div>
          </label>
        </div>
      </div>
      <button onClick={() => onSave(localSettings)} disabled={savingShipSettings}
        className="flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-sky-500 to-blue-600 text-white rounded-xl text-sm font-bold hover:shadow-md transition-all disabled:opacity-60">
        {savingShipSettings ? 'Saving…' : 'Save Settings'}
      </button>
    </div>
  );
}

function Dashboard() {


const ENCRYPTION_KEY = 'your-secret-key-change-this-in-production-use-env-variable';

const decryptData = (encryptedData) => {
  if (!encryptedData || encryptedData.trim() === '') return '';
  try {
    const bytes = CryptoJS.AES.decrypt(encryptedData, ENCRYPTION_KEY);
    return bytes.toString(CryptoJS.enc.Utf8) || '';
  } catch (e) {
    return '';
  }
};

    const WEBHOOK_SECRET = RENDER_CONFIG.WEBHOOK_SECRET;
    
    let endpoint = '';
    let body = {};
    
    if (type === 'invoice') {
      endpoint = '/webhook/send-invoice';
      body = {
        orderNumber: data.orderNumber,
        customerEmail: data.customerEmail,
        customerName: data.customerName,
        items: data.items,
        total: data.totalAmount,
        invoiceUrl: data.invoiceUrl || ''
      };
      
      console.log(`📧 Sending invoice email to customer: ${data.customerEmail}...`, body);
      
      const response = await fetch(`${RENDER_BACKEND_URL}${endpoint}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${WEBHOOK_SECRET}`
        },
        body: JSON.stringify(body)
      });
      
      if (!response.ok) {
        const errorText = await response.text();
        console.error('❌ Email notification failed:', errorText);
      } else {
        const result = await response.json();
        console.log('✅ Invoice email sent to customer:', result);
      }

      // Get the admin who created this product
      const db = firebase.firestore();

        // Get admin's email
        const adminDoc = await db.collection('users').doc(productData.createdBy).get();
        const adminEmail = adminDoc.data()?.email;
        
        if (adminEmail) {

          body = {

            productId: data.id,
            currentStock: data.stock,

            adminEmail: adminEmail

          const response = await fetch(`${RENDER_BACKEND_URL}${endpoint}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${WEBHOOK_SECRET}`
            },
            body: JSON.stringify(body)
          });
          
          if (!response.ok) {
            const errorText = await response.text();
            console.error(`❌ Email notification failed for ${adminEmail}:`, errorText);
          } else {
            const result = await response.json();
            console.log(`✅ Low-stock email sent to ${adminEmail}:`, result);
          }
        }
      }
      
    } else if (type === 'order-status') {
      // Only send to customer
      endpoint = '/webhook/order-status';
      body = {
        orderNumber: data.orderNumber,
        customerEmail: data.customerEmail,
        customerName: data.customerName,
        status: data.status,
        trackingUrl: data.trackingUrl || ''

        console.error('❌ Email notification failed:', errorText);
      } else {
        const result = await response.json();
        console.log('✅ Order status email sent to customer:', result);
      }
    }

    console.error('❌ Email error:', error);
  }
};

useEffect(() => {

    const db = firebase.firestore();
    // Load shipping settings
    db.collection('shippingSettings').doc(user.uid).get().then(doc => {
      if (doc.exists) setShippingSettings(s => ({...s, ...doc.data()}));
    }).catch(()=>{});
    // Load courier registry (global, not per-supplier)
    db.collection('courierRegistry').where('adminId','==',user.uid).get().then(snap => {
      setCourierRegistry(snap.docs.map(d=>({id:d.id,...d.data()})));
    }).catch(()=>{});
    // Load orders that are ready_for_shipment OR shipped
    db.collection('orders')
      .where('status','in',['ready_for_shipment','shipped'])
      .orderBy('createdAt','desc').get().then(snap => {
        setShippingOrders(snap.docs.map(d=>({id:d.id,...d.data()})));
      }).catch(()=>{
        db.collection('orders').get().then(snap => {
          const relevant = snap.docs.map(d=>({id:d.id,...d.data()}))
            .filter(o=>o.status==='ready_for_shipment'||o.status==='shipped')
            .sort((a,b)=>(b.createdAt?.toMillis?.()??0)-(a.createdAt?.toMillis?.()??0));
          setShippingOrders(relevant);
        }).catch(()=>{});
      });
  }
}, [activeModule, user?.uid, userRole]);

const loadDashboardData = async (userId, role, db) => {
  try {
    // ── Get admin's own company name first ──
    const adminDoc = await db.collection('users').doc(userId).get();
    const myCompany = adminDoc.data()?.companyName || '';

    // ── Products: shared across all admins in the same company ──
    // Strategy: find all admin UIDs in the same company, then load all their products.
    // This works with existing data — no companyName field needed on products.
    let companyAdminIds = [userId]; // always include self
    if (myCompany) {
      try {
        const coAdminsSnap = await db.collection('users')
          .where('role', '==', 'admin')
          .where('companyName', '==', myCompany)
          .get();
        companyAdminIds = [...new Set(coAdminsSnap.docs.map(d => d.id))];
        if (!companyAdminIds.includes(userId)) companyAdminIds.push(userId);
        console.log('🏢 Company admins found:', companyAdminIds.length, 'for company:', myCompany);
      } catch(e) {
        console.warn('Could not load company admins, using own only:', e.message);
      }
    }

    // Firestore 'in' supports up to 30 items — chunk if needed
    let allProductDocs = [];
    const adminChunks = [];
    for (let i = 0; i < companyAdminIds.length; i += 30) {
      adminChunks.push(companyAdminIds.slice(i, i + 30));
    }
    for (const chunk of adminChunks) {
      try {
        const snap = await db.collection('products').where('createdBy', 'in', chunk).get();
        snap.docs.forEach(d => allProductDocs.push(d));
      } catch(e) {
        console.warn('Products chunk query failed:', e.message);
      }
    }

    const productsData = allProductDocs
      .map(doc => ({ id: doc.id, ...doc.data() }))
      .sort((a, b) => {
        if (!a.createdAt || !b.createdAt) return 0;
        return b.createdAt.toMillis() - a.createdAt.toMillis();
      });
    setProducts(productsData);

    // ── Orders: all orders containing products from ANY admin in this company,
    //    plus pending_approval orders assigned to this admin as approver ──
    // companyProductIds covers all products across all admins in the same company
    const companyProductIds = new Set(productsData.map(p => p.id));
    const ordersSnapshot = await db.collection('orders').orderBy('createdAt', 'desc').get();
    const ordersData = ordersSnapshot.docs
      .map(doc => ({ id: doc.id, ...doc.data() }))
      .filter(order =>
        // Any order containing items from this company's product catalog
        order.items?.some(item => companyProductIds.has(item.productId)) ||
        // Pending-approval orders explicitly assigned to this admin as approver
        (order.status === 'pending_approval' && order.assignedApproverId === userId) ||
        // Pending-approval orders with no specific approver assigned (any admin who isn't the issuer)
        (order.status === 'pending_approval' && !order.assignedApproverId &&
          order.customerId !== userId && order.userId !== userId)
      );
    setOrders(ordersData);

    const outOfStockProducts = productsData.filter(p => p.stock === 0);
    const lowStockProducts   = productsData.filter(p => p.stock > 0 && p.stock <= p.threshold);
    const pendingOrdersCount   = ordersData.filter(o => o.status === 'pending').length;
    const completedOrdersCount = ordersData.filter(o => o.status === 'completed').length;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const todaySalesTotal = ordersData
      .filter(o => o.createdAt && o.createdAt.toDate() >= today && o.status !== 'cancelled')
      .reduce((sum, o) => sum + (o.totalAmount || 0), 0);

    setStats({
      totalProducts: productsData.length,
      lowStock: lowStockProducts.length,
      outOfStock: outOfStockProducts.length,
      pendingOrders: pendingOrdersCount,
      todaySales: todaySalesTotal,
      totalOrders: ordersData.length,
      completedOrders: completedOrdersCount,
    });
    setRecentOrders(ordersData.slice(0, 5));
    setLowStockItems(lowStockProducts.slice(0, 5));
    setOutOfStockItems(outOfStockProducts.slice(0, 5));

    await loadNotifications(db, userId, 'admin');
    await loadSuppliers(db, userId);
    await loadInvoiceSettings(db, userId);
    await loadInventorySettings(db, userId);
    await loadLayoutConfig(db, userId);
    await loadExchangeRates(db, userId);
    await loadPurchaseOrders(db, userId);
    await loadPOLayoutConfig(db, userId);

    try {
      // myCompany already loaded above
      if (myCompany) {
        const featSnap = await db.collection('systemSettings').doc('companyFeatures').get();
        const enabled = featSnap.exists && featSnap.data()?.[myCompany]?.userDirectory === true;
        setUserDirectoryEnabled(enabled);
        const featData = featSnap.exists ? (featSnap.data()?.[myCompany] || {}) : {};
        setFinancialMonitoringEnabled(!!featData.financialMonitoring);
        setPayablesEnabled(!!featData.payables);
        setFinancialReportsEnabled(!!featData.financialReports);
        if (enabled) {
          // Load users assigned to THIS admin via userAdminAssignments
          const assignSnap = await db.collection('userAdminAssignments')
            .where('adminId', '==', userId)
            .get();
          const assignedUserIds = assignSnap.docs.map(d => d.data().userId);

          if (assignedUserIds.length > 0) {
            // Firestore 'in' query supports up to 30 items
            const chunks = [];
            for (let i = 0; i < assignedUserIds.length; i += 30) {
              chunks.push(assignedUserIds.slice(i, i + 30));
            }
            const userDocs = [];
            for (const chunk of chunks) {
              const snap = await db.collection('users')
                .where(firebase.firestore.FieldPath.documentId(), 'in', chunk)
                .get();
              snap.docs.forEach(d => userDocs.push({ id: d.id, ...d.data() }));
            }
            setCompanyUsers(userDocs);
          } else {
            setCompanyUsers([]);
          }
        } else {
          setCompanyUsers([]);
        }
      }
    } catch(e) { console.warn('Feature flag load error:', e); }

  } catch (error) {

};

const calculateSupplierCompletion = (supplier) => {
  const fields = [
    // Basic Info - 7 fields
    supplier.name,
    supplier.contactPerson,
    supplier.email,
    supplier.address,
    supplier.paymentTerms,
    supplier.currency,
    supplier.modeOfShipment,
    
    // Company Profile - 5 fields
    supplier.registrationNumber,
    supplier.dateEstablished,
    supplier.businessType,
    supplier.industry,
    supplier.phoneNumber,
    
    // Tax Information - 1 field (TIN OR VAT)
    supplier.taxId || supplier.vatNumber ? 'filled' : '',
    
    // Financial Details - 2 fields (Bank Name + Account Holder + one of Account/IBAN)
    supplier.bankName,
    supplier.accountHolderName,
    supplier.accountNumber || supplier.iban ? 'filled' : ''
  ];
  
  const filledFields = fields.filter(field => field && String(field).trim() !== '').length;
  const totalFields = fields.length;
  const percentage = Math.round((filledFields / totalFields) * 100);
  
  return { percentage, filledFields, totalFields };
};

const saveExchangeRates = async () => {
  try {
    setSavingRates(true);
    const db = firebase.firestore();

    // Load previous rates for change log
    const prevDoc = await db.collection('exchangeRates').doc(user.uid).get();
    const prevRates = prevDoc.exists ? prevDoc.data().rates || {} : {};

    // Find changed currencies
    const changedCurrencies = Object.keys(exchangeRateForm).filter(currency => {
      const newVal = parseFloat(exchangeRateForm[currency]);
      const oldVal = parseFloat(prevRates[currency] || 0);
      return !isNaN(newVal) && newVal > 0 && newVal !== oldVal;
    });

    if (changedCurrencies.length === 0) {
      alert('No rate changes detected.');
      setSavingRates(false);
      return;
    }

    // Save new rates
    await db.collection('exchangeRates').doc(user.uid).set({
      rates: { ...prevRates, ...Object.fromEntries(
        Object.entries(exchangeRateForm).filter(([k, v]) => v !== '' && !isNaN(parseFloat(v)))
          .map(([k, v]) => [k, parseFloat(v)])
      )},
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: user.displayName
    }, { merge: true });

    // Create a notification for each changed currency
    for (const currency of changedCurrencies) {
      const oldVal = parseFloat(prevRates[currency] || 0);
      const newVal = parseFloat(exchangeRateForm[currency]);
      const changeDirection = newVal > oldVal ? '↑' : '↓';
      const now = new Date();
      const formattedDate = now.toLocaleDateString('en-US', {
        year: 'numeric', month: 'long', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });

      await db.collection('notifications').add({
        type: 'exchange-rate-update',
        message: `${currency}/PHP rate updated ${changeDirection} — ${formattedDate}`,
        details: {
          currency,
          previousRate: oldVal > 0 ? oldVal : 'Not set',
          newRate: newVal,
          changeDirection,
          updatedBy: user.displayName,
          updatedAt: formattedDate,
          summary: `1 ${currency} = ₱${newVal.toFixed(4)} (was ${oldVal > 0 ? '₱' + oldVal.toFixed(4) : 'not set'})`
        },
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        read: false,
        userId: user.uid,
        userRole: 'admin'
      });
    }

    setExchangeRates(prev => ({
      ...prev,
      ...Object.fromEntries(
        Object.entries(exchangeRateForm)
          .filter(([k, v]) => v !== '' && !isNaN(parseFloat(v)))
          .map(([k, v]) => [k, parseFloat(v)])
      )
    }));

    await loadNotifications(db, user.uid, userRole);
    setShowExchangeRateModal(false);
    setSavingRates(false);
    alert(`Exchange rates updated successfully for: ${changedCurrencies.join(', ')}`);
  } catch (error) {
    console.error('Error saving exchange rates:', error);
    alert('Error saving exchange rates. Please try again.');
    setSavingRates(false);
  }
};

const convertToPhp = (amount, currency) => {
  if (!currency || currency === 'PHP') return amount;
  const rate = parseFloat(exchangeRates[currency]);
  if (!rate || isNaN(rate)) return null; // null means rate not set
  return amount * rate;
};

const getTotalRevenueInPhp = () => {
  let total = 0;
  let hasUnknownRate = false;
  orders.filter(o => o.status !== 'cancelled').forEach(order => {
    if (!order.items) return;
    order.items.forEach(item => {
      const product = products.find(p => p.id === item.productId);
      const currency = product?.currency || 'PHP';
      const subtotalInPhp = convertToPhp(item.subtotal, currency);
      if (subtotalInPhp === null) {
        hasUnknownRate = true;
      } else {
        total += subtotalInPhp;
      }
    });
  });
  return { total, hasUnknownRate };
};

const getTodaySalesInPhp = () => {
  const today = new Date();

  const getTimeAgo = (timestamp) => {
    if (!timestamp) return 'Just now';
    
    const now = new Date();
    const time = timestamp.toDate();
    const diffMs = now - time;
    const diffMins = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMs / 3600000);
    const diffDays = Math.floor(diffMs / 86400000);
    
    if (diffMins < 1) return 'Just now';
    if (diffMins < 60) return `${diffMins}m ago`;
    if (diffHours < 24) return `${diffHours}h ago`;
    return `${diffDays}d ago`;
  };

const sortProducts = () => {
  const sorted = [...filteredProducts].sort((a, b) => {
    let aValue = a[productSortConfig.key] || '';
    let bValue = b[productSortConfig.key] || '';
    
    aValue = String(aValue).toLowerCase();
    bValue = String(bValue).toLowerCase();
    
    if (aValue < bValue) {
      return productSortConfig.direction === 'asc' ? -1 : 1;
    }
    if (aValue > bValue) {
      return productSortConfig.direction === 'asc' ? 1 : -1;
    }
    return 0;
  });
  return sorted;
};

const updateOrderStatus = async (orderId, newStatus, packedQuantities) => {
    try {
      const db = firebase.firestore();
      const order = orders.find(o => o.id === orderId);
      if (!order) return;

      if (newStatus === 'cancelled' && order.status === 'cancelled') {
        alert('This order is already cancelled.'); return;
      }
      if (newStatus === 'cancelled' && order.status === 'completed') {
        if (!confirm('This order is already completed. Are you sure you want to cancel it?')) return;
      }

      // ── STOCK LOGIC ──
      // Stock deducted when order is marked "packed" (committed to fulfillment).
      // Cancelling a packed/shipped/completed order restores stock.
      const stockDeductStatuses = ['packed','ready_for_shipment','shipped','completed'];
      const wasPacked  = stockDeductStatuses.includes(order.status);
      const willPack   = newStatus === 'packed';
      const isCancelling = newStatus === 'cancelled';

      const tsField = {
        confirmed:          'confirmedAt',
        processing:         'processingAt',
        packed:             'packedAt',
        ready_for_shipment: 'readyAt',
        shipped:            'shippedAt',
        completed:          'completedAt',
        cancelled:          'cancelledAt',
      }[newStatus] || 'updatedAt';

      // Resolve quantities: use per-item packed quantities if provided, else full order quantities
      const getQty = (item) => {
        if (packedQuantities && packedQuantities[item.productId] !== undefined) {
          return parseInt(packedQuantities[item.productId]) || 0;
        }
        return item.quantity;
      };

      const batch = db.batch();

      if (willPack && !wasPacked) {
        // Deduct stock — goods committed/packed from warehouse
        (order.items || []).forEach(item => {
          if (item.productId && getQty(item) > 0) {
            batch.update(db.collection('products').doc(item.productId), {
              stock: firebase.firestore.FieldValue.increment(-getQty(item))
            });
          }
        });
        batch.update(db.collection('orders').doc(orderId), {
          status: newStatus,
          packedQuantities: packedQuantities || null,
          processedBy: user.uid,
          processedByName: user.displayName || user.email,
          [tsField]: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } else if (isCancelling && wasPacked) {
        // Restore stock — cancelling after goods were packed/shipped
        (order.items || []).forEach(item => {
          if (item.productId) {
            const qty = order.packedQuantities?.[item.productId] ?? item.quantity;
            batch.update(db.collection('products').doc(item.productId), {
              stock: firebase.firestore.FieldValue.increment(parseInt(qty)||0)
            });
          }
        });
        batch.update(db.collection('orders').doc(orderId), {
          status: newStatus,
          processedBy: user.uid,
          processedByName: user.displayName || user.email,
          [tsField]: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } else {
        batch.update(db.collection('orders').doc(orderId), {
          status: newStatus,
          processedBy: user.uid,
          processedByName: user.displayName || user.email,
          [tsField]: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }

      await batch.commit();

      await db.collection('adminLogs').add({
        adminId: user.uid, adminName: user.displayName,
        action: 'Updated Order Status',
        details: `Changed order ${order.orderNumber} status to ${newStatus}`,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      // Customer notification
      const customerNotificationData = {
        type: 'order-status',
        message: `Your order ${order.orderNumber} is now ${newStatus.replace(/_/g,' ')}`,
        details: {
          orderNumber: order.orderNumber,
          customerName: order.customerName,
          oldStatus: order.status,
          newStatus: newStatus,
    totalAmount: order.totalAmount
  },
  timestamp: firebase.firestore.FieldValue.serverTimestamp(),
  read: false,
  userId: order.customerId, // ← This is the customer's ID, not the admin
  userRole: 'user'
};

const confirmOrder = async (orderId) => {
  try {
    const db = firebase.firestore();
    const order = orders.find(o => o.id === orderId);
    if (!order) return;
    const confirmedByName = user.displayName || user.email;
    const now = firebase.firestore.FieldValue.serverTimestamp();

    // Check for Order Approval Group
    let approvalGroup = null;
    let approvalStep = null;
    try {
      const agSnap = await db.collection('approvalGroups').where('docType','==','Order').where('active','==',true).get();
      const adminDoc = await db.collection('users').doc(user.uid).get();
      const userCompany = adminDoc.data()?.companyName || '';
      const groups = agSnap.docs.map(d=>({id:d.id,...d.data()}));
      approvalGroup = groups.find(g=>g.companyName===userCompany) || groups.find(g=>!g.companyName||g.companyName==='');
      if (approvalGroup) {
        const amountMatch = !approvalGroup.requiresAmount || (order.totalAmount>=(approvalGroup.minAmount||0) && (!approvalGroup.maxAmount||order.totalAmount<=approvalGroup.maxAmount));
        if (!amountMatch) approvalGroup = null;
      }
      if (approvalGroup) approvalStep = approvalGroup.steps?.[0] || null;
    } catch(e) { console.warn('Could not load order approval groups:', e); }

    if (approvalGroup && !approvalGroup.bypassAllowed) {
      // Route to approval chain
      await db.collection('orders').doc(orderId).update({
        status: 'pending_approval', confirmedAt: now, confirmedBy: user.uid, confirmedByName: confirmedByName,
        orderApprovalGroupId: approvalGroup.id, orderApprovalGroupName: approvalGroup.name,
        orderApprovalStepIndex: 0, orderApprovalTotalSteps: approvalGroup.steps?.length || 1,
        assignedApproverId: approvalStep?.approverAdminId || null,
        assignedApproverRole: approvalStep?.approverRole || null,
        assignedApproverName: approvalStep?.approverName || null,
        orderApprovalStatus: 'pending_approval', orderApprovalHistory: [], updatedAt: now,
      });
      try {
        const nb = db.batch();
        if (approvalStep?.approverAdminId) {
          nb.set(db.collection('notifications').doc(), {
            type: 'order-approval-request',
            message: `Order ${order.orderNumber} from ${order.customerName} requires your approval`,
            details: { orderNumber:order.orderNumber, customerName:order.customerName, totalAmount:order.totalAmount, status:'pending_approval', orderId },
            timestamp: now, read: false, userId: approvalStep.approverAdminId, userRole:'admin'
          });
        } else {
          const admSnap = await db.collection('users').where('role','==','admin').get();
          admSnap.docs.forEach(a => {
            if (a.id === user.uid) return;
            const matchesRole = !approvalStep?.approverRole || a.data().assignedRoleName === approvalStep.approverRole;
            if (matchesRole) nb.set(db.collection('notifications').doc(), {
              type: 'order-approval-request',
              message: `Order ${order.orderNumber} from ${order.customerName} requires approval`,
              details: { orderNumber:order.orderNumber, customerName:order.customerName, totalAmount:order.totalAmount, status:'pending_approval', orderId },
              timestamp: now, read: false, userId: a.id, userRole:'admin'
            });
          });
        }
        await nb.commit();
      } catch(e) { console.warn('Notif error:', e); }
    } else {
      // No approval group — go directly to processing
      await db.collection('orders').doc(orderId).update({
        status: 'processing', confirmedAt: now, confirmedBy: user.uid, confirmedByName: confirmedByName,
        processingAt: now, processedBy: user.uid, processedByName: confirmedByName, updatedAt: now,
      });
      try {
        await db.collection('notifications').add({
          type: 'order-status', message: `Your order ${order.orderNumber} is confirmed and now being processed`,
          details: { orderNumber:order.orderNumber, status:'processing' },
          timestamp: now, read: false, userId: order.customerId||order.userId, userRole:'user'
        });
      } catch(e) { console.warn(e); }
    }
    await loadDashboardData(user.uid, userRole, db);
    setAutoCreateExpandedId(null);
  } catch(e) { console.error('confirmOrder error:', e); alert('Error confirming order: ' + e.message); }
};

const requestOrderCancellation = async (orderId, reason) => {
  try {
    const db = firebase.firestore();
    const order = orders.find(o => o.id === orderId);
    
    if (!order) {
      alert('Order not found');
      return;
    }
    
    if (order.status === 'cancelled') {
      alert('This order is already cancelled');
      return;
    }
    
    if (order.status === 'completed') {
      alert('Cannot cancel a completed order. Please contact support.');
      return;
    }
    
    // Create cancellation request
    await db.collection('cancellationRequests').add({
      orderId: order.id,
      orderNumber: order.orderNumber,
      customerId: user.uid,
      customerName: order.customerName,
      customerEmail: order.customerEmail,
      reason: reason,
      status: 'pending',
      requestedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    
    // Update order with cancellation request flag
    await db.collection('orders').doc(orderId).update({
      cancellationRequested: true,
      cancellationReason: reason,
      cancellationRequestedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    
    // Create notification for user first (this will always succeed)
    await db.collection('notifications').add({
      type: 'cancellation-request',
      message: `Cancellation request submitted for order ${order.orderNumber}`,
      details: {
        orderNumber: order.orderNumber,
        status: 'pending review'
      },
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      read: false,
      userId: user.uid,
      userRole: userRole
    });
    
    // Try to notify admins (non-critical - don't fail if this doesn't work)
    try {
      const adminsSnapshot = await db.collection('users')
        .where('role', '==', 'admin')
        .get();
      
      // Create individual notification documents for each admin
      for (const adminDoc of adminsSnapshot.docs) {
        await db.collection('notifications').add({
          type: 'cancellation-request',
          message: `Cancellation request for order ${order.orderNumber}`,
          details: {
            orderNumber: order.orderNumber,
            customerName: order.customerName,
            reason: reason,
            orderId: order.id
          },
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          read: false,
          userId: adminDoc.id,
          userRole: 'admin'
        });
      }
      console.log('✅ Admin notifications created successfully');
    } catch (notifError) {
      console.warn('⚠️ Failed to create admin notifications (non-critical):', notifError);
      // Don't fail the whole operation if admin notifications fail
    }
    
    await loadDashboardData(user.uid, userRole, db);
    setShowCancelRequest(false);
    setCancelReason('');
    alert('Cancellation request submitted successfully. An admin will review it soon.');
  } catch (error) {
    console.error('Error requesting cancellation:', error);
    alert('Error submitting cancellation request: ' + error.message);
  }
};


const submitPurchaseOrder = async () => {
  if (poCart.length === 0) {
    alert('Please add items to the purchase order');
    return;
  }
  if (!poForm.supplierId || !poForm.deliveryAddress) {
    alert('Please select a supplier and enter delivery address');
    return;
  }
  if (submittingPO) return;

  try {
    setSubmittingPO(true);
    const db = firebase.firestore();

    const counterRef = db.collection('counters').doc('poCounter');
    let poCount = 1;
    const counterDoc = await counterRef.get();
    if (counterDoc.exists) {
      poCount = counterDoc.data().count + 1;
      await counterRef.update({ count: firebase.firestore.FieldValue.increment(1) });
    } else {
      await counterRef.set({ count: 1 });
    }

    const poNumber = `PO-${String(poCount).padStart(4, '0')}`;
    const subtotal = poCart.reduce((sum, item) => sum + (item.unitCost * item.quantity), 0);
    const shippingCost = parseFloat(poForm.shippingCost) || 0;
    const discount = parseFloat(poForm.discount) || 0;
const tax = 0;
const grandTotal = subtotal + shippingCost - discount;

    // ── Route PO to correct approver via approvalGroups ──────────────────────
    // 1. Find a matching approval group (docType=PO, active, amount in range)
    let assignedApproverId = null;
    let assignedApproverName = null;
    let approvalStatus = null;
    let matchedGroupId = null;
    let matchedGroupName = null;

    try {
      const agSnap = await db.collection('approvalGroups')
        .where('docType', '==', 'PO')
        .where('active', '==', true)
        .get();

      const matchingGroups = agSnap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(g => {
          const min = parseFloat(g.minAmount) || 0;
          const max = g.maxAmount ? parseFloat(g.maxAmount) : Infinity;
          return grandTotal >= min && grandTotal <= max;
        });

      if (matchingGroups.length > 0) {
        const group = matchingGroups[0];
        matchedGroupId   = group.id;
        matchedGroupName = group.name;
        const steps      = group.steps || [];

        // Role authority rank — higher = more senior
        const ROLE_RANK = {viewer:0,purchaser:1,supervisor:2,finance_manager:3,admin_approver:4};
        const getRank = (roleId) => {
          if (!roleId) return 0;
          return ROLE_RANK[roleId.toLowerCase().replace(/ /g,'_')] ?? 0;
        };
        const myRank = getRank(user?.assignedRole || '');

        // If the submitter outranks or equals every step — no approval needed
        const stepsAboveMe = steps.filter(s => s.approverRole && getRank(s.approverRole) > myRank);
        if (stepsAboveMe.length === 0) {
          // Submitter is top authority in this chain — auto-approved, no routing
          console.log('Submitter role rank', myRank, '— at or above all steps, no approval required');
        } else {
          // Walk steps — skip any at or below submitter's rank
          for (const step of steps) {
            if (!step.approverRole) continue;
            if (getRank(step.approverRole) <= myRank) continue; // skip lower/equal roles

            const roleSnap = await db.collection('users')
              .where('assignedRoleName', '==', step.approverRole)
              .get();

            const candidate = roleSnap.docs
              .map(d => ({ id: d.id, ...d.data() }))
              .find(u => u.id !== user.uid);

            if (candidate) {
              assignedApproverId   = candidate.id;
              assignedApproverName = candidate.fullName || candidate.displayName || candidate.email;
              approvalStatus       = 'pending_approval';
              break;
            }
          }
        }
      }
    } catch (routingErr) {
      console.warn('Approval routing failed (non-critical):', routingErr.message);
    }
    // ──────────────────────────────────────────────────────────────────────────

    const poData = {
      poNumber,
      supplierId: poForm.supplierId,
      supplierName: poForm.supplierName,
      supplierEmail: poForm.supplierEmail,
      supplierTaxId: poForm.supplierTaxId || '',
      supplierTaxRate: poForm.supplierTaxRate || '',
      deliveryAddress: poForm.deliveryAddress,
      expectedDeliveryDate: poForm.expectedDeliveryDate,
      paymentTerms: poForm.paymentTerms,
      currency: poForm.currency,
      notes: poForm.notes,
      shippingCost,
      discount,
      items: poCart.map(item => ({
        productId: item.id,
        productName: item.name,
        sku: item.sku,
        quantity: item.quantity,
        unit: item.unit,
        unitCost: item.unitCost,
        subtotal: item.unitCost * item.quantity
      })),
      subtotal,
      tax,
      grandTotal,
      status: 'submitted',
      // Approval routing fields
      approvalStatus: approvalStatus || 'no_approval_required',
      ...(assignedApproverId   && { assignedApproverId }),
      ...(assignedApproverName && { assignedApproverName }),
      ...(matchedGroupId       && { approvalGroupId: matchedGroupId }),
      ...(matchedGroupName     && { approvalGroupName: matchedGroupName }),
      // Track which step we are currently on (0-based index into the filtered steps array)
      approvalStepIndex: approvalStatus === 'pending_approval' ? 0 : null,
      createdBy: user.uid,
      createdByName: user.fullName || user.displayName || user.email,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    const poRef = await db.collection('purchaseOrders').add(poData);

    // Notify the creator
    await db.collection('notifications').add({
      type: 'purchase-order',
      message: `Purchase Order ${poNumber} submitted${assignedApproverName ? ' — awaiting approval from ' + assignedApproverName : ''}`,
      details: { poNumber, supplierName: poForm.supplierName, grandTotal, status: 'submitted', approver: assignedApproverName || null },
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      read: false,
      userId: user.uid,
      userRole: 'admin'
    });

    // Notify the assigned approver (if any)
    if (assignedApproverId) {
      await db.collection('notifications').add({
        type: 'purchase-order-approval-request',
        message: `PO ${poNumber} from ${user.fullName || user.displayName} needs your approval`,
        details: { poNumber, supplierName: poForm.supplierName, grandTotal, createdByName: user.fullName || user.displayName, status: 'pending_approval' },
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        read: false,
        userId: assignedApproverId,
        userRole: 'admin'
      });
    }

    await loadPurchaseOrders(db, user.uid);
    await loadNotifications(db, user.uid, userRole);

    setShowCreatePO(false);
    setPOCart([]);
    setPOForm({
      supplierId: '', supplierName: '', supplierEmail: '',
      deliveryAddress: '', expectedDeliveryDate: '', paymentTerms: '',
      currency: 'PHP', notes: '', shippingCost: '', discount: ''
    });

    alert(`Purchase Order ${poNumber} created successfully!`);
  } catch (error) {
    console.error('Error creating PO:', error);
    alert('Error creating purchase order: ' + error.message);
  } finally {
    setSubmittingPO(false);
  }
};



const revisePurchaseOrder = async (po, notes) => {
  try {
    setSubmittingRevision(true);
    const db = firebase.firestore();

    const currentRevision = po.revision || 0;
    const newRevision = currentRevision + 1;

    // Archive the current version snapshot with the layout that was active at creation time
    const archiveData = {
      ...po,
      archivedAt: firebase.firestore.FieldValue.serverTimestamp(),
      archivedRevision: currentRevision,
      isArchive: true
    };
    delete archiveData.id;

    await db.collection('purchaseOrderRevisions').add(archiveData);

    // Capture the CURRENT layout at the time of this revision (own or company-shared)
    let currentLayoutSnapshot = null;
    const layoutDoc = await db.collection('purchaseOrderLayouts').doc(user.uid).get();
    if (layoutDoc.exists) {
      currentLayoutSnapshot = layoutDoc.data();
    } else if (user.companyName) {
      try {
        const coAdminsSnap = await db.collection('users')
          .where('role', '==', 'admin')
          .where('companyName', '==', user.companyName)
          .get();
        for (const adminDoc of coAdminsSnap.docs) {
          if (adminDoc.id === user.uid) continue;
          const sharedLayout = await db.collection('purchaseOrderLayouts').doc(adminDoc.id).get();
          if (sharedLayout.exists) { currentLayoutSnapshot = sharedLayout.data(); break; }
        }
      } catch(e) { console.warn('Could not load shared layout for revision snapshot:', e); }
    }

    await db.collection('purchaseOrders').doc(po.id).update({
      revision: newRevision,
      revisionNotes: notes || '',
      revisedAt: firebase.firestore.FieldValue.serverTimestamp(),
      revisedBy: user.displayName,
      // Store a snapshot of the layout at the time of this revision
      layoutSnapshot: currentLayoutSnapshot,
      status: 'submitted', // Reset to submitted on revision
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    await db.collection('notifications').add({
      type: 'purchase-order',
      message: `PO ${po.poNumber} revised to Revision ${newRevision}`,
      details: {
        poNumber: po.poNumber,
        supplierName: po.supplierName,
        revision: newRevision,
        notes: notes || 'No notes provided'
      },
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      read: false,
      userId: user.uid,
      userRole: 'admin'
    });

    await loadPurchaseOrders(db, user.uid);
    await loadNotifications(db, user.uid, userRole);

    setShowRevisionModal(false);
    setPOToRevise(null);

const processReceipt = async () => {
  setReceivingSubmitting(true);
  try {
    const db = firebase.firestore();

    // Generate receipt number — fetch last receipt to increment
    const lastSnap = await db.collection('receipts').orderBy('receiptNumber','desc').limit(1).get();
    let nextNum = 30000000001;
    if (!lastSnap.empty) {
      const last = lastSnap.docs[0].data().receiptNumber;
      nextNum = (typeof last === 'number' ? last : parseInt(last)||30000000000) + 1;
    }
    const receiptNumber = nextNum;

    const checkedItems = receivingItems.filter(it => it.checked);
    if (checkedItems.length === 0) { alert('Please select at least one item to receive.'); setReceivingSubmitting(false); return; }

    // Write receipt doc (invoice details captured here)
    const invoiceDate = receivingHeader.invoiceDate || receivingHeader.shippedDate || '';
    await db.collection('receipts').add({
      receiptNumber,
      poId: receivingPO.id,
      poNumber: receivingPO.poNumber,
      supplierName: receivingPO.supplierName,
      supplierId: receivingPO.supplierId||'',
      supplierPaymentTerms: receivingPO.paymentTerms||'',
      createdBy: user.uid,
      createdByName: user.fullName||user.displayName||'',
      packingSlip: receivingHeader.packingSlip||'',
      shippedDate: receivingHeader.shippedDate||'',
      invoiceDate,
      invoiceNumber: receivingHeader.invoiceNumber||'',
      receiptMode: receivingHeader.receiptMode||'new',
      items: checkedItems.map(it => ({
        productId: it.productId,
        productName: it.productName,
        sku: it.sku,
        orderedQty: it.orderedQty,
        receivedQty: it.receivedQty,
      })),
      grandTotal: receivingPO.grandTotal||0,
      currency: receivingPO.currency||'PHP',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });

    // ── Update inventory stock for received items ──────────────────────────
    const batch = db.batch();
    for (const it of checkedItems) {
      if (it.productId) {
        batch.update(db.collection('products').doc(it.productId), {
          stock: firebase.firestore.FieldValue.increment(it.receivedQty),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      }
    }
    await batch.commit();

    // ── Set PO to "received" — update status AND write receivedQty back to items ──
    // Build updated items array: merge received quantities into original PO items
    const updatedItems = (receivingPO.items || []).map(poItem => {
      const received = checkedItems.find(ci =>
        ci.productId === poItem.productId ||
        ci.sku === poItem.sku ||
        ci.productName === poItem.productName
      );
      if (received) {
        return { ...poItem, receivedQty: (poItem.receivedQty || 0) + received.receivedQty };
      }
      return poItem;
    });

    await db.collection('purchaseOrders').doc(receivingPO.id).update({
      status: 'received',
      receivedAt: firebase.firestore.FieldValue.serverTimestamp(),
      receiptNumber,
      invoiceDate,
      invoiceNumber: receivingHeader.invoiceNumber||'',
      packingSlip: receivingHeader.packingSlip||'',
      items: updatedItems,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });

    // ── Notification ────────────────────────────────────────────────────────
    await db.collection('notifications').add({
      type: 'po-received',
      message: `PO ${receivingPO.poNumber} received & stock updated. Invoice now in Payables queue.`,
      details: { poNumber: receivingPO.poNumber, supplierName: receivingPO.supplierName, receiptNumber },
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      read: false,
      userRole: 'admin',
    });

    await loadPurchaseOrders(db, user.uid);
    setLastReceiptNumber(receiptNumber);
    setReceivingStep(4); // success screen
  } catch(e) {
    alert('Error processing receipt: ' + e.message);
    console.error(e);
  }
  setReceivingSubmitting(false);
};

const approvePO = async (poId, silent = false) => {
  try {
    const db = firebase.firestore();
    const po = purchaseOrders.find(p => p.id === poId);
    const myName = user.fullName || user.displayName || user.email;

    // Record this approver's action in history
    const historyEntry = {
      action: 'approved',
      reason: '',
      by: myName,
      byId: user.uid,
      byRole: user.assignedRoleName || '',
      stepIndex: po.approvalStepIndex ?? 0,
      at: new Date().toISOString(),
    };

    // ── Try to advance to next step in the chain ──────────────────────────────
    let nextApproverId   = null;
    let nextApproverName = null;
    let nextStepIndex    = null;
    let fullyApproved    = false;

    const ROLE_RANK = { viewer:0, purchaser:1, supervisor:2, finance_manager:3, admin_approver:4 };
    const getRank = r => ROLE_RANK[(r||'').toLowerCase().replace(/ /g,'_')] ?? 0;

    if (po.approvalGroupId) {
      try {
        const groupDoc = await db.collection('approvalGroups').doc(po.approvalGroupId).get();
        if (groupDoc.exists) {
          const group      = groupDoc.data();
          // A valid step has either a specific approver OR a role designation
          const allSteps   = (group.steps || []).filter(s => s.approverAdminId || s.approverRole);
          const currentIdx = po.approvalStepIndex ?? 0;

          // Look for the next step after the current one
          const remainingSteps = allSteps.slice(currentIdx + 1);

          if (remainingSteps.length === 0) {
            // No more steps — fully approved
            fullyApproved = true;
          } else {
            // Find the next step that has a real user assigned
            for (let i = 0; i < remainingSteps.length; i++) {
              const step = remainingSteps[i];

              // ── Specific approver takes priority over role lookup ──
              if (step.approverAdminId) {
                nextApproverId   = step.approverAdminId;
                nextApproverName = step.approverName || step.approverAdminId;
                nextStepIndex    = currentIdx + 1 + i;
                break;
              }

              // ── Role-based lookup ──
              const roleSnap = await db.collection('users')
                .where('assignedRoleName', '==', step.approverRole)
                .get();
              const candidate = roleSnap.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .find(u => u.id !== po.createdBy); // don't route back to creator

              if (candidate) {
                nextApproverId   = candidate.id;
                nextApproverName = candidate.fullName || candidate.displayName || candidate.email;
                nextStepIndex    = currentIdx + 1 + i;
                break;
              }
            }
            // If no user found for remaining steps, treat as fully approved
            if (!nextApproverId) fullyApproved = true;
          }
        } else {
          fullyApproved = true; // group deleted — just approve
        }
      } catch (routeErr) {
        console.warn('Approval chain routing error (non-fatal):', routeErr.message);
        fullyApproved = true;
      }
    } else {
      fullyApproved = true; // no group — single approver, done
    }
    // ─────────────────────────────────────────────────────────────────────────

    if (fullyApproved) {
      // ── All steps satisfied — mark PO fully approved ──
      await db.collection('purchaseOrders').doc(poId).update({
        status:            'approved',
        approvalStatus:    'approved',
        approvedAt:        firebase.firestore.FieldValue.serverTimestamp(),
        approvedById:      user.uid,
        approvedByName:    myName,
        approvalHistory:   firebase.firestore.FieldValue.arrayUnion(historyEntry),
        updatedAt:         firebase.firestore.FieldValue.serverTimestamp(),
      });

      // Notify creator: fully approved
      await db.collection('notifications').add({
        type: 'purchase-order',
        message: `PO ${po.poNumber} has been fully approved by ${myName}`,
        details: { poNumber: po.poNumber, supplierName: po.supplierName, status: 'approved' },
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        read: false,
        userId: po.createdBy,
        userRole: 'admin'
      });

      if (!silent) alert(`✅ PO ${po.poNumber} has been fully approved. All approval steps are complete.`);

    } else {
      // ── More steps remain — route to next approver ──
      await db.collection('purchaseOrders').doc(poId).update({
        status:              'pending_approval',
        approvalStatus:      'pending_approval',
        assignedApproverId:  nextApproverId,
        assignedApproverName: nextApproverName,
        approvalStepIndex:   nextStepIndex,
        approvalHistory:     firebase.firestore.FieldValue.arrayUnion(historyEntry),
        updatedAt:           firebase.firestore.FieldValue.serverTimestamp(),
        // Clear any old RFI so the next approver gets a clean slate
        lastRFI: null,
        lastRFIBy: null,
        lastRFIAt: null,
      });

      // Notify creator: step passed, still pending
      await db.collection('notifications').add({
        type: 'purchase-order',
        message: `PO ${po.poNumber} — Step ${(po.approvalStepIndex ?? 0) + 1} approved by ${myName}. Now awaiting ${nextApproverName}.`,
        details: { poNumber: po.poNumber, supplierName: po.supplierName, status: 'pending_approval', nextApprover: nextApproverName },
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        read: false,
        userId: po.createdBy,
        userRole: 'admin'
      });

      // Notify next approver
      await db.collection('notifications').add({
        type: 'purchase-order-approval-request',
        message: `PO ${po.poNumber} needs your approval (Step ${nextStepIndex + 1})`,
        details: { poNumber: po.poNumber, supplierName: po.supplierName, grandTotal: po.grandTotal, createdByName: po.createdByName, status: 'pending_approval' },
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        read: false,
        userId: nextApproverId,
        userRole: 'admin'
      });

      if (!silent) alert(`✅ Step ${(po.approvalStepIndex ?? 0) + 1} approved. PO ${po.poNumber} has been forwarded to ${nextApproverName} for the next approval step.`);
    }

    await loadPurchaseOrders(db, user.uid);
    await loadDashboardData(user.uid, userRole, db);
    setShowPOApprovalModal(false);
    setApprovalPO(null);
    setIsDenyMode(false);
    setDenyReason('');

  } catch (error) {
    console.error('Error approving PO:', error);
    alert('Error approving purchase order: ' + error.message);
  }
};

// ── Payment Due Date Calculator ───────────────────────────────────────────────
// Computes due date from invoice date + supplier payment term config
const computePaymentDueDate = (invoiceDateStr, config) => {
  if (!invoiceDateStr || !config) return null;
  const invoiceDate = new Date(invoiceDateStr + 'T00:00:00');
  if (isNaN(invoiceDate)) return null;
  const { days, mode, countType } = config;
  const numDays = parseInt(days) || 0;
  if (numDays === 0) return null;

  let startDate;
  if (mode === 'eom') {
    // EOM mode: count from last day of invoice month
    startDate = new Date(invoiceDate.getFullYear(), invoiceDate.getMonth() + 1, 0); // last day of month
  } else {
    // Standard mode: count from invoice date
    startDate = new Date(invoiceDate);
  }

  if (countType === 'working') {
    // Working days: skip weekends
    let count = 0;
    let cursor = new Date(startDate);
    while (count < numDays) {
      cursor.setDate(cursor.getDate() + 1);
      const dow = cursor.getDay();
      if (dow !== 0 && dow !== 6) count++; // skip Sun(0) and Sat(6)
    }
    return cursor;
  } else {
    // Calendar days
    const due = new Date(startDate);
    due.setDate(due.getDate() + numDays);
    return due;
  }
};

const fmtDueDate = (date) => {
  if (!date) return '—';
  return date.toLocaleDateString('en-PH', { year:'numeric', month:'short', day:'numeric' });
};

const daysUntilDue = (date) => {
  if (!date) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const due   = new Date(date); due.setHours(0,0,0,0);
  return Math.round((due - today) / 86400000);
};

      paymentTermConfig:  config || null,
      updatedAt:          firebase.firestore.FieldValue.serverTimestamp(),
    });

// ── Snapshot Helper ──────────────────────────────────────────────────────────
// Strips non-serialisable Firestore Timestamp objects so the snapshot can be
// stored as plain JSON in Firestore.
const sanitizeForSnapshot = (obj) => {
  if (obj === null || obj === undefined) return obj;
  if (typeof obj !== 'object') return obj;
  if (Array.isArray(obj)) return obj.map(sanitizeForSnapshot);
  // Firestore Timestamp → ISO string
  if (typeof obj.toDate === 'function') return obj.toDate().toISOString();
  const cleaned = {};
  for (const [k, v] of Object.entries(obj)) {
    cleaned[k] = sanitizeForSnapshot(v);
  }
  return cleaned;
};

// ── submitRequest (Snapshot Edition) ─────────────────────────────────────────
// Behaviour:
//   1. Filters the in-memory purchaseOrders array using the form criteria.
//   2. Saves a deep copy (snapshot) of the matching POs into Firestore under
//      the `reportSnapshots` collection, keyed by the auto-generated requestId.
//   3. The `requests` doc stores a `snapshotId` pointer to that snapshot doc.
//   4. When the user later views the report (via requestHistory), the app reads
//      from `reportSnapshots/<snapshotId>` – NOT from live `purchaseOrders`.
//      This means future edits to POs never mutate the saved report.
const submitRequest = async () => {
  setRequestSubmitting(true);
  try {
    const db = firebase.firestore();
    const uid = firebase.auth().currentUser?.uid;

    // ── 1. Assign sequential requestId ───────────────────────────────────────
    const snap = await db.collection('requests').orderBy('requestId','desc').limit(1).get();
    const lastId = snap.empty ? 0 : (snap.docs[0].data().requestId || 0);
    const newId = lastId + 1;

    // ── 2. Fetch matching POs directly from Firestore by poNumber ──────────────
    //    Query by exact poNumber field — no string comparison, no in-memory filter.
    //    This works for all users regardless of who created the PO.
    let matchingPOs = [];
    try {
      const poFrom = (requestForm.poFrom || '').trim();
      const poTo   = (requestForm.poTo   || '').trim();

      if (poFrom && poTo && poFrom === poTo) {
        // Single PO lookup — query by exact poNumber
        const snap = await db.collection('purchaseOrders')
          .where('poNumber', '==', poFrom).get();
        matchingPOs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      } else if (poFrom || poTo) {
        // Range — fetch all company POs then filter numerically
        const myUserDoc = await db.collection('users').doc(uid).get();
        const myCompany = myUserDoc.exists ? (myUserDoc.data().companyName || '') : '';
        let allPOs = [];
        if (myCompany) {
          const coSnap = await db.collection('users')
            .where('role', '==', 'admin')
            .where('companyName', '==', myCompany).get();
          const companyUids = [...new Set(coSnap.docs.map(d => d.id))];
          if (!companyUids.includes(uid)) companyUids.push(uid);
          for (let i = 0; i < companyUids.length; i += 30) {
            const chunk = companyUids.slice(i, i + 30);
            const s = await db.collection('purchaseOrders').where('createdBy','in',chunk).get();
            s.docs.forEach(d => allPOs.push({ id: d.id, ...d.data() }));
          }
        } else {
          const s = await db.collection('purchaseOrders').where('createdBy','==',uid).get();
          allPOs = s.docs.map(d => ({ id: d.id, ...d.data() }));
        }
        // Numeric comparison — strip non-digits and compare as integers
        const toNum = s => parseInt((s||'').replace(/\D/g,''), 10) || 0;
        const fromNum = poFrom ? toNum(poFrom) : 0;
        const toNum2  = poTo   ? toNum(poTo)   : Infinity;
        matchingPOs = allPOs.filter(po => {
          const n = toNum(po.poNumber);
          return n >= fromNum && n <= toNum2;
        });
      } else {
        // No PO filter — fetch all company POs
        const myUserDoc = await db.collection('users').doc(uid).get();
        const myCompany = myUserDoc.exists ? (myUserDoc.data().companyName || '') : '';
        if (myCompany) {
          const coSnap = await db.collection('users')
            .where('role', '==', 'admin')
            .where('companyName', '==', myCompany).get();
          const companyUids = [...new Set(coSnap.docs.map(d => d.id))];
          if (!companyUids.includes(uid)) companyUids.push(uid);
          for (let i = 0; i < companyUids.length; i += 30) {
            const chunk = companyUids.slice(i, i + 30);
            const s = await db.collection('purchaseOrders').where('createdBy','in',chunk).get();
            s.docs.forEach(d => matchingPOs.push({ id: d.id, ...d.data() }));
          }
        } else {
          const s = await db.collection('purchaseOrders').where('createdBy','==',uid).get();
          matchingPOs = s.docs.map(d => ({ id: d.id, ...d.data() }));
        }
      }
      console.log('📸 Snapshot query — matched:', matchingPOs.length, '| poFrom:', requestForm.poFrom, '| poTo:', requestForm.poTo);
      console.log('📸 Matched PO numbers:', matchingPOs.map(p => p.poNumber));
    } catch(e) {
      console.error('Snapshot PO fetch failed:', e.message);
      matchingPOs = [];
    }

    // ── 3. Serialise the snapshot (strip Timestamps → ISO strings) ────────────
    const snapshotData = matchingPOs.map(po => sanitizeForSnapshot({ ...po }));
    const snapshotMeta = {
      requestId:   newId,
      userId:      uid,
      requestType: requestForm.requestType,
      organization: requestForm.organization || '',
      filters: {
        poFrom:            requestForm.poFrom            || '',
        poTo:              requestForm.poTo              || '',
        inventoryCategory: requestForm.inventoryCategory || '',
        inventoryStatus:   requestForm.inventoryStatus   || '',
        supplierStatus:    requestForm.supplierStatus    || '',
        supplierCode:      requestForm.supplierCode      || '',
      },
      outputFormat:  requestForm.outputFormat,
      capturedAt:    firebase.firestore.FieldValue.serverTimestamp(), // moment of capture
      totalRecords:  snapshotData.length,
      // Store the full PO array as a JSON string to avoid Firestore 1 MB doc limit
      // for large datasets; for small datasets plain array also works.
      snapshotJson:  JSON.stringify(snapshotData),
    };

    // ── 4. Write snapshot doc first, then the request doc ────────────────────
    const snapshotRef = await db.collection('reportSnapshots').add(snapshotMeta);
    const snapshotId  = snapshotRef.id;

    await db.collection('requests').add({
      requestId:   newId,
      userId:      uid,
      requestType: requestForm.requestType,
      organization: requestForm.organization,
      poFrom:      requestForm.poFrom      || '',
      poTo:        requestForm.poTo        || '',
      inventoryCategory: requestForm.inventoryCategory || '',
      inventoryStatus:   requestForm.inventoryStatus   || '',
      supplierStatus:    requestForm.supplierStatus    || '',
      supplierCode:      requestForm.supplierCode      || '',
      receiptDateFrom:   requestForm.receiptDateFrom   || '',
      receiptDateTo:     requestForm.receiptDateTo     || '',
      receiptPONumber:   requestForm.receiptPONumber   || '',
      // Financial report fields
      finDateFrom:       requestForm.finDateFrom       || '',
      finDateTo:         requestForm.finDateTo         || '',
      finStatusFilter:   requestForm.finStatusFilter   || '',
      finSupplierFilter: requestForm.finSupplierFilter || '',
      finPeriod:         requestForm.finPeriod         || '',
      finDepartment:     requestForm.finDepartment     || '',
      finFiscalPeriod:   requestForm.finFiscalPeriod   || '',
      finPayDateFrom:    requestForm.finPayDateFrom    || '',
      finPayDateTo:      requestForm.finPayDateTo      || '',
      finPayStatus:      requestForm.finPayStatus      || '',
      finAgingBucket:    requestForm.finAgingBucket    || '',
      outputFormat:  requestForm.outputFormat,
      status:        'Pending',
      snapshotId,          // ← pointer to the frozen snapshot
      totalRecords:  snapshotData.length,
      createdAt:     firebase.firestore.FieldValue.serverTimestamp(),
    });

    setSubmittedRequestId(newId);
    setRequestStep(4);

    // ── 5. Preview the first matching PO from the snapshot (not live data) ───
    setTimeout(async () => {
      try {
        if (requestForm.requestType === 'Purchase Order Report' && snapshotData.length > 0) {
          // Re-hydrate from snapshot so the preview is the frozen version
          openPOView(snapshotData[0]);
        }
        // Mark the request as Completed
        const reqSnap = await db.collection('requests')
          .where('requestId', '==', newId).limit(1).get();
        if (!reqSnap.empty) {
          await reqSnap.docs[0].ref.update({
            status: 'Completed',
            completedAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
        }
      } catch(e) {
        console.error('Post-submit step failed:', e);
      }
    }, 600);

  } catch(e) {
    alert('Error submitting request: ' + e.message);
    console.error(e);
  }
  setRequestSubmitting(false);
};

// ── loadSnapshotReport ────────────────────────────────────────────────────────
// Call this when a user clicks "View" on a past request from requestHistory.
// It reads the frozen snapshot stored in Firestore rather than live PO data.
// Usage:  const frozenPOs = await loadSnapshotReport(snapshotId);
const loadSnapshotReport = async (snapshotId) => {
  try {
    const db  = firebase.firestore();
    const doc = await db.collection('reportSnapshots').doc(snapshotId).get();
    console.log('📦 loadSnapshotReport — snapshotId:', snapshotId, '| exists:', doc.exists);
    if (!doc.exists) {
      console.error('Snapshot doc does not exist:', snapshotId);
      return [];
    }
    const data = doc.data();
    console.log('📦 snapshot doc keys:', Object.keys(data));
    console.log('📦 snapshotJson type:', typeof data.snapshotJson, '| length:', data.snapshotJson?.length);
    console.log('📦 totalRecords:', data.totalRecords);
    // Handle both formats: JSON string (current) and plain array (legacy)
    if (Array.isArray(data.snapshotJson)) return data.snapshotJson;
    if (typeof data.snapshotJson === 'string' && data.snapshotJson.trim()) {
      const parsed = JSON.parse(data.snapshotJson);
      console.log('📦 parsed POs count:', parsed.length);
      return parsed;
    }
    // Try snapshotData field (alternate key used in some versions)
    if (Array.isArray(data.snapshotData)) return data.snapshotData;
    if (typeof data.snapshotData === 'string' && data.snapshotData.trim()) return JSON.parse(data.snapshotData);
    console.warn('📦 No usable snapshot data found in doc. Fields:', Object.keys(data));
    return [];
  } catch(e) {
    console.error('Failed to load snapshot:', e);
    return [];
  }
};

const generatePOPDFWithCustomLayout = async (po, layout, currencySymbol) => {
  const fields = layout.fields || [];

  const pageHeight = 1123;

  // ── Fetch [USER] data: buyer company info from the admin's users doc ──
  let buyerData = {};
  try {
    const db = firebase.firestore();
    const buyerDoc = await db.collection('users').doc(po.createdBy).get();
    if (buyerDoc.exists) buyerData = buyerDoc.data();
  } catch(e) { console.warn('Could not load buyer user doc:', e); }

  // ── Fetch [SUPPLIER] data: full supplier doc for address, contact, phone ──
  let supplierData = {};
  try {
    const db = firebase.firestore();
    if (po.supplierId) {
      const suppDoc = await db.collection('suppliers').doc(po.supplierId).get();
      if (suppDoc.exists) supplierData = suppDoc.data();
    }
  } catch(e) { console.warn('Could not load supplier doc:', e); }

  // Decrypt sensitive supplier fields
  const safeDecrypt = (val) => {
    if (!val || val.trim() === '') return '';
    try {
      const bytes = CryptoJS.AES.decrypt(val, 'your-secret-key-change-this-in-production-use-env-variable');
      return bytes.toString(CryptoJS.enc.Utf8) || val;
    } catch(e) { return val; }
  };

  const getFieldValue = (fieldId) => {
    switch(fieldId) {
      // ── PO Header ──────────────────────────────────────────────────────
