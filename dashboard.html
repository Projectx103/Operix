                  <button onClick={()=>{setShowShipModal(false);setShipModalOrder(null);}}
                    className="w-8 h-8 rounded-lg bg-white bg-opacity-20 flex items-center justify-center text-white hover:bg-opacity-30 transition-colors">
                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                  </button>
                </div>
                {/* Body */}
                <div className="flex-1 overflow-y-auto p-6 space-y-4">
                  {/* Orders preview */}
                  <div className="bg-sky-50 border border-sky-100 rounded-xl p-3">
                    <div className="text-xs font-bold text-sky-700 uppercase tracking-wider mb-2">
                      {isMulti ? `Orders being shipped (${orderList.length})` : 'Items in this order'}
                    </div>
                    <div className="space-y-2">
                      {isMulti ? orderList.map(o=>(
                        <div key={o.id} className="flex items-start justify-between gap-2 text-xs pb-2 border-b border-sky-100 last:border-0 last:pb-0">
                          <div>
                            <div className="font-black text-gray-900 font-mono">{o.orderNumber}</div>
                            <div className="text-gray-500 mt-0.5">{(o.items||[]).map(i=>`${i.name} ×${i.quantity}`).join(', ')}</div>
                          </div>
                          <div className="font-bold text-gray-700 whitespace-nowrap">₱{(o.totalAmount||0).toFixed(2)}</div>
                        </div>
                      )) : (orderList[0].items||[]).map((item,i)=>(
                        <div key={i} className="flex items-center justify-between text-xs text-gray-700">
                          <span className="font-semibold">{item.name}</span>
                          <span className="text-gray-500">×{item.quantity} — ₱{item.subtotal?.toFixed(2)}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Shipment Mode */}
                  <div>
                    <label className="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1.5">Shipment Mode <span className="text-red-500">*</span></label>
                    <select value={shipForm.mode} onChange={e=>setShipForm(f=>({...f,mode:e.target.value,courier:''}))}
                      className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-400 outline-none">
                      <option value="">— Select mode —</option>
                      {shipModes.map(m=><option key={m} value={m}>{m}</option>)}
                    </select>
                  </div>

                  {/* Courier */}
                  <div>
                    <label className="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1.5">Courier / Carrier</label>
                    {courierRegistry.length > 0 && (
                      <div className="mb-2">
                        <div className="text-xs text-gray-400 mb-1.5">Select from registered couriers{shipForm.mode?` for ${shipForm.mode}`:''}:</div>
                        <div className="flex flex-wrap gap-1.5">
                          {courierRegistry
                            .filter(c=>!shipForm.mode||!c.shipmentMode||c.shipmentMode===shipForm.mode)
                            .map((c,i)=>(
                              <button key={i} type="button" onClick={()=>setShipForm(f=>({...f,courier:c.name}))}
                                className={`px-2.5 py-1 rounded-lg text-xs font-semibold border transition-colors ${shipForm.courier===c.name?'bg-sky-500 border-sky-500 text-white':'border-gray-200 text-gray-600 hover:bg-sky-50 hover:border-sky-300'}`}>
                                🚚 {c.name}
                                {c.rates&&c.rates[0]&&c.rates[0].amount&&<span className="ml-1 opacity-70">₱{c.rates[0].amount}</span>}
                              </button>
                            ))
                          }
                        </div>
                      </div>
                    )}
                    <input type="text" value={shipForm.courier} onChange={e=>setShipForm(f=>({...f,courier:e.target.value}))}
                      placeholder="Or type courier name manually…"
                      className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-400 outline-none"/>
                  </div>

                  {/* Tracking number */}
                  <div>
                    <label className="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1.5">Tracking Number</label>
                    <input type="text" value={shipForm.trackingNumber} onChange={e=>setShipForm(f=>({...f,trackingNumber:e.target.value}))}
                      placeholder="Optional — e.g. 1Z999AA10123456784"
                      className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-400 outline-none font-mono"/>
                    {isMulti&&<div className="text-xs text-gray-400 mt-1">Same tracking number will be applied to all {orderList.length} orders</div>}
                  </div>

                  {/* Freight billing */}
                  <div>
                    <label className="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1.5">Freight Charges</label>
                    <div className="flex gap-3 mb-3">
                      {[{v:'seller',l:'Our Company Pays'},{v:'buyer',l:'Buyer Pays (COD)'}].map(opt=>(
                        <button key={opt.v} type="button" onClick={()=>setShipForm(f=>({...f,billTo:opt.v}))}
                          className={`flex-1 py-2 rounded-lg text-xs font-bold border-2 transition-all ${shipForm.billTo===opt.v?'border-sky-500 bg-sky-50 text-sky-700':'border-gray-200 text-gray-500 hover:border-gray-300'}`}>
                          {opt.l}
                        </button>
                      ))}
                    </div>
                    {shipForm.billTo==='seller'&&(
                      <div className="relative">
                        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm font-bold">₱</span>
                        <input type="number" min={0} step={0.01} value={shipForm.shippingCost} onChange={e=>setShipForm(f=>({...f,shippingCost:e.target.value}))}
                          placeholder="0.00"
                          className="w-full pl-7 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-400 outline-none"/>
                        {isMulti&&<div className="text-xs text-gray-400 mt-1">Total freight cost for this batch (split evenly or enter per-order amount as needed)</div>}
                      </div>
                    )}
                    {shipForm.billTo==='buyer'&&(
                      <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-700 font-semibold">
                        Shipping fee will be collected from the buyer upon delivery.
                      </div>
                    )}
                  </div>

                  {/* Notes */}
                  <div>
                    <label className="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1.5">Shipping Notes</label>
                    <textarea value={shipForm.notes} onChange={e=>setShipForm(f=>({...f,notes:e.target.value}))} rows={2}
                      placeholder="Optional internal notes about this shipment…"
                      className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-400 outline-none resize-none"/>
                  </div>
                </div>
                {/* Footer */}
                <div className="flex items-center gap-3 px-6 py-4 border-t border-gray-100 bg-gray-50">
                  <button onClick={()=>{setShowShipModal(false);setShipModalOrder(null);}}
                    className="flex-1 py-2.5 rounded-xl border-2 border-gray-200 text-sm font-bold text-gray-600 hover:bg-gray-100 transition-colors">
                    Cancel
                  </button>
                  <button onClick={submitShipment} disabled={submittingShipment||!shipForm.mode}
                    className="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 text-white text-sm font-black transition-all hover:shadow-md disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"/><path strokeLinecap="round" strokeLinejoin="round" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414A1 1 0 0120 11.414V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1"/></svg>
                    {submittingShipment
                      ? (isMulti?'Shipping all orders…':'Marking as Shipped…')
                      : (isMulti?`Ship All ${orderList.length} Orders`:'Mark as Shipped')
                    }
                  </button>
                </div>
              </div>
            </div>
            );
          })()}

          {/* ── Courier Configure Modal ── */}
          {showCourierModal&&(
            <div className="fixed inset-0 z-50 flex items-center justify-center" style={{background:'rgba(0,0,0,0.6)',backdropFilter:'blur(6px)'}}>
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[92vh] flex flex-col overflow-hidden">
                {/* Header */}
                <div style={{background:'linear-gradient(135deg,#0369a1,#0284c7)'}} className="px-6 py-5 flex items-center justify-between">
                  <div>
                    <span className="text-xs font-bold text-sky-200 uppercase tracking-widest">{editingCourier?'Update Courier':'New Courier'}</span>
                    <h3 className="text-xl font-black text-white mt-0.5">{editingCourier?editingCourier.name:'Add Courier'}</h3>
                    <p className="text-sky-200 text-xs mt-0.5">{editingCourier?'Edit courier details and rate structure':'Register a new courier in your shipping registry'}</p>
                  </div>
                  <button onClick={()=>{setShowCourierModal(false);setEditingCourier(null);}}
                    className="w-8 h-8 rounded-lg bg-white bg-opacity-20 flex items-center justify-center text-white hover:bg-opacity-30">
                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                  </button>
                </div>

                {/* Body */}
                <div className="flex-1 overflow-y-auto p-6 space-y-5">

                  {/* Courier Name */}
                  <div>
                    <label className="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1.5">Courier Name <span className="text-red-500">*</span></label>
                    <input type="text" value={courierForm.name} onChange={e=>setCourierForm(f=>({...f,name:e.target.value}))}
                      placeholder="e.g. LBC Express, J&T Cargo, DHL, FedEx…"
                      className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-400 outline-none font-semibold"/>
                  </div>

                  {/* Shipment Mode */}
                  <div>
                    <label className="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1.5">Shipment Mode</label>
                    <select value={courierForm.shipmentMode} onChange={e=>setCourierForm(f=>({...f,shipmentMode:e.target.value}))}
                      className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-400 outline-none">
                      <option value="">— All / Not specified —</option>
                      {shipModes.map(m=><option key={m} value={m}>{m}</option>)}
                    </select>
                    <div className="text-xs text-gray-400 mt-1">Used to filter couriers when setting shipment mode on an order</div>
                  </div>

                  {/* Rate Structure */}
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <label className="text-xs font-bold text-gray-600 uppercase tracking-wider">Rate Structure</label>
                      <button type="button" onClick={()=>setCourierForm(f=>({...f,rates:[...(f.rates||[]),{label:'',type:'flat',amount:'',unit:'',notes:''}]}))}
                        className="text-xs text-sky-600 font-bold hover:text-sky-800 flex items-center gap-1">
                        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>
                        Add Rate
                      </button>
                    </div>
                    <div className="space-y-3">
                      {(courierForm.rates||[]).length===0&&(
                        <div className="text-xs text-gray-400 italic text-center py-4 bg-gray-50 rounded-xl border-2 border-dashed border-gray-200">
                          No rates added yet — click "Add Rate" to define this courier's pricing
                        </div>
                      )}
                      {(courierForm.rates||[]).map((r,i)=>(
                        <div key={i} className="bg-gray-50 rounded-xl p-4 border border-gray-100 space-y-3">
                          {/* Rate label + type + delete */}
                          <div className="flex items-center gap-2">
                            <input type="text" value={r.label||''} placeholder="Rate label (e.g. Standard, Warehouse, Express…)"
                              onChange={e=>setCourierForm(f=>{const rs=[...f.rates];rs[i]={...rs[i],label:e.target.value};return{...f,rates:rs};})}
                              className="flex-1 px-2.5 py-1.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-400 outline-none font-semibold"/>
                            <button type="button" onClick={()=>setCourierForm(f=>({...f,rates:f.rates.filter((_,j)=>j!==i)}))}
                              className="w-7 h-7 rounded-lg bg-red-100 flex items-center justify-center text-red-500 hover:bg-red-200 flex-shrink-0">
                              <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                          </div>

                          {/* Rate type selector */}
                          <div>
                            <div className="text-xs font-bold text-gray-500 mb-1.5">Rate Type</div>
                            <div className="flex flex-wrap gap-1.5">
                              {[
                                {v:'flat',    l:'Flat Rate'},
                                {v:'per_kg',  l:'Per kg'},
                                {v:'per_cbm', l:'Per CBM'},
                                {v:'per_km',  l:'Per km'},
                                {v:'per_item',l:'Per Item'},
                                {v:'custom',  l:'Custom Unit'},
                              ].map(t=>(
                                <button key={t.v} type="button" onClick={()=>setCourierForm(f=>{const rs=[...f.rates];rs[i]={...rs[i],type:t.v,unit:t.v==='flat'?'':t.v==='custom'?'':t.v.replace('per_','')};return{...f,rates:rs};})}
                                  className={`px-2.5 py-1 rounded-lg text-xs font-bold border transition-colors ${r.type===t.v?'bg-sky-500 border-sky-500 text-white':'border-gray-200 text-gray-500 hover:border-sky-300 hover:text-sky-600'}`}>
                                  {t.l}
                                </button>
                              ))}
                            </div>
                          </div>

                          {/* Amount + unit */}
                          <div className="grid grid-cols-2 gap-3">
                            <div>
                              <div className="text-xs text-gray-500 mb-1">Amount (₱)</div>
                              <div className="relative">
                                <span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm">₱</span>
                                <input type="number" min={0} step={0.01} value={r.amount||''} placeholder="0.00"
                                  onChange={e=>setCourierForm(f=>{const rs=[...f.rates];rs[i]={...rs[i],amount:e.target.value};return{...f,rates:rs};})}
                                  className="w-full pl-6 pr-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-400 outline-none font-semibold"/>
                              </div>
                            </div>
                            <div>
                              <div className="text-xs text-gray-500 mb-1">{r.type==='flat'?'(flat — no unit)':r.type==='custom'?'Custom unit label':'Unit (auto-set)'}</div>
                              <input type="text" value={r.unit||''} placeholder={r.type==='flat'?'—':r.type==='custom'?'e.g. pallet':r.unit||''}
                                readOnly={r.type!=='flat'&&r.type!=='custom'}
                                onChange={e=>setCourierForm(f=>{const rs=[...f.rates];rs[i]={...rs[i],unit:e.target.value};return{...f,rates:rs};})}
                                className={`w-full px-2.5 py-1.5 border rounded-lg text-sm focus:ring-2 focus:ring-sky-400 outline-none ${r.type==='flat'?'bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed':'border-gray-300'}`}/>
                            </div>
                          </div>

                          {/* Optional note for this rate tier */}
                          <input type="text" value={r.notes||''} placeholder="Optional note (e.g. Applies to Luzon only, min 5kg, warehouse pickup)"
                            onChange={e=>setCourierForm(f=>{const rs=[...f.rates];rs[i]={...rs[i],notes:e.target.value};return{...f,rates:rs};})}
                            className="w-full px-2.5 py-1.5 border border-gray-300 rounded-lg text-xs focus:ring-2 focus:ring-sky-400 outline-none text-gray-600"/>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* General Notes */}
                  <div>
                    <label className="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1.5">General Notes</label>
                    <textarea value={courierForm.notes||''} onChange={e=>setCourierForm(f=>({...f,notes:e.target.value}))} rows={2}
                      placeholder="Optional notes about this courier (e.g. Available Mon–Fri, contact: 09xx-xxx-xxxx)"
                      className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-400 outline-none resize-none"/>
                  </div>
                </div>

                {/* Footer */}
                <div className="flex items-center gap-3 px-6 py-4 border-t border-gray-100 bg-gray-50">
                  {editingCourier&&(
                    <button type="button" onClick={async()=>{
                      if(!confirm(`Delete courier "${editingCourier.name}"? This cannot be undone.`))return;
                      try{
                        const db=firebase.firestore();
                        await db.collection('courierRegistry').doc(editingCourier.id).delete();
                        setCourierRegistry(prev=>prev.filter(c=>c.id!==editingCourier.id));
                        setShowCourierModal(false); setEditingCourier(null);
                      }catch(e){alert('Error deleting: '+e.message);}
                    }}
                      className="px-4 py-2.5 rounded-xl border-2 border-red-200 text-sm font-bold text-red-500 hover:bg-red-50 transition-colors">
                      Delete
                    </button>
                  )}
                  <button type="button" onClick={()=>{setShowCourierModal(false);setEditingCourier(null);}}
                    className="flex-1 py-2.5 rounded-xl border-2 border-gray-200 text-sm font-bold text-gray-600 hover:bg-gray-100 transition-colors">
                    Cancel
                  </button>
                  <button type="button" onClick={saveCourier} disabled={savingCourier||!courierForm.name.trim()}
                    className="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 text-white text-sm font-black transition-all hover:shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
                    {savingCourier?'Saving…':editingCourier?'Save Changes':'Add Courier'}
                  </button>
                </div>
              </div>
            </div>
          )}
        </>
      );
    })()}
  </div>
)}


{/* Purchases Module (Admin Only) */}
{activeModule === 'purchases' && userRole === 'admin' && (
  <div className="space-y-6">
  {activePOReview ? (
    <POReviewPage
      po={activePOReview}
      user={user}
      purchaseOrders={purchaseOrders}
      onBack={() => setActivePOReview(null)}
      approvePO={approvePO}
      denyPO={denyPO}
      sendRFI={sendRFI}
      submitRFIReply={submitRFIReply}
      updatePOStatus={updatePOStatus}
      setWithdrawPOTarget={setWithdrawPOTarget}
      setWithdrawReason={setWithdrawReason}
      setShowWithdrawModal={setShowWithdrawModal}
      setPOToRevise={setPOToRevise}
      setRevisionNotes={setRevisionNotes}
      setShowRevisionModal={setShowRevisionModal}
      generatePOPDF={generatePOPDF}
      getCurrencySymbol={getCurrencySymbol}
      rfiReplyText={rfiReplyText}
      setRfiReplyText={setRfiReplyText}
      submittingRFIReply={submittingRFIReply}

    />
  ) : (
  <div className="space-y-6">
    {/* Header */}
    <div className="flex flex-wrap items-center justify-between gap-4">
      <div>
        <h2 className="text-2xl font-bold text-gray-800">Purchase Orders</h2>
        <p className="text-sm text-gray-500 mt-1">Manage procurement from suppliers</p>
      </div>
      <div className="flex gap-3">
        <button
          onClick={() => openRequestModal(null)}
          style={{fontFamily:"'Courier New',Courier,monospace",letterSpacing:'0.5px'}}
          className="flex items-center gap-2 bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-900 transition-all text-sm font-bold border border-slate-700"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Request
        </button>
        <button onClick={() => window.location.href = 'po-layout-setup.html'}
          className="flex items-center gap-2 bg-gray-100 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-200 transition-all text-sm font-medium border border-gray-300">
          <Settings className="w-4 h-4"/>
          {poLayoutConfig ? 'Edit PO Layout' : 'Setup PO Layout'}
        </button>
        <button onClick={() => window.location.href = 'create-po.html'}
          className="flex items-center gap-2 bg-gradient-to-r from-indigo-600 to-blue-600 text-white px-6 py-2.5 rounded-xl hover:shadow-lg hover:scale-105 transition-all font-semibold text-sm">
          <Plus /> Create Purchase Order
        </button>
      </div>
    </div>

    {/* ── PO Summary Card (click to open filter panel) ── */}
    {!showPODistTable && (()=>{
      const myPOs = purchaseOrders.filter(p => p.createdBy === user?.uid);
      const pendingApprovalCount = purchaseOrders.filter(p => p._pendingMyApproval).length;
      const summaryCards = [
        { label:'Open',              value: myPOs.filter(p=>['submitted','approved','ordered'].includes(p.status)).length,            color:'#1D4ED8', bg:'#EFF6FF', border:'#BFDBFE' },
        { label:'In Process',        value: myPOs.filter(p=>p.status==='submitted').length,                                           color:'#6D28D9', bg:'#F5F3FF', border:'#DDD6FE' },
        { label:'Approved',          value: myPOs.filter(p=>p.status==='approved').length,                                            color:'#059669', bg:'#F0FDF4', border:'#BBF7D0' },
        { label:'Incomplete',        value: myPOs.filter(p=>p.status==='incomplete').length,                                          color:'#D97706', bg:'#FFFBEB', border:'#FDE68A' },
        { label:'Closed for Invoice',value: myPOs.filter(p=>p.status==='received').length,                                            color:'#0891B2', bg:'#ECFEFF', border:'#A5F3FC' },
        { label:'Closed',            value: myPOs.filter(p=>p.status==='closed'&&p.paymentDueDate).length,                            color:'#475569', bg:'#F8FAFC', border:'#E2E8F0' },
        { label:'Canceled',          value: myPOs.filter(p=>p.status==='denied'||p.status==='cancelled').length,                      color:'#DC2626', bg:'#FEF2F2', border:'#FECACA' },
        { label:'On Hold',           value: myPOs.filter(p=>p.paymentOnHold).length,                                                  color:'#92400E', bg:'#FFFBEB', border:'#FCD34D' },
      ];
      return (
        <div style={{background:'#fff',borderRadius:16,border:'1px solid #E5E7EB',overflow:'hidden',boxShadow:'0 1px 4px rgba(0,0,0,.06)'}}>
          <div style={{padding:'18px 24px',borderBottom:'1px solid #F1F5F9',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <div style={{width:36,height:36,background:'linear-gradient(135deg,#1E3A78,#1D4ED8)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center'}}>
                <svg width="18" height="18" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
              </div>
              <div>
                <div style={{fontSize:15,fontWeight:800,color:'#1E293B'}}>Purchase Order Summary</div>
                <div style={{fontSize:12,color:'#64748B',marginTop:1}}>{myPOs.length} total POs · Click any card or the Find button to view details</div>
              </div>
            </div>
            <button
              onClick={()=>{ setPoFilterPONumber('');setPoFilterSupplier('');setPoFilterBuyer('');setPoFilterItem('');setPoFilterDateFrom('');setPoFilterDateTo('');setPoFilterApproval('');setPoFilterControl('');setPoFilterHold('');setShowPODistTable(true); }}
              style={{display:'flex',alignItems:'center',gap:7,padding:'9px 20px',background:'linear-gradient(135deg,#1E3A78,#1D4ED8)',color:'#fff',border:'none',borderRadius:10,fontWeight:700,fontSize:13,cursor:'pointer'}}>
              <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              Find / Filter POs
            </button>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:0}}>
            {summaryCards.map((c,i)=>(
              <div key={c.label}
                onClick={()=>{ setPoFilterControl(c.label==='Open'?'open':c.label==='In Process'?'in_process':c.label==='Approved'?'approved':c.label==='Incomplete'?'incomplete':c.label==='Closed for Invoice'?'closed_for_invoice':c.label==='Closed'?'closed':c.label==='Canceled'?'canceled':c.label==='On Hold'?'on_hold':''); setPoFilterApproval(''); setPoFilterPONumber(''); setPoFilterSupplier(''); setPoFilterBuyer(''); setPoFilterItem(''); setPoFilterDateFrom(''); setPoFilterDateTo(''); setPoFilterHold(''); setShowPODistTable(true); }}
                style={{padding:'18px 20px',borderRight:i%4!==3?'1px solid #F1F5F9':'none',borderTop:i>=4?'1px solid #F1F5F9':'none',cursor:'pointer',transition:'background .15s',background:'#fff'}}
                onMouseEnter={e=>e.currentTarget.style.background=c.bg}
                onMouseLeave={e=>e.currentTarget.style.background='#fff'}
              >
                <div style={{fontSize:22,fontWeight:900,color:c.color,fontVariantNumeric:'tabular-nums'}}>{c.value}</div>
                <div style={{fontSize:11,fontWeight:700,color:'#64748B',marginTop:3,textTransform:'uppercase',letterSpacing:'.05em'}}>{c.label}</div>
                <div style={{height:3,borderRadius:2,background:c.border,marginTop:8,width:`${Math.min(100,c.value*10+20)}%`}}/>
              </div>
            ))}
          </div>
          {pendingApprovalCount > 0 && (
            <div onClick={()=>{ setPoFilterApproval('pending_approval');setPoFilterControl('');setShowPODistTable(true); }}
              style={{padding:'10px 24px',background:'#FEF2F2',borderTop:'1px solid #FECACA',cursor:'pointer',display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontSize:11,fontWeight:800,color:'#DC2626'}}>🔴 {pendingApprovalCount} PO{pendingApprovalCount>1?'s':''} PENDING YOUR APPROVAL</span>
              <span style={{fontSize:11,color:'#6B7280'}}>— Click to review</span>
            </div>
          )}
        </div>
      );
    })()}

    {/* ── Inventory Alerts ── */}
    {!showPODistTable && (()=>{
      const outOfStock = products.filter(p => p.stock === 0);
      const lowStock   = products.filter(p => p.stock > 0 && p.stock <= p.threshold);
      const allAlerts  = [...outOfStock.map(p=>({product:p,type:'out'})), ...lowStock.map(p=>({product:p,type:'low'}))];
      if (allAlerts.length === 0) return null;
      return (
        <div className="space-y-3">
          <div className="flex flex-wrap items-center justify-between gap-3 px-4 py-3 bg-white rounded-xl border border-gray-200">
            <div className="flex items-center gap-2">
              <AlertTriangle className="w-4 h-4 text-amber-500"/>
              <span className="text-sm font-bold text-gray-800">{allAlerts.length} item{allAlerts.length>1?'s':''} need restocking</span>
              <span className="text-xs text-gray-400">({outOfStock.length} out · {lowStock.length} low)</span>
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              {outOfStock.length > 0 && <button onClick={() => { setBulkAlertItems(outOfStock.map(p=>({product:p,type:'out',qty:p.moq||1,selectedSupplierId:suppliers.find(s=>s.id===p.supplierId||s.name===p.supplier)?.id||''}))); setBulkPOStep(1); setShowBulkPOModal(true); }} className="flex items-center gap-1.5 px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-lg transition-all"><Plus className="w-3 h-3"/> Out of Stock Only ({outOfStock.length})</button>}
              {lowStock.length > 0 && <button onClick={() => { setBulkAlertItems(lowStock.map(p=>({product:p,type:'low',qty:p.moq||1,selectedSupplierId:suppliers.find(s=>s.id===p.supplierId||s.name===p.supplier)?.id||''}))); setBulkPOStep(1); setShowBulkPOModal(true); }} className="flex items-center gap-1.5 px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-lg transition-all"><Plus className="w-3 h-3"/> Low Stock Only ({lowStock.length})</button>}
              <button onClick={() => { setBulkAlertItems(allAlerts.map(a=>({...a,qty:a.product.moq||1,selectedSupplierId:suppliers.find(s=>s.id===a.product.supplierId||s.name===a.product.supplier)?.id||''}))); setBulkPOStep(1); setShowBulkPOModal(true); }} className="flex items-center gap-1.5 px-3 py-1.5 bg-gradient-to-r from-indigo-600 to-blue-600 hover:shadow-md text-white text-xs font-bold rounded-lg transition-all"><Plus className="w-3 h-3"/> All Alerts ({allAlerts.length})</button>
            </div>
          </div>
          {outOfStock.length > 0 && (
            <div className="bg-white rounded-2xl border border-red-100 overflow-hidden">
              <div className="flex items-center gap-3 px-5 py-3 bg-gradient-to-r from-red-50 to-rose-50 border-b border-red-100">
                <AlertTriangle className="w-4 h-4 text-red-600"/>
                <span className="font-bold text-red-800 text-sm">Out of Stock — Immediate PO Required</span>
                <span className="px-2 py-0.5 bg-red-600 text-white rounded-full text-xs font-bold ml-1">{outOfStock.length}</span>
              </div>
              <div className="p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                {outOfStock.map(product => {
                  const linkedSupplier = suppliers.find(s => s.id===product.supplierId || s.name===product.supplier);
                  return (
                    <div key={product.id} className="flex items-start justify-between p-3 bg-red-50 border border-red-200 rounded-xl">
                      <div className="flex-1 min-w-0 mr-2">
                        <p className="font-bold text-sm text-gray-900 truncate">{product.name}</p>
                        <p className="text-xs text-gray-400 font-mono mt-0.5">{product.sku}</p>
                        {linkedSupplier && <p className="text-xs text-red-600 font-semibold mt-1">{linkedSupplier.name}</p>}
                        <span className="inline-flex items-center gap-1 mt-1.5 px-2 py-0.5 bg-red-600 text-white text-xs font-bold rounded-full"><span className="w-1.5 h-1.5 bg-white rounded-full animate-ping"/>OUT OF STOCK</span>
                      </div>
                      <button onClick={() => window.location.href = `create-po.html?productId=${product.id}&supplierId=${linkedSupplier?.id||''}&locked=1`} className="flex-shrink-0 flex items-center gap-1 px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-lg transition-colors"><Plus className="w-3 h-3"/> PO</button>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
          {lowStock.length > 0 && (
            <div className="bg-white rounded-2xl border border-amber-100 overflow-hidden">
              <div className="flex items-center gap-3 px-5 py-3 bg-gradient-to-r from-amber-50 to-yellow-50 border-b border-amber-100">
                <AlertTriangle className="w-4 h-4 text-amber-600"/>
                <span className="font-bold text-amber-800 text-sm">Low Stock — Reorder Soon</span>
                <span className="px-2 py-0.5 bg-amber-500 text-white rounded-full text-xs font-bold ml-1">{lowStock.length}</span>
              </div>
              <div className="p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                {lowStock.map(product => {
                  const linkedSupplier = suppliers.find(s => s.id===product.supplierId || s.name===product.supplier);
                  return (
                    <div key={product.id} className="flex items-start justify-between p-3 bg-amber-50 border border-amber-200 rounded-xl">
                      <div className="flex-1 min-w-0 mr-2">
                        <p className="font-bold text-sm text-gray-900 truncate">{product.name}</p>
                        <p className="text-xs text-gray-400 font-mono mt-0.5">{product.sku}</p>
                        {linkedSupplier && <p className="text-xs text-amber-700 font-semibold mt-1">{linkedSupplier.name}</p>}
                        <span className="inline-flex items-center gap-1 mt-1.5 px-2 py-0.5 bg-amber-500 text-white text-xs font-bold rounded-full">⚠ {product.stock} left</span>
                      </div>
                      <button onClick={() => window.location.href = `create-po.html?productId=${product.id}&supplierId=${linkedSupplier?.id||''}&locked=1`} className="flex-shrink-0 flex items-center gap-1 px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-lg transition-colors"><Plus className="w-3 h-3"/> PO</button>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    })()}

    {/* ── PO Distribution Filter Panel ── */}
    {showPODistTable && (()=>{
      // ── Compute flat line-item rows from purchaseOrders ──────────────────
      const safeD = (v) => { try { const b=CryptoJS.AES.decrypt(v,'your-secret-key-change-this-in-production-use-env-variable'); return b.toString(CryptoJS.enc.Utf8)||v; } catch(e) { return v||''; } };

      const controlStatus = (po) => {
        if (po.status==='denied'||po.status==='cancelled') return 'canceled';
        if (po.status==='closed' && po.paymentPaid) return 'closed';
        if (po.status==='closed') return 'closed';
        if (po.status==='received') return 'closed_for_invoice';
        if (po.status==='approved'||po.status==='ordered') return 'approved';
        if (po.status==='submitted') return 'in_process';
        if (po.status==='incomplete') return 'incomplete';
        return 'open';
      };
      const controlLabel = (po) => {
        const s = controlStatus(po);
        if (s==='canceled') return 'Canceled';
        if (s==='closed') return 'Closed';
        if (s==='closed_for_invoice') return 'Closed for Invoice';
        if (s==='approved') return 'Open';
        if (s==='in_process') return 'Open';
        if (s==='incomplete') return 'Incomplete';
        return 'Open';
      };
      const approvalLabel = (po) => {
        const s = (po.approvalStatus||po.status||'').toLowerCase();
        if (s==='approved'||s==='no_approval_required') return 'Approved';
        if (s==='pending_approval'||s==='submitted') return 'In Process';
        if (s==='incomplete') return 'Incomplete';
        if (s==='denied') return 'Rejected';
        if (po.lastRFI && !po.lastRFIReply) return 'Requires Reapproval';
        return 'In Process';
      };
      // Last approver = last 'approved' entry in approvalHistory
      const lastApprover = (po) => {
        const hist = po.approvalHistory || [];
        const approved = hist.filter(h=>h.action==='approved');
        return approved.length ? approved[approved.length-1] : null;
      };

      // Build flat rows
      const toTs = (v) => { if (!v) return null; if (v.toDate) return v.toDate(); if (v._seconds) return new Date(v._seconds*1000); try{const d=new Date(v);return isNaN(d)?null:d;}catch{return null;} };
      const fmtD = (v) => { const d=toTs(v); if(!d)return '—'; return d.toLocaleDateString('en-PH',{month:'short',day:'2-digit',year:'numeric'}); };

      // ── Wildcard match helper (% = any chars, like Oracle EBS) ──────────
      const wildcardMatch = (value, pattern) => {
        if (!pattern) return true;
        const v = (value||'').toLowerCase();
        const p = pattern.toLowerCase();
        // If no % wildcard, treat as normal contains match
        if (!p.includes('%')) return v.includes(p);
        // Convert % wildcards to regex
        const escaped = p.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/%/g, '.*');
        try { return new RegExp('^' + escaped + '$').test(v) || new RegExp(escaped).test(v); }
        catch(e) { return v.includes(p.replace(/%/g,'')); }
      };

      // Filter
      const dnFrom = poFilterDateFrom ? new Date(poFilterDateFrom+'T00:00:00') : null;
      const dnTo   = poFilterDateTo   ? new Date(poFilterDateTo+'T23:59:59')   : null;

      // ── Only build rows if Find has been fired ───────────────────────────
      const filteredPOs = poDistSearchFired ? purchaseOrders.filter(po => {
        if (po.createdBy !== user?.uid) return false;
        // PO Number — wildcard support
        if (poFilterPONumber.trim() && !wildcardMatch(po.poNumber, poFilterPONumber.trim())) return false;
        // Supplier — wildcard support
        if (poFilterSupplier.trim() && !wildcardMatch(po.supplierName, poFilterSupplier.trim())) return false;
        // Buyer — wildcard support
        if (poFilterBuyer.trim() && !wildcardMatch(po.createdByName, poFilterBuyer.trim())) return false;
        // Item / SKU — wildcard support
        if (poFilterItem.trim()) {
          const match = (po.items||[]).some(it =>
            wildcardMatch(it.productName, poFilterItem.trim()) ||
            wildcardMatch(it.sku, poFilterItem.trim()) ||
            wildcardMatch(it.notes, poFilterItem.trim())
          );
          if (!match) return false;
        }
        // Date range — inclusive, accurate to the day
        const created = toTs(po.createdAt);
        if (dnFrom && created && created < dnFrom) return false;
        if (dnTo   && created && created > dnTo)   return false;
        // Approval status
        if (poFilterApproval) {
          const al = approvalLabel(po).toLowerCase().replace(/ /g,'_');
          if (!al.includes(poFilterApproval.toLowerCase().replace(/ /g,'_'))) return false;
        }
        // Control
        if (poFilterControl) {
          if (controlStatus(po) !== poFilterControl) return false;
        }
        // Hold
        if (poFilterHold === 'yes' && !po.paymentOnHold) return false;
        if (poFilterHold === 'no'  &&  po.paymentOnHold) return false;
        return true;
      }) : [];

      // Expand into line rows
      const rows = [];
      filteredPOs.forEach(po => {
        const ctrl     = controlLabel(po);
        const appLabel = approvalLabel(po);
        const la       = lastApprover(po);
        const items    = po.items && po.items.length > 0 ? po.items : [{ productName:'—', sku:'', unit:'', unitCost:0, quantity:0, lineTotal:0, notes:'' }];
        items.forEach((item, idx) => {
          // Filter by item/SKU if set — wildcard support
          if (poFilterItem.trim()) {
            const match = wildcardMatch(item.productName, poFilterItem.trim()) ||
                          wildcardMatch(item.sku, poFilterItem.trim()) ||
                          wildcardMatch(item.notes, poFilterItem.trim());
            if (!match) return;
          }
          rows.push({
            _poId:       po.id,
            _po:         po,
            _itemIdx:    idx,
            poNumber:    po.poNumber,
            rev:         po.revision > 0 ? `Rev.${po.revision}` : '',
            supplier:    po.supplierName || '—',
            sku:         item.sku || '—',
            category:    item.category || products.find(p=>p.sku===item.sku||p.id===item.productId)?.category || '—',
            description: item.productName || '—',
            unitPrice:   item.unitCost||item.unit_cost||item.price||0,
            qtyOrdered:  item.quantity||0,
            uom:         item.unit||'—',
            amount:      item.lineTotal||item.subtotal||((item.unitCost||0)*(item.quantity||0))||0,
            qtyDelivered:item.receivedQty||0,
            qtyCanceled: po.status==='denied'||po.status==='cancelled' ? item.quantity||0 : 0,
            orderDate:   fmtD(po.createdAt),
            orderDateRaw:toTs(po.createdAt),
            needByDate:  po.expectedDeliveryDate||'—',
            approvedDate:la ? new Date(la.at).toLocaleDateString('en-PH',{month:'short',day:'2-digit',year:'numeric'}) : '—',
            buyer:       po.createdByName||'—',
            approvalStatus: appLabel,
            control:     ctrl,
            onHold:      po.paymentOnHold ? 'Yes' : 'No',
            currency:    po.currency||'PHP',
          });
        });
      });

      // Sort
      const sorted = [...rows].sort((a,b) => {
        const dir = poDistSortDir === 'asc' ? 1 : -1;
        const av = a[poDistSortCol]; const bv = b[poDistSortCol];
        if (poDistSortCol==='orderDate') return dir*((a.orderDateRaw||0)-(b.orderDateRaw||0));
        if (typeof av==='number') return dir*(av-bv);
        return dir*(String(av||'').localeCompare(String(bv||'')));
      });

      const totalPages = Math.max(1, Math.ceil(sorted.length / poDistPageSize));
      const paginated  = sorted.slice((poDistPage-1)*poDistPageSize, poDistPage*poDistPageSize);

      // Column definitions
      const COL_DEF = {
        poNumber:       { label:'PO Number',       w:120 },
        rev:            { label:'Rev',             w:60  },
        supplier:       { label:'Supplier',        w:160 },
        sku:            { label:'SKU',             w:110 },
        description:    { label:'Item Description',w:180 },
        category:       { label:'Category',        w:110 },
        unitPrice:      { label:'Unit Price',      w:100 },
        qtyOrdered:     { label:'Qty Ordered',     w:100 },
        uom:            { label:'UOM',             w:70  },
        amount:         { label:'Amount',          w:110 },
        qtyDelivered:   { label:'Qty Delivered',   w:110 },
        qtyCanceled:    { label:'Qty Canceled',    w:110 },
        orderDate:      { label:'Order Date',      w:110 },
        needByDate:     { label:'Need By Date',    w:110 },
        approvedDate:   { label:'Approved Date',   w:120 },
        buyer:          { label:'Buyer',           w:130 },
        approvalStatus: { label:'Approval Status', w:130 },
        control:        { label:'Control',         w:120 },
        onHold:         { label:'On Hold',         w:80  },
      };
      const visibleCols = [...poDistColOrder, 'description', 'control', 'onHold'].filter((c,i,a)=>a.indexOf(c)===i);

      const cs = (currency) => { if(currency==='USD')return '$'; if(currency==='JPY')return '¥'; if(currency==='EUR')return '€'; return '₱'; };

      const statusColor = (s) => {
        if (s==='Approved')   return {color:'#166534',bg:'#DCFCE7'};
        if (s==='In Process') return {color:'#1E40AF',bg:'#DBEAFE'};
        if (s==='Rejected')   return {color:'#991B1B',bg:'#FEE2E2'};
        if (s==='Incomplete') return {color:'#92400E',bg:'#FEF3C7'};
        if (s==='Requires Reapproval') return {color:'#6D28D9',bg:'#F3E8FF'};
        return {color:'#475569',bg:'#F1F5F9'};
      };
      const controlColor = (s) => {
        if (s==='Open')              return {color:'#1D4ED8',bg:'#EFF6FF'};
        if (s==='Canceled')          return {color:'#DC2626',bg:'#FEF2F2'};
        if (s==='Closed for Invoice')return {color:'#0891B2',bg:'#ECFEFF'};
        if (s==='Closed')            return {color:'#475569',bg:'#F1F5F9'};
        if (s==='Incomplete')        return {color:'#D97706',bg:'#FFFBEB'};
        return {color:'#475569',bg:'#F8FAFC'};
      };

      return (
        <div style={{display:'flex',flexDirection:'column',gap:14}}>

          {/* Filter Panel */}
          <div style={{background:'#fff',borderRadius:14,border:'1px solid #E5E7EB',overflow:'hidden',boxShadow:'0 1px 4px rgba(0,0,0,.06)'}}>
            {/* Header */}
            <div style={{padding:'14px 20px',borderBottom:'1px solid #F1F5F9',display:'flex',alignItems:'center',justifyContent:'space-between',background:'linear-gradient(135deg,#0F172A,#1E3A78)'}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <svg width="16" height="16" fill="none" stroke="#93C5FD" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2a1 1 0 01-.293.707L13 13.414V19a1 1 0 01-.553.894l-4 2A1 1 0 017 21v-7.586L3.293 6.707A1 1 0 013 6V4z"/></svg>
                <span style={{fontSize:13,fontWeight:700,color:'#E2E8F0'}}>Purchase Order Search &amp; Filter</span>
                {poDistSearchFired && rows.length > 0 && <span style={{fontSize:11,fontWeight:700,color:'#93C5FD',background:'rgba(147,197,253,.15)',padding:'2px 10px',borderRadius:20}}>{rows.length} line{rows.length!==1?'s':''} found</span>}
              </div>
              <button onClick={()=>{setShowPODistTable(false);setPoDistSearchFired(false);setShowWildcard(false);}} style={{background:'rgba(255,255,255,.1)',border:'1px solid rgba(255,255,255,.15)',color:'#CBD5E1',padding:'5px 14px',borderRadius:7,fontSize:12,fontWeight:600,cursor:'pointer'}}>← Back to Summary</button>
            </div>

            {/* Filter fields */}
            <div style={{padding:'16px 20px',display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
              {/* Row 1 */}
              <div>
                <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>PO Number <span style={{fontWeight:400,textTransform:'none',color:'#94A3B8'}}>— use % as wildcard (e.g. 5048%)</span></label>
                <input value={poFilterPONumber} onChange={e=>{
                  setPoFilterPONumber(e.target.value);
                  // Auto-trigger wildcard lookup if % is in the value
                  if (e.target.value.includes('%') && e.target.value.replace(/%/g,'').length >= 2) {
                    const pat = e.target.value;
                    const matched = purchaseOrders.filter(po=>po.createdBy===user?.uid && wildcardMatch(po.poNumber,pat));
                    if (matched.length > 0 && matched.length <= 200) { setWildcardField('poNumber'); setWildcardResults(matched.map(po=>({label:po.poNumber,sub:po.supplierName,po}))); setShowWildcard(true); }
                    else setShowWildcard(false);
                  } else setShowWildcard(false);
                }} placeholder="e.g. 504848 or 5048%" style={{width:'100%',padding:'8px 11px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none',fontFamily:'monospace'}} onFocus={e=>e.target.style.borderColor='#1D4ED8'} onBlur={e=>{e.target.style.borderColor='#E2E8F0';}} />
              </div>
              <div>
                <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Supplier <span style={{fontWeight:400,textTransform:'none',color:'#94A3B8'}}>— use % as wildcard</span></label>
                <input value={poFilterSupplier} onChange={e=>{
                  setPoFilterSupplier(e.target.value);
                  if (e.target.value.includes('%') && e.target.value.replace(/%/g,'').length >= 2) {
                    const pat = e.target.value;
                    const matched = [...new Set(purchaseOrders.filter(po=>po.createdBy===user?.uid && wildcardMatch(po.supplierName,pat)).map(po=>po.supplierName))];
                    if (matched.length > 0 && matched.length <= 200) { setWildcardField('supplier'); setWildcardResults(matched.map(s=>({label:s,sub:''}))); setShowWildcard(true); }
                    else setShowWildcard(false);
                  } else setShowWildcard(false);
                }} placeholder="Supplier name or %KEYWORD%" style={{width:'100%',padding:'8px 11px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none'}} onFocus={e=>e.target.style.borderColor='#1D4ED8'} onBlur={e=>{e.target.style.borderColor='#E2E8F0';}} />
              </div>
              <div>
                <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Buyer <span style={{fontWeight:400,textTransform:'none',color:'#94A3B8'}}>— use % as wildcard</span></label>
                <input value={poFilterBuyer} onChange={e=>{
                  setPoFilterBuyer(e.target.value);
                  if (e.target.value.includes('%') && e.target.value.replace(/%/g,'').length >= 2) {
                    const pat = e.target.value;
                    const matched = [...new Set(purchaseOrders.filter(po=>po.createdBy===user?.uid && wildcardMatch(po.createdByName,pat)).map(po=>po.createdByName).filter(Boolean))];
                    if (matched.length > 0 && matched.length <= 200) { setWildcardField('buyer'); setWildcardResults(matched.map(s=>({label:s,sub:''}))); setShowWildcard(true); }
                    else setShowWildcard(false);
                  } else setShowWildcard(false);
                }} placeholder="Buyer / admin name or %KEY%" style={{width:'100%',padding:'8px 11px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none'}} onFocus={e=>e.target.style.borderColor='#1D4ED8'} onBlur={e=>{e.target.style.borderColor='#E2E8F0';}} />
              </div>
              {/* Row 2 */}
              <div>
                <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Item / SKU / Description</label>
                <input value={poFilterItem} onChange={e=>setPoFilterItem(e.target.value)} placeholder="Product name or SKU" style={{width:'100%',padding:'8px 11px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none'}} onFocus={e=>e.target.style.borderColor='#1D4ED8'} onBlur={e=>e.target.style.borderColor='#E2E8F0'}/>
              </div>
              <div>
                <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Order Date From</label>
                <input type="date" value={poFilterDateFrom} onChange={e=>setPoFilterDateFrom(e.target.value)} style={{width:'100%',padding:'8px 11px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none'}} onFocus={e=>e.target.style.borderColor='#1D4ED8'} onBlur={e=>e.target.style.borderColor='#E2E8F0'}/>
              </div>
              <div>
                <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Order Date To</label>
                <input type="date" value={poFilterDateTo} onChange={e=>setPoFilterDateTo(e.target.value)} style={{width:'100%',padding:'8px 11px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none'}} onFocus={e=>e.target.style.borderColor='#1D4ED8'} onBlur={e=>e.target.style.borderColor='#E2E8F0'}/>
              </div>
              {/* Row 3 */}
              <div>
                <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Approval Status</label>
                <select value={poFilterApproval} onChange={e=>setPoFilterApproval(e.target.value)} style={{width:'100%',padding:'8px 11px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none',background:'#fff'}}>
                  <option value="">All</option>
                  <option value="approved">Approved</option>
                  <option value="in_process">In Process</option>
                  <option value="incomplete">Incomplete</option>
                  <option value="rejected">Rejected</option>
                  <option value="requires_reapproval">Requires Reapproval</option>
                  <option value="pending_approval">Pending My Approval</option>
                </select>
              </div>
              <div>
                <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Control (PO Status)</label>
                <select value={poFilterControl} onChange={e=>setPoFilterControl(e.target.value)} style={{width:'100%',padding:'8px 11px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none',background:'#fff'}}>
                  <option value="">All</option>
                  <option value="open">Open</option>
                  <option value="in_process">In Process</option>
                  <option value="approved">Approved</option>
                  <option value="incomplete">Incomplete</option>
                  <option value="canceled">Canceled</option>
                  <option value="closed_for_invoice">Closed for Invoice</option>
                  <option value="closed">Closed</option>
                </select>
              </div>
              <div>
                <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>On Hold</label>
                <select value={poFilterHold} onChange={e=>setPoFilterHold(e.target.value)} style={{width:'100%',padding:'8px 11px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none',background:'#fff'}}>
                  <option value="">All</option>
                  <option value="yes">Yes — On Hold</option>
                  <option value="no">No — Not on Hold</option>
                </select>
              </div>
            </div>

            {/* Wildcard Lookup Panel — appears when % is typed */}
            {showWildcard && wildcardResults.length > 0 && (
              <div style={{margin:'0 20px',border:'1.5px solid #1D4ED8',borderRadius:10,overflow:'hidden',boxShadow:'0 4px 16px rgba(29,78,216,.15)'}}>
                <div style={{padding:'9px 14px',background:'linear-gradient(135deg,#1E3A78,#1D4ED8)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <svg width="13" height="13" fill="none" stroke="#93C5FD" strokeWidth="2.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                    <span style={{fontSize:12,fontWeight:700,color:'#E2E8F0'}}>Wildcard Lookup — {wildcardResults.length} match{wildcardResults.length!==1?'es':''} found</span>
                    <span style={{fontSize:11,color:'#93C5FD'}}>Click to select</span>
                  </div>
                  <button onClick={()=>setShowWildcard(false)} style={{background:'rgba(255,255,255,.15)',border:'none',color:'#CBD5E1',cursor:'pointer',borderRadius:5,padding:'2px 8px',fontSize:12}}>✕</button>
                </div>
                <div style={{maxHeight:200,overflowY:'auto',background:'#fff'}}>
                  {wildcardResults.map((r,i)=>(
                    <div
                      key={i}
                      onClick={()=>{
                        if (wildcardField==='poNumber') setPoFilterPONumber(r.label);
                        if (wildcardField==='supplier') setPoFilterSupplier(r.label);
                        if (wildcardField==='buyer')    setPoFilterBuyer(r.label);
                        setShowWildcard(false);
                      }}
                      style={{padding:'9px 14px',borderBottom:'1px solid #F1F5F9',cursor:'pointer',display:'flex',alignItems:'center',gap:10,transition:'background .1s'}}
                      onMouseEnter={e=>e.currentTarget.style.background='#EFF6FF'}
                      onMouseLeave={e=>e.currentTarget.style.background='#fff'}
                    >
                      <svg width="11" height="11" fill="none" stroke="#1D4ED8" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
                      <div>
                        <div style={{fontSize:13,fontWeight:700,color:'#1E293B',fontFamily:wildcardField==='poNumber'?'monospace':'inherit'}}>{r.label}</div>
                        {r.sub && <div style={{fontSize:11,color:'#64748B',marginTop:1}}>{r.sub}</div>}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Find button */}
            <div style={{padding:'12px 20px',borderTop:'1px solid #F1F5F9',display:'flex',alignItems:'center',justifyContent:'space-between',background:'#F8FAFC'}}>
              <span style={{fontSize:12,color:'#64748B'}}>
                {!poDistSearchFired
                  ? 'Enter filters above and click Find to search'
                  : rows.length > 0
                    ? `${rows.length} line item${rows.length!==1?'s':''} across ${filteredPOs.length} PO${filteredPOs.length!==1?'s':''}`
                    : 'No results — adjust your filters and click Find again'
                }
              </span>
                <div style={{display:'flex',gap:8}}>
                <button onClick={()=>{ setPoFilterPONumber('');setPoFilterSupplier('');setPoFilterBuyer('');setPoFilterItem('');setPoFilterDateFrom('');setPoFilterDateTo('');setPoFilterApproval('');setPoFilterControl('');setPoFilterHold('');setPoDistPage(1);setPoDistSearchFired(false);setShowWildcard(false); }} style={{padding:'8px 16px',background:'#F1F5F9',color:'#475569',border:'1px solid #E2E8F0',borderRadius:8,fontWeight:600,fontSize:12,cursor:'pointer'}}>Clear All</button>
                <button onClick={()=>{setPoDistPage(1);setPoDistSearchFired(true);setShowWildcard(false);}} style={{display:'flex',alignItems:'center',gap:7,padding:'8px 22px',background:'linear-gradient(135deg,#1E3A78,#1D4ED8)',color:'#fff',border:'none',borderRadius:8,fontWeight:700,fontSize:13,cursor:'pointer'}}>
                  <svg width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                  Find
                </button>
              </div>
            </div>
          </div>

          {/* Distribution Table — only shown after Find is clicked */}
          {poDistSearchFired && rows.length > 0 && (
            <div style={{background:'#fff',borderRadius:14,border:'1px solid #E5E7EB',overflow:'hidden',boxShadow:'0 1px 4px rgba(0,0,0,.06)'}}>
              {/* Table header bar */}
              <div style={{padding:'12px 18px',borderBottom:'1px solid #F1F5F9',display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:13,fontWeight:700,color:'#1E293B'}}>Purchase Order Distribution</span>
                  <span style={{fontSize:11,fontWeight:700,color:'#1D4ED8',background:'#EFF6FF',padding:'2px 9px',borderRadius:20}}>{rows.length} line{rows.length!==1?'s':''}</span>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:11,color:'#94A3B8'}}>Drag column headers to reorder · Click header to sort · Click row to open PO</span>
                  {/* Pagination */}
                  <div style={{display:'flex',alignItems:'center',gap:4}}>
                    <button disabled={poDistPage===1} onClick={()=>setPoDistPage(p=>Math.max(1,p-1))} style={{padding:'4px 10px',border:'1px solid #E2E8F0',borderRadius:6,fontSize:12,fontWeight:600,color:poDistPage===1?'#CBD5E1':'#374151',background:poDistPage===1?'#F8FAFC':'#fff',cursor:poDistPage===1?'not-allowed':'pointer'}}>‹</button>
                    <span style={{fontSize:12,color:'#64748B',padding:'0 6px'}}>{poDistPage} / {totalPages}</span>
                    <button disabled={poDistPage===totalPages} onClick={()=>setPoDistPage(p=>Math.min(totalPages,p+1))} style={{padding:'4px 10px',border:'1px solid #E2E8F0',borderRadius:6,fontSize:12,fontWeight:600,color:poDistPage===totalPages?'#CBD5E1':'#374151',background:poDistPage===totalPages?'#F8FAFC':'#fff',cursor:poDistPage===totalPages?'not-allowed':'pointer'}}>›</button>
                  </div>
                </div>
              </div>

              <div style={{overflowX:'auto'}}>
                <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                  <thead>
                    <tr style={{background:'#F8FAFC',borderBottom:'2px solid #E2E8F0'}}>
                      {visibleCols.map(col => {
                        const def = COL_DEF[col];
                        if (!def) return null;
                        const isSorted = poDistSortCol === col;
                        return (
                          <th
                            key={col}
                            draggable
                            onDragStart={()=>setPoDistDragCol(col)}
                            onDragOver={e=>{e.preventDefault();}}
                            onDrop={()=>{
                              if (!poDistDragCol || poDistDragCol===col) return;
                              const cols = visibleCols.filter(c=>c!==poDistDragCol);
                              const idx  = cols.indexOf(col);
                              cols.splice(idx,0,poDistDragCol);
                              setPoDistColOrder(cols);
                              setPoDistDragCol(null);
                            }}
                            onClick={()=>{ if(poDistSortCol===col){setPoDistSortDir(d=>d==='asc'?'desc':'asc');}else{setPoDistSortCol(col);setPoDistSortDir('asc');} setPoDistPage(1); }}
                            style={{padding:'9px 12px',textAlign:'left',fontSize:10,fontWeight:700,color:isSorted?'#1D4ED8':'#64748B',textTransform:'uppercase',letterSpacing:'.06em',whiteSpace:'nowrap',cursor:'pointer',userSelect:'none',borderRight:'1px solid #F1F5F9',minWidth:def.w,background:isSorted?'#EFF6FF':'transparent',position:'relative'}}
                            title="Drag to reorder · Click to sort"
                          >
                            <span style={{display:'inline-flex',alignItems:'center',gap:4}}>
                              <span style={{cursor:'grab',color:'#CBD5E1',fontSize:10}}>⠿</span>
                              {def.label}
                              {isSorted && <span style={{fontSize:9}}>{poDistSortDir==='asc'?'▲':'▼'}</span>}
                            </span>
                          </th>
                        );
                      })}
                    </tr>
                  </thead>
                  <tbody>
                    {paginated.map((row, i) => {
                      const sc = statusColor(row.approvalStatus);
                      const cc = controlColor(row.control);
                      const sym = cs(row.currency);
                      return (
                        <tr
                          key={`${row._poId}-${row._itemIdx}`}
                          onClick={()=>{ const po = purchaseOrders.find(p=>p.id===row._poId); if(po) setActivePOReview(po); }}
                          style={{borderBottom:'1px solid #F1F5F9',cursor:'pointer',background:i%2===0?'#fff':'#FAFBFD',transition:'background .1s'}}
                          onMouseEnter={e=>e.currentTarget.style.background='#EFF6FF'}
                          onMouseLeave={e=>e.currentTarget.style.background=i%2===0?'#fff':'#FAFBFD'}
                        >
                          {visibleCols.map(col => {
                            if (!COL_DEF[col]) return null;
                            let cell;
                            switch(col) {
                              case 'poNumber': cell = <span style={{fontFamily:'monospace',fontWeight:700,color:'#1E293B'}}>{row.poNumber}{row.rev&&<span style={{marginLeft:5,fontSize:10,fontWeight:700,color:'#7C3AED',background:'#F3E8FF',padding:'1px 6px',borderRadius:8}}>{row.rev}</span>}</span>; break;
                              case 'rev':      cell = row.rev ? <span style={{fontSize:11,fontWeight:700,color:'#7C3AED'}}>{row.rev}</span> : <span style={{color:'#CBD5E1'}}>—</span>; break;
                              case 'supplier': cell = <span style={{fontWeight:600,color:'#374151'}}>{row.supplier}</span>; break;
                              case 'sku':      cell = <span style={{fontFamily:'monospace',fontSize:11,color:'#64748B'}}>{row.sku}</span>; break;
                              case 'description': cell = <span style={{fontWeight:500,color:'#1E293B',maxWidth:180,display:'block',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={row.description}>{row.description}</span>; break;
                              case 'category': cell = <span style={{color:'#64748B'}}>{row.category}</span>; break;
                              case 'unitPrice': cell = <span style={{fontFamily:'monospace',fontWeight:600,color:'#374151'}}>{sym}{parseFloat(row.unitPrice||0).toLocaleString('en-PH',{minimumFractionDigits:2})}</span>; break;
                              case 'qtyOrdered': cell = <span style={{fontWeight:700,color:'#1E293B',fontFamily:'monospace'}}>{row.qtyOrdered}</span>; break;
                              case 'uom':      cell = <span style={{color:'#64748B',fontFamily:'monospace'}}>{row.uom}</span>; break;
                              case 'amount':   cell = <span style={{fontFamily:'monospace',fontWeight:700,color:'#1D4ED8'}}>{sym}{parseFloat(row.amount||0).toLocaleString('en-PH',{minimumFractionDigits:2})}</span>; break;
                              case 'qtyDelivered': cell = <span style={{fontFamily:'monospace',fontWeight:600,color:row.qtyDelivered>0?'#059669':'#94A3B8'}}>{row.qtyDelivered>0?row.qtyDelivered:'—'}</span>; break;
                              case 'qtyCanceled': cell = <span style={{fontFamily:'monospace',fontWeight:600,color:row.qtyCanceled>0?'#DC2626':'#94A3B8'}}>{row.qtyCanceled>0?row.qtyCanceled:'—'}</span>; break;
                              case 'orderDate':   cell = <span style={{color:'#374151',whiteSpace:'nowrap'}}>{row.orderDate}</span>; break;
                              case 'needByDate':  cell = <span style={{color:'#374151',whiteSpace:'nowrap'}}>{row.needByDate||'—'}</span>; break;
                              case 'approvedDate':cell = <span style={{color:row.approvedDate!=='—'?'#059669':'#94A3B8',whiteSpace:'nowrap',fontWeight:row.approvedDate!=='—'?600:400}}>{row.approvedDate}</span>; break;
                              case 'buyer':    cell = <span style={{fontWeight:500,color:'#374151'}}>{row.buyer}</span>; break;
                              case 'approvalStatus': cell = <span style={{fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:20,color:sc.color,background:sc.bg,whiteSpace:'nowrap'}}>{row.approvalStatus}</span>; break;
                              case 'control':  cell = <span style={{fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:20,color:cc.color,background:cc.bg,whiteSpace:'nowrap'}}>{row.control}</span>; break;
                              case 'onHold':   cell = row.onHold==='Yes' ? <span style={{fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:20,color:'#92400E',background:'#FEF3C7'}}>⏸ Yes</span> : <span style={{color:'#94A3B8'}}>—</span>; break;
                              default: cell = <span style={{color:'#94A3B8'}}>—</span>;
                            }
                            return <td key={col} style={{padding:'10px 12px',borderRight:'1px solid #F8FAFC',verticalAlign:'middle'}}>{cell}</td>;
                          })}
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>

              {/* Bottom pagination */}
              {totalPages > 1 && (
                <div style={{padding:'10px 18px',borderTop:'1px solid #F1F5F9',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <span style={{fontSize:12,color:'#64748B'}}>Showing {(poDistPage-1)*poDistPageSize+1}–{Math.min(poDistPage*poDistPageSize,rows.length)} of {rows.length}</span>
                  <div style={{display:'flex',gap:4}}>
                    <button disabled={poDistPage===1} onClick={()=>setPoDistPage(1)} style={{padding:'4px 10px',border:'1px solid #E2E8F0',borderRadius:6,fontSize:12,cursor:poDistPage===1?'not-allowed':'pointer',color:poDistPage===1?'#CBD5E1':'#374151'}}>«</button>
                    <button disabled={poDistPage===1} onClick={()=>setPoDistPage(p=>p-1)} style={{padding:'4px 10px',border:'1px solid #E2E8F0',borderRadius:6,fontSize:12,cursor:poDistPage===1?'not-allowed':'pointer',color:poDistPage===1?'#CBD5E1':'#374151'}}>‹ Prev</button>
                    {Array.from({length:Math.min(5,totalPages)},(_,i)=>{ const pg=Math.max(1,Math.min(poDistPage-2,totalPages-4))+i; return <button key={pg} onClick={()=>setPoDistPage(pg)} style={{padding:'4px 10px',border:`1px solid ${pg===poDistPage?'#1D4ED8':'#E2E8F0'}`,borderRadius:6,fontSize:12,fontWeight:pg===poDistPage?700:400,background:pg===poDistPage?'#1D4ED8':'#fff',color:pg===poDistPage?'#fff':'#374151',cursor:'pointer'}}>{pg}</button>; })}
                    <button disabled={poDistPage===totalPages} onClick={()=>setPoDistPage(p=>p+1)} style={{padding:'4px 10px',border:'1px solid #E2E8F0',borderRadius:6,fontSize:12,cursor:poDistPage===totalPages?'not-allowed':'pointer',color:poDistPage===totalPages?'#CBD5E1':'#374151'}}>Next ›</button>
                    <button disabled={poDistPage===totalPages} onClick={()=>setPoDistPage(totalPages)} style={{padding:'4px 10px',border:'1px solid #E2E8F0',borderRadius:6,fontSize:12,cursor:poDistPage===totalPages?'not-allowed':'pointer',color:poDistPage===totalPages?'#CBD5E1':'#374151'}}>»</button>
                  </div>
                </div>
              )}
            </div>
          )}

          {poDistSearchFired && rows.length === 0 && (
            <div style={{background:'#fff',borderRadius:14,border:'1px dashed #E2E8F0',padding:'48px 24px',textAlign:'center',color:'#94A3B8'}}>
              <svg width="40" height="40" fill="none" stroke="#CBD5E1" strokeWidth="1.5" viewBox="0 0 24 24" style={{margin:'0 auto 12px',display:'block'}}><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6M9 16h4"/></svg>
              <div style={{fontSize:14,fontWeight:600,color:'#64748B',marginBottom:4}}>No purchase orders match your filters</div>
              <div style={{fontSize:12}}>Try adjusting the filters or click Clear All to see all POs</div>
            </div>
          )}
        </div>
      );
    })()}

  </div>
  )} {/* end list view ternary */}

    {/* ══ BULK PO MODAL ══ */}
    {showBulkPOModal && (
      <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" style={{backdropFilter:'blur(4px)'}}>
        <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">

          {/* Header */}
          <div className="flex items-center justify-between px-6 py-4 border-b border-gray-100">
            <div>
              <h3 className="text-lg font-black text-gray-900">Bulk Purchase Orders</h3>
              <p className="text-xs text-gray-400 mt-0.5">
                {bulkPOStep===1 ? 'Set order quantity — suppliers are fixed from inventory. Items with no linked supplier require manual assignment.' : 'Review POs grouped by supplier — one PO per supplier'}
              </p>
            </div>
            <button onClick={()=>setShowBulkPOModal(false)} className="w-8 h-8 rounded-lg border border-gray-200 flex items-center justify-center text-gray-400 hover:text-gray-700 hover:border-gray-300 transition-colors">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>

          {/* Step tabs */}
          <div className="flex border-b border-gray-100">
            {['Set Qty & Supplier','Review by Supplier'].map((lbl,i)=>(
              <div key={i} className={`flex-1 py-2.5 text-center text-xs font-bold transition-colors ${bulkPOStep===i+1?'text-indigo-600 border-b-2 border-indigo-600':'text-gray-400'}`}>{i+1}. {lbl}</div>
            ))}
          </div>

          {/* ── STEP 1: Set qty + supplier per item ── */}
          {bulkPOStep===1 && (
            <div className="flex-1 overflow-y-auto p-5 space-y-3">
              {(() => {
                // Unresolved = no inventory-linked supplier AND no manual selection made
                const hasUnresolved = bulkAlertItems.some(a => {
                  const linked = suppliers.find(s=>s.id===a.product.supplierId||s.name===a.product.supplier);
                  return !linked && !a.selectedSupplierId;
                });
                return (
                  <>
                    {hasUnresolved && (
                      <div className="flex items-start gap-3 p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-800">
                        <AlertTriangle className="w-4 h-4 text-amber-500 flex-shrink-0 mt-0.5"/>
                        <span>All items must have a supplier selected before proceeding. Items with no supplier linked in inventory need manual assignment.</span>
                      </div>
                    )}
                    {bulkAlertItems.map((alertItem, idx) => {
                      const { product, type, selectedSupplierId, qty } = alertItem;
                      const defaultSupplier = suppliers.find(s=>s.id===product.supplierId||s.name===product.supplier);
                      return (
                        <div key={product.id} className={`p-4 rounded-xl border-2 transition-colors ${defaultSupplier||selectedSupplierId ? 'border-green-200 bg-green-50' : 'border-red-200 bg-red-50'}`}>
                          <div className="flex items-start justify-between gap-3 mb-3">
                            <div className="flex-1 min-w-0">
                              <div className="flex items-center gap-2 mb-1">
                                <span className={`px-2 py-0.5 rounded text-xs font-black ${type==='out'?'bg-red-600 text-white':'bg-amber-500 text-white'}`}>{type==='out'?'OUT OF STOCK':'LOW STOCK'}</span>
                                <span className="font-bold text-sm text-gray-900 truncate">{product.name}</span>
                              </div>
                              <div className="flex items-center gap-3">
                                <span className="text-xs font-mono text-gray-400">{product.sku}</span>
                                <span className="text-xs text-gray-500">In stock: <strong>{product.stock}</strong>{type==='low'?` / Threshold: ${product.threshold}`:''}</span>
                                <span className="text-xs text-gray-500">Cost: <strong>₱{(product.price||0).toFixed(2)}</strong></span>
                              </div>
                            </div>
                            {(defaultSupplier||selectedSupplierId)
