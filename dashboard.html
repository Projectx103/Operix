                              ? <svg className="w-5 h-5 text-green-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>
                              : <svg className="w-5 h-5 text-red-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
                            }
                          </div>

                          <div className="grid grid-cols-2 gap-3">
                            {/* Qty to order */}
                            <div>
                              <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Order Qty</label>
                              <div className="flex items-center gap-2">
                                <button
                                  onClick={() => setBulkAlertItems(prev=>prev.map((a,i)=>i===idx?{...a,qty:Math.max(parseInt(product.moq)||1,parseInt(a.qty||1)-1)}:a))}
                                  className="w-8 h-8 rounded-lg border-2 border-gray-200 flex items-center justify-center text-gray-600 hover:border-indigo-400 hover:text-indigo-600 font-bold transition-colors bg-white text-lg leading-none"
                                >−</button>
                                <input
                                  type="number" min="1"
                                  value={qty||1}
                                  onChange={e => setBulkAlertItems(prev=>prev.map((a,i)=>i===idx?{...a,qty:Math.max(parseInt(product.moq)||1,parseInt(e.target.value)||1)}:a))}
                                  className="w-16 text-center px-2 py-1.5 border-2 border-gray-200 rounded-lg text-sm font-bold focus:outline-none focus:border-indigo-400 font-mono bg-white"
                                />
                                <button
                                  onClick={() => setBulkAlertItems(prev=>prev.map((a,i)=>i===idx?{...a,qty:parseInt(a.qty||1)+1}:a))}
                                  className="w-8 h-8 rounded-lg border-2 border-gray-200 flex items-center justify-center text-gray-600 hover:border-indigo-400 hover:text-indigo-600 font-bold transition-colors bg-white text-lg leading-none"
                                >+</button>
                                <span className="text-xs text-gray-400">Min: {product.moq||1}</span>
                              </div>
                              <p className="text-xs text-indigo-600 font-semibold mt-1">
                                Subtotal: ₱{((qty||1)*(product.price||0)).toFixed(2)}
                              </p>
                            </div>

                            {/* Supplier — locked if linked in inventory, dropdown only if missing */}
                            <div>
                              <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">
                                Supplier {defaultSupplier && <span className="normal-case text-green-600 font-semibold ml-1">✓ Linked</span>}
                              </label>
                              {defaultSupplier ? (
                                /* Locked — supplier came from inventory, cannot be changed */
                                <div className="flex items-center gap-2 px-3 py-2 bg-gray-50 border-2 border-gray-200 rounded-lg cursor-not-allowed">
                                  <div className="w-6 h-6 rounded-md bg-indigo-600 flex items-center justify-center text-white text-xs font-black flex-shrink-0">
                                    {defaultSupplier.name?.[0]||'S'}
                                  </div>
                                  <span className="text-sm font-semibold text-gray-700 truncate flex-1">{defaultSupplier.name}</span>
                                  <svg className="w-3.5 h-3.5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M12 17a2 2 0 100-4 2 2 0 000 4zm6-9V7a6 6 0 10-12 0v1a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V10a2 2 0 00-2-2z"/></svg>
                                </div>
                              ) : (
                                /* No supplier linked — must assign manually */
                                <>
                                  <select
                                    className="w-full px-3 py-1.5 border-2 border-red-300 rounded-lg text-sm font-medium focus:outline-none focus:border-indigo-400 bg-white"
                                    value={selectedSupplierId}
                                    onChange={e => setBulkAlertItems(prev => prev.map((a,i)=>i===idx?{...a,selectedSupplierId:e.target.value}:a))}
                                  >
                                    <option value="">— Select supplier —</option>
                                    {suppliers.map(s => (
                                      <option key={s.id} value={s.id}>{s.name}</option>
                                    ))}
                                  </select>
                                  <p className="text-xs text-red-500 mt-1 font-semibold">⚠ No supplier linked in inventory — assign one</p>
                                </>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </>
                );
              })()}
            </div>
          )}

          {/* ── STEP 2: Review grouped by supplier ── */}
          {bulkPOStep===2 && (
            <div className="flex-1 overflow-y-auto p-5 space-y-4">
              {(() => {
                const groups = {};
                bulkAlertItems.forEach(a => {
                  const linked = suppliers.find(s=>s.id===a.product.supplierId||s.name===a.product.supplier);
                  const key = linked ? linked.id : a.selectedSupplierId;
                  if (!groups[key]) groups[key] = { supplier: suppliers.find(s=>s.id===key), items: [] };
                  groups[key].items.push(a);
                });
                const groupEntries = Object.entries(groups);
                return (
                  <>
                    <div className="flex items-center gap-2 p-3 bg-indigo-50 border border-indigo-100 rounded-xl text-xs text-indigo-800 font-semibold">
                      <svg className="w-4 h-4 text-indigo-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                      <span><strong>{groupEntries.length} Purchase Order{groupEntries.length>1?'s':''}</strong> will be created — one per supplier. Each opens in a separate tab so you can complete delivery details and submit individually.</span>
                    </div>
                    {groupEntries.map(([suppId, grp]) => {
                      const suppTotal = grp.items.reduce((s,a)=>(s+(a.qty||1)*(a.product.price||0)),0);
                      return (
                        <div key={suppId} className="border border-gray-200 rounded-xl overflow-hidden">
                          <div className="flex items-center gap-3 px-4 py-3 bg-indigo-50 border-b border-indigo-100">
                            <div className="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white text-sm font-black flex-shrink-0">{grp.supplier?.name?.[0]||'?'}</div>
                            <div className="flex-1 min-w-0">
                              <div className="font-bold text-sm text-indigo-900">{grp.supplier?.name||'Unknown Supplier'}</div>
                              <div className="text-xs text-indigo-500">{grp.items.length} item{grp.items.length>1?'s':''} · {grp.supplier?.currency||'PHP'} · {grp.supplier?.paymentTerms||'Net 30'}</div>
                            </div>
                            <div className="text-right flex-shrink-0">
                              <div className="text-xs font-black text-indigo-700 bg-indigo-100 px-2 py-1 rounded">1 PO</div>
                              <div className="text-xs text-indigo-600 font-bold mt-1">Est. ₱{suppTotal.toFixed(2)}</div>
                            </div>
                          </div>
                          <table className="w-full text-xs">
                            <thead><tr className="bg-gray-50 border-b border-gray-100">
                              <th className="px-4 py-2 text-left font-bold text-gray-500 uppercase tracking-wider">Product</th>
                              <th className="px-4 py-2 text-left font-bold text-gray-500 uppercase tracking-wider">Type</th>
                              <th className="px-4 py-2 text-center font-bold text-gray-500 uppercase tracking-wider">Qty</th>
                              <th className="px-4 py-2 text-right font-bold text-gray-500 uppercase tracking-wider">Unit Cost</th>
                              <th className="px-4 py-2 text-right font-bold text-gray-500 uppercase tracking-wider">Line Total</th>
                            </tr></thead>
                            <tbody className="divide-y divide-gray-50">
                              {grp.items.map(a => (
                                <tr key={a.product.id} className="hover:bg-gray-50">
                                  <td className="px-4 py-2.5">
                                    <div className="font-semibold text-gray-800">{a.product.name}</div>
                                    <div className="font-mono text-gray-400 text-xs">{a.product.sku}</div>
                                  </td>
                                  <td className="px-4 py-2.5">
                                    <span className={`px-1.5 py-0.5 rounded text-xs font-black ${a.type==='out'?'bg-red-100 text-red-700':'bg-amber-100 text-amber-700'}`}>{a.type==='out'?'Out':'Low'}</span>
                                  </td>
                                  <td className="px-4 py-2.5 text-center font-bold font-mono text-gray-800">{a.qty||1}</td>
                                  <td className="px-4 py-2.5 text-right font-mono text-gray-600">₱{(a.product.price||0).toFixed(2)}</td>
                                  <td className="px-4 py-2.5 text-right font-mono font-bold text-indigo-700">₱{((a.qty||1)*(a.product.price||0)).toFixed(2)}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      );
                    })}
                    <p className="text-xs text-gray-400 text-center pb-1">
                      Total est. value: <strong>₱{bulkAlertItems.reduce((s,a)=>(s+(a.qty||1)*(a.product.price||0)),0).toFixed(2)}</strong> across {groupEntries.length} PO{groupEntries.length>1?'s':''}
                    </p>
                  </>
                );
              })()}
            </div>
          )}

          {/* Footer */}
          <div className="flex items-center justify-between px-6 py-4 border-t border-gray-100 bg-gray-50">
            <button onClick={()=>bulkPOStep>1?setBulkPOStep(1):setShowBulkPOModal(false)} className="px-4 py-2 text-sm font-semibold text-gray-600 border border-gray-200 rounded-lg hover:bg-white transition-colors">
              {bulkPOStep===1?'Cancel':'← Back'}
            </button>
            <div className="flex items-center gap-3">
              {bulkPOStep===1 && (
                <span className="text-xs text-gray-400">
                  {bulkAlertItems.filter(a=>{ const l=suppliers.find(s=>s.id===a.product.supplierId||s.name===a.product.supplier); return l||a.selectedSupplierId; }).length}/{bulkAlertItems.length} suppliers confirmed
                </span>
              )}
              {bulkPOStep===1 ? (
                <button
                  disabled={bulkAlertItems.some(a=>{ const l=suppliers.find(s=>s.id===a.product.supplierId||s.name===a.product.supplier); return !l&&!a.selectedSupplierId; })}
                  onClick={()=>setBulkPOStep(2)}
                  className="px-5 py-2 text-sm font-bold bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
                >Review by Supplier →</button>
              ) : (
                <button
                  onClick={async () => {
                    const groups = {};
                    bulkAlertItems.forEach(a => {
                      const linked = suppliers.find(s=>s.id===a.product.supplierId||s.name===a.product.supplier);
                      const key = linked ? linked.id : a.selectedSupplierId;
                      if (!groups[key]) groups[key] = [];
                      groups[key].push(a);
                    });
                    const entries = Object.entries(groups);
                    entries.forEach(([suppId, items], i) => {
                      const productIds = items.map(a=>a.product.id).join(',');
                      const qtys = items.map(a=>a.qty||1).join(',');
                      const url = `create-po.html?supplierId=${suppId}&productIds=${productIds}&qtys=${qtys}&locked=1`;
                      if (i===0) window.location.href = url;
                      else window.open(url, '_blank');
                    });
                    setShowBulkPOModal(false);
                  }}
                  className="px-5 py-2 text-sm font-bold bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors flex items-center gap-2"
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>
                  Open {Object.keys((() => { const g={}; bulkAlertItems.forEach(a=>{if(!g[a.selectedSupplierId])g[a.selectedSupplierId]=1;}); return g; })()).length} PO{Object.keys((() => { const g={}; bulkAlertItems.forEach(a=>{if(!g[a.selectedSupplierId])g[a.selectedSupplierId]=1;}); return g; })()).length>1?'s':''} in Tabs
                </button>
              )}
            </div>
          </div>
        </div>
      </div>
    )}

  </div>
)}

{/* ── Receiving Module ── */}
{activeModule === 'receiving' && (
  <div className="space-y-6">
  <div style={{maxWidth:900,margin:'0 auto',padding:'8px 0'}}>

    {/* Header */}
    <div style={{background:'linear-gradient(135deg,#059669,#0D9488)',borderRadius:16,padding:'24px 28px',marginBottom:24,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <div>
        <div style={{fontSize:22,fontWeight:900,color:'#fff',letterSpacing:'-.5px'}}>📦 Receiving</div>
        <div style={{fontSize:13,color:'rgba(255,255,255,.75)',marginTop:4}}>Process incoming goods and generate receipts</div>
      </div>
      {receivingStep > 1 && (
        <button onClick={resetReceiving}
          style={{background:'rgba(255,255,255,.15)',color:'#fff',border:'1px solid rgba(255,255,255,.3)',padding:'8px 18px',borderRadius:10,fontSize:12,fontWeight:700,cursor:'pointer'}}>
          ← New Receipt
        </button>
      )}
    </div>

    {/* Step 1 — Search */}
    {receivingStep === 1 && (
      <div style={{background:'#fff',borderRadius:16,border:'1px solid #E5E7EB',padding:'32px',textAlign:'center'}}>
        <div style={{width:64,height:64,background:'linear-gradient(135deg,#059669,#0D9488)',borderRadius:16,display:'flex',alignItems:'center',justifyContent:'center',fontSize:28,margin:'0 auto 20px'}}>📋</div>
        <div style={{fontSize:18,fontWeight:800,color:'#1E293B',marginBottom:6}}>Receipt Lookup</div>
        <div style={{fontSize:13,color:'#64748B',marginBottom:28}}>Enter the PO number to load order details</div>
        <div style={{display:'flex',gap:10,maxWidth:420,margin:'0 auto'}}>
          <input
            value={receivingPONumber}
            onChange={e=>setReceivingPONumber(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&findReceivingPO()}
            placeholder="e.g. 0034048"
            style={{flex:1,padding:'12px 16px',border:'2px solid #E5E7EB',borderRadius:10,fontSize:14,fontWeight:600,outline:'none',fontFamily:'monospace'}}
          />
          <button onClick={findReceivingPO}
            style={{padding:'12px 24px',background:'linear-gradient(135deg,#059669,#0D9488)',color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
            Find PO
          </button>
        </div>
        {receivingPOError && (
          <div style={{marginTop:16,padding:'10px 16px',background:'#FEF2F2',border:'1px solid #FECACA',borderRadius:8,color:'#991B1B',fontSize:12,fontWeight:600,maxWidth:420,margin:'16px auto 0'}}>
            ⚠ {receivingPOError}
          </div>
        )}

        {/* Ordered POs quick list — ready for receiving */}
        {(()=>{
          const orderedPOs = purchaseOrders.filter(p=>p.status==='ordered');
          if (!orderedPOs.length) return null;
          return (
            <div style={{marginTop:32,textAlign:'left'}}>
              <div style={{fontSize:11,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:12}}>Ready to Receive ({orderedPOs.length})</div>
              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {orderedPOs.map(po=>(
                  <div key={po.id} onClick={()=>{ setReceivingPONumber(po.poNumber); findReceivingPO_direct(po); }}
                    style={{background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:10,padding:'12px 16px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'space-between'}}
                    onMouseOver={e=>e.currentTarget.style.background='#FEF3C7'}
                    onMouseOut={e=>e.currentTarget.style.background='#FFFBEB'}>
                    <div>
                      <div style={{fontSize:13,fontWeight:700,color:'#92400E',fontFamily:'monospace'}}>{po.poNumber}</div>
                      <div style={{fontSize:11,color:'#4B5563',marginTop:2}}>{po.supplierName} · {po.items?.length||0} items · ₱{(po.grandTotal||0).toLocaleString()}</div>
                    </div>
                    <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
                      <div style={{fontSize:11,fontWeight:700,color:'#B45309',background:'#FEF3C7',padding:'3px 10px',borderRadius:6}}>ORDERED</div>
                      <div style={{fontSize:10,color:'#6B7280'}}>Click to receive →</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        })()}
      </div>
    )}

    {/* Step 2 — Items Table */}
    {receivingStep === 2 && receivingPO && (
      <div style={{display:'flex',flexDirection:'column',gap:16}}>
        {/* PO Summary Card */}
        <div style={{background:'#fff',borderRadius:14,border:'1px solid #E5E7EB',padding:'20px 24px'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:12}}>
            <div>
              <div style={{fontSize:11,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:4}}>Purchase Order</div>
              <div style={{fontSize:20,fontWeight:900,color:'#1E293B',fontFamily:'monospace'}}>{receivingPO.poNumber}</div>
              <div style={{fontSize:13,color:'#64748B',marginTop:4}}>{receivingPO.supplierName} · {receivingPO.currency} {(receivingPO.grandTotal||0).toLocaleString()}</div>
            </div>
            <div style={{background:'#F0FDF4',border:'1px solid #BBF7D0',borderRadius:10,padding:'8px 16px',textAlign:'center'}}>
              <div style={{fontSize:10,fontWeight:700,color:'#166534',textTransform:'uppercase'}}>Status</div>
              <div style={{fontSize:13,fontWeight:800,color:'#059669',marginTop:2}}>Received</div>
            </div>
          </div>
        </div>

        {/* Items Table */}
        <div style={{background:'#fff',borderRadius:14,border:'1px solid #E5E7EB',overflow:'hidden'}}>
          <div style={{padding:'16px 24px',borderBottom:'1px solid #F1F5F9',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div style={{fontSize:13,fontWeight:700,color:'#1E293B'}}>Line Items</div>
            <div style={{fontSize:11,color:'#64748B'}}>Check items received · adjust quantities as needed</div>
          </div>
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse'}}>
              <thead>
                <tr style={{background:'#F8FAFC'}}>
                  <th style={{padding:'10px 16px',textAlign:'left',fontSize:11,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.05em',width:40}}>✓</th>
                  <th style={{padding:'10px 16px',textAlign:'left',fontSize:11,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.05em'}}>Product</th>
                  <th style={{padding:'10px 16px',textAlign:'left',fontSize:11,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.05em'}}>SKU</th>
                  <th style={{padding:'10px 16px',textAlign:'center',fontSize:11,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.05em'}}>Ordered</th>
                  <th style={{padding:'10px 16px',textAlign:'center',fontSize:11,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.05em'}}>Received Qty</th>
                  <th style={{padding:'10px 16px',textAlign:'center',fontSize:11,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.05em'}}>Variance</th>
                </tr>
              </thead>
              <tbody>
                {receivingItems.map((it, idx)=>(

                      <input type="checkbox" checked={it.checked} onChange={e=>updateReceivingCheck(idx,e.target.checked)}

                    </td>
                    <td style={{padding:'12px 16px'}}>
                      <div style={{fontSize:13,fontWeight:700,color:'#1E293B'}}>{it.productName}</div>
                    </td>
                    <td style={{padding:'12px 16px',fontSize:12,color:'#64748B',fontFamily:'monospace'}}>{it.sku||'—'}</td>
                    <td style={{padding:'12px 16px',textAlign:'center',fontSize:13,fontWeight:700,color:'#1E293B'}}>{it.orderedQty}</td>
                    <td style={{padding:'12px 16px',textAlign:'center'}}>
                      <input
                        type="number" min={0} max={it.orderedQty}
                        value={it.receivedQty}
                        onChange={e=>updateReceivingQty(idx,e.target.value)}
                        disabled={!it.checked}
                        style={{width:70,padding:'6px 10px',border:`2px solid ${it.receivedQty<it.orderedQty?'#F59E0B':'#D1FAE5'}`,borderRadius:8,fontSize:13,fontWeight:700,textAlign:'center',background:it.checked?'#fff':'#F8FAFC',color:'#1E293B'}}
                      />
                    </td>
                    <td style={{padding:'12px 16px',textAlign:'center'}}>
                      {it.checked && it.receivedQty < it.orderedQty && (
                        <span style={{fontSize:11,fontWeight:700,color:'#92400E',background:'#FEF3C7',padding:'2px 8px',borderRadius:6}}>
                          -{it.orderedQty - it.receivedQty} short
                        </span>
                      )}
                      {it.checked && it.receivedQty === it.orderedQty && (

            </button>
          </div>
        </div>
      </div>

    {/* Step 3 — Receipt Header */}

          <div style={{fontSize:15,fontWeight:800,color:'#1E293B'}}>Receipt Header</div>
          <div style={{fontSize:12,color:'#64748B',marginTop:2}}>Fill in the supplier documentation details</div>

        <div style={{padding:'28px',display:'flex',flexDirection:'column',gap:20}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>

              </label>
              <input value={receivingHeader.invoiceNumber||''} onChange={e=>setReceivingHeader(h=>({...h,invoiceNumber:e.target.value,packingSlip:e.target.value}))}

                style={{width:'100%',padding:'10px 14px',border:'1.5px solid #E5E7EB',borderRadius:10,fontSize:13,outline:'none',boxSizing:'border-box'}}/>

            </div>
            <div>
              <label style={{fontSize:11,fontWeight:700,color:'#374151',textTransform:'uppercase',letterSpacing:'.05em',display:'block',marginBottom:6}}>

              </label>
              <input type="date" value={receivingHeader.invoiceDate||''} onChange={e=>setReceivingHeader(h=>({...h,invoiceDate:e.target.value,shippedDate:e.target.value}))}
                style={{width:'100%',padding:'10px 14px',border:'1.5px solid #E5E7EB',borderRadius:10,fontSize:13,outline:'none',boxSizing:'border-box'}}/>
              <div style={{fontSize:10,color:'#9CA3AF',marginTop:4}}>Date printed on the supplier's invoice</div>
            </div>
          </div>
          <div>
            <label style={{fontSize:11,fontWeight:700,color:'#374151',textTransform:'uppercase',letterSpacing:'.05em',display:'block',marginBottom:8}}>Receipt Type</label>
            <div style={{display:'flex',gap:10}}>
              {[{v:'new',label:'New Receipt',desc:'First delivery for this PO'},{v:'add',label:'Add to Receipt',desc:'Partial / additional delivery'}].map(opt=>(
                <div key={opt.v} onClick={()=>setReceivingHeader(h=>({...h,receiptMode:opt.v}))}
                  style={{flex:1,padding:'14px 16px',border:`2px solid ${receivingHeader.receiptMode===opt.v?'#059669':'#E5E7EB'}`,borderRadius:12,cursor:'pointer',background:receivingHeader.receiptMode===opt.v?'#F0FDF4':'#fff',transition:'all .15s'}}>
                  <div style={{fontSize:13,fontWeight:700,color:receivingHeader.receiptMode===opt.v?'#059669':'#1E293B'}}>{opt.label}</div>
                  <div style={{fontSize:11,color:'#64748B',marginTop:2}}>{opt.desc}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Summary of items being received */}
          <div style={{background:'#F8FAFC',borderRadius:10,border:'1px solid #E5E7EB',padding:'14px 16px'}}>
            <div style={{fontSize:11,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:10}}>Receipt Summary</div>
            {receivingItems.filter(it=>it.checked).map((it,i)=>(
              <div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'#374151',padding:'4px 0',borderBottom:'1px solid #F1F5F9'}}>
                <span style={{fontWeight:600}}>{it.productName}</span>
                <span style={{color:it.receivedQty<it.orderedQty?'#92400E':'#166534',fontWeight:700}}>{it.receivedQty} / {it.orderedQty} {it.receivedQty<it.orderedQty?'(partial)':'(full)'}</span>

        </div>
        <div style={{padding:'16px 28px',borderTop:'1px solid #F1F5F9',background:'#F8FAFC',display:'flex',gap:10,justifyContent:'flex-end'}}>
          <button onClick={()=>setReceivingStep(2)}
            style={{padding:'10px 22px',background:'#fff',color:'#64748B',border:'1px solid #E5E7EB',borderRadius:10,fontSize:13,fontWeight:600,cursor:'pointer'}}>
            ← Back
          </button>
          <button onClick={processReceipt} disabled={receivingSubmitting}
            style={{padding:'10px 28px',background:'linear-gradient(135deg,#059669,#0D9488)',color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer',opacity:receivingSubmitting?.6:1}}>
            {receivingSubmitting ? 'Processing...' : '✓ Save Receipt & Close PO'}
          </button>
        </div>
      </div>
    )}

    {/* Step 4 — Success */}
    {receivingStep === 4 && (
      <div style={{background:'#fff',borderRadius:16,border:'1px solid #BBF7D0',padding:'48px 32px',textAlign:'center'}}>
        <div style={{width:72,height:72,background:'linear-gradient(135deg,#059669,#10B981)',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:32,margin:'0 auto 20px'}}>✓</div>
        <div style={{fontSize:20,fontWeight:900,color:'#166534',marginBottom:8}}>Receipt Saved & Stock Updated!</div>
        <div style={{fontSize:13,color:'#64748B',marginBottom:6}}>PO {receivingPO?.poNumber} has been marked as <strong style={{color:'#059669'}}>Received</strong> and inventory has been updated.</div>
        <div style={{fontSize:12,color:'#92400E',background:'#FEF3C7',border:'1px solid #FCD34D',borderRadius:8,padding:'8px 16px',display:'inline-block',marginBottom:20}}>
          📋 Next step: Go to <strong>Payables → Supplier Invoice Queue</strong> to match &amp; approve the invoice
        </div>
        <div style={{background:'#F0FDF4',border:'2px solid #BBF7D0',borderRadius:12,padding:'20px',display:'inline-block',marginBottom:28}}>
          <div style={{fontSize:11,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:4}}>Receipt Number</div>
          <div style={{fontSize:28,fontWeight:900,color:'#059669',fontFamily:'monospace',letterSpacing:'2px'}}>{lastReceiptNumber}</div>
        </div>
        <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap'}}>
          <button onClick={resetReceiving}
            style={{padding:'11px 24px',background:'linear-gradient(135deg,#059669,#0D9488)',color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
            Process Another Receipt
          </button>
          {payablesEnabled && (
            <button onClick={()=>setActiveModule('payables')}
              style={{padding:'11px 24px',background:'linear-gradient(135deg,#B45309,#D97706)',color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
              💳 Go to Payables →
            </button>
          )}
          <button onClick={()=>setActiveModule('purchases')}
            style={{padding:'11px 24px',background:'#F1F5F9',color:'#475569',border:'1px solid #E2E8F0',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
            View Purchases
          </button>
        </div>
      </div>
    )}

  </div>
  </div>
)}

{/* ══ FINANCIAL MONITORING MODULE ══ */}
{activeModule === 'financial_monitoring' && (
  <div className="space-y-6 animate-fadeIn">
    {/* Header */}

                  <td style={{padding:'11px 16px',fontWeight:800,color:'#1E293B'}}>₱{amt.toLocaleString('en-PH',{minimumFractionDigits:2})}</td>
                  <td style={{padding:'11px 16px'}}>

      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>

)}
