    .sort((a,b)=>(b.createdAt?.toDate?.()?.getTime()||0)-(a.createdAt?.toDate?.()?.getTime()||0));

  /* ── Filtered/sorted/paged for All Orders tab ── */
  const filteredAll = orders.filter(order=>{
    const q = orderSearchQuery.toLowerCase();
    const matchSearch = !q || order.orderNumber?.toLowerCase().includes(q) || order.customerName?.toLowerCase().includes(q) || order.customerEmail?.toLowerCase().includes(q);
    const matchStatus = orderStatusFilter==='all' || order.status===orderStatusFilter;
    let matchDate = true;
    if(orderDateRange.start||orderDateRange.end){
      const d = order.createdAt?.toDate ? order.createdAt.toDate() : null;
      if(d){
        if(orderDateRange.start && d < new Date(orderDateRange.start)) matchDate=false;
        if(orderDateRange.end   && d > new Date(orderDateRange.end+'T23:59:59')) matchDate=false;
      }
    }
    return matchSearch && matchStatus && matchDate;
  });
  const sortedAll = [...filteredAll].sort((a,b)=>{
    const dir = orderSort.dir==='asc'?1:-1;
    if(orderSort.key==='createdAt'){ return dir*((a.createdAt?.toDate?.()?.getTime()||0)-(b.createdAt?.toDate?.()?.getTime()||0)); }
    if(orderSort.key==='totalAmount'){ return dir*(a.totalAmount-b.totalAmount); }
    return dir*String(a[orderSort.key]||'').localeCompare(String(b[orderSort.key]||''));
  });
  const orderTotalPages = Math.max(1,Math.ceil(sortedAll.length/orderItemsPerPage));
  const safeOrderPage   = Math.min(orderCurrentPage,orderTotalPages);
  const pagedOrders     = sortedAll.slice((safeOrderPage-1)*orderItemsPerPage,safeOrderPage*orderItemsPerPage);
  const handleSort      = (key) => setOrderSort(s=>({key,dir:s.key===key&&s.dir==='asc'?'desc':'asc'}));
  const SortIcon        = ({k}) => <span className={`ml-1 text-xs ${orderSort.key===k?'opacity-100':'opacity-30'}`}>{orderSort.key===k?(orderSort.dir==='asc'?'↑':'↓'):'↕'}</span>;

  const fmtDate = (ts) => {
    if(!ts) return '—';
    const d = ts.toDate?ts.toDate():new Date(ts);
    return isNaN(d)?'—':d.toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'});
  };
  const fmtDateTime = (ts) => {
    if(!ts) return '—';
    const d = ts.toDate?ts.toDate():new Date(ts);
    return isNaN(d)?'—':d.toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});
  };

  return (
    <div>

      {/* ── Module-level tabs: AutoCreate | All Orders ── */}
      <div style={{display:'flex',alignItems:'center',gap:0,background:'#fff',borderRadius:14,border:'1px solid #E5E7EB',overflow:'hidden',marginBottom:16,boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}}>
        {[
          { id:'autocreate', label:'AutoCreate', sub:'Order Placement Queue',
            icon:<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2M9 12h6m-6 4h4"/></svg>,
            count: pendingOrders.length, countColor:'#64748B' },
          { id:'all', label:'Orders Summary', sub:'All statuses',
            icon:<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M3 10h18M3 6h18M3 14h18M3 18h18"/></svg>,
            count: orders.filter(o=>o.status!=='cancelled').length, countColor:'#2563EB' },
        ].map(tab=>{
          const active = ordersModuleTab===tab.id;
          return (
            <button key={tab.id} onClick={()=>{setOrdersModuleTab(tab.id);setOrderDetailId(null);setOrderDetailPackedItems({});setAutoCreateExpandedId(null);}}
              style={{flex:1,display:'flex',alignItems:'center',gap:12,padding:'14px 20px',
                background:active?'#0F172A':'transparent',
                borderRight:tab.id==='autocreate'?'1px solid #E5E7EB':'none',
                cursor:'pointer',border:active?'none':'none',transition:'all .15s'}}>
              <div style={{width:36,height:36,borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',
                background:active?'rgba(255,255,255,0.12)':'#F1F5F9',
                color:active?'#fff':'#64748B',flexShrink:0}}>
                {tab.icon}
              </div>
              <div style={{textAlign:'left',flex:1}}>
                <div style={{fontSize:14,fontWeight:800,color:active?'#fff':'#1E293B',letterSpacing:'-.2px'}}>{tab.label}</div>
                <div style={{fontSize:11,color:active?'#94A3B8':'#94A3B8',marginTop:1}}>{tab.sub}</div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontSize:22,fontWeight:900,color:active?'#fff':tab.countColor,lineHeight:1}}>{tab.count}</div>
                <div style={{fontSize:10,color:active?'#94A3B8':'#94A3B8',marginTop:1}}>orders</div>
              </div>
            </button>
          );
        })}
      </div>

      {/* ══════════════════════════════════════════════════════
          TAB 1 — AUTOCREATE (Oracle EBS style order placement)
      ══════════════════════════════════════════════════════ */}
      {ordersModuleTab==='autocreate'&&(
        <div>
          {/* Header info banner */}
          <div style={{background:'#EFF6FF',border:'1px solid #BFDBFE',borderRadius:10,padding:'11px 16px',marginBottom:14,display:'flex',alignItems:'center',gap:10}}>
            <svg width="16" height="16" fill="none" stroke="#2563EB" viewBox="0 0 24 24" strokeWidth={2} style={{flexShrink:0}}><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span style={{fontSize:12,color:'#1D4ED8',lineHeight:1.5}}>
              <strong>AutoCreate — Order Placement Queue.</strong> Review each customer order below and click <strong>Confirm Order</strong> to issue it into the system. Confirmed orders will route through approval if configured, then enter Processing.
            </span>
          </div>

          {pendingOrders.length===0 ? (
            <div style={{background:'#fff',borderRadius:14,border:'1px solid #E5E7EB',padding:'60px 20px',textAlign:'center'}}>
              <svg width="48" height="48" fill="none" stroke="#E2E8F0" viewBox="0 0 24 24" strokeWidth={1} style={{margin:'0 auto 14px',display:'block'}}><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
              <div style={{fontSize:15,fontWeight:700,color:'#94A3B8',marginBottom:4}}>No orders awaiting placement</div>
              <div style={{fontSize:12,color:'#CBD5E1'}}>New orders from the shop will appear here for you to review and confirm</div>
            </div>
          ) : (
            <div style={{background:'#fff',borderRadius:14,border:'1px solid #E5E7EB',overflow:'hidden',boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}}>
              {/* Table header */}
              <div style={{display:'grid',gridTemplateColumns:'44px 1fr 1fr 120px 130px 120px 44px',alignItems:'center',background:'#F8FAFC',borderBottom:'1px solid #E2E8F0',padding:'0 0'}}>
                {['','Order #','Customer / Supplier','Date','Items','Total',''].map((h,i)=>(
                  <div key={i} style={{padding:'10px 14px',fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.07em',color:'#94A3B8'}}>{h}</div>
                ))}
              </div>

              {pendingOrders.map((order,idx)=>{
                const isExpanded = autoCreateExpandedId===order.id;
                const orderDate  = fmtDate(order.createdAt);
                /* resolve supplier = admin's company name (from profile) */
                const supplierName = user.companyName || user.displayName || 'Operix';
                return (
                  <div key={order.id} style={{borderBottom:idx<pendingOrders.length-1?'1px solid #F1F5F9':'none'}}>
                    {/* Summary row */}
                    <div
                      onClick={()=>setAutoCreateExpandedId(isExpanded?null:order.id)}
                      style={{display:'grid',gridTemplateColumns:'44px 1fr 1fr 120px 130px 120px 44px',alignItems:'center',
                        background:isExpanded?'#0F172A':'#fff',cursor:'pointer',
                        transition:'background .12s'}}
                      onMouseEnter={e=>{if(!isExpanded)e.currentTarget.style.background='#F8FAFC'}}
                      onMouseLeave={e=>{if(!isExpanded)e.currentTarget.style.background='#fff'}}>

                      {/* Expand toggle */}
                      <div style={{padding:'14px',display:'flex',alignItems:'center',justifyContent:'center'}}>
                        <svg width="14" height="14" fill="none" stroke={isExpanded?'#94A3B8':'#CBD5E1'} viewBox="0 0 24 24" strokeWidth={2.5}
                          style={{transform:isExpanded?'rotate(90deg)':'rotate(0deg)',transition:'transform .2s'}}>
                          <path strokeLinecap="round" strokeLinejoin="round" d="M9 18l6-6-6-6"/>
                        </svg>
                      </div>

                      {/* Order # */}
                      <div style={{padding:'14px'}}>
                        <div style={{fontSize:13,fontWeight:800,fontFamily:'monospace',color:isExpanded?'#fff':'#1E293B'}}>{order.orderNumber}</div>
                        <div style={{fontSize:10,color:isExpanded?'#94A3B8':'#94A3B8',marginTop:2}}>{order.paymentMethod||'—'}</div>
                      </div>

                      {/* Customer / Supplier */}
                      <div style={{padding:'14px'}}>
                        <div style={{display:'flex',flexDirection:'column',gap:2}}>
                          <div style={{display:'flex',alignItems:'center',gap:6}}>
                            <svg width="10" height="10" fill="none" stroke={isExpanded?'#94A3B8':'#94A3B8'} viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                            <span style={{fontSize:12,fontWeight:600,color:isExpanded?'#fff':'#1E293B'}}>{order.customerName||'—'}</span>
                          </div>
                          <div style={{display:'flex',alignItems:'center',gap:6}}>
                            <svg width="10" height="10" fill="none" stroke={isExpanded?'#94A3B8':'#94A3B8'} viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                            <span style={{fontSize:11,color:isExpanded?'#64748B':'#64748B'}}>Supplier: <strong style={{color:isExpanded?'#94A3B8':'#374151'}}>{supplierName}</strong></span>
                          </div>
                        </div>
                      </div>

                      {/* Date */}
                      <div style={{padding:'14px',fontSize:12,color:isExpanded?'#94A3B8':'#475569'}}>{orderDate}</div>

                      {/* Items count */}
                      <div style={{padding:'14px'}}>
                        <div style={{fontSize:12,fontWeight:600,color:isExpanded?'#94A3B8':'#374151'}}>{order.items?.length||0} item{(order.items?.length||0)!==1?'s':''}</div>
                        <div style={{fontSize:10,color:isExpanded?'#64748B':'#94A3B8',marginTop:1}}>{(order.items||[]).map(i=>i.name).slice(0,2).join(', ')}{(order.items||[]).length>2?', …':''}</div>
                      </div>

                      {/* Total */}
                      <div style={{padding:'14px'}}>
                        <div style={{fontSize:14,fontWeight:900,color:isExpanded?'#fff':'#1E293B'}}>₱{(order.totalAmount||0).toFixed(2)}</div>
                      </div>

                      {/* Status dot */}
                      <div style={{padding:'14px',display:'flex',alignItems:'center',justifyContent:'center'}}>
                        <div style={{width:8,height:8,borderRadius:'50%',background:'#64748B',boxShadow:'0 0 0 3px #E2E8F0'}}/>
                      </div>
                    </div>

                    {/* Expanded detail panel */}
                    {isExpanded&&(
                      <div style={{background:'#F8FAFC',borderTop:'1px solid #1E293B'}}>

                        {/* Order Summary header */}
                        <div style={{background:'linear-gradient(135deg,#1E293B,#0F172A)',padding:'16px 24px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                          <div>
                            <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'#64748B',marginBottom:4}}>Order Summary</div>
                            <div style={{fontSize:20,fontWeight:900,color:'#fff',fontFamily:'monospace',letterSpacing:'-.3px'}}>{order.orderNumber}</div>
                            <div style={{fontSize:12,color:'#94A3B8',marginTop:2}}>
                              Ordered by <strong style={{color:'#CBD5E1'}}>{order.customerName}</strong> · {fmtDateTime(order.createdAt)}
                            </div>
                          </div>
                          <div style={{textAlign:'right'}}>
                            <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'#64748B',marginBottom:4}}>Order Total</div>
                            <div style={{fontSize:26,fontWeight:900,color:'#fff'}}>₱{(order.totalAmount||0).toFixed(2)}</div>
                          </div>
                        </div>

                        <div style={{display:'grid',gridTemplateColumns:'1fr 280px',gap:0}}>

                          {/* Left: items + info */}
                          <div style={{borderRight:'1px solid #E2E8F0'}}>

                            {/* Items table */}
                            <div style={{padding:'16px 20px'}}>
                              <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.07em',color:'#94A3B8',marginBottom:10}}>Line Items</div>
                              <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                                <thead>
                                  <tr style={{borderBottom:'1px solid #E2E8F0'}}>
                                    {['Item','SKU','Qty','Unit Price','Line Total'].map(h=>(
                                      <th key={h} style={{padding:'6px 8px',textAlign:h==='Line Total'||h==='Unit Price'?'right':'left',fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',color:'#94A3B8',paddingBottom:8}}>{h}</th>
                                    ))}
                                  </tr>
                                </thead>
                                <tbody>
                                  {(order.items||[]).map((item,i)=>(
                                    <tr key={i} style={{borderBottom:'1px solid #F1F5F9'}}>
                                      <td style={{padding:'9px 8px'}}>
                                        <div style={{display:'flex',alignItems:'center',gap:8}}>
                                          {item.imageUrl
                                            ? <img src={item.imageUrl} style={{width:28,height:28,borderRadius:6,objectFit:'cover',border:'1px solid #E5E7EB',flexShrink:0}}/>
                                            : <div style={{width:28,height:28,borderRadius:6,background:'#E2E8F0',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                                                <svg width="12" height="12" fill="none" stroke="#94A3B8" viewBox="0 0 24 24" strokeWidth={1.5}><path strokeLinecap="round" strokeLinejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                                              </div>
                                          }
                                          <div>
                                            <div style={{fontWeight:600,color:'#1E293B'}}>{item.name}</div>
                                            {item.category&&<div style={{fontSize:10,color:'#94A3B8'}}>{item.category}</div>}
                                          </div>
                                        </div>
                                      </td>
                                      <td style={{padding:'9px 8px',fontFamily:'monospace',fontSize:11,color:'#64748B'}}>{item.sku||'—'}</td>
                                      <td style={{padding:'9px 8px',fontWeight:700,color:'#374151'}}>{item.quantity} <span style={{fontSize:10,color:'#94A3B8'}}>{item.unit||'pcs'}</span></td>
                                      <td style={{padding:'9px 8px',textAlign:'right',color:'#374151'}}>₱{(item.price||0).toFixed(2)}</td>
                                      <td style={{padding:'9px 8px',textAlign:'right',fontWeight:700,color:'#1E293B'}}>₱{((item.price||0)*(item.quantity||0)).toFixed(2)}</td>
                                    </tr>
                                  ))}
                                </tbody>
                                <tfoot>
                                  <tr style={{borderTop:'2px solid #E2E8F0'}}>
                                    <td colSpan={4} style={{padding:'10px 8px',textAlign:'right',fontWeight:700,color:'#374151',fontSize:13}}>Order Total</td>
                                    <td style={{padding:'10px 8px',textAlign:'right',fontWeight:900,color:'#1E293B',fontSize:16}}>₱{(order.totalAmount||0).toFixed(2)}</td>
                                  </tr>
                                </tfoot>
                              </table>
                            </div>

                            {/* Delivery & payment info */}
                            <div style={{padding:'0 20px 16px',display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                              {[
                                ['Delivery Address', order.deliveryAddress||'—'],
                                ['Payment Method',   order.paymentMethod||'—'],
                                ['Phone',            order.customerPhone||'—'],
                                ['Special Notes',    order.notes||'—'],
                              ].map(([l,v])=>(
                                <div key={l} style={{gridColumn:l==='Delivery Address'||l==='Special Notes'?'1/-1':'auto'}}>
                                  <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',color:'#94A3B8',marginBottom:3}}>{l}</div>
                                  <div style={{fontSize:13,color:'#374151'}}>{v}</div>
                                </div>
                              ))}
                            </div>
                          </div>

                          {/* Right: supplier + action */}
                          <div style={{padding:'20px'}}>

                            {/* Supplier card */}
                            <div style={{background:'#fff',border:'1px solid #E2E8F0',borderRadius:10,padding:'14px',marginBottom:14}}>
                              <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.07em',color:'#94A3B8',marginBottom:10}}>Supplier Info</div>
                              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
                                <div style={{width:38,height:38,borderRadius:9,background:'linear-gradient(135deg,#1D4ED8,#6366F1)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,fontWeight:800,color:'#fff',flexShrink:0}}>
                                  {(supplierName||'O').charAt(0).toUpperCase()}
                                </div>
                                <div>
                                  <div style={{fontSize:13,fontWeight:700,color:'#1E293B'}}>{supplierName}</div>
                                  <div style={{fontSize:11,color:'#64748B'}}>{user.email}</div>
                                </div>
                              </div>
                              {[
                                ['Order #',  order.orderNumber],
                                ['Customer', order.customerName],
                                ['Email',    order.customerEmail],
                                ['Amount',   `₱${(order.totalAmount||0).toFixed(2)}`],
                              ].map(([l,v])=>(
                                <div key={l} style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:5}}>
                                  <span style={{color:'#94A3B8'}}>{l}</span>
                                  <span style={{fontWeight:600,color:'#374151'}}>{v}</span>
                                </div>
                              ))}
                            </div>

                            {/* Confirm Order button */}
                            <button
                              onClick={async(e)=>{ e.stopPropagation(); await confirmOrder(order.id); }}
                              style={{width:'100%',padding:'13px',background:'linear-gradient(135deg,#1D4ED8,#2563EB)',color:'#fff',border:'none',borderRadius:10,fontSize:14,fontWeight:800,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',justifyContent:'center',gap:8,boxShadow:'0 4px 12px rgba(37,99,235,0.35)',marginBottom:8}}>
                              <svg width="16" height="16" fill="none" stroke="#fff" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                              Confirm Order
                            </button>
                            <button
                              onClick={async(e)=>{ e.stopPropagation(); if(confirm(`Cancel order ${order.orderNumber}?`)) { await updateOrderStatus(order.id,'cancelled'); setAutoCreateExpandedId(null); }}}
                              style={{width:'100%',padding:'9px',background:'#FEF2F2',color:'#DC2626',border:'1px solid #FECACA',borderRadius:10,fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>
                              Decline / Cancel Order
                            </button>

                            {/* Note */}
                            <div style={{marginTop:12,padding:'10px 12px',background:'#F8FAFC',border:'1px solid #E2E8F0',borderRadius:8,fontSize:11,color:'#64748B',lineHeight:1.5}}>
                              <strong style={{color:'#374151'}}>Confirming</strong> will issue this order into the system. If an Order Approval Group is configured, it will route for approval first. Otherwise it goes directly to <strong style={{color:'#374151'}}>Processing</strong>.
                            </div>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* ══════════════════════════════════════════════════════
          TAB 2 — ALL ORDERS / ORDERS SUMMARY
      ══════════════════════════════════════════════════════ */}
      {ordersModuleTab==='all'&&(
        <div className="flex gap-4 items-start">

          {/* ── LEFT: Table ── */}
          <div className="flex-1 min-w-0 space-y-4">

            {/* Status filter tabs */}
            <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
              <div className="px-4 pt-4 pb-0">
                <div className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Filter by Status</div>
                <div className="flex gap-0 overflow-x-auto">
                  <button onClick={()=>{setOrderStatusFilter('all');setOrderCurrentPage(1);}}
                    className={`flex-shrink-0 flex flex-col items-center gap-1 px-4 py-2.5 border-b-2 text-xs font-bold transition-all ${orderStatusFilter==='all'?'border-gray-800 text-gray-900':'border-transparent text-gray-400 hover:text-gray-600'}`}>
                    <span className="text-base font-black text-gray-700">{orders.length}</span>All
                  </button>
                  {STEPS.filter(s=>s.key!=='cancelled').map(step=>{
                    const cnt=orders.filter(o=>o.status===step.key).length;
                    const active=orderStatusFilter===step.key;
                    return (
                      <button key={step.key} onClick={()=>{setOrderStatusFilter(active?'all':step.key);setOrderCurrentPage(1);}}
                        style={{borderBottomColor:active?step.color:'transparent',color:active?step.color:'#94A3B8'}}
                        className="flex-shrink-0 flex flex-col items-center gap-1 px-4 py-2.5 border-b-2 text-xs font-bold transition-all hover:text-gray-600">
                        <span style={{color:active?step.color:'#374151'}} className="text-base font-black">{cnt}</span>
                        {step.label}
                      </button>
                    );
                  })}
                  <div className="w-px bg-gray-200 mx-1 self-stretch flex-shrink-0"/>
                  {(()=>{ const step=STEPS.find(s=>s.key==='cancelled'); const cnt=orders.filter(o=>o.status==='cancelled').length; const active=orderStatusFilter==='cancelled'; return (
                    <button onClick={()=>{setOrderStatusFilter(active?'all':'cancelled');setOrderCurrentPage(1);}}
                      style={{borderBottomColor:active?step.color:'transparent',color:active?step.color:'#94A3B8'}}
                      className="flex-shrink-0 flex flex-col items-center gap-1 px-4 py-2.5 border-b-2 text-xs font-bold transition-all hover:text-gray-600">
                      <span style={{color:active?step.color:'#374151'}} className="text-base font-black">{cnt}</span>
                      Cancelled
                    </button>
                  );})()}
                </div>
              </div>
            </div>

            {/* Controls */}
            <div className="bg-white rounded-xl shadow-sm border border-gray-200 px-4 py-3">
              <div className="flex flex-wrap items-center gap-2">
                <div className="relative flex-1 min-w-48">
                  <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                  <input type="text" placeholder="Search order #, customer…" value={orderSearchQuery}
                    onChange={e=>{setOrderSearchQuery(e.target.value);setOrderCurrentPage(1);}}
                    className="w-full pl-8 pr-3 py-1.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-gray-300 outline-none bg-gray-50 focus:bg-white transition-colors"/>
                </div>
                <input type="date" value={orderDateRange.start} onChange={e=>setOrderDateRange(r=>({...r,start:e.target.value}))}
                  className="px-2 py-1.5 border border-gray-200 rounded-lg text-xs outline-none focus:ring-2 focus:ring-gray-300 bg-gray-50"/>
                <span className="text-gray-300 text-xs">—</span>
                <input type="date" value={orderDateRange.end} onChange={e=>setOrderDateRange(r=>({...r,end:e.target.value}))}
                  className="px-2 py-1.5 border border-gray-200 rounded-lg text-xs outline-none focus:ring-2 focus:ring-gray-300 bg-gray-50"/>
                <select value={orderItemsPerPage} onChange={e=>{setOrderItemsPerPage(parseInt(e.target.value));setOrderCurrentPage(1);}}
                  className="px-2 py-1.5 border border-gray-200 rounded-lg text-xs bg-gray-50 outline-none">
                  {[10,20,50,100].map(n=><option key={n} value={n}>{n}/page</option>)}
                </select>
                {(orderSearchQuery||orderStatusFilter!=='all'||orderDateRange.start||orderDateRange.end)&&(
                  <button onClick={()=>{setOrderSearchQuery('');setOrderStatusFilter('all');setOrderDateRange({start:'',end:''});setOrderCurrentPage(1);}}
                    className="text-xs text-gray-500 hover:text-gray-800 font-semibold flex items-center gap-1">
                    <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>Clear
                  </button>
                )}
                <span className="text-xs text-gray-400">{sortedAll.length} result{sortedAll.length!==1?'s':''}</span>
                <button onClick={()=>setShowCreateOrder(true)}
                  className="flex items-center gap-1.5 bg-gray-900 hover:bg-gray-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors">
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>
                  New Order
                </button>
              </div>
            </div>

            {/* Orders table */}
            <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
              <div className="overflow-x-auto">
                <table className="w-full" style={{minWidth:700}}>
                  <thead>
                    <tr className="border-b border-gray-100">
                      {[{key:'orderNumber',label:'Order'},{key:'customerName',label:'Customer'},{key:'createdAt',label:'Date'},{key:'totalAmount',label:'Total'},{key:'status',label:'Status'}].map(col=>(
                        <th key={col.key} onClick={()=>handleSort(col.key)}
                          className="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider cursor-pointer select-none hover:text-gray-800 bg-gray-50">
                          {col.label}<SortIcon k={col.key}/>
                        </th>
                      ))}
                      <th className="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider bg-gray-50">Confirmed By</th>
                    </tr>
                  </thead>
                  <tbody>
                    {pagedOrders.length===0&&(
                      <tr><td colSpan={6} className="py-16 text-center text-gray-400">
                        <svg className="w-12 h-12 mx-auto mb-2 text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                        <div className="text-sm font-semibold text-gray-400">{orders.length===0?'No orders yet':'No orders match filters'}</div>
                      </td></tr>
                    )}
                    {pagedOrders.map((order)=>{
                      const cfg=statusCfg(order.status);
                      const isActive=orderDetailId===order.id;
                      return (
                        <tr key={order.id}
                          onClick={()=>{setOrderDetailId(order.id===orderDetailId?null:order.id);setOrderDetailPackedItems({});}}
                          className={`border-b border-gray-50 cursor-pointer transition-all ${isActive?'bg-gray-900 text-white':'hover:bg-gray-50'}`}>
                          <td className="px-4 py-3.5">
                            <div className={`font-bold text-sm font-mono ${isActive?'text-white':'text-gray-900'}`}>{order.orderNumber}</div>
                            <div className="text-xs text-gray-400 mt-0.5">{order.paymentMethod||'—'}</div>
                          </td>
                          <td className="px-4 py-3.5">
                            <div className={`text-sm font-semibold ${isActive?'text-white':'text-gray-900'}`}>{order.customerName||'—'}</div>
                            <div className="text-xs text-gray-400">{order.customerEmail||'—'}</div>
                          </td>
                          <td className={`px-4 py-3.5 text-sm ${isActive?'text-gray-300':'text-gray-600'}`}>{fmtDate(order.createdAt)}</td>
                          <td className={`px-4 py-3.5 text-sm font-bold ${isActive?'text-white':'text-gray-900'}`}>₱{(order.totalAmount||0).toFixed(2)}</td>
                          <td className="px-4 py-3.5">
                            <span style={{background:isActive?'rgba(255,255,255,0.15)':cfg.bg,color:isActive?'#fff':cfg.color,border:`1px solid ${isActive?'rgba(255,255,255,0.2)':cfg.border}`,display:'inline-flex',alignItems:'center',gap:5,padding:'3px 9px',borderRadius:6,fontSize:11,fontWeight:700,textTransform:'uppercase',whiteSpace:'nowrap'}}>
                              {cfg.icon} {cfg.label}
                            </span>
                          </td>
                          <td className={`px-4 py-3.5 text-xs ${isActive?'text-gray-400':'text-gray-500'}`}>{order.confirmedByName||'—'}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              {/* Pagination */}
              <div className="px-4 py-3 border-t border-gray-100 bg-gray-50 flex items-center justify-between flex-wrap gap-3">
                <div className="text-xs text-gray-400">{sortedAll.length===0?'No results':`${(safeOrderPage-1)*orderItemsPerPage+1}–${Math.min(safeOrderPage*orderItemsPerPage,sortedAll.length)} of ${sortedAll.length}`}</div>
                {orderTotalPages>1&&(
                  <div className="flex items-center gap-1">
                    <button disabled={safeOrderPage===1} onClick={()=>setOrderCurrentPage(1)} className="w-7 h-7 rounded border border-gray-200 text-xs font-bold text-gray-500 hover:bg-white disabled:opacity-30">«</button>
                    <button disabled={safeOrderPage===1} onClick={()=>setOrderCurrentPage(p=>p-1)} className="w-7 h-7 rounded border border-gray-200 text-xs font-bold text-gray-500 hover:bg-white disabled:opacity-30">‹</button>
                    {Array.from({length:orderTotalPages},(_,i)=>i+1).filter(p=>p===1||p===orderTotalPages||Math.abs(p-safeOrderPage)<=1).map((p,i,arr)=>(
                      <React.Fragment key={p}>
                        {i>0&&arr[i-1]!==p-1&&<span className="px-1 text-xs text-gray-400">…</span>}
                        <button onClick={()=>setOrderCurrentPage(p)} className={`w-7 h-7 rounded border text-xs font-bold transition-colors ${safeOrderPage===p?'bg-gray-900 border-gray-900 text-white':'border-gray-200 text-gray-600 hover:bg-white'}`}>{p}</button>
                      </React.Fragment>
                    ))}
                    <button disabled={safeOrderPage===orderTotalPages} onClick={()=>setOrderCurrentPage(p=>p+1)} className="w-7 h-7 rounded border border-gray-200 text-xs font-bold text-gray-500 hover:bg-white disabled:opacity-30">›</button>
                    <button disabled={safeOrderPage===orderTotalPages} onClick={()=>setOrderCurrentPage(orderTotalPages)} className="w-7 h-7 rounded border border-gray-200 text-xs font-bold text-gray-500 hover:bg-white disabled:opacity-30">»</button>
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* ── RIGHT: Order Detail Panel ── */}
          {detailOrder&&(
            <div style={{width:380,flexShrink:0}} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden sticky top-24 max-h-[calc(100vh-120px)] flex flex-col">
              {/* Header */}
              <div className="px-5 py-4 border-b border-gray-100 flex items-start justify-between bg-gray-900">
                <div>
                  <div className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-0.5">Order Details</div>
                  <div className="text-base font-black text-white font-mono">{detailOrder.orderNumber}</div>
                  <div className="text-xs text-gray-400 mt-0.5">{detailOrder.customerName} · {detailOrder.customerEmail}</div>
                </div>
                <button onClick={()=>{setOrderDetailId(null);setOrderDetailPackedItems({});}}
                  className="w-7 h-7 rounded-lg bg-white bg-opacity-10 flex items-center justify-center text-gray-400 hover:bg-opacity-20 hover:text-white transition-all">
                  <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>

              <div className="flex-1 overflow-y-auto">

                {/* Pipeline track */}
                <div className="px-5 py-4 border-b border-gray-100">
                  <div className="flex items-center justify-between mb-2">
                    <div className="text-xs font-bold text-gray-500 uppercase tracking-wider">Pipeline</div>
                    {(()=>{const cfg=statusCfg(detailOrder.status);return(
                      <span style={{background:cfg.bg,color:cfg.color,border:`1px solid ${cfg.border}`}} className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-bold uppercase tracking-wide">
                        {cfg.icon} {cfg.label}
                      </span>
                    );})()}
                  </div>
                  {detailOrder.status==='pending_approval'?(
                    <div className="mt-3 flex items-center gap-3 px-3 py-3 bg-purple-50 border border-purple-200 rounded-xl">
                      <div style={{width:32,height:32,borderRadius:'50%',background:'#7C3AED',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,boxShadow:'0 0 0 4px #DDD6FE'}}>
                        <svg width="14" height="14" fill="none" stroke="white" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                      </div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:12,fontWeight:700,color:'#5B21B6'}}>Awaiting Approval</div>
                        <div style={{fontSize:11,color:'#7C3AED',marginTop:2}}>{detailOrder.orderApprovalGroupName?`Via "${detailOrder.orderApprovalGroupName}"`:''}{detailOrder.assignedApproverName?` · ${detailOrder.assignedApproverName}`:''}</div>
                      </div>
                    </div>
                  ):(
                    <>
                      <div className="flex items-center gap-0.5 mt-3">
                        {PIPELINE.map((s,i,arr)=>{
                          const cfg=statusCfg(s); const done=stepOf(detailOrder.status)>=i; const current=detailOrder.status===s;
                          return (<React.Fragment key={s}>
                            <div title={cfg.label} style={{width:current?28:18,height:current?28:18,borderRadius:'50%',background:done?cfg.color:'#E5E7EB',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',transition:'all .2s',boxShadow:current?`0 0 0 3px ${cfg.color}22`:''}}>
                              {done&&<svg width="9" height="9" fill="none" stroke="white" viewBox="0 0 24 24" strokeWidth={3}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>}
                            </div>
                            {i<arr.length-1&&<div style={{flex:1,height:2,background:stepOf(detailOrder.status)>i?statusCfg(arr[i+1]).color:'#E5E7EB',transition:'all .2s'}}/>}
                          </React.Fragment>);
                        })}
                      </div>
                      <div className="flex items-center justify-between mt-1.5">
                        <span className="text-xs text-gray-400">Placed</span>
                        <span className="text-xs text-gray-400">Completed</span>
                      </div>
                    </>
                  )}
                </div>

                {/* Items — with pack qty inputs at processing stage */}
                <div className="px-5 py-4 border-b border-gray-100">
                  <div className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">
                    Items ({detailOrder.items?.length||0})
                    {detailOrder.status==='processing'&&<span className="ml-2 text-amber-600 normal-case font-semibold text-xs">— Enter pack quantities</span>}
                  </div>
                  <div className="space-y-3">
                    {(detailOrder.items||[]).map((item,i)=>{
                      const packedQty = detailOrder.packedQuantities?.[item.productId];
                      const inputQty  = orderDetailPackedItems[item.productId];
                      const showPackInput = detailOrder.status==='processing';
                      return (
                        <div key={i} className="flex items-start gap-3 pb-3 border-b border-gray-50 last:border-0 last:pb-0">
                          {item.imageUrl
                            ?<img src={item.imageUrl} alt="" className="w-10 h-10 rounded-lg object-cover border border-gray-100 flex-shrink-0"/>
                            :<div className="w-10 h-10 rounded-lg bg-gray-100 flex items-center justify-center flex-shrink-0">
                              <svg className="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                            </div>
                          }
                          <div className="flex-1 min-w-0">
                            <div className="text-sm font-semibold text-gray-900 truncate">{item.name}</div>
                            <div className="text-xs text-gray-400 font-mono">{item.sku||'—'}</div>
                            <div className="flex items-center gap-3 mt-1.5 flex-wrap">
                              <span className="text-xs text-gray-500">Ordered: <strong className="text-gray-800">{item.quantity} {item.unit||'pcs'}</strong></span>
                              {packedQty!=null&&<span className="text-xs text-amber-600 font-semibold">Packed: {packedQty}</span>}
                              {showPackInput&&(
                                <div className="flex items-center gap-1 ml-auto">
                                  <span className="text-xs text-gray-400">Pack:</span>
                                  <input type="number" min={0} max={item.quantity}
                                    value={inputQty??item.quantity}
                                    onChange={e=>{
                                      const v = Math.min(parseInt(e.target.value)||0, item.quantity);
                                      setOrderDetailPackedItems(prev=>({...prev,[item.productId]:v}));
                                    }}
                                    className="w-14 px-2 py-1 border border-amber-300 rounded-md text-xs font-bold text-center focus:ring-2 focus:ring-amber-400 outline-none"/>
                                  <span className="text-xs text-gray-400">/{item.quantity}</span>
                                </div>
                              )}
                            </div>
                          </div>
                          <div className="text-sm font-bold text-gray-900 flex-shrink-0">₱{((item.price||0)*(item.quantity||0)).toFixed(2)}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Order info */}
                <div className="px-5 py-4 border-b border-gray-100">
                  <div className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Order Info</div>
                  <div className="space-y-2">
                    {[
                      ['Delivery Address', detailOrder.deliveryAddress],
                      ['Payment Method',   detailOrder.paymentMethod],
                      ['Phone',            detailOrder.customerPhone],
                      ['Notes',            detailOrder.notes],
                      ['Placed on',        fmtDateTime(detailOrder.createdAt)],
                      ['Confirmed By',     detailOrder.confirmedByName||null],
                      ['Processed By',     detailOrder.processedByName&&detailOrder.processedByName!==detailOrder.confirmedByName?detailOrder.processedByName:null],
                      ['Approved By',      detailOrder.orderApprovalStatus==='approved'&&detailOrder.approvedByName?detailOrder.approvedByName:null],
                    ].filter(([,v])=>v).map(([label,val])=>(
                      <div key={label} className="flex items-start gap-3 justify-between">
                        <span className="text-xs text-gray-400 flex-shrink-0">{label}</span>
                        <span className="text-xs font-semibold text-gray-800 text-right">{val}</span>
                      </div>
                    ))}
                    <div className="flex items-center justify-between pt-2 border-t border-gray-100 mt-2">
                      <span className="text-sm font-bold text-gray-800">Total</span>
                      <span className="text-lg font-black text-gray-900">₱{(detailOrder.totalAmount||0).toFixed(2)}</span>
                    </div>
                  </div>
                </div>

                {/* Shipment info */}
                {detailOrder.status==='shipped'&&detailOrder.shipmentMode&&(
                  <div className="px-5 py-4 border-b border-gray-100">
                    <div className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Shipment</div>
                    <div className="space-y-2">
                      {[['Mode',detailOrder.shipmentMode],['Courier',detailOrder.shipmentCourier],['Tracking',detailOrder.trackingNumber],['Freight',detailOrder.shippingBillTo==='buyer'?'Buyer pays':detailOrder.shippingCost?`₱${detailOrder.shippingCost.toFixed(2)}`:'—']].filter(([,v])=>v).map(([l,v])=>(
                        <div key={l} className="flex items-center justify-between">
                          <span className="text-xs text-gray-400">{l}</span>
                          <span className={`text-xs font-semibold text-gray-800 ${l==='Tracking'?'font-mono':''}`}>{v}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>

              {/* Action buttons */}
              <div className="px-5 py-4 border-t border-gray-100 bg-gray-50 space-y-2">

                {/* pending: redirect to AutoCreate */}
                {detailOrder.status==='pending'&&(
                  <button onClick={()=>{setOrdersModuleTab('autocreate');setAutoCreateExpandedId(detailOrder.id);setOrderDetailId(null);}}
                    className="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-black transition-colors flex items-center justify-center gap-2">
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    Review &amp; Confirm in AutoCreate
                  </button>
                )}

                {/* pending_approval: route to worklist */}
                {detailOrder.status==='pending_approval'&&(
                  <div className="space-y-2">
                    <div className="flex items-start gap-2 px-3 py-3 bg-purple-50 border border-purple-200 rounded-xl">
                      <svg className="w-4 h-4 text-purple-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                      <div className="flex-1">
                        <div className="text-xs font-black text-purple-800">Awaiting Approval — Worklist</div>
                        <div className="text-xs text-purple-600 mt-0.5 leading-relaxed">{detailOrder.assignedApproverName?`Assigned to ${detailOrder.assignedApproverName}.`:''} Check the Worklist to approve.</div>
                      </div>
                    </div>
                    {(detailOrder.assignedApproverId===user.uid||(!detailOrder.assignedApproverId&&detailOrder.customerId!==user.uid&&detailOrder.userId!==user.uid))&&(
                      <button onClick={()=>{setOrderDetailId(null);setActiveOrderReview(detailOrder);setActiveModule('dashboard');}}
                        className="w-full py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white text-sm font-black transition-colors flex items-center justify-center gap-2">
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                        Review &amp; Approve / Reject
                      </button>
                    )}
                  </div>
                )}

                {/* processing: pack items button */}
                {detailOrder.status==='processing'&&(
                  <button onClick={async()=>{
                    const qty={};
                    (detailOrder.items||[]).forEach(item=>{
                      const v = Math.min(orderDetailPackedItems[item.productId]??item.quantity, item.quantity);
                      qty[item.productId]=v;
                    });
                    if(Object.values(qty).every(q=>q===0)){alert('Set at least one item quantity to pack.');return;}
                    if(!confirm(`Mark order ${detailOrder.orderNumber} as Packed?\n\nThis will deduct packed quantities from inventory immediately.`))return;
                    await updateOrderStatus(detailOrder.id,'packed',qty);
                    setOrderDetailPackedItems({});
                  }}
                    className="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-sm font-black transition-colors flex items-center justify-center gap-2">
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                    Confirm Packed — Deduct Stock
                  </button>
                )}

                {/* confirmed / packed / ready / shipped: advance button */}
                {['confirmed','packed','ready_for_shipment','shipped'].includes(detailOrder.status)&&nextStepKey(detailOrder.status)&&(()=>{
                  const nxt=nextStepKey(detailOrder.status); const nxtCfg=statusCfg(nxt);
                  return (
                    <button onClick={()=>updateOrderStatus(detailOrder.id,nxt)}
                      style={{background:nxtCfg.color}}
                      className="w-full py-2.5 rounded-xl text-white text-sm font-black transition-all hover:opacity-90 flex items-center justify-center gap-2">
                      {nxtCfg.icon} Advance to {nxtCfg.label}
                    </button>
                  );
                })()}

                {/* Invoice */}
                {canInvoice(detailOrder.status)&&(
                  <button onClick={()=>generateInvoicePDF(detailOrder)}
                    className="w-full py-2.5 rounded-xl border border-gray-200 bg-white text-gray-700 text-sm font-bold transition-colors hover:bg-gray-50 flex items-center justify-center gap-2">
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    {detailOrder.invoiceData?'View Invoice':'Generate Invoice'}
                  </button>
                )}

                {/* Cancel */}
                {(()=>{
                  const isIssuer=detailOrder.customerId===user.uid||detailOrder.userId===user.uid;
                  const st=detailOrder.status;
                  if(st==='cancelled'||st==='completed'||st==='pending_approval') return null;
                  if(isIssuer) return (
                    <div className="flex items-start gap-2 px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs text-gray-500">
                      <svg className="w-3.5 h-3.5 text-gray-400 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                      To cancel your own order, use <a href="my-orders.html" className="text-blue-600 font-semibold underline ml-1">My Orders</a>
                    </div>
                  );
                  return (
                    <button onClick={()=>{if(confirm(`Cancel order ${detailOrder.orderNumber}? This will reverse any stock deductions.`))updateOrderStatus(detailOrder.id,'cancelled');}}
                      className="w-full py-2 rounded-xl border border-red-100 text-red-500 text-xs font-semibold hover:bg-red-50 transition-colors">
                      Cancel Order
                    </button>
                  );
                })()}
              </div>
            </div>
          )}
        </div>
      )}

    </div>
  );
})()}
</div>
)}

{/* ══ SHIPPING EXECUTION MODULE ══ */}
{activeModule === 'shipping' && userRole === 'admin' && (
  <div className="space-y-5">

    {/* ── Header row ── */}
    <div className="flex items-center justify-between flex-wrap gap-3">
      <div>
        <h2 className="text-xl font-black text-gray-900">Shipping Execution</h2>
        <p className="text-sm text-gray-500 mt-0.5">Manage shipments for Sales Orders · Set courier details · Mark orders as Shipped</p>
      </div>
    </div>

    {/* ── Tabs: Ready for Shipment | Shipped | Supplier Config | Settings ── */}
    {(()=>{
      // shipTab / setShipTab are declared at Dashboard level to satisfy Rules of Hooks

      // ── helpers ──
      const fmtD = (ts) => {
        if (!ts) return '—';
        // Handle Firestore serverTimestamp pending objects (not yet resolved)
        if (ts && typeof ts === 'object' && !ts.toDate && !ts.seconds && !ts._seconds) return '—';
        const d = ts.toDate ? ts.toDate()
                : ts.seconds ? new Date(ts.seconds * 1000)
                : ts._seconds ? new Date(ts._seconds * 1000)
                : new Date(ts);
        if (isNaN(d.getTime())) return '—';
        return d.toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'});
      };

      const readyOrders  = shippingOrders.filter(o=>o.status==='ready_for_shipment');
      const shippedOrders= shippingOrders.filter(o=>o.status==='shipped');

      // Group ready orders by customer (company) — same customer = same consignee
      const groupByCustomer = (list) => {
        const groups = {};
        list.forEach(o=>{
          const key = o.customerEmail||o.customerId||o.customerName||'unknown';
          if(!groups[key]) groups[key] = { key, customerName:o.customerName||'—', customerEmail:o.customerEmail||'', orders:[] };
          groups[key].orders.push(o);
        });
        return Object.values(groups).sort((a,b)=>b.orders.length-a.orders.length);
      };

      // Filtered & paged
      const filteredShip = (list) => {
        const q = shipOrderSearch.toLowerCase();
        if (!q) return list;
        return list.filter(o=>
          (o.orderNumber||'').toLowerCase().includes(q)||
          (o.customerName||'').toLowerCase().includes(q)||
          (o.customerEmail||'').toLowerCase().includes(q)
        );
      };

      const readyFiltered  = filteredShip(readyOrders);
      const shippedFiltered= filteredShip(shippedOrders);

      // ── open ship modal (single order OR group of orders for same customer) ──
      const openShipModal = (ordersOrOrder) => {
        const orderList = Array.isArray(ordersOrOrder) ? ordersOrOrder : [ordersOrOrder];
        const first = orderList[0];
        const supplier = suppliers.find(s=>
          first.items?.some(i=>(i.supplier===s.name||i.supplierId===s.id)) || first.supplierName===s.name
        );
        setShipForm({
          mode:           supplier?.modeOfShipment||'',
          courier:        '',
          trackingNumber: '',
          shippingCost:   '',
          billTo:         'seller',
          notes:          ''
        });
        // Store array of orders in shipModalOrder (always an array now)
        setShipModalOrder(orderList);
        setShowShipModal(true);
      };

      // ── submit shipment (handles 1 or many orders at once) ──
      const submitShipment = async () => {
        const orderList = Array.isArray(shipModalOrder) ? shipModalOrder : [shipModalOrder];
        if (!shipForm.mode) { alert('Please select a shipment mode.'); return; }
        setSubmittingShipment(true);
        try {
          const db = firebase.firestore();
          const now = firebase.firestore.FieldValue.serverTimestamp();
          const shippedAtLocal = new Date(); // for local state update (no serverTimestamp pending issue)
          const batch = db.batch();

          orderList.forEach(order => {
            const ref = db.collection('orders').doc(order.id);
            batch.update(ref, {
              status:          'shipped',
              shippedAt:       now,
              updatedAt:       now,
              shipmentMode:    shipForm.mode,
              shipmentCourier: shipForm.courier,
              trackingNumber:  shipForm.trackingNumber,
              shippingCost:    shipForm.billTo==='buyer' ? 0 : parseFloat(shipForm.shippingCost)||0,
              shippingBillTo:  shipForm.billTo,
              shippingNotes:   shipForm.notes,
            });
          });
          await batch.commit();

          // Notifications
          try {
            const admSnap = await db.collection('users').where('role','==','admin').get();
            const nb = db.batch();
            for (const order of orderList) {
              const notifData = {
                type: 'order-shipped',
                message: `Your order ${order.orderNumber} has been shipped via ${shipForm.mode}`,
                details: { orderNumber: order.orderNumber, status: 'shipped', courier: shipForm.courier, trackingNumber: shipForm.trackingNumber },
                timestamp: now, read: false,
                userId: order.customerId||order.userId, userRole: 'user'
              };
              nb.set(db.collection('notifications').doc(), notifData);
              admSnap.docs.forEach(ad=>{
                if(ad.id!==user.uid){
                  nb.set(db.collection('notifications').doc(),{...notifData,userId:ad.id,userRole:'admin',
                    message:`Order ${order.orderNumber} shipped via ${shipForm.mode}`});
                }
              });
            }
            await nb.commit();
          } catch(e){ console.warn('notif non-fatal',e); }

          // Update local state — use real Date for shippedAt so fmtD works immediately
          const updateFields = {
            status:'shipped', shippedAt:shippedAtLocal, updatedAt:shippedAtLocal,
            shipmentMode:shipForm.mode, shipmentCourier:shipForm.courier,
            trackingNumber:shipForm.trackingNumber,
            shippingCost:shipForm.billTo==='buyer'?0:parseFloat(shipForm.shippingCost)||0,
            shippingBillTo:shipForm.billTo, shippingNotes:shipForm.notes,
          };
          const shippedIds = new Set(orderList.map(o=>o.id));
          setShippingOrders(prev=>prev.map(o=>shippedIds.has(o.id)?{...o,...updateFields}:o));
          setOrders(prev=>prev.map(o=>shippedIds.has(o.id)?{...o,...updateFields}:o));
          setSelectedShipOrders(prev=>{ const n=new Set(prev); shippedIds.forEach(id=>n.delete(id)); return n; });
          setShowShipModal(false);
          setShipModalOrder(null);
        } catch(e){
          console.error(e);
          alert('Error saving shipment: '+e.message);
        }
        setSubmittingShipment(false);
      };

            {...newSettings, updatedAt: firebase.firestore.FieldValue.serverTimestamp()}, {merge:true}
          );
          setShippingSettings(newSettings);

                                      <span className="text-xs font-black text-gray-700">{grp.customerName}</span>
                                      <span className="text-xs text-gray-400">{grp.customerEmail}</span>
                                      <span className="ml-1 text-xs font-bold text-sky-600 bg-sky-50 px-2 py-0.5 rounded-full">{grp.orders.length} order{grp.orders.length!==1?'s':''}</span>
                                      <span className="text-xs font-bold text-gray-700 ml-1">₱{grp.orders.reduce((s,o)=>s+(o.totalAmount||0),0).toFixed(2)}</span>
                                    </div>
                                  </td>
                                </tr>
                              )}
                              {/* Individual order rows */}
                              {grp.orders.map((order,oi)=>{
                                const isChecked = selectedShipOrders.has(order.id);
                                return (
                                  <tr key={order.id}
                                    className={`border-b border-gray-50 transition-all cursor-pointer ${isChecked?'bg-sky-50':'hover:bg-gray-50/60'}`}
                                    onClick={()=>toggleOrder(order.id)}>
                                    {/* Checkbox */}
                                    <td className="px-4 py-3.5 w-10" onClick={e=>{e.stopPropagation();toggleOrder(order.id);}}>
                                      <div className={`w-5 h-5 rounded border-2 flex items-center justify-center flex-shrink-0 transition-all ${isChecked?'bg-sky-500 border-sky-500':'border-gray-300 hover:border-sky-400'}`}>
                                        {isChecked&&<svg width="10" height="10" fill="none" stroke="white" viewBox="0 0 24 24" strokeWidth={3.5}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>}
                                      </div>
                                    </td>
                                    <td className="px-4 py-3.5">
                                      <div className={`font-bold text-sm font-mono ${isChecked?'text-sky-800':'text-gray-900'}`}>{order.orderNumber}</div>
                                      <div className="text-xs text-gray-400 mt-0.5">{order.paymentMethod||'—'}</div>
                                    </td>
                                    <td className="px-4 py-3.5">
                                      <div className={`text-sm font-semibold ${isChecked?'text-sky-800':'text-gray-800'}`}>{order.customerName||'—'}</div>
                                      <div className="text-xs text-gray-400">{order.customerEmail||'—'}</div>
                                    </td>
                                    <td className="px-4 py-3.5 text-sm text-gray-600">{fmtD(order.createdAt)}</td>
                                    <td className="px-4 py-3.5">
                                      <div className="space-y-0.5">
                                        {(order.items||[]).slice(0,2).map((item,i)=>(
                                          <div key={i} className="text-xs text-gray-600 flex items-center gap-1">
                                            <span className={`w-1.5 h-1.5 rounded-full flex-shrink-0 ${isChecked?'bg-sky-400':'bg-gray-300'}`}/>
                                            <span className="font-medium truncate max-w-[120px]">{item.name}</span>
                                            <span className="text-gray-400">×{item.quantity}</span>
                                          </div>
                                        ))}
                                        {(order.items||[]).length>2&&<div className="text-xs text-gray-400 pl-2.5">+{order.items.length-2} more</div>}
                                      </div>
                                    </td>
                                    <td className="px-4 py-3.5">
                                      <span className={`text-sm font-black ${isChecked?'text-sky-700':'text-gray-900'}`}>₱{(order.totalAmount||0).toFixed(2)}</span>
                                    </td>
                                    <td className="px-4 py-3.5 max-w-[160px]">
                                      <div className="text-xs text-gray-500 truncate" title={order.deliveryAddress||''}>{order.deliveryAddress||'—'}</div>
                                    </td>
                                    <td className="px-4 py-3.5" onClick={e=>e.stopPropagation()}>
                                      <button onClick={()=>openShipModal([order])}
                                        className="flex items-center gap-1 px-2.5 py-1.5 bg-sky-100 hover:bg-sky-200 text-sky-700 rounded-lg text-xs font-bold transition-colors whitespace-nowrap">
                                        <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"/><path strokeLinecap="round" strokeLinejoin="round" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414A1 1 0 0120 11.414V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1"/></svg>
                                        Ship this
                                      </button>
                                    </td>
                                  </tr>
                                );
                              })}
                            </React.Fragment>
                          ))}
                        </tbody>
                      </table>
                    </div>

                    {/* Floating action bar — appears when orders selected */}
                    {selCount>0&&(
                      <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex items-center gap-4 bg-gray-900 text-white px-6 py-3.5 rounded-2xl shadow-2xl border border-white border-opacity-10"
                        style={{animation:'slideUp .2s ease'}}>
                        <div className="flex items-center gap-2">
                          <div className="w-6 h-6 rounded-lg bg-sky-500 flex items-center justify-center text-xs font-black">{selCount}</div>
                          <span className="text-sm font-semibold">{selCount} order{selCount!==1?'s':''} selected</span>
                          {(()=>{
                            const selOrders = flatFiltered.filter(o=>selectedShipOrders.has(o.id));
                            const uniqueCustomers = new Set(selOrders.map(o=>o.customerEmail||o.customerId));
                            const totalAmt = selOrders.reduce((s,o)=>s+(o.totalAmount||0),0);
                            return (<>
                              <span className="text-gray-500 text-xs">·</span>
                              <span className="text-xs text-gray-400">{uniqueCustomers.size} compan{uniqueCustomers.size!==1?'ies':'y'}</span>
                              <span className="text-gray-500 text-xs">·</span>
                              <span className="text-xs text-gray-300 font-semibold">₱{totalAmt.toFixed(2)}</span>
                            </>);
                          })()}
                        </div>
                        <div className="flex items-center gap-2">
                          <button onClick={()=>setSelectedShipOrders(new Set())}
                            className="px-3 py-1.5 rounded-lg bg-white bg-opacity-10 hover:bg-opacity-20 text-xs font-semibold transition-colors">
                            Clear
                          </button>
                          <button onClick={()=>{
                            const toShip = flatFiltered.filter(o=>selectedShipOrders.has(o.id));
                            openShipModal(toShip);
                          }}
                            className="flex items-center gap-2 px-4 py-1.5 rounded-lg bg-sky-500 hover:bg-sky-400 text-sm font-black transition-colors">
                            <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"/><path strokeLinecap="round" strokeLinejoin="round" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414A1 1 0 0120 11.414V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1"/></svg>
                            Ship {selCount} Order{selCount!==1?'s':''}
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })()}
            </>
          )}

          {/* ── TAB: Shipped ── */}
          {shipTab==='shipped'&&(
            <ShipTable rows={shippedFiltered} emptyMsg="No shipped orders yet"/>
          )}

          {/* ── TAB: Couriers & Rates ── */}
          {shipTab==='couriers'&&(
            <div className="space-y-4">
              {/* Header */}
              <div className="bg-white rounded-xl shadow-lg overflow-hidden">
                <div className="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
                  <div>
                    <div className="font-bold text-gray-800">Courier Registry</div>
                    <div className="text-xs text-gray-500 mt-0.5">Manage couriers used for shipping orders — independent of supplier profiles</div>
                  </div>
                  <button onClick={()=>{
                    setEditingCourier(null);
                    setCourierForm({ name:'', shipmentMode:'', rateType:'fixed', rates:[], notes:'' });
                    setShowCourierModal(true);
                  }}
                    className="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-sky-500 to-blue-600 text-white rounded-lg text-sm font-bold hover:shadow-md transition-all">
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>
                    Add Courier
                  </button>
                </div>

                {/* Courier List */}
                {courierRegistry.length === 0 ? (
                  <div className="flex flex-col items-center justify-center py-16 text-gray-400 gap-3">
                    <svg className="w-12 h-12 text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={1.5}>
                      <path strokeLinecap="round" strokeLinejoin="round" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"/>
                      <path strokeLinecap="round" strokeLinejoin="round" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414A1 1 0 0120 11.414V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1"/>
                    </svg>
                    <div className="text-sm font-semibold text-gray-400">No couriers yet</div>
                    <div className="text-xs text-gray-400">Add your first courier to get started</div>
                  </div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full divide-y divide-gray-100">
                      <thead>
                        <tr className="bg-gray-50">
                          {['Courier','Shipment Mode','Rate Structure','Notes','Actions'].map(h=>(
                            <th key={h} className="px-5 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-50">
                        {courierRegistry.map(courier=>(
                          <tr key={courier.id} className="hover:bg-sky-50/30 transition-colors">
                            <td className="px-5 py-3">
                              <div className="font-bold text-sm text-gray-900">{courier.name}</div>
                            </td>
                            <td className="px-5 py-3">
                              <span className="text-xs font-semibold bg-sky-100 text-sky-700 px-2 py-1 rounded-full">{courier.shipmentMode||'—'}</span>
                            </td>
                            <td className="px-5 py-3">
                              <div className="space-y-0.5">
                                {(courier.rates||[]).map((r,i)=>(
                                  <div key={i} className="text-xs text-gray-600 flex items-center gap-1.5">
                                    <span className="w-1.5 h-1.5 rounded-full bg-sky-400 flex-shrink-0"/>
                                    <span className="font-semibold text-gray-700">{r.label||r.type}</span>
                                    {r.amount&&<span className="text-gray-500">— ₱{r.amount}{r.unit?'/'+r.unit:''}</span>}
                                  </div>
                                ))}
                                {(!courier.rates||courier.rates.length===0)&&<span className="text-xs text-gray-300 italic">No rates set</span>}
                              </div>
                            </td>
                            <td className="px-5 py-3 text-xs text-gray-500 max-w-[180px] truncate">{courier.notes||'—'}</td>
                            <td className="px-5 py-3">
                              <button onClick={()=>{
                                setEditingCourier(courier);
                                setCourierForm({
                                  name: courier.name||'',
                                  shipmentMode: courier.shipmentMode||'',
                                  rates: courier.rates||[],
                                  notes: courier.notes||''
                                });
                                setShowCourierModal(true);
                              }}
                                className="flex items-center gap-1.5 px-3 py-1.5 bg-sky-100 text-sky-700 rounded-lg text-xs font-bold hover:bg-sky-200 transition-colors">
                                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                                Configure
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ── TAB: Settings ── */}
          {shipTab==='settings'&&(
            <ShippingSettingsPanel
              shippingSettings={shippingSettings}
              savingShipSettings={savingShipSettings}
              onSave={saveShippingSettings}
            />
          )}

          {/* ── Ship Order Modal ── */}
          {showShipModal&&shipModalOrder&&(()=>{
            const orderList = Array.isArray(shipModalOrder) ? shipModalOrder : [shipModalOrder];
            const isMulti = orderList.length > 1;
            const firstOrder = orderList[0];
            const totalAmt = orderList.reduce((s,o)=>s+(o.totalAmount||0),0);
            const totalItems = orderList.reduce((s,o)=>s+(o.items?.length||0),0);
            return (
            <div className="fixed inset-0 z-50 flex items-center justify-center" style={{background:'rgba(0,0,0,0.6)',backdropFilter:'blur(6px)'}}>
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden">
                {/* Header */}
                <div style={{background:'linear-gradient(135deg,#0369a1,#0284c7)'}} className="px-6 py-5 flex items-start justify-between">
                  <div>
                    <span className="text-xs font-bold text-sky-200 uppercase tracking-widest">
                      {isMulti ? `Shipping ${orderList.length} Orders` : 'Set Shipment Details'}
                    </span>
                    <h3 className="text-xl font-black text-white mt-0.5">
                      {isMulti ? `${firstOrder.customerName} — Batch Shipment` : firstOrder.orderNumber}
                    </h3>
                    <p className="text-sky-200 text-xs mt-1">
                      {isMulti
                        ? `${orderList.length} orders · ${totalItems} items total · ₱${totalAmt.toFixed(2)}`
                        : `${firstOrder.customerName} · ${firstOrder.items?.length||0} items · ₱${(firstOrder.totalAmount||0).toFixed(2)}`
                      }
                    </p>
                  </div>
