        {/* Result: Invoice & Receipt Details + Record Payment */}
        {payRecordResult && payRecordResult !== 'not_found' && (()=>{
          const po = purchaseOrders.find(p=>p.id===payRecordResult.id) || payRecordResult;
          const safeD = (v) => { try { const b=CryptoJS.AES.decrypt(v,'your-secret-key-change-this-in-production-use-env-variable'); const r=b.toString(CryptoJS.enc.Utf8); return r||v; } catch(e) { return v||''; } };
          const sup = suppliers.find(s=>s.id===po.supplierId||s.name===po.supplierName);
          const bankName    = sup?.bankName    ? safeD(sup.bankName)    : '';
          const accountName = sup?.accountHolderName ? safeD(sup.accountHolderName) : '';
          const accountNo   = sup?.accountNumber ? safeD(sup.accountNumber) : '';
          const swift       = sup?.swiftCode   ? safeD(sup.swiftCode)   : '';
          const iban        = sup?.iban        ? safeD(sup.iban)        : '';
          const routing     = sup?.routingNumber ? safeD(sup.routingNumber) : '';
          const supPayMethod = sup?.paymentMethod || '';
          const cs = getCurrencySymbol(po.currency);
          const items = po.items || [];
          const suppId = po.supplierId||po.supplierName||'';
          const cfg    = payTermConfigs[suppId]||payTermConfigs[po.supplierName]||null;
          const dueDate = po.paymentDueDate
            ? new Date(po.paymentDueDate+'T00:00:00')
            : computePaymentDueDate(po.invoiceDate||'', cfg);

          return (
            <div style={{display:'grid',gridTemplateColumns:'1fr 380px',gap:16,alignItems:'start'}}>

              {/* LEFT: Invoice & Receipt Detail */}
              <div style={{background:'#fff',borderRadius:14,border:'1px solid #E5E7EB',overflow:'hidden',boxShadow:'0 1px 4px rgba(0,0,0,.06)'}}>
                {/* Card header */}
                <div style={{background:'linear-gradient(135deg,#0F172A,#1E3A78)',padding:'16px 22px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <div style={{width:36,height:36,background:'rgba(255,255,255,.12)',borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16}}>📋</div>
                    <div>
                      <div style={{fontSize:14,fontWeight:800,color:'#fff'}}>Invoice & Receipt Details — {po.poNumber}</div>
                      <div style={{fontSize:11,color:'rgba(255,255,255,.65)',marginTop:1}}>{po.supplierName} · {po.invoiceNumber||'—'} · Rcpt #{po.receiptNumber||'—'}</div>
                    </div>
                  </div>
                  {po.paymentPaid && <span style={{fontSize:11,fontWeight:800,color:'#DCFCE7',background:'rgba(5,150,105,.3)',border:'1px solid rgba(110,231,183,.3)',padding:'4px 12px',borderRadius:20}}>✅ PAID</span>}
                </div>

                <div style={{padding:'20px 22px',display:'flex',flexDirection:'column',gap:16}}>
                  {/* PO summary grid */}
                  <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
                    {[
                      {label:'Supplier',      value:po.supplierName||'—'},
                      {label:'PO Number',     value:po.poNumber, mono:true},
                      {label:'Invoice No.',   value:po.invoiceNumber||'—', mono:true},
                      {label:'Receipt No.',   value:po.receiptNumber?`#${po.receiptNumber}`:'—', mono:true},
                      {label:'Invoice Date',  value:po.invoiceDate||'—'},
                      {label:'Payment Due',   value:fmtDueDate(dueDate)},
                      {label:'Currency',      value:po.currency||'PHP'},
                      {label:'Grand Total',   value:`${cs}${(po.grandTotal||0).toLocaleString('en-PH',{minimumFractionDigits:2})}`, bold:true},
                      {label:'Payment Terms', value:po.paymentTerms||'—'},
                    ].map((f,i)=>(
                      <div key={i} style={{background:'#F8FAFC',borderRadius:8,padding:'10px 12px'}}>
                        <div style={{fontSize:10,fontWeight:700,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:4}}>{f.label}</div>
                        <div style={{fontSize:12,fontWeight:f.bold?800:600,color:'#1E293B',fontFamily:f.mono?'monospace':'inherit'}}>{f.value}</div>
                      </div>
                    ))}
                  </div>

                  {/* Line items */}
                  <div>
                    <div style={{fontSize:12,fontWeight:700,color:'#1E293B',marginBottom:8,display:'flex',alignItems:'center',gap:6}}>
                      📦 Received Items
                      <span style={{fontSize:11,fontWeight:600,color:'#64748B',background:'#F1F5F9',padding:'1px 8px',borderRadius:10}}>{items.length} line{items.length!==1?'s':''}</span>
                    </div>
                    <div style={{border:'1px solid #E5E7EB',borderRadius:10,overflow:'hidden'}}>
                      <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                        <thead>
                          <tr style={{background:'#F8FAFC'}}>
                            {['#','Product / SKU','UOM','Ordered','Received','Unit Cost','Amount'].map(h=>(
                              <th key={h} style={{padding:'8px 12px',textAlign:h==='#'?'center':'left',fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.05em',borderBottom:'1px solid #E5E7EB'}}>{h}</th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {items.length===0 ? (
                            <tr><td colSpan={7} style={{padding:'20px',textAlign:'center',color:'#9CA3AF',fontSize:12}}>No line items found</td></tr>
                          ) : items.map((item,i)=>{
                            const uc = item.unitCost||item.unit_cost||item.price||0;
                            const qtyRec = item.receivedQty||0;
                            const amt = uc*(item.quantity||0);
                            return (
                              <tr key={i} style={{borderBottom:'1px solid #F1F5F9',background:i%2===0?'#fff':'#FAFBFD'}}>
                                <td style={{padding:'9px 12px',textAlign:'center',fontSize:11,color:'#94A3B8',fontWeight:600}}>{String(i+1).padStart(2,'0')}</td>
                                <td style={{padding:'9px 12px'}}>
                                  <div style={{fontWeight:700,color:'#1E293B'}}>{item.productName||'—'}</div>
                                  {item.sku&&<div style={{fontSize:10,color:'#94A3B8',fontFamily:'monospace',marginTop:1}}>{item.sku}</div>}
                                </td>
                                <td style={{padding:'9px 12px',color:'#64748B',fontFamily:'monospace',fontSize:11}}>{item.unit||'—'}</td>
                                <td style={{padding:'9px 12px',textAlign:'center',fontWeight:700,color:'#374151',fontFamily:'monospace'}}>{item.quantity||0}</td>
                                <td style={{padding:'9px 12px',textAlign:'center'}}>
                                  <span style={{fontWeight:700,color:qtyRec>0?'#059669':'#94A3B8',background:qtyRec>0?'#DCFCE7':'#F1F5F9',padding:'2px 8px',borderRadius:10,fontFamily:'monospace',fontSize:11}}>{qtyRec>0?qtyRec:'—'}</span>
                                </td>
                                <td style={{padding:'9px 12px',fontFamily:'monospace',color:'#374151'}}>{cs}{parseFloat(uc).toLocaleString('en-PH',{minimumFractionDigits:2})}</td>
                                <td style={{padding:'9px 12px',fontFamily:'monospace',fontWeight:700,color:'#1D4ED8'}}>{cs}{parseFloat(amt).toLocaleString('en-PH',{minimumFractionDigits:2})}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                        <tfoot>
                          <tr style={{background:'#EFF6FF',borderTop:'2px solid #BFDBFE'}}>
                            <td colSpan={5} style={{padding:'9px 12px',fontSize:12,fontWeight:700,color:'#1E3A78'}}>Grand Total</td>
                            <td colSpan={2} style={{padding:'9px 12px',fontFamily:'monospace',fontWeight:900,color:'#1D4ED8',fontSize:14}}>
                              {cs}{(po.grandTotal||0).toLocaleString('en-PH',{minimumFractionDigits:2})}
                            </td>
                          </tr>
                        </tfoot>
                      </table>
                    </div>
                  </div>

                  {/* Already paid details */}
                  {po.paymentPaid && po.paymentRecord && (
                    <div style={{background:'#ECFDF5',border:'2px solid #A7F3D0',borderRadius:12,padding:'16px 18px'}}>
                      <div style={{fontSize:13,fontWeight:800,color:'#065F46',marginBottom:10}}>✅ Payment Already Recorded</div>
                      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,fontSize:12}}>
                        {[
                          {label:'Method',        value:po.paymentRecord.method||'—'},
                          {label:'Reference No.', value:po.paymentRecord.refNumber||'—', mono:true},
                          {label:'Amount Paid',   value:`${cs}${parseFloat(po.paymentRecord.amountPaid||0).toLocaleString('en-PH',{minimumFractionDigits:2})}`, bold:true},
                          {label:'Payment Date',  value:po.paymentRecord.paymentDate||'—'},
                          {label:'Bank',          value:po.paymentRecord.bankName||'—'},
                          {label:'Recorded By',   value:po.paymentRecord.recordedBy||'—'},
                        ].map((f,i)=>(
                          <div key={i} style={{background:'#F0FDF4',borderRadius:8,padding:'9px 11px'}}>
                            <div style={{fontSize:10,fontWeight:700,color:'#6B7280',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:3}}>{f.label}</div>
                            <div style={{fontSize:12,fontWeight:f.bold?800:600,color:'#1E293B',fontFamily:f.mono?'monospace':'inherit'}}>{f.value}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              </div>

              {/* RIGHT: Record Payment form */}
              <div style={{background:'#fff',borderRadius:14,border:'1px solid #E5E7EB',overflow:'hidden',boxShadow:'0 1px 4px rgba(0,0,0,.06)',position:'sticky',top:16}}>
                <div style={{padding:'14px 18px',borderBottom:'1px solid #F1F5F9',background:'linear-gradient(135deg,#F0FDF4,#ECFDF5)',display:'flex',alignItems:'center',gap:8}}>
                  <svg width="15" height="15" fill="none" stroke="#059669" strokeWidth="2" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                  <div style={{fontSize:13,fontWeight:700,color:'#065F46'}}>Record Payment</div>
                  {dueDate && <span style={{marginLeft:'auto',fontSize:11,fontWeight:700,color:daysUntilDue(dueDate)<0?'#DC2626':daysUntilDue(dueDate)<=7?'#D97706':'#059669'}}>Due: {fmtDueDate(dueDate)}</span>}
                </div>

                {po.paymentPaid ? (
                  <div style={{padding:'24px',textAlign:'center',color:'#059669'}}>
                    <div style={{fontSize:32,marginBottom:8}}>✅</div>
                    <div style={{fontSize:13,fontWeight:700,marginBottom:4}}>Payment already recorded</div>
                    <div style={{fontSize:12,color:'#6B7280'}}>This PO has been paid on {po.paymentRecord?.paymentDate||'—'}</div>
                  </div>
                ) : (
                  <div style={{padding:'18px',display:'flex',flexDirection:'column',gap:12}}>

                    {/* Supplier banking reference */}
                    {(bankName||accountNo||swift||iban) && (
                      <div style={{background:'#F0F9FF',border:'1px solid #BAE6FD',borderRadius:9,padding:'11px 13px'}}>
                        <div style={{fontSize:10,fontWeight:700,color:'#0369A1',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:7}}>Supplier Banking Details</div>
                        <div style={{display:'flex',flexDirection:'column',gap:4,fontSize:12}}>
                          {bankName    && <div><span style={{color:'#64748B'}}>Bank: </span><strong style={{color:'#1E293B'}}>{bankName}</strong></div>}
                          {accountName && <div><span style={{color:'#64748B'}}>Holder: </span><strong style={{color:'#1E293B'}}>{accountName}</strong></div>}
                          {accountNo   && <div><span style={{color:'#64748B'}}>Account: </span><strong style={{color:'#1E293B',fontFamily:'monospace'}}>{accountNo}</strong></div>}
                          {swift       && <div><span style={{color:'#64748B'}}>SWIFT: </span><strong style={{color:'#1E293B',fontFamily:'monospace'}}>{swift}</strong></div>}
                          {iban        && <div><span style={{color:'#64748B'}}>IBAN: </span><strong style={{color:'#1E293B',fontFamily:'monospace'}}>{iban}</strong></div>}
                          {routing     && <div><span style={{color:'#64748B'}}>Routing: </span><strong style={{color:'#1E293B',fontFamily:'monospace'}}>{routing}</strong></div>}
                          {supPayMethod&& <div><span style={{color:'#64748B'}}>Method: </span><strong style={{color:'#1E293B'}}>{supPayMethod}</strong></div>}
                        </div>
                      </div>
                    )}

                    <div>
                      <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Payment Method *</label>
                      <select value={payForm.method} onChange={e=>setPayForm(p=>({...p,method:e.target.value}))} style={{width:'100%',padding:'8px 10px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none',background:'#fff'}} onFocus={e=>e.target.style.borderColor='#059669'} onBlur={e=>e.target.style.borderColor='#E2E8F0'}>
                        <option value="">Select method</option>
                        {['Bank Transfer','Wire Transfer','Check','Cash','Online Payment','SWIFT','ACH','Other'].map(m=><option key={m} value={m}>{m}</option>)}
                      </select>
                    </div>

                    <div>
                      <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Reference / Transaction No.</label>
                      <input value={payForm.refNumber} onChange={e=>setPayForm(p=>({...p,refNumber:e.target.value}))} placeholder="e.g. TRX-20260320-001" style={{width:'100%',padding:'8px 10px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none',fontFamily:'monospace'}} onFocus={e=>e.target.style.borderColor='#059669'} onBlur={e=>e.target.style.borderColor='#E2E8F0'}/>
                    </div>

                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                      <div>
                        <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Amount Paid ({po.currency}) *</label>
                        <input type="number" value={payForm.amountPaid} onChange={e=>setPayForm(p=>({...p,amountPaid:e.target.value}))} style={{width:'100%',padding:'8px 10px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none',fontFamily:'monospace'}} onFocus={e=>e.target.style.borderColor='#059669'} onBlur={e=>e.target.style.borderColor='#E2E8F0'}/>
                      </div>
                      <div>
                        <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Payment Date *</label>
                        <input type="date" value={payForm.paymentDate} onChange={e=>setPayForm(p=>({...p,paymentDate:e.target.value}))} style={{width:'100%',padding:'8px 10px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none'}} onFocus={e=>e.target.style.borderColor='#059669'} onBlur={e=>e.target.style.borderColor='#E2E8F0'}/>
                      </div>
                    </div>

                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                      <div>
                        <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Bank Name</label>
                        <input value={payForm.bankName||bankName} onChange={e=>setPayForm(p=>({...p,bankName:e.target.value}))} placeholder={bankName||'Bank name'} style={{width:'100%',padding:'8px 10px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none'}} onFocus={e=>e.target.style.borderColor='#059669'} onBlur={e=>e.target.style.borderColor='#E2E8F0'}/>
                      </div>
                      <div>
                        <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Account Number</label>
                        <input value={payForm.accountNumber||accountNo} onChange={e=>setPayForm(p=>({...p,accountNumber:e.target.value}))} placeholder={accountNo||'Account number'} style={{width:'100%',padding:'8px 10px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none',fontFamily:'monospace'}} onFocus={e=>e.target.style.borderColor='#059669'} onBlur={e=>e.target.style.borderColor='#E2E8F0'}/>
                      </div>
                    </div>

                    <div>
                      <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Notes</label>
                      <textarea value={payForm.notes} onChange={e=>setPayForm(p=>({...p,notes:e.target.value}))} rows={2} placeholder="Optional payment notes…" style={{width:'100%',padding:'8px 10px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none',resize:'vertical',fontFamily:'inherit'}} onFocus={e=>e.target.style.borderColor='#059669'} onBlur={e=>e.target.style.borderColor='#E2E8F0'}/>
                    </div>

                    <div>
                      <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Proof of Payment</label>
                      <label style={{display:'flex',alignItems:'center',gap:9,padding:'9px 13px',border:'2px dashed #CBD5E1',borderRadius:8,cursor:'pointer',background:'#F8FAFC'}} onMouseEnter={e=>e.currentTarget.style.borderColor='#059669'} onMouseLeave={e=>e.currentTarget.style.borderColor='#CBD5E1'}>
                        <svg width="16" height="16" fill="none" stroke="#94A3B8" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                        <span style={{fontSize:12,color:'#64748B'}}>{payProofFile?<strong style={{color:'#059669'}}>✓ {payProofFile.name}</strong>:'Upload receipt / screenshot (PDF, PNG, JPG)'}</span>
                        <input type="file" accept=".pdf,.png,.jpg,.jpeg" style={{display:'none'}} onChange={e=>setPayProofFile(e.target.files?.[0]||null)}/>
                      </label>
                    </div>

                    <button
                      disabled={paySubmitting||!payForm.amountPaid||!payForm.paymentDate}
                      onClick={async()=>{
                        if(!payForm.amountPaid||!payForm.paymentDate){alert('Amount and payment date are required.');return;}
                        setPaySubmitting(true);
                        try{
                          const db=firebase.firestore();
                          let proofURL='';
                          if(payProofFile){proofURL=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(payProofFile);});}
                          const payRecord={
                            method:payForm.method||supPayMethod||'',
                            refNumber:payForm.refNumber||'',
                            bankName:payForm.bankName||bankName||'',
                            accountName:payForm.accountName||accountName||'',
                            accountNumber:payForm.accountNumber||accountNo||'',
                            amountPaid:parseFloat(payForm.amountPaid)||0,
                            paymentDate:payForm.paymentDate,
                            notes:payForm.notes||'',
                            proofOfPayment:proofURL||'',
                            recordedBy:user.fullName||user.displayName||user.email||'',
                            recordedById:user.uid,
                            recordedAt:new Date().toISOString(),
                          };
                          await db.collection('purchaseOrders').doc(po.id).update({
                            paymentPaid:true,
                            paymentRecord:payRecord,
                            updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
                          });
                          await loadPurchaseOrders(db,user.uid);
                          setPayRecordResult({...po,paymentPaid:true,paymentRecord:payRecord});
                          setPayForm({method:'',refNumber:'',bankName:'',accountName:'',accountNumber:'',amountPaid:'',paymentDate:'',notes:''});
                          setPayProofFile(null);
                          alert(`✅ Payment recorded for PO ${po.poNumber}.`);
                        }catch(e){alert('Error recording payment: '+e.message);}
                        finally{setPaySubmitting(false);}
                      }}
                      style={{width:'100%',padding:'11px',background:'linear-gradient(135deg,#059669,#047857)',color:'#fff',border:'none',borderRadius:10,fontWeight:700,fontSize:13,cursor:'pointer',opacity:paySubmitting||!payForm.amountPaid||!payForm.paymentDate?0.5:1,display:'flex',alignItems:'center',justifyContent:'center',gap:7,marginTop:4}}
                    >
                      {paySubmitting
                        ?<><span style={{width:14,height:14,border:'2px solid rgba(255,255,255,.3)',borderTopColor:'#fff',borderRadius:'50%',display:'inline-block',animation:'spin .6s linear infinite'}}/> Recording…</>
                        :<><svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg> Confirm Payment</>
                      }
                    </button>
                  </div>
                )}
              </div>

            </div>
          );
        })()}

      </div>
    )}

    {/* ── TAB: INVOICE QUEUE ── */}
    {!payRecordMode && payablesTab==='invoices'&&(
      <div style={{background:'#fff',borderRadius:16,border:'1px solid #E5E7EB',overflow:'hidden'}}>
        {/* Sub-filter */}
        <div style={{padding:'14px 20px',borderBottom:'1px solid #F1F5F9',background:'#FAFAFA',display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
          {[
            {id:'pending',  label:'Pending Approval', count:purchaseOrders.filter(p=>p.status==='received').length},
            {id:'on_hold',  label:'On Hold',           count:purchaseOrders.filter(p=>p.paymentOnHold&&p.status==='received').length},
            {id:'closed',   label:'Approved/Closed',   count:purchaseOrders.filter(p=>p.status==='closed').length},
            {id:'all',      label:'All',               count:purchaseOrders.filter(p=>['received','closed'].includes(p.status)).length},
          ].map(f=>(
            <button key={f.id} onClick={()=>setInvoiceFilter(f.id)}
              style={{padding:'5px 14px',borderRadius:20,border:`1px solid ${invoiceFilter===f.id?'#B45309':'#E5E7EB'}`,
                background:invoiceFilter===f.id?'#FEF3C7':'#fff',color:invoiceFilter===f.id?'#92400E':'#6B7280',
                fontSize:11,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',gap:5}}>
              {f.label}
              <span style={{background:invoiceFilter===f.id?'#B45309':'#F3F4F6',color:invoiceFilter===f.id?'#fff':'#9CA3AF',
                fontSize:10,padding:'0 6px',borderRadius:10}}>{f.count}</span>
            </button>
          ))}
        </div>

        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead>
              <tr style={{background:'#F8FAFC'}}>
                {['PO / Invoice #','Supplier','Invoice Date','Amount (₱)','Payment Terms','Due Date','3-Way Match','Status','Actions'].map(h=>(
                  <th key={h} style={{padding:'10px 14px',textAlign:'left',fontSize:11,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.04em',borderBottom:'1px solid #E5E7EB',whiteSpace:'nowrap'}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {(()=>{
                const filtered = purchaseOrders.filter(po=>{
                  if(invoiceFilter==='pending')  return po.status==='received' && !po.paymentOnHold;
                  if(invoiceFilter==='on_hold')  return po.status==='received' && po.paymentOnHold;
                  if(invoiceFilter==='closed')   return po.status==='closed';
                  return ['received','closed'].includes(po.status);
                });
                if(filtered.length===0) return (
                  <tr><td colSpan={9} style={{padding:'48px',textAlign:'center',color:'#9CA3AF'}}>
                    <div style={{fontSize:36,marginBottom:12}}>📭</div>
                    <div style={{fontWeight:700,color:'#374151',marginBottom:6}}>
                      {invoiceFilter==='pending'?'No pending invoices — all caught up!':
                       invoiceFilter==='on_hold'?'No invoices on hold.':
                       invoiceFilter==='closed'?'No approved invoices yet.':'No invoices found.'}
                    </div>
                    <div style={{fontSize:12}}>Invoices appear here once goods are received in the Receiving module.</div>
                  </td></tr>
                );
                return filtered.map((po,i)=>{
                  const isReceived = po.status==='received';
                  const isClosed   = po.status==='closed';
                  const isOnHold   = !!po.paymentOnHold;
                  const poAmt      = po.grandTotal||0;
                  const invDate    = po.invoiceDate||'';
                  const suppId     = po.supplierId||po.supplierName||'';
                  const cfg        = payTermConfigs[suppId]||payTermConfigs[po.supplierName]||null;
                  const dueDate    = isClosed && po.paymentDueDate
                    ? new Date(po.paymentDueDate+'T00:00:00')
                    : computePaymentDueDate(invDate, cfg);
                  const dDays      = daysUntilDue(dueDate);
                  const overdue    = dDays !== null && dDays < 0;
                  const dueSoon    = dDays !== null && dDays >= 0 && dDays <= 7;
                  const receivedAt = po.receivedAt?.toDate?po.receivedAt.toDate().toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'}):
                                     po.createdAt?.toDate?po.createdAt.toDate().toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'}):'—';
                  const rowBg = isOnHold?'#FFFBEB':isReceived?'#FEFEFE':'#fff';
                  const payStatus = isClosed
                    ? {label:'CLOSED',color:'#166534',bg:'#DCFCE7'}
                    : isOnHold ? {label:'ON HOLD',color:'#92400E',bg:'#FEF3C7'}
                    : {label:'PENDING APPROVAL',color:'#1D4ED8',bg:'#DBEAFE'};

                  return (
                    <tr key={po.id}
                      style={{borderBottom:'1px solid #F1F5F9',background:rowBg,cursor:isClosed?'pointer':'default',transition:'background .1s'}}
                      onMouseEnter={e=>{ if(isClosed) e.currentTarget.style.background='#F0FDF4'; }}
                      onMouseLeave={e=>{ e.currentTarget.style.background=rowBg; }}
                      onClick={()=>{ if(isClosed){ setSelectedInvoicePO(po); setPayForm({method:'',refNumber:'',bankName:'',accountName:'',accountNumber:'',amountPaid:po.grandTotal?po.grandTotal.toFixed(2):'',paymentDate:new Date().toISOString().split('T')[0],notes:''}); setPayProofFile(null); } }}
                    >
                      <td style={{padding:'11px 14px'}}>
                        <div style={{fontFamily:'monospace',fontWeight:800,color:'#1E293B',fontSize:12}}>{po.poNumber}</div>
                        {po.invoiceNumber&&<div style={{fontSize:10,color:'#6B7280',marginTop:1}}>Inv: {po.invoiceNumber}</div>}
                        {po.receiptNumber&&<div style={{fontSize:10,color:'#9CA3AF'}}>Rcpt: #{po.receiptNumber}</div>}
                        {isClosed&&<div style={{fontSize:10,color:'#059669',fontWeight:600,marginTop:2}}>↗ Click to view details</div>}
                      </td>
                      <td style={{padding:'11px 14px'}}>
                        <div style={{fontWeight:700,color:'#374151',fontSize:12}}>{po.supplierName||'—'}</div>
                        <div style={{fontSize:10,color:'#9CA3AF'}}>{po.paymentTerms||'—'}</div>
                      </td>
                      <td style={{padding:'11px 14px',color:'#374151',fontSize:11}}>
                        {invDate||<span style={{color:'#EF4444',fontWeight:700}}>⚠ No date</span>}
                      </td>
                      <td style={{padding:'11px 14px'}}>
                        <div style={{fontWeight:900,color:'#1E293B',fontSize:13}}>₱{poAmt.toLocaleString('en-PH',{minimumFractionDigits:2})}</div>
                        <div style={{fontSize:10,color:'#9CA3AF'}}>{po.currency||'PHP'}</div>
                      </td>
                      <td style={{padding:'11px 14px'}}>
                        {cfg
                          ? <div>
                              <div style={{fontSize:11,fontWeight:700,color:'#1E293B'}}>{cfg.days} days</div>
                              <div style={{fontSize:10,color:'#6B7280'}}>{cfg.mode==='eom'?'After EOM':'From invoice'} · {cfg.countType==='working'?'Working days':'Calendar days'}</div>
                            </div>
                          : <span style={{fontSize:10,color:'#EF4444',fontWeight:600}}>⚠ Not configured</span>
                        }
                      </td>
                      <td style={{padding:'11px 14px'}}>
                        {dueDate
                          ? <div>
                              <div style={{fontSize:12,fontWeight:700,color:overdue?'#EF4444':dueSoon?'#F59E0B':'#1E293B'}}>{fmtDueDate(dueDate)}</div>
                              {dDays!==null&&<div style={{fontSize:10,fontWeight:700,color:overdue?'#EF4444':dueSoon?'#F59E0B':'#6B7280'}}>
                                {overdue?`${Math.abs(dDays)}d overdue`:dDays===0?'Due today':`${dDays}d remaining`}
                              </div>}
                            </div>
                          : <span style={{fontSize:10,color:'#9CA3AF'}}>—</span>
                        }
                      </td>
                      <td style={{padding:'11px 14px'}}>
                        <span style={{fontSize:10,fontWeight:700,
                          color:isReceived||isClosed?'#166534':'#92400E',
                          background:isReceived||isClosed?'#DCFCE7':'#FEF3C7',
                          padding:'2px 8px',borderRadius:20}}>
                          {isReceived||isClosed?'3-Way Match ✓':'Pending Receipt'}
                        </span>
                      </td>
                      <td style={{padding:'11px 14px'}}>
                        <span style={{fontSize:10,fontWeight:700,color:payStatus.color,background:payStatus.bg,padding:'3px 10px',borderRadius:20}}>{payStatus.label}</span>
                        {isOnHold&&po.holdReason&&<div style={{fontSize:10,color:'#92400E',marginTop:3}}>"{po.holdReason}"</div>}
                      </td>
                      <td style={{padding:'11px 14px'}} onClick={e=>e.stopPropagation()}>
                        <div style={{display:'flex',gap:5,flexWrap:'nowrap',alignItems:'center'}}>
                          {isReceived&&!isOnHold&&(
                            <button onClick={()=>approveInvoice(po)}
                              style={{padding:'5px 11px',background:'linear-gradient(135deg,#059669,#0D9488)',color:'#fff',border:'none',borderRadius:7,fontSize:11,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>
                              ✓ Approve &amp; Close
                            </button>
                          )}
                          {isReceived&&(
                            <button onClick={()=>{
                              if(isOnHold){
                                if(!confirm(`Remove hold on ${po.poNumber}?`)) return;
                                firebase.firestore().collection('purchaseOrders').doc(po.id).update({paymentOnHold:false,holdReason:''})
                                  .then(()=>loadPurchaseOrders(firebase.firestore(),user.uid)).catch(e=>alert(e.message));
                              } else {
                                const reason=prompt(`Hold reason for ${po.poNumber}?`); if(!reason) return;
                                firebase.firestore().collection('purchaseOrders').doc(po.id).update({paymentOnHold:true,holdReason:reason,holdAt:firebase.firestore.FieldValue.serverTimestamp()})
                                  .then(()=>loadPurchaseOrders(firebase.firestore(),user.uid)).catch(e=>alert(e.message));
                              }
                            }}
                              style={{padding:'5px 10px',background:isOnHold?'#DCFCE7':'#FEF3C7',color:isOnHold?'#166534':'#92400E',border:`1px solid ${isOnHold?'#BBF7D0':'#FCD34D'}`,borderRadius:7,fontSize:11,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>
                              {isOnHold?'▶ Unhold':'⏸ Hold'}
                            </button>
                          )}
                        </div>
                      </td>
                    </tr>
                  );
                });
              })()}
            </tbody>
          </table>
        </div>
      </div>
    )}

    {/* ── RECEIPT DETAIL + RECORD PAYMENT PANEL (Approved/Closed invoice selected) ── */}
    {!payRecordMode && selectedInvoicePO && (()=>{
      const po = purchaseOrders.find(p=>p.id===selectedInvoicePO.id) || selectedInvoicePO;
      const safeD = (v) => { try { const b=CryptoJS.AES.decrypt(v,'your-secret-key-change-this-in-production-use-env-variable'); const r=b.toString(CryptoJS.enc.Utf8); return r||v; } catch(e) { return v||''; } };
      const sup = suppliers.find(s=>s.id===po.supplierId||s.name===po.supplierName);
      const bankName    = sup?.bankName    ? safeD(sup.bankName)    : '';
      const accountName = sup?.accountHolderName ? safeD(sup.accountHolderName) : '';
      const accountNo   = sup?.accountNumber ? safeD(sup.accountNumber) : '';
      const swift       = sup?.swiftCode   ? safeD(sup.swiftCode)   : '';
      const iban        = sup?.iban        ? safeD(sup.iban)        : '';
      const routing     = sup?.routingNumber ? safeD(sup.routingNumber) : '';
      const supPayMethod = sup?.paymentMethod || '';
      const cs = getCurrencySymbol(po.currency);
      const items = po.items || [];

      return (
        <div style={{background:'#fff',borderRadius:16,border:'2px solid #059669',overflow:'hidden',boxShadow:'0 4px 20px rgba(5,150,105,.15)'}}>

          {/* Panel header */}
          <div style={{background:'linear-gradient(135deg,#064E3B,#059669)',padding:'16px 22px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div style={{display:'flex',alignItems:'center',gap:12}}>
              <div style={{width:38,height:38,background:'rgba(255,255,255,.15)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>📋</div>
              <div>
                <div style={{fontSize:14,fontWeight:800,color:'#fff'}}>Invoice & Receipt Details — {po.poNumber}</div>
                <div style={{fontSize:11,color:'rgba(255,255,255,.75)',marginTop:1}}>
                  {po.supplierName} · Inv: {po.invoiceNumber||'—'} · Rcpt: #{po.receiptNumber||'—'} · {cs}{(po.grandTotal||0).toLocaleString('en-PH',{minimumFractionDigits:2})}
                </div>
              </div>
            </div>
            <button onClick={()=>setSelectedInvoicePO(null)} style={{width:30,height:30,borderRadius:7,background:'rgba(255,255,255,.15)',border:'1px solid rgba(255,255,255,.2)',color:'#fff',cursor:'pointer',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
          </div>

          <div style={{padding:'20px 22px',display:'flex',flexDirection:'column',gap:18}}>

            {/* PO + Invoice summary */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
              {[
                {label:'Supplier',      value:po.supplierName||'—'},
                {label:'PO Number',     value:po.poNumber, mono:true},
                {label:'Invoice No.',   value:po.invoiceNumber||'—', mono:true},
                {label:'Receipt No.',   value:po.receiptNumber?`#${po.receiptNumber}`:'—', mono:true},
                {label:'Invoice Date',  value:po.invoiceDate||'—'},
                {label:'Payment Due',   value:po.paymentDueDate||'—'},
                {label:'Currency',      value:po.currency||'PHP'},
                {label:'Grand Total',   value:`${cs}${(po.grandTotal||0).toLocaleString('en-PH',{minimumFractionDigits:2})}`, bold:true},
                {label:'Payment Terms', value:po.paymentTerms||'—'},
              ].map((f,i)=>(
                <div key={i} style={{background:'#F8FAFC',borderRadius:8,padding:'10px 12px'}}>
                  <div style={{fontSize:10,fontWeight:700,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:4}}>{f.label}</div>
                  <div style={{fontSize:12,fontWeight:f.bold?800:600,color:'#1E293B',fontFamily:f.mono?'monospace':'inherit'}}>{f.value}</div>
                </div>
              ))}
            </div>

            {/* Receipt line items */}
            <div>
              <div style={{fontSize:12,fontWeight:700,color:'#1E293B',marginBottom:8,display:'flex',alignItems:'center',gap:6}}>
                📦 Received Items
                <span style={{fontSize:11,fontWeight:600,color:'#64748B',background:'#F1F5F9',padding:'1px 8px',borderRadius:10}}>{items.length} line{items.length!==1?'s':''}</span>
              </div>
              <div style={{border:'1px solid #E5E7EB',borderRadius:10,overflow:'hidden'}}>
                <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                  <thead>
                    <tr style={{background:'#F8FAFC'}}>
                      {['#','Product / SKU','UOM','Qty Ordered','Qty Received','Unit Cost','Amount'].map(h=>(
                        <th key={h} style={{padding:'8px 12px',textAlign:h==='#'?'center':'left',fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.05em',borderBottom:'1px solid #E5E7EB'}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {items.length===0 ? (
                      <tr><td colSpan={7} style={{padding:'20px',textAlign:'center',color:'#9CA3AF',fontSize:12}}>No line items found on this PO</td></tr>
                    ) : items.map((item,i)=>{
                      const uc = item.unitCost||item.unit_cost||item.price||0;
                      const qtyRec = item.receivedQty||0;
                      const amt = uc * (item.quantity||0);
                      return (
                        <tr key={i} style={{borderBottom:'1px solid #F1F5F9',background:i%2===0?'#fff':'#FAFBFD'}}>
                          <td style={{padding:'9px 12px',textAlign:'center',fontSize:11,color:'#94A3B8',fontWeight:600}}>{String(i+1).padStart(2,'0')}</td>
                          <td style={{padding:'9px 12px'}}>
                            <div style={{fontWeight:700,color:'#1E293B'}}>{item.productName||'—'}</div>
                            {item.sku&&<div style={{fontSize:10,color:'#94A3B8',fontFamily:'monospace',marginTop:1}}>{item.sku}</div>}
                          </td>
                          <td style={{padding:'9px 12px',color:'#64748B',fontFamily:'monospace',fontSize:11}}>{item.unit||'—'}</td>
                          <td style={{padding:'9px 12px',textAlign:'center',fontWeight:700,color:'#374151',fontFamily:'monospace'}}>{item.quantity||0}</td>
                          <td style={{padding:'9px 12px',textAlign:'center'}}>
                            <span style={{fontWeight:700,color:qtyRec>0?'#059669':'#94A3B8',background:qtyRec>0?'#DCFCE7':'#F1F5F9',padding:'2px 8px',borderRadius:10,fontFamily:'monospace',fontSize:11}}>
                              {qtyRec>0?qtyRec:'—'}
                            </span>
                          </td>
                          <td style={{padding:'9px 12px',fontFamily:'monospace',color:'#374151'}}>{cs}{parseFloat(uc).toLocaleString('en-PH',{minimumFractionDigits:2})}</td>
                          <td style={{padding:'9px 12px',fontFamily:'monospace',fontWeight:700,color:'#1D4ED8'}}>{cs}{parseFloat(amt).toLocaleString('en-PH',{minimumFractionDigits:2})}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                  <tfoot>
                    <tr style={{background:'#F0F9FF',borderTop:'2px solid #BFDBFE'}}>
                      <td colSpan={5} style={{padding:'9px 12px',fontSize:12,fontWeight:700,color:'#1E3A78'}}>Grand Total</td>
                      <td colSpan={2} style={{padding:'9px 12px',fontFamily:'monospace',fontWeight:900,color:'#1D4ED8',fontSize:14}}>
                        {cs}{(po.grandTotal||0).toLocaleString('en-PH',{minimumFractionDigits:2})}
                      </td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>

            {/* Payment status or Record Payment form */}
            {po.paymentPaid && po.paymentRecord ? (
              <div style={{background:'#ECFDF5',border:'2px solid #A7F3D0',borderRadius:12,padding:'16px 18px'}}>
                <div style={{fontSize:13,fontWeight:800,color:'#065F46',marginBottom:10}}>✅ Payment Already Recorded</div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,fontSize:12}}>
                  {[
                    {label:'Method',         value:po.paymentRecord.method||'—'},
                    {label:'Reference No.',  value:po.paymentRecord.refNumber||'—', mono:true},
                    {label:'Amount Paid',    value:`${cs}${parseFloat(po.paymentRecord.amountPaid||0).toLocaleString('en-PH',{minimumFractionDigits:2})}`, bold:true},
                    {label:'Payment Date',   value:po.paymentRecord.paymentDate||'—'},
                    {label:'Bank',           value:po.paymentRecord.bankName||'—'},
                    {label:'Recorded By',    value:po.paymentRecord.recordedBy||'—'},
                  ].map((f,i)=>(
                    <div key={i} style={{background:'#F0FDF4',borderRadius:8,padding:'9px 11px'}}>
                      <div style={{fontSize:10,fontWeight:700,color:'#6B7280',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:3}}>{f.label}</div>
                      <div style={{fontSize:12,fontWeight:f.bold?800:600,color:'#1E293B',fontFamily:f.mono?'monospace':'inherit'}}>{f.value}</div>
                    </div>
                  ))}
                </div>
              </div>
            ) : (
              <div style={{background:'#FFFBEB',border:'2px solid #FDE68A',borderRadius:12,padding:'18px 20px'}}>
                <div style={{fontSize:13,fontWeight:800,color:'#92400E',marginBottom:14,display:'flex',alignItems:'center',gap:8}}>
                  <svg width="16" height="16" fill="none" stroke="#B45309" strokeWidth="2" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                  Record Payment
                </div>

                {/* Supplier banking reference */}
                {(bankName||accountNo||swift||iban) && (
                  <div style={{background:'#F0F9FF',border:'1px solid #BAE6FD',borderRadius:9,padding:'11px 14px',marginBottom:14}}>
                    <div style={{fontSize:10,fontWeight:700,color:'#0369A1',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:7}}>Supplier Banking Details</div>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7,fontSize:12}}>
                      {bankName    && <div><span style={{color:'#64748B'}}>Bank: </span><strong style={{color:'#1E293B'}}>{bankName}</strong></div>}
                      {accountName && <div><span style={{color:'#64748B'}}>Holder: </span><strong style={{color:'#1E293B'}}>{accountName}</strong></div>}
                      {accountNo   && <div><span style={{color:'#64748B'}}>Account No: </span><strong style={{color:'#1E293B',fontFamily:'monospace'}}>{accountNo}</strong></div>}
                      {swift       && <div><span style={{color:'#64748B'}}>SWIFT: </span><strong style={{color:'#1E293B',fontFamily:'monospace'}}>{swift}</strong></div>}
                      {iban        && <div><span style={{color:'#64748B'}}>IBAN: </span><strong style={{color:'#1E293B',fontFamily:'monospace'}}>{iban}</strong></div>}
                      {routing     && <div><span style={{color:'#64748B'}}>Routing: </span><strong style={{color:'#1E293B',fontFamily:'monospace'}}>{routing}</strong></div>}
                      {supPayMethod&& <div><span style={{color:'#64748B'}}>Method: </span><strong style={{color:'#1E293B'}}>{supPayMethod}</strong></div>}
                    </div>
                  </div>
                )}

                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}}>
                  <div>
                    <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Payment Method *</label>
                    <select value={payForm.method} onChange={e=>setPayForm(p=>({...p,method:e.target.value}))} style={{width:'100%',padding:'8px 10px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none',background:'#fff'}}>
                      <option value="">Select method</option>
                      {['Bank Transfer','Wire Transfer','Check','Cash','Online Payment','SWIFT','ACH','Other'].map(m=><option key={m} value={m}>{m}</option>)}
                    </select>
                  </div>
                  <div>
                    <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Reference / Transaction No.</label>
                    <input value={payForm.refNumber} onChange={e=>setPayForm(p=>({...p,refNumber:e.target.value}))} placeholder="e.g. TRX-20240320-001" style={{width:'100%',padding:'8px 10px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none',fontFamily:'monospace'}} onFocus={e=>e.target.style.borderColor='#B45309'} onBlur={e=>e.target.style.borderColor='#E2E8F0'}/>
                  </div>
                  <div>
                    <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Amount Paid ({po.currency}) *</label>
                    <input type="number" value={payForm.amountPaid} onChange={e=>setPayForm(p=>({...p,amountPaid:e.target.value}))} placeholder={po.grandTotal?.toFixed(2)} style={{width:'100%',padding:'8px 10px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none',fontFamily:'monospace'}} onFocus={e=>e.target.style.borderColor='#B45309'} onBlur={e=>e.target.style.borderColor='#E2E8F0'}/>
                  </div>
                  <div>
                    <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Payment Date *</label>
                    <input type="date" value={payForm.paymentDate} onChange={e=>setPayForm(p=>({...p,paymentDate:e.target.value}))} style={{width:'100%',padding:'8px 10px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none'}} onFocus={e=>e.target.style.borderColor='#B45309'} onBlur={e=>e.target.style.borderColor='#E2E8F0'}/>
                  </div>
                  <div>
                    <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Bank Name</label>
                    <input value={payForm.bankName||bankName} onChange={e=>setPayForm(p=>({...p,bankName:e.target.value}))} placeholder={bankName||'Bank name'} style={{width:'100%',padding:'8px 10px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none'}} onFocus={e=>e.target.style.borderColor='#B45309'} onBlur={e=>e.target.style.borderColor='#E2E8F0'}/>
                  </div>
                  <div>
                    <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Account Number</label>
                    <input value={payForm.accountNumber||accountNo} onChange={e=>setPayForm(p=>({...p,accountNumber:e.target.value}))} placeholder={accountNo||'Account number'} style={{width:'100%',padding:'8px 10px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none',fontFamily:'monospace'}} onFocus={e=>e.target.style.borderColor='#B45309'} onBlur={e=>e.target.style.borderColor='#E2E8F0'}/>
                  </div>
                </div>

                <div style={{marginBottom:12}}>
                  <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Notes</label>
                  <textarea value={payForm.notes} onChange={e=>setPayForm(p=>({...p,notes:e.target.value}))} rows={2} placeholder="Optional payment notes..." style={{width:'100%',padding:'8px 10px',border:'1.5px solid #E2E8F0',borderRadius:8,fontSize:13,outline:'none',resize:'vertical',fontFamily:'inherit'}} onFocus={e=>e.target.style.borderColor='#B45309'} onBlur={e=>e.target.style.borderColor='#E2E8F0'}/>
                </div>

                {/* Proof of payment upload */}
                <div style={{marginBottom:14}}>
                  <label style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:5}}>Proof of Payment</label>
                  <label style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',border:'2px dashed #CBD5E1',borderRadius:8,cursor:'pointer',background:'#F8FAFC'}}>
                    <svg width="16" height="16" fill="none" stroke="#94A3B8" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                    <span style={{fontSize:12,color:'#64748B'}}>{payProofFile ? <strong style={{color:'#059669'}}>✓ {payProofFile.name}</strong> : 'Upload receipt / screenshot (PDF, PNG, JPG)'}</span>
                    <input type="file" accept=".pdf,.png,.jpg,.jpeg" style={{display:'none'}} onChange={e=>setPayProofFile(e.target.files?.[0]||null)}/>
                  </label>
                </div>

                <div style={{display:'flex',justifyContent:'flex-end',gap:8}}>
                  <button onClick={()=>{setSelectedInvoicePO(null);setPayForm({method:'',refNumber:'',bankName:'',accountName:'',accountNumber:'',amountPaid:'',paymentDate:'',notes:''});setPayProofFile(null);}} style={{padding:'9px 20px',background:'#F1F5F9',color:'#475569',border:'1px solid #E2E8F0',borderRadius:8,fontWeight:600,fontSize:13,cursor:'pointer'}}>Cancel</button>
                  <button
                    disabled={paySubmitting||!payForm.amountPaid||!payForm.paymentDate}
                    onClick={async()=>{
                      if (!payForm.amountPaid||!payForm.paymentDate) { alert('Amount and payment date are required.'); return; }
                      setPaySubmitting(true);
                      try {
                        const db = firebase.firestore();
                        let proofURL = '';
                        if (payProofFile) {
                          proofURL = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(payProofFile); });
                        }
                        const payRecord = {
                          method: payForm.method||supPayMethod||'',
                          refNumber: payForm.refNumber||'',
                          bankName: payForm.bankName||bankName||'',
                          accountName: payForm.accountName||accountName||'',
                          accountNumber: payForm.accountNumber||accountNo||'',
                          amountPaid: parseFloat(payForm.amountPaid)||0,
                          paymentDate: payForm.paymentDate,
                          notes: payForm.notes||'',
                          proofOfPayment: proofURL||'',
                          recordedBy: user.fullName||user.displayName||user.email||'',
                          recordedById: user.uid,
                          recordedAt: new Date().toISOString(),
                        };
                        await db.collection('purchaseOrders').doc(po.id).update({
                          paymentPaid: true,
                          paymentRecord: payRecord,
                          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        });
                        await loadPurchaseOrders(db, user.uid);
                        setSelectedInvoicePO(null);
                        setPayForm({method:'',refNumber:'',bankName:'',accountName:'',accountNumber:'',amountPaid:'',paymentDate:'',notes:''});
                        setPayProofFile(null);
                        alert(`✅ Payment recorded for PO ${po.poNumber}.`);
                      } catch(e) { alert('Error recording payment: '+e.message); }
                      finally { setPaySubmitting(false); }
                    }}
                    style={{padding:'9px 24px',background:'linear-gradient(135deg,#059669,#047857)',color:'#fff',border:'none',borderRadius:8,fontWeight:700,fontSize:13,cursor:'pointer',opacity:paySubmitting||!payForm.amountPaid||!payForm.paymentDate?0.5:1,display:'flex',alignItems:'center',gap:7}}
                  >
                    {paySubmitting
                      ? <><span style={{width:13,height:13,border:'2px solid rgba(255,255,255,.3)',borderTopColor:'#fff',borderRadius:'50%',display:'inline-block',animation:'spin .6s linear infinite'}}/> Recording…</>
                      : <><svg width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg> Record Payment</>
                    }
                  </button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    })()}

    {/* ── TAB: VENDOR PAYMENT SCHEDULE ── */}
    {!payRecordMode && payablesTab==='schedule'&&(
      <div style={{display:'flex',flexDirection:'column',gap:16}}>
        {/* Summary bar */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
          {(()=>{
            const scheduled = purchaseOrders.filter(p=>p.status==='closed'&&p.paymentDueDate);
            const today = new Date(); today.setHours(0,0,0,0);
            const overdue  = scheduled.filter(p=>new Date(p.paymentDueDate+'T00:00:00')<today);
            const dueSoon  = scheduled.filter(p=>{const d=new Date(p.paymentDueDate+'T00:00:00');return d>=today&&(d-today)/86400000<=7;});
            const upcoming = scheduled.filter(p=>new Date(p.paymentDueDate+'T00:00:00')>=today);
            return [
              {label:'Overdue',  value:overdue.length,  amt:overdue.reduce((s,p)=>s+(p.grandTotal||0),0),  color:'#EF4444', bg:'#FEF2F2'},
              {label:'Due ≤7 days',value:dueSoon.length,amt:dueSoon.reduce((s,p)=>s+(p.grandTotal||0),0),  color:'#F59E0B', bg:'#FFFBEB'},
              {label:'Scheduled', value:upcoming.length, amt:upcoming.reduce((s,p)=>s+(p.grandTotal||0),0), color:'#059669', bg:'#F0FDF4'},
            ].map((s,i)=>(
              <div key={i} style={{background:s.bg,border:`1px solid ${s.color}33`,borderRadius:12,padding:'16px 20px',display:'flex',alignItems:'center',gap:14}}>
                <div style={{width:44,height:44,borderRadius:10,background:s.color,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:18,flexShrink:0}}>
                  {i===0?'⚠':i===1?'⏰':'📆'}
                </div>
                <div>
                  <div style={{fontSize:22,fontWeight:900,color:s.color}}>{s.value}</div>
                  <div style={{fontSize:11,fontWeight:700,color:'#374151'}}>{s.label}</div>
                  <div style={{fontSize:11,color:'#6B7280'}}>₱{s.amt.toLocaleString('en-PH',{maximumFractionDigits:0})}</div>
                </div>
              </div>
            ));
          })()}
        </div>

        {/* Payment schedule table */}
        <div style={{background:'#fff',borderRadius:16,border:'1px solid #E5E7EB',overflow:'hidden'}}>
          <div style={{padding:'16px 22px',borderBottom:'1px solid #F1F5F9',background:'linear-gradient(135deg,#EFF6FF,#DBEAFE)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <span style={{fontSize:18}}>📆</span>
              <div>
                <div style={{fontSize:14,fontWeight:800,color:'#1E293B'}}>Vendor Payment Schedule</div>
                <div style={{fontSize:11,color:'#64748B'}}>Computed due dates based on payment term configurations</div>
              </div>
            </div>
          </div>
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
              <thead>
                <tr style={{background:'#F8FAFC'}}>
                  {['PO # / Invoice / Receipt','Supplier','Invoice Date','Amount','Payment Terms','Due Date','Days Left','Payment Status'].map(h=>(
                    <th key={h} style={{padding:'9px 14px',textAlign:'left',fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.05em',borderBottom:'1px solid #E5E7EB',whiteSpace:'nowrap'}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {(()=>{
                  const rows = purchaseOrders
                    .filter(p=>p.status==='closed')
                    .sort((a,b)=>{
                      const da = a.paymentDueDate?new Date(a.paymentDueDate).getTime():Infinity;
                      const db2 = b.paymentDueDate?new Date(b.paymentDueDate).getTime():Infinity;
                      return da-db2;
                    });
                  if(rows.length===0) return (
                    <tr><td colSpan={9} style={{padding:'40px',textAlign:'center',color:'#9CA3AF',fontSize:13}}>
                      <div style={{fontSize:36,marginBottom:12}}>📭</div>
                      <div style={{fontWeight:700,color:'#374151',marginBottom:4}}>No scheduled payments yet</div>
                      <div>Approve invoices in the Invoice Queue tab to generate payment schedules.</div>
                    </td></tr>
                  );
                  return rows.map((po,i)=>{
                    const suppId2  = po.supplierId||po.supplierName||'';
                    const cfg2     = po.paymentTermConfig || payTermConfigs[suppId2] || payTermConfigs[po.supplierName] || null;
                    const dueDate  = po.paymentDueDate
                      ? new Date(po.paymentDueDate+'T00:00:00')
                      : computePaymentDueDate(po.invoiceDate||'', cfg2);
                    const dDays   = daysUntilDue(dueDate);
                    const overdue = dDays!==null&&dDays<0;
                    const dueSoon = dDays!==null&&dDays>=0&&dDays<=7;
                    const cfg     = cfg2;
                    const rowBg   = overdue?'#FEF2F2':dueSoon?'#FFFBEB':'#fff';
                    const isPaid  = !!po.paymentPaid;
                    return (
                      <tr key={po.id}
                        style={{borderBottom:'1px solid #F1F5F9',background:rowBg}}
                      >
                        <td style={{padding:'11px 14px'}}>
                          <div style={{fontFamily:'monospace',fontWeight:800,color:'#1E293B',fontSize:12}}>{po.poNumber}</div>
                          {po.invoiceNumber&&<div style={{fontSize:10,color:'#6B7280',marginTop:1}}>Inv: {po.invoiceNumber}</div>}
                        </td>
                        <td style={{padding:'11px 14px'}}>
                          <div style={{fontWeight:700,color:'#374151'}}>{po.supplierName||'—'}</div>
                          <div style={{fontSize:10,color:'#9CA3AF'}}>{po.paymentTerms||'—'}</div>
                        </td>
                        <td style={{padding:'11px 14px',fontSize:11,color:'#374151'}}>{po.invoiceDate||'—'}</td>
                        <td style={{padding:'11px 14px',fontWeight:800,color:'#1E293B'}}>₱{(po.grandTotal||0).toLocaleString('en-PH',{minimumFractionDigits:2})}</td>
                        <td style={{padding:'11px 14px',fontSize:11,color:'#374151'}}>{cfg?`${cfg.days} days`:po.paymentTerms||'—'}</td>
                        <td style={{padding:'11px 14px'}}>
                          <div style={{fontSize:13,fontWeight:800,color:overdue?'#EF4444':dueSoon?'#F59E0B':'#1E293B'}}>{fmtDueDate(dueDate)}</div>
                        </td>
                        <td style={{padding:'11px 14px'}}>
                          {dDays!==null
                            ? <span style={{fontSize:11,fontWeight:700,
                                color:overdue?'#EF4444':dueSoon?'#F59E0B':'#059669',
                                background:overdue?'#FEF2F2':dueSoon?'#FFFBEB':'#F0FDF4',
                                padding:'3px 9px',borderRadius:20}}>
                                {overdue?`${Math.abs(dDays)}d overdue`:dDays===0?'Due today':`${dDays}d`}
                              </span>
                            : <span style={{color:'#9CA3AF',fontSize:11}}>—</span>
                          }
                        </td>
                        <td style={{padding:'11px 14px'}}>
                          {isPaid
                            ? <span style={{fontSize:10,fontWeight:700,color:'#166534',background:'#DCFCE7',padding:'3px 9px',borderRadius:20}}>✅ PAID</span>
                            : <span style={{fontSize:10,fontWeight:700,color:overdue?'#991B1B':dueSoon?'#92400E':'#1D4ED8',background:overdue?'#FEE2E2':dueSoon?'#FEF3C7':'#DBEAFE',padding:'3px 9px',borderRadius:20}}>
                                {overdue?'OVERDUE':dueSoon?'DUE SOON':'PENDING'}
                              </span>
                          }
                        </td>
                      </tr>
                    );
                  });
                })()}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    )}

    {/* ── TAB: PAYABLES SETTINGS ── */}
    {!payRecordMode && payablesTab==='settings'&&(
      <div className="space-y-4">

        {/* Info + EOM example — compact two-col */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <div style={{background:'#EFF6FF',border:'1px solid #BFDBFE',borderRadius:12,padding:'12px 16px',display:'flex',gap:10,alignItems:'flex-start'}}>
            <svg width="15" height="15" fill="none" stroke="#3B82F6" viewBox="0 0 24 24" strokeWidth={2} style={{flexShrink:0,marginTop:1}}><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <div>
              <p style={{fontSize:12,fontWeight:700,color:'#1D4ED8',marginBottom:2}}>Payment Terms Configuration</p>
              <p style={{fontSize:11,color:'#3B82F6',lineHeight:1.55}}>
                Set <strong>Days</strong>, <strong>Start From</strong> (invoice date or end of month), and <strong>Count Type</strong> (calendar or working days) per supplier. Used to auto-compute due dates when invoices are approved in the Invoice Queue.
              </p>
            </div>
          </div>
          <div style={{background:'#F0FDF4',border:'1px solid #BBF7D0',borderRadius:12,padding:'12px 16px'}}>
            <div style={{fontSize:11,fontWeight:800,color:'#166534',marginBottom:6}}>📌 EOM Example — "45 Days After EOM"</div>
            <div style={{fontSize:11,color:'#374151',lineHeight:1.7}}>
              Invoice Date: <strong>Mar 10, 2026</strong> → EOM: <strong>Mar 31</strong> → +45 days = <strong style={{color:'#059669'}}>May 15, 2026</strong>
            </div>
            <div style={{fontSize:11,color:'#374151',lineHeight:1.7,marginTop:2}}>
              Working Days example: +30 working days skips Sat &amp; Sun, so 30 working days ≈ 42 calendar days.
            </div>
          </div>
        </div>

        {/* Controls bar — matches Inventory style */}
        <div className="bg-white rounded-xl shadow-lg p-4">
          <div className="flex flex-wrap items-center gap-3">
            {/* Search */}
            <div className="relative flex-1 min-w-48">
              <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              <input type="text" placeholder="Search supplier name, code, payment terms…"
                value={ptSearch} onChange={e=>setPtSearch(e.target.value)}
                className="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none"/>
            </div>
            {/* Configured filter */}
            <select onChange={e=>setPtSearch(e.target.value===''?ptSearch:e.target.value)}
              className="px-3 py-2 border border-gray-300 rounded-lg text-sm outline-none min-w-36"
              defaultValue="">
              <option value="">All Suppliers</option>
              <option value="__configured__">Configured Only</option>
              <option value="__unconfigured__">Not Configured</option>
            </select>
            <div className="flex-1"/>
            <span className="text-xs text-gray-400">
              {(()=>{
                const configured = suppliers.filter(s=>payTermConfigs[s.id||s.supplierCode||s.name]?.days);
                return `${configured.length} of ${suppliers.length} configured`;
              })()}
            </span>
          </div>
        </div>

        {/* Table — fixed layout matching Inventory */}
        <div className="bg-white rounded-xl shadow-lg overflow-hidden">
          <div className="overflow-x-auto">
            <table className="w-full table-fixed divide-y divide-gray-200" style={{minWidth:980}}>
              <colgroup>
                <col style={{width:'5%'}}/>
                <col style={{width:'22%'}}/>
                <col style={{width:'10%'}}/>
                <col style={{width:'13%'}}/>
                <col style={{width:'9%'}}/>
                <col style={{width:'16%'}}/>
                <col style={{width:'16%'}}/>
                <col style={{width:'14%'}}/>
                <col style={{width:'10%'}}/>
              </colgroup>
              <thead>
                <tr className="bg-gradient-to-r from-amber-600 to-orange-500 text-white">
                  <th className="px-3 py-3 text-xs font-semibold uppercase tracking-wider text-amber-100 text-center">#</th>
                  {[
                    {key:'name',       label:'Supplier'},
                    {key:'code',       label:'Code'},
                    {key:'paymentTerms',label:'Supplier Terms'},
                    {key:'days',       label:'Days'},
                    {key:'mode',       label:'Start From'},
                    {key:'countType',  label:'Count Type'},
                    {key:'preview',    label:'Due Date Preview'},
                  ].map(col=>(
                    <th key={col.key}
                      onClick={()=>col.key!=='preview'&&setPtSort(s=>({key:col.key,dir:s.key===col.key&&s.dir==='asc'?'desc':'asc'}))}
                      className={`px-3 py-3 text-left text-xs font-semibold uppercase tracking-wider text-amber-100 select-none transition-colors ${col.key!=='preview'?'cursor-pointer hover:bg-white hover:bg-opacity-10':''}`}>
                      <div className="flex items-center gap-1">
                        {col.label}
                        {col.key!=='preview'&&(
                          <span className={`text-xs ${ptSort.key===col.key?'text-white opacity-100':'opacity-30'}`}>
                            {ptSort.key===col.key?(ptSort.dir==='asc'?'▲':'▼'):'⇅'}
                          </span>
                        )}
                      </div>
                    </th>
                  ))}
                  <th className="px-3 py-3 text-xs font-semibold uppercase tracking-wider text-amber-100 text-center">Save</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-100">
                {(()=>{
                  // Filter
                  let rows = suppliers.filter(sup=>{
                    if(!ptSearch) return true;
                    if(ptSearch==='__configured__') return !!payTermConfigs[sup.id||sup.supplierCode||sup.name]?.days;
                    if(ptSearch==='__unconfigured__') return !payTermConfigs[sup.id||sup.supplierCode||sup.name]?.days;
                    const q = ptSearch.toLowerCase();
                    return (sup.name||'').toLowerCase().includes(q)
                      || (sup.supplierCode||'').toLowerCase().includes(q)
                      || (sup.paymentTerms||'').toLowerCase().includes(q);
                  });
                  // Sort
                  rows = [...rows].sort((a,b)=>{
                    const suppIdA = a.id||a.supplierCode||a.name;
                    const suppIdB = b.id||b.supplierCode||b.name;
                    const cfgA = payTermConfigs[suppIdA]||{};
                    const cfgB = payTermConfigs[suppIdB]||{};
                    let vA='', vB='';
                    if(ptSort.key==='name')        { vA=a.name||''; vB=b.name||''; }
                    else if(ptSort.key==='code')   { vA=a.supplierCode||''; vB=b.supplierCode||''; }
                    else if(ptSort.key==='paymentTerms') { vA=a.paymentTerms||''; vB=b.paymentTerms||''; }
                    else if(ptSort.key==='days')   { vA=parseFloat(cfgA.days)||0; vB=parseFloat(cfgB.days)||0; return ptSort.dir==='asc'?vA-vB:vB-vA; }
                    else if(ptSort.key==='mode')   { vA=cfgA.mode||''; vB=cfgB.mode||''; }
                    else if(ptSort.key==='countType') { vA=cfgA.countType||''; vB=cfgB.countType||''; }
                    return ptSort.dir==='asc'?vA.localeCompare(vB):vB.localeCompare(vA);
                  });

                  if(rows.length===0) return (
                    <tr><td colSpan={9} className="py-16 text-center text-gray-400">
                      <div style={{fontSize:36,marginBottom:10}}>🏭</div>
                      <div style={{fontWeight:700,color:'#374151',marginBottom:4}}>No suppliers found</div>
                      <div style={{fontSize:12}}>{ptSearch?'Try a different search.':'Add suppliers in the Suppliers module first.'}</div>
                    </td></tr>
                  );

                  return rows.map((sup,idx)=>{
                    const suppId = sup.id||sup.supplierCode||sup.name;
                    const cfg    = payTermConfigs[suppId] || { days:'', mode:'invoice', countType:'calendar' };
                    const saving = savingPayTerm===suppId;
                    const configured = !!cfg.days;
                    const dueDate = configured ? computePaymentDueDate(new Date().toISOString().split('T')[0], cfg) : null;
                    const rowBg  = idx%2===0?'bg-white':'bg-gray-50';

                    return (
                      <tr key={sup.id||idx} className={`${rowBg} hover:bg-amber-50 transition-colors`}>

                        {/* # */}
                        <td className="px-3 py-3 text-center text-xs text-gray-400 font-mono">{idx+1}</td>

                        {/* Supplier name */}
                        <td className="px-3 py-3">
                          <div className="flex items-center gap-2">
                            <div style={{width:30,height:30,borderRadius:8,background:`hsl(${idx*47+180},55%,50%)`,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:800,fontSize:12,flexShrink:0}}>
                              {(sup.name||'?').charAt(0).toUpperCase()}
                            </div>
                            <div className="truncate">
                              <div className="text-sm font-semibold text-gray-900 truncate">{sup.name||'—'}</div>
                              {!configured&&<div className="text-xs text-amber-500 font-semibold">⚠ Not configured</div>}
                              {configured&&<div className="text-xs text-emerald-600 font-semibold">✓ Configured</div>}
                            </div>
                          </div>
                        </td>

                        {/* Code */}
                        <td className="px-3 py-3">
                          <span className="text-xs font-mono bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded">{sup.supplierCode||'—'}</span>
                        </td>

                        {/* Supplier's own payment terms */}
                        <td className="px-3 py-3">
                          <span className={`text-xs px-2 py-0.5 rounded-full font-medium whitespace-nowrap ${sup.paymentTerms?'bg-blue-100 text-blue-700':'bg-gray-100 text-gray-400'}`}>
                            {sup.paymentTerms||'Not set'}
                          </span>
                        </td>

                        {/* Days input */}
                        <td className="px-3 py-2">
                          <input type="number" min="0" max="365"
                            value={cfg.days||''}
                            onChange={e=>setPayTermConfigs(prev=>({...prev,[suppId]:{...cfg,days:e.target.value}}))}
                            placeholder={sup.paymentTerms?.match(/\d+/)?.[0]||'—'}
                            className="w-full px-2 py-1.5 border border-gray-300 rounded-lg text-sm text-center font-bold focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none"
                            style={{minWidth:56}}/>
                        </td>

                        {/* Mode select */}
                        <td className="px-3 py-2">
                          <select value={cfg.mode||'invoice'}
                            onChange={e=>setPayTermConfigs(prev=>({...prev,[suppId]:{...cfg,mode:e.target.value}}))}
                            className="w-full px-2 py-1.5 border border-gray-300 rounded-lg text-xs focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none bg-white">
                            <option value="invoice">From Invoice Date</option>
                            <option value="eom">After EOM</option>
                          </select>
                        </td>

                        {/* Count type select */}
                        <td className="px-3 py-2">
                          <select value={cfg.countType||'calendar'}
                            onChange={e=>setPayTermConfigs(prev=>({...prev,[suppId]:{...cfg,countType:e.target.value}}))}
                            className="w-full px-2 py-1.5 border border-gray-300 rounded-lg text-xs focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none bg-white">
                            <option value="calendar">Calendar Days</option>
                            <option value="working">Working Days</option>
                          </select>
                        </td>

                        {/* Due date preview */}
                        <td className="px-3 py-3">
                          {dueDate
                            ? <div>
                                <div className="text-xs font-bold text-emerald-700">{fmtDueDate(dueDate)}</div>
                                <div className="text-xs text-gray-400">
                                  {cfg.mode==='eom'?'EOM':'Invoice'} +{cfg.days} {cfg.countType==='working'?'wkg':'cal'}d
                                </div>
                              </div>
                            : <span className="text-xs text-gray-300">Enter days first</span>
                          }
                        </td>

                        {/* Save button */}
                        <td className="px-3 py-2 text-center">
