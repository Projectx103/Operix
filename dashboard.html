                      if (!productSales[item.productId]) productSales[item.productId] = { name: item.productName || item.name, units: 0, revenue: 0 };
                      productSales[item.productId].units += item.quantity || 0;
                      productSales[item.productId].revenue += (item.quantity || 0) * (item.price || 0);
                    });
                  });
                  return Object.values(productSales).sort((a, b) => b.revenue - a.revenue).slice(0, 10);
                })().map((p, idx) => (
                  <tr key={idx} className="hover:bg-gray-50">
                    <td className="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-500">#{idx + 1}</td>
                    <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{p.name}</td>
                    <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-700">{p.units}</td>
                    <td className="px-6 py-4 whitespace-nowrap text-sm font-semibold text-green-700">${p.revenue.toFixed(2)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    )}

    {activeReport === 'category-performance' && (
      <div className="animate-fadeIn">
        <div className="bg-white rounded-xl shadow-lg overflow-hidden">
          <div className="px-6 py-4 border-b border-gray-200 bg-gradient-to-r from-indigo-50 to-blue-50">

                  <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Products</th>
                  <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total Stock</th>
                  <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Inventory Value</th>
                </tr>
              </thead>
              <tbody className="bg-white divide-y divide-gray-200">
                {categories.map((cat, idx) => {
                  const catProducts = products.filter(p => p.category === cat);
                  const totalStock = catProducts.reduce((sum, p) => sum + (p.stock || 0), 0);
                  const totalValue = catProducts.reduce((sum, p) => sum + ((p.stock || 0) * (p.price || 0)), 0);
                  return (
                    <tr key={idx} className="hover:bg-gray-50">
                      <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{cat}</td>
                      <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-700">{catProducts.length}</td>
                      <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-700">{totalStock}</td>
                      <td className="px-6 py-4 whitespace-nowrap text-sm font-semibold text-indigo-700">${totalValue.toFixed(2)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    )}

    {activeReport === 'cancellation-requests' && (

    {activeReport === 'invoice-template' && (

</div>

            denied:              { bg:'#FEE2E2', color:'#991B1B', dot:'#EF4444', label:'Denied' },
            withdrawn:           { bg:'#FEF3C7', color:'#92400E', dot:'#F59E0B', label:'Withdrawn' },
            pending_approval:    { bg:'#DBEAFE', color:'#1E40AF', dot:'#3B82F6', label:'Awaiting Approval' },
            no_approval_required:{ bg:'#DCFCE7', color:'#166534', dot:'#22C55E', label:'Approved' },
          }[st] || { bg:'#F1F5F9', color:'#475569', dot:'#94A3B8', label: st || 'Submitted' };
          return (
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',background:cfg.bg,border:`1px solid ${cfg.dot}33`,borderRadius:12,padding:'10px 16px'}}>
              <span style={{display:'flex',alignItems:'center',gap:8,fontWeight:700,fontSize:13,color:cfg.color}}>
                <span style={{width:8,height:8,borderRadius:'50%',background:cfg.dot,flexShrink:0}}/>
                {cfg.label}
              </span>
              {statusViewPO.assignedApproverName && st === 'pending_approval' && (
                <span style={{fontSize:11,color:'#64748B'}}>
                  Assigned to: <strong style={{color:'#1E293B'}}>{statusViewPO.assignedApproverName}</strong>
                </span>
              )}
            </div>
          );
        })()}

        {/* Summary grid */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          {[
            ['Created By',        statusViewPO.createdByName || '—'],
            ['Submitted',         statusViewPO.createdAt?.toDate ? statusViewPO.createdAt.toDate().toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'}) : '—'],
            ['Payment Terms',     statusViewPO.paymentTerms || '—'],
            ['Expected Delivery', statusViewPO.expectedDeliveryDate || '—'],
            ['Subtotal',          `${getCurrencySymbol(statusViewPO.currency)}${(statusViewPO.subtotal||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}`],
            ['Grand Total',       `${getCurrencySymbol(statusViewPO.currency)}${(statusViewPO.grandTotal||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}`],
          ].map(([label, val]) => (
            <div key={label} style={{background:'#F8FAFC',borderRadius:10,padding:'10px 14px',border:'1px solid #E5E7EB'}}>
              <p style={{fontSize:10,fontWeight:700,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:3}}>{label}</p>
              <p style={{fontSize:13,fontWeight:700,color:'#1E293B'}}>{val}</p>
            </div>
          ))}
        </div>

        {/* Line items */}
        <div>
          <p style={{fontSize:11,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:8}}>
            Line Items ({statusViewPO.items?.length || 0})
          </p>
          <div style={{border:'1px solid #E5E7EB',borderRadius:10,overflow:'hidden'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
              <thead>
                <tr style={{background:'#F1F5F9'}}>
                  {['Product','Qty','Unit Cost','Amount'].map(h => (
                    <th key={h} style={{padding:'8px 12px',textAlign: h==='Product' ? 'left':'right',fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.05em'}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {(statusViewPO.items || []).map((item, i) => (
                  <tr key={i} style={{background: i%2===0 ? '#fff':'#F8FAFC'}}>
                    <td style={{padding:'8px 12px',fontWeight:600,color:'#1E293B'}}>{item.productName}</td>
                    <td style={{padding:'8px 12px',textAlign:'right',color:'#475569'}}>{item.quantity}</td>
                    <td style={{padding:'8px 12px',textAlign:'right',color:'#475569'}}>{getCurrencySymbol(statusViewPO.currency)}{parseFloat(item.unitCost||0).toFixed(2)}</td>
                    <td style={{padding:'8px 12px',textAlign:'right',fontWeight:700,color:'#1D4ED8'}}>{getCurrencySymbol(statusViewPO.currency)}{parseFloat(item.subtotal||0).toFixed(2)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        {/* Approval history timeline */}
        {statusViewPO.approvalHistory && statusViewPO.approvalHistory.length > 0 && (
          <div style={{border:'1px solid #E5E7EB',borderRadius:10,overflow:'hidden'}}>
            <div style={{background:'#F8FAFC',padding:'8px 14px',borderBottom:'1px solid #E5E7EB'}}>
              <p style={{fontSize:11,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.07em'}}>📋 Approval History</p>
            </div>
            <div>
              {[...statusViewPO.approvalHistory].reverse().map((entry, i) => {
                const cfg = {
                  approved:  { bg:'#F0FDF4', dot:'#22C55E', label:'✅ Approved',          tc:'#166534' },
                  denied:    { bg:'#FEF2F2', dot:'#EF4444', label:'✗ Denied',             tc:'#991B1B' },
                  rfi:       { bg:'#FFFBEB', dot:'#F59E0B', label:'📋 Information Requested', tc:'#92400E' },
                  rfi_reply: { bg:'#EFF6FF', dot:'#3B82F6', label:'💬 Reply Submitted',   tc:'#1E40AF' },
                  withdrawn: { bg:'#FFF7ED', dot:'#F97316', label:'↩ Withdrawn',          tc:'#C2410C' },
                }[entry.action] || { bg:'#F8FAFC', dot:'#94A3B8', label: entry.action, tc:'#475569' };
                return (
                  <div key={i} style={{padding:'10px 14px',background:cfg.bg,borderBottom:'1px solid #F1F5F9'}}>
                    <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
                      <span style={{width:8,height:8,borderRadius:'50%',background:cfg.dot,flexShrink:0,marginTop:4}}/>
                      <div style={{flex:1}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                          <span style={{fontSize:12,fontWeight:700,color:cfg.tc}}>{cfg.label}</span>
                          <span style={{fontSize:11,color:'#94A3B8'}}>{entry.at ? new Date(entry.at).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—'}</span>
                        </div>
                        <p style={{fontSize:11,color:'#64748B',marginTop:2}}>By: <strong style={{color:'#1E293B'}}>{entry.by}</strong></p>
                        {entry.reason && (
                          <p style={{fontSize:11,color:'#374151',marginTop:6,background:'rgba(255,255,255,.7)',borderRadius:6,padding:'6px 10px',border:'1px solid #E5E7EB'}}>
                            "{entry.reason}"
                          </p>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* ── RFI Reply Section — only shown when approver has requested info ── */}
        {statusViewPO.lastRFI && (statusViewPO.approvalStatus === 'pending_approval' || statusViewPO.status === 'submitted') && (
          <div style={{border:'2px solid #F59E0B',borderRadius:12,overflow:'hidden',background:'#FFFBEB'}}>
            <div style={{padding:'10px 16px',background:'#FEF3C7',borderBottom:'1px solid #FDE68A',display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontSize:16}}>📋</span>
              <div>
                <p style={{fontSize:12,fontWeight:800,color:'#92400E'}}>Approver has requested additional information</p>
                <p style={{fontSize:11,color:'#B45309',marginTop:1}}>Please reply below — your response will be sent directly to the approver</p>
              </div>
            </div>
            <div style={{padding:'14px 16px'}}>
              <div style={{background:'#fff',border:'1px solid #FDE68A',borderRadius:8,padding:'10px 14px',marginBottom:12}}>
                <p style={{fontSize:10,fontWeight:700,color:'#92400E',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:4}}>
                  Question from {statusViewPO.lastRFIBy || 'Approver'}:
                </p>
                <p style={{fontSize:13,color:'#1E293B',fontWeight:500}}>"{statusViewPO.lastRFI}"</p>
              </div>
              <label style={{fontSize:11,fontWeight:700,color:'#374151',display:'block',marginBottom:6,textTransform:'uppercase',letterSpacing:'.06em'}}>
                Your Reply *
              </label>
              <textarea
                value={rfiReplyText}
                onChange={e => setRfiReplyText(e.target.value)}
                placeholder="Provide the requested information or clarification here..."
                rows={3}
                style={{width:'100%',padding:'10px 12px',border:'1px solid #FDE68A',borderRadius:8,fontSize:13,outline:'none',resize:'none',fontFamily:'inherit',background:'#fff',boxSizing:'border-box'}}
                onFocus={e => e.target.style.borderColor='#F59E0B'}
                onBlur={e => e.target.style.borderColor='#FDE68A'}
              />
              <button
                onClick={() => submitRFIReply(statusViewPO.id, rfiReplyText)}
                disabled={submittingRFIReply || !rfiReplyText.trim()}
                style={{
                  marginTop:10, width:'100%', padding:'10px 0',
                  background: (submittingRFIReply || !rfiReplyText.trim()) ? '#D97706' : '#D97706',
                  opacity: (submittingRFIReply || !rfiReplyText.trim()) ? .5 : 1,
                  color:'#fff', fontWeight:700, fontSize:13, border:'none', borderRadius:8,
                  cursor: (submittingRFIReply || !rfiReplyText.trim()) ? 'not-allowed':'pointer',
                  fontFamily:'inherit'
                }}
              >
                {submittingRFIReply ? 'Sending…' : '💬 Submit Reply to Approver'}
              </button>
            </div>
          </div>
        )}

      </div>

      {/* Footer — close only, no action buttons for purchaser */}
      <div style={{padding:'14px 24px',background:'#F8FAFC',borderTop:'1px solid #E5E7EB',display:'flex',justifyContent:'flex-end'}}>
        <button
          onClick={() => { setShowPOStatusModal(false); setStatusViewPO(null); setRfiReplyText(''); }}
          style={{padding:'9px 24px',background:'#1E3A78',color:'#fff',fontWeight:700,fontSize:13,border:'none',borderRadius:8,cursor:'pointer',fontFamily:'inherit'}}
        >
          Close
        </button>
      </div>

    </div>
  </div>
)}


{showPOApprovalModal && approvalPO && (
  <div className="fixed inset-0 z-50 flex items-center justify-center" style={{background:'rgba(0,0,0,0.55)'}}>
    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-xl mx-4 overflow-hidden">
      {/* Header */}
      <div className="bg-gradient-to-r from-indigo-600 to-purple-600 px-6 py-5 flex items-start justify-between">
        <div>
          <p className="text-xs text-indigo-200 font-semibold uppercase tracking-wider mb-1">Purchase Order Review</p>
          <h2 className="text-white text-xl font-bold">{approvalPO.poNumber || approvalPO.id.slice(0,8).toUpperCase()}</h2>
          <p className="text-indigo-200 text-sm mt-0.5">{approvalPO.supplierName} · {getCurrencySymbol(approvalPO.currency)}{(approvalPO.grandTotal||0).toFixed(2)}</p>
        </div>
        <button
          onClick={() => { setShowPOApprovalModal(false); setApprovalPO(null); setIsDenyMode(false); setIsRFIMode(false); setDenyReason(''); setRfiMessage(''); }}
          className="w-8 h-8 bg-white bg-opacity-20 hover:bg-opacity-30 rounded-lg flex items-center justify-center text-white transition-all flex-shrink-0 mt-0.5"
        >✕</button>
      </div>

      <div className="px-6 py-5 space-y-4 max-h-[60vh] overflow-y-auto">
        {/* PO Summary */}
        <div className="grid grid-cols-2 gap-3">
          {[
            ['Created By', approvalPO.createdByName || '—'],
            ['Date', approvalPO.createdAt?.toDate ? approvalPO.createdAt.toDate().toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'}) : '—'],
            ['Payment Terms', approvalPO.paymentTerms || '—'],
            ['Expected Delivery', approvalPO.expectedDeliveryDate || '—'],
            ['Subtotal', `${getCurrencySymbol(approvalPO.currency)}${(approvalPO.subtotal||0).toFixed(2)}`],
            ['Grand Total', `${getCurrencySymbol(approvalPO.currency)}${(approvalPO.grandTotal||0).toFixed(2)}`],
          ].map(([label, val]) => (
            <div key={label} className="bg-gray-50 rounded-xl px-4 py-3 border border-gray-100">
              <p className="text-xs text-gray-400 font-semibold uppercase tracking-wider mb-0.5">{label}</p>
              <p className="text-sm font-bold text-gray-800">{val}</p>
            </div>
          ))}
        </div>

        {/* Items */}
        <div>
          <p className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Line Items ({approvalPO.items?.length || 0})</p>
          <div className="border border-gray-200 rounded-xl overflow-hidden">
            <table className="w-full text-sm">
              <thead><tr className="bg-gray-100 text-gray-500 text-xs font-bold uppercase">
                <th className="px-3 py-2 text-left">Product</th>
                <th className="px-3 py-2 text-center">Qty</th>
                <th className="px-3 py-2 text-right">Unit Cost</th>
                <th className="px-3 py-2 text-right">Amount</th>
              </tr></thead>
              <tbody>
                {(approvalPO.items || []).map((item, idx) => (
                  <tr key={idx} className={idx % 2 === 0 ? 'bg-white' : 'bg-gray-50'}>
                    <td className="px-3 py-2 font-medium text-gray-800">{item.productName}</td>
                    <td className="px-3 py-2 text-center text-gray-600">{item.quantity}</td>
                    <td className="px-3 py-2 text-right text-gray-600">{getCurrencySymbol(approvalPO.currency)}{parseFloat(item.unitCost||0).toFixed(2)}</td>
                    <td className="px-3 py-2 text-right font-bold text-indigo-700">{getCurrencySymbol(approvalPO.currency)}{parseFloat(item.subtotal||0).toFixed(2)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        {/* Notes */}
        {approvalPO.internalNotes && (
          <div className="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3">
            <p className="text-xs font-bold text-amber-700 uppercase tracking-wider mb-1">Internal Notes</p>
            <p className="text-sm text-amber-800">{approvalPO.internalNotes}</p>
          </div>
        )}

        {/* Approval History Timeline */}
        {approvalPO.approvalHistory && approvalPO.approvalHistory.length > 0 && (
          <div className="border border-gray-200 rounded-xl overflow-hidden">
            <div className="bg-gray-50 px-4 py-2 border-b border-gray-200">
              <p className="text-xs font-bold text-gray-600 uppercase tracking-wider">📋 Approval History</p>
            </div>
            <div className="divide-y divide-gray-100">
              {[...approvalPO.approvalHistory].reverse().map((entry, i) => {
                const actionConfig = {
                  approved:  { bg: 'bg-green-50',  border: 'border-green-200',  dot: 'bg-green-500',  label: '✅ Approved',           textColor: 'text-green-700'  },
                  denied:    { bg: 'bg-red-50',    border: 'border-red-200',    dot: 'bg-red-500',    label: '✗ Denied',             textColor: 'text-red-700'    },
                  rfi:       { bg: 'bg-amber-50',  border: 'border-amber-200',  dot: 'bg-amber-400',  label: '📋 Requested Info',    textColor: 'text-amber-700'  },
                  withdrawn: { bg: 'bg-orange-50', border: 'border-orange-200', dot: 'bg-orange-400', label: '↩ Withdrawn by Issuer', textColor: 'text-orange-700' },
                }[entry.action] || { bg: 'bg-gray-50', border: 'border-gray-200', dot: 'bg-gray-400', label: entry.action, textColor: 'text-gray-600' };
                return (
                  <div key={i} className={`px-4 py-3 ${actionConfig.bg}`}>
                    <div className="flex items-start gap-3">
                      <div className={`w-2 h-2 rounded-full mt-1.5 flex-shrink-0 ${actionConfig.dot}`}></div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center justify-between gap-2 flex-wrap">
                          <span className={`text-xs font-bold ${actionConfig.textColor}`}>{actionConfig.label}</span>
                          <span className="text-xs text-gray-400 flex-shrink-0">{entry.at ? new Date(entry.at).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—'}</span>
                        </div>
                        <p className="text-xs text-gray-600 mt-0.5">By: <span className="font-medium">{entry.by}</span></p>
                        {entry.reason && (
                          <p className="text-xs text-gray-700 mt-1 bg-white bg-opacity-60 rounded px-2 py-1 border border-gray-100">"{entry.reason}"</p>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Deny reason input */}
        {isDenyMode && (
          <div>
            <label className="text-xs font-bold text-red-600 uppercase tracking-wider block mb-1.5">Reason for Denial *</label>
            <textarea
              value={denyReason}
              onChange={(e) => setDenyReason(e.target.value)}
              placeholder="Please provide a reason for denying this PO..."
              rows={3}
              className="w-full px-3 py-2 border border-red-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-400 resize-none"
            />
          </div>
        )}

        {/* RFI message input */}
        {isRFIMode && (
          <div>
            <label className="text-xs font-bold text-amber-600 uppercase tracking-wider block mb-1.5">📋 Request for Information *</label>
            <p className="text-xs text-gray-500 mb-2">Describe what additional information or clarification you need from the purchaser before you can approve this PO.</p>
            <textarea
              value={rfiMessage}
              onChange={(e) => setRfiMessage(e.target.value)}
              placeholder="e.g. Please provide supporting quotations for the listed items, or clarify the delivery address..."
              rows={3}
              className="w-full px-3 py-2 border border-amber-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-amber-400 resize-none"
            />
          </div>
        )}
      </div>

      {/* Footer actions */}
      <div className="px-6 py-4 bg-gray-50 border-t border-gray-100 flex items-center gap-3">
        {!isDenyMode && !isRFIMode ? (
          <>
            <button
              onClick={() => { setIsDenyMode(true); setIsRFIMode(false); }}
              className="flex-1 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 rounded-xl text-sm font-semibold transition-all">
              ✗ Deny PO
            </button>
            <button
              onClick={() => { setIsRFIMode(true); setIsDenyMode(false); }}
              className="flex-1 py-2.5 bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 rounded-xl text-sm font-semibold transition-all">
              📋 Request for Information
            </button>
            <button
              onClick={() => approvePO(approvalPO.id)}
              className="flex-1 py-2.5 bg-green-600 hover:bg-green-700 text-white rounded-xl text-sm font-bold transition-all shadow-md">
              ✓ Approve PO
            </button>
          </>
        ) : isDenyMode ? (
          <>
            <button
              onClick={() => { setIsDenyMode(false); setDenyReason(''); }}
              className="px-4 py-2.5 bg-white hover:bg-gray-100 text-gray-600 border border-gray-200 rounded-xl text-sm font-semibold transition-all">
              Cancel
            </button>
            <button
              onClick={() => {
                if (!denyReason.trim()) { alert('Please provide a reason for denial.'); return; }
                denyPO(approvalPO.id, denyReason.trim());
              }}
              className="flex-1 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl text-sm font-bold transition-all">
              Confirm Denial
            </button>
          </>
        ) : (
          <>
            <button
              onClick={() => { setIsRFIMode(false); setRfiMessage(''); }}
              className="px-4 py-2.5 bg-white hover:bg-gray-100 text-gray-600 border border-gray-200 rounded-xl text-sm font-semibold transition-all">
              Cancel
            </button>
            <button
              onClick={() => {
                if (!rfiMessage.trim()) { alert('Please describe what information you need.'); return; }
                sendRFI(approvalPO.id, rfiMessage.trim());
              }}
              className="flex-1 py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-sm font-bold transition-all">
              📋 Send Request for Information
            </button>
          </>
        )}
      </div>
    </div>
  </div>
)}

{/* ── Withdraw PO Modal ─────────────────────────────────────────────── */}
{showWithdrawModal && withdrawPOTarget && (
  <div className="fixed inset-0 z-50 flex items-center justify-center" style={{background:'rgba(0,0,0,0.6)',backdropFilter:'blur(4px)'}}>
    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 overflow-hidden">
      {/* Header */}
      <div className="bg-orange-600 px-6 py-4">
        <h2 className="text-white text-lg font-bold">↩ Withdraw Purchase Order</h2>
        <p className="text-orange-100 text-sm mt-0.5">{withdrawPOTarget.poNumber} · {withdrawPOTarget.supplierName}</p>
      </div>
      {/* Body */}
      <div className="px-6 py-5 space-y-4">
        <div className="bg-orange-50 border border-orange-200 rounded-xl px-4 py-3">
          <p className="text-sm text-orange-800">Withdrawing this PO will mark it as <strong>Incomplete</strong> and notify the assigned approver. You can edit and resubmit it afterwards.</p>
        </div>
        <div>
          <label className="text-xs font-bold text-gray-700 uppercase tracking-wider block mb-1.5">Reason for Withdrawal <span className="text-red-500">*</span></label>
          <textarea
            value={withdrawReason}
            onChange={(e) => setWithdrawReason(e.target.value)}
            placeholder="e.g. Found an error in the quantities, need to revise the supplier details..."

            className="w-full px-3 py-2 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-orange-400 resize-none"
            autoFocus
          />
          <p className="text-xs text-gray-400 mt-1">This reason will be visible to the approver in the approval history.</p>
        </div>
        {withdrawPOTarget.approvalHistory && withdrawPOTarget.approvalHistory.length > 0 && (
          <div className="border border-gray-200 rounded-xl overflow-hidden">
            <div className="bg-gray-50 px-3 py-2 border-b border-gray-200">
              <p className="text-xs font-bold text-gray-500 uppercase tracking-wider">Previous Actions on this PO</p>
            </div>
            <div className="divide-y divide-gray-100 max-h-36 overflow-y-auto">
              {[...withdrawPOTarget.approvalHistory].reverse().map((entry, i) => {
                const colors = { approved:'text-green-700', denied:'text-red-700', rfi:'text-amber-700', withdrawn:'text-orange-700' };
                const labels = { approved:'✅ Approved', denied:'✗ Denied', rfi:'📋 RFI', withdrawn:'↩ Withdrawn' };
                return (
                  <div key={i} className="px-3 py-2">
                    <div className="flex items-center justify-between">
                      <span className={`text-xs font-bold ${colors[entry.action]||'text-gray-600'}`}>{labels[entry.action]||entry.action}</span>
                      <span className="text-xs text-gray-400">{entry.at ? new Date(entry.at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—'}</span>
                    </div>
                    <p className="text-xs text-gray-500">By: {entry.by}</p>
                    {entry.reason && <p className="text-xs text-gray-600 italic mt-0.5">"{entry.reason}"</p>}
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>
      {/* Footer */}
      <div className="px-6 py-4 bg-gray-50 border-t border-gray-100 flex gap-3">
        <button
          onClick={() => { setShowWithdrawModal(false); setWithdrawPOTarget(null); setWithdrawReason(''); }}
          className="flex-1 py-2.5 bg-white hover:bg-gray-100 text-gray-600 border border-gray-200 rounded-xl text-sm font-semibold transition-all">
          Cancel
        </button>
        <button
          onClick={() => {
            if (!withdrawReason.trim()) { alert('Please provide a reason for withdrawal.'); return; }
            withdrawPO(withdrawPOTarget.id, withdrawReason.trim());
          }}
          className="flex-1 py-2.5 bg-orange-600 hover:bg-orange-700 text-white rounded-xl text-sm font-bold transition-all">
          ↩ Confirm Withdrawal
        </button>
      </div>
    </div>
  </div>
)}




{/* ── Oracle EBS Request Center Modal ─────────────────────────────── */}
{showRequestModal && (

    <div style={{background:'#EAECF2',width:'820px',maxWidth:'97vw',maxHeight:'94vh',overflowY:'auto',boxShadow:'0 12px 60px rgba(0,0,0,0.45)',fontFamily:"'Courier New',Courier,monospace",border:'2px solid #7A90B8',display:'flex',flexDirection:'column'}}>

      {/* Title bar */}
      <div style={{background:'linear-gradient(180deg,#1E3A78 0%,#112255 100%)',padding:'9px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',borderBottom:'2px solid #4A6AA8',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:18,height:18,background:'#C0CCEA',border:'1px solid #7A90B8',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,color:'#1A2A60',fontWeight:900}}>R</div>
          <span style={{color:'#DCE6F8',fontSize:13,fontWeight:700,letterSpacing:'1px'}}>OPERIX — Request Center</span>
          {requestModalPO && <span style={{color:'#8AACD8',fontSize:11,marginLeft:8}}>| {requestModalPO.poNumber}</span>}
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          {requestStep !== 1 && <button onClick={()=>setRequestStep(1)} style={{color:'#C0CCEA',background:'#1E3A78',border:'1px solid #4A6AA8',padding:'2px 10px',cursor:'pointer',fontSize:11,fontFamily:'inherit'}}>← Back to Center</button>}
          <button onClick={()=>setShowRequestModal(false)} style={{color:'#C0CCEA',background:'none',border:'1px solid #4A6AA8',width:22,height:22,cursor:'pointer',fontSize:12,display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
        </div>
      </div>

      {/* ── STEP 1: Request History / Home ── */}
      {requestStep === 1 && (
        <div style={{padding:'18px 20px'}}>

          {/* Action buttons row */}
          <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap',alignItems:'center'}}>
            <button onClick={()=>setRequestStep(2)}
              style={{background:'#1E3A78',color:'white',border:'none',padding:'7px 18px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:6,letterSpacing:'0.5px'}}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Submit New Request
            </button>
            <button onClick={loadRequestHistoryInline}
              style={{background:'#3A5A9A',color:'white',border:'none',padding:'7px 16px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:6}}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.18-4.5"/></svg>
              Refresh

            {financialReportsEnabled && (
            <span style={{marginLeft:'auto',background:'#2D6A4F',color:'white',fontSize:10,fontWeight:700,padding:'4px 12px',letterSpacing:'1px',borderRadius:2,display:'flex',alignItems:'center',gap:5}}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>

            </span>
            )}
            {selectedRequest && selectedRequest.status === 'Completed' && (
              <button
                onClick={async () => {
                  setSnapshotView({ loading: true, pos: [], requestId: selectedRequest.requestId });
                  setRequestStep(5);
                  if (selectedRequest.snapshotId) {
                    const frozen = await loadSnapshotReport(selectedRequest.snapshotId);
                    setSnapshotView({ loading: false, pos: frozen, requestId: selectedRequest.requestId });
                  } else {
                    setSnapshotView({ loading: false, pos: purchaseOrders, requestId: selectedRequest.requestId });
                  }
                }}
                style={{background:'#2D6A4F',color:'white',border:'none',padding:'7px 16px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:6}}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                View Output — #{selectedRequest.requestId}
              </button>
            )}
          </div>

          {/* Section header */}
          <div style={{background:'#1E3A78',color:'#DCE6F8',fontSize:11,fontWeight:700,padding:'5px 10px',marginBottom:10,letterSpacing:'1px',textTransform:'uppercase'}}>▶ My Request Summary</div>

          {/* Summary stats */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:14}}>
            {[
              {label:'Total',value:requestHistory.length,color:'#1E3A78'},
              {label:'Pending',value:requestHistory.filter(r=>r.status==='Pending').length,color:'#B8860B'},
              {label:'Completed',value:requestHistory.filter(r=>r.status==='Completed').length,color:'#2D6A4F'},
              {label:'Error',value:requestHistory.filter(r=>r.status==='Error').length,color:'#8B1A1A'},
            ].map(s=>(
              <div key={s.label} style={{background:'white',border:'1px solid #B0BAD0',padding:'10px 14px',textAlign:'center'}}>
                <div style={{fontSize:20,fontWeight:900,color:s.color}}>{s.value}</div>
                <div style={{fontSize:10,color:'#555',fontWeight:700,letterSpacing:'0.5px',textTransform:'uppercase'}}>{s.label}</div>
              </div>

          {/* Requests table */}
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>

                  {['Req ID','Report Name','Org','Parameters','Format','Status','Date','Action'].map(h=>(

              </thead>
              <tbody>
                {requestHistory.length === 0 && (

                )}
                {requestHistory.map((r,i) => {
                  const sc = {Pending:'#B8860B',Running:'#1E3A78',Completed:'#2D6A4F',Error:'#8B1A1A'};
                  const params = r.requestType === 'Purchase Order Report'
                    ? `PO: ${r.poFrom||'—'} → ${r.poTo||'—'}`
                    : r.requestType === 'Inventory Report'
                    ? `Cat: ${r.inventoryCategory||'All'} | Status: ${r.inventoryStatus||'All'}`
                    : r.requestType === 'Supplier Report'
                    ? `Code: ${r.supplierCode||'All'} | Status: ${r.supplierStatus||'All'}`
                    : r.requestType === 'Receiving Transaction Summary'
                    ? `Date: ${r.receiptDateFrom||'All'} → ${r.receiptDateTo||'All'} | PO: ${r.receiptPONumber||'All'}`
                    : r.requestType === 'Purchase Order Summary'
                    ? `Date: ${r.finDateFrom||'All'} → ${r.finDateTo||'All'} | Status: ${r.finStatusFilter||'All'}`
                    : r.requestType === 'Supplier Spend Analysis'
                    ? `Supplier: ${r.finSupplierFilter||'All'} | Period: ${r.finPeriod||'All Time'}`
                    : r.requestType === 'Budget Report'
                    ? `Dept: ${r.finDepartment||'All'} | Period: ${r.finFiscalPeriod||'Current'}`
                    : r.requestType === 'Payment Register'
                    ? `Date: ${r.finPayDateFrom||'All'} → ${r.finPayDateTo||'All'} | ${r.finPayStatus||'All'}`
                    : r.requestType === 'Invoice Aging Report'
                    ? `Bucket: ${r.finAgingBucket||'All'} | Supplier: ${r.finSupplierFilter||'All'}`
                    : '—';
                  const isSelected = selectedRequest?.id === r.id;
                  return (
                    <tr key={r.id}
                      onClick={async () => {
                        setSelectedRequest(r);
                        if (r.status === 'Completed' && r.snapshotId) {
                          setSnapshotView({ loading: true, pos: [], requestId: r.requestId });
                          const frozen = await loadSnapshotReport(r.snapshotId);
                          setSnapshotView({ loading: false, pos: frozen, requestId: r.requestId });
                        } else {
                          setSnapshotView({ loading: false, pos: [], requestId: r.requestId });
                        }
                      }}
                      style={{background: isSelected ? '#C8D8F0' : i%2===0?'white':'#EDF0F7', borderBottom:'1px solid #C0CAD8', cursor:'pointer', outline: isSelected ? '2px solid #1E3A78' : 'none'}}>
                      <td style={{padding:'5px 10px',fontWeight:700,color:'#1E3A78'}}>{isSelected ? '▶ ' : ''}#{r.requestId}</td>
                      <td style={{padding:'5px 10px',whiteSpace:'nowrap'}}>{r.requestType}</td>
                      <td style={{padding:'5px 10px',color:'#555'}}>{r.organization||'—'}</td>
                      <td style={{padding:'5px 10px',fontFamily:'monospace',fontSize:10,color:'#333'}}>{params}</td>
                      <td style={{padding:'5px 10px'}}>{r.outputFormat}</td>
                      <td style={{padding:'5px 10px'}}>
                        <span style={{background:sc[r.status]||'#555',color:'white',padding:'2px 7px',fontWeight:700,fontSize:10,letterSpacing:'0.4px',whiteSpace:'nowrap'}}>{r.status}</span>
                      </td>
                      <td style={{padding:'5px 10px',color:'#555',whiteSpace:'nowrap',fontSize:10}}>{r.createdAt?.toDate?r.createdAt.toDate().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):''}</td>
                      <td style={{padding:'5px 10px'}} onClick={e=>e.stopPropagation()}>
                        {r.status === 'Completed' && (
                          <button
                            onClick={async (e) => {
                              e.stopPropagation();
                              setSelectedRequest(r);
                              setSnapshotView({ loading: true, pos: [], requestId: r.requestId });
                              setRequestStep(5);
                              if (r.snapshotId) {
                                const frozen = await loadSnapshotReport(r.snapshotId);
                                setSnapshotView({ loading: false, pos: frozen, requestId: r.requestId });
                              } else {
                                setSnapshotView({ loading: false, pos: purchaseOrders, requestId: r.requestId });
                              }
                            }}
                            style={{background:'#1E3A78',color:'white',border:'none',padding:'4px 10px',fontSize:10,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:4,whiteSpace:'nowrap'}}>
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            View Output
                          </button>
                        )}
                        {r.status === 'Pending' && (
                          <span style={{color:'#B8860B',fontSize:10,fontWeight:700}}>⟳ Processing...</span>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* ── STEP 2: New Request Form ── */}
      {requestStep === 2 && (
        <div style={{padding:'18px 20px'}}>
          <div style={{background:'#1E3A78',color:'#DCE6F8',fontSize:11,fontWeight:700,padding:'5px 10px',marginBottom:16,letterSpacing:'1px',textTransform:'uppercase'}}>▶ New Request — Select Report & Parameters</div>

          {/* Report Type */}
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12,marginBottom:12}}>
            <tbody>
              <tr>
                <td style={{padding:'7px 12px',background:'#C8D0E4',border:'1px solid #8A9BB5',width:200,fontWeight:700,color:'#1A2340',fontSize:11}}>Report Type <span style={{color:'#8B1A1A'}}>*</span></td>
                <td style={{padding:'5px 8px',background:'white',border:'1px solid #8A9BB5'}}>
                  <select value={requestForm.requestType} onChange={e=>setRequestForm(p=>({...p,requestType:e.target.value}))}
                    style={{width:'100%',border:'none',outline:'none',fontSize:12,fontFamily:'inherit',background:'transparent',cursor:'pointer'}}>
                    <option value="">-- Select Report Type --</option>
                    <option value="Purchase Order Report">📄 Purchase Order Report</option>
                    <option value="Inventory Report">📦 Inventory Report</option>
                    <option value="Supplier Report">🏭 Supplier Report</option>
                    <option value="Receiving Transaction Summary">🚚 Receiving Transaction Summary</option>
                    {financialReportsEnabled && (
                    <optgroup label="── Financial Reports ──">
                      <option value="Purchase Order Summary">💰 Purchase Order Summary</option>
                      <option value="Supplier Spend Analysis">📊 Supplier Spend Analysis</option>
                      <option value="Budget Report">📋 Budget Report</option>
                      <option value="Payment Register">🧾 Payment Register</option>
                      <option value="Invoice Aging Report">📅 Invoice Aging Report</option>
                    </optgroup>
                    )}
                  </select>
                </td>
              </tr>
              <tr>
                <td style={{padding:'7px 12px',background:'#C8D0E4',border:'1px solid #8A9BB5',fontWeight:700,color:'#1A2340',fontSize:11}}>Organization</td>
                <td style={{padding:'5px 8px',background:'white',border:'1px solid #8A9BB5'}}>
                  <select value={requestForm.organization} onChange={e=>setRequestForm(p=>({...p,organization:e.target.value}))}
                    style={{width:'100%',border:'none',outline:'none',fontSize:12,fontFamily:'inherit',background:'transparent'}}>
                    <option value="">-- Select Organization --</option>
                    {organizations.map(o=><option key={o.id} value={o.id}>{o.name||o.companyName||o.id}</option>)}
                    <option value="__default__">Default Organization</option>
                  </select>
                </td>
              </tr>
            </tbody>
          </table>

          {/* Dynamic Parameters based on report type */}
          {requestForm.requestType && (
            <>
              <div style={{background:'#3A5A9A',color:'#DCE6F8',fontSize:11,fontWeight:700,padding:'5px 10px',marginBottom:10,letterSpacing:'1px',textTransform:'uppercase'}}>
                ▶ Parameters — {requestForm.requestType}
              </div>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:12,marginBottom:14}}>
                <tbody>
                  {requestForm.requestType === 'Purchase Order Report' && (<>
                    <tr>
                      <td style={{padding:'7px 12px',background:'#C8D0E4',border:'1px solid #8A9BB5',width:200,fontWeight:700,color:'#1A2340',fontSize:11}}>PO Number From</td>
                      <td style={{padding:'5px 8px',background:'white',border:'1px solid #8A9BB5'}}>
                        <input value={requestForm.poFrom} onChange={e=>setRequestForm(p=>({...p,poFrom:e.target.value}))}
                          placeholder="e.g. PO-2024-001  (leave blank = all POs)"
                          style={{width:'100%',border:'none',outline:'none',fontSize:12,fontFamily:'inherit',background:'transparent'}}/>
                      </td>
                    </tr>
                    <tr>
                      <td style={{padding:'7px 12px',background:'#C8D0E4',border:'1px solid #8A9BB5',fontWeight:700,color:'#1A2340',fontSize:11}}>PO Number To</td>
                      <td style={{padding:'5px 8px',background:'white',border:'1px solid #8A9BB5'}}>
                        <input value={requestForm.poTo} onChange={e=>setRequestForm(p=>({...p,poTo:e.target.value}))}
                          placeholder="Same as From = single PO report"
                          style={{width:'100%',border:'none',outline:'none',fontSize:12,fontFamily:'inherit',background:'transparent'}}/>
                      </td>
                    </tr>
                  </>)}

                  {requestForm.requestType === 'Inventory Report' && (<>
                    <tr>
                      <td style={{padding:'7px 12px',background:'#C8D0E4',border:'1px solid #8A9BB5',width:200,fontWeight:700,color:'#1A2340',fontSize:11}}>Category</td>
                      <td style={{padding:'5px 8px',background:'white',border:'1px solid #8A9BB5'}}>
                        <input value={requestForm.inventoryCategory} onChange={e=>setRequestForm(p=>({...p,inventoryCategory:e.target.value}))}
                          placeholder="e.g. Electronics, Office Supplies (blank = all)"
                          style={{width:'100%',border:'none',outline:'none',fontSize:12,fontFamily:'inherit',background:'transparent'}}/>
                      </td>
                    </tr>
                    <tr>
                      <td style={{padding:'7px 12px',background:'#C8D0E4',border:'1px solid #8A9BB5',fontWeight:700,color:'#1A2340',fontSize:11}}>Stock Status</td>
                      <td style={{padding:'5px 8px',background:'white',border:'1px solid #8A9BB5'}}>
                        <select value={requestForm.inventoryStatus} onChange={e=>setRequestForm(p=>({...p,inventoryStatus:e.target.value}))}
                          style={{width:'100%',border:'none',outline:'none',fontSize:12,fontFamily:'inherit',background:'transparent'}}>
                          <option value="">All Stock Levels</option>
                          <option value="low">Low Stock Only</option>
                          <option value="out">Out of Stock Only</option>
                          <option value="normal">Normal Stock</option>
                        </select>
                      </td>
                    </tr>
                  </>)}

                  {requestForm.requestType === 'Supplier Report' && (<>
                    <tr>
                      <td style={{padding:'7px 12px',background:'#C8D0E4',border:'1px solid #8A9BB5',width:200,fontWeight:700,color:'#1A2340',fontSize:11}}>Supplier Code</td>
                      <td style={{padding:'5px 8px',background:'white',border:'1px solid #8A9BB5'}}>
                        <input value={requestForm.supplierCode} onChange={e=>setRequestForm(p=>({...p,supplierCode:e.target.value}))}
                          placeholder="e.g. SUP-001 (blank = all suppliers)"
                          style={{width:'100%',border:'none',outline:'none',fontSize:12,fontFamily:'inherit',background:'transparent'}}/>
                      </td>
                    </tr>
                    <tr>
                      <td style={{padding:'7px 12px',background:'#C8D0E4',border:'1px solid #8A9BB5',fontWeight:700,color:'#1A2340',fontSize:11}}>Supplier Status</td>
                      <td style={{padding:'5px 8px',background:'white',border:'1px solid #8A9BB5'}}>
                        <select value={requestForm.supplierStatus} onChange={e=>setRequestForm(p=>({...p,supplierStatus:e.target.value}))}
                          style={{width:'100%',border:'none',outline:'none',fontSize:12,fontFamily:'inherit',background:'transparent'}}>
                          <option value="">All Statuses</option>
                          <option value="active">Active</option>
                          <option value="inactive">Inactive</option>
                          <option value="blacklisted">Blacklisted</option>
                        </select>
                      </td>
                    </tr>
                  </>)}

                  {requestForm.requestType === 'Receiving Transaction Summary' && (<>

                      <td style={{padding:'5px 8px',background:'white',border:'1px solid #8A9BB5'}}>

                      </td>
                    </tr>
                    <tr>
                      <td style={{padding:'7px 12px',background:'#C8D0E4',border:'1px solid #8A9BB5',fontWeight:700,color:'#1A2340',fontSize:11}}>Date To</td>
                      <td style={{padding:'5px 8px',background:'white',border:'1px solid #8A9BB5'}}>
                        <input type="date" value={requestForm.receiptDateTo} onChange={e=>setRequestForm(p=>({...p,receiptDateTo:e.target.value}))}
                          style={{width:'100%',border:'none',outline:'none',fontSize:12,fontFamily:'inherit',background:'transparent'}}/>

                    </tr>
                    <tr>
                      <td style={{padding:'7px 12px',background:'#C8D0E4',border:'1px solid #8A9BB5',fontWeight:700,color:'#1A2340',fontSize:11}}>PO Number Filter</td>
                      <td style={{padding:'5px 8px',background:'white',border:'1px solid #8A9BB5'}}>
                        <input value={requestForm.receiptPONumber} onChange={e=>setRequestForm(p=>({...p,receiptPONumber:e.target.value}))}
                          placeholder="e.g. PO-2025-001 (blank = all)"
                          style={{width:'100%',border:'none',outline:'none',fontSize:12,fontFamily:'inherit',background:'transparent'}}/>
                      </td>

                    <tr>
                      <td style={{padding:'7px 12px',background:'#C8D0E4',border:'1px solid #8A9BB5',width:200,fontWeight:700,color:'#1A2340',fontSize:11}}>Date From</td>

                          style={{width:'100%',border:'none',outline:'none',fontSize:12,fontFamily:'inherit',background:'transparent'}}/>
                      </td>
                    </tr>
                    <tr>
                      <td style={{padding:'7px 12px',background:'#C8D0E4',border:'1px solid #8A9BB5',fontWeight:700,color:'#1A2340',fontSize:11}}>Date To</td>
                      <td style={{padding:'5px 8px',background:'white',border:'1px solid #8A9BB5'}}>
                        <input type="date" value={requestForm.finDateTo||''} onChange={e=>setRequestForm(p=>({...p,finDateTo:e.target.value}))}
                          style={{width:'100%',border:'none',outline:'none',fontSize:12,fontFamily:'inherit',background:'transparent'}}/>
                      </td>
                    </tr>
                    <tr>
                      <td style={{padding:'7px 12px',background:'#C8D0E4',border:'1px solid #8A9BB5',fontWeight:700,color:'#1A2340',fontSize:11}}>Status Filter</td>
                      <td style={{padding:'5px 8px',background:'white',border:'1px solid #8A9BB5'}}>
                        <select value={requestForm.finStatusFilter||''} onChange={e=>setRequestForm(p=>({...p,finStatusFilter:e.target.value}))}
                          style={{width:'100%',border:'none',outline:'none',fontSize:12,fontFamily:'inherit',background:'transparent'}}>
                          <option value="">All Statuses</option>
                          <option value="approved">Approved</option>
                          <option value="pending_approval">Pending Approval</option>
                          <option value="received">Received</option>
                          <option value="closed">Closed</option>
                        </select>
                      </td>
                    </tr>
                  </>)}

                  {requestForm.requestType === 'Supplier Spend Analysis' && (<>
                    <tr>
                      <td style={{padding:'7px 12px',background:'#C8D0E4',border:'1px solid #8A9BB5',width:200,fontWeight:700,color:'#1A2340',fontSize:11}}>Supplier Name / Code</td>
                      <td style={{padding:'5px 8px',background:'white',border:'1px solid #8A9BB5'}}>
