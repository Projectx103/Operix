  const delItem=idx=>setItems(prev=>prev.filter((_,i)=>i!==idx));
  const canProceed=()=>{if(step===1)return!!supplier;if(step===2)return items.length>0;if(step===3)return!!delivDate;return true;};
  const stockBadge=p=>{if(p.stock===0)return React.createElement('span',{className:'status-badge stock-out'},'Out of Stock');if(p.stock<=p.threshold)return React.createElement('span',{className:'status-badge stock-low'},'Low Stock');return React.createElement('span',{className:'status-badge stock-ok'},'In Stock');};

  /* ── Reserve the next PO number from series (called only when creating/saving) ── */
  const reservePoNumber=async()=>{
    if(poNumberReserved&&poNumber)return poNumber;
    const db=dbRef.current;
    const uid=adminRef.current;
    const {seriesData,seriesOwnerUid,companyAdminIds,myCompany}=agRef.current;

    // ── If a series was pre-loaded at init, use it ──
    if(seriesData){
      try{
        const rawSeries=seriesData.seriesStart||'1';
        const padLen=rawSeries.length;
        const seriesStart=BigInt(rawSeries);

        // Always re-fetch the latest counter from Firestore to avoid stale state
        const freshDoc=await db.collection('poNumberSeries').doc(seriesOwnerUid).get();
        const freshCounter=freshDoc.exists&&freshDoc.data().currentCounter
          ?BigInt(freshDoc.data().currentCounter)
          :seriesStart-BigInt(1);
        let candidate=freshCounter>=seriesStart?freshCounter+BigInt(1):seriesStart;

        // Collect ALL used PO numbers across every company admin to avoid collisions
        const allUids=(companyAdminIds&&companyAdminIds.length>0)?companyAdminIds:[uid];
        let allUsedNums=new Set();
        for(let i=0;i<allUids.length;i+=30){
          const chunk=allUids.slice(i,i+30);
          const snap=await db.collection('purchaseOrders').where('createdBy','in',chunk).get();
          snap.docs.forEach(d=>{if(d.data().poNumber)allUsedNums.add(d.data().poNumber);});
        }

        // Find next number not already in use
        let pn=candidate.toString().padStart(padLen,'0');
        while(allUsedNums.has(pn)){candidate+=BigInt(1);pn=candidate.toString().padStart(padLen,'0');}

        // Write counter back to the series owner's doc
        // Uses a Firestore transaction-style set to avoid race conditions
        await db.collection('poNumberSeries').doc(seriesOwnerUid).update({
          currentCounter:candidate.toString(),
          lastUsedBy:uid,
          lastUsedAt:firebase.firestore.FieldValue.serverTimestamp()
        });
        setPoNumber(pn);setPoNumberReserved(true);
        return pn;
      }catch(e){
        console.warn('Series-based PO number failed:',e.message);
        // Fall through to date-based fallback below
      }
    }

    // ── No series configured — date-based fallback ──
    const ts=new Date();
    const pn='PO-'+ts.getFullYear()+String(ts.getMonth()+1).padStart(2,'0')+String(ts.getDate()).padStart(2,'0')+'-'+Math.floor(Math.random()*9000+1000);
    setPoNumber(pn);setPoNumberReserved(true);
    return pn;
  };

  /* ── Build a human-readable change summary by diffing original vs new values ── */
  const buildChangeSummary=(orig,newData)=>{
    if(!orig)return null;
    const changes=[];
    const fmt=(v)=>v==null||v===''?'(none)':String(v);
    const fmtMoney=(v)=>v==null?'(none)':`₱${parseFloat(v).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}`;

    if(orig.supplierName!==newData.supplierName)
      changes.push(`Supplier changed from "${orig.supplierName}" to "${newData.supplierName}"`);
    if(orig.currency!==newData.currency)
      changes.push(`Currency changed from ${orig.currency} to ${newData.currency}`);
    if(orig.paymentTerms!==newData.paymentTerms)
      changes.push(`Payment Terms changed from "${orig.paymentTerms}" to "${newData.paymentTerms}"`);
    if(orig.priority!==newData.priority)
      changes.push(`Priority changed from ${orig.priority} to ${newData.priority}`);
    if(orig.supplierRef!==newData.supplierRef)
      changes.push(`Supplier Reference changed from "${fmt(orig.supplierRef)}" to "${fmt(newData.supplierRef)}"`);
    if(String(orig.discount)!==String(newData.discount))
      changes.push(`Discount changed from ${fmtMoney(orig.discount)} to ${fmtMoney(newData.discount)}`);
    if(String(orig.shipping)!==String(newData.shipping))
      changes.push(`Shipping Cost changed from ${fmtMoney(orig.shipping)} to ${fmtMoney(newData.shipping)}`);
    if(String(orig.taxRate)!==String(newData.taxRate))
      changes.push(`Tax Rate changed from ${orig.taxRate}% to ${newData.taxRate}%`);
    if(orig.deliveryAddress!==newData.deliveryAddress)
      changes.push(`Delivery Address changed`);
    if(orig.expectedDeliveryDate!==newData.expectedDeliveryDate)
      changes.push(`Expected Delivery Date changed from "${fmt(orig.expectedDeliveryDate)}" to "${fmt(newData.expectedDeliveryDate)}"`);
    if(orig.deliveryNotes!==newData.deliveryNotes)
      changes.push(`Delivery Notes updated`);
    if(orig.internalNotes!==newData.internalNotes)
      changes.push(`Internal Notes updated`);
    // Grand total change
    if(Math.abs((orig.grandTotal||0)-(newData.grandTotal||0))>0.01)
      changes.push(`Grand Total changed from ${fmtMoney(orig.grandTotal)} to ${fmtMoney(newData.grandTotal)}`);
    // Line items diff
    const origItems=orig.items||[];
    const newItems=newData.items||[];
    // Removed items
    origItems.forEach(oi=>{
      const found=newItems.find(ni=>ni.productId===oi.productId);
      if(!found)changes.push(`Item removed: "${oi.productName}"`);
    });
    // Added items
    newItems.forEach(ni=>{
      const found=origItems.find(oi=>oi.productId===ni.productId);
      if(!found)changes.push(`Item added: "${ni.productName}" x${ni.qty} @ ${fmtMoney(ni.unitCost)}`);
    });
    // Changed items
    newItems.forEach(ni=>{
      const oi=origItems.find(o=>o.productId===ni.productId);
      if(!oi)return;
      const itemChanges=[];
      if(oi.qty!==ni.qty)itemChanges.push(`qty ${oi.qty} → ${ni.qty}`);
      if(Math.abs((oi.unitCost||0)-(ni.unitCost||0))>0.001)itemChanges.push(`unit cost ${fmtMoney(oi.unitCost)} → ${fmtMoney(ni.unitCost)}`);
      if(itemChanges.length>0)changes.push(`"${ni.productName}" changed: ${itemChanges.join(', ')}`);
    });
    return changes.length>0?changes.join('\n'):null;
  };

  /* ── Find matching approval group and first approver for a given PO amount ── */
  const resolveApprover=(amount)=>{
    const {agList,companyAdmins,myRoleName,myRoleId}=agRef.current;

    // Role authority order — higher index = higher authority
    const ROLE_RANK={viewer:0,purchaser:1,supervisor:2,finance_manager:3,admin_approver:4};
    const getRank=(roleId)=>{
      if(!roleId)return 0;
      const norm=roleId.toLowerCase().replace(/ /g,'_');
      return ROLE_RANK[norm]??0;
    };
    const myRank=getRank(myRoleId||myRoleName);

    if(!agList.length){return null;}

    // Find the group whose amount range covers this PO
    const match=agList.find(g=>{
      const min=parseFloat(g.minAmount)||0;
      const max=g.maxAmount?parseFloat(g.maxAmount):Infinity;
      return amount>=min&&amount<=max;
    });
    if(!match||!match.steps?.length){return null;}

    // ── Key rule: if the submitter's role is AT OR ABOVE every step in the chain,
    //    they are already the top authority — no further approval needed.
    const stepsAboveMe=match.steps.filter(s=>{
      if(!s.approverRole)return false;
      const stepRank=getRank(s.approverRole);
      return stepRank>myRank; // only steps held by someone MORE senior than me
    });
    if(stepsAboveMe.length===0){
      // Every step in the chain is at or below my authority level — auto-approved
      console.log('✅ Submitter role "'+myRoleName+'" (rank '+myRank+') is at or above all approval steps — no approval required');
      return null;
    }

    // Walk steps in order — skip any step at or below my authority level
    for(let i=0;i<match.steps.length;i++){
      const stepDef=match.steps[i];
      const roleName=stepDef.approverRole;
      if(!roleName)continue;

      const stepRank=getRank(roleName);
      // Skip this step if the submitter is at the same or higher rank
      if(stepRank<=myRank){
        console.log('  Step',i+1,'role "'+roleName+'" (rank '+stepRank+') <= submitter rank ('+myRank+') — skipping');
        continue;
      }

      // Find an admin in the same company with this role who is not the submitter
      const approver=companyAdmins.find(a=>{
        const nameMatch=a.assignedRoleName===roleName;
        const idMatch=a.assignedRole&&roleName&&a.assignedRole.toLowerCase()===roleName.toLowerCase().replace(/ /g,'_');
        const notSelf=a.id!==adminRef.current;
        return (nameMatch||idMatch)&&notSelf;
      });

      if(approver){
        console.log('✅ Routed to step',i+1,':',approver.fullName,'| role:',roleName);
        return{approverId:approver.id,approverName:approver.fullName,approverRole:roleName,groupId:match.id,groupName:match.name,stepIndex:i,totalSteps:match.steps.length};
      }else{
        console.warn('  No admin with role "'+roleName+'" found — trying next step');
      }
    }

    // All steps above me have no one assigned — no approval needed
    console.warn('No eligible approver found above submitter rank — submitting without routing');
    return null;
  };

  const submitPO=async(asDraft=false)=>{
    // ── GL Period gate: block actual submission (not drafts) if no open period covers today ──
    if(!asDraft&&!activeGlPeriod){
      toast('⛔ GL Period is not open for today. Open the current period in Accounting Setup before submitting a PO.','err');
      return;
    }
    setSubmitting(true);
    try{
      const db=dbRef.current;
      // Reserve PO number only at save/submit time (not on page load)
      const pn=await reservePoNumber();
      // Resolve approval routing (only for submitted POs, not drafts)
      let approvalFields={};
      let finalStatus=asDraft?'draft':'submitted';
      if(!asDraft){
        const route=resolveApprover(grand);
        if(route){
          approvalFields={
            approvalStatus:'pending_approval',
            assignedApproverId:route.approverId,
            assignedApproverName:route.approverName,
            assignedApproverRole:route.approverRole,
            approvalGroupId:route.groupId,
            approvalGroupName:route.groupName,
            approvalStepIndex:route.stepIndex,
            approvalTotalSteps:route.totalSteps,
          };
          await db.collection('notifications').add({
            type:'po_approval_request',
            message:`PO ${pn} (${sym(currency)}${grand.toFixed(2)}) requires your approval`,
            details:{poNumber:pn,supplierName:supplier.name,grandTotal:grand,currency,submittedBy:adminUser?.fullName||''},
            timestamp:firebase.firestore.FieldValue.serverTimestamp(),
            read:false,
            userId:route.approverId,
            userRole:'admin'
          });
        } else {
          // Submitter is top authority — no approval needed, mark as approved immediately
          approvalFields={
            approvalStatus:'no_approval_required',
            approvedAt:firebase.firestore.FieldValue.serverTimestamp(),
            approvedBy:adminUser?.fullName||'',
          };
          finalStatus='approved';
        }
      }
      const poData={
        poNumber:pn,
        status:finalStatus,
        supplierId:supplier.id,supplierName:supplier.name,supplierEmail:supplier.email||'',
        supplierTaxId:supplier.taxId||supplier.vatNumber||'',vatNumber:vatInfo?.number||'',
        supplierRef:suppRef,currency,paymentTerms:payTerms,priority,
        items:items.map(it=>{
          const lc=lineCalc(it);
          return{
            productId:it.product.id,productName:it.product.name,sku:it.product.sku||'',
            unit:it.product.unit||it.product.uom||'',quantity:it.qty,unitCost:it.unitCost,
            netAmount:parseFloat(lc.net.toFixed(4)),
            vatCode:vatInfo?.code||'',vatAmount:parseFloat(lc.vatAmt.toFixed(4)),
            lineTotal:parseFloat(lc.gross.toFixed(4)),
            notes:it.notes||''
          };
        }),
        subtotal,discount:discAmt,shipping:shipAmt,
        taxRate:parseFloat(taxRate)||0,tax:parseFloat(taxAmt.toFixed(4)),grandTotal:parseFloat(grand.toFixed(4)),
        // taxInfo.rate saved as decimal (0.12) to match supplier-setup.html taxInfo format
        taxInfo:vatInfo?{code:vatInfo.code,rate:vatInfo.rate/100,type:vatInfo.type,treatment:vatInfo.treatment}:null,
        vatCode:vatInfo?.code||'',vatTreatment:vatInfo?.treatment||'exclusive',
        deliveryAddress:delivAddr,expectedDeliveryDate:delivDate,deliveryNotes:delivNotes,internalNotes:intNotes,
        fromAlert:lockedMode,createdBy:adminRef.current,createdByName:adminUser?.fullName||'',
        updatedAt:firebase.firestore.FieldValue.serverTimestamp(),revision:0,
        ...approvalFields,
      };
      if(draftPoId){
        // Resume: update the existing draft doc
        // Detect mode: 'revise' (from Revise PO button) vs normal resubmit (from Edit & Resubmit)
        const urlMode=new URLSearchParams(window.location.search).get('mode');
        const isReviseMode=urlMode==='revise';

        // Build change summary by diffing original vs new values
        const changeSummary=!asDraft?buildChangeSummary(originalDraftRef.current,{
          supplierName:supplier?.name||'',supplierRef:suppRef,currency,
          paymentTerms:payTerms,priority,discount:discAmt,shipping:shipAmt,
          taxRate:parseFloat(taxRate)||0,deliveryAddress:delivAddr,
          expectedDeliveryDate:delivDate,deliveryNotes:delivNotes,
          internalNotes:intNotes,grandTotal:grand,
          items:items.map(it=>({productId:it.product.id,productName:it.product.name,sku:it.product.sku||'',unit:it.product.unit||it.product.uom||'',qty:it.qty,unitCost:it.unitCost})),
        }):null;

        // Build history entry
        const historyEntry=!asDraft?{
          action:isReviseMode?'revised':'resubmitted',
          by:adminUser?.fullName||adminUser?.email||'',
          byId:adminRef.current,
          at:new Date().toISOString(),
          ...(changeSummary?{reason:'Changes made:\n'+changeSummary}:{}),
        }:null;

        const extraFields={};
        if(historyEntry){
          extraFields.approvalHistory=firebase.firestore.FieldValue.arrayUnion(historyEntry);
          if(isReviseMode){
            // Increment revision number
            extraFields.revision=(poData.revision||0)+1;
            extraFields.revisionNotes=changeSummary||'No changes declared';
            extraFields.revisedAt=firebase.firestore.FieldValue.serverTimestamp();
            extraFields.revisedBy=adminUser?.fullName||'';
          }
        }

        await db.collection('purchaseOrders').doc(draftPoId).update({
          ...poData,
          ...extraFields,
          updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
        });
      }else{
        // New PO
        poData.createdAt=firebase.firestore.FieldValue.serverTimestamp();
        await db.collection('purchaseOrders').add(poData);
      }
      const routeMsg=approvalFields.assignedApproverName?` — routed to ${approvalFields.assignedApproverName} for approval`:'';
      toast(asDraft?'Draft saved — PO #'+pn:`Purchase Order #${pn} submitted${routeMsg}!`,'ok');
      setTimeout(()=>window.location.href='Dashboard.html',1800);
    }catch(e){toast(e.message,'err');}
    setSubmitting(false);
  };

  if(loading)return(
    <div className="full-center">
      <div style={{width:44,height:44,borderRadius:12,background:'linear-gradient(135deg,#1A56DB,#1E40AF)',display:'flex',alignItems:'center',justifyContent:'center'}}>
        <Ico d={I.doc} size={22} color="#fff"/>
      </div>
      <div className="spinner"/>
      <p style={{color:'var(--muted)',fontSize:12,fontWeight:600}}>Loading PO Creator...</p>
    </div>
  );

  return (
    <div style={{minHeight:'100vh',background:'var(--bg)'}}>
      {/* TOPBAR */}
      <div className="topbar">
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <svg width="26" height="26" viewBox="0 0 40 40"><rect width="40" height="40" rx="7" fill="#1B2A8A"/><path d="M20 10C25 10 28 13 28 18C28 23 25 26 20 26C15 26 12 23 12 18C12 13 15 10 20 10ZM20 14C17 14 16 15.5 16 18C16 20.5 17 22 20 22C23 22 24 20.5 24 18C24 15.5 23 14 20 14Z" fill="white"/><rect x="18" y="26" width="4" height="4" fill="white"/></svg>
          <span style={{fontSize:15,fontWeight:800,color:'#fff',letterSpacing:'-.3px'}}>Operix</span>
          <span className="topbar-tag">Purchase Order</span>
          {lockedMode&&<span style={{fontSize:10,fontWeight:700,color:'#FCD34D',background:'rgba(252,211,77,.15)',border:'1px solid rgba(252,211,77,.3)',padding:'2px 8px',borderRadius:4}}>ALERT-DRIVEN</span>}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <span className="mono" style={{fontSize:12,color:'#60A5FA',fontWeight:600}}>{poNumber || '— pending —'}</span>
          {poNumber && <span style={{fontSize:9,fontWeight:700,color:'#34D399',background:'rgba(52,211,153,.15)',border:'1px solid rgba(52,211,153,.3)',padding:'1px 6px',borderRadius:3}}>{resumingDraft?'DRAFT':'AUTO'}</span>}
          <span style={{width:1,height:18,background:'rgba(255,255,255,.15)',display:'inline-block'}}/>
          <span style={{fontSize:11,color:'#94A3B8',fontWeight:500}}>{adminUser?.fullName}</span>
          <button onClick={()=>window.location.href='Dashboard.html'} style={{display:'flex',alignItems:'center',gap:6,padding:'6px 12px',background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.12)',borderRadius:7,color:'#CBD5E1',fontSize:11,fontWeight:600,cursor:'pointer',fontFamily:'Plus Jakarta Sans,sans-serif'}}>
            <Ico d={I.back} size={12}/> Dashboard
          </button>
        </div>
      </div>

      {/* STEPBAR */}
      <div className="stepbar">
        {STEPS.map((s,idx)=>(
          <React.Fragment key={s.id}>
            {idx>0&&<div className="step-div"/>}
            <div className={`step ${step===s.id?'active':''} ${step>s.id?'done':''}`} onClick={()=>step>s.id&&setStep(s.id)}>
              <div className="step-num">{step>s.id?<Ico d={I.check} size={11} sw={2.5}/>:s.id}</div>
              <span className="step-label">{s.label}</span>
            </div>
          </React.Fragment>
        ))}
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8,paddingRight:8}}>
          {priority==='urgent'&&<span style={{fontSize:10,fontWeight:800,color:'#DC2626',background:'#FEF2F2',border:'1px solid #FECACA',padding:'2px 8px',borderRadius:4}}>URGENT</span>}
          <span style={{fontSize:11,color:'var(--muted)',fontWeight:500}}>{items.length} item{items.length!==1?'s':''} · {sym(currency)}{grand.toFixed(2)}</span>
        </div>
      </div>

      <div className="layout">
        <div className="panel-main">

          {/* Resume Draft Banner */}
          {resumingDraft&&(()=>{
            const isRevise=new URLSearchParams(window.location.search).get('mode')==='revise';
            return(
            <div style={{display:'flex',alignItems:'center',gap:12,padding:'10px 16px',background:isRevise?'#FAF5FF':'#FFFBEB',border:`1.5px solid ${isRevise?'#E9D5FF':'#FDE68A'}`,borderRadius:10,marginBottom:16}}>
              <Ico d={I.draft} size={16} color={isRevise?'#7E22CE':'#D97706'}/>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:800,color:isRevise?'#6B21A8':'#92400E'}}>{isRevise?'Revising PO':'Resuming Draft PO'} {poNumber}</div>
                <div style={{fontSize:11,color:isRevise?'#7E22CE':'#B45309',marginTop:1}}>
                  {isRevise
                    ?'Make your changes below. A full change summary will be automatically generated and included in the approval history when you resubmit.'
                    :'All your previous selections have been restored. Continue editing and submit when ready.'}
                </div>
              </div>
              <span style={{fontSize:10,fontWeight:700,color:'#fff',background:isRevise?'#7E22CE':'#D97706',padding:'2px 8px',borderRadius:4}}>{isRevise?'REVISING':'DRAFT'}</span>
            </div>
            );
          })()}

          {/* STEP 1 - SUPPLIER */}
          {step===1&&(
            <div style={{maxWidth:720}}>
              <div style={{marginBottom:20}}>
                <div style={{fontSize:18,fontWeight:900,color:'var(--ink)',letterSpacing:'-.3px',marginBottom:4}}>Select Supplier</div>
                <div style={{fontSize:12,color:'var(--muted)'}}>{supplierLocked?'Supplier is pre-assigned from the stock alert. VAT and payment terms load from the supplier record.':'Search by name, category, or email. VAT rate auto-loads from the supplier record.'}</div>
              </div>
              {lockedMode&&<div className="locked-banner"><Ico d={I.lock} size={16} color="#92400E"/>Alert-driven PO — supplier is pre-assigned. Unit costs come from your inventory records and are locked. <strong>Quantities are fully editable.</strong> You can still add extra items from the same supplier.</div>}
              <div className="card" style={{position:'relative',zIndex:10}}>
                <div className="card-hd">
                  <div className="card-hd-icon" style={{background:'var(--blue-l)',color:'var(--blue)'}}><Ico d={I.supplier} size={15}/></div>
                  <div><div className="card-hd-title">Supplier</div><div className="card-hd-sub">Vendor for this purchase order</div></div>
                </div>
                <div className="card-body">
                  {supplier?(
                    <div className={supplierLocked?'supp-chip-locked':'supp-chip'}>
                      <div className="supp-chip-icon">{supplier.name?.[0]||'S'}</div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:13,fontWeight:700,color:supplierLocked?'var(--ink3)':'var(--blue2)'}}>{supplier.name}</div>
                        <div style={{fontSize:11,color:'var(--muted)',marginTop:1}}>{supplier.email}{supplier.category?` · ${supplier.category}`:''}</div>
                      </div>
                      {supplierLocked?<Ico d={I.lock} size={14} color="var(--muted)"/>:<button className="chip-remove" onClick={()=>{setSupplier(null);setVatInfo(null);setTaxRate('12');setDiscount('');}}><Ico d={I.x} size={14}/></button>}
                    </div>
                  ):(
                    <div className="search-box" ref={suppDropRef} style={{position:'relative',zIndex:999}}>
                      <span className="s-icon"><Ico d={I.search} size={14}/></span>
                      <input className="input s-input" placeholder="Search suppliers by name, email, or category..." value={suppQ} onChange={e=>{setSuppQ(e.target.value);setSuppOpen(true);}} onFocus={()=>setSuppOpen(true)}/>
                      {suppOpen&&(
                        <div className="dropdown">
                          {filtSupp.length===0?<div className="d-empty">No suppliers found</div>:filtSupp.map(s=>(
                            <div key={s.id} className="d-item" onClick={async()=>{setSupplier(s);setCurrency(s.currency||'PHP');setPayTerms(s.paymentTerms||'Net 30');setSuppQ('');setSuppOpen(false);await loadVAT(s);}}>
                              <div className="d-item-name">{hl(s.name,suppQ)}</div>
                              <div className="d-item-sub">{s.email}{s.category?` · ${s.category}`:''}{s.taxExempt?' · Tax Exempt':s.taxRate?` · VAT ${s.taxRate}%`:''}</div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                  {vatInfo&&(
                    <div className="vat-strip">
                      {vatInfo.exempt
                        ?<><span className="vat-tag" style={{color:'#6B7280',background:'#F3F4F6'}}>TAX EXEMPT</span><span style={{fontSize:12,color:'#6B7280',fontWeight:600}}>VAT set to 0%</span></>
                        :<><span className="vat-tag" style={{background:vatInfo.treatment==='inclusive'?'#DBEAFE':'#D1FAE5',color:vatInfo.treatment==='inclusive'?'#1D4ED8':'var(--green)'}}>{vatInfo.code||`VAT${vatInfo.rate}%`}</span><span style={{fontSize:11,color:'var(--ink3)',fontWeight:700}}>{vatInfo.codeLabel}</span><span style={{fontSize:11,color:'var(--muted)',marginLeft:'auto'}}>Auto-loaded from supplier</span></>}
                    </div>
                  )}
                </div>
              </div>
              <div className="card">
                <div className="card-hd">
                  <div className="card-hd-icon" style={{background:'var(--purple-l)',color:'var(--purple)'}}><Ico d={I.tag} size={15}/></div>
                  <div><div className="card-hd-title">Order Details</div><div className="card-hd-sub">PO number, currency, payment terms</div></div>
                </div>
                <div className="card-body">
                  <div className="grid3" style={{marginBottom:14}}>
                    <div className="fg" style={{marginBottom:0}}>
                      <label className="label-locked">PO Number</label>
                      <div className="locked-field mono">
                        <Ico d={I.lock} size={13} color="var(--muted)"/>
                        {poNumber
                          ? <span style={{fontWeight:700,color:'var(--ink)'}}>{poNumber}</span>
                          : <span style={{color:'var(--muted2)',fontWeight:400,fontStyle:'italic'}}>Assigned when saved</span>}
                      </div>
                      <div style={{fontSize:10,color:'var(--muted2)',marginTop:4}}>{poNumber?'Auto-assigned from PO series':'Will be set when you save or submit'}</div>
                    </div>
                    <div className="fg" style={{marginBottom:0}}>
                      <label className="label-locked">Currency</label>
                      {supplier ? (
                        <div className="locked-field">
                          <Ico d={I.lock} size={13} color="var(--muted)"/>
                          <span style={{fontWeight:700,color:'var(--ink)'}}>{currency}</span>
                          <span style={{fontSize:10,color:'var(--muted)',marginLeft:4}}>from supplier</span>
                        </div>
                      ) : (
                        <div className="locked-field" style={{opacity:0.5}}>
                          <Ico d={I.lock} size={13} color="var(--muted)"/>
                          <span style={{color:'var(--muted2)',fontWeight:400}}>Select supplier first</span>
                        </div>
                      )}
                      <div style={{fontSize:10,color:'var(--muted2)',marginTop:4}}>Locked to supplier currency</div>
                    </div>
                    <div className="fg" style={{marginBottom:0}}><label className="label">Priority</label><select className="select" value={priority} onChange={e=>setPriority(e.target.value)}><option value="low">Low</option><option value="normal">Normal</option><option value="high">High</option><option value="urgent">🔴 Urgent</option></select></div>
                  </div>
                  <div className="grid2">
                    <div className="fg" style={{marginBottom:0}}>
                      <label className="label-locked">Payment Terms</label>
                      {supplier ? (
                        <div className="locked-field">
                          <Ico d={I.lock} size={13} color="var(--muted)"/>
                          <span style={{fontWeight:700,color:'var(--ink)'}}>{payTerms}</span>
                          <span style={{fontSize:10,color:'var(--muted)',marginLeft:4}}>from supplier</span>
                        </div>
                      ) : (
                        <div className="locked-field" style={{opacity:0.5}}>
                          <Ico d={I.lock} size={13} color="var(--muted)"/>
                          <span style={{color:'var(--muted2)',fontWeight:400}}>Select supplier first</span>
                        </div>
                      )}
                      <div style={{fontSize:10,color:'var(--muted2)',marginTop:4}}>Locked to supplier payment terms</div>
                    </div>
                    <div className="fg" style={{marginBottom:0}}><label className="label">Supplier Quote / Ref #</label><input className="input mono" placeholder="e.g. QT-2024-0891" value={suppRef} onChange={e=>setSuppRef(e.target.value)}/></div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* STEP 2 - LINE ITEMS */}
          {step===2&&(
            <div>
              <div style={{marginBottom:20}}>
                <div style={{fontSize:18,fontWeight:900,color:'var(--ink)',letterSpacing:'-.3px',marginBottom:4}}>Line Items</div>
                <div style={{fontSize:12,color:'var(--muted)'}}>{lockedMode?'Pre-filled items from stock alert — unit cost is locked from inventory, but you can freely adjust the quantity. Add more items from this supplier using search.':'Search products by name or SKU. Qty and unit cost are fully editable.'}</div>
              </div>
              {lockedMode&&lockedItemIds.length>0&&(
                <div className="locked-banner" style={{marginBottom:16}}>
                  <Ico d={I.lock} size={16} color="#92400E"/>
                  <span>
                    <strong>{lockedItemIds.length} alert item{lockedItemIds.length>1?'s':''}</strong> — unit cost is locked from inventory. <strong>You can freely edit quantities.</strong>
                    {supplier&&<> Add more items by searching {supplier.name} products below.</>}
                  </span>
                </div>
              )}
              <div className="card">
                <div className="card-hd">
                  <div className="card-hd-icon" style={{background:'#F0FDF4',color:'var(--green)'}}><Ico d={I.search} size={15}/></div>
                  <div><div className="card-hd-title">Add Items</div><div className="card-hd-sub">Search by product name or SKU</div></div>
                </div>
                <div className="card-body">
                  <div style={{display:'flex',gap:10,marginBottom:14}}>
                    <div className="search-box" ref={prodDropRef} style={{flex:1}}>
                      <span className="s-icon"><Ico d={I.search} size={14}/></span>
                      <input className="input s-input" placeholder={lockedMode&&supplier?`Search ${supplier.name} items only...`:"Search by product name or SKU..."} value={productQ} onChange={e=>{setProductQ(e.target.value);setProductOpen(true);}} onFocus={()=>setProductOpen(true)}/>
                      {productOpen&&productQ&&(
                        <div className="dropdown">
                          {filtProd.length===0?<div className="d-empty">{lockedMode&&supplier?`No products linked to ${supplier.name} match "${productQ}" — only items for this supplier can be added to this PO`:`No products found matching "${productQ}"`}</div>:filtProd.slice(0,12).map(p=>(
                            <div key={p.id} className="d-item" onClick={()=>addItem(p)}>
                              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
                                <div><div className="d-item-name">{hl(p.name,productQ)}</div><div className="d-item-sub mono">{hl(p.sku||'No SKU',productQ)}{p.category?` · ${p.category}`:''}</div></div>
                                <div style={{textAlign:'right',flexShrink:0}}>{stockBadge(p)}<div style={{fontSize:11,color:'var(--muted)',marginTop:3,fontFamily:'JetBrains Mono',fontWeight:600}}>{sym(currency)}{(p.price||p.cost||0).toFixed(2)}</div></div>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                  {items.length===0?(
                    <div className="empty-items"><div className="empty-items-icon">📦</div><div className="empty-items-title">No items added</div><div style={{fontSize:12,color:'var(--muted)'}}>Search for a product above</div></div>
                  ):(
                    <div style={{overflowX:'auto'}}>
                      <table className="tbl">
                        <thead>
                          <tr>
                            <th>Product</th><th>SKU</th><th>Stock</th><th>Qty</th>
                            <th>Unit Cost ({sym(currency)}){vatInfo&&vatInfo.treatment==='inclusive'&&<span style={{fontSize:9,fontWeight:600,color:'var(--muted)',marginLeft:4,background:'#DBEAFE',color:'#1D4ED8',padding:'1px 5px',borderRadius:3}}>incl. VAT</span>}</th>
                            <th>Line Total</th>
                            {vatInfo&&!vatInfo.exempt&&<th style={{whiteSpace:'nowrap',color:'var(--blue2)'}}>VAT Code</th>}
                            {vatInfo&&!vatInfo.exempt&&<th style={{whiteSpace:'nowrap',color:'var(--blue2)'}}>VAT Amt</th>}
                            <th>Notes</th><th></th>
                          </tr>
                        </thead>
                        <tbody>
                          {items.map((it,idx)=>{
                            const isCostLocked=it.costLocked||lockedItemIds.includes(it.product.id);
                            const lc=lineCalc(it);
                            return(
                              <tr key={idx} style={isCostLocked?{background:'#FAFBFF'}:{}}>
                                <td>
                                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                                    {isCostLocked&&<Ico d={I.lock} size={11} color="var(--muted2)"/>}
                                    <div><div style={{fontWeight:700,color:'var(--ink)',fontSize:12}}>{it.product.name}</div>{it.product.category&&<div style={{fontSize:10,color:'var(--muted)',marginTop:1}}>{it.product.category}</div>}</div>
                                  </div>
                                </td>
                                <td><span className="mono" style={{fontSize:11,color:'var(--ink3)',background:'var(--line2)',padding:'2px 6px',borderRadius:4}}>{it.product.sku||'—'}</span></td>
                                <td>{stockBadge(it.product)}</td>
                                <td><input type="number" min="1" className="qty-in" value={it.qty} onChange={e=>updItem(idx,'qty',Math.max(1,parseInt(e.target.value)||1))}/></td>
                                <td>
                                  {isCostLocked?(
                                    <div style={{fontFamily:'JetBrains Mono',fontSize:12,fontWeight:700,color:'var(--ink3)'}}>
                                      <div style={{display:'flex',alignItems:'center',gap:4}}>
                                        <Ico d={I.lock} size={10} color="var(--muted2)"/>{sym(currency)}{it.unitCost.toFixed(2)}
                                      </div>
                                      {vatInfo&&vatInfo.treatment==='inclusive'&&it.unitCost>0&&(
                                        <div style={{fontSize:9,color:'#1D4ED8',marginTop:1,fontFamily:'JetBrains Mono'}}>net: {sym(currency)}{(it.unitCost/(1+vatInfo.rate/100)).toFixed(2)}</div>
                                      )}
                                    </div>
                                  ):(
                                    <div>
                                      <div style={{position:'relative'}}>
                                        <span style={{position:'absolute',left:8,top:'50%',transform:'translateY(-50%)',fontSize:11,color:'var(--muted)',fontWeight:600}}>{sym(currency)}</span>
                                        <input type="number" min="0" step="0.01" value={it.unitCost} onChange={e=>updItem(idx,'unitCost',parseFloat(e.target.value)||0)} style={{width:100,padding:'5px 8px',paddingLeft:sym(currency).length>1?24:18,border:'1.5px solid var(--line)',borderRadius:6,fontSize:12,fontFamily:'JetBrains Mono',outline:'none'}}/>
                                      </div>
                                      {vatInfo&&vatInfo.treatment==='inclusive'&&it.unitCost>0&&(
                                        <div style={{fontSize:9,color:'#1D4ED8',marginTop:2,fontFamily:'JetBrains Mono'}}>net: {sym(currency)}{(it.unitCost/(1+vatInfo.rate/100)).toFixed(2)}</div>
                                      )}
                                    </div>
                                  )}
                                </td>
                                <td>
                                  <span className="mono" style={{fontSize:12,fontWeight:700,color:'var(--blue2)'}}>{sym(currency)}{lc.gross.toFixed(2)}</span>
                                  {vatInfo&&vatInfo.treatment==='exclusive'&&lc.vatAmt>0&&(
                                    <div style={{fontSize:9,color:'var(--muted)',fontFamily:'JetBrains Mono',marginTop:1}}>+VAT: {sym(currency)}{lc.vatAmt.toFixed(2)}</div>
                                  )}
                                </td>
                                {vatInfo&&!vatInfo.exempt&&(
                                  <td>
                                    <span style={{
                                      fontSize:9,fontWeight:800,letterSpacing:'.04em',padding:'2px 6px',borderRadius:4,
                                      background:vatInfo.treatment==='inclusive'?'#DBEAFE':vatInfo.code==='VAT0-ZERO'?'#F0F9FF':vatInfo.code==='NONVAT'?'#F0FDF4':'#D1FAE5',
                                      color:vatInfo.treatment==='inclusive'?'#1D4ED8':vatInfo.code==='VAT0-ZERO'?'#0369A1':vatInfo.code==='NONVAT'?'#065F46':'var(--green)',
                                    }}>{vatInfo.code||'VAT'}</span>
                                  </td>
                                )}
                                {vatInfo&&!vatInfo.exempt&&(
                                  <td>
                                    <span className="mono" style={{fontSize:11,fontWeight:700,color:vatInfo.treatment==='inclusive'?'#1D4ED8':'var(--ink3)'}}>
                                      {lc.vatAmt>0?`${sym(currency)}${lc.vatAmt.toFixed(2)}`:'—'}
                                    </span>
                                    {vatInfo.treatment==='inclusive'&&lc.vatAmt>0&&<div style={{fontSize:9,color:'var(--muted)',marginTop:1}}>embedded</div>}
                                    {vatInfo.treatment==='exclusive'&&lc.vatAmt>0&&<div style={{fontSize:9,color:'var(--muted)',marginTop:1}}>added on top</div>}
                                  </td>
                                )}
                                <td><input className="input" style={{width:130,padding:'5px 8px',fontSize:11}} placeholder="Optional note..." value={it.notes} onChange={e=>updItem(idx,'notes',e.target.value)}/></td>
                                <td>{!isCostLocked&&<button className="remove-btn" onClick={()=>delItem(idx)}><Ico d={I.trash} size={12}/></button>}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              </div>
              <div className="card">
                <div className="card-hd">
                  <div className="card-hd-icon" style={{background:'var(--line2)',color:'var(--ink3)'}}><Ico d={I.calc} size={15}/></div>
                  <div><div className="card-hd-title">Cost Adjustments</div><div className="card-hd-sub">Discount, shipping, tax — VAT auto-loaded from supplier record</div></div>
                </div>
                <div className="card-body">
                  <div className="grid3">
                    <div className="fg" style={{marginBottom:0}}>
                      <label className="label">Discount ({sym(currency)})</label>
                      <input type="number" min="0" step="0.01" className="input" placeholder="0.00" value={discount} onChange={e=>setDiscount(e.target.value)}/>
                      {vatInfo?.discountRate>0&&<div style={{fontSize:10,color:'var(--muted)',marginTop:4}}>Supplier default: {vatInfo.discountRate}%</div>}
                    </div>
                    <div className="fg" style={{marginBottom:0}}><label className="label">Shipping Cost ({sym(currency)})</label><input type="number" min="0" step="0.01" className="input" placeholder="0.00" value={shipping} onChange={e=>setShipping(e.target.value)}/></div>
                    <div className="fg" style={{marginBottom:0}}>
                      <label className={vatInfo?'label-locked':'label'}>Tax / VAT (%)</label>
                      {vatInfo?<div className="locked-field"><Ico d={I.lock} size={12} color="var(--muted)"/><span className="mono">{taxRate}%</span><span style={{fontSize:10,color:'var(--muted)',marginLeft:'auto'}}>{vatInfo.exempt?'Exempt':'From supplier'}</span></div>:<input type="number" min="0" step="0.01" className="input" placeholder="12" value={taxRate} onChange={e=>setTaxRate(e.target.value)}/>}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* STEP 3 - DELIVERY */}
          {step===3&&(
            <div style={{maxWidth:720}}>
              <div style={{marginBottom:20}}><div style={{fontSize:18,fontWeight:900,color:'var(--ink)',letterSpacing:'-.3px',marginBottom:4}}>Delivery & Notes</div><div style={{fontSize:12,color:'var(--muted)'}}>Specify where and when goods should be delivered.</div></div>
              <div className="card">
                <div className="card-hd"><div className="card-hd-icon" style={{background:'#EFF6FF',color:'#1D4ED8'}}><Ico d={I.truck} size={15}/></div><div><div className="card-hd-title">Delivery Details</div><div className="card-hd-sub">Shipping address and expected delivery date</div></div></div>
                <div className="card-body">
                  <div className="fg">
                    <label className="label-locked">Delivery Address</label>
                    {delivAddr
                      ? <div className="locked-field" style={{alignItems:'flex-start',minHeight:72,whiteSpace:'pre-wrap',lineHeight:1.5}}>
                          <Ico d={I.lock} size={12} color="var(--muted2)" style={{marginTop:2,flexShrink:0}}/>
                          <span style={{flex:1}}>{delivAddr}</span>
                        </div>
                      : <div className="locked-field" style={{color:'var(--muted2)',fontWeight:500,fontStyle:'italic'}}>
                          <Ico d={I.warn} size={12} color="var(--amber)"/>
                          No company address set — ask your Master Admin to add it in the User Dashboard.
                        </div>
                    }
                    <div style={{fontSize:10,color:'var(--muted)',marginTop:4,display:'flex',alignItems:'center',gap:4}}>
                      <Ico d={I.lock} size={9} color="var(--muted2)"/>
                      Auto-filled from your company profile. Contact your Master Admin to update.
                    </div>
                  </div>
                  <div className="grid2">
                    <div className="fg" style={{marginBottom:0}}><label className="label req">Expected Delivery Date</label><input type="date" className="input" value={delivDate} onChange={e=>setDelivDate(e.target.value)}/></div>
                    <div className="fg" style={{marginBottom:0}}><label className="label">Delivery Instructions</label><input className="input" placeholder="e.g. Deliver to warehouse bay 3..." value={delivNotes} onChange={e=>setDelivNotes(e.target.value)}/></div>
                  </div>
                </div>
              </div>
              <div className="card">
                <div className="card-hd"><div className="card-hd-icon" style={{background:'#FEF3C7',color:'#92400E'}}><Ico d={I.notes} size={15}/></div><div><div className="card-hd-title">Internal Notes</div><div className="card-hd-sub">Private notes for your procurement team — not shown to supplier</div></div></div>
                <div className="card-body"><textarea className="textarea" rows={4} placeholder="Budget code, project reference, approver notes..." value={intNotes} onChange={e=>setIntNotes(e.target.value)}/></div>
              </div>
            </div>
          )}

          {/* STEP 4 - REVIEW */}
          {step===4&&(
            <div style={{maxWidth:760}}>
              <div style={{marginBottom:20}}><div style={{fontSize:18,fontWeight:900,color:'var(--ink)',letterSpacing:'-.3px',marginBottom:4}}>Review & Submit</div><div style={{fontSize:12,color:'var(--muted)'}}>Review all details carefully. Once submitted this PO enters the approval queue.</div></div>
              <div className="card">
                <div className="card-body" style={{padding:20}}>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:16}}>
                    {[
                      {label:'PO Number',val:<span className="mono">{poNumber}</span>},
                      {label:'Supplier',val:supplier?.name},
                      {label:'Currency',val:currency},
                      {label:'Payment',val:payTerms},
                      {label:'Tax Code',val:vatInfo?.codeLabel||`${taxRate}%`},
                      {label:'VAT Treatment',val:vatInfo?.treatment?vatInfo.treatment.charAt(0).toUpperCase()+vatInfo.treatment.slice(1):'—'},
                      {label:'Priority',val:<span style={{textTransform:'capitalize',color:priority==='urgent'?'var(--red)':priority==='high'?'var(--amber)':'var(--ink)'}}>{priority}</span>},
                      {label:'Delivery To',val:delivAddr,span:2},
                      {label:'Delivery By',val:delivDate},
                      {label:'Alert-Driven',val:lockedMode?'Yes — from stock alert':'No'},
                    ].map((f,i)=>(
                      <div key={i} style={f.span?{gridColumn:`span ${f.span}`}:{}}>
                        <div style={{fontSize:10,fontWeight:800,letterSpacing:'.07em',textTransform:'uppercase',color:'var(--muted)',marginBottom:4}}>{f.label}</div>
                        <div style={{fontSize:13,fontWeight:700,color:'var(--ink)'}}>{f.val||<span style={{color:'var(--muted2)'}}>—</span>}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
              <div className="card">
                <div className="card-hd"><div className="card-hd-icon" style={{background:'var(--line2)',color:'var(--ink3)'}}><Ico d={I.doc} size={15}/></div><div><div className="card-hd-title">Line Items ({items.length})</div></div></div>
                <div style={{overflowX:'auto'}}>
                  <table className="tbl">
                    <thead>
                      <tr>
                        <th>#</th><th>Product</th><th>SKU</th><th>Qty</th>
                        <th>Unit Cost{vatInfo&&vatInfo.treatment==='inclusive'&&<span style={{fontSize:9,marginLeft:4,background:'#DBEAFE',color:'#1D4ED8',padding:'1px 5px',borderRadius:3,fontWeight:700}}>incl. VAT</span>}</th>
                        <th>Net Amount</th>
                        <th>VAT Code</th>
                        <th>VAT Amt</th>
                        <th>Line Total</th>
                        <th>Status</th>
                      </tr>
                    </thead>
                    <tbody>
                      {items.map((it,idx)=>{
                        const isCostLocked=it.costLocked||lockedItemIds.includes(it.product.id);
                        const lc=lineCalc(it);
                        return(
                          <tr key={idx}>
                            <td style={{color:'var(--muted)',fontWeight:600}}>{idx+1}</td>
                            <td>
                              <div style={{fontWeight:700,color:'var(--ink)'}}>{it.product.name}</div>
                              {it.notes&&<div style={{fontSize:11,color:'var(--muted)',marginTop:1}}>{it.notes}</div>}
                            </td>
                            <td><span className="mono" style={{fontSize:11,color:'var(--muted)'}}>{it.product.sku||'—'}</span></td>
                            <td className="mono" style={{fontWeight:600}}>{it.qty}</td>
                            <td>
                              <div className="mono" style={{fontWeight:600}}>{sym(currency)}{it.unitCost.toFixed(2)}</div>
                              {vatInfo&&vatInfo.treatment==='inclusive'&&<div style={{fontSize:9,color:'#1D4ED8',marginTop:1,fontFamily:'JetBrains Mono'}}>net: {sym(currency)}{lc.net.toFixed(2)}</div>}
                            </td>
                            {/* Net Amount (ex-VAT) */}
                            <td className="mono" style={{fontWeight:600,color:'var(--ink3)'}}>{sym(currency)}{lc.net.toFixed(2)}</td>
                            {/* VAT Code */}
                            <td>
                              {vatInfo&&!vatInfo.exempt?(
                                <span style={{
                                  fontSize:9,fontWeight:800,letterSpacing:'.04em',padding:'2px 6px',borderRadius:4,
                                  background:vatInfo.treatment==='inclusive'?'#DBEAFE':vatInfo.code==='VAT0-ZERO'?'#F0F9FF':vatInfo.code==='NONVAT'?'#F0FDF4':'#D1FAE5',
                                  color:vatInfo.treatment==='inclusive'?'#1D4ED8':vatInfo.code==='VAT0-ZERO'?'#0369A1':vatInfo.code==='NONVAT'?'#065F46':'var(--green)',
                                }}>{vatInfo.code||'VAT'}</span>
                              ):<span style={{fontSize:10,color:'var(--muted2)'}}>EXEMPT</span>}
                            </td>
                            {/* VAT Amount */}
                            <td className="mono" style={{fontWeight:700,color:vatInfo?.treatment==='inclusive'?'#1D4ED8':'var(--ink3)'}}>
                              {lc.vatAmt>0?`${sym(currency)}${lc.vatAmt.toFixed(2)}`:'—'}
                            </td>
                            {/* Line Total (gross) */}
                            <td className="mono" style={{fontWeight:800,color:'var(--blue2)'}}>{sym(currency)}{lc.gross.toFixed(2)}</td>
                            <td>{isCostLocked?<span style={{fontSize:10,fontWeight:700,color:'#92400E',background:'#FFF7ED',border:'1px solid #FED7AA',padding:'2px 7px',borderRadius:4}}>COST LOCKED</span>:<span style={{fontSize:10,color:'var(--muted2)'}}>—</span>}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
              {intNotes&&<div style={{background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:8,padding:'10px 14px',fontSize:12,color:'#92400E',display:'flex',gap:8,alignItems:'flex-start'}}><Ico d={I.notes} size={13} color="#92400E"/><span><strong>Internal note:</strong> {intNotes}</span></div>}
            </div>
          )}
        </div>

        {/* RIGHT PANEL */}
        <div className="panel-side">
          <div className="side-hd"><Ico d={I.doc} size={14} color="var(--muted)"/> Order Summary</div>
          <div className="side-sec">
            <div className="side-lbl">Supplier</div>
            {supplier?<><div style={{fontWeight:700,fontSize:13,color:'var(--ink)'}}>{supplier.name}</div>{supplier.email&&<div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>{supplier.email}</div>}{vatInfo&&<div style={{fontSize:10,marginTop:4,fontWeight:700,color:vatInfo.exempt?'#6B7280':vatInfo.treatment==='inclusive'?'#1D4ED8':'var(--green)'}}>{vatInfo.codeLabel||`VAT ${vatInfo.rate}%`}</div>}</>:<div style={{fontSize:12,color:'var(--muted2)',fontStyle:'italic'}}>Not selected</div>}
          </div>
          <div className="side-sec" style={{flex:1,overflowY:'auto'}}>
            <div className="side-lbl">Items ({items.length})</div>
            {items.length===0?<div style={{fontSize:11,color:'var(--muted2)',fontStyle:'italic'}}>No items yet</div>:items.map((it,i)=>(
              <div key={i} style={{display:'flex',justifyContent:'space-between',marginBottom:8,paddingBottom:8,borderBottom:i<items.length-1?'1px solid var(--line2)':'none'}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:4}}>
                    {(it.locked||lockedItemIds.includes(it.product.id))&&<Ico d={I.lock} size={9} color="var(--muted2)"/>}
                    <div style={{fontSize:12,fontWeight:600,color:'var(--ink)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{it.product.name}</div>
                  </div>
                  <div style={{fontSize:10,color:'var(--muted)',marginTop:1}}>{it.qty} × {sym(currency)}{it.unitCost.toFixed(2)}</div>
                </div>
                <div className="mono" style={{fontSize:12,fontWeight:700,color:'var(--ink3)',flexShrink:0,marginLeft:8}}>{sym(currency)}{(it.qty*it.unitCost).toFixed(2)}</div>
              </div>
            ))}
          </div>
          <div className="side-total">
            <div className="side-row"><span className="side-row-lbl">Subtotal</span><span className="side-row-val">{sym(currency)}{subtotal.toFixed(2)}</span></div>
            {discAmt>0&&<div className="side-row"><span className="side-row-lbl" style={{color:'var(--green)'}}>Discount</span><span className="side-row-val" style={{color:'var(--green)'}}>−{sym(currency)}{discAmt.toFixed(2)}</span></div>}
            {shipAmt>0&&<div className="side-row"><span className="side-row-lbl">Shipping</span><span className="side-row-val">+{sym(currency)}{shipAmt.toFixed(2)}</span></div>}
            <div className="side-row">
              <span className="side-row-lbl">
                {vatInfo?.exempt?`Tax Exempt (0%)`:vatInfo?.treatment==='inclusive'?`VAT incl. (${taxRate}%)`:vatInfo?.treatment==='exclusive'?`VAT excl. (${taxRate}%)`:taxRate?`VAT (${taxRate}%)`:'VAT'}{vatInfo?' ●':''}
              </span>
              <span className="side-row-val" style={{color:vatInfo?.exempt?'var(--muted)':vatInfo?.treatment==='inclusive'?'var(--ink3)':'inherit'}}>
                {vatInfo?.exempt?'—':vatInfo?.treatment==='inclusive'?`(incl. ${sym(currency)}${taxAmt.toFixed(2)})`:`+${sym(currency)}${taxAmt.toFixed(2)}`}
              </span>
            </div>
            <div className="side-grand"><span className="side-grand-lbl">GRAND TOTAL</span><span className="side-grand-val">{sym(currency)}{grand.toFixed(2)}</span></div>
          </div>
        </div>
      </div>

      {/* ACTION BAR */}
      {/* ── GL Period Blocked Banner ── */}
      {glPeriodChecked&&!activeGlPeriod&&(
        <div style={{margin:'0 24px 0',padding:'12px 16px',background:'#FEF2F2',border:'1.5px solid #FECACA',borderRadius:10,display:'flex',alignItems:'center',gap:12,fontSize:12,color:'#991B1B',fontWeight:600}}>
          <svg width="18" height="18" fill="none" stroke="#DC2626" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r=".5" fill="#DC2626"/></svg>
          <span><strong>GL Period Not Open:</strong> No accounting period is open for today's date. Submitting POs is blocked until the current period is opened in <strong>Accounting Setup → GL Periods</strong>. You may still save as a Draft.</span>
        </div>
      )}

      <div className="action-bar">
        <button className="btn btn-ghost" onClick={()=>step>1?setStep(step-1):window.location.href='Dashboard.html'}>
          <Ico d={I.back} size={12}/>{step>1?'Back':'Cancel'}
        </button>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-ghost" onClick={()=>submitPO(true)} disabled={items.length===0||!supplier||submitting}>
            <Ico d={I.draft} size={12}/>Save as Draft
          </button>
          {step<4
            ?<button className="btn btn-solid" onClick={()=>canProceed()?setStep(step+1):toast('Please complete required fields','warn')} disabled={!canProceed()}>Continue <Ico d="M9 18l6-6-6-6" size={12}/></button>
            :<button className="btn btn-green"
               onClick={()=>{
                 if(!activeGlPeriod){toast('GL Period is not open for today. Please open the current period in Accounting Setup before submitting a PO.','err');return;}
                 submitPO(false);
               }}
               disabled={submitting||(!activeGlPeriod&&glPeriodChecked)}
               title={(!activeGlPeriod&&glPeriodChecked)?'No open GL period for today — open the period in Accounting Setup first':''}>
               {submitting?<><div className="spinner" style={{width:14,height:14,borderWidth:2}}/> Submitting...</>
                :(!activeGlPeriod&&glPeriodChecked)?<>🔒 Submit PO (Period Closed)</>
                :<><Ico d={I.send} size={12}/>Submit PO</>}
             </button>
          }
        </div>
      </div>

      {/* ═══ QTY CONFIRM OVERLAY (single-item +PO from alert) ═══ */}
      {showQtyConfirm&&qtyConfirmItem&&(
        <div style={{position:'fixed',inset:0,background:'rgba(15,23,36,.65)',backdropFilter:'blur(6px)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:600,padding:20}}>
          <div style={{background:'var(--white)',borderRadius:16,width:'100%',maxWidth:460,boxShadow:'0 24px 64px rgba(15,23,36,.3)',overflow:'hidden'}}>
            {/* Header */}
            <div style={{padding:'18px 22px',borderBottom:'1px solid var(--line)',display:'flex',alignItems:'center',gap:10}}>
              <div style={{width:36,height:36,borderRadius:10,background:'var(--blue-l)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <Ico d={I.doc} size={18} color="var(--blue)"/>
              </div>
              <div>
                <div style={{fontSize:15,fontWeight:900,color:'var(--ink)',letterSpacing:'-.2px'}}>Set Order Quantity</div>
                <div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>Confirm how many units to order for this alert item</div>
              </div>
            </div>
            {/* Product info */}
            <div style={{padding:'18px 22px',background:'var(--line2)',borderBottom:'1px solid var(--line)'}}>
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,fontWeight:800,color:'var(--ink)',marginBottom:2}}>{qtyConfirmItem.product.name}</div>
                  <div style={{display:'flex',gap:12,fontSize:11,color:'var(--muted)'}}>
                    <span className="mono">{qtyConfirmItem.product.sku||'No SKU'}</span>
                    <span>In stock: <strong style={{color:qtyConfirmItem.product.stock===0?'var(--red)':'var(--amber)'}}>{qtyConfirmItem.product.stock}</strong></span>
                    <span>MOQ: <strong>{qtyConfirmItem.product.moq||1}</strong></span>
                  </div>
                </div>
                <span className={qtyConfirmItem.product.stock===0?'status-badge stock-out':'status-badge stock-low'}>
                  {qtyConfirmItem.product.stock===0?'Out of Stock':'Low Stock'}
                </span>
              </div>
              <div style={{marginTop:10,display:'flex',gap:16,fontSize:11,color:'var(--muted)'}}>
                <span>Unit cost: <strong style={{color:'var(--ink)',fontFamily:'JetBrains Mono,monospace'}}>{sym(currency)}{qtyConfirmItem.unitCost.toFixed(2)}</strong> <span style={{fontSize:10,color:'var(--muted2)'}}>(locked from inventory)</span></span>
              </div>
            </div>
            {/* Qty selector */}
            <div style={{padding:'22px 22px'}}>
              <label style={{display:'block',fontSize:10,fontWeight:800,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--muted)',marginBottom:12}}>Order Quantity</label>
              <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
                <button
                  onClick={()=>setQtyConfirmItem(p=>({...p,qty:Math.max(1,(p.qty||1)-1)}))}
                  style={{width:40,height:40,borderRadius:10,border:'1.5px solid var(--line)',background:'var(--bg)',cursor:'pointer',fontSize:20,fontWeight:700,color:'var(--ink3)',display:'flex',alignItems:'center',justifyContent:'center',transition:'all .12s'}}
                >−</button>
                <input
                  type="number" min="1"
                  value={qtyConfirmItem.qty||1}
                  onChange={e=>setQtyConfirmItem(p=>({...p,qty:Math.max(1,parseInt(e.target.value)||1)}))}
                  style={{width:90,padding:'10px',border:'1.5px solid var(--blue)',borderRadius:10,fontSize:18,fontWeight:800,textAlign:'center',fontFamily:'JetBrains Mono,monospace',outline:'none',color:'var(--ink)',background:'var(--white)'}}
                />
                <button
                  onClick={()=>setQtyConfirmItem(p=>({...p,qty:(p.qty||1)+1}))}
                  style={{width:40,height:40,borderRadius:10,border:'1.5px solid var(--line)',background:'var(--bg)',cursor:'pointer',fontSize:20,fontWeight:700,color:'var(--ink3)',display:'flex',alignItems:'center',justifyContent:'center',transition:'all .12s'}}
                >+</button>
                <div style={{flex:1}}>
                  <div style={{fontSize:12,fontWeight:700,color:'var(--blue2)',fontFamily:'JetBrains Mono,monospace'}}>
                    {sym(currency)}{((qtyConfirmItem.qty||1)*qtyConfirmItem.unitCost).toFixed(2)}
                  </div>
                  <div style={{fontSize:10,color:'var(--muted)',marginTop:1}}>Estimated line total</div>
                </div>
              </div>
              <div style={{display:'flex',gap:10}}>
                <button
                  className="btn btn-ghost"
                  style={{flex:1}}
                  onClick={()=>{setShowQtyConfirm(false);setQtyConfirmItem(null);}}
                >Cancel</button>
                <button
                  className="btn btn-solid"
                  style={{flex:2}}
                  onClick={()=>{
                    setItems(prev=>prev.map(it=>it.product.id===qtyConfirmItem.product.id?{...it,qty:qtyConfirmItem.qty}:it));
                    setShowQtyConfirm(false);setQtyConfirmItem(null);
                    toast(`Qty set to ${qtyConfirmItem.qty} — continue to delivery details`,'ok');
                  }}
                >
                  <Ico d={I.check} size={13}/> Confirm & Continue
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* TOASTS */}
      <div className="toast-stack">
        {toasts.map(t=>(
          <div key={t.id} className={`toast ${t.type}`}>
            {t.type==='ok'&&<Ico d={I.check} size={13} color="#10b981" sw={2.5}/>}
            {t.type==='err'&&<Ico d={I.x} size={13} color="#ef4444" sw={2.5}/>}
            {t.type==='warn'&&<Ico d={I.warn} size={13} color="#d97706" sw={2}/>}
            {t.msg}
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.render(<CreatePOApp/>, document.getElementById('root'));
</script>
</body>
</html>
